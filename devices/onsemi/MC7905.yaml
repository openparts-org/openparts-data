# MC7905B / MC7905C -5 V, 1.0 A negative regulator, TO-220 CASE
# 221AB pinout. MC7900/D Rev. 21 page 1: "Pin 1. Ground 2. Input
# 3. Output"; the TO-220 heatsink surface is "connected to Pin 2" and is
# not a board pad of a vertical TO-220 (pins 1-3 only). One
# electrical-characteristics table covers both grades ("MC7905B,
# MC7905C"; Tlow = -40 C for B, 0 C for C).
schema_version: "0.2"
kind: device
id: onsemi/MC7905
manufacturer: onsemi
category: linear_regulator
family: MC7900
source: onsemi/MC7900-D

parameters:
  output_type: { value: fixed, src: p1 "Description" }
  output_voltage:
    - min: -5.2 V
      typ: -5 V
      max: -4.8 V
      at: { TJ: 25 °C }
      src: p2 "Elec. Char. MC7905B, MC7905C, Output Voltage (TJ = +25°C)"
    - min: -5.25 V
      max: -4.75 V
      at: { VIN: -20..-7 V, IOUT: 5..1000 mA }
      src: p2 "Elec. Char. MC7905B, MC7905C, Output Voltage, 5.0 mA <= IO <= 1.0 A, P <= 15 W"
  dropout_voltage:
    typ: 1.3 V
    at: { IOUT: 1 A, TJ: 25 °C }
    src: p2 "Elec. Char. MC7905B, MC7905C, Dropout Voltage (IO = 1.0 A, TJ = +25°C)"

pins:
  src: p1 "Pinout box "Pin 1. Ground 2. Input 3. Output"; heatsink surface connected to Pin 2"
  "1": { name: Ground, type: ground }
  "2": { name: Input, type: power }
  "3": { name: Output, type: power }
