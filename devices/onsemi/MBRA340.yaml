# MBRA340T3G 3 A 40 V Schottky power rectifier, SMA (CASE 403D). Pins
# from the page-1 symbol ("1 Cathode", "2 Anode") and the outline's
# STYLE
# 1 list (page 5).
schema_version: "0.2"
kind: device
id: onsemi/MBRA340
manufacturer: onsemi
category: diode
family: MBRA340
source: onsemi/MBRA340T3-D

parameters:
  forward_voltage:
    max: 0.45 V
    at: { IF: 3 A, TJ: 25 °C }
    src: 'p2 "ELECTRICAL CHARACTERISTICS, Maximum Instantaneous Forward Voltage VF: 0.450 V"'
  reverse_voltage:
    max: 40 V
    src: 'p2 "MAXIMUM RATINGS, Peak Repetitive Reverse Voltage VRRM: 40 V"'
  forward_current:
    max: 3 A
    at: { TL: 100 °C }
    src: 'p2 "MAXIMUM RATINGS, Average Rectified Forward Current IO (At Rated VR): 3.0 A"'

pins:
  src:
    - 'p1 "Symbol: "1 Cathode" / "2 Anode"; "Polarity: Cathode Lead Indicated by Polarity Band""'
    - 'p5 "CASE 403D STYLE 1: "PIN 1. CATHODE (POLARITY BAND) 2. ANODE""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
