# MBRA140T3G 1 A 40 V Schottky power rectifier, SMA (CASE 403D). Pins
# from the outline's STYLE 1 list (page 5) and page 1 "Polarity: Cathode
# Lead Indicated by Either Notch in Plastic Body or Polarity Band".
schema_version: "0.2"
kind: device
id: onsemi/MBRA140
manufacturer: onsemi
category: diode
family: MBRA140
source: onsemi/MBRA140T3-D

parameters:
  forward_voltage:
    max: 0.55 V
    at: { IF: 1 A, TJ: 25 °C }
    src: 'p2 "ELECTRICAL CHARACTERISTICS, Maximum Instantaneous Forward Voltage VF: 0.55 V"'
  reverse_voltage:
    max: 40 V
    src: 'p2 "MAXIMUM RATINGS, Peak Repetitive Reverse Voltage VRRM: 40 V"'
  forward_current:
    max: 1 A
    at: { TC: 95 °C }
    src: 'p2 "MAXIMUM RATINGS, Average Rectified Forward Current IO (At Rated VR): 1.0 A"'

pins:
  src:
    - 'p5 "CASE 403D STYLE 1: "PIN 1. CATHODE (POLARITY BAND) 2. ANODE""'
    - 'p1 "Mechanical Characteristics: "Polarity: Cathode Lead Indicated by Either Notch in Plastic Body or Polarity Band""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
