# BAS16XV2T1G switching diode, SOD-523 (CASE 502). Pins from the page-1
# symbol ("1 CATHODE", "2 ANODE") and CASE 502 STYLE 1 (page 4).
schema_version: "0.2"
kind: device
id: onsemi/BAS16XV2
manufacturer: onsemi
category: diode
family: BAS16XV2
source: onsemi/BAS16XV2T1-D

parameters:
  forward_voltage:
    - max: 1250 mV
      at: { IF: 150 mA }
      src: p2 "ELECTRICAL CHARACTERISTICS, Forward Voltage VF"
    - { max: 715 mV, at: { IF: 1 mA }, src: 'p2 "ELECTRICAL CHARACTERISTICS, Forward Voltage VF"' }
    - { max: 855 mV, at: { IF: 10 mA }, src: 'p2 "ELECTRICAL CHARACTERISTICS, Forward Voltage VF"' }
    - max: 1000 mV
      at: { IF: 50 mA }
      src: p2 "ELECTRICAL CHARACTERISTICS, Forward Voltage VF"
  reverse_voltage: { max: 100 V, src: 'p1 "MAXIMUM RATINGS, Continuous Reverse Voltage VR"' }
  forward_current: { max: 200 mA, src: 'p1 "MAXIMUM RATINGS, Continuous Forward Current IF"' }

pins:
  src:
    - 'p1 "Symbol: "1 CATHODE" / "2 ANODE""'
    - 'p4 "CASE 502 STYLE 1: "PIN 1. CATHODE (POLARITY BAND) 2. ANODE""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
