# MBR120ESFT1G 1 A 20 V Schottky power rectifier, SOD-123FL (CASE 498).
# Page 1 "Polarity Designator: Cathode Band"; the CASE 498 top view
# numbers the terminals 1 and 2 but gives no STYLE list naming them.
# No pin numbers are printed for this part, so 1 = Cathode and 2 = Anode
# follow the dataset's two-terminal diode convention (pin 1 at the
# banded end).
schema_version: "0.1"
kind: device
id: onsemi/MBR120ESF

manufacturer: onsemi
category: diode
family: MBR120ESF

pins:
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }

parameters:
  reverse_voltage:
    max: 20
    unit: V
  forward_current:
    max: 1.0
    unit: A
  forward_voltage:
    max: 0.53
    unit: V

provenance:
  "/parameters/reverse_voltage":
    - source: onsemi/MBR120ESFT1-D
      page: 2
      locator: "MAXIMUM RATINGS, Peak Repetitive Reverse Voltage VRRM: 20 V"
  "/parameters/forward_current":
    - source: onsemi/MBR120ESFT1-D
      page: 2
      locator: "MAXIMUM RATINGS, Average Rectified Forward Current IO (At Rated VR, TL = 140°C): 1.0 A"
  "/parameters/forward_voltage":
    - source: onsemi/MBR120ESFT1-D
      page: 2
      locator: "ELECTRICAL CHARACTERISTICS, Maximum Instantaneous Forward Voltage VF (IF = 1.0 A), TJ = 25°C: 0.530 V"
  "/pins":
    - source: onsemi/MBR120ESFT1-D
      page: 1
      locator: "Mechanical Characteristics: \"Polarity Designator: Cathode Band\""
