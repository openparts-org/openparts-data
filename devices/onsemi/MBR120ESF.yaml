# MBR120ESFT1G 1 A 20 V Schottky power rectifier, SOD-123FL (CASE 498).
# Page 1 "Polarity Designator: Cathode Band"; the CASE 498 top view
# numbers the terminals 1 and 2 but gives no STYLE list naming them.
# No pin numbers are printed for this part, so 1 = Cathode and 2 = Anode
# follow the dataset's two-terminal diode convention (pin 1 at the
# banded end).
schema_version: "0.2"
kind: device
id: onsemi/MBR120ESF
manufacturer: onsemi
category: diode
family: MBR120ESF
source: onsemi/MBR120ESFT1-D

parameters:
  forward_voltage:
    max: 0.53 V
    at: { IF: 1 A, TJ: 25 °C }
    src: 'p2 "ELECTRICAL CHARACTERISTICS, Maximum Instantaneous Forward Voltage VF: 0.530 V"'
  reverse_voltage:
    max: 20 V
    src: 'p2 "MAXIMUM RATINGS, Peak Repetitive Reverse Voltage VRRM: 20 V"'
  forward_current:
    max: 1 A
    at: { TL: 140 °C }
    src: 'p2 "MAXIMUM RATINGS, Average Rectified Forward Current IO (At Rated VR): 1.0 A"'

pins:
  src: 'p1 "Mechanical Characteristics: "Polarity Designator: Cathode Band""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
