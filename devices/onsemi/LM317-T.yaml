# onsemi LM317 1.5 A adjustable positive regulator, TO-220 CASE 221AB
# ("T SUFFIX") pinout. LM317/D Rev. 18 page 1: "Pin 1. Adjust 2. Vout
# 3. Vin", "Heatsink surface connected to Pin 2"; the tab is not a
# board pad of a vertical TO-220 (pins 1-3 only). Covers LM317T (TJ 0 to
# +125 C) and LM317BT (TJ -40 to +125 C), one table. Adjust typed input
# (as ti/LM317-KCS).
schema_version: "0.2"
kind: device
id: onsemi/LM317-T
manufacturer: onsemi
category: linear_regulator
family: LM317
source: onsemi/LM317-D

parameters:
  output_type: { value: adjustable, src: 'p1 "Features, Output Adjustable between 1.2 V and 37 V"' }
  output_voltage:
    min: 1.2 V
    max: 37 V
    src: p1 "Features, Output Adjustable between 1.2 V and 37 V"
  output_current: { max: 1.5 A, src: 'p2 "Elec. Char. Note 2, Imax = 1.5 A"' }

pins:
  src: p1 "TO-220 T SUFFIX CASE 221AB, "Pin 1. Adjust 2. Vout 3. Vin""
  "1": { name: Adjust, type: input }
  "2": { name: Vout, type: power }
  "3": { name: Vin, type: power }
