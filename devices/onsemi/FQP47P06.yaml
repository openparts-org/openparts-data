# -60 V P-channel QFET MOSFET FQP47P06, TO-220-3LD CASE 340AT. The datasheet (FQP47P06-D) prints the
# lead functions only as "G D S" labels on the page-1 3-D package image
# (no numbers) and the outline 98AON13818G has no STYLE list; its front
# view numbers the leads 1 2 3 left to right. Reading the image as the
# front view: 1 = Gate, 2 = Drain, 3 = Source -- position-derived,
# flagged for review. The tab (drain on a TO-220) is not a footprint pad
# of a vertical TO-220 and is not listed.
