# NPN general-purpose SOT-23 transistor (onsemi/BC846ALT1-D). Pin numbers printed on the
# page-1 device diagram (COLLECTOR 3, BASE 1, EMITTER 2) and the
# package is "CASE 318 STYLE 6" (page 16: PIN 1. BASE 2. EMITTER
# 3. COLLECTOR) -- they agree.
# One device for the datasheet's "BC846ALT1G Series" (BC846, BC847,
# BC848, BC849, BC850 and their A/B/C gain groups): the voltage and
# hFE grades differ, the SOT-23 pinout is the same for all of them.
schema_version: "0.2"
kind: device
id: onsemi/BC846-SERIES
manufacturer: onsemi
category: transistor
family: BC846
source: onsemi/BC846ALT1-D

pins:
  src:
    - 'p1 "Device diagram: COLLECTOR 3, BASE 1, EMITTER 2; "SOT-23 CASE 318 STYLE 6""'
    - 'p16 "CASE 318 STYLE 6: "PIN 1. BASE 2. EMITTER 3. COLLECTOR""'
  "1": { name: Base, type: passive }
  "2": { name: Emitter, type: passive }
  "3": { name: Collector, type: passive }
