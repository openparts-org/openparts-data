# MBRA210LT3G 2 A 10 V Schottky power rectifier, SMA (CASE 403D). Pins
# from the outline's STYLE 1 list (page 5) and page 1 "Polarity:
# Polarity
# Band Indicates Cathode Lead".
schema_version: "0.2"
kind: device
id: onsemi/MBRA210L
manufacturer: onsemi
category: diode
family: MBRA210L
source: onsemi/MBRA210LT3-D

parameters:
  forward_voltage:
    max: 0.35 V
    at: { IF: 2 A, TJ: 25 °C }
    src: 'p2 "ELECTRICAL CHARACTERISTICS, Maximum Instantaneous Forward Voltage VF: 0.350 V"'
  reverse_voltage:
    max: 10 V
    src: 'p2 "MAXIMUM RATINGS, Peak Repetitive Reverse Voltage VRRM: 10 V"'
  forward_current:
    max: 2 A
    at: { TL: 110 °C }
    src: 'p2 "MAXIMUM RATINGS, Average Rectified Forward Current IO (At Rated VR): 2.0 A"'

pins:
  src:
    - 'p5 "CASE 403D STYLE 1: "PIN 1. CATHODE (POLARITY BAND) 2. ANODE""'
    - 'p1 "Mechanical Characteristics: "Polarity: Polarity Band Indicates Cathode Lead""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
