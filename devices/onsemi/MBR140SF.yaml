# MBR140SFT1G 1 A 40 V Schottky power rectifier, SOD-123FL (CASE 498).
# Page 1 "Polarity Designator: Cathode Band"; no STYLE list on CASE 498.
# No pin numbers are printed for this part, so 1 = Cathode and 2 = Anode
# follow the dataset's two-terminal diode convention (pin 1 at the
# banded end).
schema_version: "0.2"
kind: device
id: onsemi/MBR140SF
manufacturer: onsemi
category: diode
family: MBR140SF
source: onsemi/MBR140SFT1-D

parameters:
  forward_voltage:
    max: 0.55 V
    at: { IF: 1 A, TJ: 25 °C }
    src: 'p2 "ELECTRICAL CHARACTERISTICS, Maximum Instantaneous Forward Voltage VF: 0.55 V"'
  reverse_voltage:
    max: 40 V
    src: 'p2 "MAXIMUM RATINGS, Peak Repetitive Reverse Voltage VRRM: 40 V"'
  forward_current:
    max: 1 A
    at: { TL: 112 °C }
    src: 'p2 "MAXIMUM RATINGS, Average Rectified Forward Current (At Rated VR) IO: 1.0 A"'

pins:
  src: 'p1 "Mechanical Characteristics: "Polarity Designator: Cathode Band""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
