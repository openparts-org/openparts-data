# 0.5A, 20V Schottky barrier rectifier, SOD-123. Polarity: "Cathode Band"
# on page 1, and the case drawing's STYLE 1 pin table on page 4 gives
# PIN 1 = CATHODE, PIN 2 = ANODE.
schema_version: "0.2"
kind: device
id: onsemi/MBR0520
manufacturer: onsemi
category: diode
family: MBR0520
source: onsemi/MBR0520-D

parameters:
  forward_voltage:
    max: 0.385 V
    at: { TJ: 25 °C }
    src: 'p2 "ELECTRICAL CHARACTERISTICS, Maximum Instantaneous Forward Voltage vF (iF = 0.5 Amps): 0.385 V"'
  reverse_voltage:
    max: 20 V
    src: 'p2 "MAXIMUM RATINGS, Peak Repetitive Reverse Voltage VRRM: 20 V"'
  forward_current:
    max: 0.5 A
    at: { TL: 90 °C }
    src: 'p2 "MAXIMUM RATINGS, Average Rectified Forward Current IF(AV) (Rated VR): 0.5 A"'

pins:
  src: 'p4 "Case 98ASB42927B STYLE 1: PIN 1 CATHODE, PIN 2 ANODE"'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
