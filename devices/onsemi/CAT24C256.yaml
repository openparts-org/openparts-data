# CAT24C256 256-Kb I2C serial EEPROM, 8-pin SOIC (W, X) / TSSOP (Y)
# pinout. The datasheet's "PIN FUNCTION" table (page 1) gives names and
# functions but no numbers; numbers are read from the "PIN
# CONFIGURATION" figure "SOIC (W, X), TSSOP (Y), UDFN (HU4)" (page 1,
# rendered): A0, A1, A2, VSS down the left side from the pin-1 mark
# ("1"), SDA, SCL, WP, VCC up the right side (VCC opposite pin 1), i.e.
# 1 A0 ... 4 VSS, 5 SDA, 6 SCL, 7 WP, 8 VCC (counter-clockwise, as the
# figure is drawn). A0-A2 "Device Address" -> input, SDA "Serial Data"
# -> io, SCL -> input, WP "Write Protect" -> input, VSS -> ground, VCC
# -> power. The UDFN exposed pad is not covered.
schema_version: "0.1"
kind: device
id: onsemi/CAT24C256

manufacturer: onsemi
category: other
family: CAT24C256

pins:
  "1": { name: A0, type: input }
  "2": { name: A1, type: input }
  "3": { name: A2, type: input }
  "4": { name: VSS, type: ground }
  "5": { name: SDA, type: io }
  "6": { name: SCL, type: input }
  "7": { name: WP, type: input }
  "8": { name: VCC, type: power }

provenance:
  "/pins":
    - source: onsemi/CAT24C256-D
      page: 1
      locator: "\"PIN CONFIGURATION\" figure \"SOIC (W, X), TSSOP (Y), UDFN (HU4)\" (pin positions)"
    - source: onsemi/CAT24C256-D
      page: 1
      locator: "\"PIN FUNCTION\" table (names and functions)"
