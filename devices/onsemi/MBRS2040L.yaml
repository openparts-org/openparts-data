# MBRS2040LT3G 2 A 40 V Schottky power rectifier, SMB (CASE 403A). Page
# 1
# says "Cathode Polarity Band"; the CASE 403A outline has no STYLE list.
# No pin numbers are printed for this part, so 1 = Cathode and 2 = Anode
# follow the dataset's two-terminal diode convention (pin 1 at the
# banded end).
schema_version: "0.2"
kind: device
id: onsemi/MBRS2040L
manufacturer: onsemi
category: diode
family: MBRS2040L
source: onsemi/MBRS2040LT3-D

parameters:
  forward_voltage:
    - max: 0.43 V
      at: { IF: 2 A, TJ: 25 °C }
      src: p2 "ELECTRICAL CHARACTERISTICS, Max. Instantaneous Forward Voltage VF"
    - max: 0.5 V
      at: { IF: 4 A, TJ: 25 °C }
      src: p2 "ELECTRICAL CHARACTERISTICS, Max. Instantaneous Forward Voltage VF"
    - max: 0.34 V
      at: { IF: 2 A, TJ: 125 °C }
      src: p2 "ELECTRICAL CHARACTERISTICS, Max. Instantaneous Forward Voltage VF"
    - max: 0.45 V
      at: { IF: 4 A, TJ: 125 °C }
      src: p2 "ELECTRICAL CHARACTERISTICS, Max. Instantaneous Forward Voltage VF"
  reverse_voltage: { max: 40 V, src: 'p2 "MAXIMUM RATINGS, Peak Repetitive Reverse Voltage VRRM"' }
  forward_current:
    max: 2 A
    at: { TC: 103 °C }
    src: p2 "MAXIMUM RATINGS, Avg. Rectified Forward Current IO (At Rated VR)"

pins:
  src: p1 ""Cathode Polarity Band""
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
