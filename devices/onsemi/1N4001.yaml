# 1A, 50V general-purpose rectifier, DO-41. Polarity from the datasheet's
# case drawing ("STYLE 1: PIN 1. CATHODE (POLARITY BAND) / 2. ANODE")
# and "Cathode Indicated by Polarity Band" note (page 1).
schema_version: "0.2"
kind: device
id: onsemi/1N4001
manufacturer: onsemi
category: diode
family: 1N4001
source: onsemi/1N4001-D

parameters:
  forward_voltage:
    typ: 0.93 V
    max: 1.1 V
    at: { IF: 1 A, TJ: 25 °C }
    src: p2 "ELECTRICAL CHARACTERISTICS, Max. Instantaneous Forward Voltage Drop vF"
  reverse_voltage:
    max: 50 V
    src: p2 "MAXIMUM RATINGS, Peak Repetitive Reverse Voltage VRRM, 1N4001 column"
  forward_current: { max: 1 A, src: 'p2 "MAXIMUM RATINGS, Avg. Rectified Forward Current IO"' }

pins:
  src: p6 "Case drawing 98ASB42045B, STYLE 1 pin table, "PIN 1. CATHODE (POLARITY BAND) / 2. ANODE""
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
