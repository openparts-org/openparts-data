      page: 2
      locator: "MAXIMUM RATINGS, Average Rectified Forward Current IF(AV), TL = 115 °C: 1.0 A"
  "/parameters/forward_voltage":
    - source: onsemi/MBRS140T3-D
      page: 2
      locator: "ELECTRICAL CHARACTERISTICS, Maximum Instantaneous Forward Voltage VF (iF = 1.0 A, TJ = 25 °C): 0.6 V"
  "/pins":
