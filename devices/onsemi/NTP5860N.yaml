# 60 V N-channel power MOSFET NTP5860N (TO-220), TO-220 CASE 221A. Pin numbers and names from NTB5860N-D
# page 2, cross-checked against the CASE 221A STYLE list in
# 98ASB42148B. Terminal 4 (the tab, Drain, tied to pin 2) is not a
# footprint pad of a vertical TO-220 and is not listed.
schema_version: "0.2"
kind: device
id: onsemi/NTP5860N
manufacturer: onsemi
category: transistor
family: NTP5860N
source: onsemi/98ASB42148B

pins:
  src:
    - 'onsemi/NTB5860N-D p2 "MARKING DIAGRAMS & PIN ASSIGNMENTS, TO-220AB: "1 Gate", "2 Drain", "3 Source", "4 Drain"; "TO-220AB CASE 221A STYLE 5""'
    - 'p1 "CASE 221A STYLE 5: "PIN 1. GATE 2. DRAIN 3. SOURCE 4. DRAIN""'
  "1": { name: Gate, type: passive }
  "2": { name: Drain, type: passive }
  "3": { name: Source, type: passive }
