# Dual NPN general-purpose transistor in SC-88 (BC847BDW1). Pin functions
# from the CASE 419B "STYLE 1" list (p13; page 1 names STYLE 1 for this
# device): 1 Emitter 2, 2 Base 2, 3 Collector 1, 4 Emitter 1, 5 Base 1,
# 6 Collector 2.
schema_version: "0.2"
kind: device
id: onsemi/BC847BDW1
manufacturer: onsemi
category: transistor
family: BC847BDW1
source: onsemi/BC846BDW1T1-D

parameters:
  collector_emitter_voltage: { max: 45 V, src: 'p1 "MAXIMUM RATINGS, VCEO, BC847: 45 V"' }
  collector_current:         { max: 100 mA, src: 'p1 "MAXIMUM RATINGS, IC continuous: 100 mAdc"' }

pins:
  src: 'p13 "CASE 419B STYLE 1: 1 EMITTER 2, 2 BASE 2, 3 COLLECTOR 1, 4 EMITTER 1, 5 BASE 1, 6 COLLECTOR 2"'
  "1": { name: E2, type: passive }
  "2": { name: B2, type: passive }
  "3": { name: C1, type: passive }
  "4": { name: E1, type: passive }
  "5": { name: B1, type: passive }
  "6": { name: C2, type: passive }
