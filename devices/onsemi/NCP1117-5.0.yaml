# NCP1117 1.0 A LDO, fixed 5.0 V option (NCP1117ST50T3G SOT-223,
# NCP1117DT50RKG DPAK). NCP1117/D Rev. 31 page 1 PIN CONFIGURATION
# gives one pin list for both packages: "Pin: 1. Adjust/Ground
# 2. Output 3. Input", and "Heatsink tab is connected to Pin 2." Both
# case outlines (318H page 17, 369C page 18) number the tab "4", so pin
# "4" = Output (the tab), typed power like pin 2 (a regulator's tab
# repeating VOUT). In the DPAK, lead 2 is trimmed at the body (no pad);
# its Output connection reaches the board through the tab.
schema_version: "0.2"
kind: device
id: onsemi/NCP1117-5.0
manufacturer: onsemi
category: linear_regulator
family: NCP1117
source: onsemi/NCP1117-D

parameters:
  output_type:
    value: fixed
    src: 'p1 "Description: "This series contains nine fixed output voltages of 1.5 V, 1.8 V, 1.9 V, 2.0 V, 2.5 V, 2.85 V, 3.3 V, 5.0 V, and 12 V""'
  dropout_voltage:
    typ: 1.07 V
    max: 1.2 V
    at: { IOUT: 800 mA }
    src: 'p3 "ELECTRICAL CHARACTERISTICS, Dropout Voltage (Measured at Vout - 100 mV): Typ 1.07 V, Max 1.20 V"'

pins:
  src:
    - 'p1 "PIN CONFIGURATION (SOT-223 and DPAK Top View): "Pin: 1. Adjust/Ground 2. Output 3. Input"; "Heatsink tab is connected to Pin 2.""'
    - 'p17 "CASE 318H TOP VIEW: tab numbered "4" (also CASE 369C, page 18)"'
  "1": { name: Adjust/Ground, type: ground }
  "2": { name: Output, type: power }
  "3": { name: Input, type: power }
  "4": { name: Output, type: power }
