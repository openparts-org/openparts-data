# NSR0320MW2T1G 1 A 20 V Schottky barrier diode, SOD-323 (CASE 477).
# Pins
# from the page-1 symbol ("1 CATHODE", "2 ANODE") and CASE 477 STYLE 1
# (page 3).
schema_version: "0.2"
kind: device
id: onsemi/NSR0320MW2
manufacturer: onsemi
category: diode
family: NSR0320MW2
source: onsemi/NSR0320MW2T1-D

parameters:
  forward_voltage:
    typ: 0.45 V
    max: 0.5 V
    at: { IF: 900 mA }
    src: 'p2 "ELECTRICAL CHARACTERISTICS, Forward Voltage VF: Typ 0.45 V, Max 0.50 V (highest listed test current)"'
  reverse_voltage: { max: 20 V, src: 'p1 "MAXIMUM RATINGS, Reverse Voltage VR: 20 Vdc"' }
  forward_current:
    max: 1 A
    src: 'p1 "MAXIMUM RATINGS, Forward Current (DC) IF, Continuous: 1 A"'

pins:
  src:
    - 'p1 "Symbol: "1 CATHODE" / "2 ANODE""'
    - 'p3 "CASE 477 STYLE 1: "PIN 1. CATHODE (POLARITY BAND) 2. ANODE""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
