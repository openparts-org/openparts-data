# SS13FL 1 A 30 V Schottky barrier rectifier, SOD-123FL (CASE 425AD).
# Pins from the page-1 symbol (1 = Cathode, 2 = Anode) and "Band
# Indicates Cathode" -- the same symbol the existing onsemi/SS14FL
# device
# cites.
schema_version: "0.2"
kind: device
id: onsemi/SS13FL
manufacturer: onsemi
category: diode
family: SS13FL
source: onsemi/SS14FL-D

parameters:
  forward_voltage:
    max: 0.55 V
    at: { IF: 1 A }
    src: 'p2 "ELECTRICAL CHARACTERISTICS, VF Forward Voltage: Max 0.55 V"'
  reverse_voltage:
    max: 30 V
    src: 'p1 "ABSOLUTE MAXIMUM RATINGS, VRRM Peak Reverse Voltage, SS13FL column: 30 V"'
  forward_current:
    max: 1 A
    at: { TA: 75 °C }
    src: 'p1 "ABSOLUTE MAXIMUM RATINGS, IF(AV) Average Rectified Current: 1.0 A"'

pins:
  src: p1 "Symbol "1 Cathode" / "2 Anode"; marking diagram "Band Indicates Cathode""
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
