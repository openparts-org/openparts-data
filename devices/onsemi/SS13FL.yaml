# SS13FL 1 A 30 V Schottky barrier rectifier, SOD-123FL (CASE 425AD).
# Pins from the page-1 symbol (1 = Cathode, 2 = Anode) and "Band
# Indicates Cathode" -- the same symbol the existing onsemi/SS14FL
# device
# cites.
schema_version: "0.1"
kind: device
id: onsemi/SS13FL

manufacturer: onsemi
category: diode
family: SS13FL

pins:
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }

parameters:
  reverse_voltage:
    max: 30
    unit: V
  forward_current:
    max: 1.0
    unit: A
  forward_voltage:
    max: 0.55
    unit: V

provenance:
  "/parameters/reverse_voltage":
    - source: onsemi/SS14FL-D
      page: 1
      locator: "ABSOLUTE MAXIMUM RATINGS, VRRM Peak Reverse Voltage, SS13FL column: 30 V"
  "/parameters/forward_current":
    - source: onsemi/SS14FL-D
      page: 1
      locator: "ABSOLUTE MAXIMUM RATINGS, IF(AV) Average Rectified Current at TA = 75°C: 1.0 A"
  "/parameters/forward_voltage":
    - source: onsemi/SS14FL-D
      page: 2
      locator: "ELECTRICAL CHARACTERISTICS, VF Forward Voltage, IF = 1.0 A: Max 0.55 V"
  "/pins":
    - source: onsemi/SS14FL-D
      page: 1
      locator: "Symbol \"1 Cathode\" / \"2 Anode\"; marking diagram \"Band Indicates Cathode\""
