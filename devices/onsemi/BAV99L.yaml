# Dual series switching diode, SOT-23 (CASE 318 STYLE 11). Pins from the page-1
# symbol (1 ANODE, 2 CATHODE, 3 CATHODE/ANODE) and STYLE 11. Values are per
# diode ("Each Diode") and shared by every MPN.
schema_version: "0.2"
kind: device
id: onsemi/BAV99L
manufacturer: onsemi
category: diode
family: BAV99
source: onsemi/BAV99LT1-D

parameters:
  forward_voltage:
    - { max: 715 mV, at: { IF: 1 mA }, src: 'p2 "OFF CHARACTERISTICS (Each Diode), VF"' }
    - { max: 855 mV, at: { IF: 10 mA }, src: 'p2 "OFF CHARACTERISTICS (Each Diode), VF"' }
    - { max: 1000 mV, at: { IF: 50 mA }, src: 'p2 "OFF CHARACTERISTICS (Each Diode), VF"' }
    - { max: 1250 mV, at: { IF: 150 mA }, src: 'p2 "OFF CHARACTERISTICS (Each Diode), VF"' }
  reverse_voltage: { max: 100 V, src: 'p1 "MAXIMUM RATINGS (Each Diode), VR"' }
  forward_current: { max: 215 mA, src: 'p1 "MAXIMUM RATINGS (Each Diode), IF"' }

pins:
  src: 'p1 "Symbol: 1 ANODE, 2 CATHODE, 3 CATHODE/ANODE; CASE 318 STYLE 11"'
  "1": { name: Anode1, type: passive }
  "2": { name: Cathode2, type: passive }
  "3": { name: Cathode1/Anode2, type: passive }
