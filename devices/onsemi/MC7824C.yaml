# MC7824C 24 V, 1.0 A positive regulator (TJ 0 to +125 C grade),
# TO-220 CASE 221AB pinout. MC7800/D Rev. 29 page 1 gives one pin list
# for TO-220, D2PAK-3 and DPAK-3: "Pin 1. Input 2. Ground 3. Output";
# the TO-220 heatsink surface is "connected to Pin 2" and is not a
# board pad of a vertical TO-220, so only pins 1-3 are listed (the
# DPAK device onsemi/MC7805B carries a pin 4).
schema_version: "0.2"
kind: device
id: onsemi/MC7824C
manufacturer: onsemi
category: linear_regulator
family: MC7800
source: onsemi/MC7800-D

parameters:
  output_type: { value: fixed, src: p1 "Description" }
  output_voltage:
    - min: 23 V
      typ: 24 V
      max: 25 V
      at: { TJ: 25 °C }
      src: p15 "Elec. Char. (Vin = 33 V, IO = 500 mA), MC7824C column, Output Voltage (TJ = 25°C)"
    - min: 22.8 V
      typ: 24 V
      max: 25.2 V
      at: { VIN: 27..38 V, IOUT: 5..1000 mA }
      src: p15 "Elec. Char., MC7824C column, Output Voltage (5.0 mA <= IO <= 1.0 A, PD <= 15 W)"
  dropout_voltage:
    typ: 2 V
    at: { IOUT: 1 A, TJ: 25 °C }
    src: p15 "Elec. Char., MC7824C column, Dropout Voltage (IO = 1.0 A, TJ = 25°C)"

pins:
  src: p1 "Pinout box "Pin 1. Input 2. Ground 3. Output"; TO-220 heatsink surface connected to Pin 2"
  "1": { name: Input, type: power }
  "2": { name: Ground, type: ground }
  "3": { name: Output, type: power }
