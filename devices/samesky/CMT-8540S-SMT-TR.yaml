# Same Sky CMT-8540S-SMT-TR magnetic buzzer transducer (datasheet samesky/CMT-8540S-SMT-TR-DS).
# Pins from the page-2 recommended PCB layout: 1 = +, 2 = -; typed passive; the two unlabelled mechanical pads are pin MP (nc).
schema_version: "0.2"
kind: device
id: samesky/CMT-8540S-SMT-TR
manufacturer: samesky
category: buzzer
family: CMT-8540S
source: samesky/CMT-8540S-SMT-TR-DS

parameters:
  rated_voltage: { typ: 5 V, src: 'p1 "Specifications, rated voltage 5.0 Vo-p"' }
  rated_current:
    max: 150 mA
    at: { f: 4 kHz }
    src: p1 "Specifications, current consumption at rated voltage, 4,000 Hz, max 150 mA"
  frequency:     { typ: 4 kHz, src: 'p1 "Specifications, rated frequency 4,000 Hz"' }
  supply_voltage:
    min: 1 V
    max: 6 V
    src: p1 "Specifications, operating voltage 1.0 / 6.0 Vo-p"
  operating_temperature:
    min: -20 °C
    max: 70 °C
    src: p1 "Specifications, operating temperature"
  sound_pressure:
    min: 100 dBA
    at: { VIN: 5 V, f: 4 kHz, d: 10 cm }
    src: p1 "Specifications, sound pressure level at 10 cm (A-weight), rated voltage, min 100 dBA"
  buzzer_type:
    value: magnetic
    src: 'p1 "MODEL: CMT-8540S-SMT-TR | DESCRIPTION: MAGNETIC BUZZER TRANSDUCER"'
  buzzer_drive:  { value: external, src: 'p1 "Features, externally driven"' }
  coil_resistance:
    min: 10 Ω
    typ: 13 Ω
    max: 16 Ω
    src: p1 "Specifications, coil resistance 10 / 13 / 16 Ω"

pins:
  src: p2 "Recommended PCB Layout Top View, +POLARITY / -POLARITY"
  "1": { name: +, type: passive }
  "2": { name: -, type: passive }
  MP:  { name: MP, type: nc }
