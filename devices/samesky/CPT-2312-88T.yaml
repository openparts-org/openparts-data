# Same Sky CPT-2312-88T piezo buzzer transducer (datasheet samesky/CPT-2312-88T-DS).
# Pins from the page-2 recommended PCB layout: 1 = 1, 2 = 2; typed passive.
schema_version: "0.2"
kind: device
id: samesky/CPT-2312-88T
manufacturer: samesky
category: buzzer
family: CPT-2312
