    value: piezo
    src: 'p1 "MODEL: CPT-2312-88T | DESCRIPTION: PIEZO BUZZER TRANSDUCER"'
  buzzer_drive:  { value: external, src: 'p1 "Features, piezo, externally driven"' }

pins:
  src: p2 "Recommended PCB Layout Top View (no polarity marked)"
  "1": { name: "1", type: passive }
