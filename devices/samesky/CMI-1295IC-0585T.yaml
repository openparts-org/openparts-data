# Same Sky CMI-1295IC-0585T magnetic buzzer indicator (datasheet samesky/CMI-1295IC-0585T-DS).
# Pins from the page-2 recommended PCB layout: 1 = +, 2 = -; typed passive.
schema_version: "0.2"
kind: device
id: samesky/CMI-1295IC-0585T
manufacturer: samesky
category: buzzer
family: CMI-1295IC
source: samesky/CMI-1295IC-0585T-DS

parameters:
  rated_voltage: { typ: 5 V, src: 'p1 "Specifications, rated voltage 5 Vdc"' }
  rated_current:
    max: 30 mA
    src: p1 "Specifications, current consumption at rated voltage, max 30 mA"
  frequency:
    min: 2.3 kHz
    typ: 2.4 kHz
    max: 2.5 kHz
    src: p1 "Specifications, rated frequency 2,300 / 2,400 / 2,500 Hz"
  supply_voltage: { min: 4 V, max: 7 V, src: 'p1 "Specifications, operating voltage 4 / 7 Vdc"' }
  operating_temperature:
    min: -30 °C
    max: 70 °C
    src: p1 "Specifications, operating temperature"
  sound_pressure:
    min: 85 dB
    at: { VIN: 5 V, d: 10 cm }
    src: p1 "Specifications, sound pressure level at 10 cm, rated voltage, min 85 dB"
  buzzer_type:
    value: magnetic
    src: 'p1 "MODEL: CMI-1295IC-0585T | DESCRIPTION: MAGNETIC BUZZER INDICATOR"'
  buzzer_drive:  { value: internal, src: 'p1 "Features, internally driven"' }

pins:
  src: p2 "Recommended PCB Layout Top View, (+) / (-)"
  "1": { name: +, type: passive }
  "2": { name: -, type: passive }
