# Same Sky CMI-9605IC-0580T magnetic buzzer indicator (datasheet samesky/CMI-9605IC-0580T-DS).
# Pins from the page-2 recommended PCB layout: 1 = +, 2 = -; typed passive.
schema_version: "0.2"
kind: device
id: samesky/CMI-9605IC-0580T
manufacturer: samesky
category: buzzer
family: CMI-9605IC
source: samesky/CMI-9605IC-0580T-DS

parameters:
