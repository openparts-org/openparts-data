# Bosch Sensortec BMI270 6-axis IMU, 14-pin LGA. Pin names and I/O types
# from Table 22 "Pin-out and pin connections" (page 135) of
# BST-BMI270-DS000-08 (Digital I/O -> io, Digital in -> input, Digital
# out -> output, Supply -> power, Ground -> ground); numbers checked
# against the 7.1 pin-out top and bottom views (page 134), which spell
# pin 2/3 "ASDx"/"ASCx" (top view) -- the table's spelling is used.
schema_version: "0.2"
kind: device
id: bosch/BMI270
manufacturer: bosch
category: imu
family: BMI2
source: bosch/BST-BMI270-DS000-08

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.71 V
    max: 3.6 V
    src: p11 "Table 1 Basic electrical parameter specifications, Supply Voltage VDD"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p11 "Table 1 Basic electrical parameter specifications, Operating Temperature TA (operating, the only TA range printed)"
  esd_hbm: { typ: 2 kV, src: 'p16 "Table 5 Absolute maximum ratings, ESD HBM at any pin"' }

pins:
  src:  [p135 "Table 22 Pin-out and pin connections", p134 "7.1 Pin-out top view / bottom view"]
  "1":  { name: SDO, type: io }
  "2":  { name: ASDx, type: io }
  "3":  { name: ASCx, type: io }
  "4":  { name: INT1, type: io }
  "5":  { name: VDDIO, type: power }
  "6":  { name: GNDIO, type: ground }
  "7":  { name: GND, type: ground }
  "8":  { name: VDD, type: power }
  "9":  { name: INT2, type: io }
  "10": { name: OCSB, type: input }
  "11": { name: OSDO, type: output }
  "12": { name: CSB, type: input }
  "13": { name: SCx, type: input }
  "14": { name: SDx, type: io }
