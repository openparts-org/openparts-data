# Bosch Sensortec BMI085 6-axis IMU (accelerometer + gyroscope), 16-pin
# LGA. Pin names and I/O types from Table 14 "Pin description" (page
# 41) of BST-BMI085-DS000-16 (Digital I/O -> io, Digital in -> input, Digital
# out -> output, Supply -> power, Ground -> ground; NC "--" -> nc, the
# table's connection columns say GND), checked against Figures 6/7.
schema_version: "0.2"
kind: device
id: bosch/BMI085
manufacturer: bosch
category: imu
family: BMI08x
source: bosch/BST-BMI085-DS000-16

pins:
  src:  p41 "Table 14 Pin description; Figures 6/7 pin-out"
  "1":  { name: INT2, type: io }
  "2":  { name: NC, type: nc }
  "3":  { name: VDD, type: power }
  "4":  { name: GNDA, type: ground }
  "5":  { name: CSB2, type: input }
  "6":  { name: GNDIO, type: ground }
  "7":  { name: PS, type: input }
  "8":  { name: SCL/SCK, type: input }
  "9":  { name: SDA/SDI, type: io }
  "10": { name: SDO2, type: output }
  "11": { name: VDDIO, type: power }
  "12": { name: INT3, type: io }
  "13": { name: INT4, type: io }
  "14": { name: CSB1, type: input }
  "15": { name: SDO1, type: output }
  "16": { name: INT1, type: io }
