# Bosch Sensortec BMI160 6-axis IMU, 14-pin LGA. Pin names and I/O types
# from Table 30 (section 4.1, pages 101-102) of BST-BMI160-DS000-09
# (Digital I/O -> io, Digital in -> input, Digital out -> output, Supply
# -> power, Ground -> ground); numbers checked against Figures 31/32
# (pin-out top/bottom view, page 101). Conflict: the figures label pin 10
# "OSCB", the table "OCSB" -- the table is used.
schema_version: "0.2"
kind: device
id: bosch/BMI160
manufacturer: bosch
category: imu
family: BMI1
source: bosch/BST-BMI160-DS000-09

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.71 V
    max: 3.6 V
    src: p7 "Table 1 Electrical parameter specification, Supply Voltage VDD"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p7 "Table 1 Electrical parameter specification, Operating Temperature TA"
  esd_hbm: { typ: 2 kV, src: 'p11 "Table 5 Absolute maximum ratings, ESD HBM, at any Pin"' }

pins:
  src:  p101 "Table 30 pin-out and pin connections; Figures 31/32"
  "1":  { name: SDO, type: io }
  "2":  { name: ASDx, type: io }
  "3":  { name: ASCx, type: io }
  "4":  { name: INT1, type: io }
  "5":  { name: VDDIO, type: power }
  "6":  { name: GNDIO, type: ground }
  "7":  { name: GND, type: ground }
  "8":  { name: VDD, type: power }
  "9":  { name: INT2, type: io }
  "10": { name: OCSB, type: input }
  "11": { name: OSDO, type: output }
  "12": { name: CSB, type: input }
  "13": { name: SCx, type: input }
  "14": { name: SDx, type: io }
