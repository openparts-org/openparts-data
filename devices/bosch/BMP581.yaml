# Bosch Sensortec BMP581 barometric pressure sensor, 10-pin LGA. Pin names
# and I/O types from Table 28 "Pin description" (section 6.1, page 46) of
# BST-BMP581-DS004-13, numbers checked against Figure 23 "Pin out top and
# bottom view" (same page). Supply -> power, In -> input, In/Out -> io,
# Out -> output, VSS -> ground.
schema_version: "0.2"
kind: device
id: bosch/BMP581
manufacturer: bosch
category: pressure_sensor
family: BMP5
source: bosch/BST-BMP581-DS004-13

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.71 V
    max: 3.6 V
    src: p10 "Table 4 Electrical characteristics, Power supply VDD"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p8 "Table 1 Pressure Performance, Temperature range TA (operating, the only TA range printed)"
  pressure_range:
    min: 30 kPa
    max: 125 kPa
    src: p8 "Table 1 Pressure Performance, Pressure measurement range P"

pins:
  src:  p46 "Table 28 Pin description; Figure 23 pin-out"
  "1":  { name: VDDIO, type: power }
  "2":  { name: SCK, type: input }
  "3":  { name: VSS, type: ground }
  "4":  { name: SDI, type: io }
  "5":  { name: SDO, type: io }
  "6":  { name: CSB, type: input }
  "7":  { name: INT, type: output }
  "8":  { name: VSS, type: ground }
  "9":  { name: VSS, type: ground }
  "10": { name: VDD, type: power }
