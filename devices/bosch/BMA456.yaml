# Bosch Sensortec BMA456 3-axis accelerometer, 12-pin LGA. Pin names and
# I/O types from the "Pin description" table (section 7.1, page 88) of
# BST-BMA456-DS000-09: Digital I/O -> io, Digital in -> input, Digital
# out -> output, Supply -> power, Ground -> ground. Numbers checked
# against the pin-out figure on the same page and the bottom view of the
# package drawing (page 92).
schema_version: "0.2"
kind: device
id: bosch/BMA456
manufacturer: bosch
category: imu
family: BMA4
source: bosch/BST-BMA456-DS000-09

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.62 V
    max: 3.6 V
    src: p8 "Electrical specification, Supply Voltage VDD"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p8 "Electrical specification, Operating Temperature TA (operating, the only TA range printed)"
  esd_hbm: { typ: 2 kV, src: 'p10 "Absolute maximum ratings, ESD HBM, at any pin"' }

pins:
  src:  p88 "7.1 Pin-out figure and Pin description table"
  "1":  { name: SDO, type: io }
  "2":  { name: SDX, type: io }
  "3":  { name: VDDIO, type: power }
  "4":  { name: ASDA, type: io }
  "5":  { name: INT1, type: io }
  "6":  { name: INT2, type: io }
  "7":  { name: VDD, type: power }
  "8":  { name: GNDIO, type: ground }
  "9":  { name: GND, type: ground }
  "10": { name: CSB, type: input }
  "11": { name: ASCL, type: output }
  "12": { name: SCX, type: input }
