# Bosch Sensortec BME690, 8-pin LGA gas, pressure, humidity and
# temperature sensor; category `sensor` (the tree has no combined
# environmental-sensor node), as for bosch/BME280. Pin names and I/O
# types from Table 26 "Pin description" (page 52) of BST-BME690-DS001-04 (Supply
# -> power, GND "Ground" -> ground, In -> input, In/Out -> io), numbers
# checked against the pin-out top/bottom view on the same page
# (clockwise numbering in top view).
schema_version: "0.2"
kind: device
id: bosch/BME690
manufacturer: bosch
category: sensor
family: BME6
source: bosch/BST-BME690-DS001-04

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.71 V
    max: 3.6 V
    src: p7 "Table 1 Electrical parameter specification, Supply Voltage VDD"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p13 "Table 9 Pressure parameter specification, Operating temperature TA (operational; full-accuracy 0..65 C not used)"
  esd_hbm: { typ: 2 kV, src: 'p15 "Table 11 Absolute maximum ratings, ESD HBM, at any pin"' }

pins:
  src: p52 "Table 26 Pin description; pin-out top/bottom view"
  "1": { name: GND, type: ground }
  "2": { name: CSB, type: input }
  "3": { name: SDI, type: io }
  "4": { name: SCK, type: input }
  "5": { name: SDO, type: io }
  "6": { name: VDDIO, type: power }
  "7": { name: GND, type: ground }
  "8": { name: VDD, type: power }
