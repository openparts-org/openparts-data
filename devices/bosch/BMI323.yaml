# Bosch Sensortec BMI323 6-axis IMU, 14-pin LGA. Pin names and I/O types
# from Table 56 "Pin-out and pin connections" (page 207) of BST-BMI323-DS000-13
# (Digital I/O -> io, Digital in -> input, Supply -> power, Ground ->
# ground); pins 2, 3, 10, 11 are "NC ... do not connect" -> nc (the table
# gives them type "Digital I/O" for 2/3, but they are to be left
# unconnected). Numbers checked against Figure 36/37 pin-out (page 206).
schema_version: "0.2"
kind: device
id: bosch/BMI323
manufacturer: bosch
category: imu
family: BMI3
source: bosch/BST-BMI323-DS000-13

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.71 V
    max: 3.63 V
    src: p8 "Table 1 Basic electrical parameter specification, Supply voltage core VDD"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p8 "Table 1 Basic electrical parameter specification, Operating Temperature TA"
  esd_hbm: { typ: 2 kV, src: 'p13 "Table 9 Absolute maximum ratings, ESD HBM at any pin, 2000 V"' }

pins:
  src:  [p207 "Table 56 Pin-out and pin connections", p206 "Figures 36/37 pin-out top/bottom view"]
  "1":  { name: SDO, type: io }
  "2":  { name: NC, type: nc }
  "3":  { name: NC, type: nc }
  "4":  { name: INT1, type: io }
  "5":  { name: VDDIO, type: power }
  "6":  { name: GNDIO, type: ground }
  "7":  { name: GND, type: ground }
  "8":  { name: VDD, type: power }
  "9":  { name: INT2, type: io }
  "10": { name: NC, type: nc }
  "11": { name: NC, type: nc }
  "12": { name: CSB, type: input }
  "13": { name: SCx, type: input }
  "14": { name: SDx, type: io }
