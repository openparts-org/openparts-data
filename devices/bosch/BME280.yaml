# Bosch Sensortec BME280, 8-pin LGA. Combined humidity and pressure sensor (datasheet title); category `sensor` (the tree has no combined humidity/pressure node).
# Pin names and I/O types from Table 35 "Pin description" (page 38) of
# BST-BME280-DS001-24 (Supply -> power, VSS/GND "Ground" -> ground,
# In -> input, In/Out -> io), numbers checked against Figure 16 "Pin-out
# top and bottom view" on the same page (clockwise numbering in top
# view). The two GND pins are both ground.
schema_version: "0.2"
kind: device
id: bosch/BME280
manufacturer: bosch
category: sensor
family: BME2
source: bosch/BST-BME280-DS001-24

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.71 V
    max: 3.6 V
    src: p8 "Table 1 Electrical parameter specification, Supply Voltage VDD"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p10 "Table 3 Pressure parameter specification, Operating temperature TA (operational; full-accuracy 0..65 C not used)"
  esd_hbm: { typ: 2 kV, src: 'p13 "Table 5 Absolute maximum ratings, ESD HBM, at any pin"' }

pins:
  src: p38 "Table 35 Pin description; Figure 16 pin-out"
  "1": { name: GND, type: ground }
  "2": { name: CSB, type: input }
  "3": { name: SDI, type: io }
  "4": { name: SCK, type: input }
  "5": { name: SDO, type: io }
  "6": { name: VDDIO, type: power }
  "7": { name: GND, type: ground }
  "8": { name: VDD, type: power }
