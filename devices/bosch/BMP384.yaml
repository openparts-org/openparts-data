# Bosch Sensortec BMP384 barometric pressure sensor, 10-pin LGA. Pin names
# and I/O types from Table 50 "Pin description" (section 6.1, page 45) of
# BST-BMP384-DS003-11 (Supply -> power, In -> input, In/Out -> io, Out -> output,
# VSS "Ground" -> ground); numbers checked against Figure 23 "Pin-out top
# and bottom view" on the same page. The three VSS pins are all ground.
schema_version: "0.2"
kind: device
id: bosch/BMP384
manufacturer: bosch
category: pressure_sensor
family: BMP3
source: bosch/BST-BMP384-DS003-11

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.65 V
    max: 3.6 V
    src: p6 "Table 2 General electrical parameter specifications, Supply Voltage VDD"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p6 "Table 2 General electrical parameter specifications, Operating temperature range TA, operational"
  esd_hbm: { typ: 2 kV, src: 'p8 "Table 3 Absolute maximum ratings, ESD (HBM)"' }

pins:
  src:  p45 "Table 50 Pin description; Figure 23 pin-out"
  "1":  { name: VDDIO, type: power }
  "2":  { name: SCK, type: input }
  "3":  { name: VSS, type: ground }
  "4":  { name: SDI, type: io }
  "5":  { name: SDO, type: io }
  "6":  { name: CSB, type: input }
  "7":  { name: INT, type: output }
  "8":  { name: VSS, type: ground }
  "9":  { name: VSS, type: ground }
  "10": { name: VDD, type: power }
