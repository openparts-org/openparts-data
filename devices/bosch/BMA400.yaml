  "3":  { name: VDDIO, type: power }
  "4":  { name: NC, type: nc }
  "5":  { name: INT1, type: io }
  "6":  { name: INT2, type: io }
  "7":  { name: VDD, type: power }
  "8":  { name: GNDIO, type: ground }
  "9":  { name: GND, type: ground }
  "10": { name: CSB, type: input }
  "11": { name: NC, type: nc }
  "12": { name: SCX, type: input }
