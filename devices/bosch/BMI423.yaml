# Bosch Sensortec BMI423 6-axis IMU, 14-pin LGA. Pin names and I/O types
# from Table 59 "Pin-out and pin connections" (page 281) of
# BST-BMI423-DS002-03 (Digital I/O -> io, Supply -> power, Ground ->
# ground; CSB and SCx are typed "Digital I/O" in this table). Pins 2, 3,
# 10, 11 are "NC" ("DNC or VDDIO") -> nc. Numbers checked against
# Figures 33/34 (page 280), which label pins 2/3/10/11 "DNC".
schema_version: "0.2"
kind: device
id: bosch/BMI423
manufacturer: bosch
category: imu
family: BMI4
source: bosch/BST-BMI423-DS002-03

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.71 V
    max: 3.63 V
    src: p9 "Table 1 Basic Electrical Parameter Specification, Supply voltage core VDD"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p9 "Table 1 Basic Electrical Parameter Specification, Operating temperature TO"
  esd_hbm: { typ: 2 kV, src: 'p15 "Table 10 Absolute maximum ratings, ESD HBM at any pin, 2000 V"' }

pins:
  src:  [p281 "Table 59 Pin-out and pin connections", p280 "Figures 33/34 pin-out"]
  "1":  { name: SDO, type: io }
  "2":  { name: NC, type: nc }
  "3":  { name: NC, type: nc }
  "4":  { name: INT1, type: io }
  "5":  { name: VDDIO, type: power }
  "6":  { name: GNDIO, type: ground }
  "7":  { name: GND, type: ground }
  "8":  { name: VDD, type: power }
  "9":  { name: INT2, type: io }
  "10": { name: NC, type: nc }
  "11": { name: NC, type: nc }
  "12": { name: CSB, type: io }
  "13": { name: SCx, type: io }
  "14": { name: SDx, type: io }
