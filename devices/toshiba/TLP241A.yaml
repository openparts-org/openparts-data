# TLP241A photorelay (IRED + photo-MOSFET output, 1-Form-A, 40 V / 2 A),
# 4-pin DIP. Pin assignment from section 6 "Pin Assignment" on page 2
# of the TLP241A datasheet (2026-04-07): 1 Anode, 2 Cathode, 3 Drain,
# 4 Drain; the two drains are named DRAIN3/DRAIN4 (pin names must be
# unique). All typed passive. The output ratings (VOFF 40 V, ION 2 A,
# RON) have no optocoupler parameter key and are not recorded.
# operating_temperature is the Recommended Operating Conditions range
# (the absolute maximum Topr is -40 to 85 °C).
schema_version: "0.2"
kind: device
id: toshiba/TLP241A
manufacturer: toshiba
category: optocoupler
family: TLP241A
source: toshiba/TLP241A-datasheet-en

parameters:
  forward_voltage:
    min: 1.1 V
    typ: 1.27 V
    max: 1.4 V
    at: { IF: 10 mA }
    src: p5 "Electrical Characteristics, LED, Input forward voltage VF"
  reverse_voltage:
    max: 5 V
    src: p3 "8. Absolute Maximum Ratings, LED, Input reverse voltage VR"
  forward_current:
    max: 30 mA
    src: p3 "8. Absolute Maximum Ratings, LED, Input forward current IF"
  isolation_voltage:
    min: 5000 V
    at: { t: 60 s }
    src: p5 "Isolation Characteristics, Isolation voltage BVS (AC, Vrms)"
  trigger_current:
    typ: 0.5 mA
    max: 3 mA
    src: p5 "13. Coupled Electrical Characteristics, Trigger LED current IFT, ION = 1.0 A"
  off_state_voltage: { max: 40 V, src: 'p3 "8. Absolute Maximum Ratings, Detector, VOFF"' }
  on_resistance:
    typ: 60 mΩ
    max: 100 mΩ
    at: { IF: 5 mA, IL: 2 A }
    src: p5 "13. Coupled Electrical Characteristics, RON, ION = 2.0 A, t < 1 s"
  operating_temperature:
    min: -20 °C
    max: 85 °C
    src: p3 "9. Recommended Operating Conditions, Operating temperature Topr"

pins:
  src: 'p2 "6. Pin Assignment: 1 Anode, 2 Cathode, 3 Drain, 4 Drain"'
  "1": { name: ANODE, type: passive }
  "2": { name: CATHODE, type: passive }
  "3": { name: DRAIN3, type: passive }
  "4": { name: DRAIN4, type: passive }
