# TLP2310 low-power 5 MBd photocoupler, totem-pole output, 2.7-5.5 V, SO6 (TOSHIBA 11-4L1S: 6 lead positions,
# pin 2 absent). Pin assignment from section 4 "Packaging and Pin
# Assignment" on page 2 of the TLP2310 datasheet (2026-04-07): 1 Anode,
# 3 Cathode, 4 GND, 5 VO, 6 VDD. LED terminals passive.
# operating_temperature is the range the electrical characteristics are
# specified over (or the operating range when only that is printed).
schema_version: "0.2"
kind: device
id: toshiba/TLP2310
manufacturer: toshiba
category: optocoupler
family: TLP2310
source: toshiba/TLP2310-datasheet-en

parameters:
  forward_voltage:
    min: 1.2 V
    max: 1.9 V
    at: { IF: 2 mA }
    src: p4 "9. Electrical Characteristics, Input forward voltage VF, IF = 2 mA"
  reverse_voltage:
    max: 5 V
    src: p3 "7. Absolute Maximum Ratings, LED, Input reverse voltage VR"
  forward_current:
    max: 8 mA
    src: p3 "7. Absolute Maximum Ratings, LED, Input forward current IF"
  isolation_voltage:
    min: 3750 V
    at: { t: 60 s }
    src: p4 "10. Isolation Characteristics, Isolation voltage BVS (AC, 60 s, Vrms)"
  cmr:
    min: 25 kV/µs
    src: p5 "11. Switching Characteristics, CMH / CML, VCM = 1000 Vp-p, Ta = 25 °C"
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: p3 "8. Recommended Operating Conditions, Supply voltage VDD (Note 2)"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p4 "9. Electrical Characteristics, table condition Ta = -40 to 125 °C"
  propagation_delay:
    max: 250 ns
    src: p5 "11. Switching Characteristics, tpHL / tpLH, VIN = 3.3 V / 5 V"

pins:
  src: 'p2 "4. Packaging and Pin Assignment: 1 Anode, 3 Cathode, 4 GND, 5 VO, 6 VDD"'
  "1": { name: ANODE, type: passive }
  "3": { name: CATHODE, type: passive }
  "4": { name: GND, type: ground }
  "5": { name: VO, type: output }
  "6": { name: VDD, type: power }
