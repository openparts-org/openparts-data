# TB6612FNG dual DC-motor driver IC, SSOP24. Pin map from the "Pin
# Functions" table (datasheet 2026-05-13, page 2). The table lists the
# paired output and power-ground pins (1-2 AO1, 3-4 PGND1, 5-6 AO2, 7-8
# BO2, 9-10 PGND2, 11-12 BO1) as one function each but does not state
# they are internally connected: the output pairs are typed power so
# the duplicate names are allowed (flagged for review), PGND ground.
# VM1/VM2/VM3 "Motor supply"; Vcc "Small signal supply".
schema_version: "0.2"
kind: device
