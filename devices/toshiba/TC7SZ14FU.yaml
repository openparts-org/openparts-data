# TC7SZ14FU single-gate CMOS logic (Schmitt Inverter, "1. Functional
# Description", page 1) in USV (SOT-353). Pin map from "Pin Assignment
# (Top view)" on page 2 (image).
# Pin 1 is printed "N.C.".
schema_version: "0.2"
kind: device
id: toshiba/TC7SZ14FU
manufacturer: toshiba
category: logic
family: TC7SZ14FU
source: toshiba/TC7SZ14FU-datasheet-en

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage: { min: 1.65 V, max: 5.5 V, src: 'p3 "8. Operating Ranges, Supply voltage VCC"' }
  supply_current:
    max: 1 µA
    at: { VCC: 1.65..5.5 V, TA: 25 °C }
    src: p4 "9.1 DC Characteristics (Ta = 25 °C), Quiescent supply current ICC"
  channel_count:  { value: "1", src: 'p1 "1. Functional Description: Schmitt Inverter"' }
  propagation_delay:
    - min: 1 ns
      typ: 3.7 ns
      max: 6.3 ns
      at: { VCC: 3.3 V, CL: 15 pF, RL: 1 MΩ, TA: 25 °C }
      src: p7 "9.4 AC Characteristics, tPLH/tPHL, VCC 3.3 ± 0.3 V, CL 15 pF, RL 1 MΩ"
    - min: 0.5 ns
      typ: 3.7 ns
      max: 5.9 ns
      at: { VCC: 5 V, CL: 50 pF, RL: 500 Ω, TA: 25 °C }
      src: p7 "9.4 AC Characteristics, tPLH/tPHL, VCC 5.0 ± 0.5 V, CL 50 pF, RL 500 Ω"
  logic_function: { value: inverter, src: 'p1 "1. Functional Description: Schmitt Inverter"' }
  output_current_high:
    min: 24 mA
    at: { VCC: 3 V }
    src: p1 "2. Features (3), High output current ±24 mA (min) at VCC = 3.0 V"
  output_current_low:
    min: 24 mA
    at: { VCC: 3 V }
    src: p1 "2. Features (3), High output current ±24 mA (min) at VCC = 3.0 V"

pins:
  src: p2 "4. Marking and Pin Assignment, Pin Assignment (Top view)"
  "1": { name: NC, type: nc }
  "2": { name: IN A, type: input }
  "3": { name: GND, type: ground }
  "4": { name: OUT Y, type: output }
  "5": { name: VCC, type: power }
