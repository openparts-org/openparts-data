  "10": { name: VMA, type: power }
  "11": { name: VMA, type: power }
  "12": { name: NC, type: nc }
  "13": { name: OUTA+, type: power }
  "14": { name: OUTA+, type: power }
  "15": { name: RSAGND, type: ground }
  "16": { name: RSAGND, type: ground }
  "17": { name: OUTA-, type: power }
  "18": { name: OUTA-, type: power }
  "19": { name: OUTB-, type: power }
  "20": { name: OUTB-, type: power }
  "21": { name: RSBGND, type: ground }
  "22": { name: RSBGND, type: ground }
  "23": { name: OUTB+, type: power }
  "24": { name: OUTB+, type: power }
  "25": { name: NC, type: nc }
