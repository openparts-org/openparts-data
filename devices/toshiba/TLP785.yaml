# TLP785 photocoupler (IRED + phototransistor), 4 pins. Pin assignment
# from "Pin Configurations (top view)" on page 1 of the TLP785
# datasheet (2026-04-07): 1 Anode, 2 Cathode, 3 Emitter, 4 Collector.
# All typed passive (diode/transistor terminals, no I/O stated).
schema_version: "0.1"
kind: device
id: toshiba/TLP785

manufacturer: toshiba
category: optocoupler
family: TLP785

pins:
  "1": { name: ANODE, type: passive }
  "2": { name: CATHODE, type: passive }
  "3": { name: EMITTER, type: passive }
  "4": { name: COLLECTOR, type: passive }

parameters:
  forward_voltage:
    nominal: 1.15
    min: 1.0
    max: 1.3
    unit: V
  forward_current:
    max: 60
    unit: mA
  reverse_voltage:
    max: 5
    unit: V
  collector_emitter_voltage:
    nominal: 80
    unit: V
  collector_current:
    nominal: 50
    unit: mA
  isolation_voltage:
    min: 5000
    unit: V

provenance:
  "/parameters/forward_voltage":
    - source: toshiba/TLP785-datasheet-en
      page: 3
      locator: "Individual Electrical Characteristics, LED, Forward voltage VF, IF = 10 mA: Min 1.0, Typ. 1.15, Max 1.3 V"
  "/parameters/forward_current":
    - source: toshiba/TLP785-datasheet-en
      page: 2
      locator: "Absolute Maximum Ratings, LED, Forward current IF: 60 mA (derating -0.7 mA/°C at Ta >= 39 °C)"
  "/parameters/reverse_voltage":
    - source: toshiba/TLP785-datasheet-en
      page: 2
      locator: "Absolute Maximum Ratings, LED, Reverse voltage VR: 5 V"
  "/parameters/collector_emitter_voltage":
    - source: toshiba/TLP785-datasheet-en
      page: 2
      locator: "Absolute Maximum Ratings, Detector, Collector-emitter voltage VCEO: 80 V"
  "/parameters/collector_current":
    - source: toshiba/TLP785-datasheet-en
      page: 2
      locator: "Absolute Maximum Ratings, Detector, Collector current IC: 50 mA"
  "/parameters/isolation_voltage":
    - source: toshiba/TLP785-datasheet-en
      page: 3
      locator: "Isolation Characteristics, Isolation voltage BVS, AC, 60 s: Min 5000 Vrms"
  "/pins":
    - source: toshiba/TLP785-datasheet-en
      page: 1
      locator: "\"Pin Configurations (top view)\": 1 Anode, 2 Cathode, 3 Emitter, 4 Collector"
