# TLP785 photocoupler (IRED + phototransistor), 4 pins. Pin assignment
# from "Pin Configurations (top view)" on page 1 of the TLP785
# datasheet (2026-04-07): 1 Anode, 2 Cathode, 3 Emitter, 4 Collector.
# All typed passive (diode/transistor terminals, no I/O stated).
schema_version: "0.2"
kind: device
id: toshiba/TLP785
manufacturer: toshiba
category: optocoupler
family: TLP785
source: toshiba/TLP785-datasheet-en

parameters:
  forward_voltage:
    min: 1 V
    typ: 1.15 V
    max: 1.3 V
    at: { IF: 10 mA }
    src: 'p3 "Individual Electrical Characteristics, LED, Forward voltage VF: Min 1.0, Typ. 1.15, Max 1.3 V"'
  reverse_voltage: { max: 5 V, src: 'p2 "Absolute Maximum Ratings, LED, Reverse voltage VR: 5 V"' }
  forward_current:
    max: 60 mA
    src: 'p2 "Absolute Maximum Ratings, LED, Forward current IF: 60 mA (derating -0.7 mA/°C at Ta >= 39 °C)"'
  collector_emitter_voltage:
    typ: 80 V
    src: 'p2 "Absolute Maximum Ratings, Detector, Collector-emitter voltage VCEO: 80 V"'
  collector_current:
    typ: 50 mA
    src: 'p2 "Absolute Maximum Ratings, Detector, Collector current IC: 50 mA"'
  isolation_voltage:
    min: 5000 V
    src: 'p3 "Isolation Characteristics, Isolation voltage BVS, AC, 60 s: Min 5000 Vrms"'

pins:
  src: 'p1 ""Pin Configurations (top view)": 1 Anode, 2 Cathode, 3 Emitter, 4 Collector"'
  "1": { name: ANODE, type: passive }
  "2": { name: CATHODE, type: passive }
  "3": { name: EMITTER, type: passive }
  "4": { name: COLLECTOR, type: passive }
