# TLP785 photocoupler (IRED + phototransistor), 4 pins. Pin assignment
# from "Pin Configurations (top view)" on page 1 of the TLP785
# datasheet (2026-04-07): 1 Anode, 2 Cathode, 3 Emitter, 4 Collector.
# All typed passive (diode/transistor terminals, no I/O stated).
schema_version: "0.2"
kind: device
id: toshiba/TLP785
manufacturer: toshiba
category: optocoupler
family: TLP785
source: toshiba/TLP785-datasheet-en

parameters:
  forward_voltage:
    min: 1 V
    typ: 1.15 V
    max: 1.3 V
    at: { IF: 10 mA }
    src: p3 "Individual Electrical Characteristics, LED, Forward voltage VF"
  reverse_voltage: { max: 5 V, src: 'p2 "Absolute Maximum Ratings, LED, Reverse voltage VR"' }
  forward_current: { max: 60 mA, src: 'p2 "Absolute Maximum Ratings, LED, Forward current IF"' }
  collector_emitter_voltage:
    max: 80 V
    src: p2 "Absolute Maximum Ratings, Detector, Collector-emitter voltage VCEO"
  collector_current:
    max: 50 mA
    src: p2 "Absolute Maximum Ratings, Detector, Collector current IC"
  isolation_voltage:
    min: 5000 V
    at: { t: 60 s }
    src: p3 "Isolation Characteristics, Isolation voltage BVS (AC, Vrms)"

pins:
  src: 'p1 ""Pin Configurations (top view)": 1 Anode, 2 Cathode, 3 Emitter, 4 Collector"'
  "1": { name: ANODE, type: passive }
  "2": { name: CATHODE, type: passive }
  "3": { name: EMITTER, type: passive }
  "4": { name: COLLECTOR, type: passive }
