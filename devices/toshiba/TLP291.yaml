# TLP291 photocoupler (IRED + phototransistor) in SO4. Pin assignment
# from "Pin Configuration" on page 1 of the TLP291 datasheet
# (2019-5-27): 1 ANODE, 2 CATHODE, 3 EMITTER, 4 COLLECTOR. All typed
# passive.
schema_version: "0.1"
kind: device
id: toshiba/TLP291

manufacturer: toshiba
category: optocoupler
family: TLP291

pins:
  "1": { name: ANODE, type: passive }
  "2": { name: CATHODE, type: passive }
  "3": { name: EMITTER, type: passive }
  "4": { name: COLLECTOR, type: passive }

parameters:
  forward_voltage:
    nominal: 1.25
    min: 1.1
    max: 1.4
    unit: V
  forward_current:
    max: 50
    unit: mA
  reverse_voltage:
    max: 5
    unit: V
  collector_emitter_voltage:
    nominal: 80
    unit: V
  collector_current:
    nominal: 50
    unit: mA
  isolation_voltage:
    min: 3750
    unit: V

provenance:
  "/parameters/forward_voltage":
    - source: toshiba/TLP291-datasheet-en
      page: 3
      locator: "Electrical Characteristics, LED, Input forward voltage VF, IF = 10 mA: MIN 1.1, TYP. 1.25, MAX 1.4 V"
  "/parameters/forward_current":
    - source: toshiba/TLP291-datasheet-en
      page: 3
      locator: "Absolute Maximum Ratings, LED, Input forward current IF: 50 mA (derating -1.5 mA/°C at Ta >= 90 °C)"
  "/parameters/reverse_voltage":
    - source: toshiba/TLP291-datasheet-en
      page: 3
      locator: "Absolute Maximum Ratings, LED, Input reverse voltage VR: 5 V"
  "/parameters/collector_emitter_voltage":
    - source: toshiba/TLP291-datasheet-en
      page: 3
      locator: "Absolute Maximum Ratings, DETECTOR, Collector-emitter voltage VCEO: 80 V"
  "/parameters/collector_current":
    - source: toshiba/TLP291-datasheet-en
      page: 3
      locator: "Absolute Maximum Ratings, DETECTOR, Collector current IC: 50 mA"
  "/parameters/isolation_voltage":
    - source: toshiba/TLP291-datasheet-en
      page: 4
      locator: "Isolation Characteristics, Isolation voltage BVS, AC, 60 s: MIN 3750 Vrms"
  "/pins":
    - source: toshiba/TLP291-datasheet-en
      page: 1
      locator: "\"Pin Configuration\" (TLP291): 1 ANODE, 2 CATHODE, 3 EMITTER, 4 COLLECTOR"
