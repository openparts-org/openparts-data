# TLP291 photocoupler (IRED + phototransistor) in SO4. Pin assignment
# from "Pin Configuration" on page 1 of the TLP291 datasheet
# (2019-5-27): 1 ANODE, 2 CATHODE, 3 EMITTER, 4 COLLECTOR. All typed
# passive.
schema_version: "0.2"
kind: device
id: toshiba/TLP291
manufacturer: toshiba
category: optocoupler
family: TLP291
source: toshiba/TLP291-datasheet-en

parameters:
  forward_voltage:
    min: 1.1 V
    typ: 1.25 V
    max: 1.4 V
    at: { IF: 10 mA }
    src: p3 "Electrical Characteristics, LED, Input forward voltage VF"
  reverse_voltage: { max: 5 V, src: 'p3 "Absolute Maximum Ratings, LED, Input reverse voltage VR"' }
  forward_current:
    max: 50 mA
    src: p3 "Absolute Maximum Ratings, LED, Input forward current IF"
  collector_emitter_voltage:
    max: 80 V
    src: p3 "Absolute Maximum Ratings, DETECTOR, Collector-emitter voltage VCEO"
  collector_current:
    max: 50 mA
    src: p3 "Absolute Maximum Ratings, DETECTOR, Collector current IC"
  isolation_voltage:
    min: 3750 V
    at: { t: 60 s }
    src: p4 "Isolation Characteristics, Isolation voltage BVS (AC, Vrms)"

pins:
  src: 'p1 ""Pin Configuration" (TLP291): 1 ANODE, 2 CATHODE, 3 EMITTER, 4 COLLECTOR"'
  "1": { name: ANODE, type: passive }
  "2": { name: CATHODE, type: passive }
  "3": { name: EMITTER, type: passive }
  "4": { name: COLLECTOR, type: passive }
