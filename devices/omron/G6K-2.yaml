# OMRON G6K-2 single-side stable relay, DPDT (2c), standard 2.54 mm
# terminal arrangement: G6K-2F (outside-L SMT) and G6K-2P (PCB
# terminals) share one pin map. Pins from K106-E1-11 page 6 "Terminal
# Arrangement/Internal Connections" (G6K-2F top view, G6K-2P bottom
# view, same numbering): coil 1 (+) and 8 (-) ("Check carefully the coil
# polarity"); pole 1: 3 carries the movable contact, resting on 2 (NC),
# moving to 4 (NO); pole 2: 6 the movable contact, resting on 7 (NC),
# moving to 5 (NO). Typed passive. Coil values per rated voltage: on the
# Parts. -Y (highly insulated) and G6KU latching models not included.
schema_version: "0.2"
kind: device
id: omron/G6K-2
manufacturer: omron
category: relay
family: G6K
source: omron/K106-E1-11

parameters:
  isolation_voltage:
    typ: 1500 V
    at: { t: 60 s }
    src: p3 "Characteristics, Dielectric strength between coil and contacts 1,500 VAC, 1 min"
  operating_temperature:
    min: -40 °C
    max: 70 °C
    src: p3 "Characteristics, Ambient operating temperature -40 to 70°C"
  contact_current: { max: 1 A, src: 'p3 "Ratings, Contacts, Max. switching current 1A"' }
  contact_voltage:
    max: 125 V
    src: p3 "Ratings, Contacts, Max. switching voltage 125 VAC, 60 VDC"
  contact_form:    { value: 2c, src: 'p2 "Ordering Information, Contact form DPDT (2c)"' }
  relay_type:
    value: electromechanical
    src: p2 "Ordering Information, Single-side stable, Fully sealed"

pins:
  src: p6 "G6K-2F / G6K-2P, Terminal Arrangement/Internal Connections"
  "1": { name: COIL+, type: passive }
  "2": { name: NC1, type: passive }
  "3": { name: COM1, type: passive }
  "4": { name: NO1, type: passive }
  "5": { name: NO2, type: passive }
  "6": { name: COM2, type: passive }
  "7": { name: NC2, type: passive }
  "8": { name: COIL-, type: passive }
