# OMRON B3F 6 x 6 mm through-hole tactile switch with ground terminal
# (B3F-11xx, B3F-11x2-G; SPST-NO, 4 terminals + ground). The datasheet
# names no signals: pins are named by the numbers in "Terminal
# Arrangement/Internal Connections (Top View)", which joins 4 and 3 on
# one line and 2 and 1 on the other, the switch between the lines, and
# draws 5 to a ground symbol (not joined to 1-4) -> 3 is internally
# connected to 4, 1 to 2 (connected_to).
schema_version: "0.2"
kind: device
id: omron/B3F-1100
manufacturer: omron
category: tact_switch
family: B3F
source: omron/A070-E1-08

parameters:
  rated_voltage:
    min: 3 V
    max: 24 V
    src: 'p3 "Ratings/Characteristics, Rating (resistive load): 3 to 24 VDC"'
  travel:
    min: 0.15 mm
    typ: 0.25 mm
    max: 0.45 mm
    src: 'p3 "Operating Characteristics, 6 x 6 mm Models, Pretravel (PT): 0.25+0.2/-0.1 mm"'

pins:
  src: p4 "Flat Plunger Type (with Ground Terminal), Terminal Arrangement/Internal Connections (Top View)"
  "1": { name: "1", type: passive, connected_to: "2" }
  "2": { name: "2", type: passive }
  "3": { name: "3", type: passive, connected_to: "4" }
  "4": { name: "4", type: passive }
  "5": { name: "5", type: passive }
