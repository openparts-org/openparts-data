# OMRON B3F side-operated through-hole tactile switch (B3F-31xx,
# B3F-3122-G; SPST-NO). The datasheet names no signals: pins are named by
# the numbers in "Terminal Arrangement/Internal Connections (Top View)":
# the switch between 1 and 2; 3 and 4 are the bracket terminals, 4 drawn
# to a ground symbol. No internal connection is drawn between 3 and 4,
# so none is recorded.
schema_version: "0.2"
kind: device
id: omron/B3F-3100
manufacturer: omron
category: tact_switch
family: B3F
source: omron/A070-E1-08

parameters:
  rated_voltage:
    min: 3 V
    max: 24 V
    src: 'p3 "Ratings/Characteristics, Rating (resistive load): 3 to 24 VDC"'
  travel:
    min: 0.15 mm
    typ: 0.25 mm
    max: 0.45 mm
    src: 'p3 "Operating Characteristics, 6 x 6 mm Models (B3F-3@@0 column), Pretravel (PT): 0.25+0.2/-0.1 mm"'

pins:
  src: p5 "Side-operated, Terminal Arrangement/Internal Connections (Top View)"
  "1": { name: "1", type: passive }
  "2": { name: "2", type: passive }
  "3": { name: "3", type: passive }
  "4": { name: "4", type: passive }
