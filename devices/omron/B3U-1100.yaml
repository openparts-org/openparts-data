# OMRON B3U ultra-small SMT tactile switch, top-actuated, with ground terminal (B3U-1100P series) (SPST-NO). The
# datasheet names no signals: pins are named by the numbers in "Terminal
# Arrangement/Internal Connections (Top View)" (2 left, 1 right, the
# switch between them; 3 below, drawn to a bar beside the switch, not joined to 1 or 2).
schema_version: "0.2"
kind: device
id: omron/B3U-1100
manufacturer: omron
category: tact_switch
family: B3U
source: omron/A162-E1-07

parameters:
  rated_voltage:
    min: 3 V
    max: 12 V
    src: 'p1 "Ratings/Characteristics, Rating (resistive load): 1 to 50 mA, 3 to 12 VDC"'
  rated_current:
    min: 1 mA
    max: 50 mA
    src: 'p1 "Ratings/Characteristics, Rating (resistive load): 1 to 50 mA, 3 to 12 VDC"'
  actuation_force:
    min: 1.01 N
    typ: 1.5 N
    max: 1.99 N
    src: 'p1 "Operating Characteristics, Top-actuated (B3U-1000 Series), Operating force (OF): 1.50±0.49 N"'
  travel:
    min: 0.05 mm
    typ: 0.15 mm
    max: 0.35 mm
    src: 'p1 "Operating Characteristics, Top-actuated (B3U-1000 Series), Pretravel (PT): 0.15 +0.2/-0.1 mm"'

pins:
  src: p2 "With Ground Terminal, Terminal Arrangement/Internal Connections (Top View)"
  "1": { name: "1", type: passive }
  "2": { name: "2", type: passive }
  "3": { name: "3", type: passive }
