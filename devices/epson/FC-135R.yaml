# Epson FC-135R 32.768 kHz tuning-fork crystal (low-ESR FC-135), 2 pads.
# Pin/Connection table: #1 X'tal, #2 X'tal (symmetric; XTAL1/XTAL2 only for
# distinct names, as epson/FC-135).
schema_version: "0.2"
kind: device
id: epson/FC-135R
manufacturer: epson
category: crystal
family: FC-135R
source: epson/FC-135R_E_Ver2.0

# Parameters (AI candidates, needs review).
parameters:
  aging:
    tol: ±3 ppm
    at: { TA: 25 °C }
    src: p2 "[4] Static Characteristics, Frequency aging f_age, first year"
  drive_level: { typ: 0.1 µW, max: 0.5 µW, src: 'p2 "[3] Operating Conditions, Level of drive DL"' }
  shunt_capacitance: { typ: 1 pF, src: 'p2 "[4] Static Characteristics, Shunt capacitance C0"' }
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p2 "[3] Operating Conditions, Operating temperature range T_use"

pins:
  src: p4 "[7] Pin / Connection table, Internal Connection"
  "1": { name: XTAL1, type: passive }
  "2": { name: XTAL2, type: passive }
