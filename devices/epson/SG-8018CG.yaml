# Epson SG-8018CG programmable crystal oscillator (CMOS output), 4-pad
# 2.5 x 2.0 mm package. Pin names from the p1 "Pin description" table.
# Pin 1 is OE (function code P) or ST-bar (function code S), fixed by
# the Part's product name; named "OE/ST" here.
schema_version: "0.2"
kind: device
id: epson/SG-8018CG
manufacturer: epson
category: oscillator
family: SG-8018
source: epson/SG-8018CG-BRIEF

# Parameters (AI candidates, needs review).
parameters:
  frequency_stability:
    tol: ±50 ppm
    at: { TA: -40..105 °C }
    src: p1 "Specifications, Frequency tolerance f_tol J (inclusive, note *1, incl. 10-year aging)"
  clock_output: { value: cmos, src: 'p1 "Title, OUTPUT: CMOS"' }
  supply_voltage: { min: 1.62 V, max: 3.63 V, src: 'p1 "Specifications, Supply voltage VCC"' }
  operating_temperature:
    min: -40 °C
    max: 105 °C
    src: p1 "Specifications, Operating temperature range T_use"

pins:
  src: p1 "Pin description table"
  "1": { name: OE/ST, type: input }
  "2": { name: GND, type: ground }
  "3": { name: OUT, type: clock_out }
  "4": { name: VCC, type: power }
