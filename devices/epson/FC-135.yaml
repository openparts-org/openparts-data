# 32.768kHz tuning-fork quartz crystal unit. Confirmed 2-pad, both
# crystal electrodes (no GND/mechanical pad) -- Pin Connection table
# (page 1): "#1 X'tal", "#2 X'tal" (the datasheet names both pins
# identically, since a 2-terminal crystal is electrically symmetric;
# named "XTAL1"/"XTAL2" here only to satisfy this dataset's
# distinct-pin-name requirement, not because the datasheet
# distinguishes them).
schema_version: "0.2"
kind: device
id: epson/FC-135
manufacturer: epson
category: crystal
family: FC-135
source: epson/FC-135_E_Ver2.0

