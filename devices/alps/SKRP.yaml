# Alps Alpine SKRP 4.2 x 3.2 mm SMT TACT switch (SPST-NO, 4 terminals).
# Pins are named by the terminal numbers of the "Circuit Diagram": 1 and
# 2 joined on one line, 3 and 4 on the other, the switch between the lines.
schema_version: "0.2"
kind: device
id: alps/SKRP
manufacturer: alps
category: tact_switch
family: SKRP
source: alps/TA02-SKRP

parameters:
  rated_voltage:
    min: 1 V
    max: 16 V
    src: 'p1 "Absolute Maximum Ratings: 50mA 16V DC; Rating (min.): 10uA 1V DC"'
  rated_current:
    min: 0.01 mA
    max: 50 mA
    src: 'p1 "Absolute Maximum Ratings: 50mA 16V DC; Rating (min.): 10uA 1V DC"'

pins:
  src: 'p2 ""Circuit Diagram": 1-2 joined, 3-4 joined, switch between"'
  "1": { name: "1", type: passive }
  "2": { name: "2", type: passive, connected_to: "1" }
  "3": { name: "3", type: passive }
  "4": { name: "4", type: passive, connected_to: "3" }
