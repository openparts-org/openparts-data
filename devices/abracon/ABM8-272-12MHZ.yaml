# Abracon ABM8-272-T3 12.000 MHz fundamental AT-cut crystal (CL 10 pF,
# ESR 50 ohm max, C0 3.0 pF max, +/-30 ppm, -40..+85 C) in a 4-pad
# 3.2 x 2.5 mm ceramic package. Pin map from the "TOP VIEW" on PDF page 2
# of abracon/456603@revB: the crystal symbol is drawn between pads 1 and 3;
# pads 2 and 4 are labelled "GND". The drawing gives no names to the
# crystal terminals: they are named XTAL1 (pad 1) / XTAL2 (pad 3) only
# for distinct names (electrically symmetric), as for abracon/ABS07-32.768KHZ.
# The GND pads are typed `ground` because the source labels them GND.
schema_version: "0.2"
kind: device
id: abracon/ABM8-272-12MHZ
manufacturer: abracon
category: crystal
family: ABM8-272
source: abracon/456603@revB

# Parameters (AI candidates, needs review).
parameters:
  frequency_stability:
    tol: ±30 ppm
    at: { TA: -40..85 °C }
    src: p1 "Key Electrical Specifications, Frequency Stability over the Operating Temperature"
  aging:
    tol: ±5 ppm
    at: { TA: 25 °C }
    src: p1 "Key Electrical Specifications, Aging, @25±3°C, 1st year"
  drive_level: { typ: 10 µW, max: 200 µW, src: 'p1 "Key Electrical Specifications, Drive Level"' }
  shunt_capacitance:
    max: 3 pF
    src: p1 "Key Electrical Specifications, Shunt Capacitance (C0)"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p1 "Key Electrical Specifications, Operating Temperature"

pins:
  src: p2 "Mechanical Dimensions, Top View, pads 1-4"
  "1": { name: XTAL1, type: passive }
  "2": { name: GND, type: ground }
  "3": { name: XTAL2, type: passive }
  "4": { name: GND, type: ground }
