# Abracon ABM10 fundamental AT crystal, 4-pad 2.5 x 2.0 mm ceramic package
# (frequency and options per Part). Pin map from the p2 TOP VIEW: crystal
# between pads 1 and 3, pads 2 and 4 labelled GND.
# The crystal terminals carry no names in the source: XTAL1 (pad 1) / XTAL2
# (pad 3) only for distinct names (electrically symmetric), as abracon/ABM8.
schema_version: "0.2"
kind: device
id: abracon/ABM10
manufacturer: abracon
category: crystal
family: ABM10
source: abracon/ABM10-DS

# Parameters (AI candidates, needs review).
parameters:
  aging:
    tol: ±5 ppm
    at: { TA: 25 °C }
    src: p1 "STANDARD SPECIFICATIONS, Aging@25°C±3°C, First year"
  drive_level:       { typ: 10 µW, max: 100 µW, src: 'p1 "STANDARD SPECIFICATIONS, Drive Level"' }
  shunt_capacitance: { max: 7 pF, src: 'p1 "STANDARD SPECIFICATIONS, Shunt capacitance (C0)"' }

pins:
  src: p2 "OUTLINE DRAWING, TOP VIEW, pads 1-4 (crystal 1-3, GND 2/4)"
  "1": { name: XTAL1, type: passive }
  "2": { name: GND, type: ground }
  "3": { name: XTAL2, type: passive }
  "4": { name: GND, type: ground }
