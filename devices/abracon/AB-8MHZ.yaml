# 8MHz fundamental-mode quartz crystal, HC-49/U. A crystal's 2
# terminals are electrically symmetric/undifferentiated (confirmed:
# the datasheet's own outline drawing labels both leads only by
# position, no anode/cathode-style distinction) -- named XTAL1/XTAL2
# only to satisfy this dataset's distinct-pin-name requirement.
schema_version: "0.2"
kind: device
id: abracon/AB-8MHZ
manufacturer: abracon
category: crystal
family: AB
source: abracon/ab-hc49u

# Parameters (AI candidates, needs review).
parameters:
  aging:
    tol: ±5 ppm
    at: { TA: 25 °C }
    src: p1 "STANDARD SPECIFICATIONS, Aging@25°C±3°C, First year"
  drive_level:       { typ: 100 µW, max: 1000 µW, src: 'p1 "STANDARD SPECIFICATIONS, Drive Level"' }
  shunt_capacitance: { max: 7 pF, src: 'p1 "STANDARD SPECIFICATIONS, Shunt capacitance (C0)"' }

pins:
  "1": { name: XTAL1, type: passive }
  "2": { name: XTAL2, type: passive }
