# Abracon ABS07 32.768kHz tuning-fork crystal (standard options: 12.5pF
# CL, +/-20ppm, -40..+85C). The page-4 "CONNECTIONS" symbol is a plain
# 2-terminal crystal with no pin numbers or GND pad; the electrodes are
# electrically symmetric, named XTAL1/XTAL2 only for distinct names.
schema_version: "0.2"
kind: device
id: abracon/ABS07-32.768KHZ
manufacturer: abracon
category: crystal
family: ABS07
source: abracon/ABS07

# Parameters (AI candidates, needs review).
parameters:
  aging:
    tol: ±3 ppm
    at: { TA: 25 °C }
    src: p1 "Key Electrical Specifications, Aging, @25°C± 3°C First year"
  drive_level: { typ: 0.1 µW, max: 0.5 µW, src: 'p1 "Key Electrical Specifications, Drive Level"' }
  shunt_capacitance:
    max: 2 pF
    src: p1 "Key Electrical Specifications, Shunt capacitance (C0)"

pins:
  src: p4 "Mechanical Dimensions, "CONNECTIONS" diagram (2-terminal crystal symbol)"
  "1": { name: XTAL1, type: passive }
  "2": { name: XTAL2, type: passive }
