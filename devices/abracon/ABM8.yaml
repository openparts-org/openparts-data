# Abracon ABM8 fundamental / 3rd-overtone AT crystal in a 4-pad 3.2 x 2.5
# mm ceramic package (all frequencies share this Device; frequency and
# options are per Part). Pin map from the p2 "TOP VIEW": the crystal
# symbol is drawn between pads 1 and 3, pads 2 and 4 are labelled "GND".
# The crystal terminals carry no names in the source: XTAL1 (pad 1) /
# XTAL2 (pad 3) only for distinct names (electrically symmetric), as for
# abracon/ABM8-272-12MHZ.
schema_version: "0.2"
kind: device
id: abracon/ABM8
manufacturer: abracon
category: crystal
family: ABM8
source: abracon/ABM8-DS

pins:
  src: p2 "Outline drawing, TOP VIEW, pads 1-4 (crystal 1-3, GND 2/4)"
  "1": { name: XTAL1, type: passive }
  "2": { name: GND, type: ground }
  "3": { name: XTAL2, type: passive }
  "4": { name: GND, type: ground }
