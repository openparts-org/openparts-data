# Abracon ASDMB programmable MEMS clock oscillator (CMOS output), 4-pad
# 2.5 x 2.0 mm plastic QFN. Frequency, operating temperature, overall
# stability and output load per Part (p6 Options and Part Identification).
# Pin names from the p7 "Pin# / Function" table.
schema_version: "0.2"
kind: device
id: abracon/ASDMB
manufacturer: abracon
category: oscillator
family: ASDMB
source: abracon/ASDMB-DS

# Parameters (AI candidates, needs review).
parameters:
  aging:
    tol: ±5 ppm
    at: { TA: 25 °C }
    src: 'p1 "Key Electrical Specifications, Aging: First year @25°C"'
  clock_output: { value: cmos, src: 'p1 "Description, CMOS output"' }
  supply_voltage:
    min: 1.8 V
    max: 3.3 V
    src: p1 "Key Electrical Specifications, Supply Voltage (Vdd) +1.8 ~ +3.3"
  esd_hbm:      { typ: 4 kV, src: 'p5 "Absolute Maximum Ratings, ESD HBM"' }

pins:
  src: p7 "Pin# / Function table; TOP VIEW"
  "1": { name: Standby, type: input }
  "2": { name: GND, type: ground }
  "3": { name: Output, type: clock_out }
  "4": { name: Vdd, type: power }
