# Samtec MMCX-J-P-X-ST-SM1 (MMCX STRAIGHT, SMT JACK- 50 OHM),
# samtec/MMCX-J-P-X-ST-SM1-MKT. The print names no pins and numbers no
# pads. Numbered here as the MCX prints: "1" the centre contact (centre
# pad), "2" the outer contact (all four ground pads). Names from note 7,
# "ASSEMBLY PLATING DESIGNATIONS: -H: (CENTER CONTACT)-H (OUTER
# CONTACT)-F"; the print states no electrical function, so both are
# passive (the outer contact is not marked ground).
schema_version: "0.2"
kind: device
id: samtec/MMCX-J-P-X-ST-SM1
manufacturer: samtec
category: connector
family: MMCX-J-P-X-ST-SM1
source: samtec/MMCX-J-P-X-ST-SM1-MKT

pins:
  src: 'p1 "NOTES 7, ASSEMBLY PLATING DESIGNATIONS: CENTER CONTACT, OUTER CONTACT"'
  "1": { name: CENTER_CONTACT, type: passive }
  "2": { name: OUTER_CONTACT, type: passive }
