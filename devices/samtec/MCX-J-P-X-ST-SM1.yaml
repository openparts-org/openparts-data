# Samtec MCX-J-P-X-ST-SM1 (MCX STRAIGHT, SMT JACK- 50 OHM), samtec/MCX-J-P-X-ST-SM1-MKT.
# The print names no pins and numbers no pads. Numbered here: "1" the
# centre contact (centre pad/hole), "2" the outer contact (all four
# legs). Names from the plating specification's "CENTER CONTACT" /
# "OUTER CONTACT"; the print states no electrical function, so both are
# passive (the outer contact is not marked ground).
schema_version: "0.2"
kind: device
id: samtec/MCX-J-P-X-ST-SM1
manufacturer: samtec
category: connector
family: MCX-J-P-X-ST-SM1
source: samtec/MCX-J-P-X-ST-SM1-MKT

pins:
  src: 'p1 "PLATING SPECIFICATION: CENTER CONTACT, OUTER CONTACT"'
  "1": { name: CENTER_CONTACT, type: passive }
  "2": { name: OUTER_CONTACT, type: passive }
