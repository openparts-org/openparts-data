# Samtec SMA-J-P-X-ST-EM1 (SMA STRAIGHT, EDGE MOUNT JACK- 50 OHM),
# samtec/SMA-J-P-X-ST-EM1-MKT (revision G). The print names no pins and
# numbers no pads. Numbered here as the dataset's other Samtec RF jacks:
# "1" the centre contact (centre pad), "2" the outer contact (the legs).
# Names from the plating specification's "CENTER CONTACT" / "OUTER
# CONTACT"; the print states no electrical function, so both are passive.
schema_version: "0.2"
kind: device
id: samtec/SMA-J-P-X-ST-EM1
manufacturer: samtec
category: connector
family: SMA-J-P-X-ST-EM1
source: samtec/SMA-J-P-X-ST-EM1-MKT

pins:
  src: 'p1 "PLATING SPECIFICATION: CENTER CONTACT, OUTER CONTACT"'
  "1": { name: CENTER_CONTACT, type: passive }
  "2": { name: OUTER_CONTACT, type: passive }
