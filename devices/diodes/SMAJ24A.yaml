# 400W unidirectional TVS, VRWM 24V, SMA -- type number from the DS19005
# page-3 Electrical Characteristics row "SMAJ24A" (printed
# "SMAJ24(C)A"; without C = unidirectional).
# Polarity from the page-1 Mechanical Data ("Polarity Indicator: Cathode Band (Bidirectional Devices do not Have a Polarity Indicator)").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.2"
kind: device
id: diodes/SMAJ24A
manufacturer: diodes
category: diode
family: SMAJ
source: diodes/DS19005

parameters:
  forward_voltage:
    max: 3.5 V
    at: { IPP: 35 A }
    src: p2 "Maximum Ratings, Instantaneous Forward Voltage VF (Notes 5-7, unidirectional)"
  reverse_voltage: { max: 24 V, src: 'p3 "Electrical Characteristics table, SMAJ24(C)A row, VRWM"' }
  clamping_voltage:
    max: 38.9 V
    at: { IPP: 10.3 A }
    src: p3 "Electrical Characteristics, SMAJ24(C)A row, Max. Clamping Voltage VC @ IPP"
  peak_pulse_current:
    max: 10.3 A
    src: p3 "Electrical Characteristics, SMAJ24(C)A row, Max. Peak Pulse Current IPP"
  peak_pulse_power: { max: 400 W, src: 'p2 "Maximum Ratings, Peak Pulse Power Dissipation PPK"' }

pins:
  src: p1 "Mechanical Data, Polarity Indicator; numbering per header"
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
