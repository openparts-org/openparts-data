# Schottky barrier rectifier, PowerDI123 (DS30519).
# Polarity from the page-1 Mechanical Data ("Terminal Connections: Cathode Band").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.2"
kind: device
id: diodes/DFLS240
manufacturer: diodes
category: diode
family: DFLS
source: diodes/DS30519

parameters:
  forward_voltage:
    typ: 0.65 V
    max: 0.7 V
    at: { IF: 2 A }
    src: 'p2 "Electrical Characteristics, Forward Voltage VF: Typ 0.65 V, Max 0.7 V"'
  reverse_voltage: { max: 40 V, src: 'p2 "Maximum Ratings, VRRM/VRWM/VR: 40 V"' }
  forward_current: { max: 2 A, src: 'p2 "Maximum Ratings, Average Forward Current IF(AV): 2.0 A"' }

pins:
  src: 'p1 "Mechanical Data: "Terminal Connections: Cathode Band"; numbering by generator convention, see header"'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
