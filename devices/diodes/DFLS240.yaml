# Schottky barrier rectifier, PowerDI123 (DS30519).
# Polarity from the page-1 Mechanical Data ("Terminal Connections: Cathode Band").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.1"
kind: device
id: diodes/DFLS240

manufacturer: diodes
category: diode
family: DFLS

pins:
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }

parameters:
  reverse_voltage:
    max: 40
    unit: V
  forward_current:
    max: 2.0
    unit: A
  forward_voltage:
    nominal: 0.65
    max: 0.7
    unit: V

provenance:
  "/parameters/reverse_voltage":
    - source: diodes/DS30519
      page: 2
      locator: "Maximum Ratings, VRRM/VRWM/VR: 40 V"
  "/parameters/forward_current":
    - source: diodes/DS30519
      page: 2
      locator: "Maximum Ratings, Average Forward Current IF(AV): 2.0 A"
  "/parameters/forward_voltage":
    - source: diodes/DS30519
      page: 2
      locator: "Electrical Characteristics, Forward Voltage VF: Typ 0.65 V, Max 0.7 V @ IF = 2.0A"
  "/pins":
    - source: diodes/DS30519
      page: 1
      locator: "Mechanical Data: \"Terminal Connections: Cathode Band\"; numbering by generator convention, see header"
