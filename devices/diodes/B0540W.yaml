# Schottky diode, SOD123 -- same package as the existing 1N4148W device
# (reuses manufacturers/diodes/SOD123-2.65x1.55-DS30139). Polarity confirmed from the
# datasheet's "Mechanical Data" section: "Polarity: Cathode Band".
schema_version: "0.2"
kind: device
id: diodes/B0540W
manufacturer: diodes
category: diode
family: B0540W
source: diodes/DS30138@rev15-2

parameters:
  forward_voltage:
    max: 0.51 V
    at: { IF: 0.5 A, TJ: 25 °C }
    src: 'p2 "Electrical Characteristics, Maximum Forward Voltage Drop VFM: 0.510 V"'
  reverse_voltage: { max: 40 V, src: 'p2 "Maximum Ratings, VRRM/VRWM/VR: 40 V"' }
  forward_current:
    max: 0.5 A
    src: 'p2 "Maximum Ratings, Average Rectified Output Current (See Figure 5) IO: 0.5 A"'

pins:
  src: 'diodes/DS30138 p1 ""Mechanical Data": "Polarity: Cathode Band""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
