# Dual series Schottky diode, SOT23 (Standard). From the page-1
# "BAT54S" connection drawing (rendered at 400 dpi): left diode anode on
# the bottom-left lead, cathode to the top lead; right diode anode from
# the top lead, cathode on the bottom-right lead -- so the top lead is
# the common cathode(1)/anode(2) node. Pin numbers are not printed;
# numbers follow this dataset's sot convention (1 bottom-left,
# 2 bottom-right, 3 top) -- position-derived, flagged for review.
schema_version: "0.2"
kind: device
id: diodes/BAT54S
manufacturer: diodes
category: diode
family: BAT54
source: diodes/DS11005

parameters:
  forward_voltage:
    max: 800 mV
    at: { IF: 100 mA }
    src: 'p2 "Electrical Characteristics, Forward Voltage VF: Max 800 mV (highest listed test current)"'
  reverse_voltage:
    max: 30 V
    src: 'p2 "Maximum Ratings, Peak Repetitive Reverse Voltage / Working Peak Reverse Voltage / DC Blocking Voltage VRRM/VRWM/VR: 30 V"'
  forward_current:
    max: 200 mA
    src: 'p2 "Maximum Ratings, Average Rectified Output Current (Note 5) IO: 200 mA"'

pins:
  src: p1 "Connection drawing labelled "BAT54S" under "SOT23 (Standard)"; position-derived numbering, see header"
  "1": { name: Anode1, type: passive }
  "2": { name: Cathode2, type: passive }
  "3": { name: Cathode1/Anode2, type: passive }
