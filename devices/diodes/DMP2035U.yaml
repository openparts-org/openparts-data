# 20V P-channel enhancement-mode MOSFET with gate protection diode,
# SOT23 (Standard). Pin numbers are NOT printed in DS31830: the page-1
# "Top View" box drawing labels the single top lead D, the bottom-left
# lead G and the bottom-right lead S. Numbers map those positions onto
# this dataset's sot convention (1 bottom-left, 2 bottom-right, 3 top),
# as diodes/DMG2305UX -- position-derived, flagged for review.
schema_version: "0.2"
kind: device
id: diodes/DMP2035U
manufacturer: diodes
category: transistor
family: DMP2035U
source: diodes/DS31830

pins:
