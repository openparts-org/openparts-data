# 0.2A 20V Schottky barrier diode, SOD123 (DS11013 Product Summary row SD103CW).
# Polarity from the page-1 Mechanical Data ("Polarity: Cathode Band").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.1"
kind: device
id: diodes/SD103CW

manufacturer: diodes
category: diode
family: SD103W

pins:
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }

parameters:
  reverse_voltage:
    max: 20
    unit: V
  forward_current:
    max: 350
    unit: mA
  forward_voltage:
    max: 0.6
    unit: V

provenance:
  "/parameters/reverse_voltage":
    - source: diodes/DS11013
      page: 2
      locator: "Maximum Ratings, VRRM/VRWM/VR, SD103CW column: 20 V"
  "/parameters/forward_current":
    - source: diodes/DS11013
      page: 2
      locator: "Maximum Ratings, Forward Continuous Current (Note 5) IFM: 350 mA"
  "/parameters/forward_voltage":
    - source: diodes/DS11013
      page: 2
      locator: "Electrical Characteristics, Forward Voltage Drop VFM: Max 0.60 V @ IF = 200mA"
  "/pins":
    - source: diodes/DS11013
      page: 1
      locator: "Mechanical Data: \"Polarity: Cathode Band\"; numbering by generator convention, see header"
