# 0.2A 20V Schottky barrier diode, SOD123 (DS11013 Product Summary row SD103CW).
# Polarity from the page-1 Mechanical Data ("Polarity: Cathode Band").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.2"
kind: device
id: diodes/SD103CW
manufacturer: diodes
category: diode
family: SD103W
source: diodes/DS11013

parameters:
  forward_voltage:
    max: 0.6 V
    at: { IF: 200 mA }
    src: 'p2 "Electrical Characteristics, Forward Voltage Drop VFM: Max 0.60 V"'
  reverse_voltage: { max: 20 V, src: 'p2 "Maximum Ratings, VRRM/VRWM/VR, SD103CW column: 20 V"' }
  forward_current:
    max: 350 mA
    src: 'p2 "Maximum Ratings, Forward Continuous Current (Note 5) IFM: 350 mA"'

pins:
  src: 'p1 "Mechanical Data: "Polarity: Cathode Band"; numbering by generator convention, see header"'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
