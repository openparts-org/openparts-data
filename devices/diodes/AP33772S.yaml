# AP33772S I2C USB PD3.1 EPR sink controller, W-QFN4040-24 (Type A1).
# Pinout from DS46176 Rev. 10 - 2 "Table 1. Pin Descriptions of AP33772S
# Sink Controller" (page 3), checked against "Pin Assignments (Top
# View)" (page 1). EPAD: "suggested to connect to Ground".
schema_version: "0.2"
kind: device
id: diodes/AP33772S
manufacturer: diodes
category: usb_pd_controller
family: AP33772S
source: diodes/DS46176

# Parameters (AI candidates, needs review).
parameters:
