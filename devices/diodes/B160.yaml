# 1.0A 60V Schottky barrier rectifier, SMA/SMB (DS13002).
# One device for both the SMA (B1x0) and SMB (B1x0B) versions: the
# datasheet names the terminals the same way for both cases.
# Polarity from the page-1 Mechanical Data ("Polarity: Cathode Band or Cathode Notch").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.2"
kind: device
id: diodes/B160
manufacturer: diodes
category: diode
family: B1x0
source: diodes/DS13002

parameters:
  forward_voltage:
    max: 0.7 V
    at: { IF: 1 A }
    src: 'p2 "Electrical Characteristics, Forward Voltage Drop VF, B150/B, B160/B row: Max 0.7 V"'
  reverse_voltage:
    max: 60 V
    src: 'p2 "Maximum Ratings, Peak Repetitive Reverse Voltage / Working Peak Reverse Voltage / DC Blocking Voltage VRRM/VRWM/VR, B160/B column: 60 V"'
  forward_current:
    max: 1 A
    at: { TT: 130 °C }
    src: 'p2 "Maximum Ratings, Average Rectified Output Current IO: 1.0 A (all types)"'

pins:
  src: 'p1 "Mechanical Data: "Polarity: Cathode Band or Cathode Notch"; numbering by generator convention, see header"'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
