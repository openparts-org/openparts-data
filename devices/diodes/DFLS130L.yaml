# Schottky barrier rectifier, PowerDI123 (DS30492).
# Polarity from the page-1 Mechanical Data ("Terminal Connections: Cathode Band").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.2"
kind: device
id: diodes/DFLS130L
manufacturer: diodes
category: diode
family: DFLS
source: diodes/DS30492

parameters:
  forward_voltage:
    - { typ: 0.31 V, at: { IF: 1 A }, src: 'p2 "Electrical Characteristics, Forward Voltage VF"' }
    - { typ: 0.21 V, at: { IF: 0.1 A }, src: 'p2 "Electrical Characteristics, Forward Voltage VF"' }
    - typ: 0.328 V
      max: 0.36 V
      at: { IF: 1.5 A }
      src: p2 "Electrical Characteristics, Forward Voltage VF"
  reverse_voltage: { max: 30 V, src: 'p2 "Maximum Ratings, VRRM/VRWM/VR"' }
  forward_current:
    max: 1 A
    at: { TT: 121 °C }
    src: p2 "Maximum Ratings, Average Forward Current IF(AV)"

pins:
  src: 'p1 "Mechanical Data: "Terminal Connections: Cathode Band"; numbering by generator convention, see header"'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
