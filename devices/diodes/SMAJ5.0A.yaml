# 400W unidirectional TVS, VRWM 5.0V, SMA -- type number from the DS19005
# page-3 Electrical Characteristics row "SMAJ5.0A" (printed
# "SMAJ5.0(C)A"; without C = unidirectional).
# Polarity from the page-1 Mechanical Data ("Polarity Indicator: Cathode Band (Bidirectional Devices do not Have a Polarity Indicator)").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.2"
kind: device
id: diodes/SMAJ5.0A
manufacturer: diodes
category: diode
family: SMAJ
source: diodes/DS19005

parameters:
  forward_voltage:
    max: 3.5 V
    at: { IPP: 35 A }
    src: 'p2 "Maximum Ratings, Instantaneous Forward Voltage (Notes 5, 6, 7; unidirectional units only) VF: 3.5 V"'
  reverse_voltage:
    max: 5 V
    src: 'p3 "Electrical Characteristics table, row SMAJ5.0(C)A: Reverse Standoff Voltage VRWM 5.0 V"'

pins:
  src: 'p1 "Mechanical Data: "Polarity Indicator: Cathode Band (Bidirectional Devices do not Have a Polarity Indicator)"; numbering by generator convention, see header"'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
