# 5.1V (VZ 4.8-5.4V) 350mW Zener diode, SOT23. VZ from the Electrical
# Characteristics table row "BZX84C5V1" (page 2, marking Z2). Pins from
# the page-1 "Device Schematic" (rendered at 400 dpi): Zener anode on
# the bottom-left lead, cathode (bent bar) to the top lead, bottom-right
# lead unconnected. Pin numbers are not printed; numbers follow this
# dataset's sot convention (1 bottom-left, 2 bottom-right, 3 top) --
# position-derived, flagged for review.
schema_version: "0.2"
kind: device
id: diodes/BZX84C5V1
manufacturer: diodes
category: diode
family: BZX84C
source: diodes/DS18001

parameters:
  forward_voltage:
    max: 0.9 V
    at: { IF: 10 mA }
    src: 'p2 "Maximum Ratings, Forward Voltage VF: 0.9 V"'
  zener_voltage:
    min: 4.8 V
    typ: 5.1 V
    max: 5.4 V
    src: 'p2 "Electrical Characteristics, BZX84C5V1 row: VZ @ IZT Nom 5.1 V, Min 4.8 V, Max 5.4 V (Note 8: short duration pulse test)"'
  zener_test_current:
    typ: 5 mA
    src: 'p2 "Electrical Characteristics, BZX84C5V1 row: IZT 5.0 mA"'

pins:
  src: p1 ""Device Schematic" drawing next to the SOT23 Top View photo; position-derived numbering, see header"
  "1": { name: Anode, type: passive }
  "2": { name: NC, type: nc }
  "3": { name: Cathode, type: passive }
