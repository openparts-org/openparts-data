# Schottky barrier rectifier, SOD323 (DS30235).
# Polarity from the page-1 Mechanical Data ("Polarity: Cathode Band").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.2"
kind: device
id: diodes/B0520WS
manufacturer: diodes
category: diode
family: B0520WS
source: diodes/DS30235

parameters:
  forward_voltage:
    - max: 0.43 V
      at: { IF: 0.5 A }
      src: p2 "Electrical Characteristics, Max. Forward Voltage Drop VF"
    - max: 0.31 V
      at: { IF: 0.1 A }
      src: p2 "Electrical Characteristics, Max. Forward Voltage Drop VF"
  reverse_voltage: { max: 20 V, src: 'p2 "Maximum Ratings, VRRM/VRWM/VR"' }
  forward_current: { max: 0.5 A, src: 'p2 "Maximum Ratings, Average Rectified Output Current IO"' }

pins:
  src: 'p1 "Mechanical Data: "Polarity: Cathode Band"; numbering by generator convention, see header"'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
