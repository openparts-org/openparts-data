# Fast switching small-signal diode, SOD-323. Pin numbers printed on the
# circuit diagram (1 = cathode-bar side, 2 = anode); polarity confirmed
# from the "Polarity: Cathode Band" mechanical-data entry.
schema_version: "0.2"
kind: device
id: diodes/1N4148WS
manufacturer: diodes
category: diode
family: 1N4148WS
source: diodes/DS30097@rev30-2

parameters:
  forward_voltage:
    max: 1.25 V
    at: { IF: 150 mA }
    src: 'p2 "Electrical Characteristics, Forward Voltage VFM: Max 1.25 V (highest listed test current)"'
  reverse_voltage: { max: 75 V, src: 'p2 "Maximum Ratings, VRRM/VRWM/VR: 75 V"' }
  forward_current:
    max: 300 mA
    src: 'p2 "Maximum Ratings, Forward Continuous Current IFM: 300 mA"'

pins:
  src: 'diodes/DS30097 p1 "Circuit diagram pins 1/2; "Polarity: Cathode Band""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
