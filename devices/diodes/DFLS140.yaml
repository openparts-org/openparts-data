# Schottky barrier rectifier, PowerDI123 (DS30446).
# Polarity from the page-1 Mechanical Data ("Polarity: Cathode Band").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.2"
kind: device
id: diodes/DFLS140
manufacturer: diodes
category: diode
family: DFLS
source: diodes/DS30446

parameters:
  forward_voltage:
    - { typ: 0.53 V, at: { IF: 1.1 A }, src: 'p2 "Electrical Characteristics, Forward Voltage VF"' }
    - typ: 0.45 V
      max: 0.51 V
      at: { IF: 0.5 A }
      src: p2 "Electrical Characteristics, Forward Voltage VF"
  reverse_voltage: { max: 40 V, src: 'p2 "Maximum Ratings, VRRM/VRWM/VR"' }
  forward_current:
    max: 1.1 A
    at: { TT: 119 °C }
    src: p2 "Maximum Ratings, Average Forward Current IF(AV)"

pins:
  src: 'p1 "Mechanical Data: "Polarity: Cathode Band"; numbering by generator convention, see header"'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
