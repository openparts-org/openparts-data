# AP1117 1A LDO, fixed 3.3-V option (AP1117E33...). Pins from DS31009
# Rev. 24-3 "Pin Descriptions" (page 2): 1 Adj (GND) "Ground only for
# Fixed-Mode", 2 VOUT, 3 VIN; cross-checked against page 1 "Pin
# Assignments" SOT223 (Top View) 3 VIN / 2 VOUT / 1 Adj (GND), "Tab is
# VOUT". The tab carries pin number 2 in the package
# (standards/SOT223-3.5x6.5-P2.3-TabPin2-Diodes), so no extra pin here.
schema_version: "0.2"
kind: device
id: diodes/AP1117-3.3
manufacturer: diodes
category: linear_regulator
family: AP1117
source: diodes/DS31009

parameters:
  output_current:
    typ: 1 A
    src: 'p1 "Description: "AP1117 is a low dropout positive adjustable or fixed-mode regulator with 1A output current capability""'
  dropout_voltage: { max: 1.4 V, src: 'p1 "Features: "1.4V Maximum Dropout at Full Load Current""' }

pins:
  src:
    - p2 ""Pin Descriptions" table (1 Adj (GND), 2 VOUT, 3 VIN)"
    - p1 ""Pin Assignments" SOT223 (Top View), "Tab is VOUT""
  "1": { name: Adj (GND), type: ground }
  "2": { name: VOUT, type: power }
  "3": { name: VIN, type: power }
