# 30V / 200mA single Schottky diode, SOT23 (Standard). From the page-1
# "BAT54" connection drawing (rendered at 400 dpi): the diode runs from
# the bottom-left lead (anode, triangle base) to the top lead (cathode,
# bar side); the bottom-right lead is not connected to anything.
# Pin numbers are not printed; numbers follow this dataset's sot
# convention (1 bottom-left, 2 bottom-right, 3 top). The drawing is
# not itself labelled "top view" (it sits next to a "Top View" photo)
# -- flagged for review.
schema_version: "0.2"
kind: device
id: diodes/BAT54
manufacturer: diodes
category: diode
family: BAT54
source: diodes/DS11005

parameters:
  forward_voltage:
    - max: 800 mV
      at: { IF: 100 mA }
      src: p2 "Electrical Characteristics, Forward Voltage VF"
    - max: 240 mV
      at: { IF: 0.1 mA }
      src: p2 "Electrical Characteristics, Forward Voltage VF"
    - { max: 320 mV, at: { IF: 1 mA }, src: 'p2 "Electrical Characteristics, Forward Voltage VF"' }
    - { max: 400 mV, at: { IF: 10 mA }, src: 'p2 "Electrical Characteristics, Forward Voltage VF"' }
    - { max: 500 mV, at: { IF: 30 mA }, src: 'p2 "Electrical Characteristics, Forward Voltage VF"' }
  reverse_voltage: { max: 30 V, src: 'p2 "Maximum Ratings, VRRM/VRWM/VR"' }
  forward_current:
    max: 200 mA
    src: p2 "Maximum Ratings, Average Rectified Output Current (Note 5) IO"

pins:
  src: p1 "Connection drawing labelled "BAT54" under "SOT23 (Standard)"; position-derived numbering, see header"
  "1": { name: Anode, type: passive }
  "2": { name: NC, type: nc }
  "3": { name: Cathode, type: passive }
