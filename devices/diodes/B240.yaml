# 2.0A 40V Schottky barrier rectifier (DS13004); used here for the SMB
# versions only.
# Polarity from the page-1 Mechanical Data ("Polarity: Cathode Band or Cathode Notch").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.2"
kind: device
id: diodes/B240
manufacturer: diodes
category: diode
family: B2x0
source: diodes/DS13004

parameters:
  forward_voltage:
    max: 0.5 V
    at: { IF: 2 A, TA: 25 °C }
    src: p2 "Electrical Characteristics, Forward Voltage Drop VF, B220/A, B230/A, B240/A row"
  reverse_voltage: { max: 40 V, src: 'p2 "Maximum Ratings, VRRM/VRWM/VR, B240/A column"' }
  forward_current: { max: 2 A, src: 'p2 "Maximum Ratings, Average Rectified Output Current IO"' }

pins:
  src: 'p1 "Mechanical Data: "Polarity: Cathode Band or Cathode Notch"; numbering by generator convention, see header"'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
