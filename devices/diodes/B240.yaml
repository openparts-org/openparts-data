# 2.0A 40V Schottky barrier rectifier (DS13004); used here for the SMB
# versions only.
# Polarity from the page-1 Mechanical Data ("Polarity: Cathode Band or Cathode Notch").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.1"
kind: device
id: diodes/B240

manufacturer: diodes
category: diode
family: B2x0

pins:
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }

parameters:
  reverse_voltage:
    max: 40
    unit: V
  forward_current:
    max: 2.0
    unit: A
  forward_voltage:
    max: 0.50
    unit: V

provenance:
  "/parameters/reverse_voltage":
    - source: diodes/DS13004
      page: 2
      locator: "Maximum Ratings, VRRM/VRWM/VR, B240/A column: 40 V"
  "/parameters/forward_current":
    - source: diodes/DS13004
      page: 2
      locator: "Maximum Ratings, Average Rectified Output Current IO: 2.0 A (all types)"
  "/parameters/forward_voltage":
    - source: diodes/DS13004
      page: 2
      locator: "Electrical Characteristics, Forward Voltage Drop VF, B220/A, B230/A, B240/A row: Max 0.50 V @ IF = 2.0A, TA = +25°C"
  "/pins":
    - source: diodes/DS13004
      page: 1
      locator: "Mechanical Data: \"Polarity: Cathode Band or Cathode Notch\"; numbering by generator convention, see header"
