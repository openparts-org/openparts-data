# 5.1V (VZ nominal) 500mW Zener diode, SOD123 -- type number and VZ
# from the DS18010 page-2 Electrical Characteristics row "MMSZ5231B".
# Polarity from the page-1 Mechanical Data ("Polarity: Cathode Band").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.2"
kind: device
id: diodes/MMSZ5231B
manufacturer: diodes
category: diode
family: MMSZ52xxB
source: diodes/DS18010

parameters:
  forward_voltage:
    max: 0.9 V
    at: { IF: 10 mA }
    src: 'p2 "Maximum Ratings, Forward Voltage VF: 0.9 V"'
  zener_voltage:
    min: 4.85 V
    typ: 5.1 V
    max: 5.36 V
    src: 'p2 "Electrical Characteristics, MMSZ5231B row: VZ @ IZT Nom 5.1 V, Min 4.85 V, Max 5.36 V (Note 6)"'
  zener_test_current:
    typ: 20 mA
    src: 'p2 "Electrical Characteristics, MMSZ5231B row: Test Current IZT 20 mA"'

pins:
  src: 'p1 "Mechanical Data: "Polarity: Cathode Band"; numbering by generator convention, see header"'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
