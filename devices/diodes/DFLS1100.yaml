# 1.0A 100V Schottky barrier rectifier, PowerDI123 (DS30497).
# Polarity from the page-1 Mechanical Data ("Terminal Connections: Cathode Band").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.1"
kind: device
id: diodes/DFLS1100

manufacturer: diodes
category: diode
family: DFLS

pins:
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }

parameters:
  reverse_voltage:
    max: 100
    unit: V
  forward_current:
    max: 1.0
    unit: A
  forward_voltage:
    max: 0.77
    unit: V

provenance:
  "/parameters/reverse_voltage":
    - source: diodes/DS30497
      page: 2
      locator: "Maximum Ratings, VRRM/VRWM/VR: 100 V"
  "/parameters/forward_current":
    - source: diodes/DS30497
      page: 2
      locator: "Maximum Ratings, Average Forward Current IF(AV): 1.0 A"
  "/parameters/forward_voltage":
    - source: diodes/DS30497
      page: 2
      locator: "Electrical Characteristics, Forward Voltage VF: Max 0.77 V @ IF = 1.0A, TA = +25°C"
  "/pins":
    - source: diodes/DS30497
      page: 1
      locator: "Mechanical Data: \"Terminal Connections: Cathode Band\"; numbering by generator convention, see header"
