# 1.0A 100V Schottky barrier rectifier, PowerDI123 (DS30497).
# Polarity from the page-1 Mechanical Data ("Terminal Connections: Cathode Band").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.2"
kind: device
id: diodes/DFLS1100
manufacturer: diodes
category: diode
family: DFLS
source: diodes/DS30497

parameters:
  forward_voltage:
    - max: 0.77 V
      at: { IF: 1 A, TA: 25 °C }
      src: p2 "Electrical Characteristics, Forward Voltage VF"
    - typ: 0.58 V
      max: 0.62 V
      at: { IF: 1 A, TA: 125 °C }
      src: p2 "Electrical Characteristics, Forward Voltage VF"
    - max: 0.86 V
      at: { IF: 2 A, TA: 25 °C }
      src: p2 "Electrical Characteristics, Forward Voltage VF"
    - typ: 0.65 V
      max: 0.7 V
      at: { IF: 2 A, TA: 125 °C }
      src: p2 "Electrical Characteristics, Forward Voltage VF"
  reverse_voltage: { max: 100 V, src: 'p2 "Maximum Ratings, VRRM/VRWM/VR"' }
  forward_current: { max: 1 A, src: 'p2 "Maximum Ratings, Average Forward Current IF(AV)"' }

pins:
  src: 'p1 "Mechanical Data: "Terminal Connections: Cathode Band"; numbering by generator convention, see header"'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
