# Fast switching small-signal diode, SOD123. Polarity confirmed
# directly from the datasheet's "Mechanical Data" section: "Polarity:
# Cathode Band" -- the banded end is the cathode. The precise spatial
# relationship between the printed marking code and the band itself was
# not visually confirmed (garbled/graphical-only in extraction), only
# the textual "cathode = banded end" fact.
schema_version: "0.1"
kind: device
id: diodes/1N4148W

manufacturer: diodes
category: diode
family: 1N4148W

pins:
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }

parameters:
  reverse_voltage:
    max: 100
    unit: V
  forward_current:
    max: 300
    unit: mA
  forward_voltage:
    max: 1.25
    unit: V

provenance:
  "/parameters/reverse_voltage":
    - source: diodes/DS30086@rev32-2
      page: 2
      locator: "Maximum Ratings, VRRM/VRWM/VR: 100 V"
  "/parameters/forward_current":
    - source: diodes/DS30086@rev32-2
      page: 2
      locator: "Maximum Ratings, Forward Continuous Current IFM: 300 mA"
  "/parameters/forward_voltage":
    - source: diodes/DS30086@rev32-2
      page: 2
      locator: "Electrical Characteristics, Forward Voltage VFM: Max 1.25 V @ IF = 150mA (highest listed test current)"
  "/pins":
    - source: diodes/DS30086
      page: 1
      locator: "\"Mechanical Data\": \"Polarity: Cathode Band\""
