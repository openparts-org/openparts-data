# Fast switching small-signal diode, SOD123. Polarity confirmed
# directly from the datasheet's "Mechanical Data" section: "Polarity:
# Cathode Band" -- the banded end is the cathode. The precise spatial
# relationship between the printed marking code and the band itself was
# not visually confirmed (garbled/graphical-only in extraction), only
# the textual "cathode = banded end" fact.
schema_version: "0.2"
kind: device
id: diodes/1N4148W
manufacturer: diodes
category: diode
family: 1N4148W
source: diodes/DS30086@rev32-2

parameters:
  forward_voltage:
    max: 1.25 V
    at: { IF: 150 mA }
    src: 'p2 "Electrical Characteristics, Forward Voltage VFM: Max 1.25 V (highest listed test current)"'
  reverse_voltage: { max: 100 V, src: 'p2 "Maximum Ratings, VRRM/VRWM/VR: 100 V"' }
  forward_current:
    max: 300 mA
    src: 'p2 "Maximum Ratings, Forward Continuous Current IFM: 300 mA"'

pins:
  src: 'diodes/DS30086 p1 ""Mechanical Data": "Polarity: Cathode Band""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
