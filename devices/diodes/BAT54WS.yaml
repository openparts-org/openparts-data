# 30V 100mA Schottky barrier diode, SOD323 (DS30098).
# Polarity from the page-1 Mechanical Data ("Polarity: Cathode Band").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.2"
kind: device
id: diodes/BAT54WS
manufacturer: diodes
category: diode
family: BAT54WS
source: diodes/DS30098

parameters:
  forward_voltage:
    - max: 1000 mV
      at: { IF: 100 mA }
      src: p2 "Electrical Characteristics, Forward Voltage VFM"
    - max: 240 mV
      at: { IF: 0.1 mA }
      src: p2 "Electrical Characteristics, Forward Voltage VFM"
    - { max: 320 mV, at: { IF: 1 mA }, src: 'p2 "Electrical Characteristics, Forward Voltage VFM"' }
    - max: 400 mV
      at: { IF: 10 mA }
      src: p2 "Electrical Characteristics, Forward Voltage VFM"
    - max: 500 mV
      at: { IF: 30 mA }
      src: p2 "Electrical Characteristics, Forward Voltage VFM"
  reverse_voltage: { max: 30 V, src: 'p2 "Maximum Ratings, VRRM/VRWM/VR"' }
  forward_current:
    max: 200 mA
    src: p2 "Maximum Ratings, Forward Continuous Current (Note 5) IF"

pins:
  src: 'p1 "Mechanical Data: "Polarity: Cathode Band"; numbering by generator convention, see header"'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
