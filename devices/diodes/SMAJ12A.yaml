# 400W unidirectional TVS, VRWM 12V, SMA -- type number from the DS19005
# page-3 Electrical Characteristics row "SMAJ12A" (printed
# "SMAJ12(C)A"; without C = unidirectional).
# Polarity from the page-1 Mechanical Data ("Polarity Indicator: Cathode Band (Bidirectional Devices do not Have a Polarity Indicator)").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.1"
kind: device
id: diodes/SMAJ12A

manufacturer: diodes
category: diode
family: SMAJ

pins:
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }

parameters:
  reverse_voltage:
    max: 12
    unit: V
  forward_voltage:
    max: 3.5
    unit: V

provenance:
  "/parameters/reverse_voltage":
    - source: diodes/DS19005
      page: 3
      locator: "Electrical Characteristics table, row SMAJ12(C)A: Reverse Standoff Voltage VRWM 12 V"
  "/parameters/forward_voltage":
    - source: diodes/DS19005
      page: 2
      locator: "Maximum Ratings, Instantaneous Forward Voltage @ IPP = 35A (Notes 5, 6, 7; unidirectional units only) VF: 3.5 V"
  "/pins":
    - source: diodes/DS19005
      page: 1
      locator: "Mechanical Data: \"Polarity Indicator: Cathode Band (Bidirectional Devices do not Have a Polarity Indicator)\"; numbering by generator convention, see header"
