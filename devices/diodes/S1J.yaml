# 1.0A 600V glass-passivated rectifier, SMA/SMB (DS16003 Maximum Ratings column
# S1J/S1JB).
# One device for both the SMA and SMB ("...B") case versions.
# Polarity from the page-1 Mechanical Data ("Polarity: Cathode Band or Cathode Notch").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.2"
kind: device
id: diodes/S1J
manufacturer: diodes
category: diode
family: S1x
source: diodes/DS16003

parameters:
  forward_voltage:
    max: 1.1 V
    at: { IF: 1 A }
    src: p2 "Electrical Characteristics, Forward Voltage VFM"
  reverse_voltage: { max: 600 V, src: 'p2 "Maximum Ratings, VRRM/VRWM/VR, S1J/JB column"' }
  forward_current:
    max: 1 A
    at: { TT: 100 °C }
    src: p2 "Maximum Ratings, Average Rectified Output Current IO"

pins:
  src: 'p1 "Mechanical Data: "Polarity: Cathode Band or Cathode Notch"; numbering by generator convention, see header"'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
