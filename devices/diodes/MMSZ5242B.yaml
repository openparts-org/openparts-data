# 12V (VZ nominal) 500mW Zener diode, SOD123 -- type number and VZ
# from the DS18010 page-2 Electrical Characteristics row "MMSZ5242B".
# Polarity from the page-1 Mechanical Data ("Polarity: Cathode Band").
# The datasheet names the terminals only by the cathode band and
# prints no pin numbers: numbered in the generator's position
# convention (pin 1 at -X), cathode = 1, anode = 2.
schema_version: "0.1"
kind: device
id: diodes/MMSZ5242B

manufacturer: diodes
category: diode
family: MMSZ52xxB

pins:
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }

parameters:
  zener_voltage:
    nominal: 12
    min: 11.4
    max: 12.6
    unit: V
  zener_test_current:
    nominal: 20
    unit: mA
  forward_voltage:
    max: 0.9
    unit: V

provenance:
  "/parameters/zener_voltage":
    - source: diodes/DS18010
      page: 2
      locator: "Electrical Characteristics, MMSZ5242B row: VZ @ IZT Nom 12 V, Min 11.40 V, Max 12.60 V (Note 6)"
  "/parameters/zener_test_current":
    - source: diodes/DS18010
      page: 2
      locator: "Electrical Characteristics, MMSZ5242B row: Test Current IZT 20 mA"
  "/parameters/forward_voltage":
    - source: diodes/DS18010
      page: 2
      locator: "Maximum Ratings, Forward Voltage @ IF = 10mA VF: 0.9 V"
  "/pins":
    - source: diodes/DS18010
      page: 1
      locator: "Mechanical Data: \"Polarity: Cathode Band\"; numbering by generator convention, see header"
