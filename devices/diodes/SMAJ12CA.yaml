# 400W bidirectional TVS, VRWM 12V, SMA -- type number from the DS19005
# page-3 Electrical Characteristics row "SMAJ12(C)A" with the C suffix (note 8:
# "Suffix C denotes Bi-directional device").
# Page-1 Mechanical Data: bidirectional devices have no polarity
# indicator; the datasheet prints no pin numbers, so the terminals are
# numbered 1 (-X) and 2 (+X) in the generator's position convention and
# named Pin1/Pin2 (no cathode/anode). The VF rating applies to
# unidirectional units only (note 7) and is not recorded.
schema_version: "0.2"
kind: device
id: diodes/SMAJ12CA
manufacturer: diodes
category: diode
family: SMAJ
source: diodes/DS19005

parameters:
  reverse_voltage:
    max: 12 V
    src: p3 "Electrical Characteristics table, SMAJ12(C)A row, VRWM (note 8, C suffix)"
  clamping_voltage:
    max: 19.9 V
    at: { IPP: 20.1 A }
    src: p3 "Electrical Characteristics, SMAJ12(C)A row, Max. Clamping Voltage VC @ IPP"
  peak_pulse_current:
    max: 20.1 A
    src: p3 "Electrical Characteristics, SMAJ12(C)A row, Max. Peak Pulse Current IPP"
  peak_pulse_power: { max: 400 W, src: 'p2 "Maximum Ratings, Peak Pulse Power Dissipation PPK"' }

pins:
  src: p1 "Mechanical Data, Polarity Indicator (none for bidirectional); numbering per header"
  "1": { name: Pin1, type: passive }
  "2": { name: Pin2, type: passive }
