# Würth WL-SMCW 0805 mono-color chip LED, Red (AlInGaP chip, per
# "Optical Properties": "Chip Technology AlInGaP", "Emitting Color
# Red", datasheet page 1). Polarity from the page-1 "Schematic":
# the diode symbol is labelled "-" / "1" at the cathode bar and "+" /
# "2" at the anode, and the dimension drawing numbers the terminals 1
# and 2 with the "Polarity Mark" at terminal 1 -> pin 1 = Cathode,
# pin 2 = Anode.
schema_version: "0.1"
kind: device
id: wurth/150080RS75000

manufacturer: wurth
category: led
family: WL-SMCW

pins:
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }

parameters:
  color:
    value: red
  wavelength:
    nominal: 625
    unit: nm
  forward_voltage:
    nominal: 2
    max: 2.4
    unit: V
  forward_current:
    max: 30
    unit: mA

provenance:
  "/parameters/color":
    - source: wurth/150080RS75000-DS
      page: 1
      locator: "Optical Properties, Emitting Color: Red"
  "/parameters/wavelength":
    - source: wurth/150080RS75000-DS
      page: 2
      locator: "Electrical & Optical Properties, Dominant Wavelength λDom @ 20 mA: typ. 625 nm"
  "/parameters/forward_voltage":
    - source: wurth/150080RS75000-DS
      page: 2
      locator: "Electrical & Optical Properties, Forward Voltage VF @ 20 mA: typ. 2 V, max. 2.4 V"
  "/parameters/forward_current":
    - source: wurth/150080RS75000-DS
      page: 1
      locator: "Absolute Maximum Ratings (Ambient Temperature 25°C), Continuous Forward Current IF: 30 mA"
  "/pins":
    - source: wurth/150080RS75000-DS
      page: 1
      locator: "\"Schematic:\" diode symbol, \"- 1\" at the cathode and \"+ 2\" at the anode; dimension drawing terminal numbers 1/2 and \"Polarity Mark\""
