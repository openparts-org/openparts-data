# Würth WL-SMCW 0603 mono-color chip LED, Blue (InGaN chip, per
# "Optical Properties": "Chip Technology InGaN", "Emitting Color
# Blue", datasheet page 1). Polarity from the page-1 "Schematic":
# the diode symbol is labelled "-" / "1" at the cathode bar and "+" /
# "2" at the anode, and the dimension drawing numbers the terminals 1
# and 2 with the "Polarity Mark" at terminal 1 -> pin 1 = Cathode,
# pin 2 = Anode.
schema_version: "0.2"
kind: device
id: wurth/150060BS75000
manufacturer: wurth
category: led
family: WL-SMCW
source: wurth/150060BS75000-DS

parameters:
  forward_voltage:
    typ: 3.2 V
    max: 3.5 V
    src: 'p2 "Electrical & Optical Properties, Forward Voltage VF @ 20 mA: typ. 3.2 V, max. 3.5 V"'
  forward_current:
    max: 30 mA
    src: 'p1 "Absolute Maximum Ratings (Ambient Temperature 25°C), Continuous Forward Current IF: 30 mA"'
  color: { value: blue, src: 'p1 "Optical Properties, Emitting Color: Blue"' }
  wavelength:
    typ: 470 nm
    src: 'p2 "Electrical & Optical Properties, Dominant Wavelength λDom @ 20 mA: typ. 470 nm"'

pins:
  src: p1 ""Schematic:" diode symbol, "- 1" at the cathode and "+ 2" at the anode; dimension drawing terminal numbers 1/2 and "Polarity Mark""
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
