# Würth WR-COM USB 2.0 Type-C receptacle, horizontal SMT, 16 contacts
# (wurth/629722000214-DS page 2 "Pin Assignment": names as printed).
# The land pattern (page 1) puts two contacts on each outer pad, labelled
# "A1 B12", "A4 B9", "B4 A9", "B1 A12": the footprint numbers those pads
# with the A label; the B contact is connected_to it. The shell slots
# are not numbered or named in the source: pin "S1" "Shield" (the
# material table calls the shell "Shielding").
schema_version: "0.2"
kind: device
id: wurth/629722000214
manufacturer: wurth
category: connector
family: WR-COM
source: wurth/629722000214-DS

pins:
  src:
    - p2 "Pin Assignment table"
    - p1 "Recommended Land Pattern, shared pad labels; shell slots unlabelled (S1)"
  A1:  { name: Ground, type: ground }
  A4:  { name: VBUS, type: power }
  A5:  { name: CC1, type: passive }
  A6:  { name: D+1, type: passive }
  A7:  { name: D-1, type: passive }
  A8:  { name: SBU1, type: passive }
  A9:  { name: VBUS, type: power }
  A12: { name: Ground, type: ground }
  B1:  { name: Ground, type: ground, connected_to: A12 }
  B4:  { name: VBUS, type: power, connected_to: A9 }
  B5:  { name: CC2, type: passive }
  B6:  { name: D+2, type: passive }
  B7:  { name: D-2, type: passive }
  B8:  { name: SBU2, type: passive }
  B9:  { name: VBUS, type: power, connected_to: A4 }
  B12: { name: Ground, type: ground, connected_to: A1 }
  S1:  { name: Shield, type: passive }
