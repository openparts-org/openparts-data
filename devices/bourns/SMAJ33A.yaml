# SMAJ33A: 33V VRWM unidirectional 400W TVS diode, SMA (DO-214AC).
# Electrical row on page 2 (marking JM, VBR 36.7-40.6V @ 1.0mA). Polarity
# from Physical Specifications (page 3): "Cathode band indicates
# unidirectional device". Pin 1 = cathode (banded end) per this
# dataset's diode convention.
schema_version: "0.2"
kind: device
id: bourns/SMAJ33A
manufacturer: bourns
category: diode
family: SMAJ
source: bourns/SMAJ

parameters:
  forward_voltage:
    max: 3.5 V
    at: { IPP: 35 A }
    src: p1 "Max. Instantaneous Forward Voltage (unidirectional), SMAJ5.0A~SMAJ90A"
  reverse_voltage: { max: 33 V, src: 'p2 "Electrical Characteristics, SMAJ33A row, VRWM"' }
  clamping_voltage:
    - max: 53.3 V
      at: { IPP: 7.5 A }
      src: p2 "Electrical Characteristics, SMAJ33A/SMAJ33CA row, Vc @ Ipp (10/1000 µs)"
    - max: 69.3 V
      at: { IPP: 37.5 A }
      src: p2 "Electrical Characteristics, SMAJ33A/SMAJ33CA row, Vc @ Ipp (8/20 µs)"
  peak_pulse_current:
    max: 7.5 A
    src: p2 "Electrical Characteristics, SMAJ33A/SMAJ33CA row, Ipp (10/1000 µs)"
  peak_pulse_power:
    max: 400 W
    src: p1 "Electrical Characteristics, Minimum Peak Pulse Power Dissipation PPK (TP = 1 ms)"

pins:
  src: p3 "Physical Specifications, "Polarity ... Cathode band indicates unidirectional device""
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
