# SMAJ5.0A: 5.0V VRWM unidirectional 400W TVS diode, SMA (DO-214AC).
# Electrical row on page 2 (marking HE, VBR 6.40-7.00V @ 10mA). Polarity
# from Physical Specifications (page 3): "Cathode band indicates
# unidirectional device". Pin 1 = cathode (banded end) per this
# dataset's diode convention.
schema_version: "0.2"
kind: device
id: bourns/SMAJ5.0A
manufacturer: bourns
category: diode
family: SMAJ
source: bourns/SMAJ

parameters:
  forward_voltage:
    max: 3.5 V
    at: { IPP: 35 A }
    src: 'p1 "Maximum Instantaneous Forward Voltage (For Unidirectional Units Only), SMAJ5.0A ~ SMAJ90A: VF 3.5 Volts"'
  reverse_voltage:
    max: 5 V
    src: 'p2 "Electrical Characteristics, row SMAJ5.0A (Marking HE): Working Peak Reverse Voltage VRWM 5.0 V"'

pins:
  src: p3 "Physical Specifications, "Polarity ... Cathode band indicates unidirectional device""
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
