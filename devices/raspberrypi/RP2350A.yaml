# Die marking photographed in the product brief reads "RP2350A0A2" --
# the "A2" stepping code, consistent with the publicly known RP2350 A2
# silicon revision. No earlier-stepping documentation or pin-table
# difference was found in this source, so only A2 is recorded, with no
# overrides. (A later research pass claimed to find A3/A4 steppings with
# specific CHIP_ID.REVISION register values in a "full datasheet" --
# that claim was not independently verified against a primary source we
# actually reviewed, so it is deliberately not included here rather than
# risk recording an unverified register value as fact.)
revisions:
  rev-a2:
    manufacturer_revision: "A2"

provenance:
  "/pins/1/name":
    - source: raspberrypi/RP-008374-DS@rev1
      locator: "Pin legend / RP2350 Minimal KiCad schematic symbol"
  "/pins/EP/name":
