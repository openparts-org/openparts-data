# RP2350A pinout cross-checked between the official Product Brief's pin
# legend (text) and Raspberry Pi's own official "Minimal KiCAD" design
# archive's schematic symbol for RP2350 (an authored Raspberry Pi file,
# not third-party), since the product brief's pinout page is a spatial
# diagram that doesn't extract as clean text.
