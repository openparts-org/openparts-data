# RP2350B pinout (QFN-80) transcribed from the RP2350 Datasheet
# RP-008373-DS rev 3, section 14.8.2.2 "Pin list", "QFN-80 Number"
# column of Table 1674 (GPIO, PDF pages 1333-1334), Table 1675 (QSPI,
# p1334), Tables 1676-1679 (crystal, misc, USB, power, PDF pages
# 1335-1336). A script checked that the table assigns each of pins 1-80
# exactly once. Cross-checked against the "80QFN pinout" diagram in the
# Product Brief RP-008374-DS rev 1 (PDF page 7): same names at the same
# numbers (the diagram also prints a stray "GPIO11" label between pins
# 15 and 16, which the datasheet table does not support -- ignored).
#
# Conventions follow devices/raspberrypi/RP2350A.yaml: GPIOxx_ADCy pins
# are named GPIOxx with ADCy as an alternate function (on QFN-80 the
# ADC inputs are GPIO40-47, not GPIO26-29); XIN/XOUT/SWCLK/QSPI_SCLK are
# `clock`; the "GND -- Ground connection via central exposed pad"
# (Table 1679) is pin key "EP".
# RP2354B (2MB in-package flash) shares this pinout per section 14.3 but
# is a different device; not modelled here.
