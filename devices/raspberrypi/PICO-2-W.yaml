# Raspberry Pi Pico 2 W (RP2350 board), as a 40-pin castellated module plus its
# three SWD debug pads. Transcribed from the Pico 2 W datasheet RP-008304-DS rev 3:
# pin numbers from Figure 4 (pin numbering, PDF page 8), pin names from
# Figure 2 (pinout, PDF page 5) checked against the text list of the
# non-GPIO pins ("PIN40 VBUS ... PIN30 RUN", PDF pages 8-9). The text
# names pin 36 "3V3" (Figure 2 labels it "3V3(OUT)") and pin 33 "AGND" (Figure 2
# shows it as GND with the AGND function): the text names are used.
# Figure 4 labels the debug pads SWCLK, GND, SWDIO left to right without
# numbers, so those labels are the pin keys (as in the package's aux_pads):
# "SWCLK" = SWCLK, "GND" = GND, "SWDIO" = SWDIO.
#
# Types are this dataset's reading of the descriptions: GPx io (Figure 2
# legend "GPIO, PIO, and PWM"); VBUS (micro-USB input), VSYS (main system
# input), 3V3 (SMPS output for external circuitry) and ADC_VREF (ADC supply
# and reference) power; 3V3_EN input (SMPS enable, pulled up to VSYS); RUN
# reset (the MCU enable, "short this pin low" to reset); SWCLK clock and
# SWDIO io as on the RP2040/RP2350 devices. Only the ADC alternate
# functions of GP26-GP28 are recorded; Figure 2's UART/I2C/SPI defaults
# are not. Not on the 40 pins (so not recorded):
# the user LED is the wireless chip's WL_GPIO0;
# GP23/24/25/29 drive the wireless interface (section 2.1).
schema_version: "0.1"
kind: device
id: raspberrypi/PICO-2-W

manufacturer: raspberrypi
category: microcontroller
family: RP2350

