# Silicon revisions confirmed to exist (page 130: bootrom v1/v2/v3 <->
# B0/B1/B2), with B2 the current shipping marking ("RP2-B2", page 610).
# No pinout/pin-behavior difference between revisions is documented in
# the datasheet's pinout chapter, so no overrides are recorded -- an
# absence, not a gap. Revision-detection register (SYSINFO CHIP_ID,
# base 0x40000000 + offset 0x00) is confirmed to exist, but the
# per-revision numeric field values were not found in the pages
# checked, so `mask`/`value` are left unset rather than invented.
revisions:
  rev-b0:
    manufacturer_revision: "B0"
    detection:
      - method: device_register
        register: CHIP_ID
  rev-b1:
    manufacturer_revision: "B1"
    detection:
      - method: device_register
        register: CHIP_ID
  rev-b2:
    manufacturer_revision: "B2"
    detection:
      - method: device_register
        register: CHIP_ID

provenance:
  "/pins/1/name":
    - source: raspberrypi/RP-008371-DS@rev1
      locator: "Chapter 5.5.2, Table 615-621"
  "/pins/EP/name":
    - source: raspberrypi/RP-008371-DS@rev1
      locator: "\"Common ground connection via central pad\""
  "/revisions":
    - source: raspberrypi/RP-008371-DS@rev1
      page: 130
