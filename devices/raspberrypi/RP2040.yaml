# Pinout transcribed from RP2040 Datasheet (Raspberry Pi Ltd), Chapter
# 5.5.2, Tables 615-621 (56 numbered pins, all confirmed) plus the
# central exposed pad (datasheet numbers it pin 57; represented here as
# the "EP" key per Canonical Data Specification section 14, matching
# how the QFN geometry generator keys its Exposed Pad Lead).
#
# `type` is this dataset's categorization of the datasheet's own "Type"
# column (Digital IO / Digital In / Analogue / Power / Ground), not a
# verbatim datasheet field.
schema_version: "0.1"
kind: device
id: raspberrypi/RP2040

manufacturer: raspberrypi
family: RP2040

pins:
  "1":  { name: IOVDD, type: power }
  "2":  { name: GPIO0, type: io }
  "3":  { name: GPIO1, type: io }
  "4":  { name: GPIO2, type: io }
  "5":  { name: GPIO3, type: io }
