# CH32X035 pinout for CH32X035F7P6 (TSSOP20), from WCH CH32X035 datasheet V2.3
# Table 2-1 "CH32X035 Pin definitions" (TSSOP20 column, PDF pages 17-19),
# checked against the Section 2.1 CH32X035F7P6 pinout figure (PDF page 13): same pin at the same numbers.
# Names are the port names (main function after reset).
# Types: VDD power, GND ground, port pins io (table types I/O, I/O/A).
# `alternate_functions`: ADC channels (Table 2-1 "A<n>" = ADC channel n,
# written ADC_IN<n>) and, from the "Default alternate function" column,
# UDM/UDP (USB, PC16/PC17), CC1/CC2 (USB PD, PC14/PC15), DIO/DCK (debug,
# PC18/PC19) and RST where the table and its notes give it to this
# package; timer/USART/SPI/I2C/OPA/CMP functions and remaps (Table 2-3)
# are not listed.
# Note 8 (PDF page 19): PC17 is the BOOT detection pin (high at power-up
# enters the BOOT area).
# CH32X035F7 (CH32X035F7P6, TSSOP20): 62K flash, 20K SRAM (product resource table, PDF page 2).
# Note 4: PC10 shorted inside the chip to PC17 (pin 18), PC11 to PC16
# (pin 17). The RST function on PC3 (pin 4) is available on the TSSOP20
# and QSOP28 packages only (Table 2-3 note 2, PDF page 24).
schema_version: "0.2"
kind: device
id: wch/CH32X035F7
manufacturer: wch
category: microcontroller
family: CH32X035
source: wch/CH32X035DS0@V2.3

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2 V
    max: 5.5 V
    src: p26 "Table 3-2 General operating conditions, VDD, USB/PD function disabled (3.0-5.3 V with USB/PD)"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p25 "Table 3-1 Absolute maximum ratings, TA Ambient temperature during operation"
  esd_hbm:
    typ: 4 kV
    src: p25 "Table 3-1 Absolute maximum ratings, VESD(HBM) common I/O pins 4K V"

pins:
  src:
    - p17 "Table 2-1 CH32X035 Pin definitions, TSSOP20 column (cont. p18-19)"
    - p13 "Section 2.1 CH32X035F7P6 pinout"
  "1":  { name: PB12, type: io }
  "2":  { name: PC14, type: io, alternate_functions: [CC1] }
  "3":  { name: PC15, type: io, alternate_functions: [CC2] }
  "4":  { name: PC3, type: io, alternate_functions: [ADC_IN13, RST] }
  "5":  { name: PC1, type: io, alternate_functions: [ADC_IN11] }
  "6":  { name: PA0, type: io, alternate_functions: [ADC_IN0] }
  "7":  { name: PA1, type: io, alternate_functions: [ADC_IN1] }
  "8":  { name: PA2, type: io, alternate_functions: [ADC_IN2] }
  "9":  { name: PA3, type: io, alternate_functions: [ADC_IN3] }
  "10": { name: PA4, type: io, alternate_functions: [ADC_IN4] }
  "11": { name: PA5, type: io, alternate_functions: [ADC_IN5] }
  "12": { name: PA6, type: io, alternate_functions: [ADC_IN6] }
  "13": { name: PA7, type: io, alternate_functions: [ADC_IN7] }
  "14": { name: PB1, type: io, alternate_functions: [ADC_IN9] }
  "15": { name: GND, type: ground }
  "16": { name: VDD, type: power }
  "17":
    name: PC16
    type: io
    alternate_functions: [UDM]
    diff_pair:
      partner: "18"
      polarity: n
      standard: usb2
      function: UDM
      src: p18 "Table 2-1, PC16 UDM / PC17 UDP default alternate functions"
  "18":
    name: PC17
    type: io
    alternate_functions: [UDP]
    diff_pair:
      partner: "17"
      polarity: p
      standard: usb2
      function: UDP
      src: p18 "Table 2-1, PC16 UDM / PC17 UDP default alternate functions"
  "19": { name: PC18, type: io, alternate_functions: [DIO] }
  "20": { name: PC19, type: io, alternate_functions: [DCK] }
