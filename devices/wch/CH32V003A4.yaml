# CH32V003 pinout for CH32V003A4M6 (SOP16), from WCH CH32V003 datasheet V1.8
# Table 2-1 "Pin definitions" (SOP16 column, PDF pages 13-14), checked
# against the Section 2.1 CH32V003A4M6 pinout figure (PDF page 12): same names at the same
# numbers. Pin names are the port names (main function after reset).
# Types: VDD power, VSS ground, all port pins io (table types I/O, I/O/A,
# I/O/FT).
# `alternate_functions` lists only the ADC channels (A0-A7 = ADC_IN0-7
# per the legend on PDF page 13) and the NRST/SWIO default functions from
# Table 2-1's "Default alternate function" column; timer/USART/I2C/SPI
# functions and remaps (Table 2-2) are not listed.
schema_version: "0.2"
kind: device
id: wch/CH32V003A4
manufacturer: wch
category: microcontroller
family: CH32V003
source: wch/CH32V003DS0@V1.8

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: p17 "Table 3-2 General operating conditions, VDD Standard operating voltage, ADC not used"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p17 "Table 3-2 General operating conditions, TA Ambient temperature (operating)"
  esd_hbm: { typ: 4 kV, src: 'p17 "Absolute maximum ratings, VESD(HBM) 4K V"' }

pins:
  src:
    - p13 "Table 2-1 Pin definitions, SOP16 column (cont. p14)"
    - p12 "Section 2.1 CH32V003A4M6 pinout"
  "1":  { name: PC1, type: io }
  "2":  { name: PC2, type: io }
  "3":  { name: PC3, type: io }
  "4":  { name: PC4, type: io, alternate_functions: [ADC_IN2] }
  "5":  { name: PC6, type: io }
  "6":  { name: PC7, type: io }
  "7":  { name: PD1, type: io, alternate_functions: [SWIO] }
  "8":  { name: PD4, type: io, alternate_functions: [ADC_IN7] }
  "9":  { name: PD5, type: io, alternate_functions: [ADC_IN5] }
  "10": { name: PD6, type: io, alternate_functions: [ADC_IN6] }
  "11": { name: PD7, type: io, alternate_functions: [NRST] }
  "12": { name: PA1, type: io, alternate_functions: [ADC_IN1] }
  "13": { name: PA2, type: io, alternate_functions: [ADC_IN0] }
  "14": { name: VSS, type: ground }
  "15": { name: VDD, type: power }
  "16": { name: PC0, type: io }
