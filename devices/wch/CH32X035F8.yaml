# CH32X035 pinout for CH32X035F8U6 (QFN20), from WCH CH32X035 datasheet V2.3
# Table 2-1 "CH32X035 Pin definitions" (QFN20 column, PDF pages 17-19),
# checked against the Section 2.1 CH32X035F8U6 pinout figure (PDF page 15): same pin at the same numbers.
# Names are the port names (main function after reset).
# Types: VDD power, GND ground, port pins io (table types I/O, I/O/A).
# `alternate_functions`: ADC channels (Table 2-1 "A<n>" = ADC channel n,
# written ADC_IN<n>) and, from the "Default alternate function" column,
# UDM/UDP (USB, PC16/PC17), CC1/CC2 (USB PD, PC14/PC15), DIO/DCK (debug,
# PC18/PC19) and RST where the table and its notes give it to this
# package; timer/USART/SPI/I2C/OPA/CMP functions and remaps (Table 2-3)
# are not listed.
# Note 8 (PDF page 19): PC17 is the BOOT detection pin (high at power-up
# enters the BOOT area).
# CH32X035F8 (CH32X035F8U6, QFN20): 62K flash, 20K SRAM (product resource table, PDF page 2).
# Note 4 exempts this model: PC16/PC17 are not shorted to PC11/PC10.
# Exposed pad: Table 2-1 gives QFN20 pin "0" as GND (P), recorded as pin
# key EP.
schema_version: "0.2"
kind: device
id: wch/CH32X035F8
manufacturer: wch
category: microcontroller
family: CH32X035
source: wch/CH32X035DS0@V2.3

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2 V
    max: 5.5 V
    src: p26 "Table 3-2 General operating conditions, VDD, USB/PD function disabled (3.0-5.3 V with USB/PD)"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p25 "Table 3-1 Absolute maximum ratings, TA Ambient temperature during operation"
  esd_hbm:
    typ: 4 kV
    src: p25 "Table 3-1 Absolute maximum ratings, VESD(HBM) common I/O pins 4K V"

pins:
  src:
    - p17 "Table 2-1 CH32X035 Pin definitions, QFN20 column (cont. p18-19)"
    - p15 "Section 2.1 CH32X035F8U6 pinout"
  "1":  { name: VDD, type: power }
  "2":  { name: PA0, type: io, alternate_functions: [ADC_IN0] }
  "3":  { name: PA1, type: io, alternate_functions: [ADC_IN1] }
  "4":  { name: PA2, type: io, alternate_functions: [ADC_IN2] }
  "5":  { name: PA3, type: io, alternate_functions: [ADC_IN3] }
  "6":  { name: PA4, type: io, alternate_functions: [ADC_IN4] }
  "7":  { name: PA5, type: io, alternate_functions: [ADC_IN5] }
  "8":  { name: PA6, type: io, alternate_functions: [ADC_IN6] }
  "9":  { name: PA7, type: io, alternate_functions: [ADC_IN7] }
  "10": { name: PB0, type: io, alternate_functions: [ADC_IN8] }
  "11": { name: PB1, type: io, alternate_functions: [ADC_IN9] }
  "12": { name: PB3, type: io }
  "13": { name: PB11, type: io }
  "14": { name: PC18, type: io, alternate_functions: [DIO] }
  "15": { name: PB12, type: io }
  "16": { name: PC19, type: io, alternate_functions: [DCK] }
  "17":
    name: PC16
    type: io
    alternate_functions: [UDM]
    diff_pair:
      partner: "18"
      polarity: n
      standard: usb2
      function: UDM
      src: p18 "Table 2-1, PC16 UDM / PC17 UDP default alternate functions"
  "18":
    name: PC17
    type: io
    alternate_functions: [UDP]
    diff_pair:
      partner: "17"
      polarity: p
      standard: usb2
      function: UDP
      src: p18 "Table 2-1, PC16 UDM / PC17 UDP default alternate functions"
  "19": { name: PC14, type: io, alternate_functions: [CC1] }
  "20": { name: PC15, type: io, alternate_functions: [CC2] }
  EP:   { name: GND, type: ground }
