# USB to serial (UART) bridge CH340C (built-in clock, no crystal),
# 16-pin SOP pin map from the Chapter 4 "Pin" table (CH340DS1 V3D pages
# 3-4), column "SOP16 Pin No.", rows naming CH340C for pins 7 (empty pin,
# NC, "must be suspended"), 8 (OUT#, MODEM general output) and 15 (R232).
# Names ending in # are active low and written _N. V3 is the internal
# 3.3 V regulator pin: typed power. supply_voltage: the two printed
# operating modes as disjoint ranges.
schema_version: "0.2"
kind: device
id: wch/CH340C
manufacturer: wch
category: interface
family: CH340
source: wch/CH340DS1@V3D

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    ranges: [{ min: 3.1 V, max: 3.6 V }, { min: 4 V, max: 5.3 V }]
    src:
      - p9 "6.3 3.3V Electrical Parameters, VCC (V3 connected to VCC), CH340C/N/K/E/X/B row"
      - p8 "6.2 5V Electrical Parameters, VCC (V3 only to a capacitor)"
  supply_current:
    - typ: 7 mA
      max: 20 mA
      at: { VCC: 5 V, TA: 25 °C }
      src: p8 "6.2 5V Electrical Parameters, ICC during operation, CH340G/C/N/K/E/X/T/R row"
    - typ: 4 mA
      max: 12 mA
      at: { VCC: 3.3 V, TA: 25 °C }
      src: p9 "6.3 3.3V Electrical Parameters, ICC during operation, CH340G/C/N/K/E/X/T/R row"
  operating_temperature:
    min: -20 °C
    max: 70 °C
    src: p8 "6.1 Absolute Maximum Value, TA ambient temperature during operation, CH340C/N/K/E/X/B row"
  data_rate: { max: 2 Mbps, src: 'p1 "2. Features, communication baud rate of 50bps~2Mbps"' }

pins:
  src:  p3 "4. Pin table, SOP16 Pin No. column (pins 15/7/8 per model note in the description column)"
  "1":  { name: GND, type: ground }
  "2":  { name: TXD, type: output }
  "3":  { name: RXD, type: input }
  "4":  { name: V3, type: power }
  "5":  { name: UD+, type: io }
  "6":  { name: UD-, type: io }
  "7":  { name: NC, type: nc }
  "8":  { name: OUT_N, type: output }
  "9":  { name: CTS_N, type: input }
  "10": { name: DSR_N, type: input }
  "11": { name: RI_N, type: input }
  "12": { name: DCD_N, type: input }
  "13": { name: DTR_N, type: output }
  "14": { name: RTS_N, type: output }
  "15": { name: R232, type: input }
  "16": { name: VCC, type: power }
