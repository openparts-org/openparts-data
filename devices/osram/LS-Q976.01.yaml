# LS Q976.01, Chip LED 0603, super red, dominant 633 nm (InGaAlP).
# The datasheet names the terminals ("cathode" / "anode" on the page-12
# bottom view) but does NOT number them. Keys "1"/"2" are this
# dataset's numbering, chosen as pin 1 = cathode to match the chip LED
# convention used by the Kingbright records -- a dataset convention,
# not a datasheet fact.
schema_version: "0.1"
kind: device
id: osram/LS-Q976.01

manufacturer: osram
category: led
family: "Chip LED 0603"

pins:
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }

parameters:
  color:
    value: red
  wavelength:
    nominal: 633
    min: 627
    max: 639
    unit: nm
  forward_voltage:
    nominal: 2.00
    min: 1.60
    max: 2.40
    unit: V
  forward_current:
    min: 1
    max: 30
    unit: mA

provenance:
  "/parameters/color":
    - source: osram/LS-Q976.01@v1.2
      page: 2
      locator: "Features, Color: λdom = 633 nm (super red)"
  "/parameters/wavelength":
    - source: osram/LS-Q976.01@v1.2
      page: 5
      locator: "Characteristics (IF = 20 mA; TS = 25 °C), Dominant Wavelength λdom: min. 627 nm, typ. 633 nm, max. 639 nm"
  "/parameters/forward_voltage":
    - source: osram/LS-Q976.01@v1.2
      page: 5
      locator: "Characteristics, Forward Voltage VF (IF = 20 mA): min. 1.60 V, typ. 2.00 V, max. 2.40 V"
  "/parameters/forward_current":
    - source: osram/LS-Q976.01@v1.2
      page: 4
      locator: "Maximum Ratings, Forward current IF (TS = 25 °C): min. 1 mA, max. 30 mA"
  "/pins":
    - source: osram/LS-Q976.01@v1.2
      page: 12
      locator: "Dimensional Drawing, bottom view terminals labelled \"cathode\" and \"anode\"; top view \"cathode mark\""
