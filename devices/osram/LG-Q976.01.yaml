# LG Q976.01, Chip LED 0603, green, dominant 573 nm (InGaAlP).
# The datasheet names the terminals ("cathode" / "anode" on the page-12
# bottom view) but does NOT number them. Keys "1"/"2" are this
# dataset's numbering, chosen as pin 1 = cathode to match the chip LED
# convention used by the Kingbright records -- a dataset convention,
# not a datasheet fact.
schema_version: "0.2"
kind: device
id: osram/LG-Q976.01
manufacturer: osram
category: led
family: Chip LED 0603
source: osram/LG-Q976.01@v1.3

parameters:
  forward_voltage:
    min: 1.6 V
    typ: 2 V
    max: 2.4 V
    at: { IF: 20 mA }
    src: 'p5 "Characteristics, Forward Voltage VF: min. 1.60 V, typ. 2.00 V, max. 2.40 V"'
  forward_current:
    min: 1 mA
    max: 30 mA
    at: { TS: 25 °C }
    src: 'p4 "Maximum Ratings, Forward current IF: min. 1 mA, max. 30 mA"'
  color: { value: green, src: 'p2 "Features, Color: λdom = 573 nm (green)"' }
  wavelength:
    min: 569 nm
    typ: 573 nm
    max: 578 nm
    at: { IF: 20 mA, TS: 25 °C }
    src: 'p5 "Characteristics, Dominant Wavelength λdom: min. 569 nm, typ. 573 nm, max. 578 nm"'

pins:
  src: p12 "Dimensional Drawing, bottom view terminals labelled "cathode" and "anode"; top view "cathode mark""
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
