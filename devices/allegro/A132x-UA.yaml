# A1324 / A1325 / A1326 low-noise linear Hall-effect sensor ICs with
# analog output, package UA (3-pin ultramini SIP). One die family with factory-programmed
# sensitivities (5.0 / 3.125 / 2.5 mV/G, Selection Guide page 2); the
# three part numbers are Parts of this device. Pins from the "Terminal
# List Table" (A1324-DS Rev. 9 page 3), column UA: VCC 1, GND 2, VOUT 3, checked
# against the "UA Package" pinout diagram (same page).
# operating_temperature: Operating Characteristics are "Valid throughout
# TA range"; the L range is -40 to 150 °C (Absolute Maximum Ratings).
schema_version: "0.2"
kind: device
id: allegro/A132x-UA
manufacturer: allegro
category: magnetic_sensor
family: A1324
source: allegro/A1324-DS@rev9

# Parameters (AI candidates, needs review).
parameters:
  data_interface:
    value: analog
    src: p1 "Low-Noise Linear Hall-Effect Sensor ICs with Analog Output"
  supply_voltage:
    min: 4.5 V
    max: 5.5 V
    src: p4 "Operating Characteristics, Supply Voltage VCC"
  supply_current:
    typ: 6.9 mA
    max: 9 mA
    at: { VCC: 5 V }
    src: p4 "Operating Characteristics, Supply Current ICC, no load on VOUT"
  operating_temperature:
    min: -40 °C
    max: 150 °C
    src: p2 "Absolute Maximum Ratings, Operating Ambient Temperature TA, L temperature range"
  magnetic_sensor_type:
    value: linear
    src: p1 "Low-Noise Linear Hall-Effect Sensor ICs with Analog Output"
  bandwidth:
    typ: 17 kHz
    src: p4 "Operating Characteristics, Internal Bandwidth BWi, small signal -3 dB"

pins:
  src: ['p3 "Terminal List Table, column UA"', 'p3 "Pinout Diagrams, UA Package"']
  "1": { name: VCC, type: power }
  "2": { name: GND, type: ground }
  "3": { name: VOUT, type: output }
