# ACS711 Hall-effect linear current sensor with overcurrent fault
# output, LC package (8-pin SOICN). Pins from the Terminal List Table,
# column LC (page 3): 1 and 2 IP+, 3 and 4 IP- ("terminals for current
# being sensed; fused internally" -> pin 2 connected_to 1, pin 4
# connected_to 3, typed passive), GND ground, FAULT (overcurrent fault,
# active low) output, VIOUT (analog output) analog, VCC power;
# cross-checked against the LC Package pinout diagram (same page). The
# 12-contact EX (QFN) package has another pin map and is not covered.
# The tree has no current-sensor node; the sensor group is used (as
# ACS724). operating_temperature depends on the temperature range letter
# (E / K) and is recorded on each Part.
schema_version: "0.2"
kind: device
id: allegro/ACS711-LC
manufacturer: allegro
category: sensor
family: ACS711
source: allegro/ACS711A-DS-rev9

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 3 V
    typ: 3.3 V
    max: 5.5 V
    src: p4 "Common Operating Characteristics, Supply Voltage VCC"
  supply_current:
    typ: 4 mA
    max: 5.5 mA
    at: { VCC: 3.3 V }
    src: p4 "Common Operating Characteristics, Supply Current ICC, output open"

pins:
  src: p3 "Terminal List Table, column LC; LC Package pinout diagram"
  "1": { name: IP+, type: passive }
  "2": { name: IP+, type: passive, connected_to: "1" }
  "3": { name: IP-, type: passive }
  "4": { name: IP-, type: passive, connected_to: "3" }
  "5": { name: GND, type: ground }
  "6": { name: FAULT, type: output }
  "7": { name: VIOUT, type: analog }
  "8": { name: VCC, type: power }
