# ACS712 Hall-effect linear current sensor IC, SOIC8. Pins from the
# Terminal List (page 4): 1 and 2 IP+, 3 and 4 IP- ("terminals for
# current being sampled; fused internally" -> pin 2 connected_to 1, pin 4
# connected_to 3, typed passive), GND ground, FILTER (external bandwidth
# capacitor) and VIOUT (analog output) analog, VCC power; cross-checked
# against the Pinout Diagram on the same page. The tree has no current
# sensor node; the sensor group is used.
schema_version: "0.2"
kind: device
id: allegro/ACS712
manufacturer: allegro
category: sensor
family: ACS712
source: allegro/ACS712-DS-rev22

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage: { min: 4.5 V, max: 5.5 V, src: 'p5 "Common Operating Characteristics, VCC"' }
  supply_current:
    typ: 10 mA
    max: 13 mA
    at: { VCC: 5 V }
    src: p5 "Common Operating Characteristics, ICC, output open"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p5 "Common Operating Characteristics: over full range of TA; p2 TA Range E = -40 to 85 C"'

pins:
  src: p4 "Terminal List; Pinout Diagram"
  "1": { name: IP+, type: passive }
  "2": { name: IP+, type: passive, connected_to: "1" }
  "3": { name: IP-, type: passive }
  "4": { name: IP-, type: passive, connected_to: "3" }
  "5": { name: GND, type: ground }
  "6": { name: FILTER, type: analog }
  "7": { name: VIOUT, type: analog }
  "8": { name: VCC, type: power }
