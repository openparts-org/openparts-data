# ACS725 Hall-effect linear current sensor IC, SOIC8. Pins from the
# Terminal List (page 5): 1 and 2 IP+, 3 and 4 IP- ("terminals for
# current being sampled; fused internally" -> pin 2 connected_to 1, pin 4
# connected_to 3, typed passive), GND ground, FILTER (external bandwidth
# capacitor) and VIOUT (analog output) analog, VCC power; cross-checked
# against the Pinout Diagram on the same page. The tree has no current
# sensor node; the sensor group is used.
