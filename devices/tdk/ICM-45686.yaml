# TDK InvenSense ICM-45686, 14-pin LGA. Pin names as printed in the pin table (pages 27-30; Figure 4 Pin Out Diagram on page 31)
# "Signal Descriptions" / Pin Name column (section 4.1, page 27) of DS-000577;
# numbers checked against the "Pin Out Diagram" figure. The table has no
# I/O-type column: types are taken from the descriptions -- "power supply
# voltage"/"IO power supply voltage" -> power, "Power supply ground" ->
# ground, RESV -> reserved, chip select and serial clock (slave inputs)
# -> input, interrupt pins -> output (pin 9 doubles as FSYNC/CLKIN input -> io); pins 2, 3, 10, 11 are RESV in single-interface mode and AUX1/I2C-master
# signals otherwise -> io, multi-function data pins
# -> io.
schema_version: "0.2"
kind: device
id: tdk/ICM-45686
manufacturer: tdk
category: imu
family: ICM-45686
source: tdk/DS-000577@rev1.0

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.71 V
    max: 3.6 V
    src: p20 "D.C. Electrical Characteristics, Supply Voltages VDD"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p20 "Specified Temperature Range row, end of Table 2 Accelerometer Specifications (specified)"
  esd_hbm:
    typ: 2 kV
    src: p26 "Absolute Maximum Ratings, Electrostatic Discharge (ESD) Protection, 2 kV (HBM)"

pins:
  src:  p27 "the pin table (pages 27-30; Figure 4 Pin Out Diagram on page 31) Signal Descriptions; Pin Out Diagram figure"
  "1":  { name: AP_SDO / AP_AD0, type: io }
  "2":  { name: RESV / AUX1_SDIO / AUX1_SDI / MAS_DA, type: io }
  "3":  { name: RESV / AUX1_SCLK / MAS_CLK, type: io }
  "4":  { name: INT1 / INT, type: output }
  "5":  { name: VDDIO, type: power }
  "6":  { name: GND, type: ground }
  "7":  { name: RESV, type: reserved }
  "8":  { name: VDD, type: power }
  "9":  { name: INT2 / FSYNC / CLKIN, type: io }
  "10": { name: RESV / AUX1_CS, type: io }
  "11": { name: RESV / AUX1_SDO, type: io }
  "12": { name: AP_CS, type: input }
  "13": { name: AP_SCL / AP_SCLK, type: input }
  "14": { name: AP_SDA / AP_SDIO / AP_SDI, type: io }
