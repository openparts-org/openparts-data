  "2": { name: "RESV / AUX1_SDIO / AUX1_SDI / MAS_DA", type: io }
  "3": { name: "RESV / AUX1_SCLK / MAS_CLK", type: io }
  "4": { name: "INT1 / INT", type: output }
  "5": { name: "VDDIO", type: power }
  "6": { name: "GND", type: ground }
  "7": { name: "RESV", type: reserved }
  "8": { name: "VDD", type: power }
  "9": { name: "INT2 / FSYNC / CLKIN", type: io }
  "10": { name: "RESV / AUX1_CS", type: io }
  "11": { name: "RESV / AUX1_SDO", type: io }
  "12": { name: "AP_CS", type: input }
  "13": { name: "AP_SCL / AP_SCLK", type: input }
  "14": { name: "AP_SDA / AP_SDIO / AP_SDI", type: io }

