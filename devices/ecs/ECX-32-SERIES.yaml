# ECS ECX-32 fundamental-mode SMD crystal, 4-pad 3.2 x 2.5 mm ceramic
# package. Pin names from the p1 "Pad Connections" table (1 In/Out,
# 2 Gnd, 3 Out/In, 4 Gnd; "pad 1 & 3 are interchangeable"); numbers
# checked against the TOP VIEW (crystal between #1 and #3).
schema_version: "0.2"
kind: device
id: ecs/ECX-32-SERIES
manufacturer: ecs
category: crystal
family: ECX-32
source: ecs/ECX-32

# Parameters (AI candidates, needs review).
parameters:
  aging:
    tol: ±5 ppm
    at: { TA: 25 °C }
    src: p1 "ELECTRICAL CHARACTERISTICS, Aging (First Year) @ +25°C ±3°C"
  drive_level:       { max: 100 µW, src: 'p1 "ELECTRICAL CHARACTERISTICS, Drive Level DL"' }
  shunt_capacitance: { max: 5 pF, src: 'p1 "ELECTRICAL CHARACTERISTICS, Shunt Capacitance Co"' }

pins:
  src: p1 "Pad Connections table; Figure 1 TOP VIEW"
  "1": { name: In/Out, type: passive }
  "2": { name: Gnd, type: ground }
  "3": { name: Out/In, type: passive }
  "4": { name: Gnd, type: ground }
