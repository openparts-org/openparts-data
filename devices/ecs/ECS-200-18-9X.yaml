# Through-hole tubular crystal can, both wire leads exiting one end
# (per the datasheet's own drawing) -- physically the same can shape as
# this dataset's other `radial` family parts (electrolytic caps, dome
# LEDs, the HC-49/U crystal can), not a true `axial` part. Lead count
# not explicitly stated as "2" in words anywhere in the document, but
# the drawing shows exactly 2 parallel leads and the electrical table
# implies no 3rd/4th pin.
schema_version: "0.2"
kind: device
id: ecs/ECS-200-18-9X
manufacturer: ecs
category: crystal
family: 3x9X
source: ecs/ECS-3x10X-3x9X

# Parameters (AI candidates, needs review).
parameters:
  frequency_stability:
    tol: ±50 ppm
    at: { TA: -10..60 °C }
    src: p1 "ELECTRICAL CHARACTERISTICS, Frequency Stability, -10 ~ +60°C"
  aging:
    tol: ±5 ppm
    at: { TA: 25 °C }
    src: p1 "ELECTRICAL CHARACTERISTICS, Aging (First Year) @ +25°C ±3°C"
  drive_level:
    min: 50 µW
    max: 100 µW
    src: p1 "ELECTRICAL CHARACTERISTICS, Drive Level DL (50 ~ 100)"
  shunt_capacitance: { max: 5 pF, src: 'p1 "ELECTRICAL CHARACTERISTICS, Shunt Capacitance C0"' }
  operating_temperature:
    min: -10 °C
    max: 60 °C
    src: p1 "ELECTRICAL CHARACTERISTICS, Operating Temperature Topr"

pins:
  src: p1 "Figure 2 "3x9X" outline drawing, 2 parallel wire leads"
  "1": { name: XTAL1, type: passive }
  "2": { name: XTAL2, type: passive }
