# 32.768kHz SMD tuning fork crystal, 2-pad (confirmed via the
# datasheet's own "PAD CONNECTIONS" table: Pad 1 = In/Out, Pad 2 =
# Out/In -- both are crystal electrodes, no GND/case pad, unlike
# Abracon's ABM8/ABM10 series which are 4-pad). Electrically symmetric,
# named XTAL1/XTAL2 only to satisfy this dataset's distinct-pin-name
# requirement, same as abracon/AB-8MHZ.
schema_version: "0.2"
kind: device
id: ecs/ECX-12-SERIES
manufacturer: ecs
category: crystal
family: ECX-12
source: ecs/ECX_12

# Parameters (AI candidates, needs review).
parameters:
  aging:
    tol: ±3 ppm
    at: { TA: 25 °C }
    src: p1 "ELECTRICAL CHARACTERISTICS, Aging (First Year) @ +25°C ±3°C"
  drive_level: { typ: 0.1 µW, max: 0.5 µW, src: 'p1 "ELECTRICAL CHARACTERISTICS, Drive Level DL"' }
  shunt_capacitance: { typ: 1.3 pF, src: 'p1 "ELECTRICAL CHARACTERISTICS, Shunt Capacitance Co"' }
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p1 "ELECTRICAL CHARACTERISTICS, Operating Temperature Topr"

pins:
  src: p1 ""PAD CONNECTIONS" table"
  "1": { name: XTAL1, type: passive }
  "2": { name: XTAL2, type: passive }
