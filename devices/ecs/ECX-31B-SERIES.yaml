# 32.768kHz 2-pad SMD crystal, 3.2 x 1.5 mm. Pad roles from the
# datasheet's PAD CONNECTIONS (page 1): In/Out and Out/In.
schema_version: "0.2"
kind: device
id: ecs/ECX-31B-SERIES
manufacturer: ecs
category: crystal
family: ECX-31B
source: ecs/ECX-31B

# Parameters (AI candidates, needs review).
parameters:
  aging:
    tol: ±3 ppm
    at: { TA: 25 °C }
    src: p1 "ELECTRICAL CHARACTERISTICS, Aging (First Year) @ +25°C ±3°C"
  drive_level: { typ: 0.1 µW, max: 1 µW, src: 'p1 "ELECTRICAL CHARACTERISTICS, Drive Level DL"' }
  shunt_capacitance: { typ: 1.05 pF, src: 'p1 "ELECTRICAL CHARACTERISTICS, Shunt Capacitance Co"' }
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p1 "ELECTRICAL CHARACTERISTICS, Operating Temperature Topr"

pins:
  src: p1 "PAD CONNECTIONS table"
  "1": { name: XTAL1, type: passive }
  "2": { name: XTAL2, type: passive }
