# Arduino Nano ESP32: the pins of the module package standards/MODULE30-18x43-P2.54-ARDUINO-NANO-ESP32,
# named after the datasheet header tables (see below).
# Types are this dataset's reading of the net names (GND ground; supply nets power;
# reset nets reset; others io). AI candidate, needs review.
# connected_to: a second header pad on the same design net as an earlier pin.
# Nano ESP32: names from the datasheet tables 12.1 Analog (JP1) / 12.2 Digital (JP2) (PDF page 16);
# JP1 pin n = design pad n (net check: pad 12 VUSB, 14 GND, 15 VIN), JP2 pin n = design pad 16 - n
# (design pad 4 GND = table pin 12, pad 3 RESET = pin 13). "+3V3" recorded as 3V3.
