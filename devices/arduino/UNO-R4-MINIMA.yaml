# Arduino UNO R4 Minima: the pins of the module package standards/MODULE32-69x53-P2.54-ARDUINO-UNO-R4,
# named after the datasheet header tables (see below).
# Types are this dataset's reading of the net names (GND ground; supply nets power;
# reset nets reset; others io). AI candidate, needs review.
# connected_to: a second header pad on the same design net as an earlier pin.
# R4 Minima: names from the datasheet tables 10.1 Analog / 10.2 Digital (PDF page 13), header
# pin 1 at the left end of each row as in the UNO layout; the table prints D0 as "D0/TX0".
