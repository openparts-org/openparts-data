# Arduino Nano: the pins of the module package standards/MODULE30-18x43-P2.54-ARDUINO-NANO,
# named after the net each header pad connects to in the maker's design file (arduino/A000005-cad-files@V3.3).
# Types are this dataset's reading of the net names (GND ground; supply nets power;
# reset nets reset; others io). AI candidate, needs review.
# The Nano design names its ground net "COM"; recorded as GND.
# connected_to: a second header pad on the same design net as an earlier pin.
schema_version: "0.2"
kind: device
id: arduino/NANO
manufacturer: arduino
category: development_board
family: ATmega328P
source: arduino/A000005-cad-files@V3.3

pins:
