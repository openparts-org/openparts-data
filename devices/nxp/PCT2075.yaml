# PCT2075 I2C-bus Fm+ digital temperature sensor and thermal watchdog.
# Pins from Table 3 "Pin description for SO8, TSSOP8 and HWSON8" (page
# 5). SDA open-drain I/O (io), SCL "digital input" (input), OS
# open-drain output. The TSOP6 numbering (Table 4) differs and is not
# covered.
schema_version: "0.2"
kind: device
id: nxp/PCT2075
manufacturer: nxp
category: temperature_sensor
family: PCT2075
source: nxp/PCT2075@rev10.1

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: p19 "Table 19 Recommended operating characteristics, VCC supply voltage"
  supply_current:
    typ: 125 µA
    max: 300 µA
    src: p20 "Table 20 Static characteristics, ICC(AV) average supply current, normal mode, I2C-bus inactive"
  operating_temperature:
    min: -55 °C
    max: 125 °C
    src: p19 "Table 19 Recommended operating characteristics, Tamb ambient temperature"
  esd_hbm: { typ: 2 kV, src: 'p2 "2 Features, ESD protection exceeds 2000 V HBM per JESD22-A114"' }

pins:
  src: p5 "Table 3 Pin description for SO8, TSSOP8 and HWSON8"
  "1": { name: SDA, type: io }
  "2": { name: SCL, type: input }
  "3": { name: OS, type: output }
  "4": { name: GND, type: ground }
  "5": { name: A2, type: input }
  "6": { name: A1, type: input }
  "7": { name: A0, type: input }
  "8": { name: VCC, type: power }
