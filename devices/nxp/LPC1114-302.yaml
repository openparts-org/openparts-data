# LPC1114FBD48/302: ARM Cortex-M0, LPC1100L series, 32KB flash / 8KB
# SRAM, power profiles enabled, -40 to +85C ("F" temp grade). Pinout is
# specific to Table 8 ("LPC1100 and LPC1100L series: LPC1113/14 pin
# description table (LQFP48 package)", pages 29-32) -- this table
# applies to the /301 and /302 ordering options specifically; the
# LPC1100XL-series /303 variant uses a different pin table (Table 10)
# with an extended timer-mux pinout, so it is a different Device, not
# modeled here.
#
# `name` uses the pin diagram's own composite label (Fig. 3, page 13),
# e.g. "PIO2_6" or "RESET/PIO0_0" as printed, not a single selected
# function. `type` reflects the pin's primary/default role; most pins
# are multi-function GPIO (`io`) with additional analog/timer/UART/etc.
# alternate functions available via the IOCONFIG block (Table 6-2-style
# mux, not individually modeled here -- out of scope for this pass,
# same policy as this dataset's other MCU pin tables).
