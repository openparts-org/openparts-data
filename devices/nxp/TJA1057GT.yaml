# TJA1057 high-speed CAN transceiver, variants without VIO (TJA1057T,
# TJA1057GT, TJA1057GTK...): Table 3 "Pin description" (page 5) -- pin 5
# "n.c." for these variants -- cross-checked against Figure 2 (same
# page). S Silent mode control input.
# SO8 variant (no exposed pad).
schema_version: "0.2"
kind: device
id: nxp/TJA1057GT
manufacturer: nxp
category: can_transceiver
family: TJA1057
source: nxp/TJA1057@rev8.1

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 4.5 V
    max: 5.5 V
    src: 'p9 "Table 7 Static characteristics, Supply; pin VCC: VCC"'
  esd_hbm: { typ: 4 kV, src: 'p8 "Table 5 Limiting values, VESD HBM on any pin (CANH/CANL ±8 kV)"' }
  data_rate:
    max: 5 Mbit/s
    src: p2 "2.4 TJA1057 CAN FD (all variants except TJA1057T), data rates up to 5 Mbit/s"
  bus_fault_voltage:
    min: -42 V
    max: 42 V
    src: p8 "Table 5 Limiting values, Vx on pins CANH, CANL"

pins:
  src: p5 "Table 3 Pin description (n.c. variants); Figure 2"
  "1": { name: TXD, type: input }
  "2": { name: GND, type: ground }
  "3": { name: VCC, type: power }
  "4": { name: RXD, type: output }
  "5": { name: n.c., type: nc }
  "6": { name: CANL, type: io }
  "7": { name: CANH, type: io }
  "8": { name: S, type: input }
