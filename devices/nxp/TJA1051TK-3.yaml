# High-speed CAN transceiver TJA1051 (NXP data sheet Rev. 9). Pin
# description from Table 3 (page 4) -- text-extracted -- checked against
# the rendered Fig 2 "Pin configuration diagrams" (page 4, encoded font).
# S (Silent mode control input) typed input; CANH/CANL bus lines io.
# Variant TJA1051TK/3 (HVSON8, SOT782-1): pin 5 VIO, typed power. Table
# 3 note [1]: the die supply ground is connected to both the GND pin and
# the exposed center pad -> EP pin named GND, typed ground.
schema_version: "0.2"
kind: device
id: nxp/TJA1051TK-3
manufacturer: nxp
category: can_transceiver
family: TJA1051
source: nxp/TJA1051@rev9

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 4.5 V
    max: 5.5 V
    src: 'p8 "Table 7 Static characteristics, Supply; pin VCC: VCC"'
  esd_hbm:
    typ: 4 kV
    src: p7 "Table 5 Limiting values, VESD HBM at any other pin (CANH/CANL ±8 kV)"
  data_rate:
    max: 5 Mbit/s
    src: 'p1 "2.1 General: Timing guaranteed for data rates up to 5 Mbit/s (CAN FD fast phase)"'
  bus_fault_voltage:
    min: -58 V
    max: 58 V
    src: p7 "Table 5 Limiting values, Vx on pins CANH, CANL"

pins:
  src:
    - p4 "Table 3 "Pin description", pin 5 row for TJA1051TK/3 (VIO)"
    - p4 "Fig 2d "TJA1051TK/3 - HVSON8" (transparent top view) (cross-check)"
  "1": { name: TXD, type: input }
  "2": { name: GND, type: ground }
  "3": { name: VCC, type: power }
  "4": { name: RXD, type: output }
  "5": { name: VIO, type: power }
  "6": { name: CANL, type: io }
  "7": { name: CANH, type: io }
  "8": { name: S, type: input }
  EP:
    name: GND
    type: ground
    src: p4 "Table 3 note [1] - die supply ground connected to the GND pin and the exposed center pad"
