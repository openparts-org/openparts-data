    - p12 "Table 4 "Pin description" (pages 12-16), columns "LQFP48" and "HVQFN48""
    - p9 "Fig 5 "Pin configuration LQFP48 package" and Fig 6 (page 10) HVQFN48 (cross-check, all 48 pins matched)"
