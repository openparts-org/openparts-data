# LPC845M301 (Cortex-M0+, 64KB flash / 16KB SRAM), 48-pin pin map
# shared by the LQFP48 (SOT313-2) and HVQFN48 (SOT619-1) packages:
# Table 4 "Pin description" (LPC84x Rev. 2.1, pages 12-16) gives
# identical numbers in its "LQFP48" and "HVQFN48" columns. Names are the
# Table 4 "Symbol" strings (fixed-pin functions only; movable switch-
# matrix functions are not modelled). Cross-checked visually against
# Fig 5 "Pin configuration LQFP48 package" (page 9) and Fig 6 "Pin
# configuration HVQFN48 package" (page 10): all 48 pins match.
#
# No "EP" pin: unlike HVQFN33 (Table 4 note [11], "Thermal pad for
# HVQFN33" on VSS), the data sheet does not say what the HVQFN48
# exposed pad connects to, so it is left unknown.
schema_version: "0.2"
kind: device
id: nxp/LPC845M301-48
manufacturer: nxp
category: microcontroller
family: LPC84x
source: nxp/LPC84x@rev2.1

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.8 V
    max: 3.6 V
    src: p46 "Table 11 General operating conditions, VDD supply voltage (core and external rail)"
  operating_temperature:
    min: -40 °C
    max: 105 °C
    src: 'p46 "Table 11 General operating conditions header: Tamb = -40 to +105 C (specified)"'
  esd_hbm:
    typ: 2 kV
    src: p44 "Table 9 Limiting values, Vesd human body model; all pins, 2000 V"

pins:
