# PCA9515A I2C-bus repeater. Pins from Table 2 "Pin description", column
# "SO8, TSSOP8" (page 3), cross-checked against Fig 2/Fig 3 (same page).
# SCLn/SDAn are open-drain I/O (io); EN active HIGH enable input. The
# HWSON8 numbering differs and is not covered.
schema_version: "0.2"
kind: device
id: nxp/PCA9515A
manufacturer: nxp
category: interface
family: PCA9515A
source: nxp/PCA9515A@rev5

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2.3 V
    max: 3.6 V
    src: 'p1 "2. Features: Operating supply voltage range"'
  supply_current:
    typ: 1.7 mA
    max: 5 mA
    at: { VCC: 3..3.6 V }
    src: p7 "Table 4 Static characteristics (VCC = 3.0 V to 3.6 V), ICCL, both channels LOW"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p7 "Table 4 Static characteristics header: Tamb = -40 to +85 C (specified)"'
  esd_hbm: { typ: 2 kV, src: 'p2 "2. Features: ESD protection exceeds 2000 V HBM per JESD22-A114"' }
  channel_count: { value: "2", src: 'p1 "2. Features: 2-channel, bidirectional buffer"' }
  propagation_delay:
    min: 33 ns
    typ: 102 ns
    max: 180 ns
    at: { VCC: 3..3.6 V }
    src: p9 "Table 7 Dynamic characteristics (VCC = 3.0 V to 3.6 V), tPLH (slower than tPHL)"

pins:
  src: p3 "Table 2 Pin description, SO8/TSSOP8 column; Fig 2, Fig 3"
  "1": { name: n.c., type: nc }
  "2": { name: SCL0, type: io }
  "3": { name: SDA0, type: io }
  "4": { name: GND, type: ground }
  "5": { name: EN, type: input }
  "6": { name: SDA1, type: io }
  "7": { name: SCL1, type: io }
  "8": { name: VCC, type: power }
