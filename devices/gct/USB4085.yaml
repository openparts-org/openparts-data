# GCT USB4085 USB 2.0 Type-C receptacle, 16 contacts + shell
# (gct/USB4085-DWG page 1 pin table "Pin / Signal / Mating Sequence"; names as
# in the table's text layer (pdftotext): GND, VBUS, CC1/CC2, Dp1/Dn1,
# Dp2/Dn2, SBU1/SBU2; "SHELL" signal "GND").
# Through-hole: every contact has its own hole (no shared pads).
schema_version: "0.2"
kind: device
id: gct/USB4085
manufacturer: gct
category: connector
family: USB4085
source: gct/USB4085-DWG

pins:
  src:
    - 'p1 "Pin table: A1 GND, A4 VBUS, A5 CC1, A6 Dp1, A7 Dn1, A8 SBU1, A9 VBUS, A12 GND, B12 GND, B9 VBUS, B8 SBU2, B7 Dn2, B6 Dp2, B5 CC2, B4 VBUS, B1 GND, SHELL GND"'
    - p2 ""Recommended PCB Layout" pad labels (A1..A12 and B12..B1, one hole each)"
  A1:    { name: GND, type: ground }
  A4:    { name: VBUS, type: power }
  A5:    { name: CC1, type: passive }
  A6:
    name: Dp1
    type: passive
    diff_pair:
      partner: A7
      polarity: p
      standard: usb2
      src: 'p1 "Pin table: "A6 Dp1", "A7 Dn1", "B6 Dp2", "B7 Dn2" (D+/D- of each USB 2.0 contact row)"'
  A7:
    name: Dn1
    type: passive
    diff_pair:
      partner: A6
      polarity: n
      standard: usb2
      src: 'p1 "Pin table: "A6 Dp1", "A7 Dn1", "B6 Dp2", "B7 Dn2" (D+/D- of each USB 2.0 contact row)"'
  A8:    { name: SBU1, type: passive }
  A9:    { name: VBUS, type: power }
  A12:   { name: GND, type: ground }
  B1:    { name: GND, type: ground }
  B4:    { name: VBUS, type: power }
  B5:    { name: CC2, type: passive }
  B6:
    name: Dp2
    type: passive
    diff_pair:
      partner: B7
      polarity: p
      standard: usb2
      src: 'p1 "Pin table: "A6 Dp1", "A7 Dn1", "B6 Dp2", "B7 Dn2" (D+/D- of each USB 2.0 contact row)"'
  B7:
    name: Dn2
    type: passive
    diff_pair:
      partner: B6
      polarity: n
      standard: usb2
      src: 'p1 "Pin table: "A6 Dp1", "A7 Dn1", "B6 Dp2", "B7 Dn2" (D+/D- of each USB 2.0 contact row)"'
  B8:    { name: SBU2, type: passive }
  B9:    { name: VBUS, type: power }
  B12:   { name: GND, type: ground }
  SHELL: { name: GND, type: ground }
