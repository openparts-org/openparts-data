# GCT USB4135 power-only Type-C receptacle ("For Power Charging Only"),
# 6 contacts + shell (gct/USB4135-DWG page 1 pin table "Pin / Signal /
# Mating Sequence"; names as in the table's text layer: CC1/CC2, VBUS,
# GND; "SHELL" signal "GND"). Each contact has its own land pad.
schema_version: "0.2"
kind: device
id: gct/USB4135
manufacturer: gct
category: connector
family: USB4135
source: gct/USB4135-DWG

pins:
  src:   p1 "Pin table"
  A5:    { name: CC1, type: passive }
  A9:    { name: VBUS, type: power }
  A12:   { name: GND, type: ground }
  B5:    { name: CC2, type: passive }
  B9:    { name: VBUS, type: power }
  B12:   { name: GND, type: ground }
  SHELL: { name: GND, type: ground }
