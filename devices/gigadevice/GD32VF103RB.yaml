# GD32VF103RB: RISC-V 32-bit MCU, 128 KB flash (64-pin LQFP). Pin numbers,
# names and I/O types from Table 2-5 "GD32VF103Rx LQFP64 pin definitions" (PDF pages 27-30)
# every pin cross-checked against Figure 2-3 "GD32VF103Rx LQFP64 pinouts" (PDF page 13) --
# all 64 matched.
#
# Names follow the pin-definition table's "Pin Name" column, except pins
# 5/6, where the table prints "OSCIN"/"OSCOUT" (Default) with "Remap: PD0"/
# "Remap: PD1"; the composite names "PD0-OSCIN"/"PD1-OSCOUT" are the labels
# printed in the pinout figure. Types: table Pin Type "P" -> power (VDD*,
# VBAT) / ground (VSS*); "I" -> input (BOOT0, OSCIN); "O" -> output
# (OSCOUT); NRST (I/O) -> reset; other I/O -> io. Alternate functions are
# not modelled (same policy as the dataset's other MCU devices).
