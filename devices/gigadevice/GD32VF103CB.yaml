# GD32VF103CB: RISC-V 32-bit MCU, 128 KB flash (48-pin LQFP). Pin numbers,
# names and I/O types from Table 2-6 "GD32VF103Cx LQFP48 pin definitions" (PDF pages 31-33)
# every pin cross-checked against Figure 2-4 "GD32VF103Cx LQFP48 pinouts" (PDF page 14) --
# all 48 matched.
#
# Names follow the pin-definition table's "Pin Name" column, except pins
# 5/6, where the table prints "OSCIN"/"OSCOUT" (Default) with "Remap: PD0"/
# "Remap: PD1"; the composite names "PD0-OSCIN"/"PD1-OSCOUT" are the labels
# printed in the pinout figure. Types: table Pin Type "P" -> power (VDD*,
# VBAT) / ground (VSS*); "I" -> input (BOOT0, OSCIN); "O" -> output
# (OSCOUT); NRST (I/O) -> reset; other I/O -> io. Alternate functions are
# not modelled (same policy as the dataset's other MCU devices).
schema_version: "0.2"
kind: device
id: gigadevice/GD32VF103CB
manufacturer: gigadevice
category: microcontroller
family: GD32VF103
source: gigadevice/GD32VF103_Datasheet@rev1.6

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2.6 V
    max: 3.6 V
    src: p48 "Table 4-2 DC operating conditions, VDD Supply voltage"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p48 "Table 4-1 Absolute maximum ratings, TA Operating temperature range"
  esd_hbm: { typ: 5 kV, src: 'p56 "Table 4-10 ESD characteristics, VESD(HBM) 5000 V"' }

