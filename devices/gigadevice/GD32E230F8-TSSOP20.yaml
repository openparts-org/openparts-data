# GD32E230F8 in TSSOP20: Arm Cortex-M23 MCU, 64 KB flash (Table 6-1, PDF
# pages 89-90). Pin numbers, names and I/O types from Table 2-10
# "GD32E230Fx TSSOP20 pin definitions" (PDF pages 32-33), every pin
# cross-checked against Figure 2-7 "GD32E230Fx TSSOP20 pinouts" (PDF page
# 15). Note 6 (PDF page 33): the PA11/PA12 pair can be remapped onto pins
# 17/18 instead of PA9/PA10 (SYSCFG_CFG0); the figure prints
# "PA9(PA11)"/"PA10(PA12)". The LGA20 version is not modelled.
#
# Names follow the pin-definition table's "Pin Name" column; where the
# table writes a pin with a slash ("PF0/OSCIN", "PF1/OSCOUT") the
# hyphenated form of the pinout figure's style is used (PF0-OSCIN,
# PF1-OSCOUT; the LQFP48 figure prints "PF/OSCOUT" for pin 6, a typo for
# PF1). Types: table Pin Type "P" -> power (VDD*) / ground (VSS*); "I"
# -> input (BOOT0); NRST (I/O) -> reset; other I/O -> io. Alternate
# functions are not modelled (same policy as gigadevice/GD32F103C8).
schema_version: "0.2"
kind: device
id: gigadevice/GD32E230F8-TSSOP20
manufacturer: gigadevice
category: microcontroller
family: GD32E230
source: gigadevice/GD32E230xx_Datasheet@rev2.6

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.8 V
    typ: 3.3 V
    max: 3.6 V
    src: p48 "Table 4-2 DC operating conditions, VDD Supply voltage"
  esd_hbm:
    typ: 6 kV
    src: p57 "Table 4-12 ESD characteristics, VESD(HBM) 6000 V (printed in Max column)"

pins:
  src:
    - p32 "Table 2-10 GD32E230Fx TSSOP20 pin definitions (PDF pages 32-33)"
    - p15 "Figure 2-7 GD32E230Fx TSSOP20 pinouts (cross-check, all pins matched)"
  "1":  { name: BOOT0, type: input }
  "2":  { name: PF0-OSCIN, type: io }
  "3":  { name: PF1-OSCOUT, type: io }
  "4":  { name: NRST, type: reset }
  "5":  { name: VDDA, type: power }
  "6":  { name: PA0-WKUP, type: io }
  "7":  { name: PA1, type: io }
  "8":  { name: PA2, type: io }
  "9":  { name: PA3, type: io }
  "10": { name: PA4, type: io }
  "11": { name: PA5, type: io }
  "12": { name: PA6, type: io }
  "13": { name: PA7, type: io }
  "14": { name: PB1, type: io }
  "15": { name: VSS, type: ground }
  "16": { name: VDD, type: power }
  "17": { name: PA9, type: io }
  "18": { name: PA10, type: io }
  "19": { name: PA13, type: io }
  "20": { name: PA14, type: io }
