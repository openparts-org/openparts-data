# Two fictional silicon revisions to exercise Effective Model overrides
# (Architecture Specification section 10, Canonical Data Specification
# section 17-19). Only rev-b differs from the base: pin 42 changes from
# a plain ground pin to a power-down-reset control pin. Every other pin,
# and rev-a itself, stay untouched by the override.
revisions:
  rev-a:
    manufacturer_revision: "A"

  rev-b:
    manufacturer_revision: "B"
    detection:
      - method: device_register
        register: DBGMCU_IDCODE
        mask: "0xffff0000"
        value: "0x20000000"
    overrides:
      pins:
        "42":
          name: PDR_ON

provenance:
  "/pins/1/name":
    - source: exemplar/EX-DS-0001@rev1
      page: 12
      locator: "Table 5, pin definitions"
