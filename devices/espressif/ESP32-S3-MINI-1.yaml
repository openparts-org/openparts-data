# ESP32-S3-MINI-1 Wi-Fi + Bluetooth LE module (PCB antenna). Pin numbers,
# names and types from the module datasheet's pin definition table (p11 "Table
# 3-1 Pin Definitions", cont. p12; the table covers MINI-1 and MINI-1U, p10
# Figure 3-1 pin layout applies to both); type P is power (ground for GND),
# I input, I/O/T io. GND is listed as "1, 2, 42, 43, 46-65": 46-60 the top
# row, 61 the centre ground pad, 62-65 the corner pads (Figure 3-1).
# Alternate functions are not recorded here. On -N4R2 parts IO26 (pin 26)
# connects to the in-package PSRAM and is not available (Table 3-1 note b).
schema_version: "0.2"
kind: device
id: espressif/ESP32-S3-MINI-1
manufacturer: espressif
category: wireless_module
family: ESP32-S3-MINI-1
source: espressif/esp32-s3-mini-1_mini-1u_datasheet_en@rev1.7

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 3 V
    typ: 3.3 V
    max: 3.6 V
    src: p27 "Table 6-2 Recommended Operating Conditions, VDD33"
  radio_protocol: { value: wifi_ble, src: p3 "generic Wi-Fi + Bluetooth LE MCU modules" }
  antenna_type:
    value: pcb_trace
    src: 'p2 "Antenna Options, ESP32-S3-MINI-1: On-board PCB antenna"'

