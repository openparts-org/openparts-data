# Pinout for pins 1-56, consistent across repeated fetches of Table 2-1
# "Pin Overview". A possible additional pin 57 (exposed pad / GND) is
# NOT recorded here: independent fetches of the same datasheet page
# disagreed on whether a 57th row exists, and that discrepancy could not
# be resolved without the primary PDF (rather than its HTML mirror).
# Recorded honestly as absent pending confirmation, instead of guessing
# which fetch was right (Agent Ingestion Specification section 5:
# "Search result snippetだけをPrimary Evidenceとして採用しない" /
# never resolve a conflicting source silently).
#
# XTAL_32K_P/N (pins 21/22) and XTAL_N/XTAL_P (pins 52/53) are
# categorized `clock` here (crystal oscillator pins) rather than the
# fetch's literal "io"/"analog" Type-column label, for consistency with
# how every other chip in this dataset classifies its crystal pins --
# an assembler judgment call, not a verbatim datasheet field.
