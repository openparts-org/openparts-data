# ESP32-C6-MINI-1U Wi-Fi 6/Bluetooth LE/802.15.4 module (external antenna
# connector). Pin
# numbers, names and types from the module datasheet's pin definition
# table (pp10-11 "Table 3-1 Pin Definitions"), cross-checked against
# Figure 3-1 "Pin Layout (Top View)" (p10); type P is power (ground for
# GND), I input, I/O/T io, a dash nc. Table 3-1 lists GND and NC by
# number groups ("1, 2, 11, 14, 36~53"; 4, 7, 21, 32-35); pins 49-53 are
# the centre ground grid and the four corner pads (Figure 3-1).
# Alternate functions are not recorded here. The pin diagram applies to
# MINI-1 and MINI-1U alike (p10 note).
schema_version: "0.2"
kind: device
id: espressif/ESP32-C6-MINI-1U
manufacturer: espressif
category: wireless_module
family: ESP32-C6-MINI-1
source: espressif/esp32-c6-mini-1_mini-1u_datasheet_en@rev1.5

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 3 V
    max: 3.6 V
    src: p26 "Table 6-2 Recommended Operating Conditions, VDD33"
  radio_protocol:
    value: wifi_ble_802154
    src: p3 "Wi-Fi, IEEE 802.15.4, and Bluetooth LE modules"
  antenna_type:
    value: external_connector
    src: p3 "Antenna Options, External antenna via a connector (ESP32-C6-MINI-1U)"

