# ESP32-S2-MINI-1 Wi-Fi module (PCB antenna). Pin numbers, names and types
# from the module datasheet's pin definition table (p11-12 "Table 3: Pin
# Definitions"); type P is power (ground for GND), I input, I/O/T io, a dash
# nc. Alternate functions are not recorded here. Table 3 lists GND by number
# groups ("1, 2, 30, 42, 43, 46-65"); pins 61-65 are the ground and corner
# pads (p10 Figure 3). The -U variant (antenna connector) is a different
# board size and is not modelled.
schema_version: "0.2"
kind: device
id: espressif/ESP32-S2-MINI-1
manufacturer: espressif
category: microcontroller
family: ESP32-S2-MINI-1
