# Pinout from Table 2-1 "Pin Overview" (pp.16-17), fetched and parsed
# directly by this dataset's own maintainer (pypdf page extraction, not
# delegated), for the base ESP32-S3 (no in-package flash/PSRAM)
# variant. Pin 57 in the datasheet's own numbering is the exposed pad
# (listed as "GND", Power type) on the QFN56 package; represented as
# the "EP" key here for consistency with every other QFN device in this
# dataset.
#
# CHIP_PU (pin 4) and XTAL_N/XTAL_P/XTAL_32K_P/XTAL_32K_N (pins 21, 22,
# 53, 54) are recategorized `reset`/`clock` respectively, instead of
# the datasheet's literal "Analog"/"IO" Pin Type column, for the same
# reason and consistency as every other chip in this dataset.
schema_version: "0.1"
kind: device
id: espressif/ESP32-S3

manufacturer: espressif
family: ESP32-S3

pins:
