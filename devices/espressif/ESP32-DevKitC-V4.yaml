# ESP32-DevKitC V4 development board, as a 38-pin through-hole module. Pin
# names from the user guide's header tables ("Header Block": J2 and J3, No. /
# Name / Type / Function); the module numbering runs down J2 (pins 1-19 =
# J2 1-19) and up J3 (pin 20 = J3 pin 19 ... pin 38 = J3 pin 1), as the
# package's counter-clockwise hole rows. Types: P power, G ground, I input
# (EN = CHIP_PU reset typed reset), I/O io.
schema_version: "0.2"
kind: device
id: espressif/ESP32-DevKitC-V4
manufacturer: espressif
category: development_board
family: ESP32
source: espressif/esp32-devkitc-user-guide

