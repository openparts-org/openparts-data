  "15": { name: G, type: ground }
  "16": { name: NC, type: nc }
  "17": { name: NC, type: nc }
  "18": { name: G, type: ground }
  "19": { name: "12", type: io }
  "20": { name: "13", type: io }
  "21": { name: G, type: ground }
  "22": { name: "9", type: io }
