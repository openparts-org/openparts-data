# ESP32-C6-DevKitC-1 development board, as a 32-pin through-hole module. Pin
# names from the user guide's header tables ("Header Block": J1 and J3, No. /
# Name / Type / Function); the module numbering runs down J1 (pins 1-16 =
# J1 1-16) and up J3 (pin 17 = J3 pin 16 ... pin 32 = J3 pin 1), as the
# package's counter-clockwise hole rows. Names are the silkscreen names the
# tables give (GPIO numbers as bare numbers, G = ground). Types: P power (G
# ground), I input (RST typed reset), I/O/T io, a dash nc.
schema_version: "0.2"
kind: device
id: espressif/ESP32-C6-DevKitC-1
manufacturer: espressif
category: microcontroller
family: ESP32-C6
source: espressif/esp32-c6-devkitc-1-user-guide

pins:
  src:  ['"Header Block, J1 table (No., Name, Type)"', '"Header Block, J3 table (No., Name, Type)"']
  "1":  { name: 3V3, type: power }
  "2":  { name: RST, type: reset }
  "3":  { name: "4", type: io }
  "4":  { name: "5", type: io }
  "5":  { name: "6", type: io }
  "6":  { name: "7", type: io }
