# ESP32-H2-MINI-1 Bluetooth LE/802.15.4 module (PCB antenna). Pin numbers,
# names and types from the module datasheet v1.6 pin definition table
# (p10 "Table 3: Pin Definitions"), cross-checked against "Figure 3: Pin
# Layout (Top View)" (p9); type P is power (ground for GND), I input,
# I/O/T io, a dash nc. Table 3 lists GND and NC by number groups ("1, 2,
# 11, 14, 36~53"; "4, 7, 17, 28, 29, 32~35"); pins 49-53 are the centre
# ground grid and the four corner pads (Figure 3). VBAT (15) is typed
# power ("Connected to internal 3V3 power supply (Default) or external
# battery"). Alternate functions are not recorded here. The -U variant
# (antenna connector) is a different board size and is not modelled.
