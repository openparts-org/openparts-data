# ESP32-S3-WROOM-1 Wi-Fi/Bluetooth module (PCB antenna). Pin numbers, names
# and types from the module datasheet's pin definition table (p11 "Table 3-1
# Pin Definitions"; p12 cont.); type P is power (ground for GND/EPAD), I
# input, I/O and I/O/T io, a dash nc. Alternate functions are not recorded
# here.  The -U variant (antenna connector) is a different board size and is
# not modelled.
schema_version: "0.2"
kind: device
id: espressif/ESP32-S3-WROOM-1
manufacturer: espressif
category: wireless_module
family: ESP32-S3-WROOM-1
source: espressif/esp32-s3-wroom-1_wroom-1u_datasheet_en@rev1.8

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 3 V
    max: 3.6 V
    src: p27 "Table 6-2 Recommended Operating Conditions, VDD33"
  radio_protocol: { value: wifi_ble, src: p3 "generic Wi-Fi + Bluetooth LE MCU modules" }
  antenna_type:
    value: pcb_trace
    src: 'p2 "Antenna Options, ESP32-S3-WROOM-1: On-board PCB antenna"'

