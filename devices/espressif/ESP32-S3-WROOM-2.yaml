# ESP32-S3-WROOM-2 Wi-Fi + Bluetooth LE module (PCB antenna, octal SPI flash
# and PSRAM). Pin numbers, names and types from the module datasheet's pin
# definition table (p11 "Table 3-1 Pin Definitions", cont. p12); type P is
# power (ground for GND/EPAD), I input, I/O/T io, a dash nc (pins 28-30,
# where ESP32-S3-WROOM-1 has IO35-IO37). Alternate functions are not
# recorded here. IO47/IO48 work at the 1.8 V VDD_SPI level (Table 3-1
# note 2).
schema_version: "0.2"
kind: device
id: espressif/ESP32-S3-WROOM-2
manufacturer: espressif
category: wireless_module
family: ESP32-S3-WROOM-2
source: espressif/esp32-s3-wroom-2_datasheet_en@rev1.7

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 3 V
    typ: 3.3 V
    max: 3.6 V
    src: p27 "Table 6-2 Recommended Operating Conditions, VDD33"
  radio_protocol: { value: wifi_ble, src: p3 "generic Wi-Fi + Bluetooth LE MCU module" }
  antenna_type:   { value: pcb_trace, src: 'p2 "Antenna Options, On-board PCB antenna"' }

pins:
