      page: 3
      locator: "Electro-Optical Characteristics (Ta=25℃), Dominant Wavelength λd @ IF=20mA: Typ. 624 nm"
  "/parameters/forward_voltage":
    - source: everlight/DSE-0025716
      page: 3
      locator: "Electro-Optical Characteristics (Ta=25℃), Forward Voltage VF @ IF=20mA: Min. 1.7 V, Typ. 2.0 V, Max. 2.4 V"
  "/parameters/forward_current":
    - source: everlight/DSE-0025716
      page: 2
      locator: "Absolute Maximum Ratings (Ta=25℃), Forward Current IF: 25 mA"
