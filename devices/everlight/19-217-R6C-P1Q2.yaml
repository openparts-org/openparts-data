# Brilliant red (AlGaInP) 0603-size chip LED. Everlight numbers the pads
# the other way round from Kingbright: pad 1 = anode (+), pad 2 =
# cathode (-), per the page-6 polarity symbol.
schema_version: "0.2"
kind: device
id: everlight/19-217-R6C-P1Q2
manufacturer: everlight
category: led
family: 19-217
source: everlight/DSE-0025716

parameters:
  forward_voltage:
    min: 1.7 V
    typ: 2 V
    max: 2.4 V
    at: { IF: 20 mA, TA: 25 °C }
    src: p3 "Electro-Optical Characteristics, Forward Voltage VF"
  forward_current:
    max: 25 mA
    at: { TA: 25 °C }
    src: p2 "Absolute Maximum Ratings, Forward Current IF"
  color: { value: red, src: 'p2 "Device Selection Guide, Emitted Color"' }
  wavelength:
    typ: 624 nm
    at: { IF: 20 mA, TA: 25 °C }
    src: p3 "Electro-Optical Characteristics, Dominant Wavelength λd"

pins:
  src: 'p6 "Package Dimension, Polarity symbol: "+ (1)" anode, "- (2)" cathode; bottom view "Cathode Mask" at pad 2"'
  "1": { name: Anode, type: passive }
  "2": { name: Cathode, type: passive }
