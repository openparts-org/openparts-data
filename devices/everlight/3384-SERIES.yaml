# labels only the longer lead "(ANODE)"; the shorter lead has no
# printed label in this document. Recorded as cathode by elimination --
# a 2-lead LED has exactly one anode and one cathode by definition, so
# this is not a guess about which role the second lead plays, only
# about the printed word for it.
