# Single 2-input positive-NAND gate SN74LVC1G00, 5-pin pin map of the
# DBV (SOT-23-5) package (shared with DCK/DRL/YZP), from the "Pin
# Functions" table (SCES212AC page 3), column "DBV, DCK, DRL, YZP",
# checked against the "DBV PACKAGE (TOP VIEW)" figure on the same page;
# all 5 pins match. The 6-pin DRY/DSF and the DPW pin maps differ and
# are not covered.
schema_version: "0.2"
kind: device
id: ti/SN74LVC1G00-DBV
manufacturer: ti
category: logic
family: SN74LVC1G00
source: ti/SCES212AC

pins:
  src:
    - p3 ""Pin Functions" table, column "DBV, DCK, DRL, YZP""
    - p3 ""DBV PACKAGE (TOP VIEW)" figure (cross-check)"
  "1": { name: A, type: input }
  "2": { name: B, type: input }
  "3": { name: GND, type: ground }
  "4": { name: Y, type: output }
  "5": { name: VCC, type: power }
