# Single rail-to-rail CMOS op amp OPA350, 8-pin pin map (P, D and DGK
# packages) from the "Pin Functions" table, column "OPA350" (SBOS099D
# page 3), checked against the "OPA350: P, D, and DGK Packages" top view
# (same page). NC on 1, 5, 8 ("No internal connection"). The
# OPA2350/OPA4350 maps differ and are not covered. Minus signs written
# as ASCII "-".
schema_version: "0.2"
kind: device
id: ti/OPA350
manufacturer: ti
category: op_amp
family: OPAx350
source: ti/SBOS099D

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: p4 "6.3 Recommended Operating Conditions, Power supply voltage (V+)-(V-)"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p4 "6.3 Recommended Operating Conditions, Specified temperature (narrower than Operating)"
  esd_hbm:            { typ: 1 kV, src: 'p4 "6.2 ESD Ratings, all package types, HBM"' }
  channel_count: { value: "1", src: 'p1 "3 Description: single (OPA350) and dual (OPA2350)"' }
  gain_bandwidth:
    typ: 38 MHz
    at: { CL: 100 pF }
    src: 'p6 "6.6 Electrical Characteristics: GBW, G = 1"'
  slew_rate:
    typ: 22 V/µs
    at: { CL: 100 pF }
    src: 'p6 "6.6 Electrical Characteristics: SR, G = 1"'
  input_offset_voltage:
    typ: 150 µV
    max: 500 µV
    at: { VS: 5 V, TA: 25 °C }
    src: p6 "6.6 Electrical Characteristics, VOS, VS = 5 V (printed ±150/±500 µV)"
  input_bias_current:
    typ: 0.5 pA
    max: 10 pA
    at: { TA: 25 °C }
    src: p6 "6.6 Electrical Characteristics, IB (printed ±0.5/±10 pA)"
  supply_current_per_channel:
    typ: 5.2 mA
    max: 7.5 mA
    at: { IOUT: 0 A, TA: 25 °C }
    src: p7 "6.6 Electrical Characteristics, IQ quiescent current (per amplifier), IO = 0"
  rail_to_rail_input: { value: yes, src: 'p1 "1 Features: Rail-to-Rail Input"' }
  rail_to_rail_output: { value: yes, src: 'p1 "1 Features: Rail-to-Rail Output (Within 10 mV)"' }

pins:
  src:
    - p3 "Pin Functions table, column OPA350"
    - p3 "OPA350 P, D, and DGK Packages 8-pin top view (cross-check)"
  "1": { name: NC, type: nc }
  "2": { name: -IN, type: analog }
  "3": { name: +IN, type: analog }
  "4": { name: V-, type: power }
  "5": { name: NC, type: nc }
  "6": { name: OUT, type: analog }
  "7": { name: V+, type: power }
  "8": { name: NC, type: nc }
