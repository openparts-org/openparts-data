# 8-bit serial-in parallel-out shift register SN74HC164, 14-pin pin map
# (D, N, NS, J, W, PW) from the "Pin Functions" table (SCLS115G page 4),
# checked against the 14-pin top-view figure (same page). CLR is active
# low (overbar in the datasheet; written without it). The FK (LCCC) map
# on page 5 differs and is not covered.
schema_version: "0.2"
kind: device
id: ti/SN74HC164
manufacturer: ti
category: logic
family: SNx4HC164
source: ti/SCLS115G

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2 V
    max: 6 V
    src: p6 "7.3 Recommended Operating Conditions, VCC, SN74HC164 column"
  supply_current:
    max: 8 µA
    at: { VCC: 6 V, TA: 25 °C }
    src: 'p7 "7.5 Electrical Characteristics, TA = 25°C: ICC, 6 V"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p6 "7.3 Recommended Operating Conditions, TA, SN74HC164 column"
  esd_hbm: { typ: 2 kV, src: 'p6 "7.2 ESD Ratings, HBM"' }
  propagation_delay:
    - typ: 23 ns
      max: 35 ns
      at: { VCC: 4.5 V, CL: 50 pF, TA: 25 °C }
      src: 'p10 "7.11 Switching Characteristics, TA = 25°C, CL = 50 pF: tpd CLK to any Q, 4.5 V"'
    - typ: 115 ns
      max: 175 ns
      at: { VCC: 2 V, CL: 50 pF, TA: 25 °C }
      src: 'p10 "7.11 Switching Characteristics, TA = 25°C, CL = 50 pF: tpd CLK to any Q, 2 V"'
    - typ: 20 ns
      max: 30 ns
      at: { VCC: 6 V, CL: 50 pF, TA: 25 °C }
      src: 'p10 "7.11 Switching Characteristics, TA = 25°C, CL = 50 pF: tpd CLK to any Q, 6 V"'
  logic_function:
    value: shift_register
    src: p1 "Title, 8-Bit Parallel-Out Serial Shift Registers"

pins:
  src:
    - p4 "Pin Functions table, column SOIC, PDIP, SO, CDIP, CFP, or TSSOP NO."
    - p4 "D, N, NS, J, W, or PW Package 14-Pin Top View (cross-check)"
  "1":  { name: A, type: input }
  "2":  { name: B, type: input }
  "3":  { name: QA, type: output }
  "4":  { name: QB, type: output }
  "5":  { name: QC, type: output }
  "6":  { name: QD, type: output }
  "7":  { name: GND, type: ground }
  "8":  { name: CLK, type: clock }
  "9":  { name: CLR, type: reset }
  "10": { name: QE, type: output }
  "11": { name: QF, type: output }
  "12": { name: QG, type: output }
  "13": { name: QH, type: output }
  "14": { name: VCC, type: power }
