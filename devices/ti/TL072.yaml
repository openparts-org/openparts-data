# Dual JFET-input op amp, 8-pin pin map of the TL072x D/DDF/JG/P/PS/PW
# packages from Table 4-3 "Pin Functions: TL072x" (SLOS080W page 5),
# checked against Figure 4-5 (same page). The TL072M U (CFP) and FK
# (LCCC) maps differ and are not covered. Minus signs written as ASCII
# "-".
