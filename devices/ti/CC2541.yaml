# CC2541 (F128/F256: same pinout) Bluetooth low energy and proprietary
# 2.4 GHz wireless MCU, RHA (VQFN-40 6x6) pinout. SWRS110D pin description
# table (PDF page 17) checked against Figure 8 (pinout, PDF page 16).
# Names follow the table; Figure 8 labels pin 30 "R_BIAS" (table: RBIAS).
# The table prints pins 32/33 as "P2_4/OSC32K_Q1" and "P2_3/OSC32K_Q2"
# (CC2530's table: XOSC32K_*); the table spelling is kept.
# Types are this dataset's reading of the PIN TYPE column: Digital I/O ->
# io, SCL/SDA ("I2C clock or digital I/O") -> io, RESET_N -> reset, Analog
# I/O and RF I/O -> analog, Power -> power except DCOUPL (1.8 V
# decoupling, "Do not use for supplying external circuits") -> power_out;
# pin 1 "GND" (Ground pin) -> ground, pin 4 "NC" (Not connected) -> nc.
# GND ground pad ("—", must be connected to a solid ground plane; Figure 8
# note: the ground connection for the chip) -> key "EP", GND, ground.
schema_version: "0.2"
kind: device
id: ti/CC2541
manufacturer: ti
category: microcontroller
family: CC2541
source: ti/SWRS110D

pins:
  src:
    - p17 "Pin description table (PIN NAME, PIN, PIN TYPE)"
    - p16 "Figure 8 pinout, and its note on the exposed ground pad"
  "1":  { name: GND, type: ground }
  "2":  { name: SCL, type: io }
  "3":  { name: SDA, type: io }
  "4":  { name: NC, type: nc }
