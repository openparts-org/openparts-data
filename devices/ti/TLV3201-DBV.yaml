# TLV3201 single push-pull comparator, 5-pin DBV (SOT-23) / DCK (SC70)
# pinout. From SBOS561C "Pin Functions: TLV3201" (page 3), checked
# against Figure 5-1 "TLV3201 DCK and DBV Packages 5-Pin SC70-5 and
# SOT-23 Top View" (same page): OUT 1, GND 2, IN+ 3, IN- 4, VCC 5. Minus
# sign written as ASCII "-". GND "Negative supply, ground" -> ground,
# VCC -> power.
schema_version: "0.2"
kind: device
id: ti/TLV3201-DBV
manufacturer: ti
category: comparator
family: TLV320x
source: ti/SBOS561C

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: p4 "6.3 Recommended Operating Conditions, VS (printed ±1.35 to ±2.75 V)"
  supply_current:
    typ: 40 µA
    max: 50 µA
    at: { VCC: 5 V, TA: 25 °C }
    src: 'p5 "6.5 Electrical Characteristics VCC = 5V: IQ quiescent current, TA = 25 °C"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p4 "6.3 Recommended Operating Conditions, Specified temperature"
  esd_hbm:            { typ: 2 kV, src: 'p4 "6.2 ESD Ratings, HBM"' }
  channel_count: { value: "1", src: 'p1 "3 Description: single (TLV3201) and dual (TLV3202)"' }
  input_offset_voltage:
    typ: 1 mV
    max: 3 mV
    at: { VCC: 5 V }
    src: 'p5 "6.5 Electrical Characteristics VCC = 5V: VIO TLV3201, VCM = VCC/2"'
  input_bias_current:
    typ: 1 pA
    max: 50 pA
    at: { VCC: 5 V }
    src: 'p5 "6.5 Electrical Characteristics VCC = 5V: IIB, VCM = VCC/2"'
  rail_to_rail_input: { value: yes, src: 'p1 "3 Description: rail-to-rail inputs"' }
  propagation_delay:
    - typ: 43 ns
      max: 50 ns
      at: { VCC: 5 V, VOD: 100 mV, CL: 15 pF }
      src: 'p5 "6.6 Switching Characteristics VCC = 5V: tPD low to high (slower edge), 100 mV overdrive"'
    - typ: 47 ns
      max: 50 ns
      at: { VCC: 5 V, VOD: 20 mV, CL: 15 pF }
      src: 'p5 "6.6 Switching Characteristics VCC = 5V: tPD low to high (slower edge), 20 mV overdrive"'
  output_structure:   { value: push_pull, src: 'p1 "Features: Push-Pull Outputs"' }

pins:
  src:
    - 'p3 ""Pin Functions: TLV3201" table"'
    - p3 "Figure 5-1 "TLV3201 DCK and DBV Packages 5-Pin SC70-5 and SOT-23 Top View" (all 5 pins matched)"
  "1": { name: OUT, type: output }
  "2": { name: GND, type: ground }
  "3": { name: IN+, type: input }
  "4": { name: IN-, type: input }
  "5": { name: VCC, type: power }
