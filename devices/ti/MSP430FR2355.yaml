# MSP430FR2355, 16-bit MSP430 with 32KB FRAM / 4KB SRAM, 48-pin PT
# (LQFP) pin map. Read from Table 4-1 "Pin Attributes" (SLASEC4D pages
# 18-21, column "PIN NUMBER PT") and cross-checked against Figure 4-1
# "48-Pin PT (LQFP) (Top View) - MSP430FR235x" (page 10): all 48 pins
# match. `name` is the composite label printed in Figure 4-1. Only the
# PT package is modelled here; the RHA/RSM/DBT packages use a different
# pin numbering (other columns of Table 4-1). MSP430FR215x parts have
# no SAC (OAx) signals and are not covered by this device.
schema_version: "0.2"
kind: device
id: ti/MSP430FR2355
manufacturer: ti
category: microcontroller
family: MSP430FR2xx
source: ti/SLASEC4D

# Parameters (AI candidates, needs review).
parameters:
