# TPD1E05U06 single-channel unidirectional TVS ESD protection device.
# Pin map from Table 4-1 "Pin Functions TPD1E05U06 DPY and DYA"
# (SLVSBO7O page 3: I/O 1, GND 2), checked against Figure 4-2 "DYA
# Package 2-Pin SOD-523 (Top View)" (pins 1 and 2; same page). I/O is
# typed passive (TVS diode terminal). The datasheet names no
# cathode/anode, so the pins keep the datasheet's names.
schema_version: "0.2"
kind: device
id: ti/TPD1E05U06
manufacturer: ti
category: diode
family: TPDxE05U06
source: ti/SLVSBO7O

parameters:
  reverse_voltage: { max: 5.5 V, src: 'p7 "5.4 Electrical Characteristics, VRWM"' }
  clamping_voltage:
    - typ: 10 V
      at: { IPP: 1 A }
      src: p7 "5.4 Electrical Characteristics, VClamp, IPP = 1 A, TLP, from I/O to GND"
    - typ: 14 V
      at: { IPP: 5 A }
      src: p7 "5.4 Electrical Characteristics, VClamp, IPP = 5 A, TLP, from I/O to GND"
  peak_pulse_current:
    max: 2.5 A
    src: p6 "Absolute Maximum Ratings, Peak Pulse, IEC 61000-4-5 Current (8/20us)"
  peak_pulse_power:
    max: 40 W
    src: p6 "Absolute Maximum Ratings, Peak Pulse, IEC 61000-4-5 Power (8/20us)"

pins:
  src:
    - p3 "Table 4-1. Pin Functions TPD1E05U06 DPY and DYA"
    - p3 "Figure 4-2 DYA Package 2-Pin SOD-523 (cross-check)"
  "1": { name: I/O, type: passive }
  "2": { name: GND, type: ground }
