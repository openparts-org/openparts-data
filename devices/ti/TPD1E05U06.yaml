# typed passive (TVS diode terminal). The datasheet names no
# cathode/anode, so the pins keep the datasheet's names.
schema_version: "0.2"
kind: device
id: ti/TPD1E05U06
manufacturer: ti
category: diode
family: TPDxE05U06
source: ti/SLVSBO7O

