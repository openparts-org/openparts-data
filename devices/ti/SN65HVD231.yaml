# 3.3-V CAN transceiver SN65HVD231, 8-pin SOIC (D) pin map. All 8 pins
# match between the "Pin Functions" table (rows Vref/RS "SN65HVD230
# and SN65HVD231") and the "SN65HVD230D / SN65HVD231D (Marked as
# VP231) Top View" figure (SLOS346O page 5). D (TXD) and R (RXD) keep
# the datasheet names; Vref (VCC/2 reference output) typed analog; RS
# (mode select) typed input.
schema_version: "0.2"
kind: device
id: ti/SN65HVD231
manufacturer: ti
category: can_transceiver
family: SN65HVD231
source: ti/SLOS346O

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 3 V
    max: 3.6 V
    src: p6 "8.3 Recommended Operating Conditions, Supply voltage VCC"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p6 "8.3 Recommended Operating Conditions, Operating free-air temperature TA"
  esd_hbm: { typ: 4 kV, src: 'p6 "8.2 ESD Ratings, HBM, All pins (CANH, CANL and GND ±16 kV)"' }
  data_rate: { max: 1 Mbps, src: 'p1 "1 Features, Designed for Data Rates up to 1 Mbps"' }
  bus_fault_voltage:
    min: -4 V
    max: 16 V
    src: p5 "8.1 Absolute Maximum Ratings, Voltage at any bus terminal (CANH or CANL)"

pins:
  src:
    - p5 ""Pin Functions" table (pins 1-8; rows Vref/RS for SN65HVD230 and SN65HVD231)"
    - p5 ""SN65HVD231D (Marked as VP231) Top View" figure (cross-check)"
  "1": { name: D, type: input }
  "2": { name: GND, type: ground }
  "3": { name: VCC, type: power }
  "4": { name: R, type: output }
  "5": { name: Vref, type: analog }
  "6": { name: CANL, type: io }
  "7": { name: CANH, type: io }
  "8": { name: RS, type: input }
