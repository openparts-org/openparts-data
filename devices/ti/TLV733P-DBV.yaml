# 300-mA capacitor-free LDO with active discharge, DBV (SOT-23-5) pin
# map from the "Pin Functions" table (SBVS235C page 4), DBV column: IN
# 1, GND 2, EN 3, NC 4, OUT 5, checked against the "DBV Package 5-Pin
# SOT-23 Top View" figure (same page). The DQN (X2SON) map differs.
# IN/OUT typed power, as for ti/TLV755P-DBV.
schema_version: "0.2"
kind: device
id: ti/TLV733P-DBV
manufacturer: ti
category: linear_regulator
family: TLV733P
source: ti/SBVS235C

parameters:
  output_type:
    value: fixed
    src: p21 "Table 4. Device Nomenclature, xx(x) = nominal output voltage"
  input_voltage_max: { max: 5.5 V, src: 'p5 "6.3 Recommended Operating Conditions, VIN"' }
  output_current:    { max: 300 mA, src: 'p5 "6.3 Recommended Operating Conditions, IOUT"' }

pins:
  src: ['p4 "Pin Functions, column DBV"', p4 "DBV Package 5-Pin SOT-23 Top View"]
  "1": { name: IN, type: power }
  "2": { name: GND, type: ground }
  "3": { name: EN, type: input }
  "4": { name: NC, type: nc }
  "5": { name: OUT, type: power }
