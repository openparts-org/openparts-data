# Half-duplex RS-485 transceiver THVD1450, pin map from the "Pin
# Functions" table (SLLSEY3E page 5), column "D" (identical in the DGK
# and DRB columns), checked against the D-package top view on the same
# page; all 8 pins match. The DRB thermal pad ("No electrical
# connection") has no pin here. RE is active low (overbar in the
# datasheet; written without it). A/B "Bus input/output" typed io.
schema_version: "0.2"
kind: device
id: ti/THVD1450
manufacturer: ti
category: rs485_transceiver
family: THVD14x0
source: ti/SLLSEY3E

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage: { min: 3 V, max: 5.5 V, src: 'p9 "7.4 Recommended Operating Conditions, VCC"' }
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p9 "7.4 Recommended Operating Conditions, TA"
  esd_hbm: { typ: 8 kV, src: 'p8 "7.2 ESD Ratings, HBM, all other pins (bus pins and GND ±30 kV)"' }
  data_rate:
    max: 50 Mbps
    src: p9 "7.4 Recommended Operating Conditions, 1/tUI signaling rate, THVD1450 row"
  bus_fault_voltage:
    min: -18 V
    max: 18 V
    src: p8 "7.1 Absolute Maximum Ratings, Bus voltage at any bus pin (A, B, Y, or Z)"

pins:
  src:
    - p5 ""Pin Functions" table, column "D""
    - p5 ""THVD1410, THVD1450 Devices 8-Pin D Package (SOIC) Top View" figure (cross-check)"
  "1": { name: R, type: output }
  "2": { name: RE, type: input }
  "3": { name: DE, type: input }
  "4": { name: D, type: input }
  "5": { name: GND, type: ground }
  "6": { name: A, type: io }
  "7": { name: B, type: io }
  "8": { name: VCC, type: power }
