# CC2530 (F32/F64/F128/F256: same pinout) 2.4 GHz IEEE 802.15.4 / ZigBee
# system-on-chip with an 8051 MCU core, RHA (VQFN-40 6x6) pinout. SWRS081B
# Table 1 "Pin Descriptions" (PDF page 18) checked against Figure 7 "Pinout
# Top View" (PDF page 17).
# Types are this dataset's reading of the PIN TYPE column: Digital I/O ->
# io (P2_3/P2_4 also Analog I/O for the 32.768 kHz XOSC: io), Digital input
# RESET_N -> reset, Analog I/O and RF I/O -> analog, Power -> power except
# DCOUPL (1.8 V decoupling, "Do not use for supplying external circuits")
# -> power_out. Pins 1-4 "GND", Unused pins, "Connect to GND" -> ground.
# GND ground pad ("—", must be connected to a solid ground plane; Figure 7
# note: the ground connection for the chip) -> key "EP", GND, ground.
# Alternate functions are not recorded.
schema_version: "0.2"
kind: device
id: ti/CC2530
manufacturer: ti
category: microcontroller
family: CC2530
source: ti/SWRS081B

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2 V
    max: 3.6 V
    src: p4 "Recommended Operating Conditions, Operating supply voltage"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p4 "Recommended Operating Conditions, Operating ambient temperature range TA"
  esd_hbm: { typ: 2 kV, src: 'p4 "Absolute Maximum Ratings, ESD, all pads, human-body model"' }

