# LM2940 1-A LDO (LM2940-N, all fixed voltages), NDE (TO-220) pinout.
# SNVS769J "Pin Functions" (page 3), NDE column: IN 1, GND 2, OUT 3, GND
# 4; Figure "TO-220 (NDE) Package 4 Pins Front View". NDE's pin 4 is the
# tab, which on a TO-220 is not a board pad: pins 1-3 only.
schema_version: "0.2"
kind: device
id: ti/LM2940-NDE
manufacturer: ti
category: linear_regulator
family: LM2940
source: ti/SNVS769J

parameters:
  input_voltage_max:
    max: 26 V
    src: 'p4 "6.3 Recommended Operating Conditions, Input voltage: MAX 26 V"'
  output_current:
    typ: 1 A
    src: 'p1 "3 Description: "positive voltage regulators feature the ability to source 1 A of output current""'
  dropout_voltage:
    typ: 0.5 V
    max: 1 V
    at: { IOUT: 1 A }
    src: 'p5 "6.5 Electrical Characteristics, Dropout voltage: TYP 0.5 V, MAX 1 V (same in tables 6.5-6.7 for all output voltages)"'

pins:
  src:
    - 'p3 ""Pin Functions", NDE column: IN 1, GND 2, OUT 3, GND 4 (tab)"'
    - p3 ""TO-220 (NDE) Package 4 Pins Front View""
  "1": { name: IN, type: power }
  "2": { name: GND, type: ground }
  "3": { name: OUT, type: power }
