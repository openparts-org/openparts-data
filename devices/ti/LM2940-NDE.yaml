# LM2940 1-A LDO (LM2940-N, all fixed voltages), NDE (TO-220) pinout.
# SNVS769J "Pin Functions" (page 3), NDE column: IN 1, GND 2, OUT 3, GND
# 4; Figure "TO-220 (NDE) Package 4 Pins Front View". NDE's pin 4 is the
# tab, which on a TO-220 is not a board pad: pins 1-3 only.
schema_version: "0.1"
kind: device
id: ti/LM2940-NDE

manufacturer: ti
category: linear_regulator
family: LM2940

pins:
  "1": { name: "IN", type: power }
  "2": { name: "GND", type: ground }
  "3": { name: "OUT", type: power }

parameters:
  input_voltage_max:
    max: 26
    unit: V
  output_current:
    nominal: 1
    unit: A
  dropout_voltage:
    nominal: 0.5
    max: 1
    unit: V

provenance:
  "/parameters/input_voltage_max":
    - source: ti/SNVS769J
      page: 4
      locator: "6.3 Recommended Operating Conditions, Input voltage: MAX 26 V"
  "/parameters/output_current":
    - source: ti/SNVS769J
      page: 1
      locator: "3 Description: \"positive voltage regulators feature the ability to source 1 A of output current\""
  "/parameters/dropout_voltage":
    - source: ti/SNVS769J
      page: 5
      locator: "6.5 Electrical Characteristics, Dropout voltage, IOUT = 1A: TYP 0.5 V, MAX 1 V (same in tables 6.5-6.7 for all output voltages)"
  "/pins":
    - source: ti/SNVS769J
      page: 3
      locator: "\"Pin Functions\", NDE column: IN 1, GND 2, OUT 3, GND 4 (tab)"
    - source: ti/SNVS769J
      page: 3
      locator: "\"TO-220 (NDE) Package 4 Pins Front View\""
