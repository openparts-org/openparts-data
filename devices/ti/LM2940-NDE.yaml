# LM2940 1-A LDO (LM2940-N, all fixed voltages), NDE (TO-220) pinout.
# SNVS769J "Pin Functions" (page 3), NDE column: IN 1, GND 2, OUT 3, GND
# 4; Figure "TO-220 (NDE) Package 4 Pins Front View". NDE's pin 4 is the
# tab, which on a TO-220 is not a board pad: pins 1-3 only.
schema_version: "0.2"
kind: device
id: ti/LM2940-NDE
manufacturer: ti
category: linear_regulator
family: LM2940
source: ti/SNVS769J

parameters:
  input_voltage_max: { max: 26 V, src: 'p4 "6.3 Recommended Operating Conditions, Input voltage"' }
  output_current:    { max: 1 A, src: p1 "3 Description" }
  dropout_voltage:
    - typ: 0.5 V
      max: 1 V
      at: { IOUT: 1 A }
      src: p5 "6.5 Elec. Char. (same in 6.6, 6.7), Dropout voltage"
    - typ: 0.5 V
      max: 0.8 V
      at: { IOUT: 1 A, TJ: 25 °C }
      src: p5 "6.5 Elec. Char. (same in 6.6, 6.7), Dropout voltage"
    - typ: 110 mV
      max: 200 mV
      at: { IOUT: 100 mA }
      src: p5 "6.5 Elec. Char. (same in 6.6, 6.7), Dropout voltage"
    - typ: 110 mV
      max: 150 mV
      at: { IOUT: 100 mA, TJ: 25 °C }
      src: p5 "6.5 Elec. Char. (same in 6.6, 6.7), Dropout voltage"

pins:
  src:
    - 'p3 ""Pin Functions", NDE column: IN 1, GND 2, OUT 3, GND 4 (tab)"'
    - p3 ""TO-220 (NDE) Package 4 Pins Front View""
  "1": { name: IN, type: power }
  "2": { name: GND, type: ground }
  "3": { name: OUT, type: power }
