# MSPM0G3507, Cortex-M0+, 128KB flash / 32KB SRAM. Same datasheet
# documents both an LQFP48 and a QFN48 ("VQFN") package option sharing
# an IDENTICAL pin map (confirmed via Table 6-2 "Pin Attributes",
# pages 11-14, whose "PIN NUMBER" column is explicitly headed "48
# LQFP, VQFN") -- this Device applies to either package. Cross-checked
# a second way against Figure 6-3 "48-Pin PT (LQFP) (Top View)"
# (page 8); all 48 pins matched exactly, zero discrepancies.
#
# `name` uses the composite label as printed in the pin diagram (e.g.
# "PA0/FCC_IN"). Every pin also carries an extensive digital
# alternate-function mux (UART/SPI/I2C/timer/CAN, via IOMUX PINCMx
# registers, Table 6-2) not individually modeled here -- out of scope
# for this pass, same policy as this dataset's other MCU pin tables.
