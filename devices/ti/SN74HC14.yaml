# Hex Schmitt-trigger inverter SN74HC14, 14-pin pin map (D, DB, N, NS,
# PW, J, W) from the "Pin Functions" table (SCLS085L page 3) checked
# against Figure 4-1 (same page); all 14 pins match. The FK (LCCC)
# numbering differs and is not covered.
schema_version: "0.2"
kind: device
id: ti/SN74HC14
manufacturer: ti
category: logic
family: SNx4HC14
source: ti/SCLS085L

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage: { min: 2 V, max: 6 V, src: 'p4 "5.3 Recommended Operating Conditions, VCC"' }
  supply_current:
    max: 2 µA
    at: { VCC: 6 V, TA: 25 °C }
    src: 'p5 "5.5 Electrical Characteristics - 74: ICC, 6 V, 25 °C"'
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p4 "5.3 Recommended Operating Conditions, TA, SN74HC14 row"
  esd_hbm:          { typ: 2 kV, src: 'p4 "5.2 ESD Ratings, HBM"' }
  channel_count:    { value: "6", src: 'p1 "3 Description: six independent inverters"' }
  propagation_delay:
    - typ: 12 ns
      max: 25 ns
      at: { VCC: 4.5 V, TA: 25 °C }
      src: 'p6 "5.7 Switching Characteristics - 74: tpd A to Y, 4.5 V"'
    - typ: 55 ns
      max: 125 ns
      at: { VCC: 2 V, TA: 25 °C }
      src: 'p6 "5.7 Switching Characteristics - 74: tpd A to Y, 2 V"'
    - typ: 11 ns
      max: 21 ns
      at: { VCC: 6 V, TA: 25 °C }
      src: 'p6 "5.7 Switching Characteristics - 74: tpd A to Y, 6 V"'
  output_structure: { value: push_pull, src: p9 "7.3.1 Balanced CMOS Push-Pull Outputs" }
  logic_function: { value: inverter, src: 'p1 "Title, Hex Inverters with Schmitt-Trigger Inputs"' }

pins:
  src:
    - p3 ""Pin Functions" table, column "D, DB, N, NS, PW, J, or W""
    - p3 "Figure 4-1 "D, DB, N, NS, PW, J, or W Package 14-Pin ... Top View" (cross-check)"
  "1":  { name: 1A, type: input }
  "2":  { name: 1Y, type: output }
  "3":  { name: 2A, type: input }
  "4":  { name: 2Y, type: output }
  "5":  { name: 3A, type: input }
  "6":  { name: 3Y, type: output }
  "7":  { name: GND, type: ground }
  "8":  { name: 4Y, type: output }
  "9":  { name: 4A, type: input }
  "10": { name: 5Y, type: output }
  "11": { name: 5A, type: input }
  "12": { name: 6Y, type: output }
  "13": { name: 6A, type: input }
  "14": { name: VCC, type: power }
