# LM7812 / LM340-12 1.5-A fixed 12-V regulator, NDE (TO-220) pinout.
# SNOSBT0L "Pin Functions" (page 3): INPUT 1, GND 2, OUTPUT 3; the
# "LM7805, LM7812, and LM7815 NDE Package 3-Pin TO-220 Top View" figure
# labels the tab GND. The TO-220 tab is not a board pad: pins 1-3 only
# (as ti/LM7805-NDE). Table "6.7 LM340 / LM7812 Electrical
# Characteristics" covers both LM7812 and LM340-12 (LM340T-12/NOPB).
schema_version: "0.2"
kind: device
id: ti/LM7812-NDE
manufacturer: ti
category: linear_regulator
family: LM7812
source: ti/SNOSBT0L

parameters:
  output_type:    { value: fixed, src: p1 "Title; 1 Features" }
  output_voltage:
    - min: 11.5 V
      typ: 12 V
      max: 12.5 V
      at: { IOUT: 5..1000 mA, TJ: 25 °C }
      src: p7 "LM340 / LM7812 Elec. Char., VO, TJ = 25°C"
    - min: 11.4 V
      max: 12.6 V
      at: { VIN: 14.5..27 V, IOUT: 5..1000 mA }
      src: p7 "LM340 / LM7812 Elec. Char., VO, PD <= 15 W"
  output_current: { max: 1.5 A, src: p1 "1 Features" }
  dropout_voltage:
    typ: 2 V
    at: { IOUT: 1 A, TJ: 25 °C }
    src: p7 "LM340 / LM7812 Elec. Char., Dropout voltage"

pins:
  src:
    - 'p3 ""Pin Functions": INPUT 1, GND 2, OUTPUT 3"'
    - p3 ""LM7805, LM7812, and LM7815 NDE Package 3-Pin TO-220 Top View" (OUTPUT/GND/INPUT, tab GND)"
  "1": { name: INPUT, type: power }
  "2": { name: GND, type: ground }
  "3": { name: OUTPUT, type: power }
