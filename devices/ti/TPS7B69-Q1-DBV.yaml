# TPS7B69xx-Q1 40-V, 150-mA ultra-low-IQ automotive LDO (fixed 2.5 /
# 3.3 / 5 V), DBV (SOT-23-5) pinout. From SLVSCJ8B "Pin Functions"
# table (page 3), column "SOT-23": IN 1, NC 2, GND 3 and 4, OUT 5;
# checked against the "DBV Package 5-Pin SOT-23 Top View" figure (same
# page). NC is "Not connected pin" ("NC - No internal connection" in
# the figure). The table types IN/OUT "P" -> power, GND "G" -> ground.
# output_current is the Elec. Char. IO row ("VO in regulation").
schema_version: "0.2"
kind: device
id: ti/TPS7B69-Q1-DBV
manufacturer: ti
category: linear_regulator
family: TPS7B69xx-Q1
source: ti/SLVSCJ8B

parameters:
  output_type:
    value: fixed
    src: 'p5 "7.5 Elec. Char., VO rows: Fixed 2.5-V / 3.3-V / 5-V version"'
  input_voltage_max: { max: 40 V, src: 'p4 "7.3 Recommended Operating Conditions, VI"' }
  output_current:    { max: 150 mA, src: 'p5 "7.5 Elec. Char., IO Output current"' }

pins:
  src:
    - p3 ""Pin Functions" table, column "SOT-23""
    - p3 ""DBV Package 5-Pin SOT-23 Top View" figure"
  "1": { name: IN, type: power }
  "2": { name: NC, type: nc }
  "3": { name: GND, type: ground }
  "4": { name: GND, type: ground }
  "5": { name: OUT, type: power }
