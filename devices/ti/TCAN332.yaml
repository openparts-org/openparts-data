# 3.3-V CAN FD transceiver TCAN332, D/DCN pin map from Table 4-1 "Pin
# Functions" column "TCAN332" and Figure 4-2 (SLLSEQ7F page 4); all 8
# pins match. Pins 5 and 8 are "NC - No Connect - Not internally
# connected" (typed nc). The other TCAN33x variants use pins 5/8 for
# SHDN/S/STB/FAULT and are not covered.
schema_version: "0.2"
kind: device
id: ti/TCAN332
manufacturer: ti
category: can_transceiver
family: TCAN33x
source: ti/SLLSEQ7F

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 3 V
    max: 3.6 V
    src: p5 "5.3 Recommended Operating Conditions, VCC Supply voltage"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "5.3 Recommended Operating Conditions, TA Operational free-air temperature"
  esd_hbm:
    typ: 4 kV
    src: p5 "5.2 ESD Ratings, HBM, All pins except CANH and CANL (CANH/CANL ±25 kV)"
  data_rate: { max: 1 Mbps, src: 'p3 "Device Options table, TCAN332 row, DERATE column"' }
  bus_fault_voltage:
    min: -14 V
    max: 14 V
    src: p5 "5.1 Absolute Maximum Ratings, Voltage at any bus terminal (CANH or CANL)"

pins:
  src:
    - p4 "Table 4-1 "Pin Functions", column "TCAN332""
    - p4 "Figure 4-2 "TCAN332 D, DCN Packages, 8-Pin SOIC, SOT-23, (Top View)" (cross-check)"
  "1": { name: TXD, type: input }
  "2": { name: GND, type: ground }
  "3": { name: VCC, type: power }
  "4": { name: RXD, type: output }
  "5": { name: NC, type: nc }
  "6": { name: CANL, type: io }
  "7": { name: CANH, type: io }
  "8": { name: NC, type: nc }
