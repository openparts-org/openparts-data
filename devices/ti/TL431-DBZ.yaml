# Programmable shunt reference, DBZ (SOT-23-3) pinout. Differs from the
# D (SOIC) pinout of ti/TL431-D and from the TL432 DBZ pinout (REF 1,
# CATHODE 2). From SLVS543S Table 5-1 "Pin Functions" (page 4), TL431x
# DBZ column: CATHODE 1, REF 2, ANODE 3, checked against the figure
# "TL431, TL431A, TL431B . . . DBZ (SOT-23-3) PACKAGE (TOP VIEW)" on the
# same page. Types as for ti/TL431-D (ANODE ground: "Common pin,
# normally connected to ground").
schema_version: "0.2"
kind: device
id: ti/TL431-DBZ
manufacturer: ti
category: voltage_reference
family: TL431
source: ti/SLVS543S

parameters:
  output_type:
    value: adjustable
    src: 'p1 "1 Features, "Adjustable output voltage: Vref to 36V"; 3 Description: "three-terminal adjustable shunt regulators""'

pins:
  src:
    - p4 "Table 5-1 "Pin Functions", TL431x column "DBZ""
    - p4 ""TL431, TL431A, TL431B . . . DBZ (SOT-23-3) PACKAGE (TOP VIEW)""
  "1": { name: CATHODE, type: passive }
  "2": { name: REF, type: analog }
  "3": { name: ANODE, type: ground }
