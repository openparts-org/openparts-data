# Single 10-MHz RRIO CMOS op amp with shutdown, TLV9061S in DBV
# (SOT-23-6) pinout. From SBOS839N Table 5-2 "Pin Functions: TLV9061S"
# (pages 5-6), column "SOT-23", checked against Figure 5-4 "TLV9061S DBV
# Package, 6-Pin SOT-23 (Top View)" (page 5). The DRY (USON) pin map
# differs and is not covered. SHDN typed input (table type "I"). Minus
# signs written as ASCII "-".
schema_version: "0.2"
kind: device
id: ti/TLV9061S-DBV
manufacturer: ti
category: op_amp
family: TLV906x
source: ti/SBOS839N

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage: { min: 1.8 V, max: 5.5 V, src: 'p10 "6.3 Recommended Operating Conditions, VS"' }
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p10 "6.3 Recommended Operating Conditions, Specified temperature"
  channel_count:
    value: "1"
    src: 'p1 "3 Description: TLV9061 (single), TLV9062 (dual), and TLV9064 (quad)"'
  gain_bandwidth:
    typ: 10 MHz
    at: { VS: 5 V, RL: 10 kΩ, TA: 25 °C }
    src: 'p13 "6.10 Electrical Characteristics: GBP, G = +1"'
  slew_rate:
    typ: 6.5 V/µs
    at: { VS: 5 V, RL: 10 kΩ, TA: 25 °C }
    src: 'p13 "6.10 Electrical Characteristics: SR, G = +1"'
  input_offset_voltage:
    typ: 0.3 mV
    max: 1.6 mV
    at: { VS: 5 V, TA: 25 °C }
    src: 'p13 "6.10 Electrical Characteristics: VOS, VS = 5 V (printed ±0.3/±1.6 mV)"'
  input_bias_current:
    typ: 0.5 pA
    at: { TA: 25 °C }
    src: 'p13 "6.10 Electrical Characteristics: IB (printed ±0.5 pA)"'
  supply_current_per_channel:
    typ: 538 µA
    max: 750 µA
    at: { VS: 5.5 V, IOUT: 0 A, TA: 25 °C }
    src: 'p14 "6.10 Electrical Characteristics: IQ quiescent current per amplifier, VS = 5.5 V"'
  rail_to_rail_input:  { value: yes, src: 'p1 "Features: Rail-to-rail input and output"' }
  rail_to_rail_output: { value: yes, src: 'p1 "Features: Rail-to-rail input and output"' }

pins:
  src:
    - 'p5 "Table 5-2 "Pin Functions: TLV9061S", column "SOT-23" (continued p6)"'
    - p5 "Figure 5-4 "TLV9061S DBV Package, 6-Pin SOT-23 (Top View)""
  "1": { name: OUT, type: analog }
  "2": { name: V-, type: power }
  "3": { name: IN+, type: analog }
  "4": { name: IN-, type: analog }
  "5": { name: SHDN, type: input }
  "6": { name: V+, type: power }
