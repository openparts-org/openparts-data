# Single 10-MHz RRIO CMOS op amp with shutdown, TLV9061S in DBV
# (SOT-23-6) pinout. From SBOS839N Table 5-2 "Pin Functions: TLV9061S"
# (pages 5-6), column "SOT-23", checked against Figure 5-4 "TLV9061S DBV
# Package, 6-Pin SOT-23 (Top View)" (page 5). The DRY (USON) pin map
# differs and is not covered. SHDN typed input (table type "I"). Minus
# signs written as ASCII "-".
schema_version: "0.2"
kind: device
id: ti/TLV9061S-DBV
manufacturer: ti
category: op_amp
family: TLV906x
source: ti/SBOS839N

pins:
  src:
    - 'p5 "Table 5-2 "Pin Functions: TLV9061S", column "SOT-23" (continued p6)"'
    - p5 "Figure 5-4 "TLV9061S DBV Package, 6-Pin SOT-23 (Top View)""
  "1": { name: OUT, type: analog }
  "2": { name: V-, type: power }
  "3": { name: IN+, type: analog }
  "4": { name: IN-, type: analog }
  "5": { name: SHDN, type: input }
  "6": { name: V+, type: power }
