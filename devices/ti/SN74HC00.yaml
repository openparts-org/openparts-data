# Quad 2-input NAND SN74HC00, 14-pin pin map (D, DB, N, NS, PW, J, W)
# from Table 5-1 "Pin Functions" (SCLS181H page 3) checked against the
# 14-pin top view (same page); all 14 pins match. The FK (LCCC)
# numbering differs and is not covered.
schema_version: "0.2"
kind: device
id: ti/SN74HC00
manufacturer: ti
category: logic
family: SNx4HC00
source: ti/SCLS181H

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage: { min: 2 V, max: 6 V, src: 'p4 "6.3 Recommended Operating Conditions, VCC"' }
  supply_current:
    max: 2 µA
    at: { VCC: 6 V, TA: 25 °C }
    src: 'p5 "6.5 Electrical Characteristics Commercial: ICC, VI = VCC or 0, 6 V, 25 °C"'
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p4 "6.3 Recommended Operating Conditions, TA, SN74HC00 row"
  esd_hbm:        { typ: 2 kV, src: 'p4 "6.2 ESD Ratings, HBM"' }
  channel_count: { value: "4", src: 'p1 "3 Description: four independent 2-input NAND Gates"' }
  propagation_delay:
    - typ: 9 ns
      max: 18 ns
      at: { VCC: 4.5 V, TA: 25 °C }
      src: 'p6 "6.7 Switching Characteristics Commercial: tpd A or B to Y, VCC 4.5 V, 25 °C"'
    - typ: 45 ns
      max: 90 ns
      at: { VCC: 2 V, TA: 25 °C }
      src: 'p6 "6.7 Switching Characteristics Commercial: tpd A or B to Y, VCC 2 V, 25 °C"'
    - typ: 8 ns
      max: 15 ns
      at: { VCC: 6 V, TA: 25 °C }
      src: 'p6 "6.7 Switching Characteristics Commercial: tpd A or B to Y, VCC 6 V, 25 °C"'
  logic_function: { value: nand, src: 'p1 "Title: Quadruple 2-Input NAND Gates"' }

pins:
  src:
    - p3 "Table 5-1 "Pin Functions", column "D, DB, N, NS, PW, J, or W""
    - p3 ""D, DB, N, NS, PW, J, or W Package 14-Pin ... Top View" figure (cross-check)"
  "1":  { name: 1A, type: input }
  "2":  { name: 1B, type: input }
  "3":  { name: 1Y, type: output }
  "4":  { name: 2A, type: input }
  "5":  { name: 2B, type: input }
  "6":  { name: 2Y, type: output }
  "7":  { name: GND, type: ground }
  "8":  { name: 3Y, type: output }
  "9":  { name: 3A, type: input }
  "10": { name: 3B, type: input }
  "11": { name: 4Y, type: output }
  "12": { name: 4A, type: input }
  "13": { name: 4B, type: input }
  "14": { name: VCC, type: power }
