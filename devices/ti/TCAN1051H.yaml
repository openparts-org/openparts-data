# CAN FD transceiver TCAN1051H (also G/HG: same pin column), D (SOIC-8)
# pin map from Table 5-1 "Pin Functions" column "(H), (G), (HG)" and
# Figure 5-1 (SLLSES8E page 5): TXD 1, GND 2, VCC 3, RXD 4, NC 5, CANL
# 6, CANH 7, S 8. The "V" variants (pin 5 = VIO) are a different pin map
# and not covered. S (silent mode control) typed input.
schema_version: "0.2"
kind: device
id: ti/TCAN1051H
manufacturer: ti
category: can_transceiver
family: TCAN1051H
source: ti/SLLSES8E

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 4.5 V
    max: 5.5 V
    src: p8 "6.4 Recommended Operating Conditions, VCC 5-V Bus Supply Voltage Range"
  esd_hbm:
    typ: 6 kV
    src: p6 "6.2 ESD Ratings, D (SOIC), HBM, All terminals (CANH/CANL to GND ±16 kV)"
  bus_fault_voltage:
    min: -70 V
    max: 70 V
    src: p6 "6.1 Absolute Maximum Ratings, VBUS CANH/CANL, devices with the H suffix"

pins:
  src:
    - p5 "Table 5-1. Pin Functions, column (H), (G), (HG)"
    - p5 "Figure 5-1. D Package for (H), (G) and (HG) Devices"
  "1": { name: TXD, type: input }
  "2": { name: GND, type: ground }
  "3": { name: VCC, type: power }
  "4": { name: RXD, type: output }
  "5": { name: NC, type: nc }
  "6": { name: CANL, type: io }
  "7": { name: CANH, type: io }
  "8": { name: S, type: input }
