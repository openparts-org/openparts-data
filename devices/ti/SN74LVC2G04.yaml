# Dual inverter SN74LVC2G04, 6-pin pin map from the "Pin Functions"
# table (SCES195N page 3) checked against the "DBV Package 6-Pin SOT-23
# Top View" figure (same page; DCK/DRL figures identical): 1A 1, GND 2,
# 2A 3 down the left edge, 2Y 4, VCC 5, 1Y 6 up the right edge. The
# YZP (DSBGA) ball map is not covered.
schema_version: "0.2"
kind: device
id: ti/SN74LVC2G04
manufacturer: ti
category: logic
family: SN74LVC2G04
source: ti/SCES195N

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.65 V
    max: 5.5 V
    src: p4 "6.3 Recommended Operating Conditions, VCC, Operating"
  supply_current:
    max: 10 µA
    at: { VCC: 1.65..5.5 V }
    src: 'p5 "6.5 Electrical Characteristics: ICC, VI = 5.5 V or GND, IO = 0"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "6.3 Recommended Operating Conditions (continued), TA"
  esd_hbm:        { typ: 2 kV, src: 'p4 "6.2 ESD Ratings, HBM"' }
  channel_count:  { value: "2", src: 'p1 "Title: Dual Inverter Gate"' }
  propagation_delay:
    min: 1.2 ns
    max: 4.1 ns
    at: { VCC: 3.3 V, CL: 50 pF, TA: -40..85 °C }
    src: 'p6 "6.6 Switching Characteristics: tpd, VCC = 3.3 V, -40 to 85 °C (CL per p7 Figure 2 table)"'
  logic_function: { value: inverter, src: 'p1 "Title: Dual Inverter Gate"' }
  output_current_high:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p4 "6.3 Recommended Operating Conditions, IOH, VCC = 4.5 V (printed -32 mA)"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p4 "6.3 Recommended Operating Conditions, IOH, VCC = 3 V (printed -24 mA)"
  output_current_low:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p5 "6.3 Recommended Operating Conditions, IOL, VCC = 4.5 V"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p5 "6.3 Recommended Operating Conditions, IOL, VCC = 3 V"

pins:
  src:
    - p3 ""Pin Functions" table (NAME / NO.)"
    - p3 ""DBV Package 6-Pin SOT-23 Top View" figure (cross-check)"
  "1": { name: 1A, type: input }
  "2": { name: GND, type: ground }
  "3": { name: 2A, type: input }
  "4": { name: 2Y, type: output }
  "5": { name: VCC, type: power }
  "6": { name: 1Y, type: output }
