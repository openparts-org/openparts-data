# Dual bus buffer gate with 3-state outputs SN74LVC2G125, 8-pin pin map
# of the DCT (SM8) and DCU (VSSOP-8) packages from the "Pin Functions"
# table (SCES204Q page 4), column "DCT, DCU", checked against the "DCU
# PACKAGE (TOP VIEW)" figure on the same page; all 8 pins match. 1OE and
# 2OE are active-low output enables (overbar per the revision history,
# page 2); named without a suffix as in ti/SN74AHCT125. The YZP (DSBGA)
# ball map is not covered.
schema_version: "0.2"
kind: device
id: ti/SN74LVC2G125
manufacturer: ti
category: logic
family: SN74LVC2G125
source: ti/SCES204Q

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.65 V
    max: 5.5 V
    src: p6 "6.3 Recommended Operating Conditions, VCC, Operating"
  supply_current:
    max: 10 µA
    at: { VCC: 1.65..5.5 V }
    src: 'p7 "6.5 Electrical Characteristics: ICC, VI = 5.5 V or GND, IO = 0, -40 to 85 °C"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p6 "6.3 Recommended Operating Conditions, TA"
  esd_hbm: { typ: 2 kV, src: 'p5 "6.2 ESD Ratings, HBM"' }
  channel_count: { value: "2", src: 'p1 "Title: Dual Bus Buffer Gate With 3-State Outputs"' }
  propagation_delay:
    min: 1.4 ns
    max: 4.3 ns
    at: { VCC: 3.3 V, CL: 50 pF, TA: -40..85 °C }
    src: 'p7 "6.6 Switching Characteristics -40 to +85°C: tpd A to Y, VCC = 3.3 V (CL per p9 Figure 3 table)"'
  logic_function: { value: buffer, src: 'p1 "Title: Dual Bus Buffer Gate With 3-State Outputs"' }
  output_current_high:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p6 "6.3 Recommended Operating Conditions, IOH, VCC = 4.5 V (printed -32 mA)"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p6 "6.3 Recommended Operating Conditions, IOH, VCC = 3 V (printed -24 mA)"
  output_current_low:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p6 "6.3 Recommended Operating Conditions, IOL, VCC = 4.5 V"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p6 "6.3 Recommended Operating Conditions, IOL, VCC = 3 V"

pins:
  src:
    - p4 ""Pin Functions" table, column "DCT, DCU""
    - p4 ""DCU PACKAGE (TOP VIEW)" figure (cross-check)"
  "1": { name: 1OE, type: input }
  "2": { name: 1A, type: input }
  "3": { name: 2Y, type: output }
  "4": { name: GND, type: ground }
  "5": { name: 2A, type: input }
  "6": { name: 1Y, type: output }
  "7": { name: 2OE, type: input }
  "8": { name: VCC, type: power }
