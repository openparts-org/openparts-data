# LM1117 800-mA LDO, fixed-output options, NGN (WSON-8) pinout.
# SNOS412Q Table 6-1 "Pin Functions" (page 3), WSON column: ADJ/GND 1,
# VIN "2, 3, 4", VOUT "5, 6, 7, TAB"; pin 8 from Figure 6-5 "NGN
# Package, 8-Pin WSON (Top View)" ("NOT CONNECTED"; the table has no
# row for it). Figure note: "pins 2, 3, and 4 must be connected together
# and pins 5, 6, and 7 must be connected together". The thermal pad
# ("TAB" in the VOUT row) is key "EP".
# Pin 1 "Ground pin for fixed output option" -> ground.
schema_version: "0.2"
kind: device
id: ti/LM1117-FIXED-NGN
manufacturer: ti
category: linear_regulator
family: LM1117
source: ti/SNOS412Q

parameters:
  output_type:       { value: fixed, src: p1 "3 Description" }
  input_voltage_max: { max: 15 V, src: 'p4 "7.3 Recommended Operating Conditions, VIN"' }
  output_current:    { max: 800 mA, src: p1 "1 Features" }
  dropout_voltage:
    - typ: 1.2 V
      max: 1.3 V
      at: { IOUT: 800 mA }
      src: p6 "7.5 LM1117 (not LM1117I) Elec. Char., Dropout voltage"
    - typ: 1.1 V
      max: 1.2 V
      at: { IOUT: 100 mA }
      src: p6 "7.5 LM1117 (not LM1117I) Elec. Char., Dropout voltage"
    - typ: 1.15 V
      max: 1.25 V
      at: { IOUT: 500 mA }
      src: p6 "7.5 LM1117 (not LM1117I) Elec. Char., Dropout voltage"

pins:
  src:
    - 'p3 "Table 6-1 "Pin Functions", WSON column: ADJ/GND 1, VIN "2, 3, 4", VOUT "5, 6, 7, TAB""'
    - 'p3 "Figure 6-5 "NGN Package, 8-Pin WSON (Top View)": 8 "NOT CONNECTED", centre pad VOUT"'
  "1": { name: ADJ/GND, type: ground }
  "2": { name: VIN, type: power }
  "3": { name: VIN, type: power }
  "4": { name: VIN, type: power }
  "5": { name: VOUT, type: power }
  "6": { name: VOUT, type: power }
  "7": { name: VOUT, type: power }
  "8": { name: NOT CONNECTED, type: nc }
  EP:  { name: VOUT, type: power }
