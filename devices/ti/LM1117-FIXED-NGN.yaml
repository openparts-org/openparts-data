# LM1117 800-mA LDO, fixed-output options, NGN (WSON-8) pinout.
# SNOS412Q Table 6-1 "Pin Functions" (page 3), WSON column: ADJ/GND 1,
# VIN "2, 3, 4", VOUT "5, 6, 7, TAB"; pin 8 from Figure 6-5 "NGN
# Package, 8-Pin WSON (Top View)" ("NOT CONNECTED"; the table has no
# row for it). Figure note: "pins 2, 3, and 4 must be connected together
# and pins 5, 6, and 7 must be connected together". The thermal pad
# ("TAB" in the VOUT row) is key "EP".
# Pin 1 "Ground pin for fixed output option" -> ground.
schema_version: "0.1"
kind: device
id: ti/LM1117-FIXED-NGN

manufacturer: ti
category: linear_regulator
family: LM1117

pins:
  "1": { name: "ADJ/GND", type: ground }
  "2": { name: "VIN", type: power }
  "3": { name: "VIN", type: power }
  "4": { name: "VIN", type: power }
  "5": { name: "VOUT", type: power }
  "6": { name: "VOUT", type: power }
  "7": { name: "VOUT", type: power }
  "8": { name: "NOT CONNECTED", type: nc }
  "EP": { name: "VOUT", type: power }

parameters:
  output_type:
    value: fixed
  input_voltage_max:
    max: 15
    unit: V
  output_current:
    nominal: 800
    unit: mA
  dropout_voltage:
    nominal: 1.2
    max: 1.3
    unit: V

provenance:
  "/parameters/output_type":
    - source: ti/SNOS412Q
      page: 1
      locator: "3 Description: \"the device is available in five fixed voltages, 1.8 V, 2.5 V, 3.3 V, and 5 V\""
  "/parameters/input_voltage_max":
    - source: ti/SNOS412Q
      page: 4
      locator: "7.3 Recommended Operating Conditions, Input voltage (VIN to GND): MAX 15 V"
  "/parameters/output_current":
    - source: ti/SNOS412Q
      page: 1
      locator: "1 Features, \"Output current: 800 mA\""
  "/parameters/dropout_voltage":
    - source: ti/SNOS412Q
      page: 6
      locator: "7.5 LM1117 Electrical Characteristics (continued), Dropout voltage, IOUT = 800 mA: TYP 1.2 V (TJ = 25°C), MAX 1.3 V (0°C to 125°C); LM1117 (not LM1117I) table, orderables listed 0 to 125 °C in the package option addendum"
  "/pins":
    - source: ti/SNOS412Q
      page: 3
      locator: "Table 6-1 \"Pin Functions\", WSON column: ADJ/GND 1, VIN \"2, 3, 4\", VOUT \"5, 6, 7, TAB\""
    - source: ti/SNOS412Q
      page: 3
      locator: "Figure 6-5 \"NGN Package, 8-Pin WSON (Top View)\": 8 \"NOT CONNECTED\", centre pad VOUT"
