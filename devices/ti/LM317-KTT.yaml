# LM317 1.5-A adjustable regulator, KTT (TO-263) pinout. SLVS044Z
# "Pin Functions, Metal Can Packages" (page 5), TO-263 column: ADJUST 1,
# OUTPUT "2, TAB", INPUT 3; Figure 5-3 "KTT Package, 3-Pin TO-263 (Top
# View)". The tab is keyed "4" -- the number outline KTT0003B (page 42)
# prints on it -- and, being listed with pin 2 as OUTPUT, carries
# connected_to "2".
schema_version: "0.2"
kind: device
id: ti/LM317-KTT
manufacturer: ti
category: linear_regulator
family: LM317
source: ti/SLVS044Z

parameters:
  output_type:    { value: adjustable, src: 'p1 "1 Features, Output voltage range"' }
  output_current: { max: 1.5 A, src: 'p1 "1 Features, Output current"' }

pins:
  src:
    - 'p5 ""Pin Functions, Metal Can Packages", TO-263 column: ADJUST 1, INPUT 3, OUTPUT "2, TAB""'
    - p5 "Figure 5-3 "KTT Package, 3-Pin TO-263 (Top View)""
    - 'p42 "KTT0003B outline, bottom view: tab / exposed thermal pad labelled "4""'
  "1": { name: ADJUST, type: input }
  "2": { name: OUTPUT, type: power }
  "3": { name: INPUT, type: power }
  "4": { name: OUTPUT, type: power, connected_to: "2" }
