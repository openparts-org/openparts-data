      page: 5
      locator: "\"Pin Functions, Metal Can Packages\", TO-263 column: ADJUST 1, INPUT 3, OUTPUT \"2, TAB\""
    - source: ti/SLVS044Z
      page: 5
      locator: "Figure 5-3 \"KTT Package, 3-Pin TO-263 (Top View)\""
    - source: ti/SLVS044Z
      page: 42
