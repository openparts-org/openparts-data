# DRV8874 H-bridge brushed-DC motor driver with current sense and
# regulation, PWP pin map. Pin Functions table, PWP column (SLVSF66A
# page 3), cross-checked with the "DRV8874 PWP Package 16-Pin HTSSOP Top View" figure (same
# page). CPH/CPL/VCP (charge-pump terminals, "PWR") typed passive;
# nFAULT open-drain -> output; IPROPI (analog current output) analog;
# VREF analog. PMODE/IMODE are tri-/quad-level inputs (input). The
# table's "PAD" row (no number, "Connect to system ground") -> pin "EP"
# named PAD, passive. rds_on is the printed "High-Side + Low-Side"
# feature value (page 1).
schema_version: "0.2"
kind: device
id: ti/DRV8874
manufacturer: ti
category: motor_driver
family: DRV8874
source: ti/SLVSF66A

# Parameters (AI candidates, needs review).
parameters:
  data_interface:
    values: [phase_enable, pwm]
    src:    p1 "1 Features, Selectable input control modes (PMODE), PH/EN and PWM"
  rds_on: { typ: 200 mΩ, src: 'p1 "1 Features, DRV8874: 200-mΩ (High-Side + Low-Side)"' }
  supply_current:
    typ: 3 mA
    max: 7 mA
    at: { VM: 24 V }
    src: p5 "6.5 Electrical Characteristics, IVM VM active mode current"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p4 "6.3 Recommended Operating Conditions, TA"
  esd_hbm:       { typ: 2 kV, src: 'p4 "6.2 ESD Ratings, HBM ±2000 V"' }
  channel_count: { value: "1", src: 'p3 "Pin Functions, one H-bridge (OUT1, OUT2)"' }
  motor_type:
    value: brushed_dc
    src: p1 "1 Features, Drives one bidirectional brushed DC motor"
  motor_supply_voltage:
    min: 4.5 V
    max: 37 V
    src: p4 "6.3 Recommended Operating Conditions, VVM"
  output_current_peak:
    max: 6 A
    src: p4 "6.3 Recommended Operating Conditions, IOUT peak output current"

pins:
  src:
    - p3 "Pin Functions, PWP column"
    - p3 "DRV8874 PWP Package 16-Pin HTSSOP Top View (cross-check)"
  "1":  { name: EN/IN1, type: input }
  "2":  { name: PH/IN2, type: input }
  "3":  { name: nSLEEP, type: input }
  "4":  { name: nFAULT, type: output }
  "5":  { name: VREF, type: analog }
  "6":  { name: IPROPI, type: analog }
  "7":  { name: IMODE, type: input }
  "8":  { name: OUT1, type: output }
  "9":  { name: PGND, type: ground }
  "10": { name: OUT2, type: output }
  "11": { name: VM, type: power }
  "12": { name: VCP, type: passive }
  "13": { name: CPH, type: passive }
  "14": { name: CPL, type: passive }
  "15": { name: GND, type: ground }
  "16": { name: PMODE, type: input }
  EP:   { name: PAD, type: passive }
