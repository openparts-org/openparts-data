# LM7805 1.5-A fixed 5-V regulator, KTT (TO-263) pinout. SNOSBT0L "Pin
# Functions" (page 3): INPUT 1, GND 2, OUTPUT 3; "LM7805 and LM7812 KTT
# Package 3-Pin DDPAK/TO-263 Top View": "TAB IS GND". The tab is keyed
# "4", the number outline KTT0003B (page 29) prints on it.
schema_version: "0.2"
kind: device
id: ti/LM7805-KTT
manufacturer: ti
category: linear_regulator
family: LM7805
source: ti/SNOSBT0L

parameters:
  output_type:    { value: fixed, src: p1 "Title; 1 Features" }
  output_voltage:
    - min: 4.8 V
      typ: 5 V
      max: 5.2 V
      at: { IOUT: 5..1000 mA, TJ: 25 °C }
      src: p6 "6.6 LM340/LM7805 Elec. Char., VO"
    - min: 4.75 V
      max: 5.25 V
      at: { VIN: 7.5..20 V, IOUT: 5..1000 mA }
      src: p6 "6.6 LM340/LM7805 Elec. Char., VO, PD <= 15 W"
  output_current: { max: 1.5 A, src: p1 "1 Features" }
  dropout_voltage:
    typ: 2 V
    at: { IOUT: 1 A, TJ: 25 °C }
    src: p6 "6.6 LM340/LM7805 Elec. Char., Dropout voltage"

pins:
  src:
    - 'p3 ""Pin Functions": INPUT 1, GND 2, OUTPUT 3"'
    - 'p3 ""LM7805 and LM7812 KTT Package 3-Pin DDPAK/TO-263 Top View": "TAB IS GND""'
    - 'p29 "KTT0003B outline, bottom view: tab labelled "4""'
  "1": { name: INPUT, type: power }
  "2": { name: GND, type: ground }
  "3": { name: OUTPUT, type: power }
  "4": { name: GND, type: ground }
