# 500-mA LDO with active discharge (all fixed voltages), DBV (SOT-23-5)
# pinout. From SBVS320D Table 4-1 "Pin Functions" (page 3), DBV column:
# IN 1, GND 2, EN 3, NC 4, OUT 5, checked against Figure 4-2 "DBV
# Package, 5-Pin SOT-23 (Top View)" (same page). The DYD/DQN/DRV pin
# maps (with thermal pad) are not covered. NC is "No internal
# connection". IN/OUT typed power, as for ti/LM1117-3.3.
schema_version: "0.1"
kind: device
id: ti/TLV755P-DBV

manufacturer: ti
category: linear_regulator
family: TLV755P

pins:
  "1": { name: IN, type: power }
  "2": { name: GND, type: ground }
  "3": { name: EN, type: input }
  "4": { name: NC, type: nc }
  "5": { name: OUT, type: power }

parameters:
  output_type:
    value: fixed
  input_voltage_max:
    max: 5.5
    unit: V
  output_current:
    max: 500
    unit: mA

provenance:
  "/parameters/output_type":
    - source: ti/SBVS320D
      page: 1
      locator: "3 Description: \"the device is offered in fixed output voltages ranging from 0.6V to 5V\""
  "/parameters/input_voltage_max":
    - source: ti/SBVS320D
      page: 4
      locator: "5.3 Recommended Operating Conditions, VIN Input voltage: MAX 5.5 V"
  "/parameters/output_current":
    - source: ti/SBVS320D
      page: 4
      locator: "5.3 Recommended Operating Conditions, IOUT Output current: MAX 500 mA"
  "/pins":
    - source: ti/SBVS320D
      page: 3
      locator: "Table 4-1 \"Pin Functions\", column \"DBV\""
    - source: ti/SBVS320D
      page: 3
      locator: "Figure 4-2 \"DBV Package, 5-Pin SOT-23 (Top View)\""
