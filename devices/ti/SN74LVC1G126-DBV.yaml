# Single bus buffer gate with 3-state output (OE active high)
# (SN74LVC1G126), 5-pin pin map of the DBV (SOT-23-5) package, from the
# "Pin Functions" table (SCES224S page 3), column "DBV, DCK, DRL, YZP":
# OE 1, A 2, GND 3, Y 4, VCC 5; checked against the DBV top-view figure
# on the same page. The 6-pin DRY/DSF and the BGA pin maps differ and
# are not covered.
schema_version: "0.2"
kind: device
id: ti/SN74LVC1G126-DBV
manufacturer: ti
category: logic
family: SN74LVC1G126
source: ti/SCES224S

pins:
  src:
    - p3 "Pin Functions" table, column "DBV, DCK, DRL, YZP"
    - p3 ""DBV PACKAGE (TOP VIEW)" figure (cross-check)"
  "1": { name: OE, type: input }
  "2": { name: A, type: input }
  "3": { name: GND, type: ground }
  "4": { name: Y, type: output }
  "5": { name: VCC, type: power }
