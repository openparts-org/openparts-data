# Quad 2-input NOR SN74HC02, 14-pin pin map (D, DB, N, NS, PW, J, W)
# from the "Pin Functions" table (SCLS076G page 3), checked against
# Figure 5-1 (14-pin top view, same page). The FK (LCCC) numbering
# differs and is not covered.
schema_version: "0.2"
kind: device
id: ti/SN74HC02
manufacturer: ti
category: logic
family: SNx4HC02
source: ti/SCLS076G

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage: { min: 2 V, max: 6 V, src: 'p4 "6.3 Recommended Operating Conditions, VCC"' }
  supply_current:
    max: 2 µA
    at: { VCC: 6 V, TA: 25 °C }
    src: 'p5 "6.5 Electrical Characteristics - Commercial (74xx): ICC, 6 V, 25 °C"'
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p4 "6.3 Recommended Operating Conditions, TA, row labelled SN74HC00 (sic)"
  esd_hbm:          { typ: 1.5 kV, src: 'p4 "6.2 ESD Ratings, HBM"' }
  channel_count: { value: "4", src: 'p1 "3 Description: four independent 2-input NOR gates"' }
  propagation_delay:
    - typ: 9 ns
      max: 18 ns
      at: { VCC: 4.5 V, TA: 25 °C }
      src: 'p6 "6.7 Switching Characteristics - Commercial (74xx): tpd A or B to Y, 4.5 V"'
    - typ: 45 ns
      max: 90 ns
      at: { VCC: 2 V, TA: 25 °C }
      src: 'p6 "6.7 Switching Characteristics - Commercial (74xx): tpd A or B to Y, 2 V"'
    - typ: 8 ns
      max: 15 ns
      at: { VCC: 6 V, TA: 25 °C }
      src: 'p6 "6.7 Switching Characteristics - Commercial (74xx): tpd A or B to Y, 6 V"'
  output_structure: { value: push_pull, src: p9 "8.3 Balanced CMOS Push-Pull Outputs" }
  logic_function:   { value: nor, src: 'p1 "Title, Quadruple 2-Input Positive-NOR Gates"' }

pins:
  src:
    - p3 "Pin Functions table, column D, DB, N, NS, PW, J, or W"
    - p3 "Figure 5-1, 14-pin top view (cross-check)"
  "1":  { name: 1Y, type: output }
  "2":  { name: 1A, type: input }
  "3":  { name: 1B, type: input }
  "4":  { name: 2Y, type: output }
  "5":  { name: 2A, type: input }
  "6":  { name: 2B, type: input }
  "7":  { name: GND, type: ground }
  "8":  { name: 3A, type: input }
  "9":  { name: 3B, type: input }
  "10": { name: 3Y, type: output }
  "11": { name: 4A, type: input }
  "12": { name: 4B, type: input }
  "13": { name: 4Y, type: output }
  "14": { name: VCC, type: power }
