# TPD4E1B06, pin map of the DRL (SOT-5X3, 6 pins) package. From Table 4-1
# Pin Functions, DRL column: IO1 1, GND 2, IO2 3, IO3 4, NC 5, IO4 6.
schema_version: "0.2"
kind: device
id: ti/TPD4E1B06-DRL
manufacturer: ti
category: diode
family: TPD4E1B06
source: ti/SLVSBQ8E

parameters:
  reverse_voltage: { min: -5.5 V, max: 5.5 V, src: 'p5 "5.5 Electrical Characteristics, VRWM"' }
  clamping_voltage:
    - typ: 10.9 V
      at: { IPP: 1 A }
      src: p5 "5.5 Electrical Characteristics, VCLAMP, IPP = 1 A, tp = 8/20 µs"
    - typ: 14.5 V
      at: { IPP: 3 A }
      src: p5 "5.5 Electrical Characteristics, VCLAMP, IPP = 3 A, tp = 8/20 µs"
  peak_pulse_current:
    max: 3 A
    src: p4 "5.1 Absolute Maximum Ratings, IPP peak pulse current (tp = 8/20 µs), IO pin to GND"
  peak_pulse_power:
    max: 45 W
    src: p4 "5.1 Absolute Maximum Ratings, PPP peak pulse power (tp = 8/20 µs)"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p4 "5.3 Recommended Operating Conditions, TA"

pins:
  src: p3 "Table 4-1 Pin Functions, DRL column"
  "1": { name: IO1, type: passive }
  "2": { name: GND, type: ground }
  "3": { name: IO2, type: passive }
  "4": { name: IO3, type: passive }
  "5": { name: NC, type: nc }
  "6": { name: IO4, type: passive }
