# Single 2-input exclusive-OR gate (SN74LVC1G86), 5-pin pin map of the
# DBV (SOT-23-5) package, from the "Pin Functions" table (SCES222R page
# 3), column "DBV, DRL, DCK": A 1, B 2, GND 3, Y 4, VCC 5; checked
# against the DBV top-view figure on the same page. The 6-pin DRY/DSF
# and the BGA pin maps differ and are not covered.
schema_version: "0.2"
kind: device
id: ti/SN74LVC1G86-DBV
manufacturer: ti
category: logic
family: SN74LVC1G86
source: ti/SCES222R

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.65 V
    max: 5.5 V
    src: p4 "5.3 Recommended Operating Conditions, VCC, Operating"
  supply_current:
    max: 10 µA
    at: { VCC: 1.65..5.5 V }
    src: 'p5 "5.5 Electrical Characteristics: ICC, VI = VCC or GND, IO = 0, -40 to 85 °C"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "5.3 Recommended Operating Conditions, TA, DCK, DBV, and DRL packages"
  esd_hbm:        { typ: 2 kV, src: 'p4 "5.2 ESD Ratings, HBM"' }
  channel_count:  { value: "1", src: 'p1 "Title: Single 2-Input Exclusive-OR Gate"' }
  propagation_delay:
    min: 0.6 ns
    max: 4 ns
    at: { VCC: 3.3 V, CL: 15 pF, TA: -40..85 °C }
    src: 'p6 "5.6 Switching Characteristics CL = 15pF: tpd, VCC = 3.3V ± 0.3V, -40 to +85 °C"'
  logic_function: { value: xor, src: 'p1 "Title: Single 2-Input Exclusive-OR Gate"' }
  output_current_high:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p4 "5.3 Recommended Operating Conditions, IOH, VCC = 4.5 V (printed -32 mA)"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p4 "5.3 Recommended Operating Conditions, IOH, VCC = 3 V (printed -24 mA)"
  output_current_low:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p5 "5.3 Recommended Operating Conditions, IOL, VCC = 4.5 V"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p5 "5.3 Recommended Operating Conditions, IOL, VCC = 3 V"

pins:
  src:
    - p3 "Pin Functions" table, column "DBV, DRL, DCK"
    - p3 ""Figure 4-1. DBV Package 5-Pin SOT-23 Top View" figure (cross-check)"
  "1": { name: A, type: input }
  "2": { name: B, type: input }
  "3": { name: GND, type: ground }
  "4": { name: Y, type: output }
  "5": { name: VCC, type: power }
