# Dual low-voltage op amp, 8-pin pinout of the D, DDU, DGK and PW
# packages. From SLOS263Y Table 5-1 "Pin Functions: LMV358" (page 3),
# checked against Figure 5-1 "D, DDU, DGK, and PW Packages" (same
# page). Pin 1 is printed "OUT" (not "1OUT") in both the table and the
# figure; kept as printed. GND is "Negative supply" and VCC+ "Positive
# supply": both typed power (GND is the negative rail, as V- on
# ti/OPA2333). Minus signs written as ASCII "-". The LMV358A is a
# different device (separate datasheet) and is not covered.
schema_version: "0.2"
kind: device
id: ti/LMV358
manufacturer: ti
category: op_amp
family: LMV3xx
source: ti/SLOS263Y

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: p5 "6.3 Recommended Operating Conditions, VCC (single-supply operation)"
  supply_current:
    typ: 210 µA
    max: 440 µA
    at: { VCC: 5 V, TA: 25 °C }
    src: 'p7 "6.8 Electrical Characteristics VCC+ = 5 V: ICC, LMV358I (both amplifiers), 25 °C"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "6.3 Recommended Operating Conditions, TA, I temperature (LMV321, LMV358, LMV324)"
  esd_hbm:             { typ: 2 kV, src: 'p5 "6.2 ESD Ratings, HBM, all pins"' }
  channel_count:
    value: "2"
    src: 'p1 "3 Description: single, dual, and quad (LMV321, LMV358, LMV324)"'
  gain_bandwidth:
    typ: 1 MHz
    at: { VCC: 5 V, CL: 200 pF, TA: 25 °C }
    src: 'p7 "6.8 Electrical Characteristics VCC+ = 5 V: B1 unity-gain bandwidth"'
  slew_rate:
    typ: 1 V/µs
    at: { VCC: 5 V, TA: 25 °C }
    src: 'p7 "6.8 Electrical Characteristics VCC+ = 5 V: SR"'
  input_offset_voltage:
    typ: 1.7 mV
    max: 7 mV
    at: { VCC: 5 V, TA: 25 °C }
    src: 'p7 "6.8 Electrical Characteristics VCC+ = 5 V: VIO, TA = 25 °C"'
  input_bias_current:
    typ: 15 nA
    max: 250 nA
    at: { VCC: 5 V, TA: 25 °C }
    src: 'p7 "6.8 Electrical Characteristics VCC+ = 5 V: IIB, TA = 25 °C"'
  rail_to_rail_input:
    value: no
    src: 'p7 "6.8 Electrical Characteristics VCC+ = 5 V: VICR 0 to 4 V (CMRR ≥ 50 dB)"'
  rail_to_rail_output: { value: yes, src: 'p1 "Features: Rail-to-rail output swing"' }

pins:
  src:
    - 'p3 "Table 5-1 "Pin Functions: LMV358""'
    - p3 "Figure 5-1 "D, DDU, DGK, and PW Packages, 8-Pin SOIC, VSSOP, and TSSOP (Top View)" (all 8 pins matched)"
  "1": { name: OUT, type: analog }
  "2": { name: 1IN-, type: analog }
  "3": { name: 1IN+, type: analog }
  "4": { name: GND, type: power }
  "5": { name: 2IN+, type: analog }
  "6": { name: 2IN-, type: analog }
  "7": { name: 2OUT, type: analog }
  "8": { name: VCC+, type: power }
