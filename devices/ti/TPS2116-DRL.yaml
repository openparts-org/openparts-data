# 1.6-V to 5.5-V, 2.5-A two-input power multiplexer, DRL (SOT-5X3,
# 8-pin) pinout. From SLVSFG1A Table 5-1 "Pin Functions" (page 3): GND
# 1, VOUT 2 and 7, VIN1 3, PR1 4, MODE 5, VIN2 6, ST 8; checked against
# Figure 5-1 "DRL Package 8-Pin SOT Top View" (same page). ST is the
# open-drain status output; VIN1/VIN2/VOUT -> power.
schema_version: "0.2"
kind: device
id: ti/TPS2116-DRL
manufacturer: ti
category: power_switch
family: TPS2116
source: ti/SLVSFG1A

parameters:
  input_voltage_max:
    max: 5.5 V
    src: p4 "6.3 Recommended Operating Conditions, VIN1, VIN2 input voltage"
  output_current: { max: 2.5 A, src: 'p4 "6.1 Absolute Maximum Ratings, IMAX maximum current"' }
  operating_temperature:
    min: -40 °C
    max: 105 °C
    src: p4 "6.3 Recommended Operating Conditions, TA ambient temperature"
  esd_hbm: { typ: 2 kV, src: 'p4 "6.2 ESD Ratings, HBM all pins ±2000 V"' }

pins:
  src: [p3 "Table 5-1 "Pin Functions"", p3 "Figure 5-1 "DRL Package 8-Pin SOT Top View""]
  "1": { name: GND, type: ground }
  "2": { name: VOUT, type: power }
  "3": { name: VIN1, type: power }
  "4": { name: PR1, type: input }
  "5": { name: MODE, type: input }
  "6": { name: VIN2, type: power }
  "7": { name: VOUT, type: power }
  "8": { name: ST, type: output }
