# ADS1115 4-channel I2C delta-sigma ADC, pin map for the RUG, DYN and
# DGS packages (the table covers all three) from Table 4-1 "Pin
# Functions: RUG, DYN, and DGS Packages" column "ADS1115" (SBAS444E page 3),
# checked against Figure 4-2 (same page); all 10 pins match. GND and
# VDD are type "Analog" in the table; typed ground/power from their
# descriptions ("Ground", "Power supply"). SCL ("Serial clock input")
# typed clock, ALERT/RDY (open-drain digital output) output, SDA io.
schema_version: "0.2"
kind: device
id: ti/ADS1115
manufacturer: ti
category: adc
family: ADS111x
source: ti/SBAS444E

# Parameters (AI candidates, needs review).
parameters:
  data_interface: { value: i2c, src: 'p1 "Features, I2C interface: four pin-selectable addresses"' }
  supply_voltage:
    min: 2 V
    max: 5.5 V
    src: 'p4 "5.3 Recommended Operating Conditions: Power supply (VDD to GND)"'
  supply_current:
    typ: 150 µA
    max: 200 µA
    at: { VDD: 3.3 V, TA: 25 °C }
    src: 'p6 "5.5 Electrical Characteristics: IVDD supply current, operating, TA = 25°C"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: 'p4 "5.3 Recommended Operating Conditions: TA operating ambient temperature"'
  esd_hbm:    { typ: 2 kV, src: 'p4 "5.2 ESD Ratings, HBM"' }
  channel_count:
    value: "4"
    src: 'p1 "Description: two differential or four single-ended inputs"'
  resolution: { value: "16", src: 'p1 "Title, 860SPS, 16-Bit ADCs"' }
  sample_rate: { max: 860 SPS, src: 'p1 "Features, Programmable data rate: 8SPS to 860SPS"' }
  reference: { value: internal, src: 'p1 "Features, Internal low-drift voltage reference"' }

pins:
  src:
    - 'p3 "Table 4-1 "Pin Functions: RUG, DYN, and DGS Packages", column "ADS1115""'
    - p3 "Figure 4-2 "DYN and DGS Packages, 10-Pin (Top View)" (cross-check)"
  "1":  { name: ADDR, type: input }
  "2":  { name: ALERT/RDY, type: output }
  "3":  { name: GND, type: ground }
  "4":  { name: AIN0, type: analog }
  "5":  { name: AIN1, type: analog }
  "6":  { name: AIN2, type: analog }
  "7":  { name: AIN3, type: analog }
  "8":  { name: VDD, type: power }
  "9":  { name: SDA, type: io }
  "10": { name: SCL, type: clock }
