    - p4 ""Pin Functions" table, column "DB, PW""
    - p4 ""DB, PW Package 24-Pin TSSOP Top View" figure (cross-check)"
  "1":  { name: INT, type: output }
  "2":  { name: A1, type: input }
  "3":  { name: A2, type: input }
  "4":  { name: P00, type: io }
  "5":  { name: P01, type: io }
  "6":  { name: P02, type: io }
  "7":  { name: P03, type: io }
  "8":  { name: P04, type: io }
  "9":  { name: P05, type: io }
  "10": { name: P06, type: io }
  "11": { name: P07, type: io }
  "12": { name: GND, type: ground }
  "13": { name: P10, type: io }
  "14": { name: P11, type: io }
  "15": { name: P12, type: io }
  "16": { name: P13, type: io }
  "17": { name: P14, type: io }
  "18": { name: P15, type: io }
  "19": { name: P16, type: io }
  "20": { name: P17, type: io }
  "21": { name: A0, type: input }
