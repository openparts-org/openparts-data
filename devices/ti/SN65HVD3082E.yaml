# Half-duplex RS-485 transceiver SN65HVD3082E (SN75HVD3082E, the
# 0..70 C grade, shares the pin map), 8-pin D/P/DGK pin map from Table
# 5-1 "Pin Functions" (SLLS562O page 4), checked against Figure 5-1
# (same page). RE is active low (overbar; written without it). A/B "Bus
# input/output" typed io. The SN65HVD3085E/3088E share the datasheet
# but are not covered.
schema_version: "0.2"
kind: device
id: ti/SN65HVD3082E
manufacturer: ti
category: rs485_transceiver
family: SNx5HVD308xE
source: ti/SLLS562O

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 4.5 V
    max: 5.5 V
    src: p7 "6.3 Recommended Operating Conditions, Supply voltage VCC"
  esd_hbm: { typ: 4 kV, src: 'p6 "6.2 ESD Ratings, HBM, All pins (bus pins and GND ±15 kV)"' }
  data_rate:
    max: 200 kbps
    src: p7 "6.3 Recommended Operating Conditions, Signaling rate, SN65HVD3082E/SN75HVD3082E row (0.2 Mbps)"
  bus_fault_voltage:
    min: -9 V
    max: 14 V
    src: p6 "6.1 Absolute Maximum Ratings, Voltage at A or B"

pins:
  src:
    - p4 "Table 5-1. Pin Functions"
    - p4 "Figure 5-1, D, P and DGK packages 8-pin top view (cross-check)"
  "1": { name: R, type: output }
  "2": { name: RE, type: input }
  "3": { name: DE, type: input }
  "4": { name: D, type: input }
  "5": { name: GND, type: ground }
  "6": { name: A, type: io }
  "7": { name: B, type: io }
  "8": { name: VCC, type: power }
