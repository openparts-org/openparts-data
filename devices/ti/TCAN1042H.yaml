# CAN FD transceiver TCAN1042H (also TCAN1042HG: same pin column), D
# (SOIC-8) pin map from Table 6-1 "Pin Functions" column "(H), (G),
# (HG)" and Figure 6-1 (SLLSES7D page 5); all 8 pins match. The "V"
# variants (pin 5 = VIO) are a different pin map and not covered. The
# GND footnote about the DRB thermal pad does not apply to the D
# package. STB (standby mode control input) typed input; pin 5 "NC" (no
# connect) typed nc.
schema_version: "0.2"
kind: device
id: ti/TCAN1042H
manufacturer: ti
category: can_transceiver
family: TCAN1042H
source: ti/SLLSES7D

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 4.5 V
    max: 5.5 V
    src: p8 "7.4 Recommended Operating Conditions, VCC 5-V Bus Supply Voltage Range"
  esd_hbm:
    typ: 6 kV
    src: p6 "7.2 ESD Ratings, D (SOIC), HBM, All terminals (CANH/CANL to GND ±16 kV)"
  bus_fault_voltage:
    min: -70 V
    max: 70 V
    src: p6 "7.1 Absolute Maximum Ratings, VBUS CANH/CANL, devices with the H suffix"

pins:
  src:
    - p5 "Table 6-1 "Pin Functions", column "(H), (G), (HG)""
    - p5 "Figure 6-1 "D Package for Base, (H), (G) and (HG) Devices 8 PIN (SOIC) Top View" (cross-check)"
  "1": { name: TXD, type: input }
  "2": { name: GND, type: ground }
  "3": { name: VCC, type: power }
  "4": { name: RXD, type: output }
  "5": { name: NC, type: nc }
  "6": { name: CANL, type: io }
  "7": { name: CANH, type: io }
  "8": { name: STB, type: input }
