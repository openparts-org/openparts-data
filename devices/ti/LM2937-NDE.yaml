# LM2937 500-mA LDO (all fixed voltages), NDE (TO-220) pinout. SNVS100F
# "Pin Functions" (page 3), NDE column: INPUT 1, GND 2, OUTPUT 3, GND
# TAB ("The TAB is internally connected to device pin 2 (GND)"). The
# TO-220 tab is not a board pad: pins 1-3 only.
schema_version: "0.2"
kind: device
id: ti/LM2937-NDE
manufacturer: ti
category: linear_regulator
family: LM2937
source: ti/SNVS100F

parameters:
  input_voltage_max: { max: 26 V, src: 'p4 "6.3 Recommended Operating Conditions, VIN"' }
  output_current:    { max: 500 mA, src: 'p5 "6.5 Elec. Char. header, IOUT(MAX), TO-220"' }
  dropout_voltage:
    typ: 0.5 V
    max: 1 V
    at: { IOUT: 500 mA }
    src: p5 "6.5 Elec. Char. (same in all LM2937 tables), Dropout voltage, IOUT = IOUT(MAX)"

pins:
  src:
    - 'p3 ""Pin Functions", NDE column: INPUT 1, GND 2, OUTPUT 3, GND TAB"'
    - p3 ""TO-220 Plastic Package (NDE) Top View""
  "1": { name: INPUT, type: power }
  "2": { name: GND, type: ground }
  "3": { name: OUTPUT, type: power }
