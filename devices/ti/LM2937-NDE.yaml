# LM2937 500-mA LDO (all fixed voltages), NDE (TO-220) pinout. SNVS100F
# "Pin Functions" (page 3), NDE column: INPUT 1, GND 2, OUTPUT 3, GND
# TAB ("The TAB is internally connected to device pin 2 (GND)"). The
# TO-220 tab is not a board pad: pins 1-3 only.
schema_version: "0.1"
kind: device
id: ti/LM2937-NDE

manufacturer: ti
category: linear_regulator
family: LM2937

pins:
  "1": { name: "INPUT", type: power }
  "2": { name: "GND", type: ground }
  "3": { name: "OUTPUT", type: power }

parameters:
  input_voltage_max:
    max: 26
    unit: V
  output_current:
    nominal: 500
    unit: mA
  dropout_voltage:
    nominal: 0.5
    max: 1
    unit: V

provenance:
  "/parameters/input_voltage_max":
    - source: ti/SNVS100F
      page: 4
      locator: "6.3 Recommended Operating Conditions, Input voltage (VIN): MAX 26 V"
  "/parameters/output_current":
    - source: ti/SNVS100F
      page: 5
      locator: "6.5 Electrical Characteristics header: \"IOUT(MAX) = 500 mA for the TO-220 and DDPAK/TO-263 packages\" (TO-220)"
  "/parameters/dropout_voltage":
    - source: ti/SNVS100F
      page: 5
      locator: "6.5 Electrical Characteristics, Dropout voltage, IOUT = IOUT(MAX): TYP 0.5 V, MAX 1 V (same in every LM2937 output-voltage table, pages 5-7)"
  "/pins":
    - source: ti/SNVS100F
      page: 3
      locator: "\"Pin Functions\", NDE column: INPUT 1, GND 2, OUTPUT 3, GND TAB"
    - source: ti/SNVS100F
      page: 3
      locator: "\"TO-220 Plastic Package (NDE) Top View\""
