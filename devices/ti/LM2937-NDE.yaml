# LM2937 500-mA LDO (all fixed voltages), NDE (TO-220) pinout. SNVS100F
# "Pin Functions" (page 3), NDE column: INPUT 1, GND 2, OUTPUT 3, GND
# TAB ("The TAB is internally connected to device pin 2 (GND)"). The
# TO-220 tab is not a board pad: pins 1-3 only.
schema_version: "0.2"
kind: device
id: ti/LM2937-NDE
manufacturer: ti
category: linear_regulator
family: LM2937
source: ti/SNVS100F

parameters:
  input_voltage_max:
    max: 26 V
    src: 'p4 "6.3 Recommended Operating Conditions, Input voltage (VIN): MAX 26 V"'
  output_current:
    typ: 500 mA
    src: 'p5 "6.5 Electrical Characteristics header: "IOUT(MAX) = 500 mA for the TO-220 and DDPAK/TO-263 packages" (TO-220)"'
  dropout_voltage:
    typ: 0.5 V
    max: 1 V
    src: 'p5 "6.5 Electrical Characteristics, Dropout voltage, IOUT = IOUT(MAX): TYP 0.5 V, MAX 1 V (same in every LM2937 output-voltage table, pages 5-7)"'

pins:
  src:
    - 'p3 ""Pin Functions", NDE column: INPUT 1, GND 2, OUTPUT 3, GND TAB"'
    - p3 ""TO-220 Plastic Package (NDE) Top View""
  "1": { name: INPUT, type: power }
  "2": { name: GND, type: ground }
  "3": { name: OUTPUT, type: power }
