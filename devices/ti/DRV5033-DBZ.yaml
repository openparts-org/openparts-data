# DRV5033 digital omnipolar-switch Hall effect sensor, DBZ (3-pin SOT-23) pinout.
# From SLIS152G Pin Functions table column DBZ: VCC 1, OUT 2, GND 3, checked against
# the DBZ Package figure on the same page.
schema_version: "0.2"
kind: device
id: ti/DRV5033-DBZ
manufacturer: ti
category: magnetic_sensor
family: DRV5033
source: ti/SLIS152G

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2.5 V
    max: 38 V
    src: p5 "6.3 Recommended Operating Conditions, VCC Power supply voltage"
  supply_current:
    typ: 2.7 mA
    at: { TA: 25 °C }
    src: p6 "6.5 Electrical Characteristics, ICC Operating supply current, VCC = 2.5 to 38 V"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "6.3 Recommended Operating Conditions, TA Operating ambient temperature"
  esd_hbm: { typ: 2.5 kV, src: 'p5 "6.2 ESD Ratings, HBM all pins ±2500 V"' }
  output_structure:
    value: open_drain
    src: 'p4 "Pin Functions, OUT: Hall sensor open-drain output"'
  magnetic_sensor_type:
    value: omnipolar_switch
    src: p1 "1 Features, Digital Omnipolar-Switch Hall Sensor"

pins:
  src: ['p4 "Pin Functions table, column DBZ"', p4 "DBZ Package 3-Pin SOT-23 Top View"]
  "1": { name: VCC, type: power }
  "2": { name: OUT, type: output }
  "3": { name: GND, type: ground }
