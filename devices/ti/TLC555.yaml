# TLC555 LinCMOS timer, 8-pin pin map of the D (SOIC), P (PDIP), PS
# (SO) and JG (CDIP) packages from SLFS043K Figure 4-1 and Table 4-1
# "Pin Functions: D, P, PS, and JG Packages" (page 3). Pin types as for
# ti/NE555. Supply range and operating temperature depend on the grade
# (C/I/M/Q) and are on the Parts.
schema_version: "0.2"
kind: device
id: ti/TLC555
manufacturer: ti
category: timer
family: TLC555
source: ti/SLFS043K

parameters:
  supply_current:
    typ: 180 µA
    max: 350 µA
    at: { VDD: 5 V, TA: 25 °C }
    src: p8 "5.6 Elec. Char. VDD = 5V (continued), IDD, 25°C, all grades"
  esd_hbm: { typ: 1000 V, src: 'p4 "5.2 ESD Ratings, HBM"' }

pins:
  src: 'p3 "Figure 4-1 and Table 4-1 Pin Functions: D, P, PS, and JG Packages"'
  "1": { name: GND, type: ground }
  "2": { name: TRIG, type: input }
  "3": { name: OUT, type: output }
  "4": { name: RESET, type: reset }
  "5": { name: CONT, type: analog }
  "6": { name: THRES, type: input }
  "7": { name: DISCH, type: output }
  "8": { name: VDD, type: power }
