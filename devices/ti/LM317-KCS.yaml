# "KCS or KCT Package, 3-Pin TO-220 (Top View)" (same page). The TO-220
# tab (OUTPUT) is not a board pad, so only pins 1-3 are recorded.
# IN/OUT typed power (regulator supply pins, as ti/LM1117-3.3);
# ADJUST typed input (TO-92 ti/LM317L precedent).
