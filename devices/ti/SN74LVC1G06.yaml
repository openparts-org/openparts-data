# Single inverter with open-drain output SN74LVC1G06, 5-pin pin map of
# the DBV (SOT-23), DCK (SC70) and DRL (SOT-5X3) packages from Table
# 4-1 "Pin Functions" (SCES295AB page 3), column "DBV, DCK, DRL, DPW":
# NC 1, A 2, GND 3, Y 4, VCC 5; checked against Figures 4-1, 4-2 and
# 4-3 (same page). The 6-pin DRY/DSF and the DSBGA maps differ and are
# not covered.
schema_version: "0.2"
kind: device
id: ti/SN74LVC1G06
manufacturer: ti
category: logic
family: SN74LVC1G06
source: ti/SCES295AB

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.65 V
    max: 5.5 V
    src: p5 "5.3 Recommended Operating Conditions, VCC, Operating"
  supply_current:
    max: 10 µA
    at: { VCC: 1.65..5.5 V }
    src: 'p6 "5.5 Electrical Characteristics: ICC, VI = 5.5V or GND, IO = 0"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "5.3 Recommended Operating Conditions, TA"
  esd_hbm:          { typ: 2 kV, src: 'p4 "5.2 ESD Ratings, HBM"' }
  channel_count:
    value: "1"
    src: 'p1 "Title: Single Inverter Buffer or Driver With Open-Drain Output"'
  propagation_delay:
    min: 1.2 ns
    max: 4 ns
    at: { VCC: 3.3 V, CL: 50 pF, TA: -40..85 °C }
    src: 'p6 "5.6 Switching Characteristics -40 to +85°C: tpd, 3.3V ± 0.3V (CL per p8 Figure 6-1 table)"'
  output_structure: { value: open_drain, src: 'p1 "3 Description: the output is open-drain"' }
  logic_function:
    value: inverter
    src: 'p1 "Title: Single Inverter Buffer or Driver With Open-Drain Output"'
  output_current_low:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p5 "5.3 Recommended Operating Conditions, IOL, VCC = 4.5 V"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p5 "5.3 Recommended Operating Conditions, IOL, VCC = 3 V"

pins:
  src:
    - p3 "Table 4-1. Pin Functions, column DBV, DCK, DRL, DPW"
    - p3 "Figures 4-1 (DBV), 4-2 (DRL), 4-3 (DCK) Top View (cross-check)"
  "1": { name: NC, type: nc }
  "2": { name: A, type: input }
  "3": { name: GND, type: ground }
  "4": { name: Y, type: output }
  "5": { name: VCC, type: power }
