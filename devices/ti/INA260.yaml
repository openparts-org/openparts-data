# 36-V I2C current/voltage/power monitor with integrated 2-mOhm shunt,
# PW (TSSOP-16) pinout. From SBOS656C "Pin Functions" table and the "PW
# Package 16-Pin TSSOP Top View" figure (page 4): IN+ 1-3, A1 4, A0 5,
# GND 6 and 11, ALERT 7, SDA 8, SCL 9, VS 10, VBUS 12, NC 13, IN- 14-16
# (the figure's "IN±" is the minus sign mis-extracted; the table reads
# IN–, written as ASCII "-"). GND typed ground and VS power from their
# descriptions (the I/O column says "Analog"); SCL clock; ALERT
# (open-drain) output; NC ("No internal connection") nc.
# IN+ 1, 2, 3 and IN- 14, 15, 16 are each one row of the Pin Functions
# table (the two terminals of the integrated shunt) -> connected_to.
schema_version: "0.2"
kind: device
id: ti/INA260
manufacturer: ti
category: power_monitor
family: INA260
source: ti/SBOS656C

parameters:
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: p5 "7.3 Recommended Operating Conditions, VS operating supply voltage"
  supply_current:
    typ: 310 µA
    max: 420 µA
    at: { VS: 3.3 V, TA: 25 °C }
    src: p7 "7.5 Electrical Characteristics (continued), IQ quiescent current"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "7.3 Recommended Operating Conditions, TA operating free-air temperature"
  esd_hbm: { typ: 2 kV, src: 'p5 "7.2 ESD Ratings, HBM ±2000 V"' }

pins:
  src:  [p4 ""Pin Functions" table", p4 ""PW Package 16-Pin TSSOP Top View""]
  "1":  { name: IN+, type: analog }
  "2":  { name: IN+, type: analog, connected_to: "1" }
  "3":  { name: IN+, type: analog, connected_to: "1" }
  "4":  { name: A1, type: input }
  "5":  { name: A0, type: input }
  "6":  { name: GND, type: ground }
  "7":  { name: ALERT, type: output }
  "8":  { name: SDA, type: io }
  "9":  { name: SCL, type: clock }
  "10": { name: VS, type: power }
  "11": { name: GND, type: ground }
  "12": { name: VBUS, type: analog }
  "13": { name: NC, type: nc }
  "14": { name: IN-, type: analog }
  "15": { name: IN-, type: analog, connected_to: "14" }
  "16": { name: IN-, type: analog, connected_to: "14" }
