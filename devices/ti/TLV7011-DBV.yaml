# Single nanopower push-pull comparator, DBV (SOT-23-5) pin map from the
# "Pin Functions" table (SLVSDM5F page 3), column "SOT-23, SC70": OUT 1,
# VEE 2, IN+ 3, IN- 4, VCC 5, checked against the "DBV and DCK Package"
# top view (same page). The X2SON (DPW) map differs and is not covered.
# Minus sign written as ASCII "-".
schema_version: "0.2"
kind: device
id: ti/TLV7011-DBV
manufacturer: ti
category: comparator
family: TLV70x1
source: ti/SLVSDM5F

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.6 V
    max: 5.5 V
    src: p5 "6.4 Recommended Operating Conditions (Single), Supply voltage (VS = VCC - VEE)"
  supply_current:
    typ: 5 µA
    max: 10 µA
    at: { VS: 1.8 V }
    src: 'p7 "6.8 Electrical Characteristics (Single): ICC, VS = 1.8 V, no load, output low (max over -40 to 125 °C)"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "6.4 Recommended Operating Conditions (Single), Ambient temperature, TA"
  esd_hbm:            { typ: 2 kV, src: 'p5 "6.3 ESD Ratings, HBM"' }
  channel_count:      { value: "1", src: 'p1 "Description: TLV7011/7021 (single-channel)"' }
  input_offset_voltage:
    typ: 0.5 mV
    max: 8 mV
    at: { VS: 1.8..5 V }
    src: 'p7 "6.8 Electrical Characteristics (Single): VIO, VCM = VS / 2 (printed ±0.5/±8 mV)"'
  input_bias_current: { typ: 5 pA, src: 'p7 "6.8 Electrical Characteristics (Single): IB"' }
  rail_to_rail_input: { value: yes, src: 'p1 "Features: Rail-to-rail common-mode input voltage"' }
  propagation_delay:
    typ: 310 ns
    at: { VCC: 5 V, VOD: 100 mV, CL: 15 pF, TA: 25 °C }
    src: 'p7 "6.9 Switching Characteristics (Single): tPLH (slower edge), VOD = 100 mV"'
  output_structure:
    value: push_pull
    src: 'p1 "Description: The TLV701x have push-pull output stages"'

pins:
  src:
    - p3 "Pin Functions, column SOT-23, SC70"
    - p3 "DBV and DCK Package 5-Pin SOT-23 and SC70 Top View"
  "1": { name: OUT, type: output }
  "2": { name: VEE, type: power }
  "3": { name: IN+, type: analog }
  "4": { name: IN-, type: analog }
  "5": { name: VCC, type: power }
