# Single nanopower push-pull comparator, DBV (SOT-23-5) pin map from the
# "Pin Functions" table (SLVSDM5F page 3), column "SOT-23, SC70": OUT 1,
# VEE 2, IN+ 3, IN- 4, VCC 5, checked against the "DBV and DCK Package"
# top view (same page). The X2SON (DPW) map differs and is not covered.
# Minus sign written as ASCII "-".
schema_version: "0.2"
kind: device
id: ti/TLV7011-DBV
manufacturer: ti
category: comparator
family: TLV70x1
source: ti/SLVSDM5F

pins:
  src:
    - p3 "Pin Functions, column SOT-23, SC70"
    - p3 "DBV and DCK Package 5-Pin SOT-23 and SC70 Top View"
  "1": { name: OUT, type: output }
  "2": { name: VEE, type: power }
  "3": { name: IN+, type: analog }
  "4": { name: IN-, type: analog }
  "5": { name: VCC, type: power }
