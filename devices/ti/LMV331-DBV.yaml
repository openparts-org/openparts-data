# Single low-voltage comparator, DBV/DCK (SOT-23-5/SC70-5) pin map from
# Table 4-1 "Pin Functions" (SLCS136V page 3), column "LMV331 DBV, DCK":
# 1IN+ 1, GND 2, 1IN- 3, OUT 4, VCC+ 5 (names as printed in the "LMV331
# ... DBV OR DCK PACKAGE (TOP VIEW)" figure on the same page). Minus
# signs written as ASCII "-".
schema_version: "0.2"
kind: device
id: ti/LMV331-DBV
manufacturer: ti
category: comparator
family: LMV3xx
source: ti/SLCS136V

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: p4 "5.3 Recommended Operating Conditions, VCC (single-supply operation)"
  supply_current:
    typ: 26 µA
    max: 120 µA
    at: { VCC: 5 V, TA: 25 °C }
    src: 'p6 "5.7 Electrical Characteristics, VCC+ = 5V: ICC, LMV331, 25 °C"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p4 "5.3 Recommended Operating Conditions, TA"
  esd_hbm:          { typ: 2 kV, src: 'p4 "5.2 ESD Ratings, HBM, all pins"' }
  channel_count:    { value: "1", src: 'p1 "Title: LMV331 Single, LMV393 Dual, LMV339 Quad"' }
  input_offset_voltage:
    typ: 0.5 mV
    max: 7 mV
    at: { VCC: 5 V, TA: 25 °C }
    src: 'p6 "5.7 Electrical Characteristics, VCC+ = 5V: VIO, 25 °C (typ printed +0.5)"'
  input_bias_current:
    typ: 0.005 nA
    max: 250 nA
    at: { VCC: 5 V, TA: 25 °C }
    src: 'p6 "5.7 Electrical Characteristics, VCC+ = 5V: IIB, 25 °C"'
  rail_to_rail_input:
    value: no
    src: 'p6 "5.7 Electrical Characteristics, VCC+ = 5V: VICR -0.1 to 4.2 V"'
  propagation_delay:
    - typ: 600 ns
      at: { VCC: 5 V, VOD: 10 mV, RL: 5.1 kΩ, TA: 25 °C }
      src: 'p6 "5.8 Switching Characteristics, VCC+ = 5V: tPHL (slower edge), 10mV overdrive"'
    - typ: 300 ns
      at: { VCC: 5 V, VOD: 100 mV, RL: 5.1 kΩ, TA: 25 °C }
      src: 'p6 "5.8 Switching Characteristics, VCC+ = 5V: tPLH (slower edge), 100mV overdrive"'
  output_structure: { value: open_collector, src: 'p1 "Features: Open-collector output"' }

pins:
  src:
    - p3 "Table 4-1. Pin Functions, column LMV331 DBV, DCK"
    - p3 "LMV331 ... DBV OR DCK PACKAGE (TOP VIEW)"
  "1": { name: 1IN+, type: analog }
  "2": { name: GND, type: ground }
  "3": { name: 1IN-, type: analog }
  "4": { name: OUT, type: output }
  "5": { name: VCC+, type: power }
