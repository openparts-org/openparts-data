# Dual I2C/SMBus voltage-level translator, DCT/DCU/DQE pin map from
# Table 5-1 "Pin Functions" (SCPS113O page 4), column "DCT, DCU, DQE":
# GND 1, VREF1 2, SCL1 3, SDA1 4, SDA2 5, SCL2 6, VREF2 7, EN 8.
# VREF1/VREF2 (reference supply inputs) typed power. The YZT map is not
# covered.
schema_version: "0.2"
kind: device
id: ti/PCA9306-DCU
manufacturer: ti
category: level_shifter
family: PCA9306
source: ti/SCPS113O

# Parameters (AI candidates, needs review).
parameters:
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p5 "6.3 Recommended Operating Conditions, TA"
  esd_hbm:          { typ: 2 kV, src: 'p5 "6.2 ESD Ratings, HBM, all pins"' }
  channel_count:
    value: "2"
    src: 'p1 "Title: Dual Bidirectional I2C Bus and SMBus Voltage-Level Translator"'
  propagation_delay:
    - min: 0 ns
      max: 1.7 ns
      at: { CL: 50 pF, RL: 300 Ω }
      src: p7 "6.8 Translating Up (EN = 3.3 V), tPHL, DCU, DCT, CL = 50 pF"
    - min: 0 ns
      max: 1 ns
      at: { CL: 15 pF, RL: 300 Ω }
      src: p7 "6.8 Translating Up (EN = 3.3 V), tPHL, DCU, DCT, CL = 15 pF"
  output_structure: { value: open_drain, src: 'p1 "1 Features, Open-drain I2C I/O ports"' }

pins:
  src: p4 "Table 5-1. Pin Functions, column DCT, DCU, DQE"
  "1": { name: GND, type: ground }
  "2": { name: VREF1, type: power }
  "3": { name: SCL1, type: io }
  "4": { name: SDA1, type: io }
  "5": { name: SDA2, type: io }
  "6": { name: SCL2, type: io }
  "7": { name: VREF2, type: power }
  "8": { name: EN, type: input }
