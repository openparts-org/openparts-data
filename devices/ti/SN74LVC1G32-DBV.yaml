# single 2-input positive-OR gate (SN74LVC1G32), 5-pin pin map of the
# DBV (SOT-23-5) package (shared with DCK/DRL), from Table 4-1 "Pin Functions" (5-pin DBV/DCK/DRL)
# (SCES219W page 3), checked against the DBV top-view figure on the same
# page; all 5 pins match. The 6-pin DRY/DSF and the DPW/YZP pin maps
# differ and are not covered.
schema_version: "0.2"
kind: device
id: ti/SN74LVC1G32-DBV
manufacturer: ti
category: logic
family: SN74LVC1G32
source: ti/SCES219W

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.65 V
    max: 5.5 V
    src: p6 "5.3 Recommended Operating Conditions, VCC, Operating"
  supply_current:
    max: 10 µA
    at: { VCC: 1.65..5.5 V }
    src: 'p7 "5.5 Electrical Characteristics: ICC, VI = 5.5 V or GND, IO = 0, -40 to 85 °C"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: 'p6 "5.3 Recommended Operating Conditions, TA, All other packages (DSBGA: -40 to 85 °C)"'
  esd_hbm:        { typ: 2 kV, src: 'p5 "5.2 ESD Ratings, HBM"' }
  channel_count:  { value: "1", src: 'p1 "Title: Single 2-Input Positive-OR Gate"' }
  propagation_delay:
    min: 0.9 ns
    max: 3.6 ns
    at: { VCC: 3.3 V, CL: 15 pF, TA: -40..85 °C }
    src: 'p7 "5.6 Switching Characteristics CL = 15 pF: tpd, VCC = 3.3 V"'
  output_structure:
    value: push_pull
    src: 'p11 "7.3 Feature Description: balanced CMOS push-pull outputs"'
  logic_function: { value: or, src: 'p1 "Title: Single 2-Input Positive-OR Gate"' }
  output_current_high:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p6 "5.3 Recommended Operating Conditions, IOH, VCC = 4.5 V (printed -32 mA)"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p6 "5.3 Recommended Operating Conditions, IOH, VCC = 3 V (printed -24 mA)"
  output_current_low:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p6 "5.3 Recommended Operating Conditions, IOL, VCC = 4.5 V"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p6 "5.3 Recommended Operating Conditions, IOL, VCC = 3 V"

pins:
  src:
    - p3 "Table 4-1 "Pin Functions" (5-pin DBV/DCK/DRL)"
    - p3 "Figure 4-1 "DBV or DCK or DRL Package, 5-Pin SOT-23 or SOT-SC70 SOT (Top View)" (cross-check)"
  "1": { name: A, type: input }
  "2": { name: B, type: input }
  "3": { name: GND, type: ground }
  "4": { name: Y, type: output }
  "5": { name: VCC, type: power }
