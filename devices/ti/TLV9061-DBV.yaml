# Single 10-MHz RRIO CMOS op amp, TLV9061 in DBV (SOT-23-5) / DRL
# (SOT-553) pinout. From SBOS839N Table 5-1 "Pin Functions: TLV9061"
# (page 5), column "SOT-23, SOT-553", checked against Figure 5-1
# "TLV9061 DBV or DRL Package" (same page). The DCK (SC70) and DPW
# (X2SON) pin maps differ and are not covered. Minus signs written as
# ASCII "-".
schema_version: "0.2"
kind: device
id: ti/TLV9061-DBV
manufacturer: ti
category: op_amp
family: TLV906x
source: ti/SBOS839N

pins:
  src:
    - 'p5 "Table 5-1 "Pin Functions: TLV9061", column "SOT-23, SOT-553""'
    - p5 "Figure 5-1 "TLV9061 DBV or DRL Package, 5-Pin SOT-23 or SOT-553 (Top View)""
  "1": { name: OUT, type: analog }
  "2": { name: V-, type: power }
  "3": { name: IN+, type: analog }
  "4": { name: IN-, type: analog }
  "5": { name: V+, type: power }
