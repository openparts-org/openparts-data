# Dual 2-input positive-NAND gate SN74LVC2G00, 8-pin pin map of the DCT
# (SM8) and DCU (VSSOP-8) packages from the "Pin Functions" table
# (SCES193N page 3), column "DCT, DCU, YZP", checked against the "DCU
# PACKAGE (TOP VIEW)" figure on the same page; all 8 pins match. The
# table's TYPE column prints "I" for VCC; recorded as power. The YZP
# (DSBGA) package is not covered.
schema_version: "0.2"
kind: device
id: ti/SN74LVC2G00
manufacturer: ti
category: logic
family: SN74LVC2G00
source: ti/SCES193N

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.65 V
    max: 5.5 V
    src: p5 "7.3 Recommended Operating Conditions, VCC, Operating"
  supply_current:
    max: 10 µA
    at: { VCC: 1.65..5.5 V }
    src: 'p6 "7.5 Electrical Characteristics: ICC, VI = 5.5 V or GND, IO = 0, -40 to 85 °C"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "7.3 Recommended Operating Conditions, TA"
  esd_hbm:        { typ: 2 kV, src: 'p4 "7.2 ESD Ratings, HBM, all pins"' }
  channel_count:  { value: "2", src: 'p1 "Title: Dual 2-Input Positive-NAND Gate"' }
  propagation_delay:
    min: 1.1 ns
    max: 4.3 ns
    at: { VCC: 3.3 V, CL: 50 pF, TA: -40..85 °C }
    src: 'p6 "7.7 Switching Characteristics -40°C to 85°C: tpd, VCC = 3.3 V (CL per p8 Figure 3 table)"'
  logic_function: { value: nand, src: 'p1 "Title: Dual 2-Input Positive-NAND Gate"' }
  output_current_high:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p5 "7.3 Recommended Operating Conditions, IOH, VCC = 4.5 V (printed -32 mA)"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p5 "7.3 Recommended Operating Conditions, IOH, VCC = 3 V (printed -24 mA)"
  output_current_low:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p5 "7.3 Recommended Operating Conditions, IOL, VCC = 4.5 V"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p5 "7.3 Recommended Operating Conditions, IOL, VCC = 3 V"

pins:
  src:
    - p3 ""Pin Functions" table, column "DCT, DCU, YZP""
    - p3 ""DCU PACKAGE (TOP VIEW)" figure (cross-check)"
  "1": { name: 1A, type: input }
  "2": { name: 1B, type: input }
  "3": { name: 2Y, type: output }
  "4": { name: GND, type: ground }
  "5": { name: 2A, type: input }
  "6": { name: 2B, type: input }
  "7": { name: 1Y, type: output }
  "8": { name: VCC, type: power }
