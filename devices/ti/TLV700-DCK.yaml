# 200-mA low-IQ LDO (all fixed voltages), DCK (SC70-5) pinout. From
# SLVSA00E "Pin Functions" table (page 4), column "SC70": IN 1, GND 2,
# EN 3, NC 4, OUT 5, checked against the "DCK Package 5-Pin SC70 Top
# View" figure (same page), where pin 4 is drawn "N/C" with note "(1) No
# connection"; the table name "NC" is used. Same numbers as the SOT
# (DDC) column, see ti/TLV700-DDC; parameters as there.
schema_version: "0.2"
kind: device
id: ti/TLV700-DCK
manufacturer: ti
category: linear_regulator
family: TLV700
source: ti/SLVSA00E

parameters:
  output_type:       { value: fixed, src: p1 "1 Features" }
  input_voltage_max: { max: 5.5 V, src: 'p5 "6.3 Recommended Operating Conditions, VIN"' }
  output_current:    { max: 200 mA, src: 'p5 "6.3 Recommended Operating Conditions, IOUT"' }

pins:
  src: ['p4 ""Pin Functions" table, column "SC70""', p4 ""DCK Package 5-Pin SC70 Top View" figure"]
  "1": { name: IN, type: power }
  "2": { name: GND, type: ground }
  "3": { name: EN, type: input }
  "4": { name: NC, type: nc }
  "5": { name: OUT, type: power }
