# LM35 precision centigrade temperature sensor, LP (3-pin TO-92)
# package pinout. Pin Functions table (page 3), TO92 column: +VS = 1,
# VOUT = 2, GND = 3; matches the "LP Package 3-Pin TO-92 (Bottom View)"
# drawing on the same page. Pin numbers differ by package (TO-220 has
# GND on 2), hence a package-specific device.
schema_version: "0.2"
kind: device
id: ti/LM35-LP
manufacturer: ti
category: temperature_sensor
family: LM35
source: ti/SNIS159H

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 4 V
    max: 30 V
    src: p4 "6.3 Recommended Operating Conditions, Supply Voltage (+VS)"
  esd_hbm: { typ: 2.5 kV, src: 'p4 "6.2 ESD Ratings, V(ESD) HBM ±2500 V"' }

pins:
  src: p3 "Pin Functions table, TO92 column (+VS 1, VOUT 2, GND 3)"
  "1": { name: +VS, type: power }
  "2": { name: VOUT, type: output }
  "3": { name: GND, type: ground }
