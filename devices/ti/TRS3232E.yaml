# Dual RS-232 driver/receiver TRS3232E, 16-pin DB/PW/DYY pin map from
# Table 4-1 "Pin Functions" column "NO." (SLLS790E page 3) checked
# against Figure 4-1 (same page); all 16 pins match. The RGT (VQFN)
# numbering differs and is not covered. The datasheet's minus signs
# (C1-, C2-, V-) are written as ASCII "-". Charge-pump capacitor leads
# (type "-") typed passive; V+/V- ("charge pump output for storage
# capacitor only", type O) typed output as in the table.
schema_version: "0.2"
kind: device
id: ti/TRS3232E
manufacturer: ti
category: rs232_transceiver
family: TRS3232E
source: ti/SLLS790E

# Parameters (AI candidates, needs review).
parameters:
  supply_current:
    typ: 0.3 mA
    max: 1 mA
    src: 'p6 "5.6 Electrical Characteristics: Device, ICC, no load, VCC = 3.3 V or 5 V"'
  esd_hbm:
    typ: 2 kV
    src: p4 "5.2 ESD Ratings, HBM, all pins except RIN1/2, DOUT1/2 (those ±15 kV)"
  channel_count: { value: "2", src: 'p1 "1 Features, Two drivers and two receivers"' }

pins:
  src:
    - p3 "Table 4-1 "Pin Functions", column "NO.""
    - p3 "Figure 4-1 "DB, PW or DYY Package 16-Pin SSOP, TSSOP, or SOT-23-THN (Top View)" (cross-check)"
  "1":  { name: C1+, type: passive }
  "2":  { name: V+, type: output }
  "3":  { name: C1-, type: passive }
  "4":  { name: C2+, type: passive }
  "5":  { name: C2-, type: passive }
  "6":  { name: V-, type: output }
  "7":  { name: DOUT2, type: output }
  "8":  { name: RIN2, type: input }
  "9":  { name: ROUT2, type: output }
  "10": { name: DIN2, type: input }
  "11": { name: DIN1, type: input }
  "12": { name: ROUT1, type: output }
  "13": { name: RIN1, type: input }
  "14": { name: DOUT1, type: output }
  "15": { name: GND, type: ground }
  "16": { name: VCC, type: power }
