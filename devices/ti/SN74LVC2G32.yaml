# Dual 2-input positive-OR gate SN74LVC2G32, 8-pin pin map of the DCT
# (SSOP-8) and DCU (VSSOP-8) packages from the "Pin Functions" table
# (SCES201N page 3, NAME / NO.), checked against the "DCU Package 8-Pin
# VSSOP Top View" figure on the same page; all 8 pins match. The YZP
# (DSBGA) package is not covered.
schema_version: "0.2"
kind: device
id: ti/SN74LVC2G32
manufacturer: ti
category: logic
family: SN74LVC2G32
source: ti/SCES201N

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.65 V
    max: 5.5 V
    src: p5 "6.3 Recommended Operating Conditions, VCC, Operating"
  supply_current:
    max: 10 µA
    at: { VCC: 1.65..5.5 V }
    src: 'p6 "6.5 Electrical Characteristics: ICC, VI = 5.5 V or GND, IO = 0, -40 to 85 °C"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "6.3 Recommended Operating Conditions, TA, DCT and DCU packages"
  esd_hbm:        { typ: 2 kV, src: 'p4 "6.2 ESD Ratings, HBM, all pins"' }
  channel_count:  { value: "2", src: 'p1 "Title: Dual 2-Input Positive-OR Gate"' }
  propagation_delay:
    min: 1 ns
    max: 3.8 ns
    at: { VCC: 3.3 V, CL: 50 pF, TA: -40..85 °C }
    src: 'p6 "6.6 Switching Characteristics: tpd, VCC = 3.3 V, -40 to 85 °C (CL per p8 Figure 2 table)"'
  logic_function: { value: or, src: 'p1 "Title: Dual 2-Input Positive-OR Gate"' }
  output_current_high:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p5 "6.3 Recommended Operating Conditions, IOH, VCC = 4.5 V (printed -32 mA)"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p5 "6.3 Recommended Operating Conditions, IOH, VCC = 3 V (printed -24 mA)"
  output_current_low:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p5 "6.3 Recommended Operating Conditions, IOL, VCC = 4.5 V"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p5 "6.3 Recommended Operating Conditions, IOL, VCC = 3 V"

pins:
  src:
    - p3 ""Pin Functions" table (NAME / NO.)"
    - p3 ""DCU Package 8-Pin VSSOP Top View" figure (cross-check)"
  "1": { name: 1A, type: input }
  "2": { name: 1B, type: input }
  "3": { name: 2Y, type: output }
  "4": { name: GND, type: ground }
  "5": { name: 2A, type: input }
  "6": { name: 2B, type: input }
  "7": { name: 1Y, type: output }
  "8": { name: VCC, type: power }
