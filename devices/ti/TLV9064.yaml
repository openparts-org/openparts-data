# Quad 10-MHz RRIO CMOS op amp, 14-pin D (SOIC) / PW (TSSOP) pinout.
# From SBOS839N Table 5-5 "Pin Functions: TLV9064" (page 8), column
# "SOIC, TSSOP", checked against Figure 5-13 "TLV9064 D or PW Package,
# 14-Pin SOIC or TSSOP (Top View)" (same page). The RTE (WQFN) and RUC
# (X2QFN) pin maps differ and are not covered. Minus signs written as
# ASCII "-".
schema_version: "0.2"
kind: device
id: ti/TLV9064
manufacturer: ti
category: op_amp
family: TLV906x
source: ti/SBOS839N

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage: { min: 1.8 V, max: 5.5 V, src: 'p10 "6.3 Recommended Operating Conditions, VS"' }
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p10 "6.3 Recommended Operating Conditions, Specified temperature"
  esd_hbm:             { typ: 4 kV, src: 'p10 "6.2 ESD Ratings, all other packages: HBM"' }
  channel_count:
    value: "4"
    src: 'p1 "3 Description: TLV9061 (single), TLV9062 (dual), and TLV9064 (quad)"'
  gain_bandwidth:
    typ: 10 MHz
    at: { VS: 5 V, RL: 10 kΩ, TA: 25 °C }
    src: 'p13 "6.10 Electrical Characteristics: GBP, G = +1"'
  slew_rate:
    typ: 6.5 V/µs
    at: { VS: 5 V, RL: 10 kΩ, TA: 25 °C }
    src: 'p13 "6.10 Electrical Characteristics: SR, G = +1"'
  input_offset_voltage:
    typ: 0.3 mV
    max: 1.6 mV
    at: { VS: 5 V, TA: 25 °C }
    src: 'p13 "6.10 Electrical Characteristics: VOS, VS = 5 V (printed ±0.3/±1.6 mV)"'
  input_bias_current:
    typ: 0.5 pA
    at: { TA: 25 °C }
    src: 'p13 "6.10 Electrical Characteristics: IB (printed ±0.5 pA)"'
  supply_current_per_channel:
    typ: 538 µA
    max: 750 µA
    at: { VS: 5.5 V, IOUT: 0 A, TA: 25 °C }
    src: 'p14 "6.10 Electrical Characteristics: IQ quiescent current per amplifier, VS = 5.5 V"'
  rail_to_rail_input:  { value: yes, src: 'p1 "Features: Rail-to-rail input and output"' }
  rail_to_rail_output: { value: yes, src: 'p1 "Features: Rail-to-rail input and output"' }

pins:
  src:
    - 'p8 "Table 5-5 "Pin Functions: TLV9064", column "SOIC, TSSOP""'
    - p8 "Figure 5-13 "TLV9064 D or PW Package, 14-Pin SOIC or TSSOP (Top View)""
  "1":  { name: OUT1, type: analog }
  "2":  { name: IN1-, type: analog }
  "3":  { name: IN1+, type: analog }
  "4":  { name: V+, type: power }
  "5":  { name: IN2+, type: analog }
  "6":  { name: IN2-, type: analog }
  "7":  { name: OUT2, type: analog }
  "8":  { name: OUT3, type: analog }
  "9":  { name: IN3-, type: analog }
  "10": { name: IN3+, type: analog }
  "11": { name: V-, type: power }
  "12": { name: IN4+, type: analog }
  "13": { name: IN4-, type: analog }
  "14": { name: OUT4, type: analog }
