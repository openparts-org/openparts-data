# Half-duplex RS-485 transceiver THVD1500, 8-pin D (SOIC) pin map from
# the "Pin Functions" table (SLLSEY4A page 3), checked against the "D
# Package 8-Pin SOIC Top View" figure on the same page; all 8 pins
# match. RE is active low (overbar in the datasheet; written without
# it). A/B "Bus input/output" typed io.
schema_version: "0.2"
kind: device
id: ti/THVD1500
manufacturer: ti
category: rs485_transceiver
family: THVD1500
source: ti/SLLSEY4A

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 4.5 V
    max: 5.5 V
    src: p5 "6.3 Recommended Operating Conditions, VCC Supply voltage"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "6.3 Recommended Operating Conditions, TA Operating ambient temperature"
  esd_hbm:
    typ: 4 kV
    src: p4 "6.2 ESD Ratings, HBM, all pins except bus terminals and GND (bus/GND ±16 kV)"
  data_rate:
    max: 500 kbps
    src: p5 "6.3 Recommended Operating Conditions, 1/tUI Signaling rate"
  bus_fault_voltage:
    min: -18 V
    max: 18 V
    src: p4 "6.1 Absolute Maximum Ratings, Bus voltage, range at any bus pin (A or B)"

pins:
  src: [p3 ""Pin Functions" table", p3 ""D Package 8-Pin SOIC Top View" figure (cross-check)"]
  "1": { name: R, type: output }
  "2": { name: RE, type: input }
  "3": { name: DE, type: input }
  "4": { name: D, type: input }
  "5": { name: GND, type: ground }
  "6": { name: A, type: io }
  "7": { name: B, type: io }
  "8": { name: VCC, type: power }
