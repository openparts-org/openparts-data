# Single-channel current-sense amplifier, DBV (SOT-23-6) pin map from
# Table 5-1 "Pin Functions: INA181 (Single Channel)" (SBOS793H page 4),
# SOT-23 column: OUT 1, GND 2, IN+ 3, IN- 4, REF 5, VS 6, checked
# against Figure 5-1 "INA181: DBV Package 6-Pin SOT-23 Top View". The
# SC70 (DCK) map differs. Minus sign written as ASCII "-".
schema_version: "0.2"
kind: device
id: ti/INA181-DBV
manufacturer: ti
category: current_sense_amplifier
family: INA181
source: ti/SBOS793H

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: p7 "6.3 Recommended Operating Conditions, VS operating supply voltage"
  supply_current:
    typ: 195 µA
    max: 260 µA
    at: { VS: 5 V, VCM: 12 V, TA: 25 °C }
    src: 'p8 "6.5 Electrical Characteristics: IQ, INA181, VSENSE = 0 mV"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p7 "6.3 Recommended Operating Conditions, TA operating free-air temperature"
  esd_hbm:   { typ: 3 kV, src: 'p7 "6.2 ESD Ratings, HBM"' }
  channel_count:
    value: "1"
    src: 'p3 "Table 4-1 Device Comparison: INA181A1..A4, number of channels 1"'
  slew_rate: { typ: 2 V/µs, src: 'p8 "6.5 Electrical Characteristics: SR"' }
  input_offset_voltage:
    - typ: 100 µV
      max: 500 µV
      at: { VS: 5 V, VCM: 12 V, TA: 25 °C }
      src: 'p8 "6.5 Electrical Characteristics: VOS RTI, VIN+ = 12 V, VSENSE = 0 mV (printed ±100/±500 µV)"'
    - typ: 25 µV
      max: 150 µV
      at: { VS: 5 V, VCM: 0 V, TA: 25 °C }
      src: 'p8 "6.5 Electrical Characteristics: VOS RTI, VIN+ = 0 V, VSENSE = 0 mV (printed ±25/±150 µV)"'
  input_bias_current:
    - typ: 75 µA
      at: { VS: 5 V, VCM: 12 V, TA: 25 °C }
      src: 'p8 "6.5 Electrical Characteristics: IIB, VSENSE = 0 mV, VIN+ = 12 V"'
    - typ: 6 µA
      at: { VS: 5 V, VCM: 0 V, TA: 25 °C }
      src: 'p8 "6.5 Electrical Characteristics: IIB, VSENSE = 0 mV, VIN+ = 0 V (printed -6 µA)"'
  common_mode_voltage:
    min: -0.2 V
    max: 26 V
    src: p7 "6.3 Recommended Operating Conditions, VCM common-mode input voltage (IN+ and IN-)"

pins:
  src:
    - 'p4 "Table 5-1. Pin Functions: INA181 (Single Channel), column SOT-23"'
    - 'p4 "Figure 5-1. INA181: DBV Package 6-Pin SOT-23 Top View"'
  "1": { name: OUT, type: analog }
  "2": { name: GND, type: ground }
  "3": { name: IN+, type: analog }
  "4": { name: IN-, type: analog }
  "5": { name: REF, type: analog }
  "6": { name: VS, type: power }
