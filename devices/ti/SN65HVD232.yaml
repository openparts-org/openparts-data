# 3.3-V CAN transceiver SN65HVD232, 8-pin SOIC (D) pin map. All 8 pins
# match between the "Pin Functions" table (rows "SN65HVD232: No
# Connect" for pins 5 and 8) and the "SN65HVD232D (Marked as VP232) Top
# View" figure (SLOS346O page 5). Pins 5 and 8 are "NC", typed nc.
schema_version: "0.2"
kind: device
id: ti/SN65HVD232
manufacturer: ti
category: can_transceiver
family: SN65HVD232
source: ti/SLOS346O

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 3 V
    max: 3.6 V
    src: p6 "8.3 Recommended Operating Conditions, Supply voltage VCC"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p6 "8.3 Recommended Operating Conditions, Operating free-air temperature TA"
  esd_hbm: { typ: 4 kV, src: 'p6 "8.2 ESD Ratings, HBM, All pins (CANH, CANL and GND ±16 kV)"' }
  data_rate: { max: 1 Mbps, src: 'p1 "1 Features, Designed for Data Rates up to 1 Mbps"' }
  bus_fault_voltage:
    min: -4 V
    max: 16 V
    src: p5 "8.1 Absolute Maximum Ratings, Voltage at any bus terminal (CANH or CANL)"

pins:
  src:
    - p5 ""Pin Functions" table (pins 1-8; NC rows for SN65HVD232)"
    - p5 ""SN65HVD232D (Marked as VP232) Top View" figure (cross-check)"
  "1": { name: D, type: input }
  "2": { name: GND, type: ground }
  "3": { name: VCC, type: power }
  "4": { name: R, type: output }
  "5": { name: NC, type: nc }
  "6": { name: CANL, type: io }
  "7": { name: CANH, type: io }
  "8": { name: NC, type: nc }
