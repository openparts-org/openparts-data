# Octal D-type flip-flop with clear SN74HC273, 20-pin pin map from Table
# 5-1 "Pin Functions" (SCLS136F page 3). CLR is the active-low clear
# (typed reset), CLK the common clock. FK (LCCC) not covered.
schema_version: "0.2"
kind: device
id: ti/SN74HC273
manufacturer: ti
category: logic
family: SNx4HC273
source: ti/SCLS136F

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2 V
    max: 6 V
    src: p4 "Recommended Operating Conditions, VCC, SN74HC273 row"
  supply_current:
    max: 8 µA
    at: { VCC: 6 V, TA: 25 °C }
    src: 'p5 "6.5 Electrical Characteristics: ICC, VI = VCC or 0, 6 V, TA = 25°C column"'
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p4 "Recommended Operating Conditions, TA, SN74HC273 row"
  esd_hbm:        { typ: 2 kV, src: 'p4 "ESD Ratings, HBM"' }
  channel_count:  { value: "8", src: 'p1 "Title, Octal D-Type Flip-Flops With Clear"' }
  propagation_delay:
    - typ: 15 ns
      max: 32 ns
      at: { VCC: 4.5 V, CL: 50 pF, TA: 25 °C }
      src: p8 "6.11 Switching Characteristics CL = 50 pF, tpd CLK to any output, 4.5 V, TA = 25°C"
    - typ: 56 ns
      max: 160 ns
      at: { VCC: 2 V, CL: 50 pF, TA: 25 °C }
      src: p8 "6.11 Switching Characteristics CL = 50 pF, tpd CLK to any output, 2 V, TA = 25°C"
    - typ: 13 ns
      max: 27 ns
      at: { VCC: 6 V, CL: 50 pF, TA: 25 °C }
      src: p8 "6.11 Switching Characteristics CL = 50 pF, tpd CLK to any output, 6 V, TA = 25°C"
  logic_function: { value: flip_flop, src: 'p1 "Title, Octal D-Type Flip-Flops With Clear"' }

pins:
  src:  p3 "Table 5-1 "Pin Functions" (NO. / NAME / TYPE)"
  "1":  { name: CLR, type: reset }
  "2":  { name: 1Q, type: output }
  "3":  { name: 1D, type: input }
  "4":  { name: 2D, type: input }
  "5":  { name: 2Q, type: output }
  "6":  { name: 3Q, type: output }
  "7":  { name: 3D, type: input }
  "8":  { name: 4D, type: input }
  "9":  { name: 4Q, type: output }
  "10": { name: GND, type: ground }
  "11": { name: CLK, type: clock }
  "12": { name: 5Q, type: output }
  "13": { name: 5D, type: input }
  "14": { name: 6D, type: input }
  "15": { name: 6Q, type: output }
  "16": { name: 7Q, type: output }
  "17": { name: 7D, type: input }
  "18": { name: 8D, type: input }
  "19": { name: 8Q, type: output }
  "20": { name: VCC, type: power }
