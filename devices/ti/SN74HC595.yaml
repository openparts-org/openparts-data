# 8-bit shift register with 3-state output registers (SN74HC595). Pin
# map from the "D, N, NS, J, DB, or PW Package 16-Pin SOIC, PDIP, SO,
# CDIP, SSOP, or TSSOP Top View" diagram and Table 5-1 "Pin Functions"
# (SCLS041J page 3, column "SOIC, PDIP, SO, CDIP, SSOP, or TSSOP").
#
# Conflict in the source: Table 5-1's VCC row gives "—" for the 16-pin
# column (only LCCC pin 20), and its NC row lists "16" twice in the LCCC
# column. The 16-pin diagram on the same page clearly shows VCC at pin
# 16, so pin 16 is taken from the diagram (see /pins/16 provenance).
# Pins 1-15 match between table and diagram.
#
# OE and SRCLR carry an overbar (active low) in the datasheet; the names
# here are written without it. Subscripts (QA, VCC) are flattened.
# SRCLK/RCLK (shift/storage register clocks) typed clock, SRCLR (clear)
# typed reset.
schema_version: "0.2"
kind: device
id: ti/SN74HC595
manufacturer: ti
category: logic
family: SNx4HC595
source: ti/SCLS041J

pins:
  src:
    - p3 "Table 5-1 "Pin Functions", column "SOIC, PDIP, SO, CDIP, SSOP, or TSSOP" (pins 1-15)"
    - p3 ""D, N, NS, J, DB, or PW Package, 16-Pin SOIC, PDIP, SO, CDIP, SSOP, or TSSOP, Top View" (cross-check)"
  "1":  { name: QB, type: output }
  "2":  { name: QC, type: output }
  "3":  { name: QD, type: output }
  "4":  { name: QE, type: output }
  "5":  { name: QF, type: output }
  "6":  { name: QG, type: output }
  "7":  { name: QH, type: output }
  "8":  { name: GND, type: ground }
  "9":  { name: QH', type: output }
  "10": { name: SRCLR, type: reset }
  "11": { name: SRCLK, type: clock }
  "12": { name: RCLK, type: clock }
  "13": { name: OE, type: input }
  "14": { name: SER, type: input }
  "15": { name: QA, type: output }
  "16":
    name: VCC
    type: power
    src: p3 "16-pin Top View diagram, pin 16 labelled "VCC"; Table 5-1 VCC row shows "—" for this package column (table error)"
