# TPD4E001 4-channel ESD protection array with a VCC pin, pin map of the
# DBV (SOT-23-6) and DCK (SC70-6) packages, which number identically (the
# DRL, DRS, DPK and TPD4E001R DBV variants differ). From the Pin Functions
# table, "DBV, DCK" column (GND 2, IOx 1/3/4/6, VCC 5), checked against
# Figure 4-2 "DBV or DCK Package 6-Pin SOT or SC70 Top View" for the IO
# names. IOx ("ESD-protected channel") typed passive.
schema_version: "0.2"
kind: device
id: ti/TPD4E001
manufacturer: ti
category: diode
family: TPD4E001
source: ti/SLLS682P

parameters:
  forward_voltage:
    min: 0.65 V
    max: 0.95 V
    at: { IF: 10 mA }
    src: p5 "5.6 Electrical Characteristics, VF Diode forward voltage"
  reverse_voltage:
    max: 5.5 V
    src: p5 "5.6 Electrical Characteristics, VRWM (IO pin to GND pin)"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p4 "5.4 Recommended Operating Conditions, TA"

pins:
  src:
    - p3 "Pin Functions, DBV, DCK column"
    - p3 "Figure 4-2 DBV or DCK Package 6-Pin SOT or SC70 Top View (IO names)"
  "1": { name: IO1, type: passive }
  "2": { name: GND, type: ground }
  "3": { name: IO2, type: passive }
  "4": { name: IO3, type: passive }
  "5": { name: VCC, type: power }
  "6": { name: IO4, type: passive }
