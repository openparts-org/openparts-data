# DRV8871 brushed-DC motor driver (H-bridge, PWM control), DDA (8-pin
# HSOP / SO PowerPAD) pin map. Pin Functions table (SLVSCY9B page 3);
# cross-checked with the "DDA Package 8-Pin HSOP Top View" figure (page
# 3). The table's "PAD" row (thermal pad, no number) says "Connect to
# board ground" -- a connection instruction -> pin "EP" named PAD, type
# passive.
schema_version: "0.2"
kind: device
id: ti/DRV8871
manufacturer: ti
category: driver
family: DRV8871
source: ti/SLVSCY9B

pins:
  src:
    - p3 "Pin Functions (GND 1 ... VM 5, PAD -)"
    - p3 "DDA Package 8-Pin HSOP Top View (cross-check)"
  "1": { name: GND, type: ground }
  "2": { name: IN2, type: input }
  "3": { name: IN1, type: input }
  "4": { name: ILIM, type: passive }
  "5": { name: VM, type: power }
  "6": { name: OUT1, type: output }
  "7": { name: PGND, type: ground }
  "8": { name: OUT2, type: output }
  EP:  { name: PAD, type: passive }
