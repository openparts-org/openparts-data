# Quad 2-input OR SN74HC32, 14-pin pin map (D, DB, N, NS, PW, J, or W)
# from the "Pin Functions" table (SCLS200F page 3), checked against the
# 14-pin top-view figure on the same page; all 14 pins match. The FK
# (LCCC) numbering differs and is not covered.
schema_version: "0.2"
kind: device
id: ti/SN74HC32
manufacturer: ti
category: logic
family: SNx4HC32
source: ti/SCLS200F

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage: { min: 2 V, max: 6 V, src: 'p4 "6.3 Recommended Operating Conditions, VCC"' }
  supply_current:
    max: 2 µA
    at: { VCC: 6 V, TA: 25 °C }
    src: 'p6 "6.6 Electrical Characteristics - 74: ICC, 6 V, 25 °C"'
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p4 "6.3 Recommended Operating Conditions, TA, SN74HC32 row"
  esd_hbm:          { typ: 2 kV, src: 'p4 "6.2 ESD Ratings, HBM"' }
  channel_count: { value: "4", src: 'p1 "3 Description: four independent 2-input OR gates"' }
  propagation_delay:
    - typ: 10 ns
      max: 20 ns
      at: { VCC: 4.5 V, TA: 25 °C }
      src: 'p6 "6.8 Switching Characteristics - 74: tpd A or B to Y, 4.5 V"'
    - typ: 50 ns
      max: 100 ns
      at: { VCC: 2 V, TA: 25 °C }
      src: 'p6 "6.8 Switching Characteristics - 74: tpd A or B to Y, 2 V"'
    - typ: 8 ns
      max: 17 ns
      at: { VCC: 6 V, TA: 25 °C }
      src: 'p6 "6.8 Switching Characteristics - 74: tpd A or B to Y, 6 V"'
  output_structure: { value: push_pull, src: p9 "8.3.1 Balanced CMOS Push-Pull Outputs" }
  logic_function:   { value: or, src: 'p1 "Title, Quadruple 2-Input OR Gates"' }

pins:
  src:
    - p3 "Pin Functions" table, column "D, DB, N, NS, PW, J, or W"
    - p3 ""D, DB, N, NS, PW, J, or W Package 14-Pin ... Top View" figure (cross-check)"
  "1":  { name: 1A, type: input }
  "2":  { name: 1B, type: input }
  "3":  { name: 1Y, type: output }
  "4":  { name: 2A, type: input }
  "5":  { name: 2B, type: input }
  "6":  { name: 2Y, type: output }
  "7":  { name: GND, type: ground }
  "8":  { name: 3Y, type: output }
  "9":  { name: 3A, type: input }
  "10": { name: 3B, type: input }
  "11": { name: 4Y, type: output }
  "12": { name: 4A, type: input }
  "13": { name: 4B, type: input }
  "14": { name: VCC, type: power }
