# High-side current shunt monitor (current output), DBV (SOT-23-5) pin
# map from the "Pin Functions" table (SBOS181F page 3): OUT 1, GND 2,
# VIN+ 3, VIN- 4, V+ 5, checked against the DBV top-view figure (same
# page). INA139 and INA169 share this pin map. Minus sign written as
# ASCII "-".
schema_version: "0.2"
kind: device
id: ti/INA139-DBV
manufacturer: ti
category: current_sense_amplifier
family: INA1x9
source: ti/SBOS181F

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2.7 V
    max: 40 V
    src: p4 "6.3 Recommended Operating Conditions, V+ power-supply voltage, INA139"
  supply_current:
    typ: 60 µA
    max: 125 µA
    at: { VCC: 5 V, VIN: 12 V, TA: -40..125 °C }
    src: 'p6 "6.5 Electrical Characteristics: Quiescent current, VSENSE = 0, IO = 0"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: 'p6 "6.5 Electrical Characteristics: Temperature range, Specification TMIN to TMAX, INA139"'
  esd_hbm: { typ: 1 kV, src: 'p4 "6.2 ESD Ratings, HBM"' }
  channel_count: { value: "1", src: 'p3 "Pin Functions: one VIN+/VIN- input pair, one OUT"' }
  input_offset_voltage:
    typ: 0.2 mV
    max: 1.5 mV
    at: { VCC: 5 V, VIN: 12 V, TA: -40..125 °C }
    src: 'p6 "6.5 Electrical Characteristics: Offset voltage RTI, INA139 (printed ±0.2/±1.5 mV)"'
  input_bias_current:
    typ: 10 µA
    at: { VCC: 5 V, VIN: 12 V, TA: -40..125 °C }
    src: 'p6 "6.5 Electrical Characteristics: Input bias current"'

pins:
  src: [p3 "Pin Functions table", p3 "DBV Package 5-Pin SOT-23 Top View"]
  "1": { name: OUT, type: analog }
  "2": { name: GND, type: ground }
  "3": { name: VIN+, type: analog }
  "4": { name: VIN-, type: analog }
  "5": { name: V+, type: power }
