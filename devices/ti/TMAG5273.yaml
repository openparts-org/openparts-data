# TMAG5273 low-power linear 3D Hall-effect sensor with I2C interface,
# DBV (6-pin SOT-23). Pins from Table 4-1 "Pin Functions" (SLYS045C page
# 4), checked against Figure 4-1 "DBV Package, 6-Pin SOT-23 (Top View)"
# (same page). Types: SCL (listed IO) -> clock as for other I2C sensors;
# SDA, INT -> io; pin 3 "GND (TEST)" is a TI test pin ("Connect to
# ground in application", type Input) -> input, name kept as printed.
# The magnetic range per version (x1 / x2) is on the Parts.
schema_version: "0.2"
kind: device
id: ti/TMAG5273
manufacturer: ti
category: magnetic_sensor
family: TMAG5273
source: ti/SLYS045C

# Parameters (AI candidates, needs review).
parameters:
  data_interface:
    value: i2c
    src: 'p4 "Table 4-1 Pin Functions: SCL Serial clock, SDA Serial data"'
  supply_voltage:
    min: 1.7 V
    max: 3.6 V
    src: p5 "5.3 Recommended Operating Conditions, VCC Main supply voltage"
  supply_current:
    typ: 2.3 mA
    src: p6 "5.5 Electrical Characteristics, IACTIVE Active mode current, LP_LN = 0b"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "5.3 Recommended Operating Conditions, TA Operating free air temperature"
  esd_hbm: { typ: 2 kV, src: 'p5 "5.2 ESD Ratings, HBM all pins ±2000 V"' }
  magnetic_sensor_type:
    value: 3d
    src: p1 "TMAG5273 Low-Power Linear 3D Hall-Effect Sensor With I2C Interface"

pins:
  src: [p4 "Table 4-1 Pin Functions", 'p4 "Figure 4-1 DBV Package, 6-Pin SOT-23 (Top View)"']
  "1": { name: SCL, type: clock }
  "2": { name: GND, type: ground }
  "3": { name: GND (TEST), type: input }
  "4": { name: VCC, type: power }
  "5": { name: INT, type: io }
  "6": { name: SDA, type: io }
