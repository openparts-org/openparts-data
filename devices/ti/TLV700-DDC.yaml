# 200-mA low-IQ LDO (all fixed voltages), DDC (SOT-23-THIN 5) pinout.
# From SLVSA00E "Pin Functions" table (page 4), column "SOT": IN 1,
# GND 2, EN 3, NC 4, OUT 5, checked against the "DDC Package 5-Pin SOT
# Top View" figure (same page), where pin 4 is drawn "N/C" with note
# "(1) No connection"; the table name "NC" is used. The SC70 (DCK)
# column has the same numbers but is not covered here.
schema_version: "0.2"
kind: device
id: ti/TLV700-DDC
manufacturer: ti
category: linear_regulator
family: TLV700
source: ti/SLVSA00E

parameters:
  output_type:
    value: fixed
    src: p1 "1 Features, "Available in Fixed-Output Voltages from 1.2 V to 4.8 V""
  input_voltage_max:
    max: 5.5 V
    src: 'p5 "6.3 Recommended Operating Conditions, VIN: MAX 5.5 V"'
  output_current:
    max: 200 mA
    src: 'p5 "6.3 Recommended Operating Conditions, IOUT: MAX 200 mA"'

pins:
  src: ['p4 ""Pin Functions" table, column "SOT""', p4 ""DDC Package 5-Pin SOT Top View" figure"]
  "1": { name: IN, type: power }
  "2": { name: GND, type: ground }
  "3": { name: EN, type: input }
  "4": { name: NC, type: nc }
  "5": { name: OUT, type: power }
