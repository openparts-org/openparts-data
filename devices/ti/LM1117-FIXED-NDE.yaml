# LM1117 800-mA LDO, fixed-output options (3.3 V, 5.0 V ...), NDE
# (TO-220) pinout. SNOS412Q Table 6-1 "Pin Functions" (page 3), TO-220
# column: ADJ/GND 1, VOUT "2, TAB", VIN 3; Figure 6-2 "NDE Package,
# 3-Pin TO-220 (Top View)". Pin 1 is "Ground pin for fixed output
# option" -> ground (as ti/LM1117-3.3). The TO-220 tab (VOUT) is not a
# board pad: pins 1-3 only.
schema_version: "0.2"
kind: device
id: ti/LM1117-FIXED-NDE
manufacturer: ti
category: linear_regulator
family: LM1117
source: ti/SNOS412Q

parameters:
  output_type:
    value: fixed
    src: 'p1 "3 Description: "the device is available in five fixed voltages, 1.8 V, 2.5 V, 3.3 V, and 5 V""'
  input_voltage_max:
    max: 15 V
    src: 'p4 "7.3 Recommended Operating Conditions, Input voltage (VIN to GND): MAX 15 V"'
  output_current: { typ: 800 mA, src: 'p1 "1 Features, "Output current: 800 mA""' }
  dropout_voltage:
    typ: 1.2 V
    max: 1.3 V
    at: { IOUT: 800 mA, TJ: 25 °C }
    src: 'p6 "7.5 LM1117 Electrical Characteristics (continued), Dropout voltage: TYP 1.2 V, MAX 1.3 V (0°C to 125°C); LM1117 (not LM1117I) table, orderables listed 0 to 125 °C in the package option addendum"'

pins:
  src:
    - 'p3 "Table 6-1 "Pin Functions", TO-220 column: ADJ/GND 1, VIN 3, VOUT "2, TAB""'
    - p3 "Figure 6-2 "NDE Package, 3-Pin TO-220 (Top View)""
  "1": { name: ADJ/GND, type: ground }
  "2": { name: VOUT, type: power }
  "3": { name: VIN, type: power }
