# LM1117 800-mA LDO, fixed-output options (3.3 V, 5.0 V ...), NDE
# (TO-220) pinout. SNOS412Q Table 6-1 "Pin Functions" (page 3), TO-220
# column: ADJ/GND 1, VOUT "2, TAB", VIN 3; Figure 6-2 "NDE Package,
# 3-Pin TO-220 (Top View)". Pin 1 is "Ground pin for fixed output
# option" -> ground (as ti/LM1117-3.3). The TO-220 tab (VOUT) is not a
# board pad: pins 1-3 only.
