# LM1117 800-mA LDO, fixed-output options (3.3 V, 5.0 V ...), NDE
# (TO-220) pinout. SNOS412Q Table 6-1 "Pin Functions" (page 3), TO-220
# column: ADJ/GND 1, VOUT "2, TAB", VIN 3; Figure 6-2 "NDE Package,
# 3-Pin TO-220 (Top View)". Pin 1 is "Ground pin for fixed output
# option" -> ground (as ti/LM1117-3.3). The TO-220 tab (VOUT) is not a
# board pad: pins 1-3 only.
schema_version: "0.1"
kind: device
id: ti/LM1117-FIXED-NDE

manufacturer: ti
category: linear_regulator
family: LM1117

pins:
  "1": { name: "ADJ/GND", type: ground }
  "2": { name: "VOUT", type: power }
  "3": { name: "VIN", type: power }

parameters:
  output_type:
    value: fixed
  input_voltage_max:
    max: 15
    unit: V
  output_current:
    nominal: 800
    unit: mA
  dropout_voltage:
    nominal: 1.2
    max: 1.3
    unit: V

provenance:
  "/parameters/output_type":
    - source: ti/SNOS412Q
      page: 1
      locator: "3 Description: \"the device is available in five fixed voltages, 1.8 V, 2.5 V, 3.3 V, and 5 V\""
  "/parameters/input_voltage_max":
    - source: ti/SNOS412Q
      page: 4
      locator: "7.3 Recommended Operating Conditions, Input voltage (VIN to GND): MAX 15 V"
  "/parameters/output_current":
    - source: ti/SNOS412Q
      page: 1
      locator: "1 Features, \"Output current: 800 mA\""
  "/parameters/dropout_voltage":
    - source: ti/SNOS412Q
      page: 6
      locator: "7.5 LM1117 Electrical Characteristics (continued), Dropout voltage, IOUT = 800 mA: TYP 1.2 V (TJ = 25°C), MAX 1.3 V (0°C to 125°C); LM1117 (not LM1117I) table, orderables listed 0 to 125 °C in the package option addendum"
  "/pins":
    - source: ti/SNOS412Q
      page: 3
      locator: "Table 6-1 \"Pin Functions\", TO-220 column: ADJ/GND 1, VIN 3, VOUT \"2, TAB\""
    - source: ti/SNOS412Q
      page: 3
      locator: "Figure 6-2 \"NDE Package, 3-Pin TO-220 (Top View)\""
