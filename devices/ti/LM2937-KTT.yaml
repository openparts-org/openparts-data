# LM2937 500-mA LDO (all fixed voltages), KTT (TO-263) pinout. SNVS100F
# "Pin Functions" (page 3), KTT column: INPUT 1, GND 2, OUTPUT 3, GND TAB
# -- "The TAB is internally connected to device pin 2 (GND)" ->
# connected_to "2". Tab keyed "4" as printed on outline KTT0003B (page
# 29); the table's DCY column also numbers the tab 4.
schema_version: "0.2"
kind: device
id: ti/LM2937-KTT
manufacturer: ti
category: linear_regulator
family: LM2937
source: ti/SNVS100F

parameters:
  input_voltage_max: { max: 26 V, src: 'p4 "6.3 Recommended Operating Conditions, VIN"' }
  output_current:    { max: 500 mA, src: 'p5 "6.5 Elec. Char. header, IOUT(MAX), DDPAK/TO-263"' }
  dropout_voltage:
    typ: 0.5 V
    max: 1 V
    at: { IOUT: 500 mA }
    src: p5 "6.5 Elec. Char. (same in all LM2937 tables), Dropout voltage, IOUT = IOUT(MAX)"

pins:
  src:
    - 'p3 ""Pin Functions", KTT column: INPUT 1, GND 2, OUTPUT 3, GND TAB ("internally connected to device pin 2 (GND)")"'
    - p3 ""DDPAK/TO-263 Surface-Mount Package (KTT) Top View""
    - 'p29 "KTT0003B outline, bottom view: tab labelled "4""'
  "1": { name: INPUT, type: power }
  "2": { name: GND, type: ground }
  "3": { name: OUTPUT, type: power }
  "4": { name: GND, type: ground, connected_to: "2" }
