# TMP175 digital temperature sensor (LM75 pinout), 8-pin SOIC (D) and VSSOP
# (DGK) with the same pin map. Pins from Table 5-1 "Pin Functions"
# (SBOS288M page 3; one table for both packages and for TMP75/TMP175).
# V+ is type "I"; typed power from its description ("Supply voltage");
# SCL clock, SDA io, ALERT (open-drain) output, A0-A2 address inputs.
schema_version: "0.2"
kind: device
id: ti/TMP175
manufacturer: ti
category: temperature_sensor
family: TMPx75
source: ti/SBOS288M

# Parameters (AI candidates, needs review).
parameters:
  data_interface:
    value: i2c
    src: 'p1 "Digital Output: SMBus, Two-Wire, and I2C Interface Compatibility"'
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: p4 "6.3 Recommended Operating Conditions, V+ Supply voltage"
  supply_current:
    typ: 50 µA
    max: 85 µA
    src: p5 "6.5 Electrical Characteristics, TMP175 column, IDD_AVG Average current, serial bus inactive"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p4 "6.3 Recommended Operating Conditions, TA Operating ambient temperature"
  esd_hbm: { typ: 4 kV, src: 'p4 "6.2 ESD Ratings, HBM ±4000 V"' }

pins:
  src: p3 "Table 5-1 Pin Functions"
  "1": { name: SDA, type: io }
  "2": { name: SCL, type: clock }
  "3": { name: ALERT, type: output }
  "4": { name: GND, type: ground }
  "5": { name: A2, type: input }
  "6": { name: A1, type: input }
  "7": { name: A0, type: input }
  "8": { name: V+, type: power }
