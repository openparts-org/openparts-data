# Octal bus transceiver with 3-state outputs SN74HC245, 20-pin pin map
# (DB, DGV, DW, N, J, W, PW) from the pin-functions table (SCLS131F page
# 3) checked against Figure 5-1 (same page); all 20 pins match. The
# table's TYPE column prints "I/O" for DIR (pin 1) and OE (pin 19) as
# well; their descriptions ("Direction Pin", "Output Enable") are
# control inputs, recorded as input as in ti/SN74LVC245A -- a reviewer
# should confirm. OE is active low (overbar in the figure). The FK
# (LCCC) numbering differs and is not covered.
schema_version: "0.2"
kind: device
id: ti/SN74HC245
manufacturer: ti
category: logic
family: SNx4HC245
source: ti/SCLS131F

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2 V
    max: 6 V
    src: p4 "6.3 Recommended Operating Conditions, VCC, SN74HC245 column"
  supply_current:
    max: 8 µA
    at: { VCC: 6 V, TA: 25 °C }
    src: 'p5 "6.5 Electrical Characteristics: ICC, 6 V, TA = 25°C column"'
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p4 "6.3 Recommended Operating Conditions, TA, SN74HC245 column"
  esd_hbm:       { typ: 3 kV, src: 'p4 "6.2 ESD Ratings, HBM"' }
  channel_count: { value: "8", src: 'p1 "Title, Octal Bus Transceivers"' }
  propagation_delay:
    - typ: 15 ns
      max: 21 ns
      at: { VCC: 4.5 V, CL: 50 pF, TA: 25 °C }
      src: 'p6 "6.6 Switching Characteristics, CL = 50 pF: tpd A or B to B or A, 25°C, 4.5 V"'
    - typ: 40 ns
      max: 105 ns
      at: { VCC: 2 V, CL: 50 pF, TA: 25 °C }
      src: 'p6 "6.6 Switching Characteristics, CL = 50 pF: tpd A or B to B or A, 25°C, 2 V"'
    - typ: 12 ns
      max: 18 ns
      at: { VCC: 6 V, CL: 50 pF, TA: 25 °C }
      src: 'p6 "6.6 Switching Characteristics, CL = 50 pF: tpd A or B to B or A, 25°C, 6 V"'
  logic_function:
    value: bus_transceiver
    src: p1 "Title, Octal Bus Transceivers With 3-State Outputs"

pins:
  src:
    - p3 "pin-functions table (NO. / NAME / TYPE)"
    - p3 "Figure 5-1 "DB, DGV, DW, N, J, W, or PW Package" (cross-check)"
  "1":  { name: DIR, type: input }
  "2":  { name: A1, type: io }
  "3":  { name: A2, type: io }
  "4":  { name: A3, type: io }
  "5":  { name: A4, type: io }
  "6":  { name: A5, type: io }
  "7":  { name: A6, type: io }
  "8":  { name: A7, type: io }
  "9":  { name: A8, type: io }
  "10": { name: GND, type: ground }
  "11": { name: B8, type: io }
  "12": { name: B7, type: io }
  "13": { name: B6, type: io }
  "14": { name: B5, type: io }
  "15": { name: B4, type: io }
  "16": { name: B3, type: io }
  "17": { name: B2, type: io }
  "18": { name: B1, type: io }
  "19": { name: OE, type: input }
  "20": { name: VCC, type: power }
