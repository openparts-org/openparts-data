# Single Schmitt-trigger buffer (SN74LVC1G17), 5-pin pin map of the DBV
# (SOT-23-5) package, from the "Pin Functions" table (SCES351Y page 3),
# column "DBV, DCK, DRL, DPW": NC 1, A 2, GND 3, Y 4, VCC 5; checked
# against the DBV top-view figure on the same page. The 6-pin DRY/DSF
# and the BGA pin maps differ and are not covered.
schema_version: "0.2"
kind: device
id: ti/SN74LVC1G17-DBV
manufacturer: ti
category: logic
family: SN74LVC1G17
source: ti/SCES351Y

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.65 V
    max: 5.5 V
    src: p5 "5.3 Recommended Operating Conditions, VCC, Operating"
  supply_current:
    max: 10 µA
    at: { VCC: 1.65..5.5 V }
    src: 'p6 "5.5 Table 5-1: ICC, VI = 5.5V or GND, IO = 0, -40 to 85 °C"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "5.3 Recommended Operating Conditions, TA"
  esd_hbm:        { typ: 2 kV, src: 'p4 "5.2 ESD Ratings, HBM"' }
  channel_count:  { value: "1", src: 'p1 "Title: Single Schmitt-Trigger Buffer"' }
  propagation_delay:
    min: 1.5 ns
    max: 4.6 ns
    at: { VCC: 3.3 V, CL: 15 pF, TA: -40..85 °C }
    src: 'p7 "Table 5-2 CL = 15pF: tpd, VCC = 3.3V"'
  logic_function: { value: buffer, src: 'p1 "Title: Single Schmitt-Trigger Buffer"' }
  output_current_high:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p5 "5.3 Recommended Operating Conditions, IOH, VCC = 4.5 V (printed -32 mA)"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p5 "5.3 Recommended Operating Conditions, IOH, VCC = 3 V (printed -24 mA)"
  output_current_low:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p5 "5.3 Recommended Operating Conditions, IOL, VCC = 4.5 V"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p5 "5.3 Recommended Operating Conditions, IOL, VCC = 3 V"

pins:
  src:
    - p3 "Pin Functions" table, column "DBV, DCK, DRL, DPW"
    - p3 ""DBV PACKAGE (TOP VIEW)" figure (cross-check)"
  "1": { name: NC, type: nc }
  "2": { name: A, type: input }
  "3": { name: GND, type: ground }
  "4": { name: Y, type: output }
  "5": { name: VCC, type: power }
