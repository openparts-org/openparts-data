# TPS3840 nano-power high-input-voltage supervisor with manual reset
# and programmable delay, active-low RESET options TPS3840PL (push-pull)
# and TPS3840DL (open-drain), DBV (SOT-23-5) pinout. From SNVSB03E
# Table 5-1 "Pin Functions" (page 4), column "TPS3840PL, TPS3840DL":
# RESET 1, VDD 2, GND 3, MR / NC 4, CT 5; checked against Figure 5-1
# (same page). The active-high TPS3840PH (RESET 1, no overbar) is not
# covered by this Device. RESET and MR carry an overbar in the datasheet
# (written without it here); pin 4 is printed "MR / NC" and named MR.
# Types: RESET (O) -> output, VDD (I, "Input Supply Voltage") -> power,
# MR (I) -> input, CT (capacitor delay pin) -> analog. Category "power"
# as ti/TPS3839-DBZ.
schema_version: "0.2"
kind: device
id: ti/TPS3840-DBV
manufacturer: ti
category: power
family: TPS3840
source: ti/SNVSB03E

parameters:
  input_voltage_max: { max: 10 V, src: 'p5 "6.3 Recommended Operating Conditions, VDD"' }

pins:
  src:
    - p4 "Table 5-1 "Pin Functions", column "TPS3840PL, TPS3840DL""
    - p4 "Figure 5-1 "DBV Package 5-Pin SOT-23 TPS3840PL, TPS3840DL Top View""
  "1": { name: RESET, type: output }
  "2": { name: VDD, type: power }
  "3": { name: GND, type: ground }
  "4": { name: MR, type: input }
  "5": { name: CT, type: analog }
