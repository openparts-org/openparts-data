# HDC2080 low-power humidity and temperature digital sensor, 6-pin PWSON
# (DMB), from Table 6-1 "Pin Functions" (SNAS678C page 4), checked
# against Figure 6-1 "DMB Package 6-Pin PWSON Top View" (same page).
# I/O types: P -> power, G -> ground, I -> input (SCL typed clock),
# O -> output (DRDY/INT push-pull), I/O -> io.
# The table lists no die attach pad, so no pin is added for the DMB0006A
# thermal pad (its land 7 stays a pad without a pin).
# Category `sensor`: the tree has no humidity-sensor node.
schema_version: "0.2"
kind: device
id: ti/HDC2080
manufacturer: ti
category: sensor
family: HDC2080
source: ti/SNAS678C

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.62 V
    max: 3.6 V
    src: p5 "7.3 Recommended Operating Conditions, VDD Supply voltage"
  esd_hbm: { typ: 2 kV, src: 'p5 "7.2 ESD Ratings, HBM ±2000 V"' }

pins:
  src:
    - p4 "Table 6-1 Pin Functions"
    - p4 "Figure 6-1 DMB Package 6-Pin PWSON Top View (cross-check)"
  "1": { name: SDA, type: io }
  "2": { name: GND, type: ground }
  "3": { name: ADDR, type: input }
  "4": { name: DRDY/INT, type: output }
  "5": { name: VDD, type: power }
  "6": { name: SCL, type: clock }
