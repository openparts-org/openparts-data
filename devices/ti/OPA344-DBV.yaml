# Single rail-to-rail CMOS op amp, SOT23-5 (DBV) pinout. SBOS107A has
# no pin-function table; the pin map is read from the "OPA344, OPA345
# SOT23-5" pin-configuration figure on page 1 (rendered and read as an
# image): Out 1, V- 2, +In 3, -In 4, V+ 5. The SO-8/DIP pinout differs
# (NC 1, -In 2, ...) and is not covered. Names as printed with ASCII
# "-"; signal pins analog, supplies power (as for ti/OPA2333).
schema_version: "0.1"
kind: device
id: ti/OPA344-DBV

manufacturer: ti
category: other
family: OPAx344

pins:
  "1": { name: Out, type: analog }
  "2": { name: "V-", type: power }
  "3": { name: "+In", type: analog }
  "4": { name: "-In", type: analog }
  "5": { name: "V+", type: power }

provenance:
  "/pins":
    - source: ti/SBOS107A
      page: 1
      locator: "Pin-configuration figure \"OPA344, OPA345\" SOT23-5"
