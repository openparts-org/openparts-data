# LM1117 800-mA LDO, fixed 3.3-V output option. Pins from SNOS412Q
# Table 6-1 "Pin Functions" (page 3): ADJ/GND 1, VIN 3, VOUT "2, 4"
# (SOT-223 column) / "2 , TAB" (TO-252 column). Pin 1's description:
# "Adjust pin for adjustable output option. Ground pin for fixed output
# option" -- this fixed-output device therefore types it ground (name kept
# as printed). Pin 4 is the tab (VOUT); for TO-252 the pin table says
# "TAB" while outline NDP0003B (page 41) labels the tab "4" -- this
# device keys the tab as "4" for both packages, see
# packages/standards/dpak/TO252-6.1x6.5-P2.29-TabPin4-TI-NDP.yaml.
# Cross-checked against Figure 6-1 (DCY) and Figure 6-4 (NDP) top views
# (page 3: INPUT / OUTPUT / ADJ/GND top to bottom, "Tab is VOUT").
schema_version: "0.2"
kind: device
id: ti/LM1117-3.3
manufacturer: ti
category: linear_regulator
family: LM1117
source: ti/SNOS412Q

parameters:
  output_type:       { value: fixed, src: p1 "3 Description" }
  output_voltage:
    - min: 3.267 V
      typ: 3.3 V
      max: 3.333 V
      at: { VIN: 5 V, IOUT: 10 mA, TJ: 25 °C }
      src: p5 "7.5 LM1117 Elec. Char., VOUT, LM1117-3.3"
    - min: 3.235 V
      max: 3.365 V
      at: { VIN: 4.75..10 V, IOUT: 0..800 mA, TJ: 0..125 °C }
      src: p5 "7.5 LM1117 Elec. Char., VOUT, LM1117-3.3"
  input_voltage_max: { max: 15 V, src: 'p4 "7.3 Recommended Operating Conditions, VIN"' }
  output_current:    { max: 800 mA, src: p1 "1 Features" }
  dropout_voltage:
    - typ: 1.2 V
      max: 1.3 V
      at: { IOUT: 800 mA }
      src: p6 "7.5 LM1117 (not LM1117I) Elec. Char., Dropout voltage"
    - typ: 1.1 V
      max: 1.2 V
      at: { IOUT: 100 mA }
      src: p6 "7.5 LM1117 (not LM1117I) Elec. Char., Dropout voltage"
    - typ: 1.15 V
      max: 1.25 V
      at: { IOUT: 500 mA }
      src: p6 "7.5 LM1117 (not LM1117I) Elec. Char., Dropout voltage"

pins:
  src:
    - 'p3 "Table 6-1 "Pin Functions" (SOT-223 column: ADJ/GND 1, VIN 3, VOUT 2, 4; TO-252 column: VOUT "2 , TAB")"'
    - p3 "Figure 6-1 "DCY Package, 4-Pin SOT" and Figure 6-4 "NDP Package, 3-Pin TO-252" (Top View), "Tab is VOUT""
    - 'p41 "NDP0003B outline, bottom view: tab labelled "4" (TO-252 tab number, see header)"'
  "1": { name: ADJ/GND, type: ground }
  "2": { name: VOUT, type: power }
  "3": { name: VIN, type: power }
  "4": { name: VOUT, type: power }
