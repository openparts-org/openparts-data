# LM1117 800-mA LDO, fixed 3.3-V output option. Pins from SNOS412Q
# Table 6-1 "Pin Functions" (page 3): ADJ/GND 1, VIN 3, VOUT "2, 4"
# (SOT-223 column) / "2 , TAB" (TO-252 column). Pin 1's description:
# "Adjust pin for adjustable output option. Ground pin for fixed output
# option" -- this fixed-output device therefore types it ground (name kept
# as printed). Pin 4 is the tab (VOUT); for TO-252 the pin table says
# "TAB" while outline NDP0003B (page 41) labels the tab "4" -- this
# device keys the tab as "4" for both packages, see
# packages/standards/dpak/TO252-6.1x6.5-P2.29-TabPin4-TI-NDP.yaml.
# Cross-checked against Figure 6-1 (DCY) and Figure 6-4 (NDP) top views
# (page 3: INPUT / OUTPUT / ADJ/GND top to bottom, "Tab is VOUT").
schema_version: "0.1"
kind: device
id: ti/LM1117-3.3

manufacturer: ti
category: linear_regulator
family: LM1117

pins:
  "1": { name: ADJ/GND, type: ground }
  "2": { name: VOUT, type: power }
  "3": { name: VIN, type: power }
  "4": { name: VOUT, type: power }

parameters:
  output_type:
    value: fixed
  output_voltage:
    nominal: 3.3
    unit: V
  input_voltage_max:
    max: 15
    unit: V
  output_current:
    nominal: 800
    unit: mA
  dropout_voltage:
    nominal: 1.2
    max: 1.3
    unit: V

provenance:
  "/parameters/output_type":
    - source: ti/SNOS412Q
      page: 1
      locator: "3 Description: \"the device is available in five fixed voltages, 1.8 V, 2.5 V, 3.3 V, and 5 V\""
  "/parameters/output_voltage":
    - source: ti/SNOS412Q
      page: 5
      locator: "7.5 LM1117 Electrical Characteristics, VOUT Output voltage, LM1117-3.3, IOUT = 10 mA, VIN = 5 V, TJ = 25°C: TYP 3.3 V"
  "/parameters/input_voltage_max":
    - source: ti/SNOS412Q
      page: 4
      locator: "7.3 Recommended Operating Conditions, Input voltage (VIN to GND): MAX 15 V"
  "/parameters/output_current":
    - source: ti/SNOS412Q
      page: 1
      locator: "1 Features, \"Output current: 800 mA\""
  "/parameters/dropout_voltage":
    - source: ti/SNOS412Q
      page: 6
      locator: "7.5 LM1117 Electrical Characteristics (continued), Dropout voltage, IOUT = 800 mA: TYP 1.2 V (TJ = 25°C), MAX 1.3 V (0°C to 125°C); LM1117 (not LM1117I) table, orderables listed 0 to 125 °C in the package option addendum"
  "/pins":
    - source: ti/SNOS412Q
      page: 3
      locator: "Table 6-1 \"Pin Functions\" (SOT-223 column: ADJ/GND 1, VIN 3, VOUT 2, 4; TO-252 column: VOUT \"2 , TAB\")"
    - source: ti/SNOS412Q
      page: 3
      locator: "Figure 6-1 \"DCY Package, 4-Pin SOT\" and Figure 6-4 \"NDP Package, 3-Pin TO-252\" (Top View), \"Tab is VOUT\""
    - source: ti/SNOS412Q
      page: 41
      locator: "NDP0003B outline, bottom view: tab labelled \"4\" (TO-252 tab number, see header)"
