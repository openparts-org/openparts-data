# Octal bus transceiver with 3-state outputs. Pin map from the "Pin
# Functions" table (SCAS218X page 3, column "DB, DGV, DW, NS, PW, and
# RGY") and the "DB, DGV, DW, N, NS, OR PW PACKAGE (TOP VIEW)" diagram
# on the same page: all 20 pins match. Same numbering for DB (SSOP) and
# PW (TSSOP). OE carries an overbar (active low) in the datasheet; the
# name here is written without it. VCC is printed "V" with subscript
# "CC".
schema_version: "0.2"
kind: device
id: ti/SN74LVC245A
manufacturer: ti
category: logic
family: SN74LVC245A
source: ti/SCAS218X

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.65 V
    max: 3.6 V
    src: p5 "7.3 Recommended Operating Conditions, VCC, Operating"
  supply_current:
    max: 10 µA
    at: { VCC: 3.6 V, TA: -40..85 °C }
    src: 'p6 "7.5 Electrical Characteristics: ICC, VI = VCC or GND, IO = 0, 3.6 V, -40 to 85 °C"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "7.3 Recommended Operating Conditions, column -40°C TO 125°C"
  esd_hbm: { typ: 2 kV, src: 'p4 "7.2 ESD Ratings, HBM, all pins"' }
  channel_count: { value: "8", src: 'p1 "Title: Octal Bus Transceiver With 3-State Outputs"' }
  propagation_delay:
    min: 1.5 ns
    max: 6.3 ns
    at: { VCC: 3.3 V, CL: 50 pF, TA: -40..85 °C }
    src: 'p6 "7.6 Switching Characteristics: tpd, 3.3 V ± 0.3 V, -40 to 85 °C (CL per p8 Figure 3 table)"'
  logic_function:
    value: bus_transceiver
    src: 'p1 "Title: Octal Bus Transceiver With 3-State Outputs"'
  output_current_high:
    - max: 24 mA
      at: { VCC: 3 V }
      src: p5 "7.3 Recommended Operating Conditions, IOH, VCC = 3 V (printed -24 mA)"
    - max: 12 mA
      at: { VCC: 2.7 V }
      src: p5 "7.3 Recommended Operating Conditions, IOH, VCC = 2.7 V (printed -12 mA)"
  output_current_low:
    - max: 24 mA
      at: { VCC: 3 V }
      src: p5 "7.3 Recommended Operating Conditions, IOL, VCC = 3 V"
    - max: 12 mA
      at: { VCC: 2.7 V }
      src: p5 "7.3 Recommended Operating Conditions, IOL, VCC = 2.7 V"

pins:
  src:
    - p3 ""Pin Functions" table, column "DB, DGV, DW, NS, PW, and RGY""
    - p3 ""DB, DGV, DW, N, NS, OR PW PACKAGE (TOP VIEW)" (cross-check, all 20 pins matched)"
  "1":  { name: DIR, type: input }
  "2":  { name: A1, type: io }
  "3":  { name: A2, type: io }
  "4":  { name: A3, type: io }
  "5":  { name: A4, type: io }
  "6":  { name: A5, type: io }
  "7":  { name: A6, type: io }
  "8":  { name: A7, type: io }
  "9":  { name: A8, type: io }
  "10": { name: GND, type: ground }
  "11": { name: B8, type: io }
  "12": { name: B7, type: io }
  "13": { name: B6, type: io }
  "14": { name: B5, type: io }
  "15": { name: B4, type: io }
  "16": { name: B3, type: io }
  "17": { name: B2, type: io }
  "18": { name: B1, type: io }
  "19": { name: OE, type: input }
  "20": { name: VCC, type: power }
