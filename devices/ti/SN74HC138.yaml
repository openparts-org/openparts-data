# 3-to-8 decoder SN74HC138, 16-pin pin map from the "Pin Functions"
# table (SCLS107G page 3) checked against the rendered 16-pin top view
# (same page); all 16 pins match. G2A/G2B are active low (overbar;
# written without it). The FK (LCCC) numbering differs and is not
# covered.
schema_version: "0.2"
kind: device
id: ti/SN74HC138
manufacturer: ti
category: logic
family: SNx4HC138
source: ti/SCLS107G

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage: { min: 2 V, max: 6 V, src: 'p4 "6.3 Recommended Operating Conditions, VCC"' }
  supply_current:
    max: 8 µA
    at: { VCC: 6 V, TA: 25 °C }
    src: 'p5 "6.6 Electrical Characteristics, TA = 25°C: ICC, VCC = 6 V"'
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p4 "6.3 Recommended Operating Conditions, TA, SN74HC138 row"
  esd_hbm: { typ: 2 kV, src: 'p4 "6.2 ESD Ratings: SN74HC138, HBM"' }
  propagation_delay:
    - typ: 18 ns
      max: 36 ns
      at: { VCC: 4.5 V, CL: 50 pF, TA: 25 °C }
      src: 'p6 "6.9 Switching Characteristics, TA = 25°C, CL = 50 pF: tpd A, B, or C to any Y, 4.5 V"'
    - typ: 67 ns
      max: 180 ns
      at: { VCC: 2 V, CL: 50 pF, TA: 25 °C }
      src: 'p6 "6.9 Switching Characteristics, TA = 25°C, CL = 50 pF: tpd A, B, or C to any Y, 2 V"'
    - typ: 15 ns
      max: 31 ns
      at: { VCC: 6 V, CL: 50 pF, TA: 25 °C }
      src: 'p6 "6.9 Switching Characteristics, TA = 25°C, CL = 50 pF: tpd A, B, or C to any Y, 6 V"'
  logic_function: { value: decoder, src: 'p1 "Title, 3-Line To 8-Line Decoders/Demultiplexers"' }

pins:
  src:
    - p3 ""Pin Functions" table, column "SOIC, SSOP, PDIP, SO, TSSOP, CDIP, CFP""
    - p3 "Pin configuration, 16-pin D/DB/N/NS/PW/J/W Top View (cross-check, rendered)"
  "1":  { name: A, type: input }
  "2":  { name: B, type: input }
  "3":  { name: C, type: input }
  "4":  { name: G2A, type: input }
  "5":  { name: G2B, type: input }
  "6":  { name: G1, type: input }
  "7":  { name: Y7, type: output }
  "8":  { name: GND, type: ground }
  "9":  { name: Y6, type: output }
  "10": { name: Y5, type: output }
  "11": { name: Y4, type: output }
  "12": { name: Y3, type: output }
  "13": { name: Y2, type: output }
  "14": { name: Y1, type: output }
  "15": { name: Y0, type: output }
  "16": { name: VCC, type: power }
