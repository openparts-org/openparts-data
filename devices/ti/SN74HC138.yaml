    - p3 ""Pin Functions" table, column "SOIC, SSOP, PDIP, SO, TSSOP, CDIP, CFP""
    - p3 "Pin configuration, 16-pin D/DB/N/NS/PW/J/W Top View (cross-check, rendered)"
  "1":  { name: A, type: input }
  "2":  { name: B, type: input }
  "3":  { name: C, type: input }
  "4":  { name: G2A, type: input }
  "5":  { name: G2B, type: input }
  "6":  { name: G1, type: input }
  "7":  { name: Y7, type: output }
  "8":  { name: GND, type: ground }
  "9":  { name: Y6, type: output }
  "10": { name: Y5, type: output }
  "11": { name: Y4, type: output }
  "12": { name: Y3, type: output }
  "13": { name: Y2, type: output }
  "14": { name: Y1, type: output }
  "15": { name: Y0, type: output }
  "16": { name: VCC, type: power }
