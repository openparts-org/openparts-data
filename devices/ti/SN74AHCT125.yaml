# Quad 3-state buffer SN74AHCT125, 14-pin pin map from Table 4-1 "Pin
# Functions" (SCLS264R page 4), column "D, DB, DGV, N, NS, J, W, PW,
# RGY or BQA", checked against Figure 4-1 (page 3); all 14 pins match.
# The FK numbering differs and is not covered. The output enables are
# active low (printed "1 OE" with an overbar); written "1OE".."4OE"
# without it.
schema_version: "0.2"
kind: device
id: ti/SN74AHCT125
manufacturer: ti
category: logic
family: SNx4AHCT125
source: ti/SCLS264R

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 4.5 V
    max: 5.5 V
    src: p5 "5.2 Recommended Operating Conditions, VCC, SN74AHCT125 column"
  supply_current:
    max: 2 µA
    at: { VCC: 5.5 V, TA: 25 °C }
    src: 'p6 "5.4 Electrical Characteristics: ICC, 5.5 V, TA = 25°C column"'
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p5 "5.2 Recommended Operating Conditions, TA, SN74AHCT125 column"
  channel_count: { value: "4", src: 'p9 "7.1 Overview: four integrated bus buffer gates"' }
  propagation_delay:
    - typ: 3.8 ns
      max: 5.5 ns
      at: { VCC: 5 V, CL: 15 pF, TA: 25 °C }
      src: 'p6 "5.5 Switching Characteristics: tPLH/tPHL A to Y, CL = 15 pF, TA = 25°C"'
    - typ: 5.3 ns
      max: 7.5 ns
      at: { VCC: 5 V, CL: 50 pF, TA: 25 °C }
      src: 'p6 "5.5 Switching Characteristics: tPLH/tPHL A to Y, CL = 50 pF, TA = 25°C"'
  logic_function:
    value: buffer
    src: p1 "Title, Quadruple Bus Buffer Gates With 3-State Outputs"
  output_current_high:
    max: 8 mA
    src: p5 "5.2 Recommended Operating Conditions, IOH, SN74AHCT125 column (printed -8 mA)"
  output_current_low:
    max: 8 mA
    src: p5 "5.2 Recommended Operating Conditions, IOL, SN74AHCT125 column"

pins:
  src:
    - p4 "Table 4-1 "Pin Functions", column "D, DB, DGV, N, NS, J, W, PW, RGY or BQA""
    - p3 "Figure 4-1 "SN54AHCT125 J or W Package, SN74AHCT125 D, DB, DGV, N, NS, or PW Package (Top View)" (cross-check)"
  "1":  { name: 1OE, type: input }
  "2":  { name: 1A, type: input }
  "3":  { name: 1Y, type: output }
  "4":  { name: 2OE, type: input }
  "5":  { name: 2A, type: input }
  "6":  { name: 2Y, type: output }
  "7":  { name: GND, type: ground }
  "8":  { name: 3Y, type: output }
  "9":  { name: 3A, type: input }
  "10": { name: 3OE, type: input }
  "11": { name: 4Y, type: output }
  "12": { name: 4A, type: input }
  "13": { name: 4OE, type: input }
  "14": { name: VCC, type: power }
