# Single buffer/driver with open-drain output (SN74LVC1G07), 5-pin pin
# map of the DBV (SOT-23-5) package, from the "Pin Functions" table
# (SCES296AG page 3), column "DBV, DCK, DRL": NC 1, A 2, GND 3, Y 4, VCC
# 5; checked against the DBV top-view figure on the same page. The 6-pin
# DRY/DSF and the BGA pin maps differ and are not covered.
schema_version: "0.2"
kind: device
id: ti/SN74LVC1G07-DBV
manufacturer: ti
category: logic
family: SN74LVC1G07
source: ti/SCES296AG

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.65 V
    max: 5.5 V
    src: p5 "5.3 Recommended Operating Conditions, VCC, Operating"
  supply_current:
    max: 10 µA
    at: { VCC: 1.65..5.5 V }
    src: 'p6 "5.5 Electrical Characteristics: ICC, VI = 5.5 V or GND, IO = 0"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: 'p5 "5.3 Recommended Operating Conditions, TA, All other packages (DSBGA: -40 to 85 °C)"'
  esd_hbm:          { typ: 2 kV, src: 'p4 "5.2 ESD Ratings, HBM, all pins"' }
  channel_count: { value: "1", src: 'p1 "Title: Single Buffer/Driver With Open-Drain Output"' }
  propagation_delay:
    min: 1.5 ns
    max: 4.2 ns
    at: { VCC: 3.3 V, CL: 50 pF, TA: -40..85 °C }
    src: 'p6 "5.6 Switching Characteristics -40°C to 85°C: tpd, VCC = 3.3 V (CL per p8 Figure 6-1 table)"'
  output_structure: { value: open_drain, src: 'p1 "3 Description: the output is open drain"' }
  logic_function: { value: buffer, src: 'p1 "Title: Single Buffer/Driver With Open-Drain Output"' }
  output_current_low:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p5 "5.3 Recommended Operating Conditions, IOL, VCC = 4.5 V"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p5 "5.3 Recommended Operating Conditions, IOL, VCC = 3 V"

pins:
  src:
    - p3 "Pin Functions" table, column "DBV, DCK, DRL"
    - p3 ""DBV PACKAGE (TOP VIEW)" figure (cross-check)"
  "1": { name: NC, type: nc }
  "2": { name: A, type: input }
  "3": { name: GND, type: ground }
  "4": { name: Y, type: output }
  "5": { name: VCC, type: power }
