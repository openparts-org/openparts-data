# LP5018 18-channel 12-bit PWM I2C RGB LED driver, LP5018DGS pin map. Table 5-1
# "Pin Functions", column "LP5018DGS" (SLVSEB8C pages 5-6), cross-checked with
# "Figure 5-3. LP5018 DGS Package 28-pin VSSOP Top View" (page 4/5). GND
# is pins 10 and 28 (no exposed pad).
# ADDR0/ADDR1 (address selection, must not float) input; IREF (output
# current reference setting) analog; VCAP (internal LDO output,
# capacitor to GND) power_out; EN enable input.
schema_version: "0.2"
kind: device
id: ti/LP5018-DGS
manufacturer: ti
category: led_driver
family: LP50xx
source: ti/SLVSEB8C

# Parameters (AI candidates, needs review).
parameters:
  data_interface: { value: i2c, src: 'p1 "Title, I2C RGB LED Drivers"' }
  output_current:
    max: 25.5 mA
    src: p1 "1 Features, 25.5mA maximum per channel with VCC in full range"
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: p7 "6.3 Recommended Operating Conditions, Input voltage on VCC"
  supply_current:
    typ: 5 mA
    max: 8 mA
    src: p8 "6.5 Electrical Characteristics, IVCC normal-mode supply current, 10-mA LED current per OUTx"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p7 "6.3 Recommended Operating Conditions, TA"
  esd_hbm:        { typ: 4 kV, src: 'p7 "6.2 ESD Ratings, HBM ±4000 V"' }
  channel_count:
    value: "18"
    src: 'p1 "Title, 18-, 24-Channel ... RGB LED Drivers (LP5018: 18)"'
  led_driver_type:
    value: constant_current
    src: p1 "1 Features, constant-current sinks with high precision"

pins:
  src:
    - p5 "Table 5-1. Pin Functions, LP5018DGS column (continued on p6)"
    - p5 "Figure 5-3. LP5018 DGS Package 28-pin VSSOP Top View (cross-check)"
  "1":  { name: OUT9, type: output }
  "2":  { name: OUT10, type: output }
  "3":  { name: OUT11, type: output }
  "4":  { name: OUT12, type: output }
  "5":  { name: OUT13, type: output }
  "6":  { name: OUT14, type: output }
  "7":  { name: OUT15, type: output }
  "8":  { name: OUT16, type: output }
  "9":  { name: OUT17, type: output }
  "10": { name: GND, type: ground }
  "11": { name: ADDR0, type: input }
  "12": { name: ADDR1, type: input }
  "13": { name: VCC, type: power }
  "14": { name: SDA, type: io }
  "15": { name: SCL, type: input }
  "16": { name: EN, type: input }
  "17": { name: IREF, type: analog }
  "18": { name: VCAP, type: power_out }
  "19": { name: OUT0, type: output }
  "20": { name: OUT1, type: output }
  "21": { name: OUT2, type: output }
  "22": { name: OUT3, type: output }
  "23": { name: OUT4, type: output }
  "24": { name: OUT5, type: output }
  "25": { name: OUT6, type: output }
  "26": { name: OUT7, type: output }
  "27": { name: OUT8, type: output }
  "28": { name: GND, type: ground }
