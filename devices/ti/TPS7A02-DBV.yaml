# 200-mA nanopower-IQ LDO, DBV (SOT-23-5) pinout. From SBVS277C Table
# 5-1 "Pin Functions: DQN, DBV" (page 3), DBV column: IN 1, GND 2, EN 3,
# NC 4, OUT 5; checked against Figure 5-2 "DBV Package, 5-Pin SOT-23 (Top
# View)" (same page). NC is "not internally connected". The DQN (X2SON)
# and YCH (DSBGA) pin maps are not covered. IN/OUT typed power, as for
# ti/TLV755P-DBV.
schema_version: "0.2"
kind: device
id: ti/TPS7A02-DBV
manufacturer: ti
category: linear_regulator
family: TPS7A02
source: ti/SBVS277C

parameters:
  output_type:       { value: fixed, src: 'p1 "1 Features, Output voltage range (fixed)"' }
  input_voltage_max: { max: 6 V, src: 'p5 "6.3 Recommended Operating Conditions, VIN"' }
  output_current:    { max: 200 mA, src: 'p5 "6.3 Recommended Operating Conditions, IOUT"' }

pins:
  src:
    - 'p3 "Table 5-1 "Pin Functions: DQN, DBV", column "DBV""'
    - p3 "Figure 5-2 "DBV Package, 5-Pin SOT-23 (Top View)""
  "1": { name: IN, type: power }
  "2": { name: GND, type: ground }
  "3": { name: EN, type: input }
  "4": { name: NC, type: nc }
  "5": { name: OUT, type: power }
