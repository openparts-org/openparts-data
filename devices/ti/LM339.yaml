# LM339 quad differential comparator (open-collector outputs), 14-pin
# pin map of the D, DB, N, NS, PW, DYY and J packages. From SLCS006Z
# Table 5-1 "Pin Functions" (page 4), column "D, DB, N, NS, PW, DYY, J",
# checked against Figure 5-1 "D, DB, N, NS, PW Packages 14-Pin SOIC,
# SSOP, PDIP, SOP, TSSOP Top View" (same page; the figure writes
# 1OUT/2IN- etc. for the table's OUT1/IN2-, same pin numbers). Names
# follow the table; table footnote 1: "Some manufacturers transpose the
# names of channels 1 & 2. Electrically the pinouts are identical" (the
# table's description column for pins 1, 2, 4-7 even names the other
# comparator). Minus signs written as ASCII "-". VCC "Positive supply"
# -> power, GND "Negative supply" -> ground. The datasheet covers
# LM139/239/339/2901 with one pin table; the 16-pad WQFN (RTE) numbering
# differs and is not covered.
schema_version: "0.2"
kind: device
id: ti/LM339
manufacturer: ti
category: comparator
family: LMx39/LM2901
source: ti/SLCS006Z

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2 V
    max: 30 V
    src: 'p6 "6.5 Recommended Operating Conditions, Non-B Versions: VCC, Non-V devices"'
  supply_current:
    typ: 0.8 mA
    max: 2 mA
    at: { VCC: 5 V, VOUT: 2.5 V, TA: 25 °C }
    src: 'p10 "6.10 Electrical Characteristics LMx39: ICC (four comparators), no load, LM339 column"'
  operating_temperature:
    min: 0 °C
    max: 70 °C
    src: 'p6 "6.5 Recommended Operating Conditions, Non-B: LM339x row (printed as TJ)"'
  esd_hbm: { typ: 2 kV, src: 'p6 "6.3 ESD Ratings, HBM"' }
  channel_count:
    value: "4"
    src: 'p1 "Title: ... LM339, LM239, LM139, LM2901 Quad Differential Comparators"'
  input_offset_voltage:
    typ: 2 mV
    max: 5 mV
    at: { VCC: 5..30 V, VOUT: 1.4 V, TA: 25 °C }
    src: 'p10 "6.10 Electrical Characteristics LMx39: VIO, LM339 column, 25 °C"'
  input_bias_current:
    typ: 25 nA
    max: 250 nA
    at: { VOUT: 1.4 V, TA: 25 °C }
    src: 'p10 "6.10 Electrical Characteristics LMx39: IIB, LM339 column (printed -25/-250 nA)"'
  rail_to_rail_input:
    value: no
    src: 'p10 "6.10 Electrical Characteristics LMx39: VICR 0 to VCC - 1.5 V, 25 °C"'
  propagation_delay:
    typ: 1.3 µs
    at: { VCC: 5 V, VOD: 5 mV, CL: 15 pF, TA: 25 °C }
    src: 'p12 "6.14 Switching Characteristics LMx39: response time, 100mV step with 5mV overdrive"'
  output_structure: { value: open_collector, src: 'p19 "7.1 Overview: open-collector outputs"' }

pins:
  src:
    - p4 "Table 5-1 "Pin Functions", column "D, DB, N, NS, PW, DYY, J""
    - p4 "Figure 5-1 "D, DB, N, NS, PW Packages 14-Pin SOIC, SSOP, PDIP, SOP, TSSOP Top View" (all 14 pins matched)"
  "1":  { name: OUT1, type: output }
  "2":  { name: OUT2, type: output }
  "3":  { name: VCC, type: power }
  "4":  { name: IN2-, type: input }
  "5":  { name: IN2+, type: input }
  "6":  { name: IN1-, type: input }
  "7":  { name: IN1+, type: input }
  "8":  { name: IN3-, type: input }
  "9":  { name: IN3+, type: input }
  "10": { name: IN4-, type: input }
  "11": { name: IN4+, type: input }
  "12": { name: GND, type: ground }
  "13": { name: OUT4, type: output }
  "14": { name: OUT3, type: output }
