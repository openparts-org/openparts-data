# Single 1-MHz RRIO op amp, DBV (SOT-23-5) pinout. From SBOS833R Table
# 6-1 "Pin Functions: TLV9001" (page 7), column "SOT-23, SC70(T)",
# checked against Figure 6-1 "TLV9001 DBV, TLV9001T DCK Package"
# (same page): OUT 1, V- 2, IN+ 3, IN- 4, V+ 5 (pin 5 opposite pin 1,
# pin 4 opposite pin 3). The TLV9001 DCK/DRL and TLV9001U DBV pinout
# (IN+ 1, OUT 4) differs and is not covered. Minus signs written as
# ASCII "-". Signal pins typed analog, V+/V- power (V- is "Negative
# (low) supply or ground"), as for ti/OPA2333.
schema_version: "0.2"
kind: device
id: ti/TLV9001-DBV
manufacturer: ti
category: op_amp
family: TLV900x
source: ti/SBOS833R

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage: { min: 1.8 V, max: 5.5 V, src: 'p14 "7.3 Recommended Operating Conditions, VS"' }
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p14 "7.3 Recommended Operating Conditions, Specified temperature"
  esd_hbm: { typ: 2 kV, src: 'p14 "7.2 ESD Ratings, all other packages (not TLV9002S): HBM"' }
  channel_count:
    value: "1"
    src: 'p1 "3 Description: single (TLV9001), dual (TLV9002), and quad-channel (TLV9004)"'
  gain_bandwidth:
    typ: 1 MHz
    at: { VS: 5 V, RL: 10 kΩ, TA: 25 °C }
    src: 'p17 "7.10 Electrical Characteristics: GBW"'
  slew_rate:
    typ: 2 V/µs
    at: { VS: 5 V, RL: 10 kΩ, TA: 25 °C }
    src: 'p17 "7.10 Electrical Characteristics: SR"'
  input_offset_voltage:
    typ: 0.4 mV
    max: 1.6 mV
    at: { VS: 5 V, TA: 25 °C }
    src: 'p17 "7.10 Electrical Characteristics: VOS, VS = 5 V (printed ±0.4/±1.6 mV)"'
  input_bias_current:
    typ: 5 pA
    at: { VS: 5 V, TA: 25 °C }
    src: 'p17 "7.10 Electrical Characteristics: IB, VS = 5 V (printed ±5 pA)"'
  supply_current_per_channel:
    typ: 60 µA
    max: 77 µA
    at: { VS: 5.5 V, IOUT: 0 A, TA: 25 °C }
    src: 'p18 "7.10 Electrical Characteristics: IQ quiescent current per amplifier, TLV9001, TLV9001S row"'
  rail_to_rail_input:  { value: yes, src: 'p1 "Features: Rail-to-rail input and output"' }
  rail_to_rail_output: { value: yes, src: 'p1 "Features: Rail-to-rail input and output"' }

pins:
  src:
    - 'p7 "Table 6-1 "Pin Functions: TLV9001", column "SOT-23, SC70(T)""'
    - p7 "Figure 6-1 "TLV9001 DBV, TLV9001T DCK Package 5-Pin SOT-23, SC70 Top View" (all 5 pins matched)"
  "1": { name: OUT, type: analog }
  "2": { name: V-, type: power }
  "3": { name: IN+, type: analog }
  "4": { name: IN-, type: analog }
  "5": { name: V+, type: power }
