# Dual 1-MHz RRIO op amp, 8-pin pinout shared by the D (SOIC), DGK
# (VSSOP), PW (TSSOP) and DDF (SOT-23-8) packages. From SBOS833R Table
# 6-3 "Pin Functions: TLV9002" (page 8), checked against Figure 6-6
# "TLV9002 D, DGK, PW, DDF Package" (same page). The DSG (WSON) thermal
# pad is not covered. Minus signs written as ASCII "-".
schema_version: "0.2"
kind: device
id: ti/TLV9002
manufacturer: ti
category: op_amp
family: TLV900x
source: ti/SBOS833R

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage: { min: 1.8 V, max: 5.5 V, src: 'p14 "7.3 Recommended Operating Conditions, VS"' }
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p14 "7.3 Recommended Operating Conditions, Specified temperature"
  esd_hbm: { typ: 2 kV, src: 'p14 "7.2 ESD Ratings, all other packages (not TLV9002S): HBM"' }
  channel_count:
    value: "2"
    src: 'p1 "3 Description: single (TLV9001), dual (TLV9002), and quad-channel (TLV9004)"'
  gain_bandwidth:
    typ: 1 MHz
    at: { VS: 5 V, RL: 10 kΩ, TA: 25 °C }
    src: 'p17 "7.10 Electrical Characteristics: GBW"'
  slew_rate:
    typ: 2 V/µs
    at: { VS: 5 V, RL: 10 kΩ, TA: 25 °C }
    src: 'p17 "7.10 Electrical Characteristics: SR"'
  input_offset_voltage:
    typ: 0.4 mV
    max: 1.6 mV
    at: { VS: 5 V, TA: 25 °C }
    src: 'p17 "7.10 Electrical Characteristics: VOS, VS = 5 V (printed ±0.4/±1.6 mV)"'
  input_bias_current:
    typ: 5 pA
    at: { VS: 5 V, TA: 25 °C }
    src: 'p17 "7.10 Electrical Characteristics: IB, VS = 5 V (printed ±5 pA)"'
  supply_current_per_channel:
    typ: 60 µA
    max: 75 µA
    at: { VS: 5.5 V, IOUT: 0 A, TA: 25 °C }
    src: 'p18 "7.10 Electrical Characteristics: IQ quiescent current per amplifier, TLV9002, TLV9002S, TLV9004 row"'
  rail_to_rail_input:  { value: yes, src: 'p1 "Features: Rail-to-rail input and output"' }
  rail_to_rail_output: { value: yes, src: 'p1 "Features: Rail-to-rail input and output"' }

pins:
  src:
    - 'p8 "Table 6-3 "Pin Functions: TLV9002""'
    - p8 "Figure 6-6 "TLV9002 D, DGK, PW, DDF Package 8-Pin SOIC, VSSOP, TSSOP, SOT-23 Top View" (all 8 pins matched)"
  "1": { name: OUT1, type: analog }
  "2": { name: IN1-, type: analog }
  "3": { name: IN1+, type: analog }
  "4": { name: V-, type: power }
  "5": { name: IN2+, type: analog }
  "6": { name: IN2-, type: analog }
  "7": { name: OUT2, type: analog }
  "8": { name: V+, type: power }
