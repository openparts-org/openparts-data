  "2": { name: "IN1-", type: analog }
  "3": { name: "IN1+", type: analog }
  "4": { name: "V-", type: power }
  "5": { name: "IN2+", type: analog }
  "6": { name: "IN2-", type: analog }
  "7": { name: OUT2, type: analog }
  "8": { name: "V+", type: power }

provenance:
  "/pins":
    - source: ti/SBOS833R
      page: 8
      locator: "Table 6-3 \"Pin Functions: TLV9002\""
    - source: ti/SBOS833R
      page: 8
