# Single inverter gate, 5-pin pinout of the DBV (SOT-23-5), DCK and DRL
# packages. From SCES214AF "Pin Functions" table (page 3), column
# "DBV, DCK, DRL": NC 1, A 2, GND 3, Y 4, VCC 5, checked against the
# "DBV PACKAGE (TOP VIEW)" figure (same page). The DSF/DRY/YZP/YZV/DPW
# pin maps differ and are not covered.
schema_version: "0.2"
kind: device
id: ti/SN74LVC1G04-DBV
manufacturer: ti
category: logic
family: SN74LVC1G04
source: ti/SCES214AF

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.65 V
    max: 5.5 V
    src: p5 "5.3 Recommended Operating Conditions, VCC, Operating"
  supply_current:
    max: 10 µA
    at: { VCC: 1.65..5.5 V }
    src: 'p6 "5.5 Electrical Characteristics: ICC, VI = 5.5V or GND, IO = 0, -40 to 85 °C"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "5.3 Recommended Operating Conditions, TA"
  esd_hbm:        { typ: 2 kV, src: 'p4 "5.2 ESD Ratings, HBM, all pins"' }
  channel_count:  { value: "1", src: 'p1 "Title: Single Inverter Gate"' }
  propagation_delay:
    min: 0.7 ns
    max: 3.3 ns
    at: { VCC: 3.3 V, CL: 15 pF, TA: -40..85 °C }
    src: 'p6 "5.6 Switching Characteristics CL = 15pF: tpd, VCC = 3.3V ± 0.3V"'
  logic_function: { value: inverter, src: 'p1 "Title: Single Inverter Gate"' }
  output_current_high:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p5 "5.3 Recommended Operating Conditions, IOH, VCC = 4.5 V (printed -32 mA)"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p5 "5.3 Recommended Operating Conditions, IOH, VCC = 3 V (printed -24 mA)"
  output_current_low:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p5 "5.3 Recommended Operating Conditions, IOL, VCC = 4.5 V"
    - max: 24 mA
      at: { VCC: 3 V }
      src: p5 "5.3 Recommended Operating Conditions, IOL, VCC = 3 V"

pins:
  src: ['p3 ""Pin Functions" table, column "DBV, DCK, DRL""', p3 ""DBV PACKAGE (TOP VIEW)" figure"]
  "1": { name: NC, type: nc }
  "2": { name: A, type: input }
  "3": { name: GND, type: ground }
  "4": { name: Y, type: output }
  "5": { name: VCC, type: power }
