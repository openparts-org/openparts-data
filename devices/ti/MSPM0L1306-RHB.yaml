# MSPM0L1306 (Cortex-M0+, 64KB flash / 4KB SRAM), 32-pin RHB (VQFN)
# pin map. Read from Figure 6-2 "32-Pin RHB (VQFN) (Top View) -
# MSPM0L130x" (SLASEX0D page 6, rendered) and cross-checked against
# Table 6-1 "Pin Attributes" (pages 7-9, column "32 VQFN"): all 32
# pins match. Names are the Figure 6-2 labels; the digital mux
# (PINCMx) functions are not modelled. Other packages of this device
# (VSSOP28/20, VQFN24, WQFN16, SOT16) number pins differently and are
# not covered by this pin map.
#
# EP: Table 6-3 "Signal Descriptions" (page 12), row "QFN Pad": "QFN
# package exposed thermal pad. TI recommends connection to VSS." --
# recommended, not stated as internally connected, so typed passive.
schema_version: "0.2"
kind: device
id: ti/MSPM0L1306-RHB
manufacturer: ti
category: microcontroller
family: MSPM0L130x
source: ti/SLASEX0D

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.62 V
    max: 3.6 V
    src: p16 "7.3 Recommended Operating Conditions, VDD Supply voltage"
  esd_hbm: { typ: 2 kV, src: 'p16 "7.2 ESD Ratings, HBM ±2000 V"' }

pins:
  src:
    - p6 "Figure 6-2 "32-Pin RHB (VQFN) (Top View) - MSPM0L130x""
    - p7 "Table 6-1 "Pin Attributes" (pages 7-9), column "32 VQFN" (cross-check, all 32 pins matched)"
  "1":  { name: PA0, type: io }
  "2":  { name: PA1, type: io }
  "3":  { name: NRST, type: reset }
  "4":  { name: VDD, type: power }
  "5":  { name: VSS, type: ground }
  "6":  { name: PA2/ROSC, type: io }
  "7":  { name: PA3, type: io }
  "8":  { name: PA4, type: io }
  "9":  { name: PA5, type: io }
  "10": { name: PA6, type: io }
  "11": { name: PA7, type: io }
  "12": { name: PA8, type: io }
  "13": { name: PA9, type: io }
  "14": { name: PA10, type: io }
  "15": { name: PA11, type: io }
  "16": { name: PA12, type: io }
  "17": { name: PA13, type: io }
  "18": { name: PA14, type: io }
  "19": { name: PA15/A9, type: io }
  "20": { name: PA16/A8, type: io }
  "21": { name: PA17, type: io }
  "22": { name: PA18/A7, type: io }
  "23": { name: PA19/SWDIO, type: io }
  "24": { name: PA20/SWCLK/A6, type: io }
  "25": { name: PA21/A5/VREF-, type: io }
  "26": { name: PA22/A4, type: io }
  "27": { name: PA23/VREF+, type: io }
  "28": { name: PA24/A3, type: io }
  "29": { name: PA25/A2, type: io }
  "30": { name: PA26/A1, type: io }
  "31": { name: PA27/A0, type: io }
  "32": { name: VCORE, type: power }
  EP:
    name: QFN Pad
    type: passive
    src: 'p12 "Table 6-3 "Signal Descriptions", row "QFN Pad": "TI recommends connection to VSS""'
