# Octal bus transceiver with 3-state outputs and TTL-compatible inputs
# SN74HCT245, 20-pin pin map from the "Pin Functions" table (SCLS020H
# page 3), checked against the "J, W, DB, DW, N, NS, PW or DGS Packages"
# top view on the same page. OE is active low; DIR high = A to B.
schema_version: "0.2"
kind: device
id: ti/SN74HCT245
manufacturer: ti
category: logic
family: SNx4HCT245
source: ti/SCLS020H

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage: { min: 4.5 V, max: 5.5 V, src: 'p4 "6.3 Recommended Operating Conditions, VCC"' }
  supply_current:
    max: 8 µA
    at: { VCC: 5.5 V, TA: 25 °C }
    src: 'p5 "6.5 Electrical Characteristics: ICC, VI = VCC or 0, 5.5 V, TA = 25°C"'
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p4 "6.3 Recommended Operating Conditions, TA, SN74HCT245 row"
  esd_hbm:       { typ: 1.5 kV, src: 'p4 "6.2 ESD Ratings, HBM"' }
  channel_count: { value: "8", src: 'p1 "Title, Octal Bus Transceivers"' }
  propagation_delay:
    - typ: 16 ns
      max: 22 ns
      at: { VCC: 4.5 V, CL: 50 pF, TA: 25 °C }
      src: 'p6 "6.6 Switching Characteristics CL = 50 pF: tpd A or B to B or A, 4.5 V, TA = 25°C"'
    - typ: 14 ns
      max: 20 ns
      at: { VCC: 5.5 V, CL: 50 pF, TA: 25 °C }
      src: 'p6 "6.6 Switching Characteristics CL = 50 pF: tpd A or B to B or A, 5.5 V, TA = 25°C"'
  logic_function:
    value: bus_transceiver
    src: p1 "Title, Octal Bus Transceivers With 3-State Outputs"

pins:
  src:
    - p3 ""Pin Functions" table (NO. / NAME / TYPE)"
    - p3 "J, W, DB, DW, N, NS, PW or DGS Packages Top View (cross-check)"
  "1":  { name: DIR, type: input }
  "2":  { name: A1, type: io }
  "3":  { name: A2, type: io }
  "4":  { name: A3, type: io }
  "5":  { name: A4, type: io }
  "6":  { name: A5, type: io }
  "7":  { name: A6, type: io }
  "8":  { name: A7, type: io }
  "9":  { name: A8, type: io }
  "10": { name: GND, type: ground }
  "11": { name: B8, type: io }
  "12": { name: B7, type: io }
  "13": { name: B6, type: io }
  "14": { name: B5, type: io }
  "15": { name: B4, type: io }
  "16": { name: B3, type: io }
  "17": { name: B2, type: io }
  "18": { name: B1, type: io }
  "19": { name: OE, type: input }
  "20": { name: VCC, type: power }
