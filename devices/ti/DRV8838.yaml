# DRV8838 low-voltage H-bridge driver (PH/EN interface), DSG (8-pin
# WSON) pin map. Pin Functions table (SLVSBA4F page 4), column
# "DRV8838"; cross-checked with Figure 5-2 "DSG Package 8-Pin WSON With
# Thermal Pad DRV8838 Top View" (page 4). The thermal pad has no row in
# the pin table -> no EP pin.
schema_version: "0.2"
kind: device
id: ti/DRV8838
manufacturer: ti
category: motor_driver
family: DRV883x
source: ti/SLVSBA4F

pins:
  src:
    - p4 "Pin Functions, column "DRV8838 NO.""
    - p4 "Figure 5-2 DSG Package DRV8838 Top View (cross-check)"
  "1": { name: VM, type: power }
  "2": { name: OUT1, type: output }
  "3": { name: OUT2, type: output }
  "4": { name: GND, type: ground }
  "5": { name: EN, type: input }
  "6": { name: PH, type: input }
  "7": { name: nSLEEP, type: input }
  "8": { name: VCC, type: power }
