# 4-bit bidirectional voltage-level translator, 14-pin pinout of the D
# (SOIC), PW (TSSOP) and DYY packages. From SCES650K Table 4-1 "Pin
# Functions" (page 4), column "D, PW", checked against Figure 4-4
# "D/PW/DYY Package, 14-Pin SOIC/TSSOP/SOT (Top View)" (page 3). NC is
# "No connection. Not internally connected."
schema_version: "0.2"
kind: device
id: ti/TXB0104-PW
manufacturer: ti
category: level_shifter
family: TXB0104
source: ti/SCES650K

# Parameters (AI candidates, needs review).
parameters:
  supply_current:
    max: 10 µA
    at: { TA: -40..85 °C }
    src: p8 "5.6 Electrical Characteristics (Other Packages), ICCA + ICCB, VCCA 1.4 V to 3.6 V"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p6 "5.3 Recommended Operating Conditions, TA"
  esd_hbm: { typ: 2.5 kV, src: 'p5 "5.2 ESD Ratings, HBM, A port (B port ±15 kV)"' }
  channel_count: { value: "4", src: 'p1 "Title: 4-Bit Bidirectional Voltage-Level Translator"' }
  data_rate:
    max: 100 Mbps
    src: p9 "5.10/5.11 Timing Requirements, Data rate, VCCA = 2.5 V and 3.3 V"

pins:
  src:
    - p4 "Table 4-1 "Pin Functions", column "D, PW""
    - p3 "Figure 4-4 "D/PW/DYY Package, 14-Pin SOIC/TSSOP/SOT (Top View)" (all 14 pins matched)"
  "1":  { name: VCCA, type: power }
  "2":  { name: A1, type: io }
  "3":  { name: A2, type: io }
  "4":  { name: A3, type: io }
  "5":  { name: A4, type: io }
  "6":  { name: NC, type: nc }
  "7":  { name: GND, type: ground }
  "8":  { name: OE, type: input }
  "9":  { name: NC, type: nc }
  "10": { name: B4, type: io }
  "11": { name: B3, type: io }
  "12": { name: B2, type: io }
  "13": { name: B1, type: io }
  "14": { name: VCCB, type: power }
