# uA7805 1.5-A fixed 5-V regulator, KTT (TO-263) pinout. SLVS056P "Pin
# Functions" (page 3): COMMON 2, INPUT 1, OUTPUT 3; "KTT (TO-263)
# PACKAGE (TOP VIEW)" labels the tab COMMON without a number. SLVS056P
# has no KTT outline; the tab is keyed "4", the number the KTT0003B
# outline (SLVS044Z page 42) prints on it.
schema_version: "0.2"
kind: device
id: ti/UA7805-KTT
manufacturer: ti
category: linear_regulator
family: UA7805
source: ti/SLVS056P

parameters:
  output_type:       { value: fixed, src: p1 "Title" }
  output_voltage:
    - min: 4.8 V
      typ: 5 V
      max: 5.2 V
      at: { VIN: 7..20 V, IOUT: 5..1000 mA, TJ: 25 °C }
      src: p5 "7.5 Elec. Char. uA7805, Output voltage, PD <= 15 W"
    - min: 4.75 V
      max: 5.25 V
      at: { VIN: 7..20 V, IOUT: 5..1000 mA, TJ: 0..125 °C }
      src: p5 "7.5 Elec. Char. uA7805, Output voltage, PD <= 15 W"
  input_voltage_max: { max: 25 V, src: 'p4 "7.3 Recommended Operating Conditions, VI, uA7805"' }
  output_current:    { max: 1.5 A, src: 'p4 "7.3 Recommended Operating Conditions, IO"' }
  dropout_voltage:
    typ: 2 V
    at: { IOUT: 1 A, TJ: 25 °C }
    src: p5 "7.5 Elec. Char. uA7805, Dropout voltage"

pins:
  src:
    - 'p3 ""Pin Functions" table: COMMON 2, INPUT 1, OUTPUT 3"'
    - 'p3 ""KTT (TO-263) PACKAGE (TOP VIEW)": tab labelled COMMON"'
    - 'ti/SLVS044Z p42 "KTT0003B outline, bottom view: tab labelled "4""'
  "1": { name: INPUT, type: power }
  "2": { name: COMMON, type: ground }
  "3": { name: OUTPUT, type: power }
  "4": { name: COMMON, type: ground }
