# uA7805 1.5-A fixed 5-V regulator, KTT (TO-263) pinout. SLVS056P "Pin
# Functions" (page 3): COMMON 2, INPUT 1, OUTPUT 3; "KTT (TO-263)
# PACKAGE (TOP VIEW)" labels the tab COMMON without a number. SLVS056P
# has no KTT outline; the tab is keyed "4", the number the KTT0003B
# outline (SLVS044Z page 42) prints on it.
schema_version: "0.2"
kind: device
id: ti/UA7805-KTT
manufacturer: ti
category: linear_regulator
family: UA7805
source: ti/SLVS056P

parameters:
  output_type: { value: fixed, src: p1 "Title "µA78xx Fixed Positive Voltage Regulators"" }
  output_voltage:
    typ: 5 V
    src: 'p5 "7.5 Electrical Characteristics - uA7805, Output voltage, IO = 5 mA to 1 A, VI = 7 V to 20 V, 25°C: TYP 5 V"'
  input_voltage_max:
    max: 25 V
    src: 'p4 "7.3 Recommended Operating Conditions, VI Input voltage, µA7805: MAX 25 V"'
  output_current:
    max: 1.5 A
    src: 'p4 "7.3 Recommended Operating Conditions, IO Output current: MAX 1.5 A"'
  dropout_voltage:
    typ: 2 V
    at: { IOUT: 1 A }
    src: 'p5 "7.5 Electrical Characteristics - uA7805, Dropout voltage, 25°C: TYP 2 V"'

pins:
  src:
    - 'p3 ""Pin Functions" table: COMMON 2, INPUT 1, OUTPUT 3"'
    - 'p3 ""KTT (TO-263) PACKAGE (TOP VIEW)": tab labelled COMMON"'
    - 'ti/SLVS044Z p42 "KTT0003B outline, bottom view: tab labelled "4""'
  "1": { name: INPUT, type: power }
  "2": { name: COMMON, type: ground }
  "3": { name: OUTPUT, type: power }
  "4": { name: COMMON, type: ground }
