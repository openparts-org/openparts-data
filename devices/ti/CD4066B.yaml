# CD4066B quad bilateral switch, 14-pin pin map of the E, D, NS and PW
# packages from SCHS051J Table 4-1 "Pin Functions" (page 3). Names
# condensed ("SIG A IN/OUT" -> SIG_A_IN/OUT). Switch I/O -> analog,
# CONTROL x -> input, VDD power, VSS ("Low Voltage Power Pin") ground.
schema_version: "0.2"
kind: device
id: ti/CD4066B
manufacturer: ti
category: analog_switch
family: CD4066B
source: ti/SCHS051J

parameters:
  supply_voltage: { min: 3 V, max: 18 V, src: 'p4 "5.3 Recommended Operating Conditions, VDD"' }
  supply_current:
    typ: 4 µA
    max: 6 µA
    at: { VDD: 5 V, TA: 25 °C }
    src: p7 "5.5 Elec. Char. (continued), Quiescent Device Current IDD, VDD = 5V, 25°C"
  operating_temperature:
    min: -55 °C
    max: 125 °C
    src: p4 "5.3 Recommended Operating Conditions, TA"
  esd_hbm:       { typ: 500 V, src: 'p4 "5.2 ESD Ratings, HBM, all pins"' }
  channel_count: { value: "4", src: 'p3 "Table 4-1 Pin Functions: switches A-D"' }

pins:
  src:  p3 "Table 4-1 Pin Functions"
  "1":  { name: SIG_A_IN/OUT, type: analog }
  "2":  { name: SIG_A_OUT/IN, type: analog }
  "3":  { name: SIG_B_OUT/IN, type: analog }
  "4":  { name: SIG_B_IN/OUT, type: analog }
  "5":  { name: CONTROL_B, type: input }
  "6":  { name: CONTROL_C, type: input }
  "7":  { name: VSS, type: ground }
  "8":  { name: SIG_C_IN/OUT, type: analog }
  "9":  { name: SIG_C_OUT/IN, type: analog }
  "10": { name: SIG_D_OUT/IN, type: analog }
  "11": { name: SIG_D_IN/OUT, type: analog }
  "12": { name: CONTROL_D, type: input }
  "13": { name: CONTROL_A, type: input }
  "14": { name: VDD, type: power }
