# Dual D-type positive-edge-triggered flip-flop with clear and preset
# SN74HC74, 14-pin pin map (D, DB, N, NS, PW, J, W) from the "Pin
# Functions" table (SCLS094F page 3) checked against the "D, DB, N, NS,
# PW, J, or W Package" top-view figure (same page); all 14 pins match.
# Overbarred names (CLR, PRE: "Active Low"; pins 6 and 8 the "Inverted
# Output") get an _N suffix, as QH_N in ti/SN74HC165. The FK (LCCC)
# numbering differs and is not covered.
schema_version: "0.2"
kind: device
id: ti/SN74HC74
manufacturer: ti
category: logic
family: SNx4HC74
source: ti/SCLS094F

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage: { min: 2 V, max: 6 V, src: 'p4 "6.3 Recommended Operating Conditions, VCC"' }
  supply_current:
    max: 4 µA
    at: { VCC: 6 V, TA: 25 °C }
    src: 'p5 "6.5 Electrical Characteristics - 74: ICC, 6 V, 25 °C"'
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p4 "6.3 Recommended Operating Conditions, TA, row labelled SN74HC00 (sic)"
  esd_hbm:          { typ: 2 kV, src: 'p4 "6.2 ESD Ratings, HBM"' }
  channel_count: { value: "2", src: 'p1 "3 Description: two independent D-type flip-flops"' }
  propagation_delay:
    - typ: 20 ns
      max: 35 ns
      at: { VCC: 4.5 V, TA: 25 °C }
      src: 'p7 "6.9 Switching Characteristics - 74: tpd CLK to Q, 4.5 V"'
    - typ: 70 ns
      max: 175 ns
      at: { VCC: 2 V, TA: 25 °C }
      src: 'p7 "6.9 Switching Characteristics - 74: tpd CLK to Q, 2 V"'
    - typ: 15 ns
      max: 30 ns
      at: { VCC: 6 V, TA: 25 °C }
      src: 'p7 "6.9 Switching Characteristics - 74: tpd CLK to Q, 6 V"'
  output_structure: { value: push_pull, src: p10 "8.3.1 Balanced CMOS Push-Pull Outputs" }
  logic_function:
    value: flip_flop
    src: p1 "Title, Dual D-Type Positive-Edge-Triggered Flip-Flops"

pins:
  src:
    - p3 ""Pin Functions" table, column "D, DB, N, NS, PW, J, or W""
    - p3 ""D, DB, N, NS, PW, J, or W Package ... Top View" figure (cross-check)"
  "1":  { name: 1CLR_N, type: reset }
  "2":  { name: 1D, type: input }
  "3":  { name: 1CLK, type: clock }
  "4":  { name: 1PRE_N, type: input }
  "5":  { name: 1Q, type: output }
  "6":  { name: 1Q_N, type: output }
  "7":  { name: GND, type: ground }
  "8":  { name: 2Q_N, type: output }
  "9":  { name: 2Q, type: output }
  "10": { name: 2PRE_N, type: input }
  "11": { name: 2CLK, type: clock }
  "12": { name: 2D, type: input }
  "13": { name: 2CLR_N, type: reset }
  "14": { name: VCC, type: power }
