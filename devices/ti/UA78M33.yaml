# uA78M 500-mA fixed regulator, 3.3-V option (UA78M33C / UA78M33I).
# Pins from SLVS059V Table 4-1 "Pin Functions" (page 3): COMMON 2
# ("Ground"), INPUT 1, OUTPUT 3 -- one table for both DCY (SOT-223) and
# KVU (TO-252). Figures 4-1/4-2 (page 3) label the tab "COMMON" without
# a number; the outline drawings DCY0004A (page 32) and KVU0003A (page
# 38) label the tab "4". Pin "4" = COMMON is therefore the tab, keyed by
# the drawings' number (flagged for review in the package files).
schema_version: "0.2"
kind: device
id: ti/UA78M33
manufacturer: ti
category: linear_regulator
family: UA78M
source: ti/SLVS059V

parameters:
  output_type:     { value: fixed, src: p1 "3 Description" }
  output_voltage:
    - { min: 3.2 V, typ: 3.3 V, max: 3.4 V, src: 'p5 "5.5 Elec. Char. UA78M33, Output voltage"' }
    - min: 3.1 V
      typ: 3.3 V
      max: 3.5 V
      at: { VIN: 8..20 V, IOUT: 5..350 mA }
      src: p5 "5.5 Elec. Char. UA78M33, Output voltage, TJ full range"
  output_current:  { max: 500 mA, src: 'p4 "5.3 Recommended Operating Conditions, IO"' }
  dropout_voltage: { typ: 2 V, src: 'p5 "5.5 Elec. Char. UA78M33, Dropout voltage"' }

pins:
  src:
    - p3 "Table 4-1 "Pin Functions" (COMMON 2, INPUT 1, OUTPUT 3)"
    - 'p3 "Figure 4-1 "DCY Package, 3-Pin SOT-223" / Figure 4-2 "KVU Package, 3-Pin TO-252" (Top View): tab labelled "COMMON""'
    - 'p38 "KVU0003A outline, bottom view: tab labelled "4" (also DCY0004A, page 32)"'
  "1": { name: INPUT, type: power }
  "2": { name: COMMON, type: ground }
  "3": { name: OUTPUT, type: power }
  "4": { name: COMMON, type: ground }
