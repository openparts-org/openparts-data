# MSPM0G1507 (Cortex-M0+, 128 KB flash / 32 KB SRAM) in the 28-pin DGS28
# (VSSOP) package. Pin map read from Figure 6-6 "28-Pin DGS28 (VSSOP) (Top
# View)" (SLASEW9E page 10, rendered) and cross-checked pin for pin
# against Table 6-2 "Pin Attributes" (pages 13-17, column "28 VSSOP"): all
# 28 pins match. Other packages number pins differently and are not
# covered. No exposed pad (DGS0028A has none).
#
# Names are the port/supply names of the figure labels; the other figure
# labels (clock, SWD, ADC channel Ax_y, VREF, RTC_OUT, FCC_IN) are
# recorded as alternate_functions exactly as that figure prints them (the
# same pin carries different label subsets in different package figures).
# The digital mux (PINCMx) functions and the analog comparator/OPA inputs
# of Table 6-2 are not modelled. Types: VDD and VCORE (regulated core
# supply output, Table 6-3) power, VSS ground, NRST reset, port pins io
# (PA0/PA1 are 5V-tolerant open-drain per Table 6-2, still typed io). The
# MSPM0G1506/1505 share these pin maps but are separate devices, not
# covered. Figure 6-6 labels PA24 without "A0_3" and PA22 with an extra
# "CLK_OUT" compared with Figure 6-5; recorded as printed.
