# TPD4E1U06 quad-channel unidirectional TVS ESD protection device. Pin
# map from Table 4-1 "Pin Functions" (SLVSBQ9E page 3), checked against
# Figure 4-2 "DBV Package 6-Pin SOT-23 Top View" (same page; the DCK
# SC70 figure shows the same numbers, but only DBV is used here).
# Channel pins are type "I/O" in the table; typed passive (TVS diode
# terminals, as diodes/D5V0L1B2LP). NC: "No connect".
schema_version: "0.2"
kind: device
id: ti/TPD4E1U06
manufacturer: ti
category: diode
family: TPD4E1U06
source: ti/SLVSBQ9E

parameters: { reverse_voltage: { max: 5.5 V, src: 'p5 "5.6 Electrical Characteristics, VRWM"' } }

pins:
  src:
    - p3 "Table 4-1. Pin Functions"
    - p3 "Figure 4-2 DBV Package 6-Pin SOT-23 Top View (cross-check)"
  "1": { name: D1+, type: passive }
  "2": { name: GND, type: ground }
  "3": { name: D2+, type: passive }
  "4": { name: D2-, type: passive }
  "5": { name: NC, type: nc }
  "6": { name: D1-, type: passive }
