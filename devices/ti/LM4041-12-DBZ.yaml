# Precision micropower shunt voltage reference, fixed 1.2-V LM4041
# (LM4041x12I / LM4041x12Q, all grades), DBZ (SOT-23-3) pinout. From
# SLCS146H "Pin Functions" table (page 3), column "SOT-23": Cathode 1,
# Anode 2, NC* 3, checked against Figure 4-1 "DBZ Package 3-Pin SOT-23
# Top View" (same page; "+" on pin 1, "-" on pin 2, "3*"). The DCK and
# TO-92 pin maps differ and are not covered; the adjustable LM4041 has
# its own pinout (ti/LM4041-ADJ-DBZ).
# Pin 3 "NC*" ("Must float or connect to anode") typed passive as for
# ti/LM4040-DBZ; Anode typed ground ("normally grounded"), Cathode
# passive.
schema_version: "0.2"
kind: device
id: ti/LM4041-12-DBZ
manufacturer: ti
category: voltage_reference
family: LM4041
source: ti/SLCS146H

parameters:
  output_current:
    max: 12 mA
    src: p6 "5.3 Recommended Operating Conditions, IZ Cathode current"

pins:
  src:
    - p3 "Pin Functions table, column "SOT-23""
    - p3 "Figure 4-1 "DBZ Package 3-Pin SOT-23 Top View""
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: ground }
  "3": { name: NC*, type: passive }
