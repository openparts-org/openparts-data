  "2": { name: GND, type: ground }
  "3": { name: "IN+", type: analog }
  "4": { name: "IN-", type: analog }
  "5": { name: VS, type: power }

provenance:
  "/pins":
    - source: ti/SBOS741H
      page: 4
      locator: "Table 6-1 \"Pin Functions: INA180 (Single Channel)\", column \"SOT-23 Pinout A\""
    - source: ti/SBOS741H
      page: 4
      locator: "Figure 6-1 \"INA180: DBV Package 5-Pin SOT-23 (Pinout A) Top View\""
