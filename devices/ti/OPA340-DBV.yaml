# Single rail-to-rail op amp, SOT-23-5 pin map from the "Pin Functions:
# OPA340" table (SBOS073C page 3), SOT-23 column: OUT 1, V- 2, +IN 3,
# -IN 4, V+ 5. The SOIC/PDIP map differs and is not covered. Minus signs
# written as ASCII "-".
schema_version: "0.2"
kind: device
id: ti/OPA340-DBV
manufacturer: ti
category: op_amp
family: OPAx340
source: ti/SBOS073C

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: p5 "6.3 Recommended Operating Conditions, Supply voltage"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p7 "6.7 Electrical Characteristics: Temperature range, Specified range (-40 to 85 C)"'
  esd_hbm:            { typ: 600 V, src: 'p5 "6.2 ESD Ratings, HBM"' }
  channel_count:
    value: "1"
    src: 'p1 "3 Description: The single (OPA340) packages are the 5-pin SOT-23..."'
  gain_bandwidth:
    typ: 5.5 MHz
    at: { VS: 5 V, RL: 10 kΩ, TA: 25 °C }
    src: 'p7 "6.7 Electrical Characteristics: GBW, G = 1"'
  slew_rate:
    typ: 6 V/µs
    at: { VS: 5 V, CL: 100 pF, RL: 10 kΩ, TA: 25 °C }
    src: 'p7 "6.7 Electrical Characteristics: SR, G = 1"'
  input_offset_voltage:
    typ: 150 µV
    max: 500 µV
    at: { VS: 5 V, TA: 25 °C }
    src: 'p6 "6.7 Electrical Characteristics: VOS, VS = 5 V (printed ±150/±500 µV)"'
  input_bias_current:
    typ: 0.2 pA
    max: 10 pA
    at: { VS: 5 V, TA: 25 °C }
    src: 'p6 "6.7 Electrical Characteristics: input bias current (printed ±0.2/±10 pA)"'
  supply_current_per_channel:
    typ: 750 µA
    max: 950 µA
    at: { VS: 5 V, IOUT: 0 A, TA: 25 °C }
    src: 'p7 "6.7 Electrical Characteristics: IQ quiescent current (per amplifier), IO = 0, VS = 5 V"'
  rail_to_rail_input: { value: yes, src: 'p1 "Features: Rail-to-Rail Input"' }
  rail_to_rail_output: { value: yes, src: 'p1 "Features: Rail-to-Rail Output (Within 1 mV)"' }

pins:
  src: 'p3 "Pin Functions: OPA340, column SOT-23"'
  "1": { name: OUT, type: analog }
  "2": { name: V-, type: power }
  "3": { name: +IN, type: analog }
  "4": { name: -IN, type: analog }
  "5": { name: V+, type: power }
