# LM2940 1-A LDO (LM2940-N, all fixed voltages), KTT (TO-263) pinout.
# SNVS769J "Pin Functions" (page 3), KTT column: IN 1, GND 2, OUT 3, GND
# 4; outline KTT0003B (page 42) labels the tab "4".
schema_version: "0.2"
kind: device
id: ti/LM2940-KTT
manufacturer: ti
category: linear_regulator
family: LM2940
source: ti/SNVS769J

parameters:
  input_voltage_max:
    max: 26 V
    src: 'p4 "6.3 Recommended Operating Conditions, Input voltage: MAX 26 V"'
  output_current:
    typ: 1 A
    src: 'p1 "3 Description: "positive voltage regulators feature the ability to source 1 A of output current""'
  dropout_voltage:
    typ: 0.5 V
    max: 1 V
    at: { IOUT: 1 A }
    src: 'p5 "6.5 Electrical Characteristics, Dropout voltage: TYP 0.5 V, MAX 1 V (same in tables 6.5-6.7 for all output voltages)"'

pins:
  src:
    - 'p3 ""Pin Functions", KTT column: IN 1, GND 2, OUT 3, GND 4"'
    - 'p42 "KTT0003B outline, bottom view: tab labelled "4""'
  "1": { name: IN, type: power }
  "2": { name: GND, type: ground }
  "3": { name: OUT, type: power }
  "4": { name: GND, type: ground }
