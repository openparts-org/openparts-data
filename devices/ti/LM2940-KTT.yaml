# LM2940 1-A LDO (LM2940-N, all fixed voltages), KTT (TO-263) pinout.
# SNVS769J "Pin Functions" (page 3), KTT column: IN 1, GND 2, OUT 3, GND
# 4; outline KTT0003B (page 42) labels the tab "4".
schema_version: "0.2"
kind: device
id: ti/LM2940-KTT
manufacturer: ti
category: linear_regulator
family: LM2940
source: ti/SNVS769J

parameters:
  input_voltage_max: { max: 26 V, src: 'p4 "6.3 Recommended Operating Conditions, Input voltage"' }
  output_current:    { max: 1 A, src: p1 "3 Description" }
  dropout_voltage:
    - typ: 0.5 V
      max: 1 V
      at: { IOUT: 1 A }
      src: p5 "6.5 Elec. Char. (same in 6.6, 6.7), Dropout voltage"
    - typ: 0.5 V
      max: 0.8 V
      at: { IOUT: 1 A, TJ: 25 °C }
      src: p5 "6.5 Elec. Char. (same in 6.6, 6.7), Dropout voltage"
    - typ: 110 mV
      max: 200 mV
      at: { IOUT: 100 mA }
      src: p5 "6.5 Elec. Char. (same in 6.6, 6.7), Dropout voltage"
    - typ: 110 mV
      max: 150 mV
      at: { IOUT: 100 mA, TJ: 25 °C }
      src: p5 "6.5 Elec. Char. (same in 6.6, 6.7), Dropout voltage"

pins:
  src:
    - 'p3 ""Pin Functions", KTT column: IN 1, GND 2, OUT 3, GND 4"'
    - 'p42 "KTT0003B outline, bottom view: tab labelled "4""'
  "1": { name: IN, type: power }
  "2": { name: GND, type: ground }
  "3": { name: OUT, type: power }
  "4": { name: GND, type: ground }
