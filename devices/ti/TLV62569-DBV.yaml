# TLV62569 2-A synchronous buck converter, SOT23-5 (DBV) pinout. From
# SLVSDG1C "5 Pin Configuration and Functions", DBV Package (Top View)
# and the Pin Functions table, SOT23-5 column (page 3): EN 1, GND 2, SW
# 3, VIN 4, FB 5 (PG exists only on the 6-pin packages). Types from the
# I/O/PWR column and descriptions: EN "I" -> input; GND "PWR" ground ->
# ground; SW "PWR" switch pin -> passive; VIN "PWR" supply -> power; FB
# "I" -> input. The DDC/DRL pin maps differ and are not covered.
schema_version: "0.2"
kind: device
id: ti/TLV62569-DBV
manufacturer: ti
category: switching_regulator
family: TLV62569
source: ti/SLVSDG1C

parameters:
  output_type:       { value: adjustable, src: 'p3 "Pin Functions, FB: external feedback divider"' }
  input_voltage_max: { max: 5.5 V, src: 'p4 "6.3 Recommended Operating Conditions, VIN"' }
  output_current:    { max: 2 A, src: 'p4 "6.3 Recommended Operating Conditions, IOUT"' }

pins:
  src: p3 "DBV Package (Top View) and Pin Functions table, SOT23-5 column"
  "1": { name: EN, type: input }
  "2": { name: GND, type: ground }
  "3": { name: SW, type: passive }
  "4": { name: VIN, type: power }
  "5": { name: FB, type: input }
