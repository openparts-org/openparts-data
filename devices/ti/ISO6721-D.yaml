# ISO6721B dual-channel digital isolator (one channel each direction),
# D (8-pin SOIC) pinout from SLLSFJ0F "Table 5-1. Pin Functions" (page
# 4, ISO6721B column), checked against "Figure 5-2. ISO6721B D Package
# 8-Pin SOIC Top View". The ISO6721RB (reversed pinout) is a different
# pinout and not included. Default-output option (F suffix) per Part.
schema_version: "0.2"
kind: device
id: ti/ISO6721-D
manufacturer: ti
category: digital_isolator
family: ISO672x
source: ti/SLLSFJ0F

# Parameters (AI candidates, needs review).
parameters:
  isolation_voltage:
    min: 3000 V
    at: { t: 60 s }
    src: p8 "Insulation Specifications, VISO withstand isolation voltage 3000 VRMS"
  cmr:
    min: 100 kV/µs
    src: p12 "6.9 Electrical Characteristics—5-V Supply, CMTI, VCM = 1200 V"
  supply_voltage:
    ranges: [{ min: 1.71 V, max: 1.89 V }, { min: 2.25 V, max: 5.5 V }]
    src:    p6 "6.3 Recommended Operating Conditions, VCC1/VCC2 supply voltage (1.8 V; 2.5 V to 5 V)"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p6 "6.3 Recommended Operating Conditions, TA Ambient temperature"
  esd_hbm:       { typ: 6 kV, src: 'p5 "6.2 ESD Ratings, HBM all pins ±6000 V"' }
  channel_count: { value: "2", src: 'p1 "3 Description, ISO6721B 2 isolation channels"' }
  propagation_delay:
    typ: 11 ns
    max: 18 ns
    at: { VCC: 5 V }
    src: p20 "6.17 Switching Characteristics—5-V Supply, tPLH, tPHL"
  data_rate: { max: 50 Mbps, src: 'p6 "6.3 Recommended Operating Conditions, DR Data Rate"' }
  reverse_channel_count:
    value: "1"
    src: p1 "3 Description, ISO6721B 1 channel in each direction"

pins:
  src:
    - p4 "Table 5-1. Pin Functions, ISO6721B column"
    - p4 "Figure 5-2. ISO6721B D Package 8-Pin SOIC Top View"
  "1": { name: VCC1, type: power }
  "2": { name: OUTA, type: output }
  "3": { name: INB, type: input }
  "4": { name: GND1, type: ground }
  "5": { name: GND2, type: ground }
  "6": { name: OUTB, type: output }
  "7": { name: INA, type: input }
  "8": { name: VCC2, type: power }
