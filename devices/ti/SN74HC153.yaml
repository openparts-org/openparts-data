# Dual 4-line to 1-line data selector/multiplexer SN74HC153, 16-pin pin
# map read from the rendered "J, W, D, N, NS, or PW Package 16-Pin CDIP,
# CFP, SOIC, PDIP, SO, or TSSOP Top View" diagram (SCLS112E page 3; image
# only, no pin-function table). 1G/2G are the active-low strobes
# (overbar), A/B the shared select inputs. FK (LCCC) not covered.
schema_version: "0.2"
kind: device
id: ti/SN74HC153
manufacturer: ti
category: logic
family: SNx4HC153
source: ti/SCLS112E

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2 V
    max: 6 V
    src: p4 "Recommended Operating Conditions, VCC, SN74HC153 column"
  supply_current:
    max: 8 µA
    at: { VCC: 6 V, TA: 25 °C }
    src: 'p5 "Electrical Characteristics: ICC, VI = VCC or 0, 6 V, TA = 25°C column"'
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p4 "Recommended Operating Conditions, TA, SN74HC153 column"
  channel_count:
    value: "2"
    src: p1 "Title, Dual 4-Line To 1-Line Data Selectors/Multiplexers"
  propagation_delay:
    - typ: 21 ns
      max: 30 ns
      at: { VCC: 4.5 V, CL: 50 pF, TA: 25 °C }
      src: p5 "5.5 Switching Characteristics CL = 50 pF, tpd A or B to Y, 4.5 V, TA = 25°C"
    - typ: 90 ns
      max: 150 ns
      at: { VCC: 2 V, CL: 50 pF, TA: 25 °C }
      src: p5 "5.5 Switching Characteristics CL = 50 pF, tpd A or B to Y, 2 V, TA = 25°C"
    - typ: 17 ns
      max: 26 ns
      at: { VCC: 6 V, CL: 50 pF, TA: 25 °C }
      src: p5 "5.5 Switching Characteristics CL = 50 pF, tpd A or B to Y, 6 V, TA = 25°C"
  logic_function: { value: multiplexer, src: 'p1 "Title, Data Selectors/Multiplexers"' }

pins:
  src:  p3 "16-Pin CDIP, CFP, SOIC, PDIP, SO, or TSSOP Top View diagram (rendered)"
  "1":  { name: 1G, type: input }
  "2":  { name: B, type: input }
  "3":  { name: 1C3, type: input }
  "4":  { name: 1C2, type: input }
  "5":  { name: 1C1, type: input }
  "6":  { name: 1C0, type: input }
  "7":  { name: 1Y, type: output }
  "8":  { name: GND, type: ground }
  "9":  { name: 2Y, type: output }
  "10": { name: 2C0, type: input }
  "11": { name: 2C1, type: input }
  "12": { name: 2C2, type: input }
  "13": { name: 2C3, type: input }
  "14": { name: A, type: input }
  "15": { name: 2G, type: input }
  "16": { name: VCC, type: power }
