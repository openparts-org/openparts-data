# TPS61165 high-brightness white LED boost driver, DRV pin map. Pin
# Functions table, "WSON NO." column (SLVS790E page 3), cross-checked
# with the "DRV Package 6-Pin WSON With Thermal Pad Top View" figure (same page). SW (switching node, inductor)
# typed passive; FB (current feedback) and COMP (error-amplifier
# compensation) analog; GND ("O" in the table) ground; CTRL
# (enable / PWM / one-wire digital dimming) input. data_interface left
# out: CTRL accepts PWM or one-wire digital dimming. The "Thermal Pad"
# row (no number, "must be soldered to the analog ground plane") -> pin
# "EP" named PAD, passive.
schema_version: "0.2"
kind: device
id: ti/TPS61165-DRV
manufacturer: ti
category: led_driver
family: TPS61165
source: ti/SLVS790E

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 3 V
    max: 18 V
    src: p4 "7.2 Recommended Operating Conditions, VI input voltage range"
  supply_current:
    max: 2.3 mA
    at: { VIN: 3.6 V }
    src: p5 "7.4 Electrical Characteristics, IQ operating quiescent current, PWM switching no load"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p4 "7.2 Recommended Operating Conditions, TA"
  channel_count: { value: "1", src: 'p1 "3 Description, LEDs in series (one string)"' }
  led_driver_type:
    value: switching
    src: p1 "Title, High-Brightness, White LED Driver (boost converter)"

pins:
  src:
    - p3 "Pin Functions, WSON NO. column"
    - p3 "DRV Package 6-Pin WSON With Thermal Pad Top View (cross-check)"
  "1": { name: FB, type: analog }
  "2": { name: COMP, type: analog }
  "3": { name: GND, type: ground }
  "4": { name: SW, type: passive }
  "5": { name: CTRL, type: input }
  "6": { name: VIN, type: power }
  EP:  { name: PAD, type: passive }
