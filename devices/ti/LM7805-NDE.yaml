# LM7805 1.5-A fixed 5-V regulator, NDE (TO-220) pinout. SNOSBT0L "Pin
# Functions" (page 3): INPUT 1, GND 2, OUTPUT 3; the "LM7805, LM7812, and
# LM7815 NDE Package 3-Pin TO-220 Top View" figure labels the tab GND.
# The TO-220 tab is not a board pad: pins 1-3 only.
schema_version: "0.1"
kind: device
id: ti/LM7805-NDE

manufacturer: ti
category: linear_regulator
family: LM7805

pins:
  "1": { name: "INPUT", type: power }
  "2": { name: "GND", type: ground }
  "3": { name: "OUTPUT", type: power }

parameters:
  output_type:
    value: fixed
  output_voltage:
    nominal: 5
    unit: V
  output_current:
    max: 1.5
    unit: A
  dropout_voltage:
    nominal: 2
    unit: V

provenance:
  "/parameters/output_type":
    - source: ti/SNOSBT0L
      page: 1
      locator: "Title \"LM340, LM340A and LM7805 Family Wide VIN 1.5-A Fixed Voltage Regulators\"; 1 Features, \"Available in Fixed 5-V, 12-V, and 15-V Options\""
  "/parameters/output_voltage":
    - source: ti/SNOSBT0L
      page: 6
      locator: "6.6 LM340 / LM7805 Electrical Characteristics, \"VO = 5 V, VI = 10 V\""
  "/parameters/output_current":
    - source: ti/SNOSBT0L
      page: 1
      locator: "1 Features, \"Output Current up to 1.5 A\""
  "/parameters/dropout_voltage":
    - source: ti/SNOSBT0L
      page: 6
      locator: "6.6 LM340 / LM7805 Electrical Characteristics, Dropout voltage, TJ = 25°C, IO = 1 A: TYP 2 V"
  "/pins":
    - source: ti/SNOSBT0L
      page: 3
      locator: "\"Pin Functions\": INPUT 1, GND 2, OUTPUT 3"
    - source: ti/SNOSBT0L
      page: 3
      locator: "\"LM7805, LM7812, and LM7815 NDE Package 3-Pin TO-220 Top View\" (OUTPUT/GND/INPUT, tab GND)"
