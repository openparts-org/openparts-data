# DRV8833 dual H-bridge motor driver, PW (16-pin TSSOP) pin map. Pin
# Functions table (SLVSAR1E pages 3-4), column "HTSSOP, TSSOP";
# cross-checked with the "PW Package 16-Pin TSSOP Top View" figure
# (page 3). The PW package has no PowerPAD -- the HTSSOP (PWP) variant
# with its pad is ti/DRV8833-PWP. nFAULT is open-drain ("OD") -- typed
# output (no open-drain pin type). VCP (high-side gate-drive voltage,
# I/O, capacitor to VM) typed passive; VINT (internal supply bypass)
# power_out.
schema_version: "0.2"
kind: device
id: ti/DRV8833-PW
manufacturer: ti
category: motor_driver
family: DRV8833
source: ti/SLVSAR1E

pins:
  src:
    - p3 "Pin Functions, column "HTSSOP, TSSOP" (continued on p4)"
    - p3 "PW Package 16-Pin TSSOP Top View (cross-check)"
  "1":  { name: nSLEEP, type: input }
  "2":  { name: AOUT1, type: output }
  "3":  { name: AISEN, type: io }
  "4":  { name: AOUT2, type: output }
  "5":  { name: BOUT2, type: output }
  "6":  { name: BISEN, type: io }
  "7":  { name: BOUT1, type: output }
  "8":  { name: nFAULT, type: output }
  "9":  { name: BIN1, type: input }
  "10": { name: BIN2, type: input }
  "11": { name: VCP, type: passive }
  "12": { name: VM, type: power }
  "13": { name: GND, type: ground }
  "14": { name: VINT, type: power_out }
  "15": { name: AIN2, type: input }
  "16": { name: AIN1, type: input }
