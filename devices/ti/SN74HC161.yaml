# 4-bit synchronous binary counter SN74HC161, 16-pin pin map from the
# "SN74HC161 ... D, N, NS, OR PW PACKAGE (TOP VIEW)" diagram (SCLS297D
# page 1, rendered; this revision has no pin-function table). CLR and
# LOAD carry an overbar (active low). RCO is the ripple-carry output.
schema_version: "0.2"
kind: device
id: ti/SN74HC161
manufacturer: ti
category: logic
family: SNx4HC161
source: ti/SCLS297D

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2 V
    max: 6 V
    src: p6 "recommended operating conditions, VCC, SN74HC161 column"
  supply_current:
    max: 8 µA
    at: { VCC: 6 V, TA: 25 °C }
    src: 'p7 "electrical characteristics: ICC, VI = VCC or 0, 6 V, TA = 25°C column"'
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p6 "recommended operating conditions, TA, SN74HC161 column"
  channel_count:
    value: "1"
    src: p1 "Title, 4-BIT SYNCHRONOUS BINARY COUNTERS (one 4-bit counter per package)"
  propagation_delay:
    - typ: 25 ns
      max: 41 ns
      at: { VCC: 4.5 V, CL: 50 pF, TA: 25 °C }
      src: p8 "switching characteristics CL = 50 pF, tpd CLK to any Q, 4.5 V, TA = 25°C"
    - typ: 80 ns
      max: 205 ns
      at: { VCC: 2 V, CL: 50 pF, TA: 25 °C }
      src: p8 "switching characteristics CL = 50 pF, tpd CLK to any Q, 2 V, TA = 25°C"
    - typ: 21 ns
      max: 35 ns
      at: { VCC: 6 V, CL: 50 pF, TA: 25 °C }
      src: p8 "switching characteristics CL = 50 pF, tpd CLK to any Q, 6 V, TA = 25°C"
  logic_function: { value: counter, src: 'p1 "Title, 4-BIT SYNCHRONOUS BINARY COUNTERS"' }

pins:
  src:  p1 "SN74HC161 ... D, N, NS, OR PW PACKAGE (TOP VIEW)"
  "1":  { name: CLR, type: reset }
  "2":  { name: CLK, type: clock }
  "3":  { name: A, type: input }
  "4":  { name: B, type: input }
  "5":  { name: C, type: input }
  "6":  { name: D, type: input }
  "7":  { name: ENP, type: input }
  "8":  { name: GND, type: ground }
  "9":  { name: LOAD, type: input }
  "10": { name: ENT, type: input }
  "11": { name: QD, type: output }
  "12": { name: QC, type: output }
  "13": { name: QB, type: output }
  "14": { name: QA, type: output }
  "15": { name: RCO, type: output }
  "16": { name: VCC, type: power }
