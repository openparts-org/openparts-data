# uA7805 1.5-A fixed 5-V regulator, KCS (TO-220) pinout. SLVS056P "Pin
# Functions" (page 3): COMMON 2, INPUT 1, OUTPUT 3, one table for all
# packages; "KCS OR KCT (TO-220) PACKAGE (TOP VIEW)" labels the tab
# COMMON. The TO-220 tab is not a board pad: pins 1-3 only.
schema_version: "0.1"
kind: device
id: ti/UA7805-KCS

manufacturer: ti
category: linear_regulator
family: UA7805

pins:
  "1": { name: "INPUT", type: power }
  "2": { name: "COMMON", type: ground }
  "3": { name: "OUTPUT", type: power }

parameters:
  output_type:
    value: fixed
  output_voltage:
    nominal: 5
    unit: V
  input_voltage_max:
    max: 25
    unit: V
  output_current:
    max: 1.5
    unit: A
  dropout_voltage:
    nominal: 2
    unit: V

provenance:
  "/parameters/output_type":
    - source: ti/SLVS056P
      page: 1
      locator: "Title \"µA78xx Fixed Positive Voltage Regulators\""
  "/parameters/output_voltage":
    - source: ti/SLVS056P
      page: 5
      locator: "7.5 Electrical Characteristics - uA7805, Output voltage, IO = 5 mA to 1 A, VI = 7 V to 20 V, 25°C: TYP 5 V"
  "/parameters/input_voltage_max":
    - source: ti/SLVS056P
      page: 4
      locator: "7.3 Recommended Operating Conditions, VI Input voltage, µA7805: MAX 25 V"
  "/parameters/output_current":
    - source: ti/SLVS056P
      page: 4
      locator: "7.3 Recommended Operating Conditions, IO Output current: MAX 1.5 A"
  "/parameters/dropout_voltage":
    - source: ti/SLVS056P
      page: 5
      locator: "7.5 Electrical Characteristics - uA7805, Dropout voltage, IO = 1 A, 25°C: TYP 2 V"
  "/pins":
    - source: ti/SLVS056P
      page: 3
      locator: "\"Pin Functions\" table: COMMON 2, INPUT 1, OUTPUT 3"
    - source: ti/SLVS056P
      page: 3
      locator: "\"KCS OR KCT (TO-220) PACKAGE (TOP VIEW)\": OUTPUT/COMMON/INPUT, tab COMMON"
