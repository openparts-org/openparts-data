# CC1312R SimpleLink wireless MCU, RGZ (VQFN-48 7x7) pinout. SWRS210H Table 7-1
# "Signal Descriptions - RGZ Package" (PDF pages 8-9) checked against
# Figure 7-1 (RGZ pinout, PDF page 7).
# Types are this dataset's reading of the table: DIO_n (I/O, Digital or
# Digital or Analog) -> io; JTAG_TMSC (I/O) -> io, JTAG_TCKC (I) -> clock;
# RESET_N (active-low reset) -> reset; RF and crystal pins (RF, Analog)
# -> analog; supplies -> power, except DCDC_SW ("Output from internal DC/DC
# converter") and DCOUPL (decoupling of the internal regulated supply, "Do
# not supply external circuitry from this pin") -> power_out. EGP
# ("Ground - exposed ground pad", footnote 3: the only ground connection)
# -> key "EP", name EGP, ground. Alternate functions (JTAG_TDO/TDI on
# DIO_16/17, analog capability of DIO_23-30) are not recorded.
# RX_TX (pin 3, "Optional bias pin for the RF LNA", RF) -> analog.
schema_version: "0.2"
kind: device
id: ti/CC1312R
manufacturer: ti
category: microcontroller
family: CC1312R
source: ti/SWRS210H

