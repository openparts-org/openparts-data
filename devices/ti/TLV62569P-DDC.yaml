# TLV62569P 2-A synchronous buck converter with power good, SOT23-6
# (DDC) pinout. From SLVSDG1C "5 Pin Configuration and Functions", DDC
# Package (Top View) and the Pin Functions table, SOT23-6 column (page
# 3): EN 1, GND 2, SW 3, VIN 4, PG 5, FB 6. Types from the I/O/PWR
# column and descriptions: EN "I" -> input; GND "PWR" ground -> ground;
# SW "PWR" switch pin -> passive; VIN "PWR" supply -> power; PG "O"
# power-good open drain -> output; FB "I" -> input.
schema_version: "0.2"
kind: device
id: ti/TLV62569P-DDC
manufacturer: ti
category: switching_regulator
family: TLV62569
source: ti/SLVSDG1C

parameters:
  output_type:       { value: adjustable, src: 'p3 "Pin Functions, FB: external feedback divider"' }
  input_voltage_max: { max: 5.5 V, src: 'p4 "6.3 Recommended Operating Conditions, VIN"' }
  output_current:    { max: 2 A, src: 'p4 "6.3 Recommended Operating Conditions, IOUT"' }

pins:
  src: p3 "DDC Package (Top View) and Pin Functions table, SOT23-6 column"
  "1": { name: EN, type: input }
  "2": { name: GND, type: ground }
  "3": { name: SW, type: passive }
  "4": { name: VIN, type: power }
  "5": { name: PG, type: output }
  "6": { name: FB, type: input }
