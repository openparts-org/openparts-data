# LM317L 3-terminal adjustable positive regulator (100 mA). Pin
# numbers for the LP (TO-92) package from SLCS144G "LP PACKAGE (TOP
# VIEW)" (page 3: 1 INPUT, 2 OUTPUT, 3 ADJUSTMENT) and Table 4-1 "Pin
# Functions", LP column (same page), whose TYPE column gives I/O/I.
# Only the 3-pin LP pinout is recorded here (the D/PW/PK packages
# number the same functions differently).
schema_version: "0.2"
kind: device
id: ti/LM317L
manufacturer: ti
category: linear_regulator
family: LM317L
source: ti/SLCS144G

parameters:
  output_type:
    value: adjustable
    src: 'p1 "1 Features, "Output voltage range (VO): Adjustable 1.25V to 37V""'
  output_current:
    max: 100 mA
    src: 'p4 "5.3 Recommended Operating Conditions, IO Output current: MAX 100 mA"'

pins:
  src: p3 ""LP PACKAGE (TOP VIEW)" and Table 4-1 "Pin Functions", LP column"
  "1": { name: INPUT, type: input }
  "2": { name: OUTPUT, type: output }
  "3": { name: ADJUSTMENT, type: input }
