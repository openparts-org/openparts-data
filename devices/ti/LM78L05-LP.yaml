# LM78L05 5V 100mA fixed linear regulator, LP (3-pin TO-92) pinout.
# Table 4-1 Pin Functions (page 3), TO-92 column: VOUT = 1, GND = 2,
# VIN = 3; matches "Figure 4-3. LP Package 3-Pin TO-92 Bottom View".
# Per the feature list (page 1), TO-92 is offered with the "legacy chip"
# only.
schema_version: "0.2"
kind: device
id: ti/LM78L05-LP
manufacturer: ti
category: linear_regulator
family: LM78L
source: ti/SNVS754O

parameters:
  output_type:    { value: fixed, src: p1 "Title" }
  input_voltage_max:
    max: 30 V
    src: p4 "5.4 Recommended Operating Conditions, VIN (legacy chip; TO-92 is legacy only)"
  output_current: { max: 100 mA, src: 'p4 "5.4 Recommended Operating Conditions, IO"' }

pins:
  src: p3 "Table 4-1 Pin Functions, TO-92 column (VOUT 1, GND 2, VIN 3); Figure 4-3"
  "1": { name: VOUT, type: output }
  "2": { name: GND, type: ground }
  "3": { name: VIN, type: power }
