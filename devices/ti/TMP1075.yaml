# TMP1075 digital temperature sensor (LM75 pinout), pin map shared by the
# SOIC (D), VSSOP (DGK) and WSON (DSG) packages, from Table 5-1 "Pin
# Functions", column "SOIC / VSSOP / WSON" (SBOS854F page 4), checked
# against Figures 5-1, 5-2 and 5-3 (same page). The SOT563 TMP1075N has
# its own pin map (ti/TMP1075N). V+ ("I", "Supply voltage") typed power;
# SCL clock; ALERT (open-drain output) output. The table lists no
# thermal pad for WSON, so no pin is added for it.
schema_version: "0.2"
kind: device
id: ti/TMP1075
manufacturer: ti
category: temperature_sensor
family: TMP1075
source: ti/SBOS854F

pins:
  src:
    - p4 "Table 5-1 Pin Functions, column SOIC / VSSOP / WSON"
    - p4 "Figures 5-1, 5-2, 5-3 D/DGK/DSG Top View (cross-check)"
  "1": { name: SDA, type: io }
  "2": { name: SCL, type: clock }
  "3": { name: ALERT, type: output }
  "4": { name: GND, type: ground }
  "5": { name: A2, type: input }
  "6": { name: A1, type: input }
  "7": { name: A0, type: input }
  "8": { name: V+, type: power }
