# 8-bit parallel-in shift register SN74HC165, 16-pin pin map from the
# "Pin Functions" table (SCLS116H page 3), column "D, DB, N, NS, PW, J
# or W", checked against the 16-pin top view (same page, rendered); all
# 16 pins match. Pin 7 is the complementary serial output, printed QH
# with an overbar ("Complementary Serial Output"); it is written "QH_N"
# here so it stays distinct from pin 9 "QH" (the overbar is not part of
# the extracted text). SH/LD carries an overbar on LD (written without
# it). CLK typed clock; FK (LCCC) numbering not covered.
schema_version: "0.2"
kind: device
id: ti/SN74HC165
manufacturer: ti
category: logic
family: SNx4HC165
source: ti/SCLS116H

pins:
  src:
    - p3 ""Pin Functions" table, column "D, DB, N, NS, PW, J or W""
    - p3 ""D, DB, N, NS, J, W, or PW Package 16-Pin ... Top View" figure (cross-check)"
  "1":  { name: SH/LD, type: input }
  "2":  { name: CLK, type: clock }
  "3":  { name: E, type: input }
  "4":  { name: F, type: input }
  "5":  { name: G, type: input }
  "6":  { name: H, type: input }
  "7":  { name: QH_N, type: output }
  "8":  { name: GND, type: ground }
  "9":  { name: QH, type: output }
  "10": { name: SER, type: input }
  "11": { name: A, type: input }
  "12": { name: B, type: input }
  "13": { name: C, type: input }
  "14": { name: D, type: input }
  "15": { name: CLK INH, type: input }
  "16": { name: VCC, type: power }
