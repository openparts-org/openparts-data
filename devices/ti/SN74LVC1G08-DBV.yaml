# single 2-input positive-AND gate (SN74LVC1G08), 5-pin pin map of the
# DBV (SOT-23-5) package (shared with DCK/DRL), from "Pin Functions" table
# (SCES217AA page 3), checked against the DBV top-view figure on the same
# page; all 5 pins match. The 6-pin DRY/DSF and the DPW/YZP pin maps
# differ and are not covered.
schema_version: "0.2"
kind: device
id: ti/SN74LVC1G08-DBV
manufacturer: ti
category: logic
family: SN74LVC1G08
source: ti/SCES217AA

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.65 V
    max: 5.5 V
    src: p5 "5.3 Recommended Operating Conditions, VCC, Operating"
  supply_current:
    max: 10 µA
    at: { VCC: 1.65..5.5 V, TA: -40..85 °C }
    src: 'p6 "5.5 Electrical Characteristics: ICC, VI = 5.5V or GND, IO = 0"'
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "5.3 Recommended Operating Conditions, TA"
  esd_hbm:        { typ: 2 kV, src: 'p4 "5.2 ESD Ratings, HBM, all pins"' }
  channel_count: { value: "1", src: 'p1 "3 Description: a single 2-input positive-AND gate"' }
  propagation_delay:
    min: 0.8 ns
    max: 3.6 ns
    at: { VCC: 3.3 V, CL: 15 pF, TA: -40..85 °C }
    src: 'p6 "5.6 Switching Characteristics CL = 15pF: tpd, VCC = 3.3V ± 0.3V"'
  logic_function: { value: and, src: 'p1 "Title: Single 2-Input Positive-AND Gate"' }
  output_current_high:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p5 "5.3 Recommended Operating Conditions, IOH, VCC = 4.5V (printed -32 mA)"
    - max: 8 mA
      at: { VCC: 2.3 V }
      src: p5 "5.3 Recommended Operating Conditions, IOH, VCC = 2.3V (printed -8 mA)"
  output_current_low:
    - max: 32 mA
      at: { VCC: 4.5 V }
      src: p5 "5.3 Recommended Operating Conditions, IOL, VCC = 4.5V"
    - max: 8 mA
      at: { VCC: 2.3 V }
      src: p5 "5.3 Recommended Operating Conditions, IOL, VCC = 2.3V"

pins:
  src:
    - p3 ""Pin Functions" table, column "DBV, DCK, DRL, YZP""
    - p3 ""DBV PACKAGE (TOP VIEW)" figure (cross-check)"
  "1": { name: A, type: input }
  "2": { name: B, type: input }
  "3": { name: GND, type: ground }
  "4": { name: Y, type: output }
  "5": { name: VCC, type: power }
