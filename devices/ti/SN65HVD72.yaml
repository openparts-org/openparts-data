# 3.3-V half-duplex RS-485 transceiver SN65HVD72, pin map from the
# "Pin Functions" table (SLLSE11H page 4) checked against the "D Package
# 8-Pin SOIC Top View" figure (same page; DGK/DRB figures identical); all
# 8 pins match. RE is active low (overbar in the datasheet; written
# without it). A/B "Bus I/O" typed io.
schema_version: "0.2"
kind: device
id: ti/SN65HVD72
manufacturer: ti
category: rs485_transceiver
family: SN65HVD7x
source: ti/SLLSE11H

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 3 V
    max: 3.6 V
    src: p5 "7.3 Recommended Operating Conditions, VCC Supply voltage"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p5 "7.3 Recommended Operating Conditions, TA Operating free-air temperature"
  esd_hbm: { typ: 8 kV, src: 'p5 "7.2 ESD Ratings, HBM, all pins"' }
  data_rate:
    max: 250 kbps
    src: p5 "7.3 Recommended Operating Conditions, 1/tUI Signaling rate, SN65HVD72 row"
  bus_fault_voltage:
    min: -13 V
    max: 16.5 V
    src: p5 "7.1 Absolute Maximum Ratings, Voltage at A or B inputs"

pins:
  src:
    - p4 ""Pin Functions" table (NAME / NUMBER)"
    - p4 ""D Package 8-Pin SOIC Top View" figure (cross-check)"
  "1": { name: R, type: output }
  "2": { name: RE, type: input }
  "3": { name: DE, type: input }
  "4": { name: D, type: input }
  "5": { name: GND, type: ground }
  "6": { name: A, type: io }
  "7": { name: B, type: io }
  "8": { name: VCC, type: power }
