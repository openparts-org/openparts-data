# W25Q256JV 256M-bit SPI flash, 8-pad WSON 8x6-mm / WFLGA 6x5-mm pad
# numbering (package codes E and M). Transcribed from section 3.2 "Pad
# Description WSON 8x6-mm, WFLGA 6x5-mm" (PDF page 7, printed 6),
# cross-checked against Figure 1a on the same page. Pin names use the
# Standard-SPI name; the Quad-SPI IOn name is an alternate function (as
# winbond/W25Q128JV-S). The WSON centre pad gets no pin (see
# manufacturers/winbond/WSON8-8x6-P1.27-E).
schema_version: "0.2"
kind: device
id: winbond/W25Q256JV-E
manufacturer: winbond
category: flash
family: W25Q256JV
source: winbond/W25Q256JV@revI

# Parameters (AI candidates, needs review).
parameters:
  capacity: { typ: 256 Mbit, src: 'p6 "Section 2 Features, W25Q256JV: 256M-bit / 32M-byte"' }
  supply_voltage:
    min: 2.7 V
    max: 3.6 V
    src: p6 "Section 2 Features, Single 2.7 to 3.6V supply"
  esd_hbm:
    typ: 2 kV
    src: p79 "9.1 Absolute Maximum Ratings, VESD Human Body Model -2000 to +2000 V"

pins:
  src: p7 "Section 3.2 "Pad Description WSON 8x6-mm, WFLGA 6x5-mm" table and Figure 1a"
  "1": { name: /CS, type: input }
  "2": { name: DO, type: io, alternate_functions: [IO1] }
  "3": { name: /WP, type: io, alternate_functions: [IO2] }
  "4": { name: GND, type: ground }
  "5": { name: DI, type: io, alternate_functions: [IO0] }
  "6": { name: CLK, type: input }
  "7": { name: /HOLD or /RESET, type: io, alternate_functions: [IO3] }
  "8": { name: VCC, type: power }
