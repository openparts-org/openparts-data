# W25Q32RV 32M-bit SPI/QPI flash. Pin numbering from section "3.3 Pin
# Description SOP 150/208-mil, XSON 2x3x0.4/4x4-mm, WSON 6x5-mm, USON
# 4X3mm" (PDF page 6, printed page 5). Pin names use the datasheet's
# Standard-SPI name; the Quad-SPI IOn name is kept as an alternate
# function. The XSON centre pad is not connected (package page note) --
# no EP pin.
schema_version: "0.2"
kind: device
id: winbond/W25Q32RV
manufacturer: winbond
category: flash
family: W25Q32RV
source: winbond/W25Q32RV@revF

parameters:
