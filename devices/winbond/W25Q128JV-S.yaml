# W25Q128JV 128M-bit SPI flash, 8-pin SOIC 208-mil / WSON pin numbering
# (package codes S/P/E). Transcribed from section 3.3 "Pin Description
# SOIC 208-mil, WSON 6x5-mm / 8x6-mm" (PDF page 6, printed page 5),
# cross-checked against Figure 1a on the same page. Pin names use the
# datasheet's Standard-SPI name; the Quad-SPI IOn name is kept as an
# alternate function.
schema_version: "0.2"
kind: device
id: winbond/W25Q128JV-S
manufacturer: winbond
category: flash
family: W25Q128JV
source: winbond/W25Q128JV@revF

parameters:
  capacity:       { typ: 128 Mbit, src: p5 "Section 1 General Description; Section 2 Features" }
  supply_voltage: { min: 2.7 V, max: 3.6 V, src: 'p5 "Features, Single 2.7 to 3.6V supply"' }
  esd_hbm:
    typ: 2 kV
    src: p61 "Absolute Maximum Ratings, VESD Human Body Model -2000 to +2000 V"

pins:
  src: p6 "Section 3.3 "Pin Description SOIC 208-mil, WSON 6x5-mm / 8x6-mm" table and Figure 1a"
  "1": { name: /CS, type: input }
  "2": { name: DO, type: io, alternate_functions: [IO1] }
  "3": { name: /WP, type: io, alternate_functions: [IO2] }
  "4": { name: GND, type: ground }
  "5": { name: DI, type: io, alternate_functions: [IO0] }
  "6": { name: CLK, type: input }
  "7": { name: /HOLD or /RESET, type: io, alternate_functions: [IO3] }
  "8": { name: VCC, type: power }
