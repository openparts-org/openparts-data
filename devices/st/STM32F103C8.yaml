# Pinout transcribed from STMicroelectronics DS5319 Rev 18, section 3
# "Pinouts and pin description", Table 5 "Medium-density STM32F103xx
# pin definitions" (pages 28-33), using the "LQFP48/UFQFPN48" pin-number
# column specifically (this table covers 7 packages in one grid; other
# columns' pin numbers do not apply here). Cross-checked against Figure
# 8 "STM32F103xx performance line LQFP48 pinout" (page 26): both give
# the same 48-name set with no discrepancy.
#
# `name` uses the package-pinout label (Figure 8), e.g. "PA13" rather
# than Table 5's "Main function (after reset)" column value
# ("JTMS/SWDIO" for that same pin) -- PA13/PA14/PA15/PB3/PB4 default to
# JTAG-DP functions at reset per the datasheet and must be remapped in
# software to use as plain GPIO; not modeled here.
#
# `type: clock` is used only for OSC_IN/OSC_OUT (pins 5-6), whose Table
# 5 Type column is the single-direction "I"/"O" (not "I/O") -- distinct
# from PC14-OSC32_IN/PC15-OSC32_OUT (pins 3-4), which Table 5 marks
# "I/O" (full GPIO, defaulting to the 32kHz oscillator function), so
# those are `type: io` instead, matching the table's own distinction.
#
# `alternate_functions` is populated only for the 10 pins whose Table 5
# "Default" alternate-function column includes an ADCxx_INy signal
# (PA0-PA7, PB0, PB1) -- deliberately not the full peripheral remap
# matrix (SPI/USART/TIM/CAN/etc. sharing these and other pins), which
# is out of scope for this pass; see Table 5's own "Alternate functions"
# columns for the complete mapping if needed later.
