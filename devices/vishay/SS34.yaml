# 40V 3A Schottky barrier rectifier, SMC (DO-214AB). Polarity from
# MECHANICAL DATA (page 1): "Polarity: color band denotes the cathode
# end"; the page-1 package image labels "Cathode" / "Anode". Pin 1 =
# cathode (banded end) per this dataset's diode convention.
schema_version: "0.2"
kind: device
id: vishay/SS34
manufacturer: vishay
category: diode
family: SS3x
source: vishay/88751

parameters:
  forward_voltage:
    max: 0.5 V
    at: { IF: 3 A }
    src: p2 "ELECTRICAL CHARACTERISTICS, Max. instantaneous forward voltage VF (cell spanning SS32-SS34)"
  reverse_voltage: { max: 40 V, src: 'p1 "MAXIMUM RATINGS, VRRM, SS34 column"' }
  forward_current:
    max: 3 A
    src: p1 "MAXIMUM RATINGS, Max. average forward rectified current IF(AV) at TL (fig. 1)"

pins:
  src: 'p1 "MECHANICAL DATA, "Polarity: color band denotes the cathode end""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
