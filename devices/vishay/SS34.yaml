# 40V 3A Schottky barrier rectifier, SMC (DO-214AB). Polarity from
# MECHANICAL DATA (page 1): "Polarity: color band denotes the cathode
# end"; the page-1 package image labels "Cathode" / "Anode". Pin 1 =
# cathode (banded end) per this dataset's diode convention.
schema_version: "0.2"
kind: device
id: vishay/SS34
manufacturer: vishay
category: diode
family: SS3x
source: vishay/88751

parameters:
  forward_voltage:
    max: 0.5 V
    src: 'p2 "ELECTRICAL CHARACTERISTICS, Maximum instantaneous forward voltage, 3.0 A, VF: 0.5 V (cell spanning SS32-SS34)"'
  reverse_voltage:
    max: 40 V
    src: 'p1 "MAXIMUM RATINGS, Maximum repetitive peak reverse voltage VRRM, SS34 column: 40 V"'
  forward_current:
    max: 3 A
    src: 'p1 "MAXIMUM RATINGS, Maximum average forward rectified current at TL (fig. 1) IF(AV): 3.0 A"'

pins:
  src: 'p1 "MECHANICAL DATA, "Polarity: color band denotes the cathode end""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
