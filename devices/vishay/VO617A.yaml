# VO617A optocoupler (IRED + phototransistor), DIP-4 / SMD-4. Pin
# assignment (names expanded from the diagram letters; "C" is used
# for both cathode and collector) from the page-1 pin diagram of datasheet 83430: 1 A, 2 C
# (cathode), 3 E, 4 C (collector); all typed passive. The CTR rank is
# per Part. isolation_voltage is the VISO rating (Vrms, UL1577, t = 1
# min). operating_temperature is the only printed range (absolute
# maximum ratings).
schema_version: "0.2"
kind: device
id: vishay/VO617A
manufacturer: vishay
category: optocoupler
family: VO617A
source: vishay/83430

parameters:
  forward_voltage:
    min: 1 V
    typ: 1.35 V
    max: 1.65 V
    at: { IF: 60 mA }
    src: p3 "Electrical Characteristics, Input, Forward voltage VF"
  reverse_voltage: { max: 6 V, src: 'p2 "Absolute Maximum Ratings, Input, Reverse voltage VR"' }
  forward_current: { max: 60 mA, src: 'p2 "Absolute Maximum Ratings, Input, Forward current IF"' }
  collector_emitter_voltage:
    max: 80 V
    src: p2 "Absolute Maximum Ratings, Output, Collector emitter voltage VCEO"
  collector_current:
    max: 50 mA
    src: p2 "Absolute Maximum Ratings, Output, Collector current IC"
  isolation_voltage:
    min: 5300 V
    at: { t: 60 s }
    src: p5 "Safety and Insulation Ratings, VISO (VRMS, UL1577, t = 1 min)"
  operating_temperature:
    min: -55 °C
    max: 110 °C
    src: p2 "Absolute Maximum Ratings, Operation temperature Tamb"

pins:
  src: 'p1 "Pin diagram: 1 A, 2 C, 3 E, 4 C"'
  "1": { name: ANODE, type: passive }
  "2": { name: CATHODE, type: passive }
  "3": { name: EMITTER, type: passive }
  "4": { name: COLLECTOR, type: passive }
