# Small-signal fast switching diode, DO-35. Polarity (pin 1 = cathode,
# pin 2 = anode) follows this dataset's `axial` generator's own
# convention (grounded in a real KiCad DO-41 reference footprint, see
# openparts-mcad's axial.rs) and the near-universal band-marks-cathode
# diode convention -- this specific research pass did not independently
# re-confirm the cathode-band position from the 1N4148 datasheet's own
# marking diagram, so this is disclosed as convention-consistent, not
# separately datasheet-confirmed for this exact part.
schema_version: "0.2"
kind: device
id: vishay/1N4148
manufacturer: vishay
category: diode
family: 1N4148
source: vishay/81857

parameters:
  forward_voltage:
    max: 1 V
    at: { IF: 10 mA }
    src: 'p2 "ELECTRICAL CHARACTERISTICS, Forward voltage VF: Max 1 V"'
  reverse_voltage:
    max: 100 V
    src: 'p1 "ABSOLUTE MAXIMUM RATINGS, Repetitive peak reverse voltage VRRM: 100 V (Reverse voltage VR: 75 V)"'
  forward_current:
    max: 300 mA
    src: 'p1 "ABSOLUTE MAXIMUM RATINGS, Forward continuous current IF: 300 mA"'

pins:
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
