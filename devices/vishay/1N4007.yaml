# General-purpose axial rectifier diode, DO-41. Polarity (pin 1 =
# cathode, pin 2 = anode) follows this dataset's established convention
# for Vishay axial diodes (see vishay/1N4148) and the band-marks-cathode
# convention confirmed for this part on page 1 of the datasheet
# ("Cathode Band").
schema_version: "0.2"
kind: device
id: vishay/1N4007
manufacturer: vishay
category: diode
family: 1N4007
source: vishay/88503

parameters:
  forward_voltage:
    max: 1.1 V
    at: { IF: 1 A }
    src: p2 "ELECTRICAL CHARACTERISTICS, Max. instantaneous forward voltage VF (all types)"
  reverse_voltage: { max: 1000 V, src: 'p1 "MAXIMUM RATINGS, VRRM, 1N4007 column"' }
  forward_current:
    max: 1 A
    at: { TA: 75 °C }
    src: p1 "MAXIMUM RATINGS, Max. average forward rectified current IF(AV), 9.5 mm lead"

pins:
  src: p1 ""MAXIMUM RATINGS"/marking section, cathode band"
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
