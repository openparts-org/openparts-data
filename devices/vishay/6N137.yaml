# 6N137 / VO2601 / VO2611 single-channel 10 MBd high-speed optocoupler
# (LED + photodiode IC with open-drain output), DIP-8. Pin assignment
# from the page-1 "Single channel" pin diagram of datasheet 84732:
# 1 NC, 2 A, 3 C, 4 NC, 5 GND, 6 VO, 7 VE (enable), 8 VCC. LED
# terminals passive, VO output, VE input. The three MPNs differ only in
# CMR rating (no parameter key). The output supply range (VCC 4.5-5.5 V)
# has no optocoupler key and is not recorded.
schema_version: "0.2"
kind: device
id: vishay/6N137
manufacturer: vishay
category: optocoupler
family: 6N137
source: vishay/84732

parameters:
  forward_voltage:
    min: 1.1 V
    typ: 1.4 V
    max: 1.7 V
    at: { IF: 10 mA }
    src: p4 "Electrical Characteristics, Input, Input forward voltage VF"
  reverse_voltage:
    max: 5 V
    src: p2 "Absolute Maximum Ratings, Input, Reverse input voltage VR"
  forward_current:
    max: 20 mA
    src: p2 "Absolute Maximum Ratings, Input, Average forward current (single channel)"
  isolation_voltage:
    min: 5300 V
    at: { t: 60 s }
    src: p7 "Safety and Insulation Ratings, VISO (VRMS, UL1577, t = 1 min)"
  cmr:
    min: 1 kV/µs
    at: { VCC: 5 V }
    src: p6 "Common Mode Transient Immunity, |CMH| / |CML| at |VCM| = 10 V, note (1) 6N137"
  supply_voltage:
    min: 4.5 V
    max: 5.5 V
    src: p3 "Recommended Operating Conditions, Supply voltage VCC"
  operating_temperature:
    min: -40 °C
    max: 100 °C
    src: p3 "Recommended Operating Conditions, Operating temperature Tamb"
  propagation_delay:
    typ: 50 ns
    max: 75 ns
    at: { VCC: 5 V, CL: 15 pF, RL: 350 Ω }
    src: p5 "Switching Characteristics, tPHL (slower typ), 75 ns 6N137 only, note (1)"

pins:
  src: p1 "Single channel pin diagram (6N137, VO2601, VO2611)"
  "1": { name: NC, type: nc }
  "2": { name: A, type: passive }
  "3": { name: C, type: passive }
  "4": { name: NC, type: nc }
  "5": { name: GND, type: ground }
  "6": { name: VO, type: output }
  "7": { name: VE, type: input }
  "8": { name: VCC, type: power }
