# 1N5818 Schottky barrier rectifier, DO-41 (Vishay 88525). Pin 1 = cathode
# (band end) per this dataset's axial convention (KiCad D_DO-*, pin 1
# at the band); the datasheet itself does not number the leads.
schema_version: "0.2"
kind: device
id: vishay/1N5818
manufacturer: vishay
category: diode
family: 1N5818
source: vishay/88525

parameters:
  forward_voltage:
    max: 0.55 V
    src: 'p1 "ELECTRICAL CHARACTERISTICS, Maximum instantaneous forward voltage, 1.0 A, VF, 1N5818 column: 0.550 V"'
  reverse_voltage:
    max: 30 V
    src: 'p1 "MAXIMUM RATINGS, Maximum repetitive peak reverse voltage VRRM, 1N5818 column: 30 V"'
  forward_current:
    max: 1 A
    src: 'p1 "MAXIMUM RATINGS, Maximum average forward rectified current at 0.375" (9.5 mm) lead length at TL = 90 °C IF(AV): 1.0 A"'

pins:
  src: 'p1 "MECHANICAL DATA: "Polarity: color band denotes the cathode end""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
