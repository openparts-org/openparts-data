# SMCJ5.0A thru SMCJ188A 1500 W TRANSZORB transient voltage suppressors,
# SMC (DO-214AB), unidirectional "A" types only (CA bidirectional types
# not covered). The stand-off voltage is carried by the Part. Polarity
# from 88394 page 1 MECHANICAL DATA "Polarity: for unidirectional types
# the band denotes cathode end".
# No pin numbers are printed for this part, so 1 = Cathode and 2 = Anode
# follow the dataset's two-terminal diode convention (pin 1 at the
# banded end).
schema_version: "0.2"
kind: device
id: vishay/SMCJ-A-SERIES
manufacturer: vishay
category: diode
family: SMCJ
source: vishay/88394

pins:
  src: 'p1 "MECHANICAL DATA: "Polarity: for unidirectional types the band denotes cathode end""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
