# UF4007 ultrafast rectifier (1000 V VRRM), DO-41 (Vishay 88755). Pin 1
# = cathode (band end) per this dataset's axial convention; the
# datasheet itself does not number the leads.
schema_version: "0.2"
kind: device
id: vishay/UF4007
manufacturer: vishay
category: diode
family: UF4007
source: vishay/88755

parameters:
  forward_voltage:
    max: 1.7 V
    src: 'p2 "ELECTRICAL CHARACTERISTICS, Maximum instantaneous forward voltage, 1.0 A, VF: 1.7 V (cell spanning UF4005-UF4007)"'
  reverse_voltage: { max: 1000 V, src: 'p1 "MAXIMUM RATINGS, VRRM, UF4007 column: 1000 V"' }
  forward_current:
    max: 1 A
    src: 'p1 "MAXIMUM RATINGS, Maximum average forward rectified current 0.375" (9.5 mm) lead length at TA = 55 °C IF(AV): 1.0 A"'

pins:
  src: 'p1 "MECHANICAL DATA: "Polarity: color band denotes cathode end""'
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
