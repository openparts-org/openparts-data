# Kingbright WP7113YD Yellow diffused T-1 3/4 (5mm) LED. Cathode identified from
# the page-1 PACKAGE DIMENSIONS drawing ("Cathode" label on one lead;
# flat on the flange). Pin 1 = Cathode follows the skill's radial-LED
# convention (KiCad LED_D5.0mm, pin 1 = cathode, which is also what the
# radial LED 3D template draws). NOTE: the older kingbright/WP7113ID
# device numbers pin 1 = Anode; the two conventions disagree in the
# dataset (reported, not changed here).
schema_version: "0.2"
kind: device
id: kingbright/WP7113YD
manufacturer: kingbright
category: led
family: WP7113
source: kingbright/DSAF2448

parameters:
  forward_voltage:
    typ: 1.95 V
    max: 2.4 V
    at: { IF: 10 mA, TA: 25 °C }
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Forward Voltage VF, Yellow: Typ. 1.95 V, Max. 2.4 V"'
  forward_current:
    max: 30 mA
    at: { TA: 25 °C }
    src: 'p2 "ABSOLUTE MAXIMUM RATINGS, DC Forward Current IF: 30 mA"'
  color:
    value: yellow
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Emitting Color: Yellow"'
  wavelength:
    typ: 588 nm
    at: { IF: 10 mA, TA: 25 °C }
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Dominant Wavelength λdom, Yellow: Typ. 588 nm"'

pins:
  src: p1 "PACKAGE DIMENSIONS drawing, "Cathode" lead label"
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
