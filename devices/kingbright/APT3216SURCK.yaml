# Hyper Red (AlGaInP) SMD chip LED. Pin 1 = cathode, pin 2 = anode, from the
# page-1 schematic symbol (cathode bar on the pin-1 side) and the
# numbered bottom-view terminals.
schema_version: "0.2"
kind: device
id: kingbright/APT3216SURCK
manufacturer: kingbright
category: led
family: APT3216SURCK
source: kingbright/DSAD0989

parameters:
  forward_voltage:
    typ: 1.95 V
    max: 2.5 V
    at: { IF: 20 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Forward Voltage VF, Hyper Red"
  forward_current:
    max: 30 mA
    at: { TA: 25 °C }
    src: p2 "ABSOLUTE MAXIMUM RATINGS, DC Forward Current IF"
  color: { value: red, src: 'p1 "SELECTION GUIDE, Emitting Color Hyper Red"' }
  wavelength:
    typ: 630 nm
    at: { IF: 20 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Dominant Wavelength λdom, Hyper Red"
  peak_wavelength:
    typ: 645 nm
    at: { IF: 20 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Wavelength at Peak Emission λpeak, Hyper Red"
  viewing_angle: { typ: 140 °, src: 'p1 "Selection Guide, Viewing Angle 2θ1/2, APT3216SURCK row"' }
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p2 "ABSOLUTE MAXIMUM RATINGS, Operating Temperature Top"
  esd_hbm:
    typ: 3 kV
    src: p2 "ABSOLUTE MAXIMUM RATINGS, Electrostatic Discharge Threshold (HBM)"

pins:
  src: p1 "Schematic symbol "1 -|<- 2" (cathode bar at pin 1) and bottom-view pad numbers 1/2"
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
