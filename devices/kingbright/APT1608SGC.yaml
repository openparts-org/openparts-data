# Super Bright Green 0603 SMD chip LED. The datasheet's bottom view
# shows a "Polarity mark" on the pin-1 side, the same drawing convention
# as the existing APT1608EC (red), where pin 1 = cathode -- disclosed as
# convention-consistent, not separately re-confirmed from the word
# "cathode" (which this datasheet does not print).
schema_version: "0.2"
kind: device
id: kingbright/APT1608SGC
manufacturer: kingbright
category: led
family: APT1608SGC
source: kingbright/DSAD0932

parameters:
  forward_voltage:
    typ: 2.2 V
    max: 2.5 V
    at: { IF: 20 mA, TA: 25 °C }
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Forward Voltage VF, Super Bright Green: Typ. 2.2 V, Max. 2.5 V"'
  forward_current:
    max: 25 mA
    at: { TA: 25 °C }
    src: 'p2 "ABSOLUTE MAXIMUM RATINGS, DC Forward Current IF: 25 mA"'
  color:
    value: green
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Emitting Color: Super Bright Green"'
  wavelength:
    typ: 568 nm
    at: { IF: 20 mA, TA: 25 °C }
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Dominant Wavelength λdom, Super Bright Green: Typ. 568 nm"'

pins:
  src: p1 "Bottom view "Polarity mark" on pin-1 side, schematic 1-2 -- see comment above"
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
