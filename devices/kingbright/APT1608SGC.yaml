# Super Bright Green 0603 SMD chip LED. The datasheet's bottom view
# shows a "Polarity mark" on the pin-1 side, the same drawing convention
# as the existing APT1608EC (red), where pin 1 = cathode -- disclosed as
# convention-consistent, not separately re-confirmed from the word
# "cathode" (which this datasheet does not print).
schema_version: "0.2"
kind: device
id: kingbright/APT1608SGC
manufacturer: kingbright
category: led
family: APT1608SGC
source: kingbright/DSAD0932

parameters:
  forward_voltage:
    typ: 2.2 V
    max: 2.5 V
    at: { IF: 20 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Forward Voltage VF, Super Bright Green"
  forward_current:
    max: 25 mA
    at: { TA: 25 °C }
    src: p2 "ABSOLUTE MAXIMUM RATINGS, DC Forward Current IF"
  color:
    value: green
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Emitting Color"
  wavelength:
    typ: 568 nm
    at: { IF: 20 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Dominant Wavelength λdom, Super Bright Green"
  peak_wavelength:
    typ: 565 nm
    at: { IF: 20 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Wavelength at Peak Emission λpeak, Super Bright Green"
  viewing_angle: { typ: 150 °, src: 'p1 "Selection Guide, Viewing Angle 2θ1/2, APT1608SGC row"' }
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p2 "ABSOLUTE MAXIMUM RATINGS, Operating Temperature Top"
  esd_hbm:
    typ: 8 kV
    src: p2 "ABSOLUTE MAXIMUM RATINGS, Electrostatic Discharge Threshold (HBM)"

pins:
  src: p1 "Bottom view "Polarity mark" on pin-1 side, schematic 1-2 -- see comment above"
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
