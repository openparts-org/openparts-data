# Super Bright Green (GaP) SMD chip LED. Pin 1 = cathode, pin 2 = anode, from the
# page-1 schematic symbol (cathode bar on the pin-1 side) and the
# numbered bottom-view terminals.
schema_version: "0.2"
kind: device
id: kingbright/APT2012SGC
manufacturer: kingbright
category: led
family: APT2012SGC
source: kingbright/DSAA8210

parameters:
  forward_voltage:
    typ: 2.2 V
    max: 2.5 V
    at: { IF: 20 mA, TA: 25 °C }
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Forward Voltage VF, Super Bright Green: Typ. 2.2 V, Max. 2.5 V"'
  forward_current:
    max: 25 mA
    at: { TA: 25 °C }
    src: 'p2 "ABSOLUTE MAXIMUM RATINGS, DC Forward Current IF: 25 mA"'
  color:
    value: green
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Emitting Color: Super Bright Green"'
  wavelength:
    typ: 568 nm
    at: { IF: 20 mA, TA: 25 °C }
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Dominant Wavelength λdom, Super Bright Green: Typ. 568 nm"'

pins:
  src: p1 "Schematic symbol "1 -|<- 2" (cathode bar at pin 1) and bottom-view pad numbers 1/2"
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
