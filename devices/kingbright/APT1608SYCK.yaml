# Kingbright APT1608SYCK super bright yellow (AlGaInP) 1.6x0.8mm chip
# LED. Pin numbers are printed by the datasheet itself: the page-1
# schematic symbol "1 -|<- 2" (cathode bar at 1) and the bottom-view
# drawing labels "1"/"2" with the "Polarity mark" at pin 1.
schema_version: "0.2"
kind: device
id: kingbright/APT1608SYCK
manufacturer: kingbright
category: led
family: APT1608
source: kingbright/DSAD0931

parameters:
  forward_voltage:
    typ: 2 V
    max: 2.5 V
    at: { IF: 20 mA, TA: 25 °C }
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Forward Voltage VF, Super Bright Yellow: Typ. 2.0 V, Max. 2.5 V"'
  forward_current:
    max: 30 mA
    at: { TA: 25 °C }
    src: 'p2 "ABSOLUTE MAXIMUM RATINGS, DC Forward Current IF: 30 mA"'
  color:
    value: yellow
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Emitting Color: Super Bright Yellow"'
  wavelength:
    typ: 590 nm
    at: { IF: 20 mA, TA: 25 °C }
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Dominant Wavelength λdom, Super Bright Yellow: Typ. 590 nm"'

pins:
  src: p1 "Schematic symbol "1 -|<- 2" and bottom-view drawing pin labels 1/2 with "Polarity mark""
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
