# Kingbright APT1608SYCK super bright yellow (AlGaInP) 1.6x0.8mm chip
# LED. Pin numbers are printed by the datasheet itself: the page-1
# schematic symbol "1 -|<- 2" (cathode bar at 1) and the bottom-view
# drawing labels "1"/"2" with the "Polarity mark" at pin 1.
schema_version: "0.2"
kind: device
id: kingbright/APT1608SYCK
manufacturer: kingbright
category: led
family: APT1608
source: kingbright/DSAD0931

parameters:
  forward_voltage:
    typ: 2 V
    max: 2.5 V
    at: { IF: 20 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Forward Voltage VF, Super Bright Yellow"
  forward_current:
    max: 30 mA
    at: { TA: 25 °C }
    src: p2 "ABSOLUTE MAXIMUM RATINGS, DC Forward Current IF"
  color:
    value: yellow
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Emitting Color"
  wavelength:
    typ: 590 nm
    at: { IF: 20 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Dominant Wavelength λdom, Super Bright Yellow"
  peak_wavelength:
    typ: 590 nm
    at: { IF: 20 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Wavelength at Peak Emission λpeak, Super Bright Yellow"
  viewing_angle: { typ: 120 °, src: 'p1 "Selection Guide, Viewing Angle 2θ1/2, APT1608SYCK row"' }
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p2 "ABSOLUTE MAXIMUM RATINGS, Operating Temperature Top (operating, the only range printed)"
  esd_hbm:
    typ: 3 kV
    src: p2 "ABSOLUTE MAXIMUM RATINGS, Electrostatic Discharge Threshold (HBM)"

pins:
  src: p1 "Schematic symbol "1 -|<- 2" and bottom-view drawing pin labels 1/2 with "Polarity mark""
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
