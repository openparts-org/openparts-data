# Kingbright APT1608SYCK super bright yellow (AlGaInP) 1.6x0.8mm chip
# LED. Pin numbers are printed by the datasheet itself: the page-1
# schematic symbol "1 -|<- 2" (cathode bar at 1) and the bottom-view
# drawing labels "1"/"2" with the "Polarity mark" at pin 1.
schema_version: "0.1"
kind: device
id: kingbright/APT1608SYCK

manufacturer: kingbright
category: led
family: APT1608

pins:
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }

parameters:
  color:
    value: yellow
  wavelength:
    nominal: 590
    unit: nm
  forward_voltage:
    nominal: 2.0
    max: 2.5
    unit: V
  forward_current:
    max: 30
    unit: mA

provenance:
  "/parameters/color":
    - source: kingbright/DSAD0931
      page: 2
      locator: "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Emitting Color: Super Bright Yellow"
  "/parameters/wavelength":
    - source: kingbright/DSAD0931
      page: 2
      locator: "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Dominant Wavelength IF = 20mA λdom, Super Bright Yellow: Typ. 590 nm"
  "/parameters/forward_voltage":
    - source: kingbright/DSAD0931
      page: 2
      locator: "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Forward Voltage IF = 20mA VF, Super Bright Yellow: Typ. 2.0 V, Max. 2.5 V"
  "/parameters/forward_current":
    - source: kingbright/DSAD0931
      page: 2
      locator: "ABSOLUTE MAXIMUM RATINGS at TA=25°C, DC Forward Current IF: 30 mA"
  "/pins":
    - source: kingbright/DSAD0931
      page: 1
      locator: "Schematic symbol \"1 -|<- 2\" and bottom-view drawing pin labels 1/2 with \"Polarity mark\""
