# High Efficiency Red SMD chip LED (GaAsP on GaP), 1.6x0.8mm. Polarity
# confirmed from the page-1 schematic symbol (cathode bar adjacent to
# pin 1's lead) and the mechanical drawing's own "Polarity mark"
# leader-line label pointing at the pin-1-side internal marking -- both
# agree: pin 1 = cathode, pin 2 = anode.
schema_version: "0.2"
kind: device
id: kingbright/APT1608EC
manufacturer: kingbright
category: led
family: APT1608EC
source: kingbright/DSAD0924

parameters:
  forward_voltage:
    typ: 2 V
    max: 2.5 V
    at: { IF: 20 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Forward Voltage VF, High Efficiency Red"
  forward_current:
    max: 30 mA
    at: { TA: 25 °C }
    src: p2 "ABSOLUTE MAXIMUM RATINGS, DC Forward Current IF"
  color: { value: red, src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Emitting Color"' }
  wavelength:
    typ: 617 nm
    at: { IF: 20 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Dominant Wavelength λdom, High Efficiency Red"

pins:
  src: p1 "Schematic symbol (cathode bar at pin 1) and mechanical drawing's "Polarity mark" label"
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
