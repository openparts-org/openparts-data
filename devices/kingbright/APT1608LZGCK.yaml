# Green (InGaN) SMD chip LED. Pin 1 = cathode, pin 2 = anode, from the
# page-1 schematic symbol (cathode bar on the pin-1 side) and the
# numbered bottom-view terminals.
schema_version: "0.2"
kind: device
id: kingbright/APT1608LZGCK
manufacturer: kingbright
category: led
family: APT1608LZGCK
source: kingbright/DSAN8392

parameters:
  forward_voltage:
    min: 2.2 V
    typ: 2.65 V
    max: 3 V
    at: { IF: 2 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Forward Voltage VF, Green"
  forward_current:
    max: 25 mA
    at: { TA: 25 °C }
    src: p2 "ABSOLUTE MAXIMUM RATINGS, DC Forward Current IF"
  color: { value: green, src: 'p1 "SELECTION GUIDE, Emitting Color Green"' }
  wavelength:
    typ: 525 nm
    at: { IF: 2 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Dominant Wavelength λdom, Green"
  peak_wavelength:
    typ: 515 nm
    at: { IF: 2 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Wavelength at Peak Emission λpeak, Green"
  viewing_angle: { typ: 130 °, src: 'p1 "Selection Guide, Viewing Angle 2θ1/2, APT1608LZGCK row"' }
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p2 "ABSOLUTE MAXIMUM RATINGS, Operating Temperature Top (operating, the only range printed)"
  esd_hbm:
    typ: 450 V
    src: p2 "ABSOLUTE MAXIMUM RATINGS, Electrostatic Discharge Threshold (HBM)"

pins:
  src: p1 "Schematic symbol "1 -|<- 2" (cathode bar at pin 1) and bottom-view pad numbers 1/2"
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
