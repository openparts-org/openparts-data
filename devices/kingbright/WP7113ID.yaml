# High Efficiency Red diffused 5mm through-hole LED. Cathode confirmed
# from the datasheet's own side-view drawing (page 1: "Cathode" label
# on the lead nearer the flange's flat-cut marking).
#
# Pin numbering (1=Anode, 2=Cathode) follows this dataset's `radial`
# generator's own established polarity convention (pin 1 = positive,
# on the left -- set for radial electrolytic capacitors, per
# openparts-mcad's radial.rs) rather than the datasheet's own "upper
# lead" framing (which describes a drawing orientation, not a pin
# numbering scheme) -- applied here for consistency with every other
# part reusing this family.
schema_version: "0.1"
kind: device
id: kingbright/WP7113ID

manufacturer: kingbright
category: led
family: WP7113ID

pins:
  "1": { name: Anode, type: passive }
  "2": { name: Cathode, type: passive }

parameters:
  color:
    value: red
  wavelength:
    nominal: 617
    unit: nm
  forward_voltage:
    nominal: 1.9
    max: 2.3
    unit: V
  forward_current:
    max: 30
    unit: mA

provenance:
  "/parameters/color":
    - source: kingbright/DSAF0012
      page: 2
      locator: "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Emitting Color: High Efficiency Red"
  "/parameters/wavelength":
    - source: kingbright/DSAF0012
      page: 2
      locator: "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Dominant Wavelength IF = 10mA λdom, High Efficiency Red: Typ. 617 nm"
  "/parameters/forward_voltage":
    - source: kingbright/DSAF0012
      page: 2
      locator: "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Forward Voltage IF = 10mA VF, High Efficiency Red: Typ. 1.9 V, Max. 2.3 V"
  "/parameters/forward_current":
    - source: kingbright/DSAF0012
      page: 2
      locator: "ABSOLUTE MAXIMUM RATINGS at TA=25°C, DC Forward Current IF: 30 mA"
  "/pins":
    - source: kingbright/DSAF0012
      page: 1
      locator: "Side-view \"PACKAGE DIMENSIONS\" drawing, \"Cathode\" label"
