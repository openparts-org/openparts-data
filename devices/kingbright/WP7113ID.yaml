# High Efficiency Red diffused 5mm through-hole LED. Cathode confirmed
# from the datasheet's own side-view drawing (page 1: "Cathode" label
# on the lead nearer the flange's flat-cut marking).
#
# Pin numbering (1=Anode, 2=Cathode) follows this dataset's `radial`
# generator's own established polarity convention (pin 1 = positive,
# on the left -- set for radial electrolytic capacitors, per
# openparts-mcad's radial.rs) rather than the datasheet's own "upper
# lead" framing (which describes a drawing orientation, not a pin
# numbering scheme) -- applied here for consistency with every other
# part reusing this family.
schema_version: "0.2"
kind: device
id: kingbright/WP7113ID
manufacturer: kingbright
category: led
family: WP7113ID
source: kingbright/DSAF0012

parameters:
  forward_voltage:
    typ: 1.9 V
    max: 2.3 V
    at: { IF: 10 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Forward Voltage VF, High Efficiency Red"
  forward_current:
    max: 30 mA
    at: { TA: 25 °C }
    src: p2 "ABSOLUTE MAXIMUM RATINGS, DC Forward Current IF"
  color: { value: red, src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Emitting Color"' }
  wavelength:
    typ: 617 nm
    at: { IF: 10 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Dominant Wavelength λdom, High Efficiency Red"
  peak_wavelength:
    typ: 627 nm
    at: { IF: 10 mA, TA: 25 °C }
    src: p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Wavelength at Peak Emission λpeak, High Efficiency Red"
  viewing_angle: { typ: 30 °, src: 'p1 "Selection Guide, Viewing Angle 2θ1/2, WP7113ID row"' }
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p2 "ABSOLUTE MAXIMUM RATINGS, Operating Temperature Top (operating, the only range printed)"
  esd_hbm:
    typ: 8 kV
    src: p2 "ABSOLUTE MAXIMUM RATINGS, Electrostatic Discharge Threshold (HBM)"

pins:
  src: p1 "Side-view "PACKAGE DIMENSIONS" drawing, "Cathode" label"
  "1": { name: Anode, type: passive }
  "2": { name: Cathode, type: passive }
