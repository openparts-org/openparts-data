# Blue (InGaN) SMD chip LED. Pin 1 = cathode, pin 2 = anode, from the
# page-1 schematic symbol (cathode bar on the pin-1 side) and the
# numbered bottom-view terminals.
schema_version: "0.2"
kind: device
id: kingbright/APT1608QBC-D
manufacturer: kingbright
category: led
family: APT1608QBC-D
source: kingbright/DSAD9944

parameters:
  forward_voltage:
    typ: 3.3 V
    max: 4 V
    at: { IF: 20 mA, TA: 25 °C }
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Forward Voltage VF, Blue: Typ. 3.3 V, Max. 4.0 V"'
  forward_current:
    max: 30 mA
    at: { TA: 25 °C }
    src: 'p2 "ABSOLUTE MAXIMUM RATINGS, DC Forward Current IF: 30 mA"'
  color:
    value: blue
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS at TA=25°C, Emitting Color: Blue"'
  wavelength:
    typ: 465 nm
    at: { IF: 20 mA, TA: 25 °C }
    src: 'p2 "ELECTRICAL / OPTICAL CHARACTERISTICS, Dominant Wavelength λdom, Blue: Typ. 465 nm"'

pins:
  src: p1 "Schematic symbol "1 -|<- 2" (cathode bar at pin 1) and bottom-view pad numbers 1/2"
  "1": { name: Cathode, type: passive }
  "2": { name: Anode, type: passive }
