# MB85RC256V 256-Kbit (32 K x 8) I2C FeRAM (ferroelectric RAM). Pinout
# from the "PIN FUNCTIONAL DESCRIPTIONS" table (page 2: pins "1 to 3" A0
# to A2, 4 VSS, 5 SDA, 6 SCL, 7 WP, 8 VDD), checked against the "PIN
# ASSIGNMENT" figures for the 8-pin plastic SOP 150 mil and 208 mil on
# the same page (identical). Category: the memory group itself -- FeRAM
# is none of its subcategories (flash, eeprom, sram).
# Types: A0-A2 "Device Address pins" -> input; SDA "Serial Data I/O pin"
# (open drain) -> io; SCL "Serial Clock pin" -> clock (as
# microchip/24LC256); WP -> input; VSS "Ground pin" -> ground; VDD
# "Supply Voltage pin" -> power.
schema_version: "0.2"
kind: device
id: ramxeed/MB85RC256V
manufacturer: ramxeed
category: memory
family: MB85RC256V
source: ramxeed/DS501-00017@rev11v3

parameters:
  capacity:
    typ: 256 Kbit
    src: p1 "Title "256 K (32 K x 8) Bit I2C"; Description, 32,768 words x 8 bits"
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: p11 "Recommended Operating Conditions, Power supply voltage VDD"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: p11 "Recommended Operating Conditions, Operation ambient temperature TA (recommended operating)"

pins:
  src:
    - p2 "PIN FUNCTIONAL DESCRIPTIONS table"
    - p2 "PIN ASSIGNMENT figures, 8-pin plastic SOP 150mil and 208mil"
  "1": { name: A0, type: input }
  "2": { name: A1, type: input }
  "3": { name: A2, type: input }
  "4": { name: VSS, type: ground }
  "5": { name: SDA, type: io }
  "6": { name: SCL, type: clock }
  "7": { name: WP, type: input }
  "8": { name: VDD, type: power }
