# SGP30 multi-pixel metal-oxide gas sensor (TVOC / CO2eq), 6-pin DFN.
# Pins from Table 4 "Pin assignment (transparent top view)" (Datasheet
# SGP30 v1.0 page 5). VDD / VDDH ("Supply voltage, hotplate") power, VSS
# ground, SDA "bidirectional" -> io, SCL "Serial clock, bidirectional"
# -> clock (as for SGP40). Pin 4 is named "R" with "Connect to ground (no
# electrical function)" -> nc. Die pad "electrically connected to GND"
# (page 6 text) -> pin EP, VSS, ground.
# concentration_range: the TVOC output range of Table 2 (page 4).
# operating_temperature: the recommended operating range "5-55 °C"
# (page 4 text), as for SGP40; Table 5 (absolute ratings) prints
# "Operating temperature range -40 to +85°C".
schema_version: "0.2"
kind: device
id: sensirion/SGP30
manufacturer: sensirion
category: gas_sensor
family: SGP30
source: sensirion/Sensirion_Gas_Sensors_Datasheet_SGP30@v1.0

# Parameters (AI candidates, needs review).
parameters:
  data_interface: { value: i2c, src: p1 "I2C interface with TVOC and CO2eq output signals" }
  supply_voltage:
    min: 1.62 V
    max: 1.98 V
    src: p5 "Table 3 Electrical specifications, Supply voltage VDD"
  supply_current: { typ: 48.8 mA, src: 'p5 "Table 3, Supply current in measurement mode"' }
  operating_temperature:
    min: 5 °C
    max: 55 °C
    src: p4 "1.3 Recommended Operating and Storage Conditions, 5-55 °C"
  esd_hbm: { typ: 2 kV, src: 'p6 "Table 5 Absolute minimum and maximum ratings, ESD HBM"' }
  target_gas: { value: voc, src: p1 "Indoor Air Quality Sensor for TVOC and CO2eq Measurements" }
  sensing_principle:
    value: metal_oxide
    src: p1 "Description, the first metal-oxide gas sensor"
  concentration_range:
    min: 0 ppb
    max: 60000 ppb
    src: p4 "Table 2 Air quality signal specifications, TVOC signal output range"

pins:
  src: p5 "Table 4 Pin assignment (transparent top view)"
  "1": { name: VDD, type: power }
  "2": { name: VSS, type: ground }
  "3": { name: SDA, type: io }
  "4": { name: R, type: nc }
  "5": { name: VDDH, type: power }
  "6": { name: SCL, type: clock }
  EP:
    name: { value: VSS, src: p6 "die pad or center pad is electrically connected to GND" }
    type: ground
