# SHTC3 humidity and temperature sensor, 4-pin DFN 2 x 2 mm. Pins from
# Table 7 "SHTC3 pin assignment (top view)" (Datasheet SHTC3 v4, page 6),
# numbers checked against the figure in the same table. VDD power, SCL
# "Serial clock" -> clock (as for SHT4x), SDA "Serial data,
# bidirectional" -> io, VSS ground. Centre pad "internally connected to
# VSS" (Table 7 note) -> pin EP, VSS, ground.
# Category `sensor`: the tree has no humidity-sensor node.
schema_version: "0.2"
kind: device
id: sensirion/SHTC3
manufacturer: sensirion
category: sensor
family: SHTC3
source: sensirion/Datasheet_SHTC3@v4

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.62 V
    max: 3.6 V
    src: p3 "Table 3 Electrical specifications, Supply voltage VDD"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p4 "Table 4 Absolute maximum ratings, Operating temperature range"
  esd_hbm:
    typ: 2 kV
    src: p4 "Table 4 Absolute maximum ratings, ESD HBM (human body model) -2 to 2 kV"

pins:
  src: p6 "Table 7 SHTC3 pin assignment (top view)"
  "1": { name: VDD, type: power }
  "2": { name: SCL, type: clock }
  "3": { name: SDA, type: io }
  "4": { name: VSS, type: ground }
  EP:
    name: { value: VSS, src: 'p6 "Table 7 note: centre pad internally connected to VSS"' }
    type: ground
