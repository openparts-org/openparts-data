# SGP41 gas sensor (SGP4x family), 6-pin DFN. Pins from Table 6 "Pin
# assignment (transparent top view)" (Datasheet SGP41 v1.0, page 7), numbers
# checked against the figure in the same table. VDD / VDDH ("Supply
# voltage, hotplate") power, VSS ground, SDA "bidirectional" -> io, SCL
# "Serial clock" -> clock (as for SHT4x). Pin 4 is named "n/a" with
# "Connect to ground (no electrical function)" -> nc. Die pad
# "electrically connected to GND" (section 2.5 text, page 7) -> pin EP,
# VSS, ground.
schema_version: "0.2"
kind: device
id: sensirion/SGP41
manufacturer: sensirion
category: sensor
family: SGP4x
source: sensirion/Sensirion_Gas_Sensors_Datasheet_SGP41@v1.0

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.7 V
    max: 3.6 V
    src: p5 "Table 2 Electrical specifications, Supply voltage VDD, VDDH"
  operating_temperature:
    min: -10 °C
    max: 50 °C
    src: p6 "Table 4 Recommended humidity and temperature conditions, Operating conditions, Temperature"
  esd_hbm: { typ: 2 kV, src: 'p7 "Table 5 Absolute minimum and maximum ratings, ESD HBM"' }

pins:
  src: p7 "Table 6 Pin assignment (transparent top view)"
  "1": { name: VDD, type: power }
  "2": { name: VSS, type: ground }
  "3": { name: SDA, type: io }
  "4": { name: n/a, type: nc }
  "5": { name: VDDH, type: power }
  "6": { name: SCL, type: clock }
  EP:
    name:
      value: VSS
      src: 'p7 "2.5 Hardware Interface Specifications: die pad connected to GND"'
    type: ground
