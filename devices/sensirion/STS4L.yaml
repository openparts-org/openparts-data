# STS4L temperature sensor (STS4x family, "base T accuracy" per Table 8),
# 4-pin DFN. Pins from the table in section 5.4 "Pin Assignment & Laser
# Marking" (Datasheet STS4x v3.1, page 10), numbers checked against
# Figure 8 (transparent top view, same page). SDA "bidirectional" -> io,
# SCL "unidirectional input" -> clock, VDD power, VSS ground. The die
# pad "is not directly connected to any pin" -> no pin.
schema_version: "0.2"
kind: device
id: sensirion/STS4L
manufacturer: sensirion
category: sensor
family: STS4x
source: sensirion/HT_DS_Datasheet_STS4x@v3.1

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.08 V
    max: 3.6 V
    src: p5 "Table 2 Electrical specifications, Supply voltage VDD"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: 'p5 "Electrical specifications: min/max valid over -40 to 125 C (specified)"'
  esd_hbm: { typ: 2 kV, src: 'p6 "Table 4 Absolute maximum ratings, ESD HBM"' }

pins:
  src: p10 "5.4 Pin Assignment table; Figure 8"
  "1": { name: SDA, type: io }
  "2": { name: SCL, type: clock }
  "3": { name: VDD, type: power }
  "4": { name: VSS, type: ground }
