# MCP1640 synchronous boost regulator, 6-lead SOT-23 (CHY) pinout
# (shared by MCP1640/B/C/D per the table header). From DS20002234D Table
# 3-1 "Pin Function Table" (page 9), column "MCP1640/B/C/D SOT-23",
# checked against the "Package Types" figure "MCP1640 6-Lead SOT-23"
# (page 1): SW 1, GND 2, EN 3, VFB 4, VOUT 5, VIN 6. Types from the
# descriptions: SW "Switch Node, Boost Inductor Input Pin" -> passive,
# GND -> ground, EN "Enable Control Input Pin" -> input, VFB "Feedback
# Voltage Pin" -> input, VOUT "Output Voltage Pin" -> power, VIN "Input
# Voltage Pin" -> power. The 2x3 DFN (MC) numbering differs and is not
# covered.
schema_version: "0.2"
kind: device
id: microchip/MCP1640-SOT23
manufacturer: microchip
category: switching_regulator
family: MCP1640/B/C/D
source: microchip/DS20002234@revD

parameters:
  output_type:
    value: adjustable
    src: 'p1 "Features, "Adjustable Output Voltage Range: 2.0V to 5.5V"; "Output voltage is set by a small external resistor divider""'

pins:
  src:
    - p9 "Table 3-1 "Pin Function Table", column "MCP1640/B/C/D SOT-23""
    - p1 ""Package Types" figure "MCP1640 6-Lead SOT-23" (all 6 pins matched)"
  "1": { name: SW, type: passive }
  "2": { name: GND, type: ground }
  "3": { name: EN, type: input }
  "4": { name: VFB, type: input }
  "5": { name: VOUT, type: power }
  "6": { name: VIN, type: power }
