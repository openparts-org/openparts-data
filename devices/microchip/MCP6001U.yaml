# Single 1-MHz low-power op amp, MCP6001U SOT-23-5 pinout. From
# DS20001733L Table 3-1 "Pin Function Table" (page 11), column
# "MCP6001U 5-Lead SOT-23": VIN+ 1, VSS 2, VIN- 3, VOUT 4, VDD 5,
# checked against the "Package Types" figure "MCP6001U 5-Lead SOT-23"
# (page 1). Types as for microchip/MCP6001.
schema_version: "0.2"
kind: device
id: microchip/MCP6001U
manufacturer: microchip
category: op_amp
family: MCP6001/1R/1U/2/4
source: microchip/DS20001733@revL

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.8 V
    max: 6 V
    src: 'p3 "DC Electrical Specifications, Power Supply: Supply Voltage VDD"'
  esd_hbm: { typ: 4 kV, src: 'p3 "Absolute Maximum Ratings, ESD Protection On All Pins (HBM; MM)"' }
  channel_count:
    value: "1"
    src: 'p47 "Product Identification System, Device MCP6001UT: Single Op Amp"'
  gain_bandwidth:
    typ: 1 MHz
    src: p4 "AC Electrical Specifications, Gain Bandwidth Product GBWP"
  slew_rate: { typ: 0.6 V/µs, src: 'p4 "AC Electrical Specifications, Slew Rate SR"' }
  input_offset_voltage:
    max: 4.5 mV
    at: { TA: 25 °C }
    src: p3 "DC Electrical Specifications, Input Offset Voltage VOS (printed -4.5/+4.5 mV)"
  input_bias_current:
    typ: 1 pA
    at: { TA: 25 °C }
    src: p3 "DC Electrical Specifications, Input Bias Current IB (printed ±1.0 pA)"
  supply_current_per_channel:
    min: 50 µA
    typ: 100 µA
    max: 170 µA
    at: { VDD: 5.5 V, IOUT: 0 A, TA: 25 °C }
    src: p3 "DC Electrical Specifications, Quiescent Current per Amplifier IQ"
  rail_to_rail_input:  { value: yes, src: 'p1 "Features: Rail-to-Rail Input/Output"' }
  rail_to_rail_output: { value: yes, src: 'p1 "Features: Rail-to-Rail Input/Output"' }

pins:
  src:
    - p11 "Table 3-1 "Pin Function Table", column "MCP6001U 5-Lead SOT-23""
    - p1 ""Package Types", MCP6001U 5-Lead SOT-23"
  "1": { name: VIN+, type: analog }
  "2": { name: VSS, type: power }
  "3": { name: VIN-, type: analog }
  "4": { name: VOUT, type: analog }
  "5": { name: VDD, type: power }
