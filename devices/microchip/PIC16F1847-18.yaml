# PIC16F1847 pinout for the 18-pin PDIP/SOIC packages, from DS41453B
# "Pin Diagram - 18-Pin PDIP, SOIC (PIC16(L)F1847)" (page 5).
# Types: VDD power, VSS ground, RA5 input (MCLR/VPP/RA5 is input-only,
# page 124), other port pins io. `alternate_functions`: the ADC channel,
# VREF, oscillator and ICSP functions printed in the pin name; comparator,
# CCP, MSSP, EUSART and other (partly remappable) functions are not
# listed. Pin map shared by PIC16F1847 and PIC16LF1847; this Device is
# used for PIC16F1847 parts.
schema_version: "0.2"
kind: device
id: microchip/PIC16F1847-18
manufacturer: microchip
category: microcontroller
family: PIC16(L)F1847
source: microchip/DS41453@revB

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.8 V
    max: 5.5 V
    at: { f: 16 MHz }
    src: p348 "30.1 DC Characteristics, D001 VDD, PIC16F1847, FOSC <= 16 MHz"

pins:
  src:  ['p5 "Pin Diagram - 18-Pin PDIP, SOIC (PIC16(L)F1847)"', p124 "RA5 is an input only"]
  "1":  { name: RA2, type: io, alternate_functions: [AN2, VREF-] }
  "2":  { name: RA3, type: io, alternate_functions: [AN3, VREF+] }
  "3":  { name: RA4, type: io, alternate_functions: [AN4] }
  "4":  { name: RA5, type: input, alternate_functions: [MCLR, VPP] }
  "5":  { name: VSS, type: ground }
  "6":  { name: RB0, type: io }
  "7":  { name: RB1, type: io, alternate_functions: [AN11] }
  "8":  { name: RB2, type: io, alternate_functions: [AN10] }
  "9":  { name: RB3, type: io, alternate_functions: [AN9] }
  "10": { name: RB4, type: io, alternate_functions: [AN8] }
  "11": { name: RB5, type: io, alternate_functions: [AN7] }
  "12": { name: RB6, type: io, alternate_functions: [AN5, ICSPCLK] }
  "13": { name: RB7, type: io, alternate_functions: [AN6, ICSPDAT] }
  "14": { name: VDD, type: power }
  "15": { name: RA6, type: io, alternate_functions: [OSC2, CLKOUT] }
  "16": { name: RA7, type: io, alternate_functions: [OSC1, CLKIN] }
  "17": { name: RA0, type: io, alternate_functions: [AN0] }
  "18": { name: RA1, type: io, alternate_functions: [AN1] }
