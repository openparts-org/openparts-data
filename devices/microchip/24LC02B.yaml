# 24LC02B 2-Kbit I2C serial EEPROM, 8-lead pinout of the PDIP, SOIC,
# TSSOP and MSOP packages. From DS21709J Table 2-1 "Pin Function Table"
# (page 5), column SOIC, checked against the "Package Types" figure
# "SOIC, TSSOP" (page 1). A0, A1, A2 are "Not Connected" (figure note:
# "Pins A0, A1 and A2 are not used by the 24XX02. (No internal
# connections)") -> type nc, names kept. SDA "Serial Address/Data I/O"
# -> io, SCL -> input, WP "Write-Protect Input" -> input, VSS -> ground,
# VCC -> power. The 2x3 DFN (MC) and TDFN (MNY) columns of Table 2-1
# give the same numbers as SOIC (pins 1-8), so this device also covers
# them; DS21709J says nothing about the exposed pad -> no EP pin. The
# 5-lead SOT-23/SC-70 numbering is not covered (see
# microchip/24AA02-SOT23).
schema_version: "0.1"
kind: device
id: microchip/24LC02B

manufacturer: microchip
category: eeprom
family: "24AA02/24LC02B"

pins:
  "1": { name: A0, type: nc }
  "2": { name: A1, type: nc }
  "3": { name: A2, type: nc }
  "4": { name: VSS, type: ground }
  "5": { name: SDA, type: io }
  "6": { name: SCL, type: input }
  "7": { name: WP, type: input }
  "8": { name: VCC, type: power }

provenance:
  "/pins":
    - source: microchip/DS21709@revJ
      page: 5
      locator: "Table 2-1 \"Pin Function Table\", column \"SOIC\""
    - source: microchip/DS21709@revJ
      page: 1
      locator: "\"Package Types\" figure \"SOIC, TSSOP\" (all 8 pins matched)"
    - source: microchip/DS21709@revJ
      page: 5
      locator: "Table 2-1 \"Pin Function Table\", columns \"DFN\" and \"TDFN\" (same numbers as SOIC)"
