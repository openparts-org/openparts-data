# ATtiny827 (tinyAVR 2-series), 24-pin VQFN 4x4 (RLB). Pin
# names/numbers from Table 3-1 "PORT Function Multiplexing", column
# "VQFN 24-pin" (DS40002311B page 18, text), cross-checked against
# Section 2.4 "24-Pin VQFN" (page 17). The pin table is the same in all three
# tinyAVR 2-series data sheets (DS40002234B/DS40002311B/DS40002345B).
#
# Types: VDD power, GND ground, port pins io. alternate_functions carry
# only the "Other/Special" and "ADC0" columns (entries the table marks as
# alternative pin locations included: EVOUTA on PA7, EVOUTB on PB7,
# RESET on PB4); AC/USART/SPI/TWI/TCA/TCB/CCL columns are not modelled.
#
# Exposed pad: section 4.1.1 (page 19) says the center pad "is not
# electrically connected to the internal circuit of the chip", so no EP pin.
schema_version: "0.2"
kind: device
id: microchip/ATtiny827
manufacturer: microchip
category: microcontroller
family: tinyAVR 2-series
source: microchip/DS40002311@revB

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.8 V
    max: 5.5 V
    src: p475 "Table 33-2 General Operating Conditions, VDD Operating supply voltage, Industrial"

pins:
  src:
    - p18 "Table 3-1 PORT Function Multiplexing, column VQFN 24-pin, Other/Special and ADC0"
    - p17 "Section 2.4 24-Pin VQFN pinout figure (cross-check)"
  "1":  { name: PA2, type: io, alternate_functions: [EVOUTA, AIN2] }
  "2":  { name: PA3, type: io, alternate_functions: [EXTCLK, AIN3] }
  "3":  { name: GND, type: ground }
  "4":  { name: VDD, type: power }
  "5":  { name: PA4, type: io, alternate_functions: [AIN4] }
  "6":  { name: PA5, type: io, alternate_functions: [VREFA, AIN5] }
  "7":  { name: PA6, type: io, alternate_functions: [AIN6] }
  "8":  { name: PA7, type: io, alternate_functions: [EVOUTA, AIN7] }
  "9":  { name: PB7, type: io, alternate_functions: [EVOUTB] }
  "10": { name: PB6, type: io }
  "11": { name: PB5, type: io, alternate_functions: [CLKOUT, AIN8] }
  "12": { name: PB4, type: io, alternate_functions: [RESET, AIN9] }
  "13": { name: PB3, type: io, alternate_functions: [TOSC1] }
  "14": { name: PB2, type: io, alternate_functions: [TOSC2, EVOUTB] }
  "15": { name: PB1, type: io, alternate_functions: [AIN10] }
  "16": { name: PB0, type: io, alternate_functions: [AIN11] }
  "17": { name: PC0, type: io, alternate_functions: [AIN12] }
  "18": { name: PC1, type: io, alternate_functions: [AIN13] }
  "19": { name: PC2, type: io, alternate_functions: [EVOUTC, AIN14] }
  "20": { name: PC3, type: io, alternate_functions: [AIN15] }
  "21": { name: PC4, type: io }
  "22": { name: PC5, type: io }
  "23": { name: PA0, type: io, alternate_functions: [RESET, UPDI] }
  "24": { name: PA1, type: io, alternate_functions: [AIN1] }
