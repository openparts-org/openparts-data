# 8-bit I/O expander with I2C interface (MCP23008). Pin numbers from Table 1-1
# Pinout Description (DS20001919F page 4), the column named below; pin names
# are the MCP23008 names of the Package Types figures (pages 2-3), which the
# combined Table 1-1 names (SCL/SCK, SDA/SI, A2/SO, NC/CS) resolve to.
# Exposed pad: Table 1-1 lists no EP entry, so no EP pin is recorded.
schema_version: "0.2"
kind: device
id: microchip/MCP23008-QFN20
manufacturer: microchip
category: io_expander
family: MCP23008/MCP23S08
source: microchip/DS20001919@revF

pins:
  src:  ['p4 "Table 1-1 Pinout Description, column QFN"', 'p2 "Package Types, MCP23008 QFN"']
  "1":  { name: A2, type: input }
  "2":  { name: A1, type: input }
  "3":  { name: A0, type: input }
  "4":  { name: RESET, type: reset }
  "5":  { name: NC, type: nc }
  "6":  { name: N/C, type: nc }
  "7":  { name: INT, type: output }
  "8":  { name: N/C, type: nc }
  "9":  { name: GP0, type: io }
  "10": { name: GP1, type: io }
  "11": { name: GP2, type: io }
  "12": { name: GP3, type: io }
  "13": { name: GP4, type: io }
  "14": { name: GP5, type: io }
  "15": { name: GP6, type: io }
  "16": { name: GP7, type: io }
  "17": { name: VSS, type: ground }
  "18": { name: VDD, type: power }
  "19": { name: SCL, type: clock }
  "20": { name: SDA, type: io }
