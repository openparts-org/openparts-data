# AVR128DA48 in the 48-pin packages (TQFP and VQFN share one pin map:
# section 2.3 "48-Pin VQFN and TQFP"). Pin names/numbers from section 3.1
# "I/O Multiplexing", column "VQFN48/TQFP48" (DS40002183E pages 18-19,
# rendered and read as images), cross-checked pin for pin against the
# pinout figure (page 16).
#
# Types: VDD/AVDD power, GND ground, port pins io. PF6 is typed input
# (table note 5 "Input-only") with RESET as alternate function. UPDI is a
# dedicated programming/debug pin, typed io (single-wire bidirectional
# interface). Page 14/16 note: "For the AVR DA Family, the VDD and AVDD
# are internally connected (no separate power domains)" -- the names
# differ, so no connected_to is recorded. alternate_functions carry only
# the "Special" and "ADC0" columns (the "TWI" marker in the Special column
# is not a signal name: skipped); PTC/AC/DAC/ZCD/USART/SPI/TWI/
# TCA/TCB/TCD/EVSYS/CCL mappings are not modelled. PF0-PF5 ADC0 inputs
# AIN16-AIN21 are "Positive input-only" (table note 6).
#
# Exposed pad (VQFN only): section 4.1.1 "Special Consideration for
# Packages with Center Pad" (page 20) says the pad "is not electrically
# connected to the internal circuit of the chip" -> no EP pin (the
# footprint still gets the pad).
