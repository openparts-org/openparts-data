# Dual 1-MHz low-power op amp, 8-lead 2x3 DFN (MC) pinout. From
# DS20001733L Table 3-1 "Pin Function Table" (page 11), column "MCP6002
# 8-Lead 2x3 DFN": pins 1-8 as microchip/MCP6002, plus EP 9 "Exposed
# Thermal Pad (EP); must be connected to VSS". Section 3.4 (same page):
# "There is an internal electrical connection between the Exposed
# Thermal Pad (EP) and the VSS pin" -> key "EP", name VSS, connected_to
# pin 4 (as microchip/MCP73832-DFN8). Names and types as microchip/MCP6002.
schema_version: "0.2"
kind: device
id: microchip/MCP6002-DFN8
manufacturer: microchip
category: op_amp
family: MCP6001/1R/1U/2/4
source: microchip/DS20001733@revL

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.8 V
    max: 6 V
    src: 'p3 "DC Electrical Specifications, Power Supply: Supply Voltage VDD"'
  esd_hbm: { typ: 4 kV, src: 'p3 "Absolute Maximum Ratings, ESD Protection On All Pins (HBM; MM)"' }
  channel_count:
    value: "2"
    src: 'p47 "Product Identification System, Device MCP6002: Dual Op Amp"'
  gain_bandwidth:
    typ: 1 MHz
    src: p4 "AC Electrical Specifications, Gain Bandwidth Product GBWP"
  slew_rate: { typ: 0.6 V/µs, src: 'p4 "AC Electrical Specifications, Slew Rate SR"' }
  input_offset_voltage:
    max: 4.5 mV
    at: { TA: 25 °C }
    src: p3 "DC Electrical Specifications, Input Offset Voltage VOS (printed -4.5/+4.5 mV)"
  input_bias_current:
    typ: 1 pA
    at: { TA: 25 °C }
    src: p3 "DC Electrical Specifications, Input Bias Current IB (printed ±1.0 pA)"
  supply_current_per_channel:
    min: 50 µA
    typ: 100 µA
    max: 170 µA
    at: { VDD: 5.5 V, IOUT: 0 A, TA: 25 °C }
    src: p3 "DC Electrical Specifications, Quiescent Current per Amplifier IQ"
  rail_to_rail_input:  { value: yes, src: 'p1 "Features: Rail-to-Rail Input/Output"' }
  rail_to_rail_output: { value: yes, src: 'p1 "Features: Rail-to-Rail Input/Output"' }

pins:
  src: p11 "Table 3-1 Pin Function Table, column MCP6002 8-Lead 2x3 DFN; Section 3.4 Exposed Thermal Pad"
  "1": { name: VOUTA, type: analog }
  "2": { name: VINA-, type: analog }
  "3": { name: VINA+, type: analog }
  "4": { name: VSS, type: power }
  "5": { name: VINB+, type: analog }
  "6": { name: VINB-, type: analog }
  "7": { name: VOUTB, type: analog }
  "8": { name: VDD, type: power }
  EP:  { name: VSS, type: power, connected_to: "4" }
