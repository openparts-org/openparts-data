# ATSAMD51J19A (SAM D51J, 512KB flash) pinout for the 64-pin TQFP and
# VQFN packages, from data sheet DS60001507N section 4.2, Figure 4-2
# "64-Pin TQFP and VQFN Package" (PDF page 22, rendered and read: the
# figure's labels are rotated and do not extract cleanly as text).
# Types: GND/GNDANA ground; VDDIO/VDDIOB/VDDANA/VDDCORE power; VSW (the
# switching regulator output, a supply pin) power; RESETN reset; ports
# io (PA00/PA01 XIN32/XOUT32 and PB22/PB23 XIN1/XOUT1 stay io: they are
# general-purpose port pins).
# `alternate_functions` only for the USB pair: PA24 USB/DM and PA25
# USB/DP (Table 6-1 "Multiplexed Peripheral Signals", peripheral
# function H, PDF page 33); other functions are not listed.
# Exposed pad (VQFN only): Figure 4-2 note 1 and section 59.3.4 only
# recommend connecting it to ground and say it is not electrically
# connected inside the device, so no EP pin is recorded.
schema_version: "0.2"
kind: device
