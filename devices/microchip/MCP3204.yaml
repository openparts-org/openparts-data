# MCP3204 4-channel 12-bit SPI A/D converter, 14-lead PDIP/SOIC/TSSOP
# pinout. From DS21298E Table 3-1 "Pin Function Table" (page 15), column
# "MCP3204 PDIP, SOIC, TSSOP", checked against the "Package Types"
# figure "MCP3204 PDIP, SOIC, TSSOP" (page 1). Pins 5 and 6 are "NC No
# Connection" -> type nc. Types as microchip/MCP3008 (CH -> analog,
# DGND/AGND -> ground, CS/SHDN, DIN, CLK -> input, DOUT -> output, VREF
# -> analog, VDD -> power).
schema_version: "0.2"
kind: device
id: microchip/MCP3204
manufacturer: microchip
category: adc
family: MCP3204/3208
source: microchip/DS21298@revE

# Parameters (AI candidates, needs review).
parameters:
  data_interface: { value: spi, src: 'p1 "Features, SPI serial interface (modes 0,0 and 1,1)"' }
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: 'p3 "Electrical Characteristics, Power Requirements: Operating Voltage VDD"'
  supply_current:
    typ: 320 µA
    max: 400 µA
    at: { VDD: 5 V }
    src: 'p3 "Electrical Characteristics, Power Requirements: Operating Current IDD, VDD = VREF = 5V"'
  esd_hbm: { typ: 4 kV, src: 'p2 "Absolute Maximum Ratings, ESD protection on all pins > 4 kV"' }
  channel_count:
    value: "4"
    src: 'p1 "Description: MCP3204 ... four single-ended inputs (or pseudo-differential pairs)"'
  resolution:     { value: "12", src: 'p1 "Features, 12-bit resolution"' }
  sample_rate:
    max: 100 kSPS
    at: { VDD: 5 V }
    src: p1 "Features, 100 ksps max. sampling rate at VDD = 5V"
  reference:      { value: external, src: 'p15 "Pin Function Table, VREF Reference Voltage Input"' }

pins:
  src:
    - p15 "Table 3-1 "Pin Function Table", column "MCP3204 PDIP, SOIC, TSSOP""
    - p1 ""Package Types" figure "MCP3204 PDIP, SOIC, TSSOP" (all 14 pins matched)"
  "1":  { name: CH0, type: analog }
  "2":  { name: CH1, type: analog }
  "3":  { name: CH2, type: analog }
  "4":  { name: CH3, type: analog }
  "5":  { name: NC, type: nc }
  "6":  { name: NC, type: nc }
  "7":  { name: DGND, type: ground }
  "8":  { name: CS/SHDN, type: input }
  "9":  { name: DIN, type: input }
  "10": { name: DOUT, type: output }
  "11": { name: CLK, type: input }
  "12": { name: AGND, type: ground }
  "13": { name: VREF, type: analog }
  "14": { name: VDD, type: power }
