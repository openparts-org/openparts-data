# PIC16F877A pinout for the 44-pin TQFP, from DS39582C Table 1-3
# "PIC16F874A/877A Pinout Description" TQFP column (pages 10-13; NC row
# "12,13,33,34"), checked against the 44-Pin TQFP pin diagram (page 3).
# Types: VDD power, VSS ground, MCLR/VPP input, OSC1/CLKI input and
# OSC2/CLKO output (Table 1-3 I/O/P type), port pins io (RA4 is
# open-drain when an output, still io). `alternate_functions`: the
# analog, reference and programming functions printed in the pin name
# (AN, VREF, CVREF, PGC/PGD/PGM, INT, T0CKI/C1OUT); the serial, CCP and
# PSP functions are not listed. Pin map shared by PIC16F874A and
# PIC16F877A; this Device is used for PIC16F877A parts.
schema_version: "0.2"
kind: device
id: microchip/PIC16F877A-TQFP44
manufacturer: microchip
category: microcontroller
family: PIC16F87XA
source: microchip/DS39582@revC

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 4 V
    max: 5.5 V
    src: p175 "17.1 DC Characteristics, D001 VDD Supply Voltage, 16F87XA, All configurations"

