# AVR128DA28 in the 28-pin packages (SPDIP, SSOP and SOIC share one pin
# map: section 2.1 "28-Pin SPDIP, SSOP and SOIC"). Pin names/numbers from
# section 3.1 "I/O Multiplexing", column "SPDIP28/SOIC28/SSOP28"
# (DS40002183E pages 18-19, rendered and read as images), cross-checked
# pin for pin against the pinout figure (page 14).
#
# Types: VDD/AVDD power, GND ground, port pins io. PF6 is typed input
# (table note 5 "Input-only") with RESET as alternate function. UPDI is a
# dedicated programming/debug pin, typed io (single-wire bidirectional
# interface). Page 14/16 note: "For the AVR DA Family, the VDD and AVDD
# are internally connected (no separate power domains)" -- the names
# differ, so no connected_to is recorded. alternate_functions carry only
# the "Special" and "ADC0" columns (the "TWI" marker in the Special column
# is not a signal name: skipped); PTC/AC/DAC/ZCD/USART/SPI/TWI/
# TCA/TCB/TCD/EVSYS/CCL mappings are not modelled. PF0/PF1 ADC0 inputs
# AIN16/AIN17 are "Positive input-only" (table note 6).
schema_version: "0.2"
kind: device
id: microchip/AVR128DA28
manufacturer: microchip
category: microcontroller
family: AVR DA
source: microchip/DS40002183@revE

pins:
  src:
    - p18 "Section 3.1 "I/O Multiplexing", column "SPDIP28/SOIC28/SSOP28", columns "Special" and "ADC0""
    - p19 "Section 3.1 table (continued), rows PF0-GND"
    - p14 "Section 2.1 "28-Pin SPDIP, SSOP and SOIC" pinout figure (cross-check)"
  "1":  { name: PA7, type: io, alternate_functions: [CLKOUT] }
