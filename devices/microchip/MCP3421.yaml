# 18-bit single-channel delta-sigma I2C ADC with 2.048 V reference
# (MCP3421), SOT-23-6 pin map from Table 3-1 "Pin Function Table"
# (DS22003E page 9). Types: VIN+/VIN- analog, VSS ground, VDD power,
# SDA io, SCL ("Serial Clock Input Pin") clock.
schema_version: "0.2"
kind: device
id: microchip/MCP3421
manufacturer: microchip
category: adc
family: MCP3421
source: microchip/DS22003@revE

# Parameters (AI candidates, needs review).
parameters:
  data_interface: { value: i2c, src: 'p1 "Features, Supports I2C Serial Interface"' }
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: 'p4 "Electrical Specifications, Power Requirements: Voltage Range VDD"'
  supply_current:
    typ: 155 µA
    max: 190 µA
    at: { VDD: 5 V }
    src: p4 "Elec. Spec., Supply Current during Conversion IDDA, VDD = 5.0V"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p5 "Temperature Characteristics: Specified Temperature Range TA"'
  esd_hbm:
    typ: 6 kV
    src: 'p3 "Absolute Maximum Ratings: ESD protection on all pins ≥ 6 kV HBM"'
  channel_count:
    value: "1"
    src: 'p1 "Description: single channel ... A/D converter with differential inputs"'
  resolution:     { value: "18", src: 'p1 "Features, 18-bit ΔΣ ADC; 3.75 SPS (18 bits)"' }
  sample_rate:
    max: 240 SPS
    src: p1 "Features, Programmable Data Rate Options, 240 SPS (12 bits)"
  reference:      { value: internal, src: 'p1 "Features, On-Board Voltage Reference"' }

pins:
  src: p9 "Table 3-1 "Pin Function Table""
  "1": { name: VIN+, type: analog }
  "2": { name: VSS, type: ground }
  "3": { name: SCL, type: clock }
  "4": { name: SDA, type: io }
  "5": { name: VDD, type: power }
  "6": { name: VIN-, type: analog }
