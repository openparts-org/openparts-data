# device. Read from a rendered image of DS40002061B Figure 1-1 "Pinout
# ATmega48A/PA/88A/PA/168A/PA/328/P", "28 SPDIP" diagram (page 12).
# Names use the primary (non-parenthesized) label; alternate functions
# recorded only for the ADC channels of PC0-PC5, as in the TQFP device.
