# ATmega32U4 pinout from datasheet 7766J, Figure 1-1 "Pinout" (page 3,
# rendered and read as an image; labels are rotated). The figure is
# titled "44-pin QFN/TQFP", so the same numbering applies to the -AU
# (TQFP44) and -MU (QFN44) Parts.
# Pin types from section 2.2 "Pin Descriptions" (pages 5-7): UCAP is the
# USB regulator output ("connected to an external capacitor") -> power;
# VBUS is a "USB VBUS monitor input" -> input; AREF "analog reference
# pin (input)" -> analog; XTAL1/XTAL2 -> clock.
# `alternate_functions` lists only the ADC channels shown in the figure;
# PB5/PB6 are cut off in the figure ("ADC..."), their channels (ADC12,
# ADC13) come from section 10.3.2 "Alternate Functions of Port B" Table
# 10-3 (page 74).
# Exposed pad: the QFN44 drawing (page 424) shows a D2/E2 pad, but no
# page of this datasheet states what it must be connected to, so no
# "EP" pin is recorded (unknown, not guessed as GND).
schema_version: "0.1"
kind: device
id: microchip/ATmega32U4

manufacturer: microchip
category: microcontroller
family: megaAVR

