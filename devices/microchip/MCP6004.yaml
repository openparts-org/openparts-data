# Quad 1-MHz low-power op amp, 14-lead PDIP/SOIC/TSSOP pinout. From
# DS20001733L Table 3-1 "Pin Function Table" (page 11), column "MCP6004
# PDIP, SOIC, TSSOP", checked against the "Package Types" figure
# "MCP6004 14-Lead PDIP, SOIC, TSSOP" (page 1). Table 3-1 writes the
# channel-A pins "VOUT, VOUTA" / "VIN-, VINA-" / "VIN+, VINA+"; the
# MCP6004 names VOUTA/VINA-/VINA+ are used (as microchip/MCP6002). Types
# as microchip/MCP6002.
schema_version: "0.2"
kind: device
id: microchip/MCP6004
manufacturer: microchip
category: op_amp
family: MCP6001/1R/1U/2/4
source: microchip/DS20001733@revL

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.8 V
    max: 6 V
    src: 'p3 "DC Electrical Specifications, Power Supply: Supply Voltage VDD"'
  esd_hbm: { typ: 4 kV, src: 'p3 "Absolute Maximum Ratings, ESD Protection On All Pins (HBM; MM)"' }
  channel_count:
    value: "4"
    src: 'p47 "Product Identification System, Device MCP6004: Quad Op Amp"'
  gain_bandwidth:
    typ: 1 MHz
    src: p4 "AC Electrical Specifications, Gain Bandwidth Product GBWP"
  slew_rate: { typ: 0.6 V/µs, src: 'p4 "AC Electrical Specifications, Slew Rate SR"' }
  input_offset_voltage:
    max: 4.5 mV
    at: { TA: 25 °C }
    src: p3 "DC Electrical Specifications, Input Offset Voltage VOS (printed -4.5/+4.5 mV)"
  input_bias_current:
    typ: 1 pA
    at: { TA: 25 °C }
    src: p3 "DC Electrical Specifications, Input Bias Current IB (printed ±1.0 pA)"
  supply_current_per_channel:
    min: 50 µA
    typ: 100 µA
    max: 170 µA
    at: { VDD: 5.5 V, IOUT: 0 A, TA: 25 °C }
    src: p3 "DC Electrical Specifications, Quiescent Current per Amplifier IQ"
  rail_to_rail_input:  { value: yes, src: 'p1 "Features: Rail-to-Rail Input/Output"' }
  rail_to_rail_output: { value: yes, src: 'p1 "Features: Rail-to-Rail Input/Output"' }

pins:
  src:
    - p11 "Table 3-1 "Pin Function Table", column "MCP6004 PDIP, SOIC, TSSOP""
    - p1 ""Package Types" figure "MCP6004 14-Lead PDIP, SOIC, TSSOP" (cross-check)"
  "1":  { name: VOUTA, type: analog }
  "2":  { name: VINA-, type: analog }
  "3":  { name: VINA+, type: analog }
  "4":  { name: VDD, type: power }
  "5":  { name: VINB+, type: analog }
  "6":  { name: VINB-, type: analog }
  "7":  { name: VOUTB, type: analog }
  "8":  { name: VOUTC, type: analog }
  "9":  { name: VINC-, type: analog }
  "10": { name: VINC+, type: analog }
  "11": { name: VSS, type: power }
  "12": { name: VIND+, type: analog }
  "13": { name: VIND-, type: analog }
  "14": { name: VOUTD, type: analog }
