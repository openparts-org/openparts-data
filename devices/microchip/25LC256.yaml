# 25LC256 256-Kbit SPI serial EEPROM, standard 8-lead pinout of the
# PDIP, SOIC and (non-rotated) TSSOP packages. From DS20001822J Table
# 2-1 "Pin Function Table" (page 6), columns PDIP/SOIC, checked against
# the "Package Types" figure "PDIP/SOIC" (page 1). The rotated TSSOP
# (25LC256X) is not covered. The DFN-S (MF) column gives the same
# numbers (pins 1-8), so DFN-S is covered too; its exposed pad "can be
# connected to VSS or left floating" (Table 2-1 note 1) -> no EP pin. Overbars of CS and
# HOLD (active low) are not represented in the name. Types: CS, WP, SI,
# SCK, HOLD -> input; SO -> output; VSS "Ground" -> ground; VCC "Supply
# Voltage" -> power.
schema_version: "0.2"
kind: device
id: microchip/25LC256
manufacturer: microchip
category: eeprom
family: 25AA256/25LC256
source: microchip/DS20001822@revJ

parameters:
  capacity:
    typ: 256 Kbit
    src: 'p1 "Description: "(25XX256) are 256-Kbit Serial Electrically Erasable PROMs""'

pins:
  src:
    - p6 "Table 2-1 "Pin Function Table", columns "PDIP" and "SOIC""
    - p1 ""Package Types (not to scale)" figure "PDIP/SOIC" (all 8 pins matched)"
    - p6 "Table 2-1 "Pin Function Table", column "DFN-S" (same numbers as PDIP/SOIC; note 1 on the exposed pad)"
  "1": { name: CS, type: input }
  "2": { name: SO, type: output }
  "3": { name: WP, type: input }
  "4": { name: VSS, type: ground }
  "5": { name: SI, type: input }
  "6": { name: SCK, type: input }
  "7": { name: HOLD, type: input }
  "8": { name: VCC, type: power }
