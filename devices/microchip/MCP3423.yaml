# 18-bit 2-channel delta-sigma I2C ADC with 2.048 V reference (MCP3423,
# family MCP3422/3/4), pin map from Table 3-1 "Pin Function Table",
# column "MCP3423 MSOP" (DS22088C page 11), checked against the "Package Types"
# figure (page 2). The 3x3 DFN uses the same numbering plus exposed pad 11 (not covered). Types: CHn+/CHn- analog, VSS ground, VDD
# power, SDA io, SCL ("Serial Clock Pin") clock, Adr0/Adr1 (address
# selection) input.
schema_version: "0.2"
kind: device
id: microchip/MCP3423
manufacturer: microchip
category: adc
family: MCP3422/3/4
source: microchip/DS22088@revC

# Parameters (AI candidates, needs review).
parameters:
  data_interface: { value: i2c, src: 'p1 "Features, I2C Interface"' }
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: 'p6 "Electrical Specifications, Power Requirements: Voltage Range VDD"'
  supply_current:
    typ: 145 µA
    max: 180 µA
    at: { VDD: 5 V }
    src: p6 "Elec. Spec., Supply Current during Conversion IDDA, VDD = 5.0V"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p7 "Temperature Characteristics: Specified Temperature Range TA"'
  esd_hbm:
    typ: 6 kV
    src: 'p5 "Absolute Maximum Ratings: ESD protection on all pins ≥ 6 kV HBM"'
  channel_count:
    value: "2"
    src: 'p2 "Description: MCP3422 and MCP3423 have two, MCP3424 four differential input channels"'
  resolution:     { value: "18", src: 'p1 "Features, 18-bit ΔΣ ADC; 3.75 SPS (18 bits)"' }
  sample_rate:
    max: 240 SPS
    src: p1 "Features, Programmable Data Rate Options, 240 SPS (12 bits)"
  reference: { value: internal, src: 'p1 "Features, On-Board Voltage Reference (VREF)"' }

pins:
  src:
    - p11 "Table 3-1 "Pin Function Table", column "MCP3423 MSOP""
    - p2 ""Package Types" figure (cross-check)"
  "1":  { name: CH1+, type: analog }
  "2":  { name: CH1-, type: analog }
  "3":  { name: VSS, type: ground }
  "4":  { name: CH2+, type: analog }
  "5":  { name: CH2-, type: analog }
  "6":  { name: VDD, type: power }
  "7":  { name: SDA, type: io }
  "8":  { name: SCL, type: clock }
  "9":  { name: Adr0, type: input }
  "10": { name: Adr1, type: input }
