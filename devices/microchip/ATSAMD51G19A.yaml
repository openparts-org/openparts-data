# ATSAMD51G19A (SAM D51G, 512KB flash) pinout for the 48-pin VQFN (the
# only package of SAM D51G, Table 1-2 PDF page 18), from data sheet
# DS60001507N section 4.1, Figure 4-1 "48-Pin VQFN Package" (PDF page 21,
# rendered and read; the text extraction agrees).
# Types: GND/GNDANA ground; VDDIO/VDDANA/VDDCORE power; VSW (the switching
# regulator output, a supply pin) power; RESETN reset; ports io.
# `alternate_functions` only for the USB pair: PA24 USB/DM and PA25
# USB/DP (Table 6-1 "Multiplexed Peripheral Signals", peripheral
# function H, PDF page 33), as for ATSAMD51J19A.
# Exposed pad: Figure 4-1 note 1 only recommends connecting it to ground
# in the PCB, so no EP pin is recorded.
schema_version: "0.2"
kind: device
id: microchip/ATSAMD51G19A
manufacturer: microchip
category: microcontroller
family: SAM D51
source: microchip/DS60001507@revN

