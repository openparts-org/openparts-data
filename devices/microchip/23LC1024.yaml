# 23LC1024 1-Mbit SPI/SDI/SQI serial SRAM, 8-lead SOIC/PDIP/TSSOP
# pinout. From DS20005142C Table 3-1 "Pin Function Table" (page 12),
# checked against the "Package Types" figure "SOIC/TSSOP/PDIP" (page 1).
# Multi-function names kept as printed (SO/SIO1, SI/SIO0, HOLD/SIO3; the
# CS and HOLD overbars are not represented). Types: CS, SCK -> input;
# SO/SIO1, SIO2, SI/SIO0, HOLD/SIO3 (serial I/O in SDI/SQI modes) -> io;
# VSS "Ground" -> ground; VCC "Power Supply" -> power.
schema_version: "0.1"
kind: device
id: microchip/23LC1024

manufacturer: microchip
category: sram
family: "23A1024/23LC1024"

pins:
  "1": { name: CS, type: input }
  "2": { name: "SO/SIO1", type: io }
  "3": { name: SIO2, type: io }
  "4": { name: VSS, type: ground }
  "5": { name: "SI/SIO0", type: io }
  "6": { name: SCK, type: input }
  "7": { name: "HOLD/SIO3", type: io }
  "8": { name: VCC, type: power }

provenance:
  "/pins":
    - source: microchip/DS20005142@revC
      page: 12
      locator: "Table 3-1 \"Pin Function Table\", column \"SOIC/PDIP/TSSOP\""
    - source: microchip/DS20005142@revC
      page: 1
      locator: "\"Package Types\" figure \"SOIC/TSSOP/PDIP\" (all 8 pins matched)"
