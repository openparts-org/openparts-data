# ATmega4809 in the 48-pin packages (TQFP48 and VQFN48 share one pin
# map). Pin names/numbers from section 4.1 "Multiplexed Signals",
# column "TQFP48/VQFN48" (DS40002173C pages 19-20), cross-checked pin
# for pin against Figure "3.4 48-Pin VQFN/TQFP" (page 17). The 40-pin
# PDIP numbers pins differently and is not covered.
#
# Types: VDD/AVDD power, GND ground, port pins io. UPDI (pin 41, the
# programming/debug pin per the figure's "Programming, debug" legend)
# is typed io (single-wire bidirectional interface). PF6 is typed io
# with RESET as alternate function (table column "Special").
# alternate_functions carry only the "Special" and "ADC0" columns
# (the "TWI" marker in the Special column is not a signal name: skipped);
# USART/SPI/TWI/TCA/TCB/EVSYS/CCL/AC mappings are not modelled.
#
# Exposed pad (VQFN only): page 18 says the centre pad "can be
# connected to PCB ground or left electrically unconnected" -- it does
# not say what it connects to inside, so no EP pin.
