# MCP3208 8-channel 12-bit SPI A/D converter, 16-lead PDIP/SOIC pinout.
# From DS21298E Table 3-1 "Pin Function Table" (page 15), column
# "MCP3208 PDIP, SOIC", checked against the "Package Types" figure
# "MCP3208 PDIP, SOIC" (page 1). Types as microchip/MCP3008.
schema_version: "0.2"
kind: device
id: microchip/MCP3208
manufacturer: microchip
category: adc
family: MCP3204/3208
source: microchip/DS21298@revE

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: 'p3 "Electrical Characteristics, Power Requirements: Operating Voltage VDD"'
  supply_current:
    typ: 320 µA
    max: 400 µA
    at: { VDD: 5 V }
    src: 'p3 "Electrical Characteristics, Power Requirements: Operating Current IDD, VDD = VREF = 5V"'
  esd_hbm: { typ: 4 kV, src: 'p2 "Absolute Maximum Ratings, ESD protection on all pins > 4 kV"' }
  channel_count:
    value: "8"
    src: 'p1 "Description: MCP3208 ... eight single-ended inputs (or pseudo-differential pairs)"'

pins:
  src:
    - p15 "Table 3-1 "Pin Function Table", column "MCP3208 PDIP, SOIC""
    - p1 ""Package Types" figure "MCP3208 PDIP, SOIC" (all 16 pins matched)"
  "1":  { name: CH0, type: analog }
  "2":  { name: CH1, type: analog }
  "3":  { name: CH2, type: analog }
  "4":  { name: CH3, type: analog }
  "5":  { name: CH4, type: analog }
  "6":  { name: CH5, type: analog }
  "7":  { name: CH6, type: analog }
  "8":  { name: CH7, type: analog }
  "9":  { name: DGND, type: ground }
  "10": { name: CS/SHDN, type: input }
  "11": { name: DIN, type: input }
  "12": { name: DOUT, type: output }
  "13": { name: CLK, type: input }
  "14": { name: AGND, type: ground }
  "15": { name: VREF, type: analog }
  "16": { name: VDD, type: power }
