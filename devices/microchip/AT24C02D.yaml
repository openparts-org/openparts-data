# AT24C02D 2-Kbit I2C serial EEPROM, 8-lead PDIP/SOIC/TSSOP pin
# numbering (the 5-lead SOT-23 and UDFN are not covered). Transcribed
# from Table 2-1 "Pin Function Table", 8-Lead SOIC column (page 5).
schema_version: "0.2"
kind: device
id: microchip/AT24C02D
manufacturer: microchip
category: eeprom
family: AT24C01D/AT24C02D
source: microchip/DS20006100@revB

parameters:
  capacity:
    typ: 2048 bit
    src: 'p7 "Section 3 Description: "The AT24C01D/AT24C02D provides 1,024/2,048 bits of Serial Electrically Erasable Programmable Read-Only Memory" (AT24C02D: 2,048 bits)"'

pins:
  src: p5 "Table 2-1 "Pin Function Table", 8-Lead SOIC column"
  "1": { name: A0, type: input }
  "2": { name: A1, type: input }
  "3": { name: A2, type: input }
  "4": { name: GND, type: ground }
  "5": { name: SDA, type: io }
  "6": { name: SCL, type: input }
  "7": { name: WP, type: input }
  "8": { name: VCC, type: power }
