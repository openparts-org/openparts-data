# 12-bit dual-channel SPI DAC (MCP4922), 14-pin PDIP/SOIC/TSSOP pin map
# from Table 3-1 "Pin Function Table", column "MCP4922 Pin No."
# (DS21897B page 15), checked against the "14-Pin PDIP, SOIC, TSSOP"
# figure under "Package Types" (page 1). Pins 2, 6 and 7 are "NC - No
# Connection" (typed nc). CS and SHDN are active low (overbar; written
# without it). SCK typed clock, VREFx/VOUTx analog, AVSS ground.
schema_version: "0.2"
kind: device
id: microchip/MCP4922
manufacturer: microchip
category: dac
family: MCP492X
source: microchip/DS21897@revB

pins:
  src:
    - p15 "Table 3-1 "Pin Function Table", column "MCP4922 Pin No.""
    - p1 ""Package Types" 14-Pin PDIP, SOIC, TSSOP figure (cross-check)"
  "1":  { name: VDD, type: power }
  "2":  { name: NC, type: nc }
  "3":  { name: CS, type: input }
  "4":  { name: SCK, type: clock }
  "5":  { name: SDI, type: input }
  "6":  { name: NC, type: nc }
  "7":  { name: NC, type: nc }
  "8":  { name: LDAC, type: input }
  "9":  { name: SHDN, type: input }
  "10": { name: VOUTB, type: analog }
  "11": { name: VREFB, type: analog }
  "12": { name: AVSS, type: ground }
  "13": { name: VREFA, type: analog }
  "14": { name: VOUTA, type: analog }
