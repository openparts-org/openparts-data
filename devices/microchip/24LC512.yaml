# 512-Kbit I2C serial EEPROM (2.5 V 24LC512 of the 24AA512/24LC512/
# 24FC512 family). Pinout from DS20001754P Table 2-1 "Pin Function
# Table" (page 5), 8-lead columns PDIP, SOIC, SOIJ and DFN (identical
# numbers), cross-checked with the "Package Type" figure
# "PDIP/SOIJ/SOIC/TSSOP" and "DFN" on page 1. The 14-lead TSSOP and the
# chip-scale package number differently and are not covered. The DFN
# exposed pad "can be connected to VSS or left floating" (Table 2-1
# note) -- not an internal connection, so no EP pin.
schema_version: "0.2"
kind: device
id: microchip/24LC512
manufacturer: microchip
category: eeprom
family: 24AA512/24LC512/24FC512
source: microchip/DS20001754@revP

parameters:
  capacity:
    typ: 512 Kbit
    src: p1 "Description, "64K x 8 (512 Kbit) Serial Electrically Erasable PROM""
  supply_voltage: { min: 2.5 V, max: 5.5 V, src: 'p1 "Device Selection Table, 24LC512 VCC Range"' }

pins:
  src:
    - p5 "Table 2-1 "Pin Function Table", columns PDIP, SOIC, SOIJ, DFN"
    - p1 "Package Type figures "PDIP/SOIJ/SOIC/TSSOP" and "DFN""
  "1": { name: A0, type: input }
  "2": { name: A1, type: input }
  "3": { name: A2, type: input }
  "4": { name: VSS, type: ground }
  "5": { name: SDA, type: io }
  "6": { name: SCL, type: clock }
  "7": { name: WP, type: input }
  "8": { name: VCC, type: power }
