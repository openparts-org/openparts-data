# AVR64DD32 in the 32-pin packages (TQFP and VQFN share one pin map:
# section 2.3 "32-Pin VQFN and TQFP"). Pin names/numbers from section 3.1
# "I/O Multiplexing", column "VQFN32 / TQFP32" (DS40002315C pages 17-18,
# rendered and read as images), cross-checked pin for pin against the
# pinout figure (page 16, rendered).
#
# Types: VDD/VDDIO2 power (VDDIO2 supplies the PORTC MVIO domain per the
# figure legend), GND ground, port pins io. PF6 is typed input (table note
# 5 "Input-only") with RESET as alternate function; PF7 carries UPDI
# (programming/debug). alternate_functions carry only the "Special" and
# "ADC0" columns (the "TWI Fm+" marker is not a signal name: skipped);
# AC/DAC/ZCD/USART/SPI/TWI/TCA/TCB/TCD/EVSYS/CCL mappings are not
# modelled. PC0-PC3 ADC inputs AIN28-AIN31 are available only when MVIO is
# disabled (table note 6).
#
# Exposed pad (VQFN only): section 4.1.1 "Special Consideration for
# Packages with Center Pad" (page 19) says the pad "is not electrically
# connected to the internal circuit of the chip" -> no EP pin (the
# footprint still gets the pad).
schema_version: "0.2"
kind: device
id: microchip/AVR64DD32
manufacturer: microchip
category: microcontroller
family: AVR DD
source: microchip/DS40002315@revC

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:    { min: 1.8 V, max: 5.5 V, src: 'p581 "Table 38-4 Supply Voltage, VDD"' }
  io_supply_voltage: { min: 1.62 V, max: 5.5 V, src: 'p581 "Table 38-4 Supply Voltage, VDDIO2"' }

pins:
  src:
    - p17 "Section 3.1 "I/O Multiplexing", column "VQFN32 / TQFP32", columns "Special" and "ADC0""
    - p18 "Section 3.1 table (continued), rows PF6-GND"
    - p16 "Section 2.3 "32-Pin VQFN and TQFP" pinout figure (cross-check)"
  "1":  { name: PA3, type: io, alternate_functions: [AIN23] }
