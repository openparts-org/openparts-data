# ATtiny3226 (tinyAVR 2-series), 20-pin SOIC (SO) and SSOP (SS), same pin numbering. Pin
# names/numbers from Table 3-1 "PORT Function Multiplexing", column
# "SSOP/SOIC 20-pin" (DS40002345B page 18, text), cross-checked against
# Section 2.2 "20-Pin SOIC, SSOP" (page 15). The pin table is the same in all three
# tinyAVR 2-series data sheets (DS40002234B/DS40002311B/DS40002345B).
#
# Types: VDD power, GND ground, port pins io. alternate_functions carry
# only the "Other/Special" and "ADC0" columns (entries the table marks as
# alternative pin locations included: EVOUTA on PA7, EVOUTB on PB7,
# RESET on PB4); AC/USART/SPI/TWI/TCA/TCB/CCL columns are not modelled.
schema_version: "0.2"
kind: device
id: microchip/ATtiny3226-SOIC20
manufacturer: microchip
category: microcontroller
family: tinyAVR 2-series
source: microchip/DS40002345@revB

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.8 V
    max: 5.5 V
    src: p475 "Table 33-2 General Operating Conditions, VDD Operating supply voltage, Industrial"

pins:
  src:
    - p18 "Table 3-1 PORT Function Multiplexing, column SSOP/SOIC 20-pin, Other/Special and ADC0"
    - p15 "Section 2.2 20-Pin SOIC, SSOP pinout figure (cross-check)"
  "1":  { name: VDD, type: power }
  "2":  { name: PA4, type: io, alternate_functions: [AIN4] }
  "3":  { name: PA5, type: io, alternate_functions: [VREFA, AIN5] }
  "4":  { name: PA6, type: io, alternate_functions: [AIN6] }
  "5":  { name: PA7, type: io, alternate_functions: [EVOUTA, AIN7] }
  "6":  { name: PB5, type: io, alternate_functions: [CLKOUT, AIN8] }
  "7":  { name: PB4, type: io, alternate_functions: [RESET, AIN9] }
  "8":  { name: PB3, type: io, alternate_functions: [TOSC1] }
  "9":  { name: PB2, type: io, alternate_functions: [TOSC2, EVOUTB] }
  "10": { name: PB1, type: io, alternate_functions: [AIN10] }
  "11": { name: PB0, type: io, alternate_functions: [AIN11] }
  "12": { name: PC0, type: io, alternate_functions: [AIN12] }
  "13": { name: PC1, type: io, alternate_functions: [AIN13] }
  "14": { name: PC2, type: io, alternate_functions: [EVOUTC, AIN14] }
  "15": { name: PC3, type: io, alternate_functions: [AIN15] }
  "16": { name: PA0, type: io, alternate_functions: [RESET, UPDI] }
  "17": { name: PA1, type: io, alternate_functions: [AIN1] }
  "18": { name: PA2, type: io, alternate_functions: [EVOUTA, AIN2] }
  "19": { name: PA3, type: io, alternate_functions: [EXTCLK, AIN3] }
  "20": { name: GND, type: ground }
