# PIC18F47K42 (PIC18(L)F2x/4x/5xK42) pinout for the 40-pin PDIP, from DS40001919G
# pin allocation table (40-pin PDIP column) checked against the 40-pin PDIP pin diagram: same names at the same numbers.
# Types: VDD power, VSS ground, RE3 input (MCLR/VPP/RE3 is input-only),
# other port pins io; NC pins nc. `alternate_functions`: the ADC channel
# from the allocation table's A/D column, plus MCLR/VPP and ICSPCLK/
# ICSPDAT from the pin diagram; PPS-remappable peripheral functions are
# not listed. The same pin map applies to every member of the family
# with this pin count; this Device is used for PIC18F47K42 parts.
