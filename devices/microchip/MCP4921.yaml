# 12-bit single-channel SPI DAC (MCP4921), 8-pin PDIP/SOIC/MSOP pin map
# from Table 3-1 "Pin Function Table", column "MCP4921 Pin No."
# (DS21897B page 15), checked against the "8-Pin PDIP, SOIC, MSOP"
# figure under "Package Types" (page 1); all 8 pins match. CS is active
# low (overbar; written without it). SCK typed clock, VREFA/VOUTA
# analog, AVSS ("Analog ground") ground.
schema_version: "0.2"
kind: device
id: microchip/MCP4921
manufacturer: microchip
category: dac
family: MCP492X
source: microchip/DS21897@revB

pins:
  src:
    - p15 "Table 3-1 "Pin Function Table", column "MCP4921 Pin No.""
    - p1 ""Package Types" 8-Pin PDIP, SOIC, MSOP figure (cross-check)"
  "1": { name: VDD, type: power }
  "2": { name: CS, type: input }
  "3": { name: SCK, type: clock }
  "4": { name: SDI, type: input }
  "5": { name: LDAC, type: input }
  "6": { name: VREFA, type: analog }
  "7": { name: AVSS, type: ground }
  "8": { name: VOUTA, type: analog }
