# ATtiny45 (4K bytes Flash per the Features list, page 1) in the 8-pin
# PDIP/SOIC/TSSOP. Pinout from datasheet 2586Q, Figure 1-1 "Pinout
# ATtiny25/45/85" (page 2, PDIP/SOIC/TSSOP drawing, shared by
# ATtiny25/45/85; same pin table as microchip/ATtiny85). The 20-pad
# QFN/MLF numbers pins differently and is not covered by this Device.
#
# name: each pin's Port B label (the figure's primary label).
# alternate_functions: only each pin's ADC input channel (Table 10-3
# "Port B Pins Alternate Functions", page 60), as for microchip/ATtiny85;
# RESET/dW/PCINT/XTAL/timer/USI functions are not modelled.
schema_version: "0.2"
kind: device
id: microchip/ATtiny45
manufacturer: microchip
category: microcontroller
family: ATtiny25/45/85
source: microchip/2586@revQ

# Parameters (AI candidates, needs review).
parameters:
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p205 "25 Ordering Information, ATtiny45, -PU/-SU codes: Industrial (-40 to +85)"'

pins:
  src:
    - p2 "Figure 1-1 "Pinout ATtiny25/45/85", PDIP/SOIC/TSSOP"
    - p60 "Table 10-3 "Port B Pins Alternate Functions" (ADC channels)"
  "1": { name: PB5, type: io, alternate_functions: [ADC0] }
  "2": { name: PB3, type: io, alternate_functions: [ADC3] }
  "3": { name: PB4, type: io, alternate_functions: [ADC2] }
  "4": { name: GND, type: ground }
  "5": { name: PB0, type: io }
  "6": { name: PB1, type: io }
  "7": { name: PB2, type: io, alternate_functions: [ADC1] }
  "8": { name: VCC, type: power }
