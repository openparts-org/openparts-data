# MCP1700 low quiescent current LDO, 6-lead 2x2 DFN (MAY) pinout. From
# DS20001826E Table 3-1 "Pin Function Table" (page 11), column "2x2
# DFN-6": VIN 1, NC 2/4/5, GND 3, VOUT 6, EP 7; checked against the
# "Package Types" figure "2x2 DFN-6*" (page 1).
# Exposed pad: section 3.5 "There is an internal electrical connection
# between the Exposed Thermal Pad (EP) and the GND pin" -> key "EP"
# (the table's pin 7), name GND, type ground, connected_to pin 3.
# NC "No Connect" (section 3.4: "No internal connection") -> nc.
# VIN/VOUT power, as in microchip/MCP1700-TT.
schema_version: "0.2"
kind: device
id: microchip/MCP1700-MAY
manufacturer: microchip
category: linear_regulator
family: MCP1700
source: microchip/DS20001826@revE

parameters:
  input_voltage_max:
    max: 6 V
    src: 'p3 "DC Characteristics, Input Operating Voltage VIN: Max 6.0 V"'

pins:
  src:
    - p11 "Table 3-1 "Pin Function Table", column "2x2 DFN-6"; section 3.5 "Exposed Thermal Pad (EP)""
    - p1 ""Package Types", 2x2 DFN-6*"
  "1": { name: VIN, type: power }
  "2": { name: NC, type: nc }
  "3": { name: GND, type: ground }
  "4": { name: NC, type: nc }
  "5": { name: NC, type: nc }
  "6": { name: VOUT, type: power }
  EP:  { name: GND, type: ground, connected_to: "3" }
