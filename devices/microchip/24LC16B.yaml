# 16-Kbit I2C serial EEPROM (2.5 V 24LC16B of the 24AA16/24LC16B/24FC16
# family). Pinout from DS20001703R Table 2-1 "Pin Function Table" (page
# 7), PDIP/SOIC columns; the MSOP, TSSOP and the DFN/TDFN/UDFN/VDFN
# columns give the same numbers, so this device covers them; the exposed
# pad "can be connected to VSS or left floating" (note 1) -> no EP pin.
# The SOT-23 numbering is not covered. A0, A1, A2 are "Not Connected"
# ("not used by the 24XX16", section 2.1) -> type nc, names kept (as
# microchip/24LC02B). WP, SCL -> input; SDA -> io.
schema_version: "0.2"
kind: device
id: microchip/24LC16B
manufacturer: microchip
category: eeprom
family: 24AA16/24LC16B/24FC16
source: microchip/DS20001703@revR

# Parameters (AI candidates, needs review).
parameters:
  capacity:
    typ: 16 Kbit
    src: 'p1 "Description: 24XX16 is a 16-Kbit EEPROM, eight blocks of 256 x 8-bit"'
  supply_voltage:
    min: 2.5 V
    max: 5.5 V
    src: p1 "Device Selection Table, 24LC16B VCC Range 2.5V-5.5V"

pins:
  src: p7 "Table 2-1 "Pin Function Table", columns PDIP and SOIC (MSOP, TSSOP, DFN, TDFN, UDFN, VDFN give the same numbers)"
  "1": { name: A0, type: nc }
  "2": { name: A1, type: nc }
  "3": { name: A2, type: nc }
  "4": { name: VSS, type: ground }
  "5": { name: SDA, type: io }
  "6": { name: SCL, type: input }
  "7": { name: WP, type: input }
  "8": { name: VCC, type: power }
