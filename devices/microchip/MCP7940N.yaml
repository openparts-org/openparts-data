# I2C real-time clock/calendar with SRAM (MCP7940N). Pin map from Table
# 3-1 "Pin Function Table" (DS20005010H page 8): the SOIC, MSOP, TSSOP,
# TDFN and PDIP columns are identical (1-8); the TDFN exposed pad ("can
# be connected to Vss or left floating") has no pin here. Names as
# printed in the table ("Vss", "Vcc"). X1/X2 (crystal input/output,
# X1 also external clock input) typed clock; MFP (open-drain
# multifunction output, section 3.4) output; SCL ("Serial Clock")
# clock; VBAT (backup supply input) power.
schema_version: "0.1"
kind: device
id: microchip/MCP7940N

manufacturer: microchip
category: other
family: MCP7940N

pins:
  "1":  { name: X1, type: clock }
  "2":  { name: X2, type: clock }
  "3":  { name: VBAT, type: power }
  "4":  { name: Vss, type: ground }
  "5":  { name: SDA, type: io }
  "6":  { name: SCL, type: clock }
  "7":  { name: MFP, type: output }
  "8":  { name: Vcc, type: power }

provenance:
  "/pins":
    - source: microchip/DS20005010@revH
      page: 8
      locator: "Table 3-1 \"Pin Function Table\", column \"8-pin SOIC\""
