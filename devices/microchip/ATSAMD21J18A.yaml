# ATSAMD21J18A (SAM D21J, 256KB flash / 32KB SRAM, variant A) pinout for
# the 64-pin QFN64/TQFP64 packages, from data sheet DS40001882L section
# 5.1.1 "QFN64 / TQFP64" (SAM D21J, page 18; text extraction read in pin
# order), cross-checked against Table 7-1 "PORT Function Multiplexing"
# SAMD2xJ pin column (pages 28-29): every port pin's number agrees.
# Types: PA00/PA01 (XIN32/XOUT32) and PA14/PA15 (XIN/XOUT) stay `io`
# because they are general-purpose port pins; VDDCORE is the "regulated
# output supply" (figure legend) -> power; VDDIN/VDDIO/VDDANA power;
# GNDANA/GND -> ground; RESET -> reset.
# `alternate_functions` lists only the ADC AIN[n] channels from Table
# 7-1's ADC column (AIN0-AIN19); EIC/SERCOM/TC/PTC functions are not listed.
# Exposed pad (QFN64): as for ATSAMD21G18A, no page of this data sheet
# says what it must be connected to, so no "EP" pin is recorded.
schema_version: "0.2"
kind: device
id: microchip/ATSAMD21J18A
manufacturer: microchip
category: microcontroller
family: SAM D21
source: microchip/DS40001882@revL

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.62 V
    max: 3.63 V
    src: p907 "Table 37-3 General Operating Conditions, VDD Power supply voltage"

