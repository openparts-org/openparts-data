# 64-Kbit I2C serial EEPROM (2.5 V 24LC64 of the 24AA64/24FC64/24LC64
# family). Pinout from DS20001189V Table 2-1 "Pin Function Table" (page
# 6), PDIP/SOIC columns; the MSOP, SOIJ, TSSOP, DFN and TDFN columns give
# the same numbers, so this device covers them; the DFN/TDFN exposed pad
# "can be connected to VSS or left floating" (note 1) -> no EP pin. The
# CS, SOT-23 and rotated-TSSOP (24LC64X) numberings are not covered.
# Types as in microchip/24LC02B: A0-A2, WP, SCL -> input; SDA -> io.
schema_version: "0.2"
kind: device
id: microchip/24LC64
manufacturer: microchip
category: eeprom
family: 24AA64/24FC64/24LC64
source: microchip/DS20001189@revV

# Parameters (AI candidates, needs review).
parameters:
  capacity:
    typ: 64 Kbit
    src: 'p1 "Description: 24XX64 is a 64-Kbit EEPROM, single block of 8K x 8-bit"'
  supply_voltage:
    min: 2.5 V
    max: 5.5 V
    src: p1 "Device Selection Table, 24LC64 VCC Range 2.5V-5.5V"

pins:
  src: p6 "Table 2-1 "Pin Function Table", columns PDIP and SOIC (MSOP, SOIJ, TSSOP, DFN, TDFN give the same numbers)"
  "1": { name: A0, type: input }
  "2": { name: A1, type: input }
  "3": { name: A2, type: input }
  "4": { name: VSS, type: ground }
  "5": { name: SDA, type: io }
  "6": { name: SCL, type: input }
  "7": { name: WP, type: input }
  "8": { name: VCC, type: power }
