# ATtiny814 (14-pin SOIC, the only package offered for it per Table 38.1
# of DS40002288A). Pin names/numbers from Table 5-1 "PORT Function
# Multiplexing", column "SOIC 14-Pin" (page 19, text), cross-checked
# against section 4.1 "14-Pin SOIC" (page 15).
#
# Types: VDD power, GND ground, port pins io. PA0 carries RESET/UPDI
# (programming/debug) as alternate functions per the table's
# "Other/Special" column. alternate_functions carry only the
# "Other/Special" and "ADC0" columns; the other peripheral columns are
# not modelled.
schema_version: "0.2"
kind: device
id: microchip/ATtiny814
manufacturer: microchip
category: microcontroller
family: tinyAVR 1-series
source: microchip/DS40002288@revA

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.8 V
    max: 5.5 V
    src: p505 "Table 36-2 General Operating Conditions, VDD Operating supply voltage"

pins:
  src:
    - p19 "Table 5-1 "PORT Function Multiplexing", column "SOIC 14-Pin", columns "Other/Special" and "ADC0""
    - p15 "Section 4.1 "14-Pin SOIC" pinout figure (cross-check)"
  "1":  { name: VDD, type: power }
  "2":  { name: PA4, type: io, alternate_functions: [AIN4] }
  "3":  { name: PA5, type: io, alternate_functions: [AIN5] }
  "4":  { name: PA6, type: io, alternate_functions: [AIN6] }
  "5":  { name: PA7, type: io, alternate_functions: [AIN7] }
  "6":  { name: PB3, type: io, alternate_functions: [TOSC1] }
  "7":  { name: PB2, type: io, alternate_functions: [TOSC2, EVOUT1] }
  "8":  { name: PB1, type: io, alternate_functions: [AIN10] }
  "9":  { name: PB0, type: io, alternate_functions: [AIN11] }
  "10": { name: PA0, type: io, alternate_functions: [RESET, UPDI, AIN0] }
  "11": { name: PA1, type: io, alternate_functions: [AIN1] }
  "12": { name: PA2, type: io, alternate_functions: [EVOUT0, AIN2] }
  "13": { name: PA3, type: io, alternate_functions: [EXTCLK, AIN3] }
  "14": { name: GND, type: ground }
