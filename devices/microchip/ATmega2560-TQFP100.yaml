# ATmega640/1280/2560 100-lead TQFP pinout, read from Figure 1-1
# "TQFP-pinout ATmega640/1280/2560" (DS40002211A PDF page 2, rendered and
# read: the rotated top/bottom labels do not extract cleanly as text).
# Covers ATmega2560 and ATmega2560V in the 100A TQFP; the 100C1 CBGA has
# its own ball map (not recorded).
# Names are the port names (the label outside the parentheses); VCC,
# AVCC power, GND ground, AREF analog, RESET reset, XTAL1/XTAL2 clock.
# `alternate_functions` lists only the ADC channels printed in
# parentheses (PF0-PF7 = ADC0-7, PK0-PK7 = ADC8-15); other functions
# (PCINT, timers, USART, JTAG, external memory) are not listed.
