# ATSAMD21G18A (SAM D21G, 256KB flash / 32KB SRAM, variant A) pinout for
# the 48-pin QFN48/TQFP48 packages, from data sheet DS40001882L section
# 5.2.1 "QFN48 / TQFP48" (SAM D21GxxA/B/D, page 20; image and text
# extraction agree), cross-checked against Table 7-1 "PORT Function
# Multiplexing" SAMD2xG pin column (pages 28-29).
# Types: PA00/PA01 (XIN32/XOUT32) and PA14/PA15 (XIN/XOUT) stay `io`
# because they are general-purpose port pins; VDDCORE is the "regulated
# output supply" (page 20 legend) -> power; GNDANA/GND -> ground.
# `alternate_functions` lists only the ADC AIN[n] channels from Table
# 7-1's ADC column; EIC/SERCOM/TC/PTC functions are not listed.
# Exposed pad: the QFN48 drawing (page 1092) has a 5.15mm exposed pad,
# but no page of this data sheet says what it must be connected to, so
# no "EP" pin is recorded (unknown, not guessed as GND).
schema_version: "0.2"
kind: device
id: microchip/ATSAMD21G18A
manufacturer: microchip
category: microcontroller
family: SAM D21
source: microchip/DS40001882@revL

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 1.62 V
    max: 3.63 V
    src: p907 "Table 37-3 General Operating Conditions, VDD Power supply voltage"

pins:
