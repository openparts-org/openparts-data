    name:
      value: PA00
      src: p20 "Section 5.2.1 "QFN48 / TQFP48" pinout (SAM D21GxxA/B/D), all 48 pins"
    type: io
  "2":  { name: PA01, type: io }
  "3":
    name: PA02
    type: io
    alternate_functions:
      value: [AIN0]
      src:   p28 "Table 7-1 "PORT Function Multiplexing ...", SAMD2xG column + ADC column (continued p29)"
  "4":  { name: PA03, type: io, alternate_functions: [AIN1] }
