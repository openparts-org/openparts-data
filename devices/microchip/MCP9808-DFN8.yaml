# Digital temperature sensor with I2C/SMBus interface (MCP9808). Pin numbers from
# Table 3-1 Pin Function Table (DS25095A page 11), column DFN, checked against the
# Package Types figure on page 1.
# Exposed pad: Table 3-1 lists DFN pin 9 EP, Exposed Thermal Pad, must be connected to
# GND -> key EP, name EP, type passive (a board-level connection; as microchip/MCP1640-DFN8).
schema_version: "0.2"
kind: device
id: microchip/MCP9808-DFN8
manufacturer: microchip
category: temperature_sensor
family: MCP9808
source: microchip/DS25095@revA

# Parameters (AI candidates, needs review).
parameters:
  supply_voltage:
    min: 2.7 V
    max: 5.5 V
    src: p3 "DC Characteristics, Operating Voltage Range VDD"
  supply_current:
    typ: 200 µA
    max: 400 µA
    src: p3 "DC Characteristics, Operating Current IDD"
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: p4 "Temperature Ranges, Specified Temperature Range TA -40 to +125 C (specified)"

pins:
  src: ['p11 "Table 3-1 Pin Function Table, column DFN"', 'p1 "Package Types, 8-Pin 2x3 DFN"']
  "1": { name: SDA, type: io }
  "2": { name: SCL, type: clock }
  "3": { name: Alert, type: output }
  "4": { name: GND, type: ground }
  "5": { name: A2, type: input }
  "6": { name: A1, type: input }
  "7": { name: A0, type: input }
  "8": { name: VDD, type: power }
  EP:  { name: EP, type: passive }
