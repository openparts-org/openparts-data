# Single-cell Li-Ion/Li-Po charge controller, SOT-23-5 pinout. From
# DS20001984H Table 3-1 "Pin Function Tables" (page 11), SOT-23-5
# column, cross-checked with the "Package Types" SOT-23-5 figure on
# page 1 (STAT 1, VSS 2, VBAT 3 on one side; VDD 4, PROG 5 opposite).
# The DFN pinout differs and is not covered by this device.
schema_version: "0.2"
kind: device
id: microchip/MCP73831
manufacturer: microchip
category: battery_charger
family: MCP73831/2
source: microchip/DS20001984@revH

parameters:
  input_voltage_max: { max: 6 V, src: 'p3 "DC Characteristics, Supply Voltage VDD: Max 6 V"' }
  output_current:
    max: 500 mA
    src: 'p1 "Features, "Programmable Charge Current: 15 mA to 500 mA""'

pins:
  src:
    - p11 "Table 3-1 "Pin Function Tables", SOT-23-5 column"
    - p1 ""Package Types", MCP73831/2 SOT-23-5"
  "1": { name: STAT, type: output }
  "2": { name: VSS, type: ground }
  "3": { name: VBAT, type: power }
  "4": { name: VDD, type: power }
  "5": { name: PROG, type: analog }
