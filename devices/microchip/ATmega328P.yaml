# Pinout transcribed from Microchip datasheet DS40002061 Rev B, Figure
# 1-1 "Pinout ATmega48A/PA/88A/PA/168A/PA/328/P" (page 12), specifically
# its "32 TQFP Top View" diagram (the same 8-pin-per-side pinout is also
# shared by the 32-pad VQFN package, per the same figure). Read from a
# rendered image of the page, not raw text extraction -- the diagram's
# per-pin labels are drawn rotated/mirrored along three of the four
# edges, which pypdf/pdfplumber's coordinate-based text extraction
# could not be reliably reordered back into pin sequence, per the
# verified-data-entry skill's guidance to fall back to reading a
# rendered image directly rather than guess from ambiguous extraction.
#
# `name` uses each pin's Port B/C/D GPIO label (e.g. "PB5"), matching
# the diagram's primary (non-parenthesized) label. ADC6/ADC7/AREF have
# no GPIO port name at all -- confirmed via section 1.1.9 (page 14):
# "ADC7:6 (TQFP and VQFN Package Only) ... these pins are powered from
# the analog supply and serve as 10-bit ADC channels" -- so those three
# are `type: analog` rather than `io`.
#
# `alternate_functions` is populated only with each pin's ADC input
# channel where one exists on a Port-named pin (PC0-PC5) -- not the
# full PCINTn/OCxx/SPI/USART/TWI/comparator alternate-function set also
# present on these and other pins, out of scope for this pass.
