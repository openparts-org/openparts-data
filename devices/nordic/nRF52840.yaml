# Pinout transcribed from Nordic Semiconductor nRF52840 Product
# Specification 4413_417 v1.11, section 7.1.2 "QFN48 pin assignments"
# (Table 62, pages 930-931). Not the aQFN73 variant (section 7.1.1) --
# aQFN73 uses BGA-style alphanumeric ball positions (an area-array
# package, e.g. "A8", "B1"), which openparts-mcad's QFN generator
# cannot represent (it only models perimeter packages with
# sequentially-numbered leads); QFN48 uses real sequential 1-48
# perimeter numbering that fits the existing generator directly. Real,
# separately orderable part -- not a substitute or approximation (see
# parts/nordic/nrf52840/nRF52840-QFAA-F-R.yaml's own note on the
# QFN48-specific limitations this variant carries: no USBD, VDD/VDDH
# shorted internally).
#
# `name` uses each pin's GPIO port.pin label (e.g. "P0.00") where one
# exists; a handful of pins (SWDIO/SWDCLK/ANT/XC1/XC2/NC/DCC/DEC1-6 and
# the VDD/VSS/VSS_PA supply pins) have no GPIO name at all, per the
# table's own "Pin Name" column.
#
# `type: clock` is used only for XC1/XC2 (the 32MHz crystal pins, no
# GPIO name, Table 62's own Function column: "Analog input") -- P0.00/
# XL1 and P0.01/XL2 (the 32.768kHz crystal pins) keep `type: io` since
# they DO have a real GPIO name, mirroring this dataset's STM32F103C8
# PC14-OSC32_IN/PC15-OSC32_OUT precedent (a dedicated non-GPIO
# oscillator pin is `clock`; a GPIO pin that merely defaults to an
# oscillator function is `io`).
#
# `alternate_functions` is populated only with each pin's AINx analog
# input channel where the table lists one (P0.02/.03/.04/.05/.28/.29/
# .30/.31) -- not the full TRACEDATA/TRACECLK/NFC/QSPI alternate-
# function set also present on these and other pins, out of scope for
# this pass, matching this dataset's other MCU devices.
#
# The exposed die pad (Table 62: "Die pad VSS ... must be connected to
# ground") is modeled as pin key "EP" per Canonical Data Specification
# section 14, matching RP2040's own exposed-pad convention -- its
# numeric footprint outline isn't given in this document either (see
# the package file), so it produces no separate footprint lead, only
# the electrical fact that it exists and must be grounded.
