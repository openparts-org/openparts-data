# RA4M1 (R7FA4M1AB: 256 KB code flash, 8 KB data flash, 32 KB SRAM) in
# the 48-pin LQFP. Pin names are the labels of Figure 1.7 "Pin assignment
# for 48-pin LQFP (top view)" (page 20). Pin numbers cross-checked by
# script against "1.7 Pin Lists" (pages 23-26), column "LQFP48", I/O-port /
# power-system columns: all 48 pins matched, zero discrepancies.
# Pin types: VSS/VSS_USB/AVSS0 ground; VCC/VCC_USB/VCC_USB_LDO/AVCC0/VBATT/VCL
# power (VCL is the internal-regulator capacitor pin); RES reset; P200, P214
# and P215 input (the datasheet's notes "Except for ports P200, P214, P215,
# which are input ports"); every other port io. Peripheral alternate
# functions (Pin Lists columns) are not modelled, same policy as the other
# MCU devices in this dataset.
schema_version: "0.2"
kind: device
id: renesas/R7FA4M1AB-LQFP48
manufacturer: renesas
category: microcontroller
family: RA4M1
source: renesas/R01DS0355EJ0110

# Parameters (AI candidates, needs review).
