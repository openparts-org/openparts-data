# RA2E1 (R7FA2E1A9: 128 KB code flash, 4 KB data flash, 16 KB SRAM) in
# the 32-pin HWQFN. Pin names are the labels of Figure 1.7 "Pin
# assignment for LQFP/QFN 32-pin (top view)" (page 19); LQFP and QFN
# share this pinout. Pin numbers cross-checked by script against Table
# 1.15 "Pin list" (pages 21-23), column "32-pin LQFP/QFN": all 32 pins
# matched, zero discrepancies.
#
# No "EP" pin: the figure only says "Exposed die pad of QFN is recommended
# to connect to VSS or Open" -- that is a board recommendation, not a
# stated internal connection, so the pad's net is left unknown.
# Pin types: VSS/VSS_USB/AVSS0 ground; VCC/VCC_USB/VCC_USB_LDO/AVCC0/VBATT/VCL
# power (VCL is the internal-regulator capacitor pin); RES reset; P200, P214
# and P215 input (the datasheet's notes "Except for ports P200, P214, P215,
# which are input ports"); every other port io. Peripheral alternate
# functions (Pin Lists columns) are not modelled, same policy as the other
# MCU devices in this dataset.
