# 10-lead MSOP, 3.0 x 3.0 mm body, 0.5 mm pitch (TI calls it VSSOP,
# package "DGS"; the drawing's note 5 references JEDEC MO-187 variation
# BA). All values read from the rendered "PACKAGE OUTLINE DGS0010A"
# drawing (4221984/A 05/2015, "VSSOP - 1.1 mm max height") in the INA226
# datasheet SBOS547C, PDF page 38.
#
# Named with the -TI-DGS suffix because the numbers are TI's drawing
# tolerances, not the JEDEC table itself. The drawing gives E1 and D only
# as limits (both 3.1/2.9): `nominal` for body_width/body_length is this
# dataset's own midpoint, not datasheet-stated. Lead span E is printed
# "5.05/4.75 TYP" and lead thickness "0.23/0.13 TYP"; both recorded as
# min/max only. Only the overall height A (1.1 MAX) is given -- no A2 --
# so it is recorded as overall_height max, with no body_height.
schema_version: "0.1"
kind: package
id: standards/MSOP10-3.0x3.0-P0.5-TI-DGS

family: msop
lead_count: 10

pitch:
  nominal: 0.5
  unit: mm

dimensions:
  body_width:
    min: 2.9
    max: 3.1
    unit: mm
  body_length:
    min: 2.9
    max: 3.1
    unit: mm
  overall_width:
    min: 4.75
    max: 5.05
    unit: mm
  overall_height:
    max: 1.1
    unit: mm
  standoff:
    min: 0.05
    max: 0.15
    unit: mm
  lead_width:
    min: 0.17
    max: 0.27
    unit: mm
  lead_length:
    min: 0.4
    max: 0.7
    unit: mm
  lead_thickness:
    min: 0.13
    max: 0.23
    unit: mm

geometry:
  type: parametric
  generator: msop

provenance:
  "/pitch":
    - source: ti/SBOS547C
      page: 38
      locator: "PACKAGE OUTLINE DGS0010A (4221984/A), \"8X 0.5\" (boxed basic dimension)"
  "/dimensions/body_width":
    - source: ti/SBOS547C
      page: 38
      locator: "PACKAGE OUTLINE DGS0010A, body width \"3.1/2.9 NOTE 4\" (datum B); no nominal stated (min/max only)"
  "/dimensions/body_length":
    - source: ti/SBOS547C
      page: 38
      locator: "PACKAGE OUTLINE DGS0010A, body length \"3.1/2.9 NOTE 3\" (datum A); no nominal stated (min/max only)"
  "/dimensions/overall_width":
    - source: ti/SBOS547C
      page: 38
      locator: "PACKAGE OUTLINE DGS0010A, lead tip span \"5.05/4.75 TYP\" (min/max only)"
  "/dimensions/overall_height":
    - source: ti/SBOS547C
      page: 38
      locator: "PACKAGE OUTLINE DGS0010A, side view \"1.1 MAX\""
  "/dimensions/standoff":
    - source: ti/SBOS547C
      page: 38
      locator: "PACKAGE OUTLINE DGS0010A, DETAIL A \"0.15/0.05\""
  "/dimensions/lead_width":
    - source: ti/SBOS547C
      page: 38
      locator: "PACKAGE OUTLINE DGS0010A, \"10X 0.27/0.17\""
  "/dimensions/lead_length":
    - source: ti/SBOS547C
      page: 38
      locator: "PACKAGE OUTLINE DGS0010A, DETAIL A \"0.7/0.4\""
  "/dimensions/lead_thickness":
    - source: ti/SBOS547C
      page: 38
      locator: "PACKAGE OUTLINE DGS0010A, side view \"0.23/0.13 TYP\" (min/max only)"
