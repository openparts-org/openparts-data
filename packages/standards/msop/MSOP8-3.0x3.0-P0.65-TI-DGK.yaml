# NOTE (2026-11-10): the midpoint nominals mentioned below were removed;
# only the printed min/max are recorded and generators draw at the
# midpoint without storing it (openparts-mcad defaults::required).
# 8-lead MSOP, 3.0 x 3.0 mm body, 0.65 mm pitch (TI calls it VSSOP,
# package "DGK"; JEDEC MO-187 referenced by the drawing's note 5). All
# values read from the rendered "PACKAGE OUTLINE DGK0008A" drawing
# (4214862/A 04/2023, "VSSOP - 1.1 mm max height") in the OPA2333
# datasheet SBOS351E, PDF page 36.
#
# Named with the -TI-DGK suffix because the numbers are TI's drawing
# tolerances, not the JEDEC table itself. The drawing gives E1 and D only
# as limits (both 3.1/2.9): `nominal` for body_width/body_length is this
# dataset's own midpoint, not datasheet-stated. Lead span E is printed
# "5.05/4.75 TYP" and recorded as min/max only. Only the overall height A
# (1.1 MAX) is given -- no A2 -- so it is recorded as overall_height max,
# with no body_height.
schema_version: "0.1"
kind: package
id: standards/MSOP8-3.0x3.0-P0.65-TI-DGK

family: msop
lead_count: 8

pitch:
  nominal: 0.65
  unit: mm

dimensions:
  body_width:
    min: 2.9
    max: 3.1
    unit: mm
  body_length:
    min: 2.9
    max: 3.1
    unit: mm
  overall_width:
    min: 4.75
    max: 5.05
    unit: mm
  overall_height:
    max: 1.1
    unit: mm
  standoff:
    min: 0.05
    max: 0.15
    unit: mm
  lead_width:
    min: 0.25
    max: 0.38
    unit: mm
  lead_length:
    min: 0.4
    max: 0.7
    unit: mm
  lead_thickness:
    min: 0.13
    max: 0.23
    unit: mm

geometry:
  type: parametric
  generator: msop

provenance:
  "/pitch":
    - source: ti/SBOS351E
      page: 36
      locator: "PACKAGE OUTLINE DGK0008A (4214862/A), \"6X 0.65\" (boxed basic dimension)"
  "/dimensions/body_width":
    - source: ti/SBOS351E
      page: 36
      locator: "PACKAGE OUTLINE DGK0008A, body width \"3.1/2.9 NOTE 4\" (datum B); no nominal stated (min/max only)"
  "/dimensions/body_length":
    - source: ti/SBOS351E
      page: 36
      locator: "PACKAGE OUTLINE DGK0008A, body length \"3.1/2.9 NOTE 3\" (datum A); no nominal stated (min/max only)"
  "/dimensions/overall_width":
    - source: ti/SBOS351E
      page: 36
      locator: "PACKAGE OUTLINE DGK0008A, lead tip span \"5.05/4.75 TYP\" (min/max only)"
  "/dimensions/overall_height":
    - source: ti/SBOS351E
      page: 36
      locator: "PACKAGE OUTLINE DGK0008A, DETAIL A \"1.1 MAX\""
  "/dimensions/standoff":
    - source: ti/SBOS351E
      page: 36
      locator: "PACKAGE OUTLINE DGK0008A, DETAIL A \"0.15/0.05\""
  "/dimensions/lead_width":
    - source: ti/SBOS351E
      page: 36
      locator: "PACKAGE OUTLINE DGK0008A, \"8X 0.38/0.25\""
  "/dimensions/lead_length":
    - source: ti/SBOS351E
      page: 36
      locator: "PACKAGE OUTLINE DGK0008A, DETAIL A \"0.7/0.4\""
  "/dimensions/lead_thickness":
    - source: ti/SBOS351E
      page: 36
      locator: "PACKAGE OUTLINE DGK0008A, side view \"0.23/0.13\""
