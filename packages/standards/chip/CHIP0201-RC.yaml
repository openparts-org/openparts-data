# Yageo RC0201 chip resistor body, from the Dimensions section of the
# RC0201 specification (page 1). Electrode dimensions (B1, B2) are not
# body dimensions and are not used.
schema_version: "0.2"
kind: package
id: standards/CHIP0201-RC
family: chip
lead_count: 2
source: yageo/RC0201-SPEC

pitch: { unit: mm }
geometry: { type: parametric, generator: chip }

dimensions:
  body_width:  { min: 0.27 mm, typ: 0.3 mm, max: 0.33 mm, src: 'p1 "Dimensions, W 0.3 +/-0.03mm"' }
  body_length: { min: 0.57 mm, typ: 0.6 mm, max: 0.63 mm, src: 'p1 "Dimensions, L 0.6 +/-0.03mm"' }
  body_height: { min: 0.2 mm, typ: 0.23 mm, max: 0.26 mm, src: 'p1 "Dimensions, T 0.23 +/-0.03mm"' }
