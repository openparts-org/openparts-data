# NOTE (2026-11-10): nominals this dataset had derived (a min/max
# midpoint, or a copy of a lone max/min) were removed; only what the
# source prints is recorded. Generators draw a min/max-only dimension at
# its midpoint and a lone limit at that limit, without storing either.
# Epson FC-13A 2-pad crystal, 3.2 x 1.5 mm body. Height is max-only (0.9mm
# on the brief sheet's External dimensions), so `nominal` equals that max,
# the same technique as the other max-only crystal packages.
schema_version: "0.2"
kind: package
id: standards/CHIP-EPSON-FC13A
family: chip
lead_count: 2
source: epson/FC-13A-BRIEF

pitch: { unit: mm }
geometry: { type: parametric, generator: chip }

dimensions:
  body_width:
    min: 1.4 mm
    typ: 1.5 mm
    max: 1.6 mm
    src: p1 "External dimensions, 1.5 +/-0.1mm"
  body_length:
    min: 3.1 mm
    typ: 3.2 mm
    max: 3.3 mm
    src: p1 "External dimensions, 3.2 +/-0.1mm"
  body_height: { max: 0.9 mm, src: 'p1 "External dimensions, 0.9 Max, no min stated"' }
