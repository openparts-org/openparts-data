# NOTE (2026-11-10): nominals this dataset had derived (a min/max
# midpoint, or a copy of a lone max/min) were removed; only what the
# source prints is recorded. Generators draw a min/max-only dimension at
# its midpoint and a lone limit at that limit, without storing either.
# Epson FC-135, 3.2x1.5mm 2-terminal SMD crystal can -- confirmed as
# genuinely 2-pad (not the more common 4-pad SMD crystal/oscillator
# style) by visually inspecting the datasheet's own outline drawing and
# pin-connection table (both pads are crystal electrodes, no separate
# GND/mechanical pad exists).
schema_version: "0.2"
kind: package
id: standards/CHIP-FC135
family: chip
lead_count: 2
source: epson/FC-135_E_Ver2.0

pitch: { unit: mm }
geometry: { type: parametric, generator: chip }

# `nominal` set equal to the datasheet's stated max (0.9mm), not a
# midpoint (no min given) -- the `chip` generator falls back to a
# generic 0.45mm default when nominal is absent, which would
# silently discard this real 0.9mm fact; using it directly instead.
dimensions:
  body_width:
    min: 1.4 mm
    typ: 1.5 mm
    max: 1.6 mm
    src: p1 "Outline drawing, "1.5 +/- 0.1mm""
  body_length:
    min: 3.1 mm
    typ: 3.2 mm
    max: 3.3 mm
    src: p1 "Outline drawing, "3.2 +/- 0.1mm""
  body_height:
    max: 0.9 mm
    src: p1 "Outline drawing, "t = 0.9mm Max." -- no min/nominal stated"
