# (0.6mm) -- no min given on this drawing -- same "closest usable
# single number" technique as AXIAL-DO35-1N4148's body_height.
schema_version: "0.1"
kind: package
id: standards/CHIP-ECX12

family: chip
lead_count: 2

pitch:
  unit: mm

dimensions:
  body_length:
    nominal: 2.0
    min: 1.9
    max: 2.1
    unit: mm
  body_width:
    nominal: 1.2
    min: 1.1
    max: 1.3
    unit: mm
  body_height:
    nominal: 0.6
    max: 0.6
    unit: mm

geometry:
  type: parametric
  generator: chip

provenance:
  "/dimensions/body_length":
    - source: ecs/ECX_12
      page: 1
      locator: "\"DIMENSIONS (mm)\" outline drawing, length 2.0 +/-0.1mm"
  "/dimensions/body_width":
    - source: ecs/ECX_12
      page: 1
      locator: "\"DIMENSIONS (mm)\" outline drawing, width 1.2 +/-0.1mm"
  "/dimensions/body_height":
    - source: ecs/ECX_12
      page: 1
      locator: "\"DIMENSIONS (mm)\" outline drawing, height 0.6mm MAX, no min stated -- see comment above"
