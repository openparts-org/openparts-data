# NOTE (2026-11-10): nominals this dataset had derived (a min/max
# midpoint, or a copy of a lone max/min) were removed; only what the
# source prints is recorded. Generators draw a min/max-only dimension at
# its midpoint and a lone limit at that limit, without storing either.
# ECS ECX-12 package, 2-pad SMD tuning fork crystal can.
# `nominal` on body_height is set equal to the datasheet's stated max
# (0.6mm) -- no min given on this drawing -- same "closest usable
# single number" technique as AXIAL-DO35-1N4148's body_height.
schema_version: "0.2"
kind: package
id: standards/CHIP-ECX12
family: chip
lead_count: 2
source: ecs/ECX_12

pitch: { unit: mm }
geometry: { type: parametric, generator: chip }

dimensions:
  body_width:
    min: 1.1 mm
    typ: 1.2 mm
    max: 1.3 mm
    src: p1 ""DIMENSIONS (mm)" outline drawing, width 1.2 +/-0.1mm"
  body_length:
    min: 1.9 mm
    typ: 2 mm
    max: 2.1 mm
    src: p1 ""DIMENSIONS (mm)" outline drawing, length 2.0 +/-0.1mm"
  body_height:
    max: 0.6 mm
    src: p1 ""DIMENSIONS (mm)" outline drawing, height 0.6mm MAX, no min stated -- see comment above"
