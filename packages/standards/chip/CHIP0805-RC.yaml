# Yageo RC0805 series body dimensions, from the RC_L datasheet's
# "DIMENSION" table (Table 1, page 4) -- same document as the existing
# yageo/PYU-RC_GROUP@V14 source used for RC0402 and RC1206.
schema_version: "0.2"
kind: package
id: standards/CHIP0805-RC
family: chip
lead_count: 2
source: yageo/PYU-RC_GROUP@V14

pitch: { unit: mm }
geometry: { type: parametric, generator: chip }

dimensions:
  body_width:
    min: 1.15 mm
    typ: 1.25 mm
    max: 1.35 mm
    src: p4 "Table 1 "DIMENSION", RC0805 row, W = 1.25 +/-0.10mm"
  body_length:
    min: 1.9 mm
    typ: 2 mm
    max: 2.1 mm
    src: p4 "Table 1 "DIMENSION", RC0805 row, L = 2.00 +/-0.10mm"
  body_height:
    min: 0.4 mm
    typ: 0.5 mm
    max: 0.6 mm
    src: p4 "Table 1 "DIMENSION", RC0805 row, H = 0.50 +/-0.10mm"
