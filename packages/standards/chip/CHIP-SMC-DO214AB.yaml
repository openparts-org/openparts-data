# NOTE (2026-11-10): the derived midpoint nominals mentioned below have
# been removed -- only the min/max the source states are recorded
# (Canonical Data Specification 7, 20.1). Generators draw a min/max-only
# dimension at its midpoint without storing it (openparts-mcad
# defaults::required).
# Vishay SMC (DO-214AB) outline, from the rendered "PACKAGE OUTLINE
# DIMENSIONS in inches (millimeters)" figure of document 88751 page 3
# (values below are the printed mm figures). Only max/min pairs are
# printed; the chip generator requires a nominal body length/width, so
# `nominal` on body_length, body_width and body_height is this dataset's
# midpoint, DERIVED (same technique as CHIP-SMA-DO214AC).
#
# Mapping: body_length = molded body along the terminal axis (7.11/6.60),
# body_width = body across (6.22/5.59), body_height = seating plane to
# top (2.62/2.06, the drawing's only height), overall_length = lead-tip
# span (8.13/7.75), lead_width = terminal width (3.20/2.90),
# lead_length = terminal foot (1.52/0.76), lead_thickness (0.305/0.152),
# standoff = body-to-seating gap (0.2/0).
# construction: molded -- datasheet MECHANICAL DATA (page 1) says
# "Molding compound meets UL 94 V-0".
