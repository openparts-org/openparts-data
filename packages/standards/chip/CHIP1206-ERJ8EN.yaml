  body_length:
    min: 3 mm
    typ: 3.2 mm
    max: 3.25 mm
    src: 'p4 "Dimensions table, row ERJ8EN, column L: 3.20+0.05/-0.20"'
  body_height:
    min: 0.5 mm
    typ: 0.6 mm
    max: 0.7 mm
    src: 'p4 "Dimensions table, row ERJ8EN, column T: 0.60±0.10"'
  lead_length:
