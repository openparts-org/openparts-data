# KOA RK73H, size code "1J" (EIA 0603 per the datasheet's own
# "Parentheses indicate EIA package size codes" note). Read from the
# rendered page-1 "dimensions and construction" table, row "1J (0603)"
# (not the separate "1J AT" anti-sulfur row, whose c/d differ).
#   L .063+/-.008 (1.6+/-0.2)  W .031+/-.004 (0.8+/-0.1)
#   c .012+/-.004 (0.3+/-0.1)  d .012+/-.004 (0.3+/-0.1)
#   t .018+/-.004 (0.45+/-0.1)
# c (top electrode length) is recorded as lead_length; the bottom
# electrode d has the same value for this size.
schema_version: "0.2"
kind: package
id: standards/CHIP0603-KOA-RK73H1J
family: chip
lead_count: 2
source: koa/RK73H

pitch: { unit: mm }
geometry: { type: parametric, generator: chip }

dimensions:
  body_width:
    min: 0.7 mm
    typ: 0.8 mm
    max: 0.9 mm
    src: 'p1 ""dimensions and construction" table, row 1J (0603), column W: ".031+/-.004 (0.8+/-0.1)""'
  body_length:
    min: 1.4 mm
    typ: 1.6 mm
    max: 1.8 mm
    src: 'p1 ""dimensions and construction" table, row 1J (0603), column L: ".063+/-.008 (1.6+/-0.2)""'
  body_height:
    min: 0.35 mm
    typ: 0.45 mm
    max: 0.55 mm
    src: 'p1 ""dimensions and construction" table, rows 1J/1J AT (0603), column t: ".018+/-.004 (0.45+/-0.1)""'
  lead_length:
    min: 0.2 mm
    typ: 0.3 mm
    max: 0.4 mm
    src: 'p1 ""dimensions and construction" table, row 1J (0603), column c (top electrode): ".012+/-.004 (0.3+/-0.1)""'
