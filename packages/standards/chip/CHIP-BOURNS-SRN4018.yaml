# NOTE (2026-11-10): nominals this dataset had derived (a min/max
# midpoint, or a copy of a lone max/min) were removed; only what the
# source prints is recorded. Generators draw a min/max-only dimension at
# its midpoint and a lone limit at that limit, without storing either.
# Bourns SRN4018 series, semi-shielded power inductor, square chip
# footprint (the drawing gives two matching 4.0mm callouts for
# length/width). Height is MAX-only (1.88mm, SRN4018-R82Y to -2R7M
# height group) -- `nominal` set equal to that max, same "closest
# usable single number" technique as AXIAL-DO35-1N4148's body_height.
schema_version: "0.2"
kind: package
id: standards/CHIP-BOURNS-SRN4018
family: chip
lead_count: 2
source: bourns/SRN4018

pitch: { unit: mm }
geometry: { type: parametric, generator: chip }

dimensions:
  body_width:
    min: 3.8 mm
    typ: 4 mm
    max: 4.2 mm
    src: p1 ""Product Dimensions" section, 4.0 +/-0.2mm callout"
  body_length:
    min: 3.8 mm
    typ: 4 mm
    max: 4.2 mm
    src: p1 ""Product Dimensions" section, 4.0 +/-0.2mm callout"
  body_height:
    max: 1.88 mm
    src: p1 ""Product Dimensions" section, SRN4018-R82Y to -2R7M height group "MAX. 1.88 (.074)" -- no min/nominal stated, see comment above"
