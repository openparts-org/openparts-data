# Abracon ABS07, 3.2x1.5mm 2-terminal SMD 32.768kHz crystal. Confirmed
# 2-pad from the page-4 "Mechanical Dimensions" drawing (rendered):
# bottom view shows exactly two hatched terminals, and the
# "CONNECTIONS" symbol is a plain 2-terminal crystal (no GND pad).
#   body 0.126+/-0.004 (3.2+/-0.1) x 0.059+/-0.004 (1.50+/-0.1)
#   H: "0.9 mm max." for ABS07 (0.65 max is the separate ABS071)
#   terminal 0.024 (0.6) "2x" along the long axis, no tolerance
# Height: only a max is stated, so no nominal is recorded (the chip
# generator will fall back to its own default height when drawing).
# construction left out: page 1 says "Seam sealed ceramic package",
# which is neither a fired MLCC-style ceramic body nor a metal can in
# this dataset's vocabulary.
