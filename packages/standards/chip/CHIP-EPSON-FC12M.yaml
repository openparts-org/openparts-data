# NOTE (2026-11-10): nominals this dataset had derived (a min/max
# midpoint, or a copy of a lone max/min) were removed; only what the
# source prints is recorded. Generators draw a min/max-only dimension at
# its midpoint and a lone limit at that limit, without storing either.
# Epson FC-12M, 2-pad SMD crystal can. Width's tolerance value is
# present in the source but was garbled by PDF text extraction
# (vector-drawing text out of reading order) -- recorded as nominal
# only, not guessing a tolerance. Height is MAX-only (0.6mm); nominal
# set equal to that max, same "closest usable single number" technique
# as AXIAL-DO35-1N4148's body_height.
schema_version: "0.2"
kind: package
id: standards/CHIP-EPSON-FC12M
family: chip
lead_count: 2
source: epson/FC-12M-DS

pitch: { unit: mm }
geometry: { type: parametric, generator: chip }

dimensions:
  body_width:
    typ: 1.2 mm
    src: p1 "Section 3 "External dimensions", width ~1.2mm -- tolerance garbled in extraction, see comment above"
  body_length:
    min: 2 mm
    typ: 2.05 mm
    max: 2.1 mm
    src: p1 "Section 3 "External dimensions", length 2.05 +/-0.05mm"
  body_height:
    max: 0.6 mm
    src: p1 "Section 3 "External dimensions", height 0.6mm MAX, no min/nominal stated -- see comment above"
