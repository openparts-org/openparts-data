# Raspberry Pi Pico board as a surface-mount module: the recommended SMT
# footprint (Pico datasheet RP-008307-DS rev 2, section 2.2, Figure 5,
# PDF page 10) with the board outline and holes of Figure 3 (PDF page 7).
# Both figures are vector drawings; every value below is a printed
# callout or the datasheet text, or (where said so in the locator) plain
# arithmetic between printed callouts -- nothing is measured from the
# drawing. Pico 2 (RP-008299-DS rev 3, Figures 3 and 5, PDF pages 8 and
# 11) prints the same numbers for every value here, so the Pico 2 parts
# use this package too; its footprint adds a 7th test point (TP7).
#
# Footprint: the 40 castellated pins are the Figure 5 SMD lands (the
# datasheet gives no carrier-board drill for pin headers, so no
# through-holes), plus the three SWD debug pads D1-D3 at the USB-far end
# (Figure 4 numbers them D1, D2, D3 left to right; Figure 2 names them
# SWCLK, GND, SWDIO). Left out: test points TP1-TP6 (Figure 5 gives
# their centres and 1.5x1.5 mm size, but the datasheet says unused test
# points may be voided on the carrier) and the four USB shell solder
# relief pads A-D -- this family has no free-standing pads yet.
