# Raspberry Pi Pico board as a surface-mount module: the recommended SMT
# footprint (Pico datasheet RP-008307-DS rev 2, section 2.2, Figure 5,
# PDF page 10) with the board outline and holes of Figure 3 (PDF page 7).
# Both figures are vector drawings; every value below is a printed
# callout or the datasheet text, or (where said so in the locator) plain
# arithmetic between printed callouts -- nothing is measured from the
# drawing. Pico 2 (RP-008299-DS rev 3, Figures 3 and 5, PDF pages 8 and
# 11) prints the same numbers for every value here, so the Pico 2 parts
# use this package too; its footprint adds a 7th test point (TP7).
#
# Footprint: the 40 castellated pins are the Figure 5 SMD lands (the
# datasheet gives no carrier-board drill for pin headers, so no
# through-holes), plus the three SWD debug pads D1-D3 at the USB-far end
# (Figure 4 numbers them D1, D2, D3 left to right; Figure 2 names them
# SWCLK, GND, SWDIO). Left out: test points TP1-TP6 (Figure 5 gives
# their centres and 1.5x1.5 mm size, but the datasheet says unused test
# points may be voided on the carrier) and the four USB shell solder
# relief pads A-D -- this family has no free-standing pads yet.
schema_version: "0.2"
kind: package
id: standards/MODULE40-21x51-P2.54-PICO
family: module

lead_count:
  value: 40
  src: 'p8 "Figure 4 (pin numbering): pins 1-20 down the left edge, 21-40 up the right edge"'

source: raspberrypi/RP-008307-DS@rev2

pitch:
  typ: 2.54 mm
  src: 'p7 "Section 2: "40 main user pins on a 2.54 mm (0.1") pitch grid"; Figure 3 "2.54""'

aux_pads:
  value: [D1, D2, D3]
  src:   'p8 "Figure 4: debug pads labelled D1, D2, D3 left to right at the end opposite the USB connector"'

geometry: { type: parametric, generator: module }

dimensions:
  body_width:
    typ: 21 mm
    src: 'p7 "Section 2: "single sided 51x21 mm 1 mm thick PCB"; Figure 3 "21""'
  body_length:           { typ: 51 mm, src: 'p7 "Section 2: "51x21 mm"; Figure 3 "51""' }
  body_height:
    typ: 1 mm
    src: 'p7 "Section 2: "1 mm thick PCB" (the board alone; the USB connector and parts on top are not included)"'
  mounting_hole_inset:
    typ: 2 mm
    src: 'p7 "Figure 3: "2" from the USB-end board edge to the hole centres (dimensioned at that end only; the generator draws the other pair symmetric)"'
  overall_width:
    typ: 22.58 mm
    src: 'p10 "Figure 5 (SMT footprint): "22.58" across the outer ends of the two pad rows"'
  lead_width:
    typ: 1.6 mm
    src: 'p7 "Figure 3: "1.6" pad width along the edge; Figure 5 (page 10): pad end radius "R0.8", and (49.86 - 46.66) / 2 = 1.6"'
  lead_length:
    typ: 3.2 mm
    src: 'p10 "Figure 5: ("22.58" outer - "16.18" inner pad span) / 2 = 3.2; the land reaches "0.79" past the board edge"'
  row_spacing:           { typ: 17.78 mm, src: 'p7 "Figure 3: "17.78" between the pin hole rows"' }
  hole_diameter:
    typ: 1 mm
    src: 'p7 "Section 2: "with 1 mm holes"; Figure 3: two "diameter 1" callouts (pin hole and edge castellation)"'
  aux_pad_width:
    typ: 1.6 mm
    src: 'p10 "Figure 5: "6.68" across the three debug pads at 2.54 pitch: 6.68 - 2 x 2.54 = 1.6"'
  aux_pad_length:
    typ: 3.2 mm
    src: 'p10 "Figure 5: debug lands reach "0.8" below the board''s bottom edge (the origin); Figure 3 (page 7): debug pad top "2.4" above that edge; 0.8 + 2.4 = 3.2"'
  aux_row_x:
    typ: 10.5 mm
    src: 'p7 "Figure 3: board edge to mounting hole "4.8" + hole to middle debug pad "5.7" = 10.5 (the board centre)"'
  aux_row_y:
    typ: 0.8 mm
    src: 'p10 "Centre of the debug land from Figure 5 "0.8" below the bottom edge to Figure 3 "2.4" above it: (2.4 - 0.8) / 2 = 0.8"'
  mounting_hole_diameter:
    min: 2.05 mm
    typ: 2.1 mm
    max: 2.15 mm
    src: 'p7 "Section 2: "4x 2.1 mm (+/- 0.05 mm) drilled mounting holes"; Figure 3 "diameter 2.1""'
  mounting_hole_spacing: { typ: 11.4 mm, src: 'p7 "Figure 3: "11.4" between the hole centres"' }
