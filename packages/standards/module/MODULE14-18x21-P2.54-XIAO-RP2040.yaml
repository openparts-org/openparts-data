# Seeed Studio XIAO RP2040 as a module: board outline and pin holes from the maker's design files
# (seeed/XIAO-RP2040-SCH-PCB@v1.3): Seeed Studio XIAO RP2040 v1.3.kicad_pcb. Outline = the board-outline layer extents (rectangle; rounded
# or notched corners are not modelled). Frame: board centre, +X right, +Y up, top view, USB end up.
# The design is turned 90 deg from the design file. Pads: the plated header holes, numbered
# counter-clockwise from the upper left (this dataset's numbering, not a maker pin number);
# pin names are in the device. Land = the design pad diameter, drill = its hole.
# The board edge is castellated too (half-holes on the edge): only the inner through-holes are
# the pads here (a carrier footprint for pin headers).
