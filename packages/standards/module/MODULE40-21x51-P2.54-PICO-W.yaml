# Raspberry Pi Pico W board as a surface-mount module: the recommended
# SMT footprint (Pico W datasheet RP-008312-DS rev 2, section 2.2,
# Figure 5, PDF page 10) with the board outline and holes of Figure 3
# (PDF page 7). Every value is a printed callout, the datasheet text, or
# (where said so in the locator) arithmetic between printed callouts.
# Pico 2 W (RP-008304-DS rev 3, Figures 3 and 5, PDF pages 7 and 10)
# prints the same numbers for every value here, so the Pico 2 W part uses
# this package too.
#
# Differs from the Pico's package: the three SWD debug pads sit
# mid-board (19.8 mm above the antenna end), not at the board end, and
# are 1.5748 mm pads. Figure 4 (pin numbering) labels them SWCLK, GND,
# SWDIO left to right (no D1-D3 numbers), so those labels are the pad
# numbers; Figure 5 calls them pads E, F, G. E is a 1.5748 mm square,
# F and G are 1.5748 mm circles: the generator draws all three as
# squares (its SMD pads are rectangles). Figure 7 shows them as
# through-hole pads, but no drill is stated, so they are SMD lands here.
# Left out as for the Pico: test points TP1-TP6 and the USB shell pads
# A-D. The antenna keep-out of section 2.2.1 is recorded as stated: its
# size (14 mm x 9 mm, orientation not given) at the antenna (bottom, -y)
# edge -- the datasheet doesn't locate it further. The same section asks
# for the board edge (recommended, no line drawn).
schema_version: "0.1"
kind: package
id: standards/MODULE40-21x51-P2.54-PICO-W

family: module
lead_count: 40
aux_pads: [SWCLK, GND, SWDIO]

pitch:
  nominal: 2.54
  unit: mm

dimensions:
  body_width:
    nominal: 21
    unit: mm
  body_length:
    nominal: 51
    unit: mm
  body_height:
    nominal: 1
    unit: mm
  overall_width:
    nominal: 22.58
    unit: mm
  lead_width:
    nominal: 1.6
    unit: mm
  lead_length:
    nominal: 3.2
    unit: mm
  row_spacing:
    nominal: 17.78
    unit: mm
  hole_diameter:
    nominal: 1
    unit: mm
  aux_pad_width:
    nominal: 1.5748
    unit: mm
  aux_pad_length:
    nominal: 1.5748
    unit: mm
  aux_row_x:
    nominal: 13.6241
    unit: mm
  aux_row_y:
    nominal: 19.8
    unit: mm
  mounting_hole_diameter:
    nominal: 2.1
    min: 2.05
    max: 2.15
    unit: mm
  mounting_hole_spacing:
    nominal: 11.4
    unit: mm
  mounting_hole_inset:
    nominal: 2
    unit: mm

edge:
  side: "-y"
  requirement: recommended

keepouts:
  - purpose: antenna
    restricts: [components, copper]
    side: "-y"
    size: [14, 9]

geometry:
  type: parametric
  generator: module

provenance:
  "/edge":
    - source: raspberrypi/RP-008312-DS@rev2
      page: 11
      locator: "Section 2.2.1 Keep-out area: \"Raspberry Pi Pico W should be placed on the edge of a board and not enclosed in metal\"; section 2 (page 7): \"The onboard wireless antenna is located on the bottom edge\" (Figure 3 top view, USB at the top: -y)"
    - source: raspberrypi/RP-008304-DS@rev3
      page: 11
      locator: "Pico 2 W, section 2.2.1 and section 2: the same sentences"
  "/keepouts":
    - source: raspberrypi/RP-008312-DS@rev2
      page: 11
      locator: "Section 2.2.1 Keep-out area: \"There is a cutout for the antenna (14 mm × 9 mm). If anything is placed close to the antenna (in any dimension) the effectiveness of the antenna is reduced.\" Position: section 2 (page 7), \"The onboard wireless antenna is located on the bottom edge. To avoid detuning the antenna, no material should intrude into this space.\" Not dimensioned further (no x/y, no orientation of the 14 x 9)."
    - source: raspberrypi/RP-008304-DS@rev3
      page: 11
      locator: "Pico 2 W, section 2.2.1: the same statement"
  "/lead_count":
