# Raspberry Pi Pico W board as a surface-mount module: the recommended
# SMT footprint (Pico W datasheet RP-008312-DS rev 2, section 2.2,
# Figure 5, PDF page 10) with the board outline and holes of Figure 3
# (PDF page 7). Every value is a printed callout, the datasheet text, or
# (where said so in the locator) arithmetic between printed callouts.
# Pico 2 W (RP-008304-DS rev 3, Figures 3 and 5, PDF pages 7 and 10)
# prints the same numbers for every value here, so the Pico 2 W part uses
# this package too.
#
# Differs from the Pico's package: the three SWD debug pads sit
# mid-board (19.8 mm above the antenna end), not at the board end, and
# are 1.5748 mm pads. Figure 4 (pin numbering) labels them SWCLK, GND,
# SWDIO left to right (no D1-D3 numbers), so those labels are the pad
# numbers; Figure 5 calls them pads E, F, G. E is a 1.5748 mm square,
# F and G are 1.5748 mm circles: the generator draws all three as
# squares (its SMD pads are rectangles). Figure 7 shows them as
# through-hole pads, but no drill is stated, so they are SMD lands here.
# Left out as for the Pico: test points TP1-TP6 and the USB shell pads
# A-D. The antenna keep-out of section 2.2.1 is recorded as stated: its
# size (14 mm x 9 mm, orientation not given) at the antenna (bottom, -y)
# edge -- the datasheet doesn't locate it further. The same section asks
# for the board edge (recommended, no line drawn).
schema_version: "0.2"
kind: package
id: standards/MODULE40-21x51-P2.54-PICO-W
family: module

lead_count:
  value: 40
  src: 'p8 "Figure 4 (pin numbering): pins 1-20 down the left edge, 21-40 up the right edge"'

source: raspberrypi/RP-008312-DS@rev2

pitch:
  typ: 2.54 mm
  src: 'p7 "Section 2: "40 main user pins on a 2.54 mm (0.1") pitch grid"; Figure 3 "2.54""'

aux_pads:
  value: [SWCLK, GND, SWDIO]
  src:   'p8 "Figure 4: debug pads labelled SWCLK (square), GND, SWDIO left to right"'

geometry: { type: parametric, generator: module }

# aux_row_x: Figure 5 notes give F PAD centre 13.6241 (E 11.0841,
# G 16.1641; origin bottom left); Figure 3: 7.3759 from the right edge
# = 21 - 13.6241.
dimensions:
  body_width:
    typ: 21 mm
    src: 'p7 "Section 2: "single sided 51 mm x 21 mm x 1 mm PCB"; Figure 3 "21""'
  body_length: { typ: 51 mm, src: 'p7 "Section 2: "51 mm x 21 mm x 1 mm"; Figure 3 "51""' }
  body_height: { typ: 1 mm, src: 'p7 "Section 2: "51 mm x 21 mm x 1 mm PCB" (the board alone)"' }
  mounting_hole_inset:
    typ: 2 mm
    src: 'p7 "Figure 3: "2" from the top edge and "2" from the bottom edge to the hole centres"'
  overall_width:
    typ: 22.58 mm
    src: 'p10 "Figure 5 (SMT footprint): "22.58" across the outer ends of the two pad rows"'
  lead_width:
    typ: 1.6 mm
    src: 'p7 "Figure 3: "1.6" pad width along the edge; Figure 5 (page 10): pad end radius "R0.8", and (49.86 - 46.66) / 2 = 1.6"'
  lead_length:
    typ: 3.2 mm
    src: 'p10 "Figure 5: ("22.58" outer - "16.18" inner pad span) / 2 = 3.2; the land reaches "0.79" past the board edge"'
  row_spacing:           { typ: 17.78 mm, src: 'p7 "Figure 3: "17.78" between the pin hole rows"' }
  hole_diameter:
    typ: 1 mm
    src: 'p7 "Section 2: "with 1 mm holes"; Figure 3: two "diameter 1" callouts (pin hole and edge castellation)"'
  aux_pad_width:
    typ: 1.5748 mm
    src: 'p10 "Figure 5 notes: "E PAD : 1.5748mm square", "F PAD : 1.5748mm diameter circle", "G PAD : 1.5748mm diameter circle""'
  aux_pad_length:
    typ: 1.5748 mm
    src: 'p10 "Figure 5 notes: E 1.5748 mm square, F/G 1.5748 mm diameter circles"'
  aux_row_x:
    typ: 13.6241 mm
    src: p10 "Figure 5 notes, F PAD centre (see comment); Figure 3 (p7), offset from right edge"
  aux_row_y:
    typ: 19.8 mm
    src: 'p10 "Figure 5 notes: E, F, G centred at y = 19.8 from the bottom-left origin; Figure 3 (page 7): "19.8""'
  mounting_hole_diameter:
    min: 2.05 mm
    typ: 2.1 mm
    max: 2.15 mm
    src: 'p7 "Section 2: "four 2.1 mm (+/- 0.05 mm) drilled mounting holes"; Figure 3 "diameter 2.1""'
  mounting_hole_spacing: { typ: 11.4 mm, src: 'p7 "Figure 3: "11.4" between the hole centres"' }

edge:
  side: -y
  requirement: recommended
  src:
    - p11 "Section 2.2.1 Keep-out area; section 2 (p7), antenna edge (Figure 3)"
    - 'raspberrypi/RP-008304-DS@rev3 p11 "Pico 2 W, section 2.2.1 and section 2: the same sentences"'

keepouts:
  value: [{ purpose: antenna, restricts: [components, copper], size: [14, 9], side: -y }]
  src:
    - p11 "Section 2.2.1 Keep-out area, antenna cutout; section 2 (p7), antenna edge"
    - 'raspberrypi/RP-008304-DS@rev3 p11 "Pico 2 W, section 2.2.1: the same statement"'
