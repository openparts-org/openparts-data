# Adafruit QT Py ESP32-S2 as a module: board outline and pin holes from the maker's design file
# (adafruit/Adafruit-QT-Py-ESP32-S2-PCB@7df4eac): Adafruit QT Py ESP32-S2 Rev C.brd. Outline = the board-outline layer extents (rectangle; rounded
# or notched corners are not modelled). Frame: board centre, +X right, +Y up, top view, USB end up.
# The design is turned 0 deg from the design file. Pads: the plated header holes, numbered
# counter-clockwise from the upper left (this dataset's numbering, not a maker pin number);
# pin names are in the device. Land = the design pad diameter, drill = its hole.
# The board edge is castellated too (half-holes on the edge): only the inner through-holes are
# the pads here (a carrier footprint for pin headers).
# Also the package of the QT Py ESP32-S3 (adafruit/5426): its design has the same header holes.
