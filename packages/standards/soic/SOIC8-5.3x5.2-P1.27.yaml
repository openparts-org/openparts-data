# NOTE (2026-11-10): the derived midpoint nominals mentioned below have
# been removed -- only the min/max the source states are recorded
# (Canonical Data Specification 7, 20.1). Generators draw a min/max-only
# dimension at its midpoint without storing it (openparts-mcad
# defaults::required).
# Generic EIAJ EDR-7320, 0.208" body, 8-lead SOIC -- not tied to one
# manufacturer's die, so any other 8-pin wide-body EIAJ SOIC part
# sharing this exact mechanical outline can reference this same
# package. Values confirmed from Atmel/Microchip datasheet 2586Q
# (ATtiny25/45/85), section 26.2 "8S2" package drawing (page 208).
#
# Not to be confused with the narrower JEDEC MS-012 "S8S1" 0.150"-body
# SOIC drawn in the same datasheet (section 26.3) -- ATtiny85's own
# ordering table (section 25.3, page 206) lists it only in the 8S2
# (EIAJ) and 8P3 (PDIP)/20M1 (QFN) packages, not S8S1, unlike its
# siblings ATtiny25/ATtiny45 (sections 25.1/25.2), which do offer S8S1.
#
# The drawing gives Min/Max only for every dimension (no datasheet-
# stated Nominal/BSC except `pitch`, marked "1.27 BSC"). `nominal`
# below is this session's own midpoint of the confirmed Min/Max range,
# not a value the datasheet states directly.
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
# overall_height is not recorded separately: body_height above is already
# this drawing's overall height A (the drawing gives no A2).
schema_version: "0.2"
kind: package
id: standards/SOIC8-5.3x5.2-P1.27
family: soic
lead_count: 8
source: microchip/2586@revQ

pitch: { typ: 1.27 mm, src: 'p208 "Table "COMMON DIMENSIONS", symbol "e" ("1.27 BSC")"' }
geometry: { type: parametric, generator: soic }

dimensions:
  body_width:
    min: 5.18 mm
    max: 5.4 mm
    src: p208 "Table "COMMON DIMENSIONS", symbol "E1" (Min 5.18 / Max 5.40); no nominal stated (min/max only)"
  body_length:
    min: 5.13 mm
    max: 5.35 mm
    src: p208 "Table "COMMON DIMENSIONS", symbol "D" (Min 5.13 / Max 5.35); no nominal stated (min/max only)"
  body_height:
    min: 1.7 mm
    max: 2.16 mm
    src: p208 "Table "COMMON DIMENSIONS", symbol "A" (Min 1.70 / Max 2.16); no nominal stated (min/max only)"
  lead_thickness:
    min: 0.15 mm
    max: 0.35 mm
    src: p208 "Table "COMMON DIMENSIONS", symbol "C" (Min/Max only; plated terminal, note 4)"
  overall_width:
    min: 7.7 mm
    max: 8.26 mm
    src: p208 "Table "COMMON DIMENSIONS", symbol "E" (Min 7.70 / Max 8.26)"
  standoff:
    min: 0.05 mm
    max: 0.25 mm
    src: p208 "Table "COMMON DIMENSIONS", symbol "A1" (Min/Max only)"
  lead_width:
    min: 0.35 mm
    max: 0.48 mm
    src: p208 "Table "COMMON DIMENSIONS", symbol "b" (Min/Max only; plated terminal, note 4)"
  lead_length:
    min: 0.51 mm
    max: 0.85 mm
    src: p208 "Table "COMMON DIMENSIONS", symbol "L" (Min/Max only)"
