# ESP32-H2 package: QFN32, 4x4mm, 0.4mm pitch (8 leads per side),
# 2.8x2.8mm exposed pad. All values from the dimension table of
# Figure 7-1 "QFN32 (4x4 mm) Package", ESP32-H2 datasheet v1.3, page 63
# (drawing rendered to an image and read; the table is not text).
# Not the same outline as standards/QFN32-ESP32-C3 (5x5mm, 0.5mm pitch).
# A (0.80/0.85/0.90) is recorded as body_height, as on the other
# Espressif QFN packages; A1 has no nominal ("--"), so min/max only.
schema_version: "0.2"
kind: package
id: standards/QFN32-ESP32-H2
family: qfn
lead_count: 32
source: espressif/esp32-h2_datasheet_en@rev1.3

pitch: { typ: 0.4 mm, src: 'p63 "Figure 7-1 dimension table, REF e (0.400 BSC)"' }
geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:
    min: 3.95 mm
    typ: 4 mm
    max: 4.05 mm
    src: p63 "Figure 7-1 dimension table, REF E"
  body_length:
    min: 3.95 mm
    typ: 4 mm
    max: 4.05 mm
    src: p63 "Figure 7-1 dimension table, REF D"
  body_height:
    min: 0.8 mm
    typ: 0.85 mm
    max: 0.9 mm
    src: p63 "Figure 7-1 dimension table, REF A"
  exposed_pad:
    src:    p63 "Figure 7-1 dimension table, REF D2/E2"
    width:  { min: 2.75 mm, typ: 2.8 mm, max: 2.85 mm }
    length: { min: 2.75 mm, typ: 2.8 mm, max: 2.85 mm }
  standoff:
    min: 0 mm
    max: 0.05 mm
    src: p63 "Figure 7-1 dimension table, REF A1 (nominal "--")"
  lead_width:
    min: 0.15 mm
    typ: 0.2 mm
    max: 0.25 mm
    src: p63 "Figure 7-1 dimension table, REF b"
  lead_length:
    min: 0.25 mm
    typ: 0.3 mm
    max: 0.35 mm
    src: p63 "Figure 7-1 dimension table, REF L"
  lead_thickness: { typ: 0.203 mm, src: 'p63 "Figure 7-1 dimension table, REF A3 (0.203 Ref.)"' }
