# 32-lead VQFN, 5x5mm, 0.5mm pitch, 3.60x3.60mm exposed pad --
# Microchip "32-Lead Very Thin Plastic Quad Flat, No Lead Package (S8B)
# - 5x5 mm Body [VQFN] With 3.60 mm Exposed Pad; Atmel Legacy Global
# Package Code ZKV", drawing C04-21402 Rev A sheet 2, in SAM D21/DA1
# data sheet DS40001882L section 44.1.11 "32-Pin VQFN" (page 1107),
# dimension table read as text. A (overall height) is recorded as
# body_height, as on the other QFN packages. Not the same outline as
# standards/QFN32-ESP32-C3 (no exposed pad recorded there, different
# lead length).
schema_version: "0.2"
kind: package
id: standards/QFN32-5x5-P0.5-EP3.6
family: qfn
lead_count: 32
source: microchip/DS40001882@revL

pitch:
  typ: 0.5 mm
  src: p1107 "Section 44.1.11, drawing C04-21402 sheet 2, "Pitch e 0.50 BSC""

geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:  { typ: 5 mm, src: 'p1107 "C04-21402 sheet 2, "Overall Width E 5.00 BSC""' }
  body_length: { typ: 5 mm, src: 'p1107 "C04-21402 sheet 2, "Overall Length D 5.00 BSC""' }
  body_height:
    min: 0.8 mm
    typ: 0.9 mm
    max: 1 mm
    src: p1107 "C04-21402 sheet 2, "Overall Height A""
  exposed_pad:
    src:    p1107 "C04-21402 sheet 2, "Exposed Pad Length D2" / "Exposed Pad Width E2""
    width:  { min: 3.5 mm, typ: 3.6 mm, max: 3.7 mm }
    length: { min: 3.5 mm, typ: 3.6 mm, max: 3.7 mm }
  standoff:
    min: 0 mm
    typ: 0.02 mm
    max: 0.05 mm
    src: p1107 "C04-21402 sheet 2, "Standoff A1""
  lead_width:
    min: 0.18 mm
    typ: 0.25 mm
    max: 0.3 mm
    src: p1107 "C04-21402 sheet 2, "Terminal Width b""
  lead_length:
    min: 0.3 mm
    typ: 0.4 mm
    max: 0.5 mm
    src: p1107 "C04-21402 sheet 2, "Terminal Length L""
  lead_thickness:
    typ: 0.2 mm
    src: p1107 "C04-21402 sheet 2, "Terminal Thickness A3 0.20 REF""
