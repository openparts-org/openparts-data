# nRF52840's QFN48 variant (order code prefix "QF"): 6x6mm, 0.4mm pitch
# -- a different, larger body than ESP32's own QFN48
# (standards/QFN48-ESP32.yaml, 5x5mm/0.35mm pitch), confirming QFN48
# body size isn't standardized across vendors the way LQFP/SOIC are, so
# this is its own device-specific package file rather than a shared
# generic one (matching QFN48-ESP32.yaml's own precedent).
#
# Confirmed from Nordic nRF52840 Product Specification 4413_417 v1.11,
# Table 103 "Package variant codes" (page 976): "QF QFN 6 x 6 48 0.4".
#
# No `body_height`/`exposed_pad` dimensions given anywhere in this
# document (unlike RP2040's QFN56, which documents an exposed pad
# exists but also leaves its numeric outline unspecified for the same
# reason) -- left unset here rather than guessed; the QFN generator
# falls back to its own internal approximate body height and omits the
# exposed pad from generated geometry when these are absent, matching
# how RP2040's own QFN56 package is already handled.
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
# Exposed pad (2026-11-15, correcting the note above): Table 65
# "QFN48 dimensions in millimeters" (page 937) prints one column
# "D2, E2" = 4.5/4.6/4.7 (min/nom/max), so both sides are equal.
# Re-downloaded from the same DigiKey-hosted URL the Source cites.
schema_version: "0.1"
kind: package
id: standards/QFN48-nRF52840

family: qfn
lead_count: 48

pitch:
  nominal: 0.4
  unit: mm

dimensions:
  body_width:
    nominal: 6.0
    unit: mm
  body_length:
    nominal: 6.0
    unit: mm
  lead_width:
    nominal: 0.2
    min: 0.15
    max: 0.25
    unit: mm
  lead_length:
    nominal: 0.4
    min: 0.35
    max: 0.45
    unit: mm
  lead_thickness:
    nominal: 0.203
    unit: mm
  standoff:
    nominal: 0.035
    min: 0.0
    max: 0.05
    unit: mm
  exposed_pad:
    width:
      nominal: 4.6
      min: 4.5
      max: 4.7
      unit: mm
    length:
      nominal: 4.6
      min: 4.5
      max: 4.7
      unit: mm

geometry:
  type: parametric
  generator: qfn

provenance:
  "/lead_count":
    - source: nordic/4413_417@v1.11
      page: 976
      locator: "Table 103, \"Package variant codes\", row \"QF\""
  "/pitch":
    - source: nordic/4413_417@v1.11
      page: 976
      locator: "Table 103, \"Package variant codes\", row \"QF\""
  "/dimensions/body_width":
    - source: nordic/4413_417@v1.11
      page: 976
      locator: "Table 103, \"Package variant codes\", row \"QF\" (\"6 x 6\")"
  "/dimensions/body_length":
    - source: nordic/4413_417@v1.11
      page: 976
      locator: "Table 103, \"Package variant codes\", row \"QF\" (\"6 x 6\")"
  "/dimensions/lead_width":
    - source: nordic/4413_417@v1.11
      page: 937
      locator: "Section 7.2.2, Table 65 \"QFN48 dimensions in millimeters\", symbol \"b\""
  "/dimensions/lead_length":
    - source: nordic/4413_417@v1.11
      page: 937
      locator: "Section 7.2.2, Table 65 \"QFN48 dimensions in millimeters\", symbol \"L\""
  "/dimensions/lead_thickness":
    - source: nordic/4413_417@v1.11
      page: 937
      locator: "Section 7.2.2, Table 65 \"QFN48 dimensions in millimeters\", symbol \"A3\" (nominal only)"
  "/dimensions/standoff":
    - source: nordic/4413_417@v1.11
      page: 937
      locator: "Section 7.2.2, Table 65 \"QFN48 dimensions in millimeters\", symbol \"A1\""
  "/dimensions/exposed_pad/width":
    - source: nordic/4413_417@v1.11
      page: 937
      locator: "Section 7.2.2, Table 65 \"QFN48 dimensions in millimeters\", column \"D2, E2\" (4.5/4.6/4.7)"
  "/dimensions/exposed_pad/length":
    - source: nordic/4413_417@v1.11
      page: 937
      locator: "Section 7.2.2, Table 65 \"QFN48 dimensions in millimeters\", column \"D2, E2\" (4.5/4.6/4.7)"
