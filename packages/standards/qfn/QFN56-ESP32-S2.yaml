# QFN56, 7x7mm body (Chapter 7 "Packaging") -- vendor-confirmed.
# `pitch` and `dimensions.body_height` are NOT from this datasheet (its
# mechanical drawing is an embedded figure, not extractable text).
# They're the JEDEC MO-220 standard values for a QFN56 7x7mm outline:
# 0.4mm pitch is directly vendor-confirmed for the identically-named
# "QFN-56 7x7mm" package in raspberrypi/RP-008371-DS (RP2040's
# datasheet, section 5.5.2), and 0.85mm nominal height (0.80/0.90
# min/max) is the standard JEDEC QFN body height cross-checked against
# multiple vendors' outline drawings for this lead-count/body-size
# family. `exposed_pad` is deliberately left unset: unlike pitch/height,
# EPAD size varies meaningfully between vendors even for the same
# lead-count+body-size QFN, so no cross-vendor standard value exists to
# borrow.
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
schema_version: "0.2"
kind: package
id: standards/QFN56-ESP32-S2
family: qfn
lead_count: { value: 56, src: '"Table 2-1 Pin Overview"' }
source: espressif/esp32-s2_datasheet_en@rev1.9

pitch:
  typ: 0.4 mm
  src: jedec/MO-220 "Standard QFN56 7x7mm pitch; vendor-confirmed for the identical package name in raspberrypi/RP-008371-DS section 5.5.2"

geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:  { typ: 7 mm, src: '"Chapter 7 Packaging: "QFN56 (7x7 mm) package""' }
  body_length: { typ: 7 mm, src: '"Chapter 7 Packaging: "QFN56 (7x7 mm) package""' }
  body_height:
    min: 0.8 mm
    typ: 0.85 mm
    max: 0.9 mm
    src: jedec/MO-220 "Standard QFN body height range for this outline family, not vendor-datasheet-specific"
  lead_thickness:
    typ: 0.203 mm
    src: p57 "Figure 7-1 "Dimensional Ref." table (variants excluding ESP32-S2FN4R2), symbol "A3" (0.203 Ref.)"
  standoff:
    min: 0 mm
    max: 0.05 mm
    src: p57 "Figure 7-1 "Dimensional Ref." table (variants excluding ESP32-S2FN4R2), symbol "A1" (no nom)"
  lead_width:
    min: 0.15 mm
    typ: 0.2 mm
    max: 0.25 mm
    src: p57 "Figure 7-1 "Dimensional Ref." table (variants excluding ESP32-S2FN4R2), symbol "b""
  lead_length:
    min: 0.35 mm
    typ: 0.4 mm
    max: 0.45 mm
    src: p57 "Figure 7-1 "Dimensional Ref." table (variants excluding ESP32-S2FN4R2), symbol "L""
