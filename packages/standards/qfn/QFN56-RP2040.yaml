# RP2040 datasheet section 5.5.2 / Figure (page 12 caption, page 608):
# "QFN-56 7x7mm (reduced ePad size)", 0.4mm pitch. The datasheet notes
# an exposed pad exists but its outline drawing with numeric callouts is
# an embedded figure, not extractable text -- width/length and body
# height are therefore left unspecified rather than guessed (the QFN
# generator falls back to an internal approximate body height, and
# simply omits the exposed pad from the generated geometry when its
# dimensions are unknown).
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
# Exposed pad (2026-11-15, superseding the note above): Figure 166 dimension table (PDF page 608,
# printed 607) prints D2 3.00/3.100/3.200 and E2 3.00/3.100/3.200 mm
# (min/nom/max); D2 is drawn along X in the bottom view (= width).
schema_version: "0.2"
kind: package
id: standards/QFN56-RP2040
family: qfn
lead_count: { value: 56, src: '"Section 5.5.2 package description"' }
source: raspberrypi/RP-008371-DS@rev1

pitch: { typ: 0.4 mm, src: '"Section 5.5.2, "standard 0.4mm QFN-56 footprints""' }
geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:  { typ: 7 mm, src: '""QFN-56 7x7mm (reduced ePad size)""' }
  body_length: { typ: 7 mm, src: '""QFN-56 7x7mm (reduced ePad size)""' }
  lead_thickness:
    typ: 0.203 mm
    src: p608 "Section 5.1 Package, Figure 166 dimension table, symbol "A3" (0.203 REF)"
  exposed_pad:
    width:
      min: 3 mm
      typ: 3.1 mm
      max: 3.2 mm
      src: p608 "Section 5.1 Package, Figure 166 dimension table, symbol "D2" (3.00/3.100/3.200; drawn along X in the bottom view)"
    length:
      min: 3 mm
      typ: 3.1 mm
      max: 3.2 mm
      src: p608 "Section 5.1 Package, Figure 166 dimension table, symbol "E2" (3.00/3.100/3.200)"
  standoff:
    min: 0 mm
    max: 0.05 mm
    src: p608 "Section 5.1 Package, Figure 166 dimension table, symbol "A1" (no nom)"
  lead_width:
    min: 0.13 mm
    typ: 0.18 mm
    max: 0.23 mm
    src: p608 "Section 5.1 Package, Figure 166 dimension table, symbol "b""
  lead_length:
    min: 0.3 mm
    typ: 0.4 mm
    max: 0.5 mm
    src: p608 "Section 5.1 Package, Figure 166 dimension table, symbol "L""
