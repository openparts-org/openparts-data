# RP2040 datasheet section 5.5.2 / Figure (page 12 caption, page 608):
# "QFN-56 7x7mm (reduced ePad size)", 0.4mm pitch. The datasheet notes
# an exposed pad exists but its outline drawing with numeric callouts is
# an embedded figure, not extractable text -- width/length and body
# height are therefore left unspecified rather than guessed (the QFN
# generator falls back to an internal approximate body height, and
# simply omits the exposed pad from the generated geometry when its
# dimensions are unknown).
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
# Exposed pad (2026-11-15, superseding the note above): Figure 166 dimension table (PDF page 608,
# printed 607) prints D2 3.00/3.100/3.200 and E2 3.00/3.100/3.200 mm
# (min/nom/max); D2 is drawn along X in the bottom view (= width).
schema_version: "0.1"
kind: package
id: standards/QFN56-RP2040

family: qfn
lead_count: 56

pitch:
  nominal: 0.4
  unit: mm

dimensions:
  body_width:
    nominal: 7.0
    unit: mm
  body_length:
    nominal: 7.0
    unit: mm
  lead_width:
    nominal: 0.18
    min: 0.13
    max: 0.23
    unit: mm
  lead_length:
    nominal: 0.4
    min: 0.3
    max: 0.5
    unit: mm
  lead_thickness:
    nominal: 0.203
    unit: mm
  standoff:
    min: 0.0
    max: 0.05
    unit: mm
  exposed_pad:
    width:
      nominal: 3.1
      min: 3.0
      max: 3.2
      unit: mm
    length:
      nominal: 3.1
      min: 3.0
      max: 3.2
      unit: mm

geometry:
  type: parametric
  generator: qfn

provenance:
  "/lead_count":
    - source: raspberrypi/RP-008371-DS@rev1
      locator: "Section 5.5.2 package description"
  "/pitch":
    - source: raspberrypi/RP-008371-DS@rev1
      locator: "Section 5.5.2, \"standard 0.4mm QFN-56 footprints\""
  "/dimensions/body_width":
    - source: raspberrypi/RP-008371-DS@rev1
      locator: "\"QFN-56 7x7mm (reduced ePad size)\""
  "/dimensions/body_length":
    - source: raspberrypi/RP-008371-DS@rev1
      locator: "\"QFN-56 7x7mm (reduced ePad size)\""
  "/dimensions/lead_width":
    - source: raspberrypi/RP-008371-DS@rev1
      page: 608
      locator: "Section 5.1 Package, Figure 166 dimension table, symbol \"b\""
  "/dimensions/lead_length":
    - source: raspberrypi/RP-008371-DS@rev1
      page: 608
      locator: "Section 5.1 Package, Figure 166 dimension table, symbol \"L\""
  "/dimensions/lead_thickness":
    - source: raspberrypi/RP-008371-DS@rev1
      page: 608
      locator: "Section 5.1 Package, Figure 166 dimension table, symbol \"A3\" (0.203 REF)"
  "/dimensions/standoff":
