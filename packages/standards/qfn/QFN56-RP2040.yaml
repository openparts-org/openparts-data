# RP2040 datasheet section 5.5.2 / Figure (page 12 caption, page 608):
# "QFN-56 7x7mm (reduced ePad size)", 0.4mm pitch. The datasheet notes
# an exposed pad exists but its outline drawing with numeric callouts is
# an embedded figure, not extractable text -- width/length and body
# height are therefore left unspecified rather than guessed (the QFN
# generator falls back to an internal approximate body height, and
# simply omits the exposed pad from the generated geometry when its
# dimensions are unknown).
