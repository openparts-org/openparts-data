# ESP32-D0WD-V3 (current bare-chip variant) package: QFN48, 5x5mm,
# 0.35mm pitch. Older NRND/EOL ESP32 variants (ESP32-D0WD, -D0WDQ6) use
# a different 6x6mm QFN -- not modeled here, since D0WD-V3 is current.
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
schema_version: "0.2"
kind: package
id: standards/QFN48-ESP32
family: qfn
lead_count: { value: 48, src: '"Table 1-1 ESP32 Series Comparison"' }
source: espressif/esp32_datasheet_en@rev5.3

pitch: { typ: 0.35 mm, src: '"Section 6 Packaging, Figure 6-2 dimension table, dimension e"' }
geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:
    min: 4.95 mm
    typ: 5 mm
    max: 5.05 mm
    src: '"Figure 6-2 dimension table, dimension D"'
  body_length:
    min: 4.95 mm
    typ: 5 mm
    max: 5.05 mm
    src: '"Figure 6-2 dimension table, dimension E"'
  body_height:
    min: 0.8 mm
    typ: 0.85 mm
    max: 0.9 mm
    src: '"Figure 6-2 dimension table, dimension A"'
  exposed_pad:
    src:    '"Figure 6-2 dimension table, dimensions D2/E2"'
    width:  { min: 3.65 mm, typ: 3.7 mm, max: 3.75 mm }
    length: { min: 3.65 mm, typ: 3.7 mm, max: 3.75 mm }
  standoff:
    min: 0 mm
    max: 0.05 mm
    src: p59 "Figure 6-2 QFN48 (5x5 mm) "Dimensional Ref." table, symbol "A1" (no nom)"
  lead_width:
    min: 0.13 mm
    typ: 0.18 mm
    max: 0.23 mm
    src: p59 "Figure 6-2 QFN48 (5x5 mm) "Dimensional Ref." table, symbol "b""
  lead_length:
    min: 0.3 mm
    typ: 0.35 mm
    max: 0.4 mm
    src: p59 "Figure 6-2 QFN48 (5x5 mm) "Dimensional Ref." table, symbol "L""
  lead_thickness:
    typ: 0.203 mm
    src: p59 "Figure 6-2 QFN48 (5x5 mm) "Dimensional Ref." table, symbol "A3" (0.203 Ref.)"
