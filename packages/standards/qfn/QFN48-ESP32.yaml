# ESP32-D0WD-V3 (current bare-chip variant) package: QFN48, 5x5mm,
# 0.35mm pitch. Older NRND/EOL ESP32 variants (ESP32-D0WD, -D0WDQ6) use
# a different 6x6mm QFN -- not modeled here, since D0WD-V3 is current.
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
schema_version: "0.1"
kind: package
id: standards/QFN48-ESP32

family: qfn
lead_count: 48

pitch:
  nominal: 0.35
  unit: mm

dimensions:
  body_width:
    nominal: 5.0
    min: 4.95
    max: 5.05
    unit: mm
  body_length:
    nominal: 5.0
    min: 4.95
    max: 5.05
    unit: mm
  body_height:
    nominal: 0.85
    min: 0.8
    max: 0.9
    unit: mm
  exposed_pad:
    width:
      nominal: 3.7
      min: 3.65
      max: 3.75
      unit: mm
    length:
      nominal: 3.7
      min: 3.65
      max: 3.75
      unit: mm
  lead_width:
    nominal: 0.18
    min: 0.13
    max: 0.23
    unit: mm
  lead_length:
    nominal: 0.35
    min: 0.3
    max: 0.4
    unit: mm
  lead_thickness:
    nominal: 0.203
    unit: mm
  standoff:
    min: 0.0
    max: 0.05
    unit: mm

geometry:
  type: parametric
  generator: qfn

provenance:
  "/lead_count":
    - source: espressif/esp32_datasheet_en@rev5.3
      locator: "Table 1-1 ESP32 Series Comparison"
  "/pitch":
    - source: espressif/esp32_datasheet_en@rev5.3
      locator: "Section 6 Packaging, Figure 6-2 dimension table, dimension e"
  "/dimensions/body_width":
    - source: espressif/esp32_datasheet_en@rev5.3
      locator: "Figure 6-2 dimension table, dimension D"
  "/dimensions/body_length":
    - source: espressif/esp32_datasheet_en@rev5.3
      locator: "Figure 6-2 dimension table, dimension E"
  "/dimensions/body_height":
    - source: espressif/esp32_datasheet_en@rev5.3
      locator: "Figure 6-2 dimension table, dimension A"
  "/dimensions/exposed_pad":
    - source: espressif/esp32_datasheet_en@rev5.3
      locator: "Figure 6-2 dimension table, dimensions D2/E2"
  "/dimensions/lead_width":
    - source: espressif/esp32_datasheet_en@rev5.3
      page: 59
      locator: "Figure 6-2 QFN48 (5x5 mm) \"Dimensional Ref.\" table, symbol \"b\""
  "/dimensions/lead_length":
    - source: espressif/esp32_datasheet_en@rev5.3
      page: 59
      locator: "Figure 6-2 QFN48 (5x5 mm) \"Dimensional Ref.\" table, symbol \"L\""
  "/dimensions/lead_thickness":
    - source: espressif/esp32_datasheet_en@rev5.3
      page: 59
      locator: "Figure 6-2 QFN48 (5x5 mm) \"Dimensional Ref.\" table, symbol \"A3\" (0.203 Ref.)"
  "/dimensions/standoff":
    - source: espressif/esp32_datasheet_en@rev5.3
      page: 59
      locator: "Figure 6-2 QFN48 (5x5 mm) \"Dimensional Ref.\" table, symbol \"A1\" (no nom)"
