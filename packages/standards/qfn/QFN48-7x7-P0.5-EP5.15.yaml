# 48-lead VQFN, 7x7x0.9mm, 0.5mm pitch, 5.15x5.15mm exposed pad --
# Microchip "48-Lead Very Thin Quad Flat Pack No-Leads (T3B)", Atmel
# legacy code ZLG, drawing C04-21425 Rev A sheet 2, in SAM D21/DA1 data
# sheet DS40001882L section 44.1.7 "48-Pin VQFN" (page 1092), dimension
# table read as text. A (overall height) is recorded as body_height, as
# on the other QFN packages; no separate mold thickness is given.
# (Section 44.1.8 is a different 48-lead VQFN with wettable flanks, not
# used here.)
schema_version: "0.2"
kind: package
id: standards/QFN48-7x7-P0.5-EP5.15
family: qfn
lead_count: 48
source: microchip/DS40001882@revL

pitch: { typ: 0.5 mm, src: 'p1092 "Section 44.1.7, drawing C04-21425 sheet 2, "Pitch e 0.50 BSC""' }
geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:  { typ: 7 mm, src: 'p1092 "C04-21425 sheet 2, "Overall Width E 7.00 BSC""' }
  body_length: { typ: 7 mm, src: 'p1092 "C04-21425 sheet 2, "Overall Length D 7.00 BSC""' }
  body_height:
    min: 0.8 mm
    typ: 0.85 mm
    max: 0.9 mm
    src: p1092 "C04-21425 sheet 2, "Overall Height A""
  exposed_pad:
    src:    p1092 "C04-21425 sheet 2, "Exposed Pad Length D2" / "Exposed Pad Width E2""
    width:  { min: 5.05 mm, typ: 5.15 mm, max: 5.25 mm }
    length: { min: 5.05 mm, typ: 5.15 mm, max: 5.25 mm }
  standoff:
    min: 0 mm
    typ: 0.02 mm
    max: 0.05 mm
    src: p1092 "C04-21425 sheet 2, "Standoff A1""
  lead_width:
    min: 0.18 mm
    typ: 0.25 mm
    max: 0.3 mm
    src: p1092 "C04-21425 sheet 2, "Terminal Width b""
  lead_length:
    min: 0.3 mm
    typ: 0.4 mm
    max: 0.5 mm
    src: p1092 "C04-21425 sheet 2, "Terminal Length L""
  lead_thickness:
    typ: 0.2 mm
    src: p1092 "C04-21425 sheet 2, "Terminal Thickness A3 0.20 REF""
