# QFN56, 7x7mm body (Chapter 7 Packaging, p.77, Figure 7-1) -- vendor-
# confirmed. "All ESP32-S3 chip variants have identical land pattern
# except ESP32-S3FH4R2, which has a bigger EPAD" -- not modeled here
# (base ESP32-S3 only). `pitch` and `dimensions.body_height` are the
# JEDEC MO-220 standard for this outline (0.4mm pitch is directly
# vendor-confirmed for the identically-named "QFN-56 7x7mm" package in
# raspberrypi/RP-008371-DS section 5.5.2; 0.85mm nominal height is the
# standard JEDEC QFN body height for this family) -- not read from this
# datasheet's own (image-only) mechanical drawing. `exposed_pad` stays
# unset: EPAD size is not standardized across vendors the way
# pitch/height are (see QFN56-ESP32-S2 for the same reasoning).
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
# Exposed pad (2026-11-15, superseding the note above): Figure 7-1
# "Dimensional Ref." table, page 77: D2 3.950/4.000/4.050 and E2
# 3.950/4.000/4.050 mm (min/nom/max); D2 is drawn along X. This is the
# standard EPAD; ESP32-S3FH4R2's bigger EPAD (Figure 7-2) is not this package.
schema_version: "0.1"
kind: package
id: standards/QFN56-ESP32-S3

family: qfn
lead_count: 56

pitch:
  nominal: 0.4
  unit: mm

dimensions:
  body_width:
    nominal: 7.0
    unit: mm
  body_length:
    nominal: 7.0
    unit: mm
  body_height:
    nominal: 0.85
    min: 0.8
    max: 0.9
    unit: mm
  lead_width:
    nominal: 0.2
    min: 0.15
    max: 0.25
    unit: mm
  lead_length:
    nominal: 0.4
    min: 0.35
    max: 0.45
    unit: mm
  lead_thickness:
    nominal: 0.203
    unit: mm
  standoff:
    min: 0.0
    max: 0.05
    unit: mm
  exposed_pad:
    width:
      nominal: 4.0
      min: 3.95
      max: 4.05
      unit: mm
    length:
      nominal: 4.0
      min: 3.95
      max: 4.05
      unit: mm

geometry:
  type: parametric
  generator: qfn

