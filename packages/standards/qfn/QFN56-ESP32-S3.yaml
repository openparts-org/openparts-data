# QFN56, 7x7mm body (Chapter 7 Packaging, p.77, Figure 7-1) -- vendor-
# confirmed. "All ESP32-S3 chip variants have identical land pattern
# except ESP32-S3FH4R2, which has a bigger EPAD" -- not modeled here
# (base ESP32-S3 only). `pitch` and `dimensions.body_height` are the
# JEDEC MO-220 standard for this outline (0.4mm pitch is directly
# vendor-confirmed for the identically-named "QFN-56 7x7mm" package in
# raspberrypi/RP-008371-DS section 5.5.2; 0.85mm nominal height is the
# standard JEDEC QFN body height for this family) -- not read from this
# datasheet's own (image-only) mechanical drawing. `exposed_pad` stays
# unset: EPAD size is not standardized across vendors the way
# pitch/height are (see QFN56-ESP32-S2 for the same reasoning).
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
# Exposed pad (2026-11-15, superseding the note above): Figure 7-1
# "Dimensional Ref." table, page 77: D2 3.950/4.000/4.050 and E2
# 3.950/4.000/4.050 mm (min/nom/max); D2 is drawn along X. This is the
# standard EPAD; ESP32-S3FH4R2's bigger EPAD (Figure 7-2) is not this package.
schema_version: "0.2"
kind: package
id: standards/QFN56-ESP32-S3
family: qfn
lead_count: { value: 56, src: '"Figure 7-1 caption, p.77: "QFN56 (7x7 mm) Package""' }
source: espressif/esp32-s3_datasheet_en@rev2.2

pitch:
  typ: 0.4 mm
  src: jedec/MO-220 "Standard QFN56 7x7mm pitch; vendor-confirmed for the identical package name in raspberrypi/RP-008371-DS section 5.5.2"

geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:  { typ: 7 mm, src: '"Figure 7-1 caption, p.77"' }
  body_length: { typ: 7 mm, src: '"Figure 7-1 caption, p.77"' }
  body_height:
    min: 0.8 mm
    typ: 0.85 mm
    max: 0.9 mm
    src: jedec/MO-220 "Standard QFN body height range for this outline family, not vendor-datasheet-specific"
  exposed_pad:
    width:
      min: 3.95 mm
      typ: 4 mm
      max: 4.05 mm
      src: p77 "Figure 7-1 "Dimensional Ref." table, symbol "D2" (3.950/4.000/4.050; drawn along X in the bottom view)"
    length:
      min: 3.95 mm
      typ: 4 mm
      max: 4.05 mm
      src: p77 "Figure 7-1 "Dimensional Ref." table, symbol "E2" (3.950/4.000/4.050)"
  standoff:
    min: 0 mm
    max: 0.05 mm
    src: p77 "Figure 7-1 "Dimensional Ref." table, symbol "A1" (no nom)"
  lead_width:
    min: 0.15 mm
    typ: 0.2 mm
    max: 0.25 mm
    src: p77 "Figure 7-1 "Dimensional Ref." table, symbol "b""
  lead_length:
    min: 0.35 mm
    typ: 0.4 mm
    max: 0.45 mm
    src: p77 "Figure 7-1 "Dimensional Ref." table, symbol "L""
  lead_thickness:
    typ: 0.203 mm
    src: p77 "Figure 7-1 "Dimensional Ref." table, symbol "A3" (0.203 Ref.)"
