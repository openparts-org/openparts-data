# RP2350B / RP2354B package: 80-pin QFN, 10x10mm, 0.4mm pitch, 20 leads
# per side, centred 3.4x3.4mm exposed pad (the datasheet calls it
# "reduced ePad size"). Every value read from the "80QFN physical
# specification" table in the RP2350 Product Brief RP-008374-DS rev 1,
# PDF page 8 (printed page 8). "BSC"/"REF" values are recorded as a
# nominal only; A1 has no nominal printed, so only min/max.
# A (0.80/0.85/0.90) is recorded as body_height, matching
# standards/QFN60-RP2350A; no separate overall_height is added.
schema_version: "0.1"
kind: package
id: standards/QFN80-RP2350B

family: qfn
lead_count: 80

pitch:
  nominal: 0.4
  unit: mm

dimensions:
  body_width:
    nominal: 10.0
    unit: mm
  body_length:
    nominal: 10.0
    unit: mm
  body_height:
    nominal: 0.85
    min: 0.8
    max: 0.9
    unit: mm
  standoff:
    min: 0.0
    max: 0.05
    unit: mm
  lead_width:
    nominal: 0.2
    min: 0.15
    max: 0.25
    unit: mm
  lead_length:
    nominal: 0.4
    min: 0.35
    max: 0.45
    unit: mm
  lead_thickness:
    nominal: 0.203
    unit: mm
  exposed_pad:
    width:
      nominal: 3.4
      min: 3.35
      max: 3.45
      unit: mm
    length:
      nominal: 3.4
      min: 3.35
      max: 3.45
      unit: mm

geometry:
  type: parametric
  generator: qfn

provenance:
  "/pitch":
    - source: raspberrypi/RP-008374-DS@rev1
      page: 8
      locator: "80QFN physical specification table, symbol e (0.400 BSC)"
  "/dimensions/body_width":
    - source: raspberrypi/RP-008374-DS@rev1
      page: 8
      locator: "80QFN physical specification table, symbol E (10 BSC)"
  "/dimensions/body_length":
    - source: raspberrypi/RP-008374-DS@rev1
      page: 8
      locator: "80QFN physical specification table, symbol D (10 BSC)"
  "/dimensions/body_height":
    - source: raspberrypi/RP-008374-DS@rev1
      page: 8
      locator: "80QFN physical specification table, symbol A"
  "/dimensions/standoff":
    - source: raspberrypi/RP-008374-DS@rev1
      page: 8
      locator: "80QFN physical specification table, symbol A1 (no nominal)"
  "/dimensions/lead_width":
    - source: raspberrypi/RP-008374-DS@rev1
      page: 8
      locator: "80QFN physical specification table, symbol b"
  "/dimensions/lead_length":
    - source: raspberrypi/RP-008374-DS@rev1
      page: 8
      locator: "80QFN physical specification table, symbol L"
  "/dimensions/lead_thickness":
    - source: raspberrypi/RP-008374-DS@rev1
      page: 8
      locator: "80QFN physical specification table, symbol A3 (0.203 REF)"
  "/dimensions/exposed_pad":
    - source: raspberrypi/RP-008374-DS@rev1
      page: 8
      locator: "80QFN physical specification table, symbols D2/E2"
