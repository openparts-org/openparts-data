# RP2350B / RP2354B package: 80-pin QFN, 10x10mm, 0.4mm pitch, 20 leads
# per side, centred 3.4x3.4mm exposed pad (the datasheet calls it
# "reduced ePad size"). Every value read from the "80QFN physical
# specification" table in the RP2350 Product Brief RP-008374-DS rev 1,
# PDF page 8 (printed page 8). "BSC"/"REF" values are recorded as a
# nominal only; A1 has no nominal printed, so only min/max.
# A (0.80/0.85/0.90) is recorded as body_height, matching
# standards/QFN60-RP2350A; no separate overall_height is added.
schema_version: "0.2"
kind: package
id: standards/QFN80-RP2350B
family: qfn
lead_count: 80
source: raspberrypi/RP-008374-DS@rev1

pitch: { typ: 0.4 mm, src: 'p8 "80QFN physical specification table, symbol e (0.400 BSC)"' }
geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:  { typ: 10 mm, src: 'p8 "80QFN physical specification table, symbol E (10 BSC)"' }
  body_length: { typ: 10 mm, src: 'p8 "80QFN physical specification table, symbol D (10 BSC)"' }
  body_height:
    min: 0.8 mm
    typ: 0.85 mm
    max: 0.9 mm
    src: p8 "80QFN physical specification table, symbol A"
  exposed_pad:
    src:    p8 "80QFN physical specification table, symbols D2/E2"
    width:  { min: 3.35 mm, typ: 3.4 mm, max: 3.45 mm }
    length: { min: 3.35 mm, typ: 3.4 mm, max: 3.45 mm }
  standoff:
    min: 0 mm
    max: 0.05 mm
    src: p8 "80QFN physical specification table, symbol A1 (no nominal)"
  lead_width:
    min: 0.15 mm
    typ: 0.2 mm
    max: 0.25 mm
    src: p8 "80QFN physical specification table, symbol b"
  lead_length:
    min: 0.35 mm
    typ: 0.4 mm
    max: 0.45 mm
    src: p8 "80QFN physical specification table, symbol L"
  lead_thickness:
    typ: 0.203 mm
    src: p8 "80QFN physical specification table, symbol A3 (0.203 REF)"
