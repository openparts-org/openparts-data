# QFN40, 5x5mm body (Table 1-1, Section 7 "Packaging", p.78) --
# vendor-confirmed. `pitch` and `dimensions.body_height` are the JEDEC
# MO-220 standard for a QFN40 5x5mm outline: 0.4mm pitch and 0.85mm
# nominal (0.80/0.90 min/max) height match independent vendor package
# drawings for this exact lead-count+body-size combination (e.g. Analog
# Devices' "UH" 40-lead 5x5mm QFN family, distinct from the more common
# 6x6mm QFN40 variant) -- not read from this datasheet's own
# (image-only) mechanical drawing. `exposed_pad` stays unset: EPAD size
# is not standardized across vendors the way pitch/height are (see
# QFN32-ESP32-C3 for the same reasoning, and the documented 3.1-3.5mm
# spread for nominally-identical QFN32 packages).
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
# Exposed pad (2026-11-15, superseding the note above): read from
# datasheet v1.6 (espressif/esp32-c6_datasheet_en@rev1.6), Figure 7-1
# QFN40 bottom view, page 78: "3.300+/-0.050 Exp.DAP" both horizontally
# (X, width) and vertically (length). The v1.6 drawing's terminal
# width/length, A1 and A3 callouts equal those cited from v1.5 below.
schema_version: "0.1"
kind: package
id: standards/QFN40-ESP32-C6

family: qfn
lead_count: 40

pitch:
  nominal: 0.4
  unit: mm

dimensions:
  body_width:
    nominal: 5.0
    unit: mm
  body_length:
    nominal: 5.0
    unit: mm
  body_height:
    nominal: 0.85
    min: 0.8
    max: 0.9
    unit: mm
  lead_width:
    nominal: 0.2
    min: 0.15
    max: 0.25
    unit: mm
  lead_length:
    nominal: 0.4
    min: 0.35
    max: 0.45
    unit: mm
  lead_thickness:
    nominal: 0.203
    unit: mm
  standoff:
    min: 0.0
    max: 0.05
    unit: mm
  exposed_pad:
    width:
      nominal: 3.3
      min: 3.25
      max: 3.35
      unit: mm
    length:
      nominal: 3.3
      min: 3.25
      max: 3.35
      unit: mm

geometry:
  type: parametric
  generator: qfn

provenance:
  "/lead_count":
    - source: espressif/esp32-c6_datasheet_en@rev1.5
      locator: "Table 1-1, p.13"
  "/dimensions/body_width":
    - source: espressif/esp32-c6_datasheet_en@rev1.5
      locator: "Section 7 Packaging, p.78"
  "/dimensions/body_length":
    - source: espressif/esp32-c6_datasheet_en@rev1.5
      locator: "Section 7 Packaging, p.78"
  "/pitch":
    - source: jedec/MO-220
      locator: "Standard QFN40 5x5mm pitch, cross-checked against multiple vendors' outline drawings for this lead-count/body-size combination"
  "/dimensions/body_height":
    - source: jedec/MO-220
      locator: "Standard QFN body height range for this outline family, not vendor-datasheet-specific"
  "/dimensions/lead_width":
    - source: espressif/esp32-c6_datasheet_en@rev1.5
      page: 78
      locator: "Figure 7-1 (QFN40) drawing, terminal width 0.200 +/-0.050"
  "/dimensions/lead_length":
    - source: espressif/esp32-c6_datasheet_en@rev1.5
      page: 78
      locator: "Figure 7-1 (QFN40) drawing, terminal length 0.400 +/-0.050"
  "/dimensions/lead_thickness":
    - source: espressif/esp32-c6_datasheet_en@rev1.5
      page: 78
      locator: "Figure 7-1 (QFN40) drawing, \"A3\" 0.203 Ref."
  "/dimensions/standoff":
