# QFN40, 5x5mm body (Table 1-1, Section 7 "Packaging", p.78) --
# vendor-confirmed. `pitch` and `dimensions.body_height` are the JEDEC
# MO-220 standard for a QFN40 5x5mm outline: 0.4mm pitch and 0.85mm
# nominal (0.80/0.90 min/max) height match independent vendor package
# drawings for this exact lead-count+body-size combination (e.g. Analog
# Devices' "UH" 40-lead 5x5mm QFN family, distinct from the more common
# 6x6mm QFN40 variant) -- not read from this datasheet's own
# (image-only) mechanical drawing. `exposed_pad` stays unset: EPAD size
# is not standardized across vendors the way pitch/height are (see
# QFN32-ESP32-C3 for the same reasoning, and the documented 3.1-3.5mm
# spread for nominally-identical QFN32 packages).
schema_version: "0.1"
kind: package
id: standards/QFN40-ESP32-C6

family: qfn
lead_count: 40

pitch:
  nominal: 0.4
  unit: mm

dimensions:
  body_width:
    nominal: 5.0
    unit: mm
  body_length:
    nominal: 5.0
    unit: mm
  body_height:
    nominal: 0.85
    min: 0.8
    max: 0.9
    unit: mm

geometry:
  type: parametric
  generator: qfn

provenance:
  "/lead_count":
    - source: espressif/esp32-c6_datasheet_en@rev1.5
      locator: "Table 1-1, p.13"
  "/dimensions/body_width":
    - source: espressif/esp32-c6_datasheet_en@rev1.5
      locator: "Section 7 Packaging, p.78"
  "/dimensions/body_length":
    - source: espressif/esp32-c6_datasheet_en@rev1.5
      locator: "Section 7 Packaging, p.78"
  "/pitch":
    - source: jedec/MO-220
      locator: "Standard QFN40 5x5mm pitch, cross-checked against multiple vendors' outline drawings for this lead-count/body-size combination"
  "/dimensions/body_height":
    - source: jedec/MO-220
      locator: "Standard QFN body height range for this outline family, not vendor-datasheet-specific"
