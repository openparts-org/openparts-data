# QFN32, 5x5mm body (title page, Table 1-1) -- vendor-confirmed.
# `pitch` and `dimensions.body_height` are the JEDEC MO-220 standard for
# a QFN32 5x5mm outline: 0.5mm pitch and 0.85mm nominal (0.80/0.90
# min/max) height are the values used consistently across independent
# vendor package drawings for this exact lead-count+body-size
# combination (e.g. Analog Devices' "UH" 32-lead 5x5mm QFN family) --
# not read from this datasheet's own (image-only) mechanical drawing.
# `exposed_pad` stays unset: unlike pitch/height, EPAD size for QFN32
# 5x5mm genuinely varies between vendors (documented variants from
# 3.1x3.1mm to 3.5x3.5mm exist for this same nominal package), so there
# is no single cross-vendor standard value to borrow.
schema_version: "0.1"
kind: package
id: standards/QFN32-ESP32-C3

family: qfn
lead_count: 32

pitch:
  nominal: 0.5
  unit: mm

dimensions:
  body_width:
    nominal: 5.0
    unit: mm
  body_length:
    nominal: 5.0
    unit: mm
  body_height:
    nominal: 0.85
    min: 0.8
    max: 0.9
    unit: mm

geometry:
  type: parametric
  generator: qfn

provenance:
  "/lead_count":
    - source: espressif/esp32-c3_datasheet_en@rev2.4
      locator: "Table 2-1 Pin Overview, p.16-17"
  "/dimensions/body_width":
    - source: espressif/esp32-c3_datasheet_en@rev2.4
      locator: "Title page / Table 1-1"
  "/dimensions/body_length":
    - source: espressif/esp32-c3_datasheet_en@rev2.4
      locator: "Title page / Table 1-1"
  "/pitch":
    - source: jedec/MO-220
      locator: "Standard QFN32 5x5mm pitch, cross-checked against multiple vendors' outline drawings for this lead-count/body-size combination"
  "/dimensions/body_height":
    - source: jedec/MO-220
      locator: "Standard QFN body height range for this outline family, not vendor-datasheet-specific"
