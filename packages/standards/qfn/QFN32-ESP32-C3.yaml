# QFN32, 5x5mm body (title page, Table 1-1) -- vendor-confirmed.
# `pitch` and `dimensions.body_height` are the JEDEC MO-220 standard for
# a QFN32 5x5mm outline: 0.5mm pitch and 0.85mm nominal (0.80/0.90
# min/max) height are the values used consistently across independent
# vendor package drawings for this exact lead-count+body-size
# combination (e.g. Analog Devices' "UH" 32-lead 5x5mm QFN family) --
# not read from this datasheet's own (image-only) mechanical drawing.
# `exposed_pad` stays unset: unlike pitch/height, EPAD size for QFN32
# 5x5mm genuinely varies between vendors (documented variants from
# 3.1x3.1mm to 3.5x3.5mm exist for this same nominal package), so there
# is no single cross-vendor standard value to borrow.
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
# Exposed pad (2026-11-15, superseding the note above): read from
# datasheet v2.5 (espressif/esp32-c3_datasheet_en@rev2.5), Figure 7-1
# "Dimensional Ref." table, page 67: D2 3.650/3.700/3.750 and E2
# 3.650/3.700/3.750 mm (min/nom/max); D2 is drawn along X. The v2.5 table's
# b/L/A1/A3 rows equal those cited from v2.4 below.
schema_version: "0.1"
kind: package
id: standards/QFN32-ESP32-C3

family: qfn
lead_count: 32

pitch:
  nominal: 0.5
  unit: mm

dimensions:
  body_width:
    nominal: 5.0
    unit: mm
  body_length:
    nominal: 5.0
    unit: mm
  body_height:
    nominal: 0.85
    min: 0.8
    max: 0.9
    unit: mm
  lead_width:
    nominal: 0.25
    min: 0.2
    max: 0.3
    unit: mm
  lead_length:
    nominal: 0.4
    min: 0.35
    max: 0.45
    unit: mm
  lead_thickness:
    nominal: 0.203
    unit: mm
  standoff:
    max: 0.05
    unit: mm
  exposed_pad:
    width:
      nominal: 3.7
      min: 3.65
      max: 3.75
      unit: mm
    length:
      nominal: 3.7
      min: 3.65
      max: 3.75
      unit: mm

geometry:
  type: parametric
  generator: qfn

