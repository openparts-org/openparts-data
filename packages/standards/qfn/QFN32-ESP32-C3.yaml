# QFN32, 5x5mm body (title page, Table 1-1) -- vendor-confirmed.
# `pitch` and `dimensions.body_height` are the JEDEC MO-220 standard for
# a QFN32 5x5mm outline: 0.5mm pitch and 0.85mm nominal (0.80/0.90
# min/max) height are the values used consistently across independent
# vendor package drawings for this exact lead-count+body-size
# combination (e.g. Analog Devices' "UH" 32-lead 5x5mm QFN family) --
# not read from this datasheet's own (image-only) mechanical drawing.
# `exposed_pad` stays unset: unlike pitch/height, EPAD size for QFN32
# 5x5mm genuinely varies between vendors (documented variants from
# 3.1x3.1mm to 3.5x3.5mm exist for this same nominal package), so there
# is no single cross-vendor standard value to borrow.
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
# Exposed pad (2026-11-15, superseding the note above): read from
# datasheet v2.5 (espressif/esp32-c3_datasheet_en@rev2.5), Figure 7-1
# "Dimensional Ref." table, page 67: D2 3.650/3.700/3.750 and E2
# 3.650/3.700/3.750 mm (min/nom/max); D2 is drawn along X. The v2.5 table's
# b/L/A1/A3 rows equal those cited from v2.4 below.
schema_version: "0.2"
kind: package
id: standards/QFN32-ESP32-C3
family: qfn
lead_count: { value: 32, src: '"Table 2-1 Pin Overview, p.16-17"' }
source: espressif/esp32-c3_datasheet_en@rev2.4

pitch:
  typ: 0.5 mm
  src: jedec/MO-220 "QFN32 5x5 pitch (cross-checked with vendor outline drawings, see header)"

geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:  { typ: 5 mm, src: '"Title page / Table 1-1"' }
  body_length: { typ: 5 mm, src: '"Title page / Table 1-1"' }
  body_height:
    min: 0.8 mm
    typ: 0.85 mm
    max: 0.9 mm
    src: jedec/MO-220 "Standard QFN body height range for this outline family, not vendor-datasheet-specific"
  exposed_pad:
    width:
      min: 3.65 mm
      typ: 3.7 mm
      max: 3.75 mm
      src: espressif/esp32-c3_datasheet_en@rev2.5 p67 "Figure 7-1 "Dimensional Ref." table, symbol "D2" (3.650/3.700/3.750; drawn along X in the bottom view)"
    length:
      min: 3.65 mm
      typ: 3.7 mm
      max: 3.75 mm
      src: espressif/esp32-c3_datasheet_en@rev2.5 p67 "Figure 7-1 "Dimensional Ref." table, symbol "E2" (3.650/3.700/3.750)"
  standoff:
    max: 0.05 mm
    src: p66 "Figure 7-1 "Dimensional Ref." table, symbol "A1" (max only)"
  lead_width:
    min: 0.2 mm
    typ: 0.25 mm
    max: 0.3 mm
    src: p66 "Figure 7-1 "Dimensional Ref." table, symbol "b""
  lead_length:
    min: 0.35 mm
    typ: 0.4 mm
    max: 0.45 mm
    src: p66 "Figure 7-1 "Dimensional Ref." table, symbol "L""
  lead_thickness:
    typ: 0.203 mm
    src: p66 "Figure 7-1 "Dimensional Ref." table, symbol "A3" (0.203 Ref.)"
