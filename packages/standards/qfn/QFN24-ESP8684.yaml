# ESP8684 (ESP32-C2) package: QFN24, 4x4mm, 0.5mm pitch (6 leads per
# side), 2.8x2.8mm exposed die attach pad. Values from the dimension
# table of Figure 8 "QFN24 (4x4 mm) Package", ESP8684 datasheet v2.3,
# PDF page 53 (printed 52), read from a rendered image of the drawing.
# The table separates A (total thickness 0.8/0.85/0.9) from A2 (mold
# thickness, nominal 0.65 only, min/max "---"), so body_height = A2 and
# overall_height = A. Note 1 says "REFER TO JEDEC MO-220".
# The page text says pins are numbered "in a clockwise order"; Figure 3
# (pin layout, top view) and the bottom-view drawing both show the usual
# counter-clockwise numbering (1-6 down the left side), which is what the
# qfn generator draws.
schema_version: "0.2"
kind: package
id: standards/QFN24-ESP8684
family: qfn
lead_count: 24
source: espressif/esp8684_datasheet_en@rev2.3

pitch: { typ: 0.5 mm, src: 'p53 "Figure 8 dimension table, LEAD PITCH e (0.5 BSC)"' }
geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:  { typ: 4 mm, src: 'p53 "Figure 8 dimension table, BODY SIZE X, D (4 BSC)"' }
  body_length: { typ: 4 mm, src: 'p53 "Figure 8 dimension table, BODY SIZE Y, E (4 BSC)"' }
  body_height:
    typ: 0.65 mm
    src: p53 "Figure 8 dimension table, MOLD THICKNESS A2 (nominal only)"
  exposed_pad:
    src:    p53 "Figure 8 dimension table, EP SIZE D2/E2"
    width:  { min: 2.7 mm, typ: 2.8 mm, max: 2.9 mm }
    length: { min: 2.7 mm, typ: 2.8 mm, max: 2.9 mm }
  overall_height:
    min: 0.8 mm
    typ: 0.85 mm
    max: 0.9 mm
    src: p53 "Figure 8 dimension table, TOTAL THICKNESS A"
  standoff:
    min: 0 mm
    typ: 0.02 mm
    max: 0.05 mm
    src: p53 "Figure 8 dimension table, STAND OFF A1"
  lead_width:
    min: 0.2 mm
    typ: 0.25 mm
    max: 0.3 mm
    src: p53 "Figure 8 dimension table, LEAD WIDTH b"
  lead_length:
    min: 0.2 mm
    typ: 0.3 mm
    max: 0.4 mm
    src: p53 "Figure 8 dimension table, LEAD LENGTH L"
  lead_thickness:
    typ: 0.203 mm
    src: p53 "Figure 8 dimension table, L/F THICKNESS A3 (0.203 REF)"
