# Infineon PG-VQFN-24-19 ("very thin QFN"), 4x4mm body, 0.5mm pitch --
# confirmed from the XMC1100 datasheet's Figure 25 package-outline
# drawing (page 49) and Table 33 thermal-characteristics table
# (exposed-pad size, page 46).
#
# body_height and exposed_pad width/length are recorded as the single
# value the datasheet actually states (a bare "0.9 MAX" for height, no
# separate min/nominal; a bare "2.7 x 2.7" for the exposed pad, no
# stated tolerance) -- not padded out with an invented min/nominal/max
# spread.
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
schema_version: "0.2"
kind: package
id: standards/QFN24-XMC1100
family: qfn
lead_count: 24
source: infineon/xmc1100-datasheet-v2.1

pitch:
  typ: 0.5 mm
  src: p49 "Figure 25 package-outline drawing, dimension line "5 x 0.5 = 2.5""

geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:
    min: 3.9 mm
    typ: 4 mm
    max: 4.1 mm
    src: p49 "Figure 25, top-view/side-view dimension "4 +/- 0.1" (same value both axes, square body)"
  body_length:
    min: 3.9 mm
    typ: 4 mm
    max: 4.1 mm
    src: p49 "Figure 25, top-view/side-view dimension "4 +/- 0.1" (same value both axes, square body)"
  body_height:
    max: 0.9 mm
    src: p49 "Figure 25, side-view dimension "0.9 MAX." -- no separate min/nominal given"
  exposed_pad:
    src:    p46 "Table 33 "Thermal Characteristics of the Packages", row "Exposed Die Pad Dimensions Ex x Ey ... Max. 2.7 x 2.7 mm" -- no separate tolerance given"
    width:  { typ: 2.7 mm }
    length: { typ: 2.7 mm }
  standoff:
    max: 0.05 mm
    src: p49 "Figure 25 PG-VQFN-24-19 package outline, standoff "0.05 MAX""
  lead_width:
    min: 0.18 mm
    typ: 0.25 mm
    max: 0.3 mm
    src: p49 "Figure 25 PG-VQFN-24-19 package outline, terminal width 0.25 +0.05/-0.07"
  lead_length:
    min: 0.35 mm
    typ: 0.4 mm
    max: 0.45 mm
    src: p49 "Figure 25 PG-VQFN-24-19 package outline, terminal length 0.4 +/-0.05"
  lead_thickness:
    typ: 0.2 mm
    src: p49 "Figure 25 PG-VQFN-24-19 package outline, terminal thickness "(0.2)" (reference value)"
