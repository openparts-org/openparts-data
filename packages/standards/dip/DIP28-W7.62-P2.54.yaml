# 28-lead 300 mil "skinny" plastic DIP (SPDIP). Values from Microchip
# drawing C04-070B (section 39.4 "28P3", "28-Lead Skinny Plastic Dual
# In-Line (SP) - 300 mil Body [SPDIP]"), datasheet DS40002061B page 644.
# The page's text layer uses an encoded font, so the page was rendered
# and the table read from the image.
#
# The table is in inches; values below are exact unit conversions
# (x 25.4) of the printed MIN/NOM/MAX.
#
# body_width (row spacing for the `dip` generator) = 7.62 mm: this
# drawing has NO eA row-spacing row (only E shoulder width .290/.310/
# .335 and eB max .430). 7.62 is the "0.300\"" stated in the package
# title ("300 mil Body") and in the ordering-table package legend
# (page 635: "28P3 28-lead, 0.300\" Wide, Skinny Plastic Dual Inline
# Package (SPDIP)"). Flagged for review.
# body_length = D, body_height = A2, overall_height = A (max only),
# standoff = A1 (min only). L (tip to seating plane) left out (not the
# gull-wing foot length `lead_length` means).
schema_version: "0.2"
kind: package
id: standards/DIP28-W7.62-P2.54
family: dip
lead_count: 28
source: microchip/DS40002061@revB

pitch:
  typ: 2.54 mm
  src: p644 "Section 39.4 28P3 (C04-070B) table (inches), "Pitch e .100 BSC" -> 2.54 mm"

geometry: { type: parametric, generator: dip }

dimensions:
  body_width:
    typ: 7.62 mm
    src:
      - p644 "Section 39.4 title "28-Lead Skinny Plastic Dual In-Line (SP) - 300 mil Body [SPDIP]" -> 7.62 mm row spacing (the table has no eA row)"
      - 'p635 "Section 38.8 package legend: "28P3 28-lead, 0.300\" Wide, Skinny Plastic Dual Inline Package (SPDIP)""'
  body_length:
    min: 34.163 mm
    typ: 34.671 mm
    max: 35.56 mm
    src: p644 "28P3 table (inches), "Overall Length D 1.345 / 1.365 / 1.400""
  body_height:
    min: 3.048 mm
    typ: 3.429 mm
    max: 3.81 mm
    src: p644 "28P3 table (inches), "Molded Package Thickness A2 .120 / .135 / .150""
  lead_thickness:
    min: 0.2032 mm
    typ: 0.254 mm
    max: 0.381 mm
    src: p644 "28P3 table (inches), "Lead Thickness c .008 / .010 / .015""
  overall_height:
    max: 5.08 mm
    src: p644 "28P3 table (inches), "Top to Seating Plane A" (MAX .200 only)"
  standoff:
    min: 0.381 mm
    src: p644 "28P3 table (inches), "Base to Seating Plane A1" (MIN .015 only)"
  lead_width:
    min: 0.3556 mm
    typ: 0.4572 mm
    max: 0.5588 mm
    src: p644 "28P3 table (inches), "Lower Lead Width b .014 / .018 / .022""
