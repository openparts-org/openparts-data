# 28-lead 300 mil "skinny" plastic DIP (SPDIP). Values from Microchip
# drawing C04-070B (section 39.4 "28P3", "28-Lead Skinny Plastic Dual
# In-Line (SP) - 300 mil Body [SPDIP]"), datasheet DS40002061B page 644.
# The page's text layer uses an encoded font, so the page was rendered
# and the table read from the image.
#
# The table is in inches; values below are exact unit conversions
# (x 25.4) of the printed MIN/NOM/MAX.
#
# body_width (row spacing for the `dip` generator) = 7.62 mm: this
# drawing has NO eA row-spacing row (only E shoulder width .290/.310/
# .335 and eB max .430). 7.62 is the "0.300\"" stated in the package
# title ("300 mil Body") and in the ordering-table package legend
# (page 635: "28P3 28-lead, 0.300\" Wide, Skinny Plastic Dual Inline
# Package (SPDIP)"). Flagged for review.
# body_length = D, body_height = A2, overall_height = A (max only),
# standoff = A1 (min only). L (tip to seating plane) left out (not the
# gull-wing foot length `lead_length` means).
