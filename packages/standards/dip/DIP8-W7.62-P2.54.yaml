# 8-lead 300 mil plastic DIP. Values from Atmel/Microchip drawing 8P3
# Rev B ("8P3, 8-lead, 0.300\" Wide Body, Plastic Dual In-line Package
# (PDIP)"), section 26.1 of datasheet 2586Q, page 207. Note 1 of that
# drawing: "refer to JEDEC Drawing MS-001, Variation BA".
#
# The table is in inches; values below are exact unit conversions
# (x 25.4) of the printed MIN/NOM/MAX, nothing else.
#
# `dip` generator convention: body_width is the ROW SPACING, taken from
# "eA 0.300 BSC" (= 7.62 mm), not the molded width E1 (.240/.250/.280).
# body_length = D (.355/.365/.400), body_height = A2 (.115/.130/.195),
# overall_height = A (max .210 only). The drawing gives no A1, so no
# standoff. L (tip to seating plane) is a through-hole lead length, not
# the gull-wing foot length `lead_length` means; left out.
#
# Also used by TI parts in the P (R-PDIP-T8) package: TI MPDI001
# (4040082/E) is likewise "within JEDEC MS-001 variation BA". See the
# part files for the comparison.
schema_version: "0.2"
kind: package
id: standards/DIP8-W7.62-P2.54
family: dip
lead_count: 8
source: microchip/2586@revQ

pitch: { typ: 2.54 mm, src: 'p207 "8P3 "COMMON DIMENSIONS" (inches), "e 0.100 BSC" -> 2.54 mm"' }
geometry: { type: parametric, generator: dip }

dimensions:
  body_width:
    typ: 7.62 mm
    src: p207 "8P3 "COMMON DIMENSIONS" (inches), "eA 0.300 BSC" (row spacing, note 4) -> 7.62 mm; dip generator's body_width is the row spacing"
  body_length:
    min: 9.017 mm
    typ: 9.271 mm
    max: 10.16 mm
    src: p207 "8P3 "COMMON DIMENSIONS" (inches), "D 0.355 / 0.365 / 0.400" (note 3)"
  body_height:
    min: 2.921 mm
    typ: 3.302 mm
    max: 4.953 mm
    src: p207 "8P3 "COMMON DIMENSIONS" (inches), "A2 0.115 / 0.130 / 0.195""
  lead_thickness:
    min: 0.2032 mm
    typ: 0.254 mm
    max: 0.3556 mm
    src: p207 "8P3 "COMMON DIMENSIONS" (inches), "c 0.008 / 0.010 / 0.014""
  overall_height:
    max: 5.334 mm
    src: p207 "8P3 "COMMON DIMENSIONS" (inches), "A" (MAX 0.210 only)"
  lead_width:
    min: 0.3556 mm
    typ: 0.4572 mm
    max: 0.5588 mm
    src: p207 "8P3 "COMMON DIMENSIONS" (inches), "b 0.014 / 0.018 / 0.022""
