    nominal: 7.62
    unit: mm
  body_length:
    nominal: 9.271
    min: 9.017
    max: 10.16
    unit: mm
  body_height:
    nominal: 3.302
    min: 2.921
    max: 4.953
    unit: mm
  overall_height:
    max: 5.334
    unit: mm
  lead_width:
