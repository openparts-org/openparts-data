# onsemi 2N3904 straight-lead TO-92 (JEDEC CASE 135AN), confirmed from
# the "MECHANICAL CASE OUTLINE / PACKAGE DIMENSIONS" drawing (page 7).
# Text extraction on this page returned only title-block boilerplate
# (the dimensions are vector art), so the drawing was rendered to an
# image (pypdfium2, 4x) and read directly.
#
# `nominal` below is this dataset's own midpoint of each stated
# min/max range (the datasheet gives only min/max on this drawing, no
# separate nominal) -- disclosed as derived, not datasheet-stated. Note
# the drawing's own informal title text ("TO-92 3 4.825x4.76") is a
# rounded label that happens to match these computed midpoints closely,
# corroborating (not proving) the mapping.
