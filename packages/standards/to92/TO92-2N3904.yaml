# NOTE (2026-11-10): nominals this dataset had derived (a min/max
# midpoint, or a copy of a lone max/min) were removed; only what the
# source prints is recorded. Generators draw a min/max-only dimension at
# its midpoint and a lone limit at that limit, without storing either.
# onsemi 2N3904 straight-lead TO-92 (JEDEC CASE 135AN), confirmed from
# the "MECHANICAL CASE OUTLINE / PACKAGE DIMENSIONS" drawing (page 7).
# Text extraction on this page returned only title-block boilerplate
# (the dimensions are vector art), so the drawing was rendered to an
# image (pypdfium2, 4x) and read directly.
#
# `nominal` below is this dataset's own midpoint of each stated
# min/max range (the datasheet gives only min/max on this drawing, no
# separate nominal) -- disclosed as derived, not datasheet-stated. Note
# the drawing's own informal title text ("TO-92 3 4.825x4.76") is a
# rounded label that happens to match these computed midpoints closely,
# corroborating (not proving) the mapping.
schema_version: "0.2"
kind: package
id: standards/TO92-2N3904
family: to92
lead_count: 3
source: onsemi/2N3904-D

pitch:
  typ: 1.27 mm
  src: p7 "CASE 135AN drawing, boxed (basic) lead-pitch dimension 1.27mm (pin1-pin2/pin2-pin3); total span pin1-pin3 boxed as 2.54mm, consistent"

geometry: { type: parametric, generator: to92 }

dimensions:
  body_width:
    min: 4.32 mm
    max: 5.2 mm
    src: 'p7 "CASE 135AN drawing, front elevation, width across the flat face: max 5.20mm / min 4.32mm"'
  body_length:
    min: 3.05 mm
    max: 4.19 mm
    src: 'p7 "CASE 135AN drawing, D-shape cross-section view, depth from flat face to rounded back: max 4.19mm / min 3.05mm"'
  body_height:
    min: 4.32 mm
    max: 5.33 mm
    src: 'p7 "CASE 135AN drawing, front elevation, can height (excludes lead length below body): max 5.33mm / min 4.32mm"'
