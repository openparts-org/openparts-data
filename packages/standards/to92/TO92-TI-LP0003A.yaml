# NOTE (2026-11-10): the derived midpoint nominals mentioned below have
# been removed -- only the min/max the source states are recorded
# (Canonical Data Specification 7, 20.1). Generators draw a min/max-only
# dimension at its midpoint without storing it (openparts-mcad
# defaults::required).
# TI LP0003A "TO-92 - 5.34 mm max height" (drawing 4215214/C 04/2025,
# JEDEC TO-226 variation AA per its note 4), read from the rendered
# outline page of SNIS159H (page 31); the same drawing is page 45 of
# SNVS754O.
#
# Mapping (as TO92-2N3904/TO92-BC547): body_width = width across the
# flat face (5.21/4.44), body_height = body height above the lead exit
# (5.34/4.32), body_length = flat-face-to-round-back depth in the
# bottom view (4.19/3.17). The drawing gives only max/min, but the to92
# generator requires a nominal for body_width/body_length: `nominal`
# on those three is this dataset's midpoint, DERIVED, not printed (same
# technique as the existing to92 packages). Pitch "2X 1.27 +/- 0.13".
# Lead width (0.55/0.38) and thickness (0.43/0.35) min/max only.
schema_version: "0.2"
kind: package
id: standards/TO92-TI-LP0003A
family: to92
lead_count: 3
source: ti/SNIS159H

pitch:
  min: 1.14 mm
  typ: 1.27 mm
  max: 1.4 mm
  src: p31 "LP0003A straight lead option, "2X 1.27 +/- 0.13""

geometry: { type: parametric, generator: to92 }

dimensions:
  body_width:
    min: 4.44 mm
    max: 5.21 mm
    src: p31 "LP0003A front view, width 5.21/4.44 -- no nominal stated (min/max only)"
  body_length:
    min: 3.17 mm
    max: 4.19 mm
    src: p31 "LP0003A bottom view, depth 4.19/3.17 -- no nominal stated (min/max only)"
  body_height:
    min: 4.32 mm
    max: 5.34 mm
    src: p31 "LP0003A front view, body height 5.34/4.32 -- no nominal stated (min/max only)"
  lead_thickness: { min: 0.35 mm, max: 0.43 mm, src: 'p31 "LP0003A side view, "3X 0.43/0.35""' }
  lead_width:     { min: 0.38 mm, max: 0.55 mm, src: 'p31 "LP0003A front view, "3X 0.55/0.38""' }
