# TI KVU (TO-252, 3 lead positions + tab), outline drawing KVU0003A,
# drawing number 4218915/A 02/2017 ("Reference JEDEC registration
# TO-252"), SLVS059V (uA78M) page 38, read from the rendered drawing.
#
# Frame: leads on the left (-X), tab on the right (+X), lead 1 at the
# top, as in the drawing's top view. Lead 2 (centre) is the short stub
# ("1.02 / 0.61" from the body), recorded as trimmed.
#
# TAB NUMBER (flagged for review): the drawing labels the exposed thermal
# pad / tab "4" (bottom view). The pin configuration (page 3, Figure 4-2)
# labels the tab "COMMON" without a number, and Table 4-1 lists only
# pins 1-3; the addendum says "TO-252 (KVU) | 3". "4" -- the only number
# the source prints for the tab -- is used, and the ti/UA78M33 device
# keys pin "4" = COMMON.
#
# Dimension mapping: 9.40-10.41 -> overall_width; 5.97-6.22 (datum B to
# tab-side body edge) -> body_width; 0.89-1.27 -> tab_length; 6.35-6.70
# (datum A) -> body_length; 4.953-5.460 -> tab_width (note 3: "Shape may
# vary per different assembly sites"); "2.52 MAX" -> overall_height;
# Detail A 0.00-0.13 -> standoff; Detail A 1.40-1.78 -> lead_length;
# 0.46-0.61 lead section -> lead_thickness. Left out: tab thickness
# 0.46-0.61, "5.21 MIN" / "4.32 MIN" exposed thermal pad size, the 0.51
# gage plane.
schema_version: "0.2"
kind: package
id: standards/TO252-6.1x6.5-P2.29-TabPin4-TI-KVU
family: dpak
lead_count: 3
source: ti/SLVS059V

pitch:
  typ: 2.29 mm
  src: p38 "KVU0003A outline (4218915/A), top view, basic dimension "2.29" (lead 1-3 span basic "4.58")"

tab:
  number: "4"
  trimmed_leads: ["2"]
  src:
    - 'p38 "KVU0003A outline, bottom view: exposed thermal pad labelled "4"; top view: lead 2 is the short stub "1.02 / 0.61" from the body (trimmed)"'
    - 'p3 "Figure 4-2 "KVU Package, 3-Pin TO-252 (Top View)": tab labelled "COMMON" (no number); Table 4-1 lists pins 1-3 only -- see header"'

geometry: { type: parametric, generator: dpak }

dimensions:
  body_width:
    min: 5.97 mm
    max: 6.22 mm
    src: p38 "KVU0003A outline, top view, datum B to tab-side body edge "6.22 / 5.97""
  body_length:
    min: 6.35 mm
    max: 6.7 mm
    src: p38 "KVU0003A outline, top view, datum A "6.70 / 6.35""
  tab_length:
    min: 0.89 mm
    max: 1.27 mm
    src: p38 "KVU0003A outline, top view, body edge to tab end "1.27 / 0.89""
  tab_width:
    min: 4.953 mm
    max: 5.46 mm
    src: p38 "KVU0003A outline, top view, tab "5.460 / 4.953" (note 3)"
  overall_width:
    min: 9.4 mm
    max: 10.41 mm
    src: p38 "KVU0003A outline, top view, lead toe to tab end "10.41 / 9.40""
  overall_height: { max: 2.52 mm, src: 'p38 "KVU0003A outline, side view "2.52 MAX""' }
  standoff:
    min: 0 mm
    max: 0.13 mm
    src: p38 "KVU0003A outline, "DETAIL A TYPICAL" "0.13 / 0.00""
  lead_width:
    min: 0.635 mm
    max: 0.89 mm
    src: p38 "KVU0003A outline, top view "3X 0.890 / 0.635""
  lead_length:
    min: 1.4 mm
    max: 1.78 mm
    src: p38 "KVU0003A outline, "DETAIL A TYPICAL" foot "1.78 / 1.40""
  lead_thickness:
    min: 0.46 mm
    max: 0.61 mm
    src: p38 "KVU0003A outline, side view, lead "0.61 / 0.46""
