# TI NDP (TO-252, 3 lead positions + tab), outline drawing NDP0003B,
# drawing number 4219870/A 03/2018 ("Reference JEDEC registration
# TO-252"), SNOS412Q (LM1117) page 41, read from the rendered drawing.
#
# Frame: leads on the left (-X), tab on the right (+X), lead 1 at the
# top, as in the top view of the drawing. Lead 2 (centre) is the short
# stub ending at the body ("1.02 / 0.64" from the body), so it is
# recorded as trimmed.
#
# TAB NUMBER CONFLICT (flagged for review): the drawing's bottom view
# labels the exposed tab "4", but Table 6-1 "Pin Functions" (page 3)
# lists VOUT for TO-252 as "2 , TAB" and the package option addendum
# (page 23) says "TO-252 (NDP) | 3" pins. This package uses "4" -- the
# only number the source prints for the tab -- so the same pin key
# ("4" = VOUT) serves both the DCY (SOT-223 "2, 4") and NDP packages of
# the ti/LM1117-3.3 device. A reviewer preferring the pin table's "TAB"
# label would need a separate package and a device pin "TAB".
#
# Dimension mapping: 9.40-10.42 lead toe to tab end -> overall_width;
# 5.97-6.22 (datum B, lead-side body edge, to the tab-side body edge) ->
# body_width; 0.88-1.27 (body edge to tab end) -> tab_length; 6.35-6.73
# (datum A) -> body_length; 4.96-5.46 -> tab_width; "2.55 MAX" ->
# overall_height; 0.46-0.60 lead section -> lead_thickness; "0.51 MIN"
# foot length -> lead_length (min only). Left out: the "0.17" offset at
# the seating plane (single number, unclear whether max or a reference;
# not used as standoff), 0.89-1.14 (lead bend height, no field), tab
# thickness 0.46-0.88, "4.32 MIN" exposed-pad length, (2.345)/(2.5)
# reference dimensions.
schema_version: "0.2"
kind: package
id: standards/TO252-6.1x6.5-P2.29-TabPin4-TI-NDP
family: dpak
lead_count: 3
source: ti/SNOS412Q

pitch:
  typ: 2.285 mm
  src: p41 "NDP0003B outline (4219870/A), top view, basic dimension "2.285" (lead 1-3 span basic "4.57")"

tab:
  number: "4"
  trimmed_leads: ["2"]
  src:
    - p41 "NDP0003B outline, bottom view, tab label; top view, lead 2 stub"
    - p3 "Table 6-1 "Pin Functions", VOUT row, TO-252 column "2 , TAB" -- conflicts with the drawing's "4", see header"

geometry: { type: parametric, generator: dpak }

dimensions:
  body_width:
    min: 5.97 mm
    max: 6.22 mm
    src: p41 "NDP0003B outline, top view, datum B to tab-side body edge "6.22 / 5.97""
  body_length:
    min: 6.35 mm
    max: 6.73 mm
    src: p41 "NDP0003B outline, top view, datum A "6.73 / 6.35""
  tab_length:
    min: 0.88 mm
    max: 1.27 mm
    src: p41 "NDP0003B outline, top view, body edge to tab end "1.27 / 0.88""
  tab_width:
    min: 4.96 mm
    max: 5.46 mm
    src: p41 "NDP0003B outline, top view, tab "5.46 / 4.96""
  overall_width:
    min: 9.4 mm
    max: 10.42 mm
    src: p41 "NDP0003B outline, top view, lead toe to tab end "10.42 / 9.40""
  overall_height: { max: 2.55 mm, src: 'p41 "NDP0003B outline, side view "2.55 MAX""' }
  lead_width:
    min: 0.64 mm
    max: 0.88 mm
    src: p41 "NDP0003B outline, top view "3X 0.88 / 0.64""
  lead_length:
    min: 0.51 mm
    src: p41 "NDP0003B outline, side view "0.51 MIN" (foot length; min only)"
  lead_thickness:
    min: 0.46 mm
    max: 0.6 mm
    src: p41 "NDP0003B outline, side view, lead foot "0.60 / 0.46""
