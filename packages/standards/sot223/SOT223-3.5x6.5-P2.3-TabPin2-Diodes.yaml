# Diodes Incorporated SOT223 (3 leads + tab), from DS31009 Rev. 24-3
# (AP1117) page 8, "Package Outline Dimensions (1) Package Type: SOT223"
# table (Dim / Min / Max / Typ). Typ values are printed by the source and
# recorded as nominal.
#
# Tab number: the source does not give the tab a number of its own. Page 1
# "Pin Assignments" SOT223 (Top View) numbers the leads 3 VIN / 2 VOUT /
# 1 Adj (GND) and says "Tab is VOUT"; VOUT is pin 2 in the "Pin
# Descriptions" table (page 2). The tab is therefore numbered "2" (two
# pads numbered 2, as KiCad's SOT-223-3_TabPin2).
#
# Symbol mapping: E (3.45-3.55, across the leads in the side view) ->
# body_width; D (6.45-6.55, along the lead row) -> body_length; E1
# (6.90-7.10, lead toe to tab toe) -> overall_width; b1 -> tab_width;
# b2 -> lead_width; C -> lead_thickness; e1 2.30 -> pitch.
# "A" (1.55-1.65) is drawn in the end view from the top of the body down
# to the A1 reference line (A1 is dimensioned separately from the seating
# plane), so it is recorded as body_height, not overall_height. Q
# (0.84-0.94) has no field and is left out.
schema_version: "0.2"
kind: package
id: standards/SOT223-3.5x6.5-P2.3-TabPin2-Diodes
family: sot223
lead_count: 3
source: diodes/DS31009

pitch:
  typ: 2.3 mm
  src: p8 ""Package Outline Dimensions" SOT223 table, Dim "e1" (Typ 2.30; e = 4.60)"

tab:
  number: "2"
  src:
    - 'p1 ""Pin Assignments" SOT223 (Top View): leads 3 VIN, 2 VOUT, 1 Adj (GND); "Tab is VOUT""'
    - 'p2 ""Pin Descriptions" table: pin 2 = VOUT"'

geometry: { type: parametric, generator: sot223 }

dimensions:
  body_width:
    min: 3.45 mm
    typ: 3.5 mm
    max: 3.55 mm
    src: p8 "SOT223 table, Dim "E" (3.45 / 3.55 / Typ 3.50)"
  body_length:
    min: 6.45 mm
    typ: 6.5 mm
    max: 6.55 mm
    src: p8 "SOT223 table, Dim "D" (6.45 / 6.55 / Typ 6.50)"
  body_height:
    min: 1.55 mm
    typ: 1.6 mm
    max: 1.65 mm
    src: p8 "SOT223 table, Dim "A" (1.55 / 1.65 / Typ 1.60); drawn above the A1 line, see header"
  tab_width:
    min: 2.9 mm
    typ: 3 mm
    max: 3.1 mm
    src: p8 "SOT223 table, Dim "b1" (2.90 / 3.10 / Typ 3.00)"
  overall_width:
    min: 6.9 mm
    typ: 7 mm
    max: 7.1 mm
    src: p8 "SOT223 table, Dim "E1" (6.90 / 7.10 / Typ 7.00)"
  standoff:
    min: 0.01 mm
    typ: 0.05 mm
    max: 0.15 mm
    src: p8 "SOT223 table, Dim "A1" (0.010 / 0.15 / Typ 0.05)"
  lead_width:
    min: 0.6 mm
    typ: 0.7 mm
    max: 0.8 mm
    src: p8 "SOT223 table, Dim "b2" (0.60 / 0.80 / Typ 0.70)"
  lead_length:
    min: 0.85 mm
    typ: 0.95 mm
    max: 1.05 mm
    src: p8 "SOT223 table, Dim "L" (0.85 / 1.05 / Typ 0.95)"
  lead_thickness:
    min: 0.2 mm
    typ: 0.25 mm
    max: 0.3 mm
    src: p8 "SOT223 table, Dim "C" (0.20 / 0.30 / Typ 0.25)"
