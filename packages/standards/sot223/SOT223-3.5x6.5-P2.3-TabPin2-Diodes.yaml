    min: 0.85
    max: 1.05
    unit: mm
  lead_thickness:
    nominal: 0.25
    min: 0.20
    max: 0.30
    unit: mm
  tab_width:
    nominal: 3.00
    min: 2.90
    max: 3.10
    unit: mm

