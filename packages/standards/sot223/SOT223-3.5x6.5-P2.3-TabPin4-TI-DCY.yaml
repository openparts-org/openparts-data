# TI DCY (SOT-223, 3 leads + tab), outline drawing DCY0004A, drawing
# number 4214843/C 05/2026 ("Reference JEDEC TO-261"). The same drawing
# revision is printed identically in SNOS412Q (LM1117, page 44) and
# SLVS059V (uA78M, page 32); values below were read from the rendered
# drawing and match in both documents.
#
# Frame: leads on the left (-X), tab on the right (+X), lead 1 at the
# top, as in the drawing itself. The drawing labels the leads 1..3 and
# the tab "4" (label "4" under the tab); the LM1117 pin table also numbers
# the tab 4 ("VOUT ... SOT-223: 2, 4"), and the addendum lists DCY as
# "SOT-223 (DCY) | 4" pins.
#
# All dimensions are min/max as printed; no nominal was invented. The
# side-view "(1.6)" is a reference-only value (note 1) and is not
# recorded as body_height; overall_height is the "1.8 MAX" (A).
# lead_length is the "0.75 MIN" foot length only. Lead thickness range
# 0.23-0.35 is the single lead-section callout of the side view.
schema_version: "0.2"
kind: package
id: standards/SOT223-3.5x6.5-P2.3-TabPin4-TI-DCY
family: sot223
lead_count: 3
source: ti/SNOS412Q

pitch:
  typ: 2.3 mm
  src:
    - p44 "DCY0004A outline (4214843/C), top view, basic dimension "2.3" between leads 1-2 (lead span basic "4.6")"
    - ti/SLVS059V p32 "DCY0004A outline (4214843/C), same basic "2.3""

tab:
  number: "4"
  src:
    - 'p44 "DCY0004A outline, top view: tab labelled "4""'
    - p3 "Table 6-1 "Pin Functions", VOUT row, SOT-223 column "2, 4""

geometry: { type: parametric, generator: sot223 }

dimensions:
  body_width:
    min: 3.3 mm
    max: 3.7 mm
    src: p44 "DCY0004A outline, top view, body dimension to datum B "3.7 / 3.3""
  body_length:
    min: 6.3 mm
    max: 6.7 mm
    src: p44 "DCY0004A outline, top view, body height along datum A "6.7 / 6.3""
  tab_width: { min: 2.9 mm, max: 3.1 mm, src: 'p44 "DCY0004A outline, top view, tab "3.1 / 2.9""' }
  lead_thickness:
    min: 0.23 mm
    max: 0.35 mm
    src: p44 "DCY0004A outline, lead detail "0.35 / 0.23""
  overall_width:
    min: 6.7 mm
    max: 7.3 mm
    src: p44 "DCY0004A outline, top view, lead toe to tab toe "7.3 / 6.7""
  overall_height: { max: 1.8 mm, src: 'p44 "DCY0004A outline, side view "1.8 MAX""' }
  standoff:
    min: 0.02 mm
    max: 0.1 mm
    src: p44 "DCY0004A outline, side view, body bottom to seating plane C "0.10 / 0.02""
  lead_width:
    min: 0.66 mm
    max: 0.84 mm
    src: p44 "DCY0004A outline, top view "3X 0.84 / 0.66""
  lead_length:
    min: 0.75 mm
    src: p44 "DCY0004A outline, lead detail "0.75 MIN" (foot length; min only)"
