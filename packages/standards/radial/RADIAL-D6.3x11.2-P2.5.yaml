# Panasonic FC-A series case size phiD=6.3mm / L=11.2mm. Lead pitch
# confirmed two independent ways within the same datasheet: the
# part-specific "Characteristics list" ordering table (page 3, column
# "Lead space -- Straight" = 2.5mm for the EEUFC0J331S row) and the
# general phiD/L/phid/F dimension table (page 1, phiD=6.3mm row, "L>=11"
# case group: F=2.5mm, phid=0.5mm) -- both agree exactly.
schema_version: "0.2"
kind: package
id: standards/RADIAL-D6.3x11.2-P2.5
family: radial
lead_count: 2
source: panasonic/ABA0000C1209

pitch:
  typ: 2.5 mm
  src:
    - p3 ""Characteristics list" table, EEUFC0J331S row, column "Lead space -- Straight""
    - p1 "General dimensions table, phiD=6.3mm row ("L>=11" case group), column "F""

geometry: { type: parametric, generator: radial }

dimensions:
  body_width:
    typ: 6.3 mm
    src: p3 ""Characteristics list" table, EEUFC0J331S row, column "phiD""
  body_length:
    typ: 6.3 mm
    src: p3 ""Characteristics list" table, EEUFC0J331S row, column "phiD""
  body_height:
    typ: 11.2 mm
    src: p3 ""Characteristics list" table, EEUFC0J331S row, column "L""
