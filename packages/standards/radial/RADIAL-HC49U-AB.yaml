# NOTE (2026-11-10): nominals this dataset had derived (a min/max
# midpoint, or a copy of a lone max/min) were removed; only what the
# source prints is recorded. Generators draw a min/max-only dimension at
# its midpoint and a lone limit at that limit, without storing either.
# Abracon "AB" series HC-49/U through-hole crystal can. Confirmed from
# the outline drawing (page 3) and the matching dimension summary box
# printed on every page header ("11.5 x 5.0 x 13.46mm").
#
# The real HC-49/U can is OVAL (stadium-shaped): 11.5mm (long axis,
# along the lead row = X = body_width) x 5.0mm (short axis = Y =
# body_length). The `radial` generator draws a stated body_length
# shorter than body_width as a stadium outline.
schema_version: "0.2"
kind: package
id: standards/RADIAL-HC49U-AB
family: radial
lead_count: 2
source: abracon/ab-hc49u

pitch:
  min: 4.68 mm
  typ: 4.88 mm
  max: 5.08 mm
  src: p3 "Outline drawing, lead pitch "0.192in +/- 0.008in" (4.88mm +/- 0.20mm)"

geometry: { type: parametric, generator: radial }

# `nominal` set equal to each dimension's datasheet-stated max (no
# min/nominal given for any of these three) -- the `radial` generator
# requires a nominal body_width to build geometry at all, and would
# otherwise silently fall back to a generic default for body_height.
dimensions:
  body_width:
    max: 11.5 mm
    src: p1 "Per-page dimension summary box, long axis (see comment above)"
  body_length:
    max: 5 mm
    src: p1 "Per-page dimension summary box, short axis (see comment above)"
  body_height:
    max: 13.46 mm
    src: p1 "Per-page dimension summary box "11.5 x 5.0 x 13.46mm" -- can height (max only, no min/nominal given)"
