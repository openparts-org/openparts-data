# Everlight 3384-15UTC/S400-X9, 5mm (T-1 3/4) round THT LED. Same
# dual-diameter situation as RADIAL-WP7113ID: the datasheet gives both
# a 5.0mm lens/dome diameter and a wider 5.6mm flange diameter.
# body_length/body_width use the 5.0mm lens diameter (matching the
# "5.0mm Round LED" naming and RADIAL-WP7113ID's own precedent), not
# the flange.
schema_version: "0.2"
kind: package
id: standards/RADIAL-3384-EVERLIGHT
family: radial
lead_count: 2
source: everlight/DLE-0001270

pitch: { typ: 2.54 mm, src: 'p2 "Package Dimensions drawing, lead spacing 2.54mm"' }
geometry: { type: parametric, generator: radial }

dimensions:
  body_width:
    min: 4.8 mm
    typ: 5 mm
    max: 5.2 mm
    src: p2 "Package Dimensions drawing, lens diameter 5.0 +/-0.2mm, see comment above"
  body_length:
    min: 4.8 mm
    typ: 5 mm
    max: 5.2 mm
    src: p2 "Package Dimensions drawing, lens diameter 5.0 +/-0.2mm -- chosen over the 5.6mm flange diameter, see comment above"
  body_height:
    min: 8.3 mm
    typ: 8.6 mm
    max: 8.9 mm
    src: p2 "Package Dimensions drawing, dome length (flange to lens tip) 8.6 +/-0.3mm"
