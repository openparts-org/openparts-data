# Panasonic FR-A series case size phiD 5.0 / L 11.0 (e.g. EEUFR1C101,
# EEUFR1A101). Nominals from the page-4 "Characteristics list" rows
# (phiD 5.0, L 11.0, lead dia 0.5, straight lead space 2.0) and the
# page-1 dimension table (phiD 5.0 column: phid 0.5, F 2.0).
# Tolerances from the page-1 "Dimensions" drawing (rendered):
# "phiD+/-0.5", "L <= 16: L+/-1.5", "F+/-0.5", "phid+/-0.05";
# min/max below are those printed tolerances applied to the nominals.
schema_version: "0.2"
kind: package
id: standards/RADIAL-D5.0x11-P2.0
family: radial
lead_count: 2
source: panasonic/ABA0000C1259

pitch:
  min: 1.5 mm
  typ: 2 mm
  max: 2.5 mm
  src:
    - p4 ""Characteristics list", EEUFR1C101 row, "Lead space -- Straight" 2.0"
    - p1 "Dimensions table, phiD 5.0 column, F 2.0; drawing "F+/-0.5""

geometry: { type: parametric, generator: radial }

dimensions:
  body_width:
    min: 4.5 mm
    typ: 5 mm
    max: 5.5 mm
    src: p4 ""Characteristics list", EEUFR1C101 row, phiD 5.0; page-1 drawing "phiD+/-0.5""
  body_length:
    min: 4.5 mm
    typ: 5 mm
    max: 5.5 mm
    src: p4 ""Characteristics list", EEUFR1C101 row, phiD 5.0; page-1 drawing "phiD+/-0.5""
  body_height:
    min: 9.5 mm
    typ: 11 mm
    max: 12.5 mm
    src: 'p4 ""Characteristics list", EEUFR1C101 row, L 11.0; page-1 drawing note "L <= 16: L+/-1.5""'
  lead_width:
    min: 0.45 mm
    typ: 0.5 mm
    max: 0.55 mm
    src: p4 ""Characteristics list", EEUFR1C101 row, lead dia. 0.5; page-1 drawing "phid+/-0.05""
