# Vishay SMC (DO-214AB) outline, "PACKAGE OUTLINE DIMENSIONS in inches
# (millimeters)" SMC (DO-214AB), document 88751 (SS32 thru SS36, Revision
# 23-Apr-2020) page 3, re-read from the rendered drawing (pdftoppm).
# Only max/min pairs are printed; no nominal is recorded.
# Mapping from the drawing's arrows: body_length = molded body along the
# terminal axis (0.280/0.260), body_width = body across (0.246/0.220),
# lead_width = terminal width (0.126/0.114), overall_length = lead-tip
# span (0.320/0.305), lead_length = folded foot (0.060/0.030),
# lead_thickness (0.012/0.006), body_height = seating plane to body top
# (0.103/0.079, the only height; no A2), standoff (0.008/0).
# Same numbers, row for row (pdftotext -layout diff), in Vishay 88394
# SMCJ5.0A thru SMCJ188CA (Revision 09-Jan-2024) page 5, so SMCJ parts
# reuse this package.
# Supersedes standards/CHIP-SMC-DO214AB (family chip), deleted in this
# change.
# construction: molded -- page 1 MECHANICAL DATA "Molding compound meets
# UL 94 V-0 flammability rating".
