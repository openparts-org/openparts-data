# Bourns SMA (DO-214AC), SMAJ Transient Voltage Suppressor Diode Series
# datasheet (footer "REV. 09/20") page 3 "Product Dimensions", read from
# the rendered drawing (pdftoppm) and its table (MM over (INCHES)).
# Letters from the drawing's arrows: A = body along the terminal axis
# (body_length), B = body across (body_width), C = terminal width
# (lead_width), D = lead thickness, E = lead-tip span (overall_length),
# F = body underside to seating plane (standoff, "0.203 MAX." only),
# G = seating plane to body top (body_height; no A2 given), H = folded
# foot (lead_length). Min/max ranges only; no nominal recorded.
# Kept separate from standards/DO214AC-VISHAY-88711: a different vendor's
# drawing, and D (0.15-0.31) / F (0.203 max) are not number-identical.
# Supersedes standards/CHIP-SMA-DO214AC for bourns/SMAJ5.0A (that chip
# package is deleted in this change).
# construction: molded -- page 3 Physical Specifications "Case ...
# Molded plastic per UL Class 94V-0".
schema_version: "0.2"
kind: package
id: standards/DO214AC-BOURNS-SMAJ
family: do214
lead_count: 2
source: bourns/SMAJ

pitch: { unit: mm }

construction:
  value: molded
  src: 'p3 "Physical Specifications: "Case ... Molded plastic per UL Class 94V-0""'

geometry: { type: parametric, generator: do214 }

dimensions:
  body_width:
    min: 2.54 mm
    max: 2.79 mm
    src: p3 "Product Dimensions table, B 2.54 - 2.79 (0.100 - 0.110)"
  body_length:
    min: 3.99 mm
    max: 4.5 mm
    src: p3 "Product Dimensions table, A 3.99 - 4.50 (0.157 - 0.177)"
  body_height:
    min: 1.98 mm
    max: 2.29 mm
    src: p3 "Product Dimensions table, G 1.98 - 2.29 (0.078 - 0.090)"
  lead_thickness:
    min: 0.15 mm
    max: 0.31 mm
    src: p3 "Product Dimensions table, D 0.15 - 0.31 (0.006 - 0.012)"
  overall_length:
    min: 4.93 mm
    max: 5.28 mm
    src: p3 "Product Dimensions table, E 4.93 - 5.28 (0.194 - 0.208)"
  standoff: { max: 0.203 mm, src: 'p3 "Product Dimensions table, F 0.203 MAX. (0.008)"' }
  lead_width:
    min: 1.25 mm
    max: 1.65 mm
    src: p3 "Product Dimensions table, C 1.25 - 1.65 (0.049 - 0.065)"
  lead_length:
    min: 0.76 mm
    max: 1.52 mm
    src: p3 "Product Dimensions table, H 0.76 - 1.52 (0.030 - 0.060)"
