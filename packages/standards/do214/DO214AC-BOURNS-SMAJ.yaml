# Bourns SMA (DO-214AC), SMAJ Transient Voltage Suppressor Diode Series
# datasheet (footer "REV. 09/20") page 3 "Product Dimensions", read from
# the rendered drawing (pdftoppm) and its table (MM over (INCHES)).
# Letters from the drawing's arrows: A = body along the terminal axis
# (body_length), B = body across (body_width), C = terminal width
# (lead_width), D = lead thickness, E = lead-tip span (overall_length),
# F = body underside to seating plane (standoff, "0.203 MAX." only),
# G = seating plane to body top (body_height; no A2 given), H = folded
# foot (lead_length). Min/max ranges only; no nominal recorded.
# Kept separate from standards/DO214AC-VISHAY-88711: a different vendor's
# drawing, and D (0.15-0.31) / F (0.203 max) are not number-identical.
# Supersedes standards/CHIP-SMA-DO214AC for bourns/SMAJ5.0A (that chip
# package is deleted in this change).
# construction: molded -- page 3 Physical Specifications "Case ...
# Molded plastic per UL Class 94V-0".
