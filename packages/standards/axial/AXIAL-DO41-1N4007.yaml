# Vishay 1N4007 (DO-41 / DO-204AL) axial-leaded diode. Lead pitch
# follows this dataset's existing DO-35 convention (a real KiCad
# reference footprint's pad spacing, not a datasheet fact -- DO-41
# leads also ship straight with no forming/pitch dimension in the
# datasheet).
#
# Dimensions read from the PACKAGE OUTLINE DIMENSIONS drawing (page 4):
#   0.107 (2.7) / 0.080 (2.0) DIA.   -> body diameter, 2.0-2.7mm
#   0.205 (5.2) / 0.160 (4.1)        -> axial body length, 4.1-5.2mm
#   1.0 (25.4) MIN. (x2)             -> lead lengths, not body
#
# Mapped the same way as AXIAL-DO35-1N4148: body_width and body_length
# are the diameter, body_height is the axial body length. `nominal`
# values are this dataset's own midpoints of the stated min/max
# (disclosed as derived, not Vishay-stated).
schema_version: "0.1"
kind: package
id: standards/AXIAL-DO41-1N4007

family: axial
lead_count: 2

pitch:
  nominal: 7.62
  unit: mm

dimensions:
  body_width:
    nominal: 2.35
    min: 2.0
    max: 2.7
    unit: mm
  body_length:
    nominal: 2.35
    min: 2.0
    max: 2.7
    unit: mm
  body_height:
    nominal: 4.65
    min: 4.1
    max: 5.2
    unit: mm

geometry:
  type: parametric
  generator: axial

provenance:
  "/pitch":
    - source: kicad/DO35-P7.62mm
      locator: "Real KiCad DO-35/DO-41 reference footprint's own pad-to-pad spacing (0.3in/7.62mm) -- not a Vishay datasheet fact"
  "/dimensions/body_width":
    - source: vishay/88503
      page: 4
      locator: "PACKAGE OUTLINE DIMENSIONS (DO-41), \"0.107 (2.7) / 0.080 (2.0) DIA.\""
  "/dimensions/body_length":
    - source: vishay/88503
      page: 4
      locator: "PACKAGE OUTLINE DIMENSIONS (DO-41), \"0.107 (2.7) / 0.080 (2.0) DIA.\" (circular body, so length = diameter)"
  "/dimensions/body_height":
    - source: vishay/88503
      page: 4
      locator: "PACKAGE OUTLINE DIMENSIONS (DO-41), \"0.205 (5.2) / 0.160 (4.1)\" axial body length"
