# NOTE (2026-11-10): nominals this dataset had derived (a min/max
# midpoint, or a copy of a lone max/min) were removed; only what the
# source prints is recorded. Generators draw a min/max-only dimension at
# its midpoint and a lone limit at that limit, without storing either.
# Vishay 1N4007 (DO-41 / DO-204AL) axial-leaded diode. Lead pitch
# follows this dataset's existing DO-35 convention (a real KiCad
# reference footprint's pad spacing, not a datasheet fact -- DO-41
# leads also ship straight with no forming/pitch dimension in the
# datasheet).
#
# Dimensions read from the PACKAGE OUTLINE DIMENSIONS drawing (page 4):
#   0.107 (2.7) / 0.080 (2.0) DIA.   -> body diameter, 2.0-2.7mm
#   0.205 (5.2) / 0.160 (4.1)        -> axial body length, 4.1-5.2mm
#   1.0 (25.4) MIN. (x2)             -> lead lengths, not body
#
# Mapped the same way as AXIAL-DO35-1N4148: body_width and body_length
# are the diameter, body_height is the axial body length. `nominal`
# values are this dataset's own midpoints of the stated min/max
# (disclosed as derived, not Vishay-stated).
schema_version: "0.2"
kind: package
id: standards/AXIAL-DO41-1N4007
family: axial
lead_count: 2
source: vishay/88503

pitch:
  typ: 7.62 mm
  src: kicad/DO35-P7.62mm "Real KiCad DO-35/DO-41 reference footprint's own pad-to-pad spacing (0.3in/7.62mm) -- not a Vishay datasheet fact"

construction:
  value: molded
  src: 'p1 "MECHANICAL DATA: "Case: DO-41 (DO-204AL), molded epoxy body""'

geometry: { type: parametric, generator: axial }

dimensions:
  body_width:
    min: 2 mm
    max: 2.7 mm
    src: p4 "PACKAGE OUTLINE DIMENSIONS (DO-41), "0.107 (2.7) / 0.080 (2.0) DIA.""
  body_length:
    min: 2 mm
    max: 2.7 mm
    src: p4 "PACKAGE OUTLINE DIMENSIONS (DO-41), "0.107 (2.7) / 0.080 (2.0) DIA." (circular body, so length = diameter)"
  body_height:
    min: 4.1 mm
    max: 5.2 mm
    src: p4 "PACKAGE OUTLINE DIMENSIONS (DO-41), "0.205 (5.2) / 0.160 (4.1)" axial body length"
