# Generic JEDEC-standard 32-lead TQFP, 7x7mm body, 0.8mm pitch -- not
# tied to one manufacturer's die, so any other 32-pin TQFP part sharing
# this exact mechanical outline can reference this same package. Values
# confirmed from Microchip datasheet DS40002061 Rev B, section 39.1
# "32A" package drawing (page 636, Microchip Technology Drawing
# C04-074B) -- read from a rendered image of the page, not text
# extraction (see sources/microchip/DS40002061.yaml for why).
#
# Unlike this dataset's other packages so far, this drawing states a
# real datasheet Nominal for every dimension used here (E1/D1 = body,
# A2 = body height), not just Min/Max -- no derived midpoint needed.
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
schema_version: "0.1"
kind: package
id: standards/TQFP32-7x7-P0.8

# `family: lqfp` deliberately, not a separate "tqfp" -- openparts-mcad
# has no distinct TQFP generator, and TQFP/LQFP are the same 4-sided
# gull-wing lead geometry, differing only in overall body-height class
# (already captured by `dimensions.body_height` below), not lead shape
# or numbering convention.
family: lqfp
lead_count: 32

pitch:
  nominal: 0.8
  unit: mm

dimensions:
  body_width:
    nominal: 7.0
    unit: mm

  body_length:
    nominal: 7.0
    unit: mm

  body_height:
    nominal: 1.0
    min: 0.95
    max: 1.05
    unit: mm
  overall_width:
    nominal: 9.0
    unit: mm
  overall_length:
    nominal: 9.0
    unit: mm
  overall_height:
    max: 1.2
    unit: mm
  standoff:
    min: 0.05
    max: 0.15
    unit: mm
  lead_width:
    nominal: 0.37
    min: 0.3
    max: 0.45
    unit: mm
  lead_length:
    nominal: 0.6
    min: 0.45
    max: 0.75
    unit: mm
  lead_thickness:
    min: 0.09
    max: 0.2
    unit: mm

geometry:
  type: parametric
  generator: lqfp

provenance:
  "/pitch":
    - source: microchip/DS40002061@revB
      page: 636
      locator: "Table, symbol \"e\" (\"0.80 BSC\")"
  "/dimensions/body_width":
    - source: microchip/DS40002061@revB
      page: 636
      locator: "Table, symbol \"E1\" (\"7.00 BSC\")"
  "/dimensions/body_length":
    - source: microchip/DS40002061@revB
      page: 636
      locator: "Table, symbol \"D1\" (\"7.00 BSC\")"
  "/dimensions/body_height":
    - source: microchip/DS40002061@revB
      page: 636
      locator: "Table, symbol \"A2\" (Min 0.95 / Nom 1.00 / Max 1.05)"
  "/dimensions/overall_width":
    - source: microchip/DS40002061@revB
      page: 636
      locator: "Drawing C04-074B dimension table, symbol \"E\" Overall Width (9.00 BSC)"
  "/dimensions/overall_length":
    - source: microchip/DS40002061@revB
      page: 636
      locator: "Drawing C04-074B dimension table, symbol \"D\" Overall Length (9.00 BSC)"
  "/dimensions/overall_height":
    - source: microchip/DS40002061@revB
      page: 636
      locator: "Drawing C04-074B dimension table, symbol \"A\" Overall Height (max only)"
  "/dimensions/standoff":
    - source: microchip/DS40002061@revB
      page: 636
      locator: "Drawing C04-074B dimension table, symbol \"A1\" Standoff (no nom)"
  "/dimensions/lead_width":
    - source: microchip/DS40002061@revB
      page: 636
      locator: "Drawing C04-074B dimension table, symbol \"b\" Lead Width"
  "/dimensions/lead_length":
    - source: microchip/DS40002061@revB
      page: 636
      locator: "Drawing C04-074B dimension table, symbol \"L\" Foot Length"
  "/dimensions/lead_thickness":
    - source: microchip/DS40002061@revB
      page: 636
      locator: "Drawing C04-074B dimension table, symbol \"c\" Lead Thickness (no nom)"
