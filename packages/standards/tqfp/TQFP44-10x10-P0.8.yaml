# 44-lead TQFP, 10x10x1.0mm body, 0.8mm pitch -- Atmel drawing "ML"
# rev J (02/06/2014), "Refer to JEDEC Drawing MS-026, Variation ACB".
# All values from the COMMON DIMENSIONS table in ATmega16U4/32U4
# datasheet 7766J, section 34.1 "TQFP44", page 423 (read from a rendered
# image). D1/E1 (body) -> body_width/length, D/E (lead span) ->
# overall_width/length, A2 -> body_height, A (max only) ->
# overall_height, A1 -> standoff (no nominal), C -> lead_thickness.
# `family: lqfp` for the same reason as standards/TQFP32-7x7-P0.8.
