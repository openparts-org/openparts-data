# 48-lead TQFP, 7x7x1.0mm body, 0.5mm pitch -- Microchip "48-Lead
# Plastic Thin Quad Flatpack (Y8) - 7x7x1.0 mm Body [TQFP]", drawing
# C04-300-Y8 Rev D sheet 2, in SAM D21/DA1 data sheet DS40001882L
# section 44.1.6 "48-Pin TQFP" (page 1088), dimension table read as text.
# Not the same as standards/LQFP48-7x7-P0.5: same footprint span but the
# LQFP body is 1.4mm thick (A2 1.35-1.45), this TQFP is 1.0mm (A2
# 0.95-1.05), so it is a separate package.
# `family: lqfp` for the same reason as standards/TQFP32-7x7-P0.8.
schema_version: "0.2"
kind: package
id: standards/TQFP48-7x7-P0.5
family: lqfp
lead_count: 48
source: microchip/DS40001882@revL

pitch:
  typ: 0.5 mm
  src: p1088 "Section 44.1.6, drawing C04-300-Y8 sheet 2, "Pitch e 0.50 BSC""

geometry: { type: parametric, generator: lqfp }

dimensions:
