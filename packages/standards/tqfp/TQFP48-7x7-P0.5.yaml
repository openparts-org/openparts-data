  overall_width:  { typ: 9 mm, src: 'p1088 "C04-300-Y8 sheet 2, "Overall Width E 9.00 BSC""' }
  overall_length: { typ: 9 mm, src: 'p1088 "C04-300-Y8 sheet 2, "Overall Length D 9.00 BSC""' }
  overall_height: { max: 1.2 mm, src: 'p1088 "C04-300-Y8 sheet 2, "Overall Height A" (max only)"' }
  standoff:
    min: 0.05 mm
    max: 0.15 mm
    src: p1088 "C04-300-Y8 sheet 2, "Standoff A1" (no nominal)"
  lead_width:
    min: 0.17 mm
    typ: 0.22 mm
    max: 0.27 mm
    src: p1088 "C04-300-Y8 sheet 2, "Terminal Width b""
  lead_length:
