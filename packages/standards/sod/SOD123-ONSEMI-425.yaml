# onsemi SOD-123 2-LEAD, 1.60x2.69x1.16, CASE 425 ISSUE H, DOCUMENT
# NUMBER 98ASB42927B (DATE 29 FEB 2024), page 4 of MBR0520LT1/D (October,
# 2024 - Rev. 7). The outline is an image: read from the rendered page
# (pdftoppm), MILLIMETER MIN/NOM/MAX (controlling dimension: mm).
# Letters from the drawing's arrows: E = body along the leads (top view,
# body_length), D = body across (body_width), H = lead-tip span (side
# view, overall_length), b = lead width (end view), c = lead thickness
# ("-" / "-" / 0.15: max only), L = foot ("0.25 REF."), A = seating plane
# to top (overall_height), A1 = standoff, A2 = body ("1.16 REF.").
# Reference values (REF.) are recorded as the nominal the table marks
# them with. STYLE 1: PIN 1. CATHODE, 2. ANODE.
# The same outline page renders pixel-identical (pdftoppm -r 100 crop,
# md5) in MMSZ5221BT1/D Rev. 17 page 7, MMSZ4678T1/D Rev. 13 page 6 and
# MBR130T1/D Rev. 6 page 5.
# Supersedes standards/CHIP-SOD123-MBR0520 (family chip), deleted in this
# change.
# construction: molded -- page 1 Mechanical Characteristics "Case: Epoxy,
# Molded".
