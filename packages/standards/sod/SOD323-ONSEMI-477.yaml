# Rev. 8; the datasheet carries an outline newer than itself). The
# outline is an image: read from the rendered page (pdftoppm),
# MILLIMETERS MIN/NOM/MAX (controlling dimension: millimeters). Bent
# gull-wing leads (side view), hence sod.
# Letters from the drawing's arrows: D = body along the leads (top view,
# body_length), E = body across (body_width), H = lead-tip span
# (overall_length), b = lead width, c = lead thickness, L = foot measured
# from the end of the radius (Note 5; "0.08" min only), A2 = body
# (body_height), A = overall height, A1 = standoff. L1 "0.40 (REF)" and
# A3 "0.15 (REF)" are not recorded. STYLE 1: PIN 1. CATHODE (POLARITY
# BAND), 2. ANODE.
