# onsemi SOD-523 1.20x0.80x0.60, CASE 502 ISSUE F, DOCUMENT NUMBER
# 98AON11524D (DATE 08 FEB 2024), page 4 of BAS16XV2T1/D (June, 2023 -
# Rev. 10; the datasheet carries an outline newer than itself). The
# outline is an image: read from the rendered page (pdftoppm), MILLIMETERS
# MIN/NOM/MAX (controlling dimension: millimeters). The side view shows
# flat leads leaving the body underside (not bent gull-wings), hence
# sod_flat.
# Letters from the drawing's arrows: D = body along the leads (top view,
# body_length), E = body across (body_width), H = lead-tip span (side
# view, overall_length), b = lead width, c = lead thickness, L = lead
# length beyond the body ("0.30 REF", recorded as the nominal the table
# marks), A = seating plane to body top (no A2 given, so body_height).
# L2 (lead under the body, 0.15 / 0.20 / 0.25) is not recorded.
# STYLE 1: PIN 1. CATHODE (POLARITY BAND), 2. ANODE.
