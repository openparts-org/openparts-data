# onsemi SOD-123FL, CASE 425AD ISSUE A, DOCUMENT NUMBER 98AON13725G (DATE
# 04 AUG 2017), page 4 of SS14FL/D (June, 2018 - Rev. 2). The outline is
# an image: read from the rendered page (pdftoppm), MILLIMETERS MIN/MAX
# only (no nominal recorded). Flat leads ("FRONT VIEW": leads straight
# out of the body underside), hence sod_flat.
# Letters from the drawing's arrows: D = body along the leads (top view,
# body_length), E = body across (body_width), H = lead-tip span
# (overall_length), b = lead width (bottom view), L = lead length (bottom
# view), c = lead thickness, A = seating plane to body top (no A2 given,
# so body_height). The "(0.35)" reference in the top view is not
# recorded. No STYLE list.
# Supersedes standards/CHIP-SOD123FL-SS14FL (family chip), deleted in
# this change.
