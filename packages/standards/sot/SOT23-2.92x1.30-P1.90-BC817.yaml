# NOTE (2026-11-10): nominals this dataset had derived (a min/max
# midpoint, or a copy of a lone max/min) were removed; only what the
# source prints is recorded. Generators draw a min/max-only dimension at
# its midpoint and a lone limit at that limit, without storing either.
# onsemi/Fairchild BC817-40, SOT-23 (JEDEC TO-236), drawing MA03DREV10
# (page 5, Figure 6). Close to the existing standards/SOT23-2.90x1.30-
# P1.90 package but NOT identical: this drawing's height is "1.20mm
# MAX", which exceeds that package's documented max of 1.11mm -- kept
# as its own package per this dataset's per-source-package convention
# (see the separate CHIP0603-* packages for the same pattern).
#
# Field mapping follows SOT23-2.90x1.30-P1.90's own established
# convention: body_width = D (the long/pitch axis), body_length = E
# (the short axis separating the 2-lead row from the 1-lead row).
#
# `nominal` on body_height is set equal to the datasheet's stated max
# (1.20mm) -- no min or nominal given on this drawing -- same
# "closest usable single number" technique as AXIAL-DO35-1N4148's
# body_height.
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
schema_version: "0.2"
kind: package
id: standards/SOT23-2.92x1.30-P1.90-BC817
family: sot
lead_count: 3
lead_layout: [2, 1]
source: onsemi/BC818-D

# pitch: not separately dimensioned on this drawing; reuses the SOT-23
# 1.90 mm pitch confirmed for SOT23-2.90x1.30-P1.90.
pitch:
  typ: 1.9 mm
  src: p5 "Figure 6, drawing MA03DREV10, pitch (not dimensioned, see comment)"

geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 2.72 mm
    typ: 2.92 mm
    max: 3.12 mm
    src: 'p5 "Figure 6, drawing MA03DREV10, symbol "D": 2.92 +/-0.20mm -- see field-mapping note above"'
  body_length:
    min: 1.15 mm
    typ: 1.3 mm
    max: 1.5 mm
    src: 'p5 "Figure 6, drawing MA03DREV10, symbol "E": 1.30 +0.20/-0.15mm -- see field-mapping note above"'
  body_height:
    max: 1.2 mm
    src: 'p5 "Figure 6, drawing MA03DREV10, symbol "A": 1.20mm MAX, no min/nominal stated -- see comment above"'
  lead_thickness:
    min: 0.08 mm
    max: 0.23 mm
    src: p5 "Figure 6, drawing MA03DREV10, lead thickness 0.08 / 0.23"
  overall_length:
    min: 2.1 mm
    typ: 2.4 mm
    max: 2.7 mm
    src: p5 "Figure 6, drawing MA03DREV10, lead-tip span 2.40 +/-0.30 (HE equivalent) -- leads exit across body_length"
  standoff:
    min: 0 mm
    max: 0.1 mm
    src: p5 "Figure 6, drawing MA03DREV10, standoff 0.00 / 0.10"
  lead_width:
    min: 0.37 mm
    max: 0.6 mm
    src: p5 "Figure 6, drawing MA03DREV10, lead width 0.37 / 0.60 (min/max)"
  lead_length:
    min: 0.2 mm
    src: p5 "Figure 6, drawing MA03DREV10, foot length "0.20 MIN" (no max/nominal)"
