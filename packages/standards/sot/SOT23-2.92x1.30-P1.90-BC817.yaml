# (page 5, Figure 6). Close to the existing standards/SOT23-2.90x1.30-
# P1.90 package but NOT identical: this drawing's height is "1.20mm
# MAX", which exceeds that package's documented max of 1.11mm -- kept
# as its own package per this dataset's per-source-package convention
# (see the separate CHIP0603-* packages for the same pattern).
#
# Field mapping follows SOT23-2.90x1.30-P1.90's own established
# convention: body_width = D (the long/pitch axis), body_length = E
# (the short axis separating the 2-lead row from the 1-lead row).
#
# `nominal` on body_height is set equal to the datasheet's stated max
# (1.20mm) -- no min or nominal given on this drawing -- same
# "closest usable single number" technique as AXIAL-DO35-1N4148's
# body_height.
