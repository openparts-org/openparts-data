# Diodes Incorporated SOT23 outline as printed in the BZX84C datasheet
# DS18001 Rev. 33-2 (Feb 2018) page 4: an older letter-coded table
# (A, B, C ... M; columns Min / Max / Typ). Close to but NOT identical to
# SOT23-2.90x1.30-P1.83-DIODES (span C 2.30-2.50 vs E 2.25-2.55, lead
# width 0.37-0.51 vs 0.30-0.51, K/K1/J/M ranges differ), so kept
# separate, as the dataset does for per-source outlines.
#
# Letter meaning read from the rendered drawing (not from the table
# alone): H = body length along the two-lead row (-> body_width),
# B = body across the rows (-> body_length), C = lead-tip span
# (-> overall_length), G = two-lead row spacing (-> pitch), K = body
# height (-> body_height), K1 = overall height, J = standoff, A = lead
# width, M = lead thickness, L1 = foot length at the gauge plane
# (-> lead_length). "Typ" recorded as nominal.
