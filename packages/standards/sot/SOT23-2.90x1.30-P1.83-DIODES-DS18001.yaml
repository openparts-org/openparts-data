# Diodes Incorporated SOT23 outline as printed in the BZX84C datasheet
# DS18001 Rev. 33-2 (Feb 2018) page 4: an older letter-coded table
# (A, B, C ... M; columns Min / Max / Typ). Close to but NOT identical to
# SOT23-2.90x1.30-P1.83-DIODES (span C 2.30-2.50 vs E 2.25-2.55, lead
# width 0.37-0.51 vs 0.30-0.51, K/K1/J/M ranges differ), so kept
# separate, as the dataset does for per-source outlines.
#
# Letter meaning read from the rendered drawing (not from the table
# alone): H = body length along the two-lead row (-> body_width),
# B = body across the rows (-> body_length), C = lead-tip span
# (-> overall_length), G = two-lead row spacing (-> pitch), K = body
# height (-> body_height), K1 = overall height, J = standoff, A = lead
# width, M = lead thickness, L1 = foot length at the gauge plane
# (-> lead_length). "Typ" recorded as nominal.
schema_version: "0.2"
kind: package
id: standards/SOT23-2.90x1.30-P1.83-DIODES-DS18001
family: sot
lead_count: 3
lead_layout: [2, 1]
source: diodes/DS18001

pitch:
  min: 1.78 mm
  typ: 1.83 mm
  max: 2.05 mm
  src: p4 "SOT23 table, "G" (spacing of the two same-side leads in the drawing)"

construction: { value: molded, src: 'p1 "Mechanical Data: "Case Material: Molded Plastic.""' }

geometry: { type: parametric, generator: sot }

dimensions:
  body_width:     { min: 2.8 mm, typ: 2.9 mm, max: 3 mm, src: 'p4 "SOT23 table, "H""' }
  body_length:    { min: 1.2 mm, typ: 1.3 mm, max: 1.4 mm, src: 'p4 "SOT23 table, "B""' }
  body_height:    { min: 0.89 mm, typ: 0.975 mm, max: 1 mm, src: 'p4 "SOT23 table, "K""' }
  lead_thickness: { min: 0.085 mm, typ: 0.11 mm, max: 0.15 mm, src: 'p4 "SOT23 table, "M""' }
  overall_length: { min: 2.3 mm, typ: 2.4 mm, max: 2.5 mm, src: 'p4 "SOT23 table, "C""' }
  overall_height: { min: 0.903 mm, typ: 1.025 mm, max: 1.1 mm, src: 'p4 "SOT23 table, "K1""' }
  standoff:       { min: 0.013 mm, typ: 0.05 mm, max: 0.1 mm, src: 'p4 "SOT23 table, "J""' }
  lead_width:     { min: 0.37 mm, typ: 0.4 mm, max: 0.51 mm, src: 'p4 "SOT23 table, "A""' }
  lead_length:
    min: 0.25 mm
    typ: 0.4 mm
    max: 0.55 mm
    src: p4 "SOT23 table, "L1" (foot length at the gauge plane)"
