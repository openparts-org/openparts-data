    min: 0.30
    max: 0.50
    unit: mm
  lead_length:
    min: 0.30
    max: 0.60
    unit: mm
  lead_thickness:
    nominal: 0.13
    min: 0.08
    max: 0.20
    unit: mm

geometry:
