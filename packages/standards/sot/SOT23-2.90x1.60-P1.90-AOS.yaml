# Alpha & Omega "SOT23 PACKAGE OUTLINE" (PO-00001 Version N), read from
# a rendered image of the drawing and its dimension table (mm columns).
# Wider molded body than onsemi's CASE 318 / Diodes' SOT23 (E1 1.60
# nominal vs 1.30), so it is its own package.
#
# Field mapping follows SOT23-2.90x1.30-P1.90's convention:
# body_width = D (long axis, along which the two bottom leads are
# e1 apart), body_length = E1 (short axis the leads exit across),
# overall_length = E (lead-tip span across rows), pitch = e1 (1.90 BSC,
# the spacing of the two same-side leads; e = 0.95 BSC is half of it).
# body_height = A2 (body thickness); overall_height = A. A, A1 and L
# have no nominal in the table -- only min/max recorded.
schema_version: "0.2"
kind: package
id: standards/SOT23-2.90x1.60-P1.90-AOS
family: sot
lead_count: 3
lead_layout: [2, 1]
source: aos/PO-00001

pitch:
  typ: 1.9 mm
  src: p1 "Dimension table, symbol "e1" 1.90 BSC (two-lead row spacing in the top view)"

geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 2.8 mm
    typ: 2.9 mm
    max: 3.1 mm
    src: p1 "Dimension table, symbol "D" (min/nom/max)"
  body_length:
    min: 1.4 mm
    typ: 1.6 mm
    max: 1.8 mm
    src: p1 "Dimension table, symbol "E1" (body across the lead rows)"
  body_height: { min: 0.7 mm, typ: 1.05 mm, max: 1.2 mm, src: 'p1 "Dimension table, symbol "A2""' }
  lead_thickness:
    min: 0.08 mm
    typ: 0.13 mm
    max: 0.2 mm
    src: p1 "Dimension table, symbol "c""
  overall_length:
    min: 2.6 mm
    typ: 2.8 mm
    max: 3 mm
    src: p1 "Dimension table, symbol "E" (lead-tip span)"
  overall_height:
    min: 0.85 mm
    max: 1.25 mm
    src: p1 "Dimension table, symbol "A" (no nominal given)"
  standoff: { min: 0 mm, max: 0.15 mm, src: 'p1 "Dimension table, symbol "A1" (no nominal given)"' }
  lead_width: { min: 0.3 mm, typ: 0.4 mm, max: 0.5 mm, src: 'p1 "Dimension table, symbol "b""' }
  lead_length:
    min: 0.3 mm
    max: 0.6 mm
    src: p1 "Dimension table, symbol "L" (measured in gauge plane, note 3; no nominal given)"
