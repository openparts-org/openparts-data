# Diodes Incorporated SOT25 (5-lead SOT-23 class; "Previously identified
# as SOT-23-5 for this product"). Values from the "Package Outline
# Dimensions" SOT25 table, AP2112 datasheet DS39724 Rev. 2-2 page 14
# (read from a rendered image; Min/Max/Typ copied as printed, Typ
# recorded as nominal). Kept separate from the Microchip-derived
# SOT23-5-2.90x1.60-P0.95 because the numbers differ (H 3.00 typ vs
# D 2.90 BSC).
#
# Symbol mapping (from the drawing): A = lead width, B = body width
# across the rows, C = lead-tip span, D = pitch, H = body length, J =
# standoff, L = foot length, M = lead thickness. K (1.00/1.10/1.30, a
# height whose lower reference is not clear from the drawing) and N are
# left out rather than guessed.
#
# `sot` generator mapping: body_length = B (leads exit across it),
# body_width = H, overall_length = C. Pin 4 sits opposite pin 3 and
# pin 5 opposite pin 1 (page 1 "Pin Assignments", SOT25 top view).
schema_version: "0.1"
kind: package
id: standards/SOT25-3.00x1.60-P0.95-DIODES

family: sot
lead_count: 5
lead_layout: [3, 2]

pitch:
  nominal: 0.95
  unit: mm

dimensions:
  body_width:
    nominal: 3.00
    min: 2.90
    max: 3.10
    unit: mm
  body_length:
    nominal: 1.60
    min: 1.50
    max: 1.70
    unit: mm
  overall_length:
    nominal: 2.80
    min: 2.70
    max: 3.00
    unit: mm
  standoff:
    nominal: 0.05
    min: 0.013
    max: 0.10
    unit: mm
  lead_width:
    nominal: 0.38
    min: 0.35
    max: 0.50
    unit: mm
  lead_length:
    nominal: 0.40
    min: 0.35
    max: 0.55
    unit: mm
  lead_thickness:
    nominal: 0.15
    min: 0.10
    max: 0.20
    unit: mm

geometry:
  type: parametric
  generator: sot

provenance:
