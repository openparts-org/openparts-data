# Diodes Incorporated "SOT23 (Standard)" outline, read from the rendered
# Package Outline Dimensions figure + table (columns are Min / Max /
# Typ -- in that order) of DS11005 Rev. 35-2 page 4. The identical table
# (every value) is printed in DMG2305UX DS36196 Rev. 8-2 page 5.
#
# Not the onsemi package: pitch e1 is 1.83 typ (1.78-2.05), A 1.025 typ.
# Field mapping as SOT23-2.90x1.30-P1.90: body_width = D, body_length =
# E1, overall_length = E, pitch = e1, body_height = A2, overall_height
# = A, standoff = A1, lead_width = b, lead_thickness = c, lead_length =
# L (foot length at the gauge plane; L1 is not recorded).
# "Typ" is recorded as nominal.
