# Diodes Incorporated "SOT23 (Standard)" outline, read from the rendered
# Package Outline Dimensions figure + table (columns are Min / Max /
# Typ -- in that order) of DS11005 Rev. 35-2 page 4. The identical table
# (every value) is printed in DMG2305UX DS36196 Rev. 8-2 page 5.
#
# Not the onsemi package: pitch e1 is 1.83 typ (1.78-2.05), A 1.025 typ.
# Field mapping as SOT23-2.90x1.30-P1.90: body_width = D, body_length =
# E1, overall_length = E, pitch = e1, body_height = A2, overall_height
# = A, standoff = A1, lead_width = b, lead_thickness = c, lead_length =
# L (foot length at the gauge plane; L1 is not recorded).
# "Typ" is recorded as nominal.
schema_version: "0.2"
kind: package
id: standards/SOT23-2.90x1.30-P1.83-DIODES
family: sot
lead_count: 3
lead_layout: [2, 1]
source: diodes/DS11005

pitch:
  min: 1.78 mm
  typ: 1.83 mm
  max: 2.05 mm
  src:
    - p4 "SOT23 (Standard) table, "e1""
    - diodes/DS36196 p5 "SOT23 (Standard) table, "e1" (identical)"

construction:
  value: molded
  src: 'p1 "Mechanical Data: "Package Material: Molded Plastic, ''Green'' Molding Compound.""'

geometry: { type: parametric, generator: sot }

dimensions:
  body_width: { min: 2.8 mm, typ: 2.9 mm, max: 3 mm, src: 'p4 "SOT23 (Standard) table, "D""' }
  body_length:
    min: 1.2 mm
    typ: 1.3 mm
    max: 1.4 mm
    src: p4 "SOT23 (Standard) table, "E1" (body across the lead rows)"
  body_height:
    min: 0.85 mm
    typ: 0.975 mm
    max: 1.1 mm
    src: p4 "SOT23 (Standard) table, "A2""
  lead_thickness:
    min: 0.08 mm
    typ: 0.11 mm
    max: 0.202 mm
    src: p4 "SOT23 (Standard) table, "c""
  overall_length:
    min: 2.25 mm
    typ: 2.4 mm
    max: 2.55 mm
    src: p4 "SOT23 (Standard) table, "E" (lead-tip span)"
  overall_height:
    min: 0.9 mm
    typ: 1.025 mm
    max: 1.15 mm
    src: p4 "SOT23 (Standard) table, "A""
  standoff:   { min: 0 mm, typ: 0.05 mm, max: 0.1 mm, src: 'p4 "SOT23 (Standard) table, "A1""' }
  lead_width: { min: 0.3 mm, typ: 0.4 mm, max: 0.51 mm, src: 'p4 "SOT23 (Standard) table, "b""' }
  lead_length:
    min: 0.25 mm
    typ: 0.4 mm
    max: 0.55 mm
    src: p4 "SOT23 (Standard) table, "L" (foot length from the gauge-plane side view)"
