# Real SOT-23 (JEDEC TO-236, onsemi CASE 318 STYLE 21) dimensions,
# confirmed from the "PACKAGE DIMENSIONS" table (page 6) of onsemi's
# 2N7002E datasheet (2N7002E/D, Rev. 8, Oct 2023).
#
# Field-to-symbol mapping (openparts-mcad's `sot` generator, not a
# datasheet-stated label): the datasheet's own dimension symbols are D
# (2.80/2.90/3.04mm) and E (1.20/1.30/1.40mm), with lead pitch e =
# 1.78/1.90/2.04mm. `sot.rs` places its two same-side leads
# `pitch` apart, and separates the two lead ROWS by `dimensions.
# body_length` -- so `body_length` must be the SHORT dimension (E,
# 1.30mm, the axis separating the 2-lead row from the 1-lead row), and
# `body_width` the LONG one (D, 2.90mm, the axis the 2-lead row's pitch
# runs along; not otherwise load-bearing in the generator, kept
# consistent for a physically sensible body box). Confirmed correct by
# cross-checking the generator's resulting lead-tip span against the
# datasheet's own HE ("lead-tip-to-lead-tip span across rows") value of
# 2.10/2.40/2.64mm: this mapping gives ~2.2mm, close to nominal HE; the
# reversed mapping gives ~3.8mm, clearly wrong.
# Lead dimensions (overall_*, standoff, lead_*) added as a candidate change for
# human review (Agent Ingestion Specification); values copied as printed --
# where the table has no nominal only min/max are recorded.
# Read from onsemi's identical Rev. 8 file at onsemi.cn (the onsemi.com URL
# returned Access Denied). body_height above is already the drawing's A.
schema_version: "0.2"
kind: package
id: standards/SOT23-2.90x1.30-P1.90
family: sot
lead_count: 3
lead_layout: [2, 1]
source: onsemi/2N7002E-D

pitch: { min: 1.78 mm, typ: 1.9 mm, max: 2.04 mm, src: 'p6 "PACKAGE DIMENSIONS table, symbol "e""' }
geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 2.8 mm
    typ: 2.9 mm
    max: 3.04 mm
    src: p6 "PACKAGE DIMENSIONS table, symbol "D" -- see field-mapping note above for why D (not E) is body_width for this generator"
  body_length:
    min: 1.2 mm
    typ: 1.3 mm
    max: 1.4 mm
    src: p6 "PACKAGE DIMENSIONS table, symbol "E" -- see field-mapping note above for why E (not D) is body_length for this generator"
  body_height:
    min: 0.89 mm
    typ: 1 mm
    max: 1.11 mm
    src: p6 "PACKAGE DIMENSIONS table, symbol "A""
  lead_thickness:
    min: 0.08 mm
    typ: 0.14 mm
    max: 0.2 mm
    src: p6 "PACKAGE DIMENSIONS table (CASE 318 ISSUE AU), symbol "c""
  overall_length:
    min: 2.1 mm
    typ: 2.4 mm
    max: 2.64 mm
    src: p6 "PACKAGE DIMENSIONS table (CASE 318 ISSUE AU), symbol "HE" -- the leads exit across body_length (E), see field-mapping note above"
  standoff:
    min: 0.01 mm
    typ: 0.06 mm
    max: 0.1 mm
    src: p6 "PACKAGE DIMENSIONS table (CASE 318 ISSUE AU), symbol "A1""
  lead_width:
    min: 0.37 mm
    typ: 0.44 mm
    max: 0.5 mm
    src: p6 "PACKAGE DIMENSIONS table (CASE 318 ISSUE AU), symbol "b""
  lead_length:
    min: 0.3 mm
    typ: 0.43 mm
    max: 0.55 mm
    src: p6 "PACKAGE DIMENSIONS table (CASE 318 ISSUE AU), symbol "L""
