# Same Sky PJ-036AH-SMT-TR DC power jack, SMT, horizontal: 3 SMD solder
# pads + 1 hole for the housing's locating boss, from page 2 of
# samesky/PJ-036AH-SMT-TR-DS (rev 1.11, 09/30/2025).
# Frame (barrel_jack): top view, X right, Y up, plug opening toward +Y,
# origin at the housing centre. The source's "Recommended PCB Layout,
# Top View" already has the front face (opening) at the top: the rear
# terminal pad "1#" lies behind the housing ("13.55±0.3" from the front
# edge + "4.40" > housing "14.5±0.3"), and the boss hole sits "2.85±0.1"
# from the front edge, as in the side view (boss near the end opposite
# the rear terminal's "2.6±0.2" overhang). No turn needed. The view with
# "15.20±0.3" is the bottom view (its "0.55±0.1" terminal offset is the
# layout's, mirrored).
# Housing: "9±0.2" wide, "11±0.2" high (front view), "14.5±0.3" long
# (side view).
# DOUBT: the side pads' X width is not dimensioned, only their outer
# span "16.80±0.3"; their inner edges are drawn on the housing outline
# (9 wide), so width = (16.80 - 9)/2 = 3.9.
# NOTE: the drawing does not say whether the boss hole is plated; drawn
# as a plain circle without a land: recorded as non-plated.
schema_version: "0.2"
kind: package
id: manufacturers/samesky/PJ-036AH-SMT-TR
family: barrel_jack
lead_count: { value: 3, src: 'p2 "Recommended PCB Layout, pads 1#, 2#, 3#"' }
source: samesky/PJ-036AH-SMT-TR-DS

pitch: { unit: mm }

connector:
  gender: female
  orientation: right_angle
  src: 'p1 "FEATURES, "horizontal orientation"; DESCRIPTION: DC POWER JACK"'

geometry: { type: parametric, generator: barrel_jack }

dimensions:
  body_width: { min: 8.8 mm, typ: 9 mm, max: 9.2 mm, src: 'p2 "Front view, housing width "9±0.2""' }
  body_length:
    min: 14.2 mm
    typ: 14.5 mm
    max: 14.8 mm
    src: p2 "Side view, housing length "14.5±0.3""
  body_height:
    min: 10.8 mm
    typ: 11 mm
    max: 11.2 mm
    src: p2 "Front view, seating plane to top "11±0.2""
  pin_diameter:
    min: 1.95 mm
    typ: 2 mm
    max: 2 mm
    src: p2 "Front view, centre pin "Ø2.0 +0/-0.05"; schematic table "Center Pin Ø2.0 mm""
  mating_diameter: { typ: 6.3 mm, src: 'p2 "Front view, opening "Ø6.30""' }

# pads (Recommended PCB Layout, "PCB: ±0.05 mm"; front edge at y =
# 14.5/2 = +7.25 from the housing centre, x 0 on the housing centre line
# through the boss hole):
# 2#/3#: centre line "6.80±0.1" behind the front edge -> y = 7.25 - 6.80
# = 0.45; length "2-6.20" (Y); width (16.80 - 9)/2 = 3.9 (see DOUBT),
# centres ±(9/2 + 3.9/2) = ±6.45; 3# left, 2# right.
# 1#: "3.3" wide, "4.40" long, front end "13.55±0.3" behind the front
# edge -> y = 7.25 - 13.55 - 4.40/2 = -8.5; its centre line "0.55±0.1"
# left of the housing centre line -> x = -0.55.
# Boss hole "Ø2.00", "2.85±0.1" behind the front edge -> y = 4.4, x 0.
pads:
  value:
    - { number: "1", x: -0.55, y: -8.5, width: 3.3, length: 4.4 }
    - { number: "2", x: 6.45, y: 0.45, width: 3.9, length: 6.2 }
    - { number: "3", x: -6.45, y: 0.45, width: 3.9, length: 6.2 }
    - { number: "", x: 0, y: 4.4, width: 2, length: 2, drill: 2, plated: false }
  src: p2 "Recommended PCB Layout Top View (see comment above)"
