# Same Sky PJ-037A DC power jack, through hole, right angle: 2 plated
# rectangular slots "2-3.2x1.1" (no land drawn: generator ring), from
# page 2 of samesky/PJ-037A-DS (rev 1.08, 09/12/2024).
# Frame (barrel_jack): top view, X right, Y up, plug opening toward +Y,
# origin at the housing centre. The "Recommended PCB Layout, Top View"
# has the front face (opening) on the left: the slots are dimensioned
# "7.5" and "13.8" from that edge, as the side view dimensions the pins
# "7.5" and "13.8" from the front end (housing "13.5"; terminal 1 sits at
# the rear, behind the housing). The layout is turned 90° clockwise
# (layout x -> -Y, layout y -> +X), a rotation, not a mirror. The slots
# lie on the housing centre line (front view: centre pin centred in the
# "8.9" width), so left/right is unaffected.
# Housing: "8.9" wide, "10.9" high (front view), "13.5" long (side view);
# untoleranced values carry the general tolerance "X.X ±0.20 mm" (not
# recorded as min/max).
# The slots are drawn as rectangles; KiCad draws an oval slot of the
# same size.
schema_version: "0.2"
kind: package
id: manufacturers/samesky/PJ-037A
family: barrel_jack
lead_count: { value: 2, src: 'p2 "Recommended PCB Layout, slots #1, #2"' }
source: samesky/PJ-037A-DS

pitch: { unit: mm }

connector:
  gender: female
  orientation: right_angle
  src: p1 "FEATURES, "right angle orientation", "through hole""

geometry: { type: parametric, generator: barrel_jack }

dimensions:
  body_width:      { typ: 8.9 mm, src: 'p2 "Front view, housing width "8.9""' }
  body_length:     { typ: 13.5 mm, src: 'p2 "Side view, housing length "13.5""' }
  body_height:     { typ: 10.9 mm, src: 'p2 "Front view, seating plane to top "10.9""' }
  pin_diameter:
    min: 1.9 mm
    typ: 2 mm
    max: 2 mm
    src: p2 "Front view, centre pin "Ø2.0 +0/-0.1"; schematic table "Center Pin Ø2.0 mm""
  mating_diameter: { typ: 6.3 mm, src: 'p2 "Front view, opening "Ø6.3""' }

# pads (Recommended PCB Layout, "PCB: ±0.05 mm"): slots "2-3.2x1.1",
# long side across the jack (layout Y -> frame X). Centres on the centre
# line, "7.5" (#2) and "13.8" (#1) behind the front edge; housing centre
# 13.5/2 = 6.75 behind it -> #2 y = 6.75 - 7.5 = -0.75, #1 y = 6.75 -
# 13.8 = -7.05; x 0.
pads:
  value:
    - { number: "1", x: 0, y: -7.05, drill: 1.1, drill_length: 3.2, slot_axis: x }
    - { number: "2", x: 0, y: -0.75, drill: 1.1, drill_length: 3.2, slot_axis: x }
  src: p2 "Recommended PCB Layout Top View, "2-3.2x1.1", "7.5", "13.8" (see comment above)"
