# Same Sky CMT-1612-590T magnetic buzzer transducer, from samesky/CMT-1612-590T-DS page 2 "MECHANICAL
# DRAWING" and "Recommended PCB Layout Top View". Frame: that top view,
# origin on the body centre. Layout: two pads 5.0 apart on the vertical centre line; the layout marks no polarity (the side view's (+)/(-) is not tied to it), numbered 1 top, 2 bottom here.
schema_version: "0.2"
kind: package
id: manufacturers/samesky/CMT-1612-590T
family: buzzer
