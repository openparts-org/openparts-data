geometry: { type: parametric, generator: buzzer }

dimensions:
  body_width:   { typ: 23 mm, src: 'p2 "Mechanical drawing, Ø23"' }
  body_length:  { typ: 23 mm, src: 'p2 "Mechanical drawing, Ø23"' }
  body_height:  { typ: 12 mm, src: 'p2 "Mechanical drawing, height 12"' }
  can_diameter: { typ: 23 mm, src: 'p2 "Mechanical drawing, Ø23"' }
  tail_length:  { typ: 7 mm, src: 'p2 "Mechanical drawing, pin length 7.0"' }

pads:
