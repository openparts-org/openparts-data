    - { number: "1", x: 0, y: 5, width: 2.5, length: 2.5, drill: 1, shape: circle }
    - { number: "2", x: 0, y: -5, width: 2.5, length: 2.5, drill: 1, shape: circle }
  src: p2 "Recommended PCB Layout Top View, 10, 2-Ø2.5 Pads, 2-Ø1.0 Hole"
