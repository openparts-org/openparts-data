# Same Sky PJ-102A DC power jack, through hole, right angle: 3 plated
# slots "3-1.60" x "3-1.00" (no land drawn: generator ring), from page 2
# of samesky/PJ-102A-DS (rev 1.07, 03/11/2025).
# Frame (barrel_jack): top view, X right, Y up, plug opening toward +Y,
# origin at the housing centre. The "Recommended PCB Layout, Top View"
# has the front face (opening) on the left: its datum edge is the one
# the side view's "10.70±0.20" (front end to the side terminal 3) starts
# from, and terminal 1 (centre pin, schematic 1) sits near the rear.
# Top view, not mirrored: 3# lies "4.70" below the centre line, i.e. on
# the jack's right seen from the front, as the front view draws terminal
# 3 at "4.70±0.20" right of the centre pin. The layout is turned 90°
# clockwise (layout x -> -Y, layout y -> +X).
# Housing: "9.00" wide, "11.00" high (front view), "14.40" long (side
# view); untoleranced values carry the general tolerance "X.XX ±0.20 mm"
# (not recorded as min/max). The bottom "3.00" in the layout spans more
# than slot 3's "1.60" and dimensions no pad (not used).
schema_version: "0.2"
kind: package
id: manufacturers/samesky/PJ-102A
family: barrel_jack
lead_count: { value: 3, src: 'p2 "Recommended PCB Layout, slots 1#, 2#, 3#"' }
source: samesky/PJ-102A-DS

pitch: { unit: mm }

connector:
  gender: female
  orientation: right_angle
  src: p1 "FEATURES, "right-angle orientation", "through hole""

geometry: { type: parametric, generator: barrel_jack }

dimensions:
  body_width:      { typ: 9 mm, src: 'p2 "Front view, housing width "9.00""' }
  body_length:     { typ: 14.4 mm, src: 'p2 "Side view, housing length "14.40""' }
  body_height:     { typ: 11 mm, src: 'p2 "Front view, seating plane to top "11.00""' }
  pin_diameter:
    typ: 2 mm
    src: p2 "Front view, centre pin "Ø2.00"; schematic table "Center Pin Ø2.0 mm""
  mating_diameter: { typ: 6.4 mm, src: 'p2 "Front view, opening "Ø6.40""' }

# pads (Recommended PCB Layout, "PCB: ±0.05 mm"; layout frame: x from the
# front edge, y up from the centre line): 3# at x "10.70", y -"4.70";
# 2# "3.00" in front of it (x 7.70), 1# "3.00" behind it (x 13.70), both
# on the centre line. Slots "3-1.60" long x "3-1.00" wide: 1#/2# long
# along the layout's Y, 3# along its X. Housing centre x = 14.40/2 = 7.20
# -> relative x: 2# 0.50, 3# 3.50, 1# 6.50. Turned (layout x -> -Y,
# layout y -> +X): 1# (0, -6.5), 2# (0, -0.5), 3# (-4.7, -3.5); 1#/2#
# slots along X, 3# along Y.
pads:
  value:
    - { number: "1", x: 0, y: -6.5, drill: 1, drill_length: 1.6, slot_axis: x }
    - { number: "2", x: 0, y: -0.5, drill: 1, drill_length: 1.6, slot_axis: x }
    - { number: "3", x: -4.7, y: -3.5, drill: 1, drill_length: 1.6, slot_axis: y }
  src: p2 "Recommended PCB Layout Top View, "3.00", "3.00", "10.70", "4.70", "3-1.60", "3-1.00" (see comment above)"
