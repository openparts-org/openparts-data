# ESP32-S2-DevKitM-1 as a through-hole module: the bare board with the two pin-header
# rows a carrier board takes (Espressif's dev-kit design files). Package
# frame: board centre, +y towards the antenna end, top view; pin 1 = J1 pin 1
# (upper left). Holes: J1 runs down the left edge (module pins 1-21 = J1 pins
# 1-21), J3 up the right edge (module pins 22-42 = J3 pins 21..1), the
# counter-clockwise row numbering. Hole positions are the pad centres of
# the layout PDF's top-copper plot (page 1), scaled by the board outline:
# J1 centres 1.27 from the left edge, J3 1.27 from the right edge,
# J1 pin 1 1.6 below the top edge, J3 pin 21 1.6 above the bottom
# edge, pitch 2.54 (headers "2.54" in the dimension drawing). Land: the
# layout's copper pad 1.778 x 1.778 (across x along); drill: the
# layout's drawn hole 1.092. Board thickness is not stated by the
# design files (left to the generator default). Licence of the design files:
# none stated ("No licenses express or implied ... are granted"); facts only.
schema_version: "0.2"
kind: package
id: manufacturers/espressif/MODULE42-25.4x54-P2.54-ESP32-S2-DevKitM-1
family: module
lead_count: 42
source: espressif/ESP32-S2-DevKitM-1_V1_PCB_Layout

pitch: { typ: 2.54 mm, src: 'p1 "J1/J3 pad centres, 2.54 apart"' }
geometry: { type: parametric, generator: module }

dimensions:
  body_width:  { typ: 25.4 mm, src: espressif/ESP32-S2-DevKitM-1_V1_Dimensions p1 "25.40mm" }
  body_length: { typ: 54 mm, src: espressif/ESP32-S2-DevKitM-1_V1_Dimensions p1 "54.00mm" }
  hole_diameter:
    typ: 1.092 mm
    src: p1 "header hole drawn 1.092 dia (black circle in each J1/J3 pad)"

pad_rows:
  value:
    - side: -x
      first: 1
      count: 21
      pitch: 2.54
      start: 1.6
      inset: 1.27
      pad: [1.778, 1.778]
      drill: 1.092
    - side: +x
      first: 22
      count: 21
      pitch: 2.54
      start: 1.6
      inset: 1.27
      pad: [1.778, 1.778]
      drill: 1.092
  src: p1 "J1/J3 pad centres (see comment)"
