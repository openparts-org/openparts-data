# ESP32-H2-MINI-1 as a surface-mount module: the recommended land pattern
# ("Figure 11: ESP32-H2-MINI-1 Recommended PCB Land Pattern", p38) with the
# board and shield can of "Figure 8: ESP32-H2-MINI-1 Physical Dimensions"
# (p35). Every callout of both figures is the same as for ESP32-C6-MINI-1
# (manufacturers/espressif/MODULE53-13.2x16.6-ESP32-C6-MINI-1, board
# tolerance ±0.2 as there), so the same layout, read from this datasheet.
# Package frame: the board centred on the origin, the antenna end at +y
# (top). Positions are plain arithmetic between callouts:
# Rows: 48 pads "48 x 0.4" wide at "48 x 0.8" pitch, set in from the
# edges (LGA, no castellations): the left and right columns' centres
# "11.8" apart (x = +-5.9, inset 6.6 - 5.9 = 0.7), the top and bottom
# rows' centres "9.8" apart about the pad area centre (y = 2.2 and -7.6:
# insets 6.1 from the top edge and 0.7 from the bottom); 11 pads per
# column, 13 per row, each centred on the pad area ("1.6" = 2 pitches
# about the centre line): pin 1 at y = -2.7 + 5 x 0.8 = 1.3, pin 12 at
# x = -4.8, pin 25 at y = -6.7, pin 36 at x = 4.8. Pad length 0.8 as for
# the C3/C6-MINI-1 (the figure's pad rows are the same drawing).
# Grids: the pad area is the "11.2" x "13.2" region below the "Antenna
# Area" (16.6 - 11.2 = 5.4 at the top), centre y = -8.3 + 5.6 = -2.7;
# ground pads 49: 3 x 3 of "1.45" with "0.6" gaps ("5.4" overall: pitch
# 2.05) about that centre; corner pads 50-53 "4 x 0.7" square, centres
# "11.9" apart across and "9.9" apart up the area (x = +-5.95, y = -2.7
# +- 4.95); 50 top-right, 51 bottom-right, 52 bottom-left, 53 top-left
# (p9 Figure 3 Pin Layout).
# Shield: can "11.95" x "9.95", its right side and bottom "0.62" in from
# the board edges: centre x = 6.6 - 0.62 - 5.975 = 0.005, y = -8.3 + 0.62
# + 4.975 = -2.705; its top is the overall height.
# Keep-out: the land pattern's "Antenna Area" (13.2 x 5.4 at the top).
schema_version: "0.2"
kind: package
id: manufacturers/espressif/MODULE53-13.2x16.6-ESP32-H2-MINI-1
family: module
lead_count: 53
source: espressif/esp32-h2-mini-1_mini-1u_datasheet_en@rev1.6

pitch:
  typ: 0.8 mm
  src: p38 "Figure 11 ESP32-H2-MINI-1 Recommended PCB Land Pattern, "48 x 0.8""

geometry: { type: parametric, generator: module }

dimensions:
  body_width:
    min: 13 mm
    typ: 13.2 mm
    max: 13.4 mm
    src: p35 "Figure 8 ESP32-H2-MINI-1 Physical Dimensions, "13.2±0.2""
  body_length:
    min: 16.4 mm
    typ: 16.6 mm
    max: 16.8 mm
    src: p35 "Figure 8 ESP32-H2-MINI-1 Physical Dimensions, "16.6±0.2""
  body_height:
    typ: 0.8 mm
    src: p35 "Figure 8 ESP32-H2-MINI-1 Physical Dimensions, side view, board "0.8""
  overall_height:
    min: 2.25 mm
    typ: 2.4 mm
    max: 2.55 mm
    src: p35 "Figure 8 ESP32-H2-MINI-1 Physical Dimensions, side view "2.4±0.15""

pad_rows:
  value:
    - { side: -x, first: 1, count: 11, pitch: 0.8, start: 7, inset: 0.7, pad: [0.4, 0.8] }
    - { side: -y, first: 12, count: 13, pitch: 0.8, start: 1.8, inset: 0.7, pad: [0.4, 0.8] }
    - { side: +x, first: 25, count: 11, pitch: 0.8, start: 1.6, inset: 0.7, pad: [0.4, 0.8] }
    - { side: +y, first: 36, count: 13, pitch: 0.8, start: 1.8, inset: 6.1, pad: [0.4, 0.8] }
  src: p38 "Figure 11 ESP32-H2-MINI-1 Recommended PCB Land Pattern (see comment)"

pad_grids:
  value:
    - numbers: ["49"]
      columns: 3
      rows: 3
      pitch: [2.05, 2.05]
      pad: [1.45, 1.45]
      x: 0
      y: -2.7
    - { numbers: ["50"], columns: 1, rows: 1, pitch: [1, 1], pad: [0.7, 0.7], x: 5.95, y: 2.25 }
    - { numbers: ["51"], columns: 1, rows: 1, pitch: [1, 1], pad: [0.7, 0.7], x: 5.95, y: -7.65 }
    - { numbers: ["52"], columns: 1, rows: 1, pitch: [1, 1], pad: [0.7, 0.7], x: -5.95, y: -7.65 }
    - { numbers: ["53"], columns: 1, rows: 1, pitch: [1, 1], pad: [0.7, 0.7], x: -5.95, y: 2.25 }
  src: p38 "Figure 11 ESP32-H2-MINI-1 Recommended PCB Land Pattern (see comment)"

shield:
  x: 0.005
  y: -2.705
  width: 11.95
  length: 9.95
  src: p35 "Figure 8 ESP32-H2-MINI-1 Physical Dimensions, top view (see comment)"

keepouts:
  value:
    - purpose: antenna
      restricts: [components, copper]
      rect: { x: 0, y: 5.6, width: 13.2, length: 5.4 }
      side: +y
  src: p38 "Figure 11 ESP32-H2-MINI-1 Recommended PCB Land Pattern, "Antenna Area" at the top"
