# ESP32-S3-MINI-1U (external antenna connector) as a surface-mount module:
# the recommended land pattern (p46 "Figure 11-2 ESP32-S3-MINI-1U
# Recommended PCB Land Pattern") with the board and shield can of p42
# "Figure 10-2 ESP32-S3-MINI-1U Physical Dimensions". Package frame: the
# board centred on the origin, the connector end at +y (top). Every value
# is a printed callout; positions are plain arithmetic between callouts:
# Rows: 60 pads "0.4" x "0.8" ("60 x 0.4 x 0.8"), 15 per side; outer rows'
# and columns' centres "14" apart, first-to-last pad centres of each side
# "11.9" apart (pitch 0.85). The pad area's horizontal centre line is "7.7"
# above the bottom edge of the "15.4" square board, i.e. on the board
# centre (y = 0); rows at x/y = +-7, inset 0.7 on every side. Pins 1-15 run
# down the left side from y = 5.95 (1.75 below the top edge); 16-30 along
# the bottom from x = -5.95; 31-45 up the right side from y = -5.95; 46-60
# along the top from x = 5.95 (pin layout: p10 Figure 3-1, which applies
# to MINI-1U too). Corner pads 62-65 "4 x 0.8 x 0.8" at x, y = +-7 (62
# top-left, 63 bottom-left, 64 bottom-right, 65 top-right). Ground pad 61:
# 3 x 3 pads "1.2" square, "4.5" overall (pitch 1.65) at the centre.
# Shield: can "14" x "13.55", its right side "0.7" and its bottom "0.5" in
# from the board edges: centre x = 0, y = -7.7 + 0.5 + 6.775 = -0.425.
# No antenna keep-out: Figure 3-1's note says MINI-1U has none.
schema_version: "0.2"
kind: package
id: manufacturers/espressif/MODULE65-15.4x15.4-ESP32-S3-MINI-1U
family: module
lead_count: 65
source: espressif/esp32-s3-mini-1_mini-1u_datasheet_en@rev1.7

pitch:
  typ: 0.85 mm
  src: p46 "Figure 11-2 Recommended PCB Land Pattern, "11.9" over 14 pitches, "1.7" = 2 pitches"

geometry: { type: parametric, generator: module }

dimensions:
  body_width:
    min: 15.2 mm
    typ: 15.4 mm
    max: 15.6 mm
    src: p42 "Figure 10-2 ESP32-S3-MINI-1U Physical Dimensions, "15.4±0.2" (width)"
  body_length:
    min: 15.2 mm
    typ: 15.4 mm
    max: 15.6 mm
    src: p42 "Figure 10-2 ESP32-S3-MINI-1U Physical Dimensions, "15.4±0.2" (length)"
  body_height:
    typ: 0.8 mm
    src: p42 "Figure 10-2 ESP32-S3-MINI-1U Physical Dimensions, side view, board "0.8""
  overall_height:
    min: 2.25 mm
    typ: 2.4 mm
    max: 2.55 mm
    src: p42 "Figure 10-2 ESP32-S3-MINI-1U Physical Dimensions, side view "2.4±0.15""

pad_rows:
  value:
    - { side: -x, first: 1, count: 15, pitch: 0.85, start: 1.75, inset: 0.7, pad: [0.4, 0.8] }
    - { side: -y, first: 16, count: 15, pitch: 0.85, start: 1.75, inset: 0.7, pad: [0.4, 0.8] }
    - { side: +x, first: 31, count: 15, pitch: 0.85, start: 1.75, inset: 0.7, pad: [0.4, 0.8] }
    - { side: +y, first: 46, count: 15, pitch: 0.85, start: 1.75, inset: 0.7, pad: [0.4, 0.8] }
  src: p46 "Figure 11-2 ESP32-S3-MINI-1U Recommended PCB Land Pattern (see comment)"

pad_grids:
  value:
    - { numbers: ["61"], columns: 3, rows: 3, pitch: [1.65, 1.65], pad: [1.2, 1.2], x: 0, y: 0 }
    - { numbers: ["62"], columns: 1, rows: 1, pitch: [1, 1], pad: [0.8, 0.8], x: -7, y: 7 }
    - { numbers: ["63"], columns: 1, rows: 1, pitch: [1, 1], pad: [0.8, 0.8], x: -7, y: -7 }
    - { numbers: ["64"], columns: 1, rows: 1, pitch: [1, 1], pad: [0.8, 0.8], x: 7, y: -7 }
    - { numbers: ["65"], columns: 1, rows: 1, pitch: [1, 1], pad: [0.8, 0.8], x: 7, y: 7 }
  src: p46 "Figure 11-2 ESP32-S3-MINI-1U Recommended PCB Land Pattern (see comment)"

shield:
  x: 0
  y: -0.425
  width: 14
  length: 13.55
  src: p42 "Figure 10-2 ESP32-S3-MINI-1U Physical Dimensions, top view (see comment)"
