# (upper left). Holes: J1 runs down the left edge (module pins 1-22 = J1 pins
# 1-22), J3 up the right edge (module pins 23-44 = J3 pins 22..1), the
# counter-clockwise row numbering. Hole positions are the pad centres of
# the layout PDF's top-copper plot (page 1), scaled by the board outline:
# J1 centres 1.27 from the left edge, J3 1.27 from the right edge,
# J1 pin 1 1.566 below the top edge, J3 pin 22 7.96 above the bottom
# edge, pitch 2.54 (headers "2.54" in the dimension drawing). Land: the
# layout's copper pad 1.905 x 1.27 (across x along); drill: the
# layout's drawn hole 1.092. Board thickness: the reference design BOM's
# PCB line "62.74*25.4*1.6mm". Licence of the design files:
# none stated ("No licenses express or implied ... are granted"); facts only.
