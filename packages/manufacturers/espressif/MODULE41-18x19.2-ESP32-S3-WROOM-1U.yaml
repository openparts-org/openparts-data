  value:
    - { side: -x, first: 1, count: 14, pitch: 1.27, start: 1.19, inset: 0.25, pad: [0.9, 1.5] }
    - { side: -y, first: 15, count: 12, pitch: 1.27, start: 2.015, inset: 0.25, pad: [0.9, 1.5] }
    - { side: +x, first: 27, count: 14, pitch: 1.27, start: 1.5, inset: 0.25, pad: [0.9, 1.5] }
