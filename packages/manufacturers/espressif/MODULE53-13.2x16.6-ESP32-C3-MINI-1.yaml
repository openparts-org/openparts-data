# ESP32-C3-MINI-1 as a surface-mount module: the recommended land pattern
# ("Figure 11-1 ESP32-C3-MINI-1 Recommended PCB Land Pattern) with the board
# and shield can of "Figure 10-1 ESP32-C3-MINI-1 Physical Dimensions.
# Package frame: the board centred on the origin, the antenna end at +y
# (top). Every value is a printed callout; positions are plain arithmetic
# between callouts:
# Rows: 48 pads "0.4" x "0.8" at "0.8", set in from the edges (LGA, no
# castellations): the left and right columns' centres "11.8" apart (x =
# +-5.9, inset 6.6 - 5.9 = 0.7), the top and bottom rows' centres "9.8"
# apart about the pad area centre (y = 2.2 and -7.6: insets 6.1 from the top
# edge and 0.7 from the bottom); 11 pads per column, 13 per row, each
# centred on the pad area ("1.6" = 2 pitches about the centre line): pin 1
# at y = -2.7 + 5 x 0.8 = 1.3 (7.0 below the top edge), pin 12 at x = -6 x
# 0.8 = -4.8 (1.8 from the left edge), pin 25 at y = -6.7 (1.6 above the
# bottom edge), pin 36 at x = 4.8 (1.8 from the right edge).
# Grids: the pad area is the "11.2" x "13.2" region below the "Antenna Area"
# (16.6 - 11.2 = 5.4 at the top), centre y = -8.3 + 5.6 = -2.7; ground pads
# 49: 3 x 3 of "1.45" with "0.6" gaps ("5.4" overall: pitch 2.05) about that
# centre; corner pads 50-53 "4 x 0.7" square, centres "11.9" apart across
# and "9.9" apart up the area (x = +-5.95, y = -2.7 +- 4.95); 50 top-right,
# 51 bottom-right, 52 bottom-left, 53 top-left (p10 Figure 3-1).
# Shield: can "11.95" x "9.95", its right side and bottom "0.62" in from the
# board edges: centre x = 6.6 - 0.62 - 5.975 = 0.005, y = -8.3 + 0.62 +
# 4.975 = -2.705; its top is the overall height.
# Keep-out: the land pattern's "Antenna Area" (13.2 x 5.4 at the top), which
# the pin layout figure calls the antenna keepout zone; the hardware design
# guidelines (espressif/esp32-c3_hardware_design_guidelines_en@rev1.8, PDF
# page 24, section 1.4.7) suggest the antenna outside the base board, or the
# board cut away on both sides of and below it (no material: components and
# copper). Board edge: recommended at the antenna end, same section.
schema_version: "0.2"
kind: package
id: manufacturers/espressif/MODULE53-13.2x16.6-ESP32-C3-MINI-1
family: module
lead_count: 53
source: espressif/esp32-c3-mini-1_datasheet_en@rev2.2

pitch:
  typ: 0.8 mm
  src: p38 "Figure 11-1 ESP32-C3-MINI-1 Recommended PCB Land Pattern, pad pitch"

geometry: { type: parametric, generator: module }

dimensions:
  body_width:
    min: 13.05 mm
    typ: 13.2 mm
    max: 13.35 mm
    src: p35 "Figure 10-1 ESP32-C3-MINI-1 Physical Dimensions, "13.2±0.15""
  body_length:
    min: 16.45 mm
    typ: 16.6 mm
    max: 16.75 mm
    src: p35 "Figure 10-1 ESP32-C3-MINI-1 Physical Dimensions, "16.6±0.15""
  body_height:
    typ: 0.8 mm
    src: p35 "Figure 10-1 ESP32-C3-MINI-1 Physical Dimensions, side view, board "0.8""
  overall_height:
    min: 2.25 mm
    typ: 2.4 mm
    max: 2.55 mm
    src: p35 "Figure 10-1 ESP32-C3-MINI-1 Physical Dimensions, side view "2.4±0.15""

pad_rows:
  value:
    - { side: -x, first: 1, count: 11, pitch: 0.8, start: 7, inset: 0.7, pad: [0.4, 0.8] }
    - { side: -y, first: 12, count: 13, pitch: 0.8, start: 1.8, inset: 0.7, pad: [0.4, 0.8] }
    - { side: +x, first: 25, count: 11, pitch: 0.8, start: 1.6, inset: 0.7, pad: [0.4, 0.8] }
    - { side: +y, first: 36, count: 13, pitch: 0.8, start: 1.8, inset: 6.1, pad: [0.4, 0.8] }
  src: p38 "Figure 11-1 ESP32-C3-MINI-1 Recommended PCB Land Pattern (see comment)"

pad_grids:
  value:
    - numbers: ["49"]
      columns: 3
      rows: 3
      pitch: [2.05, 2.05]
      pad: [1.45, 1.45]
      x: 0
      y: -2.7
    - { numbers: ["50"], columns: 1, rows: 1, pitch: [1, 1], pad: [0.7, 0.7], x: 5.95, y: 2.25 }
    - { numbers: ["51"], columns: 1, rows: 1, pitch: [1, 1], pad: [0.7, 0.7], x: 5.95, y: -7.65 }
    - { numbers: ["52"], columns: 1, rows: 1, pitch: [1, 1], pad: [0.7, 0.7], x: -5.95, y: -7.65 }
    - { numbers: ["53"], columns: 1, rows: 1, pitch: [1, 1], pad: [0.7, 0.7], x: -5.95, y: 2.25 }
  src: p38 "Figure 11-1 ESP32-C3-MINI-1 Recommended PCB Land Pattern (see comment)"

shield:
  x: 0.005
  y: -2.705
  width: 11.95
  length: 9.95
  src: p35 "Figure 10-1 ESP32-C3-MINI-1 Physical Dimensions, top view (see comment)"

edge:
  side: +y
  requirement: recommended
  src: 'espressif/esp32-c3_hardware_design_guidelines_en@rev1.8 p24 "Section 1.4.7: place the on-board PCB antenna outside the base board, feed point near the edge"'

keepouts:
  value:
    - purpose: antenna
      restricts: [components, copper]
      rect: { x: 0, y: 5.6, width: 13.2, length: 5.4 }
      side: +y
  src:
    - p38 "Figure 11-1 ESP32-C3-MINI-1 Recommended PCB Land Pattern, "Antenna Area" at the top"
    - 'espressif/esp32-c3_hardware_design_guidelines_en@rev1.8 p24 "Section 1.4.7: cut off the base board on both sides of the antenna and below it"'
