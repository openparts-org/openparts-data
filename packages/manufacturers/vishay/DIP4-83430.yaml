# Vishay DIP-4 optocoupler outline of the VO617A, read from the rendered
# "PACKAGE DIMENSIONS (in millimeters)" drawing, Fig. 17 "Package
# Drawings", DIP-4 views, on page 8 of the VO617A datasheet (document
# 83430, Rev. 2.8). No drawing number is printed; the id uses the
# document number. Values with a printed tolerance are recorded as
# nominal plus the resulting min/max.
#
# `dip` generator convention: body_width = row spacing (end view "7.62
# +/- 0.3"), body_length = side view "4.58 +/- 0.3", body_height = mold
# "3.5 +/- 0.3", standoff = "0.5 typ.". The molded width "6.5 +/- 0.5"
# has no dip field. The option 6/7/8 lead forms are not covered.
schema_version: "0.2"
kind: package
id: manufacturers/vishay/DIP4-83430
family: dip
lead_count: 4
source: vishay/83430

pitch:
  min: 2.29 mm
  typ: 2.54 mm
  max: 2.79 mm
  src: p8 "Fig. 17 DIP-4, side view, "2.54 +/- 0.25""

geometry: { type: parametric, generator: dip }

dimensions:
  body_width:
    min: 7.32 mm
    typ: 7.62 mm
    max: 7.92 mm
    src: p8 "Fig. 17 DIP-4, end view, row spacing "7.62 +/- 0.3""
  body_length:
    min: 4.28 mm
    typ: 4.58 mm
    max: 4.88 mm
    src: p8 "Fig. 17 DIP-4, side view, "4.58 +/- 0.3""
  body_height:
    min: 3.2 mm
    typ: 3.5 mm
    max: 3.8 mm
    src: p8 "Fig. 17 DIP-4, side view, "3.5 +/- 0.3""
  lead_thickness: { typ: 0.26 mm, src: 'p8 "Fig. 17 DIP-4, end view, "0.26""' }
  standoff:       { typ: 0.5 mm, src: 'p8 "Fig. 17 DIP-4, side view, "0.5 typ.""' }
  lead_width:
    min: 0.4 mm
    typ: 0.5 mm
    max: 0.6 mm
    src: p8 "Fig. 17 DIP-4, side view, "0.5 +/- 0.1""
