# Vishay VEML6030 6-pad leadless optical package, 2 x 2 x 0.87 mm, 0.65
# mm pitch, no exposed pad. Read from "PACKAGE DIMENSIONS" (drawing
# 6.550-5348.01-4, issue 1, 19.02.16) on page 10 of document 84366 rev.
# 1.8, rendered. "Not indicated tolerances +-0.1": the untoleranced
# callouts are recorded as typ only.
#
# Mapping: top view "2" x "2" -> body_width / body_length; side view
# "0.87" -> body_height; bottom view "0.65 (4 x)" -> pitch; "0.4 (6 x)"
# terminal length from the edge -> lead_length.
# Orientation: the "Top View Pinning" figure puts pin 1 (GND) at the
# lower right, 1-3 up the right column and 4-6 down the left column (6
# lower left). Rotated by 180 degrees here so pin 1 is upper left: 1-3
# down the left, 4-6 up the right (the family's counter-clockwise order).
# pads: "Recommended Footprint": 0.55 (6 x) wide, 0.3 (6 x) long, 0.35
# (4 x) gaps (-> 0.65 pitch, 3 x 0.3 + 2 x 0.35 = "1.6"), "2.3" across
# the outer pad edges -> centres x = +-(2.3 - 0.55)/2 = +-0.875.
# Left out: the bottom-view "0.45 (6 x)" (position callout without a
# field), "(0.6)" reference.
schema_version: "0.2"
kind: package
id: manufacturers/vishay/ODFN6-2x2-P0.65-VEML6030
family: dfn
lead_count: 6
source: vishay/84366

pitch: { typ: 0.65 mm, src: 'p10 "PACKAGE DIMENSIONS, bottom view, "0.65 (4 x)""' }
geometry: { type: parametric, generator: dfn }

dimensions:
  body_width:  { typ: 2 mm, src: 'p10 "PACKAGE DIMENSIONS, top view, "2" (horizontal)"' }
  body_length: { typ: 2 mm, src: 'p10 "PACKAGE DIMENSIONS, top view, "2" (vertical)"' }
  body_height: { typ: 0.87 mm, src: 'p10 "PACKAGE DIMENSIONS, side view, "0.87""' }
  lead_length: { typ: 0.4 mm, src: 'p10 "PACKAGE DIMENSIONS, bottom view, "0.4 (6 x)""' }

pads:
  value:
    - { number: "1", x: -0.875, y: 0.65, width: 0.55, length: 0.3 }
    - { number: "2", x: -0.875, y: 0, width: 0.55, length: 0.3 }
    - { number: "3", x: -0.875, y: -0.65, width: 0.55, length: 0.3 }
    - { number: "4", x: 0.875, y: -0.65, width: 0.55, length: 0.3 }
    - { number: "5", x: 0.875, y: 0, width: 0.55, length: 0.3 }
    - { number: "6", x: 0.875, y: 0.65, width: 0.55, length: 0.3 }
  src: 'p10 "Recommended Footprint: 0.55 (6 x) x 0.3 (6 x), gaps 0.35 (4 x), 2.3 outer -> x = +-0.875 (rotated 180 deg)"'
