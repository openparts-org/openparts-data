# Panasonic FK series case size code E (ø8 x 6.2 L), from
# panasonic/ABA0000C1181 p1 "Dimensions" (standard products) and p2
# "Land / Pad pattern", standard products. Same frame and mapping as
# manufacturers/panasonic/FK-D-6.3x5.8: top view, origin at the base
# plate's centre, terminals along X with the + terminal (pad 1) at -X;
# the source draws the terminals along Y, so plate side B is body_width
# and A is body_length (both "8.3" for size E).
# Left out: K (terminal reach past the plate) and P (gap between the
# terminals, reference) have no field. I is printed in parentheses ("( )
# Reference size") and recorded as the reference value it is.
schema_version: "0.2"
kind: package
id: manufacturers/panasonic/FK-E-8x6.2
family: smd_electrolytic
lead_count: { value: 2, src: 'p1 "Dimensions, terminals (+) / (-)"' }
source: panasonic/ABA0000C1181

pitch: { unit: mm }
geometry: { type: parametric, generator: smd_electrolytic }

dimensions:
  body_width:
    min: 8.1 mm
    typ: 8.3 mm
    max: 8.5 mm
    src: p1 "Dimensions, size E row, B (B±0.2)"
  body_length:
    min: 8.1 mm
    typ: 8.3 mm
    max: 8.5 mm
    src: p1 "Dimensions, size E row, A (A±0.2)"
  can_diameter:
    min: 7.5 mm
    typ: 8 mm
    max: 8.5 mm
    src: p1 "Dimensions, size E row, øD (drawing øD±0.5)"
  lead_length:   { typ: 3.4 mm, src: 'p1 "Dimensions, size E row, (I) reference size"' }
  overall_width: { max: 9.5 mm, src: 'p1 "Dimensions, size E row, H max."' }
  overall_height:
    min: 5.9 mm
    typ: 6.2 mm
    max: 6.5 mm
    src: p1 "Dimensions, size E row, L (6.2±0.3)"
  lead_width:
    min: 0.55 mm
    typ: 0.65 mm
    max: 0.75 mm
    src: p1 "Dimensions, size E row, W (0.65±0.1)"

# pads (Land / Pad pattern, standard products, size E): a = 2.2
# between the lands, b = 4 along the terminal axis, c = 1.6 across;
# turned 90° (see header): width = b, length = c, centres
# x = ±(a/2 + b/2) = ±3.1, + land (pad 1) at -X.
pads:
  value:
    - { number: "1", x: -3.1, y: 0, width: 4, length: 1.6 }
    - { number: "2", x: 3.1, y: 0, width: 4, length: 1.6 }
  src: p2 "Land / Pad pattern, Standard products, size E row, a b c"
