# Panasonic FK series case size code B (ø4.0 x 5.8 L), from
# panasonic/ABA0000C1181 p1 "Dimensions" (standard products) and p2
# "Land / Pad pattern", standard products.
# Frame (smd_electrolytic): top view, origin at the base plate's centre,
# terminals along X with the + terminal (pad 1) at -X. The source draws
# the terminals along Y (- at the top, + at the bottom); turned 90° here,
# so the plate side B (along the terminals) is body_width and A is
# body_length (both "4.3" for size B).
# Left out: K (terminal reach past the plate) and P (gap between the
# terminals, reference) have no field; the plate thickness and the + side
# corner cuts are not dimensioned (3D defaults).
# I is printed in parentheses ("( ) Reference size") and recorded as the
# reference value it is.
schema_version: "0.2"
kind: package
id: manufacturers/panasonic/FK-B-4x5.8
family: smd_electrolytic
lead_count: { value: 2, src: 'p1 "Dimensions, terminals (+) / (-)"' }
source: panasonic/ABA0000C1181

pitch: { unit: mm }
geometry: { type: parametric, generator: smd_electrolytic }

dimensions:
  body_width:
    min: 4.1 mm
    typ: 4.3 mm
    max: 4.5 mm
    src: p1 "Dimensions, size B row, B (B±0.2)"
  body_length:
    min: 4.1 mm
    typ: 4.3 mm
    max: 4.5 mm
    src: p1 "Dimensions, size B row, A (A±0.2)"
  can_diameter:
    min: 3.5 mm
    typ: 4 mm
    max: 4.5 mm
    src: p1 "Dimensions, size B row, øD (drawing øD±0.5)"
  lead_length:    { typ: 1.8 mm, src: 'p1 "Dimensions, size B row, (I) reference size"' }
  overall_width:  { max: 5.5 mm, src: 'p1 "Dimensions, size B row, H max."' }
  overall_height: { min: 5.5 mm, typ: 5.8 mm, max: 6.1 mm, src: 'p1 "Dimensions, size B row, L"' }
  lead_width: { min: 0.55 mm, typ: 0.65 mm, max: 0.75 mm, src: 'p1 "Dimensions, size B row, W"' }

# pads (Land / Pad pattern, standard products, size B): a = 1.0
# between the lands, b = 2.5 along the terminal axis, c = 1.6 across;
# turned 90° (see header): width = b, length = c, centres
# x = ±(a/2 + b/2) = ±1.75, + land (pad 1) at -X.
pads:
  value:
    - { number: "1", x: -1.75, y: 0, width: 2.5, length: 1.6 }
    - { number: "2", x: 1.75, y: 0, width: 2.5, length: 1.6 }
  src: p2 "Land / Pad pattern, Standard products, size B row, a b c"
