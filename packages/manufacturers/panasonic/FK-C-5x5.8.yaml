# Panasonic FK series case size code C (ø5 x 5.8 L), from
# panasonic/ABA0000C1181 p1 "Dimensions" (standard products) and p2
# "Land / Pad pattern", standard products. Same frame and mapping as
# manufacturers/panasonic/FK-D-6.3x5.8: top view, origin at the base
# plate's centre, terminals along X with the + terminal (pad 1) at -X;
# the source draws the terminals along Y, so plate side B is body_width
# and A is body_length (both "5.3" for size C).
# Left out: K (terminal reach past the plate) and P (gap between the
# terminals, reference) have no field. I is printed in parentheses ("( )
# Reference size") and recorded as the reference value it is.
schema_version: "0.2"
kind: package
id: manufacturers/panasonic/FK-C-5x5.8
family: smd_electrolytic
lead_count: { value: 2, src: 'p1 "Dimensions, terminals (+) / (-)"' }
source: panasonic/ABA0000C1181

pitch: { unit: mm }
geometry: { type: parametric, generator: smd_electrolytic }

dimensions:
  body_width:
    min: 5.1 mm
    typ: 5.3 mm
    max: 5.5 mm
    src: p1 "Dimensions, size C row, B (B±0.2)"
  body_length:
    min: 5.1 mm
    typ: 5.3 mm
    max: 5.5 mm
    src: p1 "Dimensions, size C row, A (A±0.2)"
  can_diameter:
    min: 4.5 mm
    typ: 5 mm
    max: 5.5 mm
    src: p1 "Dimensions, size C row, øD (drawing øD±0.5)"
  lead_length:   { typ: 2.2 mm, src: 'p1 "Dimensions, size C row, (I) reference size"' }
  overall_width: { max: 6.5 mm, src: 'p1 "Dimensions, size C row, H max."' }
  overall_height:
    min: 5.5 mm
    typ: 5.8 mm
    max: 6.1 mm
    src: p1 "Dimensions, size C row, L (5.8±0.3)"
  lead_width:
    min: 0.55 mm
    typ: 0.65 mm
    max: 0.75 mm
    src: p1 "Dimensions, size C row, W (0.65±0.1)"

# pads (Land / Pad pattern, standard products, size C): a = 1.5
# between the lands, b = 2.8 along the terminal axis, c = 1.6 across;
# turned 90° (see header): width = b, length = c, centres
# x = ±(a/2 + b/2) = ±2.15, + land (pad 1) at -X.
pads:
  value:
    - { number: "1", x: -2.15, y: 0, width: 2.8, length: 1.6 }
    - { number: "2", x: 2.15, y: 0, width: 2.8, length: 1.6 }
  src: p2 "Land / Pad pattern, Standard products, size C row, a b c"
