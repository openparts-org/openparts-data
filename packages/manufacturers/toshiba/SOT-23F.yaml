# Toshiba SOT-23F (3-lead flat-lead SOT), read from the rendered
# "Package Dimensions" page of the SSM3K324R datasheet (page 8, image
# only). No Toshiba drawing number is printed; the package table names
# only "Nickname: SOT-23F", so the id is the nickname. The same drawing
# (pixel-identical drawing area at 100 dpi) is on page 8 of the
# SSM3K333R, SSM3J328R, SSM3J332R, SSM3K336R, SSM3J334R, SSM3K341R,
# SSM3J338R, SSM3K361R, SSM3J351R, SSM3K345R and SSM3J356R datasheets.
# Millimetres; a toleranced value is recorded as nominal plus the
# resulting min/max.
#
# sot mapping (as manufacturers/onsemi/SOT23-2.92x1.40-P1.90-527AG):
# body_width = "2.9 +/-0.2" along the two-lead row, body_length = "1.8
# +/-0.1" across the rows, overall_length = lead-tip span "2.4 +/-0.1",
# pitch = pin 1 to pin 2 (two boxed "0.95" basic = 1.9). Top view: leads
# 1, 2 on the bottom edge, 3 on the top edge.
# The leads are flat (side view; no bend), drawn by the gull-wing `sot`
# generator as for manufacturers/ti/DRL0005A. The height "0.8
# +0.08/-0.05" is measured from the lead underside (seating) to the top:
# overall_height. Not recorded: the bottom-view reference value "(0.1)";
# no foot length or standoff is printed. No land pattern in the source.
schema_version: "0.2"
kind: package
id: manufacturers/toshiba/SOT-23F
family: sot
lead_count: 3

lead_layout:
  value: [2, 1]
  src:   'p8 "Package Dimensions top view: leads 1, 2 on the bottom edge, lead 3 on the top edge"'

source: toshiba/SSM3K324R-datasheet-en

pitch: { typ: 1.9 mm, src: 'p8 "Package Dimensions, two boxed basic "0.95" between leads 1 and 2"' }
geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 2.7 mm
    typ: 2.9 mm
    max: 3.1 mm
    src: p8 "Package Dimensions top view, body "2.9 +/-0.2" along the lead rows"
  body_length:
    min: 1.7 mm
    typ: 1.8 mm
    max: 1.9 mm
    src: p8 "Package Dimensions top view, body "1.8 +/-0.1" across the lead rows"
  lead_thickness:
    min: 0.1 mm
    typ: 0.17 mm
    max: 0.25 mm
    src: p8 "Package Dimensions end view, lead thickness "0.17 +0.08/-0.07""
  lead_width:
    min: 0.37 mm
    typ: 0.42 mm
    max: 0.5 mm
    src: p8 "Package Dimensions top view, lead width "0.42 +0.08/-0.05""
  overall_length:
    min: 2.3 mm
    typ: 2.4 mm
    max: 2.5 mm
    src: p8 "Package Dimensions top view, lead-tip span "2.4 +/-0.1""
  overall_height:
    min: 0.75 mm
    typ: 0.8 mm
    max: 0.88 mm
    src: p8 "Package Dimensions side view, height "0.8 +0.08/-0.05""
