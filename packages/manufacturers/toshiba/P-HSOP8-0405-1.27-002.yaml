# E-PAD: "2.18~2.39" across the rows -> exposed_pad.width,
# "3.00~3.20" along them -> exposed_pad.length, centred on the
# package centre lines. The datasheet gives no land pattern (the
# generator's IPC-7351B lands; the thermal land is the pad). Pins 1-4
# along one long edge, 5-8 back along the other -- the SOIC order.
