# Toshiba USM (JEDEC SOT-323) 3-lead gull-wing package, read from the
# rendered "Package Dimensions" page of the SSM3K7002KFU datasheet
# (page 7, image only; toshiba/SSM3K7002KFU-datasheet-en). The package
# table names "JEDEC: SOT-323" and "Nickname: USM"; no Toshiba drawing
# number is printed, so the id is the nickname. The page-1 outline of
# the SSM3K15AFU datasheet (USM, "TOSHIBA 2-2E1E", "JEITA SC-70") prints
# the same values. Millimetres; a toleranced value is recorded as
# nominal plus the resulting min/max.
#
# sot mapping (as manufacturers/toshiba/USV): body_width = body along
# the two-lead row "2 +/-0.2", body_length = across the rows "1.25
# +/-0.1", overall_length = lead-tip span "2.1 +/-0.1", pitch = pin 1
# to pin 2 (two boxed basic "0.65" = 1.3). Top view: leads 1, 2 on the
# bottom edge, 3 on the top edge. Side view: "0.9 +/-0.1" from the top
# to the body underside (body_height), leads "0.05 +/-0.05" below it
# (standoff). The untoleranced "0.7" is not recorded. No land pattern.
schema_version: "0.2"
kind: package
id: manufacturers/toshiba/USM
family: sot
lead_count: 3

lead_layout:
  value: [2, 1]
  src:   'p7 "Package Dimensions top view: leads 1, 2 on the bottom edge, lead 3 on the top edge"'

source: toshiba/SSM3K7002KFU-datasheet-en

pitch: { typ: 1.3 mm, src: 'p7 "Package Dimensions, two boxed basic "0.65" between leads 1 and 2"' }
geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 1.8 mm
    typ: 2 mm
    max: 2.2 mm
    src: p7 "Package Dimensions top view, body "2 +/-0.2" along the lead rows"
  body_length:
    min: 1.15 mm
    typ: 1.25 mm
    max: 1.35 mm
    src: p7 "Package Dimensions top view, body "1.25 +/-0.1" across the lead rows"
  body_height:
    min: 0.8 mm
    typ: 0.9 mm
    max: 1 mm
    src: p7 "Package Dimensions side view, height "0.9 +/-0.1" to the body underside"
  lead_thickness:
    min: 0.1 mm
    typ: 0.15 mm
    max: 0.25 mm
    src: p7 "Package Dimensions end view, lead thickness "0.15 +0.1/-0.05""
  overall_length:
    min: 2 mm
    typ: 2.1 mm
    max: 2.2 mm
    src: p7 "Package Dimensions top view, lead-tip span "2.1 +/-0.1""
  standoff:
    min: 0 mm
    typ: 0.05 mm
    max: 0.1 mm
    src: p7 "Package Dimensions side view, "0.05 +/-0.05" below the body"
  lead_width:
    min: 0.3 mm
    typ: 0.3 mm
    max: 0.4 mm
    src: p7 "Package Dimensions top view, lead width "0.3 +0.1/0""
