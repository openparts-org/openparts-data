# Toshiba SO6L outline 11-4N1A (wide-body 6-lead small-outline
# photocoupler package, standard lead forming), read from the rendered
# "Package Dimensions" drawing (page 17) and "15. Land Pattern
# Dimensions (for reference only)", Fig. 15.1 standard lead forming
# (page 12) of the TLP5701 datasheet (2026-04-22). Millimetres; values
# with a printed tolerance are recorded as nominal plus min/max.
#
# soic mapping: pins 1-3 on one side, 4-6 on the other (pin 1 opposite
# 6). body_width = 7.5 +/- 0.2 across the rows, body_length = 3.84 +/-
# 0.2 along the rows, overall_width = lead-tip span 10 +/- 0.2, lead
# width 0.38 +/- 0.1, foot 0.65 +/- 0.15, pitch 1.27 +/- 0.15,
# overall_height 2.1 +/- 0.1. Not recorded: the 0.1 standoff (no
# tolerance). The (LF4) wide-forming outline 11-4N101A is a separate
# drawing and not recorded.
# Land pattern: 0.8 (along the row) x 1.3 (across) lands, 1.27 pitch,
# rows 9.5 apart centre to centre -> x = ±4.75, y = 1.27 / 0 / -1.27.
schema_version: "0.2"
kind: package
id: manufacturers/toshiba/11-4N1A
family: soic
lead_count: 6
source: toshiba/TLP5701-datasheet-en

pitch:
  min: 1.12 mm
  typ: 1.27 mm
  max: 1.42 mm
  src: p17 "Package Dimensions 11-4N1A, lead pitch "1.27 +/- 0.15""

geometry: { type: parametric, generator: soic }

dimensions:
  body_width:
    min: 7.3 mm
    typ: 7.5 mm
    max: 7.7 mm
    src: p17 "Package Dimensions 11-4N1A, top view, "7.5 +/- 0.2" across the lead rows"
  body_length:
    min: 3.64 mm
    typ: 3.84 mm
    max: 4.04 mm
    src: p17 "Package Dimensions 11-4N1A, top view, "3.84 +/- 0.2" along the lead rows"
  lead_length:
    min: 0.5 mm
    typ: 0.65 mm
    max: 0.8 mm
    src: p17 "Package Dimensions 11-4N1A, side view, foot "0.65 +/- 0.15""
  lead_width:
    min: 0.28 mm
    typ: 0.38 mm
    max: 0.48 mm
    src: p17 "Package Dimensions 11-4N1A, top view, lead width "0.38 +/- 0.1""
  overall_width:
    min: 9.8 mm
    typ: 10 mm
    max: 10.2 mm
    src: p17 "Package Dimensions 11-4N1A, lead-tip span "10 +/- 0.2""
  overall_height:
    min: 2 mm
    typ: 2.1 mm
    max: 2.2 mm
    src: p17 "Package Dimensions 11-4N1A, end view, height "2.1 +/- 0.1""

pads:
  value:
    - { number: "1", x: -4.75, y: 1.27, width: 1.3, length: 0.8 }
    - { number: "2", x: -4.75, y: 0, width: 1.3, length: 0.8 }
    - { number: "3", x: -4.75, y: -1.27, width: 1.3, length: 0.8 }
    - { number: "4", x: 4.75, y: -1.27, width: 1.3, length: 0.8 }
    - { number: "5", x: 4.75, y: 0, width: 1.3, length: 0.8 }
    - { number: "6", x: 4.75, y: 1.27, width: 1.3, length: 0.8 }
  src: p12 "Fig. 15.1 land pattern (standard), 0.8 x 1.3 lands, pitch 1.27, rows 9.5 apart (centres ±4.75)"
