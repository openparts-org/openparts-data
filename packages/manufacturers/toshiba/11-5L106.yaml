# Toshiba 11-5L106: the DIP4 "LF6" surface-mount lead form (gull-wing
# leads, 2.54 mm pitch) of TLP785, read from the rendered drawing
# "TLP785(LF6)" on page 4 ("Surface-Mount Lead Form Option") of the
# TLP785 datasheet (2026-04-07). Millimetres; values with a printed
# tolerance are recorded as nominal plus the resulting min/max.
#
# soic mapping: pins 1-2 on one side, 3-4 on the other, counter-
# clockwise top view. body_width = mold 6.5 +/- 0.25 across the rows,
# body_length = 4.6 +/- 0.25 along the rows, body_height = 3.5 +/- 0.25
# (mold thickness above the 0.1 +/- 0.1 standoff), overall_width =
# lead-tip span 10.0 +/- 0.3. The 7.62 +/- 0.3 shoulder-to-shoulder
# lead spacing has no field and is not recorded.
schema_version: "0.2"
kind: package
id: manufacturers/toshiba/11-5L106
family: soic
lead_count: 4
source: toshiba/TLP785-datasheet-en

pitch:
  min: 2.29 mm
  typ: 2.54 mm
  max: 2.79 mm
  src: p4 "Drawing "TLP785(LF6)" 11-5L106, "2.54 +/- 0.25""

geometry: { type: parametric, generator: soic }

dimensions:
  body_width:
    min: 6.25 mm
    typ: 6.5 mm
    max: 6.75 mm
    src: p4 "Drawing 11-5L106, top view, "6.5 +/- 0.25" across the lead rows"
  body_length:
    min: 4.35 mm
    typ: 4.6 mm
    max: 4.85 mm
    src: p4 "Drawing 11-5L106, end view, "4.6 +/- 0.25""
  body_height:
    min: 3.25 mm
    typ: 3.5 mm
    max: 3.75 mm
    src: p4 "Drawing 11-5L106, end view, "3.5 +/- 0.25" (above the standoff)"
  lead_thickness:
    min: 0.16 mm
    typ: 0.26 mm
    max: 0.36 mm
    src: p4 "Drawing 11-5L106, side view, "0.26 +/- 0.1""
  overall_width:
    min: 9.7 mm
    typ: 10 mm
    max: 10.3 mm
    src: p4 "Drawing 11-5L106, side view, lead-tip span "10.0 +/- 0.3""
  standoff:
    min: 0 mm
    typ: 0.1 mm
    max: 0.2 mm
    src: p4 "Drawing 11-5L106, end view, "0.1 +/- 0.1""
  lead_width:
    min: 1.05 mm
    typ: 1.2 mm
    max: 1.35 mm
    src: p4 "Drawing 11-5L106, end view, lead width "1.2 +/- 0.15""
  lead_length:
    min: 0.9 mm
    typ: 1 mm
    max: 1.2 mm
    src: p4 "Drawing 11-5L106, side view, foot "1.0 +0.2/-0.1""
