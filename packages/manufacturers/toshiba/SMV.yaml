# Toshiba SMV (SOT-25)(SC-74A) 5-lead package, read from the rendered "Package Dimensions" page
# (p15, image only) of the TCR2EF/TCR2EE series datasheet
# (2026-04-07). The TCR3DF series datasheet (Rev.5.0.A) page 13 carries
# a drawing with the same values ("10. Package Information, SMV").
# Millimetres; a toleranced value is recorded as nominal plus the
# resulting min/max. No Toshiba drawing number is printed; the id is the
# Toshiba nickname.
#
# sot mapping (as manufacturers/ti/DBV0005A): body_width = body along
# the lead rows, body_length = body across the rows, overall_length =
# lead-tip span. Top view: leads 1, 2, 3 on the bottom edge, 4 opposite
# 3 and 5 opposite 1 on the top edge -- the generator's [3, 2] layout.
# The side-view height runs from the top to the body underside
# (body_height); the leads sit "0.05 +/-0.05" below it (standoff).
# No land pattern in the source.
schema_version: "0.2"
kind: package
id: manufacturers/toshiba/SMV
family: sot
lead_count: 5

lead_layout:
  value: [3, 2]
  src:   'p15 "Package Dimensions top view: leads 1, 2, 3 bottom edge; 5, 4 top edge"'

source: toshiba/TCR2EF-datasheet-en

pitch: { typ: 0.95 mm, src: 'p15 "Package Dimensions, boxed basic "0.95" pin 1 to 2 and 2 to 3"' }
geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 2.7 mm
    typ: 2.9 mm
    max: 3.1 mm
    src: p15 "Package Dimensions top view, body "2.9 +/-0.2" along the lead rows"
  body_length:
    min: 1.5 mm
    typ: 1.6 mm
    max: 1.8 mm
    src: p15 "Package Dimensions top view, body "1.6 +0.2/-0.1" across the lead rows"
  body_height:
    min: 1 mm
    typ: 1.1 mm
    max: 1.3 mm
    src: p15 "Package Dimensions side view, height "1.1 +0.2/-0.1" to the body underside"
  lead_thickness:
    min: 0.1 mm
    typ: 0.16 mm
    max: 0.26 mm
    src: p15 "Package Dimensions end view, lead thickness "0.16 +0.1/-0.06""
  overall_length:
    min: 2.5 mm
    typ: 2.8 mm
    max: 3 mm
    src: p15 "Package Dimensions top view, lead-tip span "2.8 +0.2/-0.3""
  standoff:
    min: 0 mm
    typ: 0.05 mm
    max: 0.1 mm
    src: p15 "Package Dimensions side view, "0.05 +/-0.05" below the body"
  lead_width:
    min: 0.3 mm
    typ: 0.4 mm
    max: 0.5 mm
    src: p15 "Package Dimensions top view, lead width "0.4 +/-0.1""
