# Toshiba SSM (JEITA-style SOT-416-size) 3-lead gull-wing package, read
# from the rendered "Package Dimensions" page of the SSM3K56FS datasheet
# (page 7, image only; toshiba/SSM3K56FS-datasheet-en). No Toshiba
# drawing number is printed; the package table names only "Nickname:
# SSM", so the id is the nickname. Millimetres; a toleranced value is
# recorded as nominal plus the resulting min/max.
#
# sot mapping (as manufacturers/toshiba/USV): body_width = body along
# the two-lead row "1.6 +/-0.2", body_length = body across the rows
# "0.8 +/-0.1", overall_length = lead-tip span "1.6 +/-0.2", pitch =
# pin 1 to pin 2 (two boxed basic "0.5" = 1.0). Top view: leads 1, 2 on
# the bottom edge, 3 on the top edge. The side-view height "0.7 +/-0.1"
# runs from the top to the body underside (body_height); the leads sit
# "0.05 +/-0.05" below it (standoff). The untoleranced "0.55" side-view
# value is not recorded. No land pattern in the source.
schema_version: "0.2"
kind: package
id: manufacturers/toshiba/SSM
family: sot
lead_count: 3

lead_layout:
  value: [2, 1]
  src:   'p7 "Package Dimensions top view: leads 1, 2 on the bottom edge, lead 3 on the top edge"'

source: toshiba/SSM3K56FS-datasheet-en

pitch: { typ: 1 mm, src: 'p7 "Package Dimensions, two boxed basic "0.5" between leads 1 and 2"' }
geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 1.4 mm
    typ: 1.6 mm
    max: 1.8 mm
    src: p7 "Package Dimensions top view, body "1.6 +/-0.2" along the lead rows"
  body_length:
    min: 0.7 mm
    typ: 0.8 mm
    max: 0.9 mm
    src: p7 "Package Dimensions top view, body "0.8 +/-0.1" across the lead rows"
  body_height:
    min: 0.6 mm
    typ: 0.7 mm
    max: 0.8 mm
    src: p7 "Package Dimensions side view, height "0.7 +/-0.1" to the body underside"
  lead_thickness:
    min: 0.1 mm
    typ: 0.15 mm
    max: 0.2 mm
    src: p7 "Package Dimensions end view, lead thickness "0.15 +/-0.05""
  overall_length:
    min: 1.4 mm
    typ: 1.6 mm
    max: 1.8 mm
    src: p7 "Package Dimensions top view, lead-tip span "1.6 +/-0.2""
  standoff:
    min: 0 mm
    typ: 0.05 mm
    max: 0.1 mm
    src: p7 "Package Dimensions side view, "0.05 +/-0.05" below the body"
  lead_width:
    min: 0.15 mm
    typ: 0.2 mm
    max: 0.3 mm
    src: p7 "Package Dimensions top view, lead width "0.2 +0.1/-0.05""
