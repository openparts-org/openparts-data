# Toshiba 11-10C4S: the 8-pin DIP (through-hole, 7.62 mm row spacing) of
# the TLP250H, read from the rendered "Package Dimensions" drawing
# (TLP250H, Unit: mm) on page 11 of the TLP250H datasheet (2026-05-13).
# Values with a printed tolerance are recorded as nominal plus the
# resulting min/max.
#
# `dip` generator convention: body_width = row spacing (end view "7.62
# +/- 0.25"), body_length = side view "9.66 +/- 0.25", body_height =
# mold "3.65 +0.15/-0.25", standoff = "0.8 +/- 0.25". The molded width
# "6.4 +/- 0.25" has no dip field; the 7.85-8.80 lead-tip spread and the
# 2.5 min lead length are not recorded.
schema_version: "0.2"
kind: package
id: manufacturers/toshiba/11-10C4S
family: dip
lead_count: 8
source: toshiba/TLP250H-datasheet-en

pitch:
  min: 2.29 mm
  typ: 2.54 mm
  max: 2.79 mm
  src: p11 "Package Dimensions 11-10C4S, side view, "2.54 +/- 0.25""

geometry: { type: parametric, generator: dip }

dimensions:
  body_width:
    min: 7.37 mm
    typ: 7.62 mm
    max: 7.87 mm
    src: p11 "Package Dimensions 11-10C4S, end view, "7.62 +/- 0.25""
  body_length:
    min: 9.41 mm
    typ: 9.66 mm
    max: 9.91 mm
    src: p11 "Package Dimensions 11-10C4S, side view, "9.66 +/- 0.25""
  body_height:
    min: 3.4 mm
    typ: 3.65 mm
    max: 3.8 mm
    src: p11 "Package Dimensions 11-10C4S, side view, "3.65 +0.15/-0.25""
  lead_thickness:
    min: 0.2 mm
    typ: 0.25 mm
    max: 0.35 mm
    src: p11 "Package Dimensions 11-10C4S, end view, "0.25 +0.10/-0.05""
  standoff:
    min: 0.55 mm
    typ: 0.8 mm
    max: 1.05 mm
    src: p11 "Package Dimensions 11-10C4S, side view, "0.8 +/- 0.25""
  lead_width:
    min: 0.4 mm
    typ: 0.5 mm
    max: 0.6 mm
    src: p11 "Package Dimensions 11-10C4S, side view, "0.5 +/- 0.1""
