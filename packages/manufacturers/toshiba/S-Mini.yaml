# Toshiba S-Mini (JEDEC SOT-346) 3-lead gull-wing package, read from the
# rendered "Package Dimensions" page of the SSM3J168F datasheet (page 7,
# image only; toshiba/SSM3J168F-datasheet-en). The package table names
# "JEDEC: SOT-346" and "Nickname: S-Mini"; no Toshiba drawing number is
# printed, so the id is the nickname. Millimetres; a toleranced value is
# recorded as nominal plus the resulting min/max.
#
# sot mapping (as manufacturers/toshiba/USV): body_width = body along
# the two-lead row "2.9 +/-0.2", body_length = across the rows "1.5
# +0.25/-0.15", overall_length = lead-tip span "2.5 +0.5/-0.3", pitch =
# pin 1 to pin 2 (two boxed basic "0.95" = 1.9). Top view: leads 1, 2 on
# the bottom edge, 3 on the top edge. Side view: "1.1 +0.2/-0.1" from
# the top to the body underside (body_height), leads "0.05 +/-0.05"
# below it (standoff). The untoleranced "0.3" is not recorded. No land
# pattern in the source.
schema_version: "0.2"
kind: package
id: manufacturers/toshiba/S-Mini
family: sot
lead_count: 3

lead_layout:
  value: [2, 1]
  src:   'p7 "Package Dimensions top view: leads 1, 2 on the bottom edge, lead 3 on the top edge"'

source: toshiba/SSM3J168F-datasheet-en

pitch: { typ: 1.9 mm, src: 'p7 "Package Dimensions, two boxed basic "0.95" between leads 1 and 2"' }
geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 2.7 mm
    typ: 2.9 mm
    max: 3.1 mm
    src: p7 "Package Dimensions top view, body "2.9 +/-0.2" along the lead rows"
  body_length:
    min: 1.35 mm
    typ: 1.5 mm
    max: 1.75 mm
    src: p7 "Package Dimensions top view, body "1.5 +0.25/-0.15" across the lead rows"
  body_height:
    min: 1 mm
    typ: 1.1 mm
    max: 1.3 mm
    src: p7 "Package Dimensions side view, height "1.1 +0.2/-0.1" to the body underside"
  lead_thickness:
    min: 0.1 mm
    typ: 0.16 mm
    max: 0.26 mm
    src: p7 "Package Dimensions end view, lead thickness "0.16 +0.1/-0.06""
  overall_length:
    min: 2.2 mm
    typ: 2.5 mm
    max: 3 mm
    src: p7 "Package Dimensions top view, lead-tip span "2.5 +0.5/-0.3""
  standoff:
    min: 0 mm
    typ: 0.05 mm
    max: 0.1 mm
    src: p7 "Package Dimensions side view, "0.05 +/-0.05" below the body"
  lead_width:
    min: 0.35 mm
    typ: 0.4 mm
    max: 0.5 mm
    src: p7 "Package Dimensions top view, lead width "0.4 +0.1/-0.05""
