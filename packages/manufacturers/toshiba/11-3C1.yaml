# Toshiba SO4 outline 11-3C1 (4-lead small-outline photocoupler
# package), read from the rendered drawing on page 1 of the TLP291
# datasheet (2019-5-27). Millimetres; values with a printed tolerance
# are recorded as nominal plus the resulting min/max.
#
# soic mapping: pins 1-2 on one side, 3-4 on the other (pin 1 opposite
# pin 4, numbering counter-clockwise in the top view). body_width =
# 4.55 (+0.25/-0.15) across the rows, body_length = 2.6 (+0.25/-0.15)
# along the rows, overall_width = lead-tip span 7.0 +/- 0.4, pitch the
# boxed (basic) 1.27.
#
# overall_height 2.1 +/- 0.1 is the seating-plane-to-top height. Not
# recorded: the parenthesised reference values (0.1) standoff and
# (0.15) lead thickness; lead length is printed only as "0.5min".
schema_version: "0.2"
kind: package
id: manufacturers/toshiba/11-3C1
family: soic
lead_count: 4
source: toshiba/TLP291-datasheet-en

pitch:
  typ: 1.27 mm
  src: 'p1 "Package drawing 11-3C1 (Unit: mm), boxed basic lead pitch "1.27""'

geometry: { type: parametric, generator: soic }

dimensions:
  body_width:
    min: 4.4 mm
    typ: 4.55 mm
    max: 4.8 mm
    src: p1 "Package drawing 11-3C1, top view, body "4.55 +0.25/-0.15" across the lead rows"
  body_length:
    min: 2.45 mm
    typ: 2.6 mm
    max: 2.85 mm
    src: p1 "Package drawing 11-3C1, top view, body "2.6 +0.25/-0.15" along the lead rows"
  lead_length: { min: 0.5 mm, src: 'p1 "Package drawing 11-3C1, side view, foot "0.5min""' }
  lead_width:
    min: 0.28 mm
    typ: 0.38 mm
    max: 0.48 mm
    src: p1 "Package drawing 11-3C1, end view, lead width "0.38 +/- 0.1""
  overall_width:
    min: 6.6 mm
    typ: 7 mm
    max: 7.4 mm
    src: p1 "Package drawing 11-3C1, side view, lead-tip span "7.0 +/- 0.4""
  overall_height:
    min: 2 mm
    typ: 2.1 mm
    max: 2.2 mm
    src: p1 "Package drawing 11-3C1, side view, height "2.1 +/- 0.1""
