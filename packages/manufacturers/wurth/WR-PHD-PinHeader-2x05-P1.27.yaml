# Würth WR-PHD pin header, 2 x 5, 1.27 mm pitch, straight THT
# (order code 62201021121), from the page-1 drawing of wurth/62201021121-DS (rev 003.001).
# min/max are the printed tolerances applied to the printed value.
# Numbering: the bottom view labels row "1" and row "2" at the
# first column; the hole pattern (component side) shows "1" bottom-left,
# "2" above it and "End" at the far end of row 2, i.e. odd pins in
# one row, even pins in the other, pin 2 beside pin 1 -- the `header`
# generator's zig-zag (pin 1 top-left, pin 2 to its right after a
# 90 degree turn).
# No land pattern is given, only the recommended hole: the footprint pad
# is the hole plus the generator's annular-ring default. The housing has
# no pin-1 mark in the drawing.
# The hole pattern's values carry its "General tolerance ±0.05"
# (applied as min/max); where the outline views give a looser
# tolerance for the same pitch, the hole pattern's is recorded.
schema_version: "0.2"
kind: package
id: manufacturers/wurth/WR-PHD-PinHeader-2x05-P1.27
family: header
lead_count: 10

lead_layout:
  value: [2, 5]
  src:   'p1 ""Article Properties" Pins 10; "Recommended Hole Pattern: [mm]": 2 rows, labelled "1", "2" and "End""'

source: wurth/62201021121-DS

pitch:
  min: 1.22 mm
  typ: 1.27 mm
  max: 1.32 mm
  src: 'p1 ""Recommended Hole Pattern: [mm]", pitch "1,27" with "General tolerance ±0,05" ("Dimensions: [mm]" view above the front view (first-angle projection: the bottom view) gives "1,27 ±0,15")"'

geometry: { type: parametric, generator: header }

dimensions:
  body_width:
    min: 3.25 mm
    typ: 3.4 mm
    max: 3.55 mm
    src: 'p1 ""Dimensions: [mm]" view below the front view (first-angle projection: the top view), housing width "3,4 ±0,15""'
  body_length:
    min: 6.05 mm
    typ: 6.35 mm
    max: 6.65 mm
    src: 'p1 ""Dimensions: [mm]" front view, housing length "L ±0,3"; "Article Properties" Length L = 6.35 mm"'
  body_height:
    min: 1.35 mm
    typ: 1.5 mm
    max: 1.65 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing height "1,5 ±0,15""'
  tail_length:
    min: 2.1 mm
    typ: 2.3 mm
    max: 2.5 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing underside to tail end "2,3 ±0,2""'
  lead_width:
    min: 0.35 mm
    typ: 0.4 mm
    max: 0.45 mm
    src: 'p1 ""Dimensions: [mm]" view above the front view (first-angle projection: the bottom view), square pin "□ 0,40 ±0.05""'
  row_spacing:
    min: 1.22 mm
    typ: 1.27 mm
    max: 1.32 mm
    src: 'p1 ""Recommended Hole Pattern: [mm]", rows "1,27" apart with "General tolerance ±0,05" ("Dimensions: [mm]" view below the front view (first-angle projection: the top view) gives "1,27 ±0,15")"'
  hole_diameter:
    min: 0.6 mm
    typ: 0.65 mm
    max: 0.7 mm
    src: 'p1 ""Recommended Hole Pattern: [mm]", hole "Ø 0,65" with "General tolerance ±0,05""'
  mating_length:
    min: 3.6 mm
    typ: 3.8 mm
    max: 4 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing top to pin tip "3,8 ±0,2""'
