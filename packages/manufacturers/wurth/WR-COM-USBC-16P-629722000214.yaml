    src: 'p1 ""Recommended Land Pattern": front slot centres to "Product edge" "2,62" (side view "2,6 ±0.20" front tab to front face); shell length "7,53": centre y = 2.62 - 7.53/2 = -1.145 (opening toward +Y)"'

