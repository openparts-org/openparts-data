  src: 'p1 ""Recommended Land Pattern: [mm]" (general tolerance ±0.05), drawn with the product edge at the bottom; turned 180° so the opening faces +Y (x -> -x, y -> -y; a rotation, not a mirror). Origin: X on the centre line, Y on the front (product-edge side) shell slot centres. Signal pads: "1,15" long; their top (rear) edge is "5,32" from the front slot centres, so centre y = -(5.32 - 1.15/2) = -4.745. X (drawing, left to right A1/B12, A4/B9, B8, A5, B7, A6, A7, B6, A8, B5, B4/A9, B1/A12): "6,4" A1/B12 to B1/A12 centres -> ±3.2; "0,8" A1/B12 to A4/B9 -> 3.2 - 0.8 = 2.4 (also "2,4" A4/B9 to the centre line); "1,75", "1,25", "0,75", "0,25" B8, A5, B7, A6 to the centre line; the right half is the mirror image about the drawn centre line (only the left half is dimensioned) and then x -> -x by the rotation. Widths: "0,6" for the four double-labelled pads, "0,3" for the single ones. Shell slots (S1, unnumbered in the source): "8,64" between centres -> x ±4.32; rear slots "4,18" behind the front ones -> y -4.18, land "2,1" x "1", slot "1,7" x "0,6"; front slots y 0, land "1,8" x "1", slot "1,4" x "0,6" (the widths "1"/"0,6" are dimensioned on a front slot and apply to the identically drawn rear ones). Not recorded: the two non-plated Ø0,65 alignment holes ("5,78" apart, "3,68" from the front slots) -- the family has no non-plated hole."'
