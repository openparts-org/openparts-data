  value: 16
  src: 'p1 ""Recommended Land Pattern: [mm]": 12 contact pads (labels A1 B12, A4 B9, B8, A5, B7, A6, A7, B6, A8, B5, B4 A9, B1 A12) + 4 plated shell slots; "Article Properties" Pins 16"'

