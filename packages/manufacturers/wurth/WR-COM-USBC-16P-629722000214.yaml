# Würth WR-COM USB 2.0 Type-C receptacle, horizontal, SMT, PCB top mount
# (order code 629722000214), 16 contacts on 12 SMD pads + 4 plated shell
# slots, from page 1 of wurth/629722000214-DS (rev 002.000).
# Frame (usb_c): top view, X right, Y up, opening toward +Y. The source's
# "Recommended Land Pattern" has the product edge (opening) at the
# bottom; it is turned 180° (x -> -x, y -> -y; rotation, not mirror).
# Origin: centre line / front shell-slot centres. Every coordinate's
# arithmetic is in the comment above pads.
# Shell (body_*): "8,94 ±0.20" wide, "7,53 ±0.20" long, "3,31 ±0.20" high
# (side view, seating plane to the shell top); the shell front face is
# the land pattern's "Product edge", "2,62" in front of the front slot
# centres (side view: "2,6 ±0.20"), so its centre is 2.62 - 7.53/2 =
# -1.145. No standoff is dimensioned (none recorded).
# NOT in the footprint: the two non-plated Ø0,65 alignment-peg holes of
# the land pattern (usb_c has no NPTH) -- add them by hand.
# Shell slots carry no number in the source: numbered "S1" here (Device
# pin "S1" "Shield").
schema_version: "0.2"
kind: package
id: manufacturers/wurth/WR-COM-USBC-16P-629722000214
family: usb_c

lead_count:
  value: 16
  src: p1 "Recommended Land Pattern [mm], contact pads and shell slots; Article Properties, Pins"

source: wurth/629722000214-DS

pitch: { unit: mm }
geometry: { type: parametric, generator: usb_c }

dimensions:
  body_width:
    min: 8.74 mm
    typ: 8.94 mm
    max: 9.14 mm
    src: 'p1 ""Dimensions: [mm]" top view, shell width "8,94 ±0.20""'
  body_length:
    min: 7.33 mm
    typ: 7.53 mm
    max: 7.73 mm
    src: 'p1 ""Dimensions: [mm]" top view and side view, shell length "7,53 ±0.20""'
  body_height:
    min: 3.11 mm
    typ: 3.31 mm
    max: 3.51 mm
    src: 'p1 ""Dimensions: [mm]" side view, seating plane to shell top "3,31 ±0.20""'
  body_offset:
    typ: -1.145 mm
    src: p1 "Recommended Land Pattern, front slot centres to Product edge; side view; shell length (see header)"

# pads (Recommended Land Pattern, tolerance ±0.05, turned 180°):
# signal pads 1,15 long, rear edge 5,32 from the front slots -> y =
# -(5.32 - 1.15/2) = -4.745. X (left half dimensioned, right half
# mirrored): 6,4 A1/B12-B1/A12 -> ±3.2; 0,8 to A4/B9 -> ±2.4; 1,75,
# 1,25, 0,75, 0,25 (B8, A5, B7, A6) to the centre line; then x -> -x.
# Widths 0,6 (double-labelled), 0,3 (single). Shell slots: 8,64 apart
# -> ±4.32; rear 4,18 behind -> y -4.18 (land 2,1 x 1, slot 1,7 x 0,6),
# front y 0 (land 1,8 x 1, slot 1,4 x 0,6; widths dimensioned on a
# front slot, rear drawn identical).
pads:
  value:
    - { number: A1, x: 3.2, y: -4.745, width: 0.6, length: 1.15 }
    - { number: A4, x: 2.4, y: -4.745, width: 0.6, length: 1.15 }
    - { number: B8, x: 1.75, y: -4.745, width: 0.3, length: 1.15 }
    - { number: A5, x: 1.25, y: -4.745, width: 0.3, length: 1.15 }
    - { number: B7, x: 0.75, y: -4.745, width: 0.3, length: 1.15 }
    - { number: A6, x: 0.25, y: -4.745, width: 0.3, length: 1.15 }
    - { number: A7, x: -0.25, y: -4.745, width: 0.3, length: 1.15 }
    - { number: B6, x: -0.75, y: -4.745, width: 0.3, length: 1.15 }
    - { number: A8, x: -1.25, y: -4.745, width: 0.3, length: 1.15 }
    - { number: B5, x: -1.75, y: -4.745, width: 0.3, length: 1.15 }
    - { number: A9, x: -2.4, y: -4.745, width: 0.6, length: 1.15 }
    - { number: A12, x: -3.2, y: -4.745, width: 0.6, length: 1.15 }
    - { number: S1, x: 4.32, y: -4.18, width: 1, length: 2.1, drill: 0.6, drill_length: 1.7 }
    - { number: S1, x: -4.32, y: -4.18, width: 1, length: 2.1, drill: 0.6, drill_length: 1.7 }
    - { number: S1, x: 4.32, y: 0, width: 1, length: 1.8, drill: 0.6, drill_length: 1.4 }
    - { number: S1, x: -4.32, y: 0, width: 1, length: 1.8, drill: 0.6, drill_length: 1.4 }
  src: p1 "Recommended Land Pattern [mm] (see comment above)"
