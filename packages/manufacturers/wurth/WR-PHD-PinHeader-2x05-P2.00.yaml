# Würth WR-PHD pin header, 2 x 5, 2.00 mm pitch, straight THT
# (order code 62001021121), from the page-1 drawing of wurth/62001021121-DS (rev 003.001).
# min/max are the printed tolerances applied to the printed value.
# Numbering: the bottom view labels row "1" and row "2" at the
# first column; the hole pattern (component side) shows "1" bottom-left,
# "2" above it and "End" at the far end of row 2, i.e. odd pins in
# one row, even pins in the other, pin 2 beside pin 1 -- the `header`
# generator's zig-zag (pin 1 top-left, pin 2 to its right after a
# 90 degree turn).
# No land pattern is given, only the recommended hole: the footprint pad
# is the hole plus the generator's annular-ring default. The housing has
# no pin-1 mark in the drawing.
# The hole pattern's values carry its "General tolerance ±0.05"
# (applied as min/max); where the outline views give a looser
# tolerance for the same pitch, the hole pattern's is recorded.
schema_version: "0.2"
kind: package
id: manufacturers/wurth/WR-PHD-PinHeader-2x05-P2.00
family: header
lead_count: 10

lead_layout:
  value: [2, 5]
  src:   'p1 ""Article Properties" Pins 10; "Recommended Hole Pattern: [mm]": 2 rows, labelled "1", "2" and "End""'

source: wurth/62001021121-DS

pitch:
  min: 1.95 mm
  typ: 2 mm
  max: 2.05 mm
  src: 'p1 ""Recommended Hole Pattern: [mm]", pitch "2" with "General tolerance ±0.05" ("Dimensions: [mm]" view above the front view (first-angle projection: the bottom view) gives "2 ±0.15")"'

geometry: { type: parametric, generator: header }

dimensions:
  body_width:
    min: 3.75 mm
    typ: 4 mm
    max: 4.25 mm
    src: 'p1 ""Dimensions: [mm]" view below the front view (first-angle projection: the top view), housing width "4 ±0.25""'
  body_length:
    min: 9.5 mm
    typ: 10 mm
    max: 10.5 mm
    src: 'p1 ""Dimensions: [mm]" front view, housing length "L ±0.5"; "Article Properties" Length L = 10 mm"'
  body_height:
    min: 1.8 mm
    typ: 2 mm
    max: 2.2 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing height "2 ±0.2""'
  tail_length:
    min: 2.45 mm
    typ: 2.7 mm
    max: 2.95 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing underside to tail end "2,7 ±0.25""'
  lead_width:
    min: 0.45 mm
    typ: 0.5 mm
    max: 0.55 mm
    src: 'p1 ""Dimensions: [mm]" view above the front view (first-angle projection: the bottom view), square pin "□ 0,5 ±0.05""'
  row_spacing:
    min: 1.95 mm
    typ: 2 mm
    max: 2.05 mm
    src: 'p1 ""Recommended Hole Pattern: [mm]", rows "2" apart with "General tolerance ±0.05" ("Dimensions: [mm]" view below the front view (first-angle projection: the top view) gives "2 ±0.15")"'
  hole_diameter:
    min: 0.75 mm
    typ: 0.8 mm
    max: 0.85 mm
    src: 'p1 ""Recommended Hole Pattern: [mm]", hole "Ø 0,8" with "Recommended P.C.B Layout General tolerance ±0.05""'
  mating_length:
    min: 3.75 mm
    typ: 4 mm
    max: 4.25 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing top to pin tip "4 ±0.25""'
