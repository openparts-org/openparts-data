# Würth WR-PHD socket header, 1 x 4, 2.54 mm pitch, straight THT
# (order code 61300411821), from the page-1 drawing of wurth/61300411821-DS (rev 002.001).
# min/max are the printed tolerances applied to the printed value.
# Pin 1 is labelled "1" at one end, the other end "End" (bottom
# view and hole pattern); pins run 1..N along the row.
# No land pattern is given, only the recommended hole: the footprint pad
# is the hole plus the generator's annular-ring default. The housing has
# no pin-1 mark in the drawing.
# lead_width is the contact width the bottom view dimensions (the solder
# tail seen from below); the tail's thickness is not given.
schema_version: "0.2"
kind: package
id: manufacturers/wurth/WR-PHD-Socket-1x04-P2.54
family: socket
lead_count: 4

lead_layout:
  value: [1, 4]
  src:   'p1 ""Article Properties" Pins 4; "Recommended Hole Pattern: [mm]": 1 row, labelled "1" and "End""'

source: wurth/61300411821-DS

pitch:
  min: 2.49 mm
  typ: 2.54 mm
  max: 2.59 mm
  src: 'p1 ""Dimensions: [mm]" view above the front view (first-angle projection: the bottom view), contact pitch "2,54 ±0,05"; "Recommended Hole Pattern: [mm]" "2,54 ±0,05""'

geometry: { type: parametric, generator: socket }

dimensions:
  body_width:
    min: 2.3 mm
    typ: 2.5 mm
    max: 2.7 mm
    src: 'p1 ""Dimensions: [mm]" view below the front view (first-angle projection: the top view), housing width "2,5 ±0,2""'
  body_length:
    min: 10.41 mm
    typ: 10.66 mm
    max: 10.91 mm
    src: 'p1 ""Dimensions: [mm]" front view, housing length "L ±0,25"; "Article Properties" Length L = 10.66 mm"'
  body_height:
    min: 8.35 mm
    typ: 8.5 mm
    max: 8.65 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing height "8,5 ±0,15""'
  tail_length:
    min: 2.8 mm
    typ: 3.1 mm
    max: 3.4 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing underside to tail end "3,1 ±0,3""'
  lead_width:
    min: 0.59 mm
    typ: 0.74 mm
    max: 0.89 mm
    src: 'p1 ""Dimensions: [mm]" view above the front view (first-angle projection: the bottom view), contact (solder tail) width "0,74 ±0,15""'
  hole_diameter:
    min: 0.87 mm
    typ: 1.02 mm
    max: 1.17 mm
    src: 'p1 ""Recommended Hole Pattern: [mm]", hole "Ø 1,02 ±0,15""'
