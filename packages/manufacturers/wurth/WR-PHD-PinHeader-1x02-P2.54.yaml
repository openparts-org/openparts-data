# Würth WR-PHD pin header, 1 x 2, 2.54 mm pitch, straight THT
# (order code 61300211121), from the page-1 drawing of wurth/61300211121-DS (rev 003.000).
# min/max are the printed tolerances applied to the printed value.
# Pin 1 is labelled "1" at one end, the other end "End" (bottom
# view and hole pattern); pins run 1..N along the row.
# No land pattern is given, only the recommended hole: the footprint pad
# is the hole plus the generator's annular-ring default. The housing has
# no pin-1 mark in the drawing.
# The housing height is not dimensioned for the single-row part (only
# the 11,54 ±0,2 pin length, post 6,0 and tail 3,0): body_height left
# out, never derived.
schema_version: "0.2"
kind: package
id: manufacturers/wurth/WR-PHD-PinHeader-1x02-P2.54
family: header
lead_count: 2

lead_layout:
  value: [1, 2]
  src:   'p1 ""Article Properties" Pins 2; "Recommended Hole Pattern: [mm]": 1 row, labelled "1" and "End""'

source: wurth/61300211121-DS

pitch:
  min: 2.49 mm
  typ: 2.54 mm
  max: 2.59 mm
  src: 'p1 ""Dimensions: [mm]" view above the front view (first-angle projection: the bottom view), pin pitch "2,54 ±0,05"; "Recommended Hole Pattern: [mm]" "2,54 ±0,05""'

geometry: { type: parametric, generator: header }

dimensions:
  body_width:
    min: 2.39 mm
    typ: 2.54 mm
    max: 2.69 mm
    src: 'p1 ""Dimensions: [mm]" view below the front view (first-angle projection: the top view), housing width "2,54 ±0,15""'
  body_length:
    min: 4.73 mm
    typ: 5.08 mm
    max: 5.43 mm
    src: 'p1 ""Dimensions: [mm]" front view, housing length "L ±0,35"; "Article Properties" Length L = 5.08 mm"'
  tail_length:
    min: 2.8 mm
    typ: 3 mm
    max: 3.2 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing underside to tail end "3,0 ±0,20""'
  mating_length:
    min: 5.8 mm
    typ: 6 mm
    max: 6.2 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing top to pin tip "6,0 ±0,20""'
  lead_width:
    min: 0.49 mm
    typ: 0.64 mm
    max: 0.79 mm
    src: 'p1 ""Dimensions: [mm]" view above the front view (first-angle projection: the bottom view), square pin "□ 0,64 ±0,15""'
  hole_diameter:
    min: 0.95 mm
    typ: 1.1 mm
    max: 1.25 mm
    src: 'p1 ""Recommended Hole Pattern: [mm]", hole "Ø 1,10 ±0,15""'
