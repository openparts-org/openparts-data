# Würth WR-PHD socket header, 2 x 10, 2.54 mm pitch, straight THT
# (order code 61302021821), from the page-1 drawing of wurth/61302021821-DS (rev 001.004).
# min/max are the printed tolerances applied to the printed value.
# Numbering: the bottom view labels row "1" and row "2" at the
# first column; the hole pattern (component side) shows "1" bottom-left,
# "2" above it and "End" at the far end of row 2, i.e. odd pins in
# one row, even pins in the other, pin 2 beside pin 1 -- the `header`
# generator's zig-zag (pin 1 top-left, pin 2 to its right after a
# 90 degree turn).
# No land pattern is given, only the recommended hole: the footprint pad
# is the hole plus the generator's annular-ring default. The housing has
# no pin-1 mark in the drawing.
# lead_width is the contact width the bottom view dimensions (the solder
# tail seen from below); the tail's thickness is not given.
schema_version: "0.2"
kind: package
id: manufacturers/wurth/WR-PHD-Socket-2x10-P2.54
family: socket
lead_count: 20

lead_layout:
  value: [2, 10]
  src:   'p1 ""Article Properties" Pins 20; "Recommended Hole Pattern: [mm]": 2 rows, labelled "1", "2" and "End""'

source: wurth/61302021821-DS

pitch:
  min: 2.49 mm
  typ: 2.54 mm
  max: 2.59 mm
  src: 'p1 ""Dimensions: [mm]" view above the front view (first-angle projection: the bottom view), contact pitch "2,54 ±0,05" ("Recommended Hole Pattern: [mm]" gives "2,54 ±0,15")"'

geometry: { type: parametric, generator: socket }

dimensions:
  body_width:
    min: 4.93 mm
    typ: 5.08 mm
    max: 5.23 mm
    src: 'p1 ""Dimensions: [mm]" view below the front view (first-angle projection: the top view), housing width "5,08 ±0,15""'
  body_length:
    min: 25.6 mm
    typ: 25.9 mm
    max: 26.2 mm
    src: 'p1 ""Dimensions: [mm]" front view, housing length "L ±0,3"; "Article Properties" Length L = 25.9 mm"'
  body_height:
    min: 8.3 mm
    typ: 8.5 mm
    max: 8.7 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing height "8,5 ±0,2""'
  tail_length:
    min: 2.9 mm
    typ: 3.1 mm
    max: 3.3 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing underside to tail end "3,1 ±0,2""'
  lead_width:
    min: 0.69 mm
    typ: 0.74 mm
    max: 0.79 mm
    src: 'p1 ""Dimensions: [mm]" view above the front view (first-angle projection: the bottom view), contact (solder tail) width "0,74 ±0,05""'
  row_spacing:
    min: 2.39 mm
    typ: 2.54 mm
    max: 2.69 mm
    src: 'p1 ""Dimensions: [mm]" view below the front view (first-angle projection: the top view), row to row "2,54 ±0,15"; "Recommended Hole Pattern: [mm]", rows "2,54 ±0,15" apart"'
  hole_diameter:
    min: 0.87 mm
    typ: 1.02 mm
    max: 1.17 mm
    src: 'p1 ""Recommended Hole Pattern: [mm]", hole "Ø 1,02 ±0,15""'
