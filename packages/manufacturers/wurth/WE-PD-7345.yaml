# Würth WE-PD 7345 shielded power inductor outline, from the page-1
# "Dimensions: [mm]" drawing of 744777910 (rendered at 200 dpi). The
# 7447779002/004/122/133/147 datasheets print the same dimension set
# (pdftotext of page 1 compared). Square body 7.3 ±0.3 x 7.3 ±0.3 with
# chamfered corners (drawn as a box), height 4.5 max. Bottom view: two
# terminals on opposite edges, 1.5 ±0.3 wide and 1.5 ±0.2 deep, 4 ±0.3
# apart (inner edges; the gap is not a modelled key). The drawing's
# terminal axis is vertical; here it is the generator's X axis (body is
# square). pads: "Recommended Land Pattern": pads 1.7 wide x 2.0 deep,
# 4.0 apart -> centres x = +-(4.0/2 + 2.0/2) = +-3.0.
