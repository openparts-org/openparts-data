# Würth WL-SMCW 0603 chip LED outline ("SIZE/TYPE 0603" in the title
# block). Read from the page-1 "Dimensions: [mm]" drawing of 150060RS75000,
# rendered at 200 dpi; the drawings of 150060GS75000, 150060BS75000, 150060YS75000 carry the identical
# numbers (checked in each document's text layer), so each is cited.
# Dimensions are printed as nominal +/- tolerance; min/max below are
# that printed tolerance applied (e.g. "1,6 ±0,1").
# The bottom view's "0,7 ±0,1" is the gap between the two
# terminals and "0,3 ±0,1" the substrate thickness; neither is a
# modelled dimension, and no terminal length is dimensioned, so
# lead_length is left out (not derived by subtraction).
schema_version: "0.2"
kind: package
id: manufacturers/wurth/CHIP0603-WL-SMCW
family: chip
lead_count: 2
source: wurth/150060BS75000-DS

pitch: { unit: mm }
geometry: { type: parametric, generator: chip }

dimensions:
  body_width:
    min: 0.7 mm
    typ: 0.8 mm
    max: 0.9 mm
    src:
      - 'wurth/150060RS75000-DS p1 ""Dimensions: [mm]" view with the "Polarity Mark" label, width "0,8 ±0,1""'
      - 'wurth/150060GS75000-DS p1 ""Dimensions: [mm]" view with the "Polarity Mark" label, width "0,8 ±0,1""'
      - 'p1 ""Dimensions: [mm]" view with the "Polarity Mark" label, width "0,8 ±0,1""'
      - 'wurth/150060YS75000-DS p1 ""Dimensions: [mm]" view with the "Polarity Mark" label, width "0,8 ±0,1""'
  body_length:
    min: 1.5 mm
    typ: 1.6 mm
    max: 1.7 mm
    src:
      - 'wurth/150060RS75000-DS p1 ""Dimensions: [mm]" side view, length "1,6 ±0,1""'
      - 'wurth/150060GS75000-DS p1 ""Dimensions: [mm]" side view, length "1,6 ±0,1""'
      - 'p1 ""Dimensions: [mm]" side view, length "1,6 ±0,1""'
      - 'wurth/150060YS75000-DS p1 ""Dimensions: [mm]" side view, length "1,6 ±0,1""'
  body_height:
    min: 0.6 mm
    typ: 0.7 mm
    max: 0.8 mm
    src:
      - 'wurth/150060RS75000-DS p1 ""Dimensions: [mm]" end view, overall height "0,7 ±0,1""'
      - 'wurth/150060GS75000-DS p1 ""Dimensions: [mm]" end view, overall height "0,7 ±0,1""'
      - 'p1 ""Dimensions: [mm]" end view, overall height "0,7 ±0,1""'
      - 'wurth/150060YS75000-DS p1 ""Dimensions: [mm]" end view, overall height "0,7 ±0,1""'
