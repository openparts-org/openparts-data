# Würth WR-PHD angled (right-angle) pin header, 1 x 4, 2.54 mm pitch,
# THT (order code 61300411021), from the page-1 drawing of wurth/61300411021-DS (rev 003.000).
# min/max are the printed tolerances applied to the printed value.
# Frame: the recommended hole pattern (component side, = the top view)
# has pin "1" at the right end and the housing outline below the holes;
# turned 90 degrees counter-clockwise (pin 1 to the top, pins numbered
# down the row) the housing lies towards +X. The side view puts the
# housing's back face "1,5 ±0,2" from the tails' centre line and the
# top view gives the housing "2,54 ±0,15" deep along the pins: its
# centre lies 1.5 + 2.54 / 2 = 2.77 towards +X (body_offset, nominal
# only). The housing lies on the board (side view: the tail's "3,0 ±0,2"
# is measured from the housing underside); the height of the bent posts
# is not dimensioned (the generator draws them at mid-housing).
# No land pattern is given, only the recommended hole: the footprint pad
# is the hole plus the generator's annular-ring default. The housing has
# no pin-1 mark in the drawing. Insulator black PA6T, contacts gold
# plated (page 1 "Material Properties").
