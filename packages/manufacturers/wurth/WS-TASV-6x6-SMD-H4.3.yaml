# Würth WS-TASV SMT tact switch 6 x 6 mm, H 4.3 mm (order codes
# 430182043816, 430152043826, 430152043836), read from the page-1
# drawing of wurth/430182043816-DS (rev 002.002, 2020-06-04). The same
# generic drawing (text-identical) is in the other two datasheets; they
# differ only in force and actuator colour.
# Orientation: the drawing already shows the terminals exiting left and
# right with the 4,5 pitch along Y -- no rotation. First-angle projection:
# the view above the front view is the bottom view (numbers 3 1 / 4 2),
# the Recommended Land Pattern is the component side (1 3 / 2 4).
# Values as printed; ± tolerances become min/max. Untoleranced values
# (□ 6,2, 9,0, 0,7, 4,5) are nominal only (general tolerance DIN ISO
# 2768-1m not expanded).
# Left out: lead_length (the foot length is not dimensioned -- the
# generator's pad is then housing edge to toe), standoff (the "0,15"
# front-view dimension is not clearly a standoff), lead_thickness.
# The recommended land pattern (pads 1,3 x 1,55, 6,4 / 9,5 across) is
# not representable in this family: the footprint pads are the terminal
# feet, not the recommended lands.
schema_version: "0.2"
kind: package
id: manufacturers/wurth/WS-TASV-6x6-SMD-H4.3
family: tact_switch_smd
lead_count: 4
source: wurth/430182043816-DS

pitch:
  typ: 4.5 mm
  src: p1 "Dimensions [mm] bottom view, terminal pitch; Recommended Land Pattern [mm], pad pitch"

pad_order:
  value: ["1", "2", "4", "3"]
  src:   p1 "Recommended Land Pattern [mm] (component side), pad numbering (see header)"

geometry: { type: parametric, generator: tact_switch_smd }

dimensions:
  body_width:
    typ: 6.2 mm
    src: p1 "Dimensions [mm] top view, housing square (no tolerance printed)"
  body_length:
    typ: 6.2 mm
    src: 'p1 ""Dimensions: [mm]" lowest view (top view), housing "□ 6,2" (square)"'
  body_height:
    min: 3.15 mm
    typ: 3.3 mm
    max: 3.45 mm
    src: 'p1 ""Dimensions: [mm]" side view, seating plane to housing (cover) top "3,3 ± 0,15""'
  actuator_diameter:
    min: 3.3 mm
    typ: 3.5 mm
    max: 3.7 mm
    src: p1 "Dimensions [mm] front view, actuator ØD; Dimensions table, Diameter ØD"
  overall_width:
    typ: 9 mm
    src: 'p1 ""Dimensions: [mm]" upper view (bottom view), terminal toe to toe "9,0""'
  overall_height:
    min: 4.15 mm
    typ: 4.3 mm
    max: 4.45 mm
    src: 'p1 ""Dimensions: [mm]" side view, seating plane to actuator top "H ± 0,15"; "Dimensions" table "Height H 4.3 mm""'
  lead_width:
    typ: 0.7 mm
    src: 'p1 ""Dimensions: [mm]" upper view (bottom view), terminal width "0,7""'
