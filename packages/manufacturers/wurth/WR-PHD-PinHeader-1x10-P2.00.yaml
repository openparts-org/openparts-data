# Würth WR-PHD pin header, 1 x 10, 2.00 mm pitch, straight THT
# (order code 62001011121), from the page-1 drawing of wurth/62001011121-DS (rev 003.001).
# min/max are the printed tolerances applied to the printed value.
# Pin 1 is labelled "1" at one end, the other end "End" (bottom
# view and hole pattern); pins run 1..N along the row.
# No land pattern is given, only the recommended hole: the footprint pad
# is the hole plus the generator's annular-ring default. The housing has
# no pin-1 mark in the drawing.
# The hole pattern's values carry its "General tolerance ±0.05"
# (applied as min/max); where the outline views give a looser
# tolerance for the same pitch, the hole pattern's is recorded.
schema_version: "0.2"
kind: package
id: manufacturers/wurth/WR-PHD-PinHeader-1x10-P2.00
family: header
lead_count: 10

lead_layout:
  value: [1, 10]
  src:   'p1 ""Article Properties" Pins 10; "Recommended Hole Pattern: [mm]": 1 row, labelled "1" and "End""'

source: wurth/62001011121-DS

pitch:
  min: 1.95 mm
  typ: 2 mm
  max: 2.05 mm
  src: p1 "Recommended Hole Pattern [mm], pitch, general tolerance (drawing gives ±0.2)"

geometry: { type: parametric, generator: header }

dimensions:
  body_width:
    min: 1.8 mm
    typ: 2 mm
    max: 2.2 mm
    src: 'p1 ""Dimensions: [mm]" view below the front view (first-angle projection: the top view), housing width "2 ±0.2""'
  body_length:
    min: 19.6 mm
    typ: 20 mm
    max: 20.4 mm
    src: 'p1 ""Dimensions: [mm]" front view, housing length "L ±0.4"; "Article Properties" Length L = 20 mm"'
  body_height:
    min: 1.75 mm
    typ: 2 mm
    max: 2.25 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing height "2 ±0.25""'
  tail_length:
    min: 2.4 mm
    typ: 2.7 mm
    max: 3 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing underside to tail end "2,7 ±0.3""'
  lead_width:
    min: 0.45 mm
    typ: 0.5 mm
    max: 0.55 mm
    src: 'p1 ""Dimensions: [mm]" view above the front view (first-angle projection: the bottom view), square pin "□ 0,5 ±0.05""'
  hole_diameter:
    min: 0.85 mm
    typ: 0.9 mm
    max: 0.95 mm
    src: 'p1 ""Recommended Hole Pattern: [mm]", hole "Ø 0,90" with "Recommended P.C.B Layout General tolerance ±0.05""'
  mating_length:
    min: 3.7 mm
    typ: 4 mm
    max: 4.3 mm
    src: 'p1 ""Dimensions: [mm]" side view (right of the front view), housing top to pin tip "4 ±0.3""'
