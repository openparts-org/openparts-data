# Maxim 16-lead thin QFN 3x3x0.75 mm, package code T1633+4, outline
# 21-0136 rev O, as printed in the MAX98357A/B datasheet (19-6779 Rev
# 16) pages 36-37 (rendered and read as images). Column "16L 3x3" of the
# dimension table: A 0.70/0.75/0.80, b 0.20/0.25/0.30, D = E
# 2.90/3.00/3.10, e 0.50 BSC, L 0.30/0.40/0.50, A1 0/0.02/0.05; exposed
# pad row T1633-4: D2 = E2 0.95/1.10/1.25. A2 "0.20 REF" (terminal
# thickness) not recorded. Pin 1 per JESD95-1 SPP-012 (note 4),
# numbering counter-clockwise seen from the top.
