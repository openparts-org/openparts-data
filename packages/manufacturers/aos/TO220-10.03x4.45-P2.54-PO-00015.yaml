# Alpha & Omega "TO220 PACKAGE OUTLINE", Document No. PO-00015 Version N,
# read from 150-400 dpi renders of the drawing and its DIM. IN MM table
# (MIN / NOM / MAX). The drawing prints no pin numbers; the datasheets'
# Top View images give the lead order G D S (see the devices), which
# this frame numbers 1 2 3 left to right (front view, leads down).
#
# Mapping (frame to220): E (9.660/10.030/10.540, TOP VIEW across the
# body) -> body_width; A (4.300/4.450/4.770, SIDE VIEW body front to
# tab back) -> body_length; D1 (8.500/9.140/9.650, SIDE VIEW molded
# body height from its underside) -> body_height; D (14.500/15.440/
# 15.800, TOP VIEW tab top to body underside) -> overall_height; b
# (0.690/0.810/0.960) -> lead_width; c (0.300/0.380/0.600) ->
# lead_thickness; L (12.270/12.820/14.270, body underside "C" to lead
# tip) -> tail_length; OP (3.500/3.840/3.990) -> mounting_hole_diameter;
# Q (2.540/2.740/2.940, SIDE VIEW tab top to hole centre line) ->
# mounting_hole_inset; e "2.54BSC" -> pitch.
# hole_diameter: "RECOMMENDATION OF HOLE PATTERN" prints "3X R0.52"
# (hole radius) -> 2 x 0.52 = 1.04 mm drill (arithmetic on one printed
# value).
# body_offset (body centre behind the lead row, toward the tab), from
# printed nominals: A2 2.670 runs from the tab back face to the lead's
# tab-side face (SIDE VIEW arrows), so the lead centre is A2 + c/2 =
# 2.670 + 0.190 = 2.860 from the back and the body centre A/2 = 2.225;
# offset = 2.860 - 2.225 = 0.635 (nominal only; flagged for review).
# Left out: A1 (tab thickness 1.150-1.420), b2 (lead shoulder), D2/E1/
# H1 (back-side tab outline), L1/L2/Q1 and the "Ref." detail values.
