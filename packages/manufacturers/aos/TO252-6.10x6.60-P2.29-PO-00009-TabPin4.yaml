# L 1.270-2.032 vs 1.40-1.78, A1 max 0.200 vs 0.13, ...): its own package.
#
# TAB NUMBER: the top view numbers the leads 1 2 3 and the bottom view
# (Detail B) numbers the tab "4"; lead 2 is drawn as a stub cut at the
# body in both views -> trimmed. Tab = "4" (the only number the source
# prints for it).
#
# Symbol mapping (frame: leads left, tab right): D (5.969/6.096/6.223,
# tab-side body edge to lead-side edge) -> body_width; E (6.350/6.604/
# 6.800, along the lead row) -> body_length; H (9.398/10.033/10.500,
# lead toe to tab end) -> overall_width; L3 (0.889/1.016/1.270, body to
# tab end) -> tab_length; b2 (4.953/5.340/5.500, the tab in the top
# view) -> tab_width; b -> lead_width; c -> lead_thickness; L (1.270/
# 1.520/2.032, note 2 "measured in gauge plane") -> lead_length; A1 ->
# standoff; A (2.184/2.286/2.400) -> overall_height. e "2.286 BSC" ->
# pitch. Left out: A2 (0.889-1.170, dimensioned at the tab's top in the
# side view -- not the body thickness, so neither body_height nor A2 is
# recorded), b1 (lead shoulder), c1 (tab thickness), D1/E1 (exposed
# pad on the underside), L1 "2.921 REF.", L2, L4, e1 (= 2 x e).
