# Alpha & Omega "TO263(D2PAK) PACKAGE OUTLINE", Document No. PO-00005
# Version N (note 5 "REFER TO JEDEC TO-263 AB"), read from renders of
# the drawing (top view zoomed at 400-500 dpi) and the DIMENSIONS IN
# MILLIMETERS table (MIN / NOM / MAX, also extractable as text).
#
# TAB / LEAD NUMBERS (flagged for review): the drawing prints no pin or
# tab numbers. The top view shows three lead positions at "2Xe" with
# the centre one drawn as a stub cut at the body (bottom view the
# same) -> lead_count 3, trimmed_leads ["2"]. Tab number "4" follows
# the generator / JEDEC convention (as AOS's own TO252 PO-00009, which
# does print "4"), not a number in this drawing.
#
# Mapping (frame d2pak: leads left, tab right): D (8.382/9.14/9.652,
# top view body length along the leads) -> body_width; E (9.652/10.03/
# 10.668, across) -> body_length; H (14.605/15.24/15.875, side view
# lead toe to tab end) -> overall_width; A (4.064/4.45/4.826) ->
# overall_height; A1 (0.00/---/0.254) -> standoff; b (0.508/0.81/0.991)
# -> lead_width; L (1.778/2.54/2.794, note 3 "measured in gauge line")
# -> lead_length; c (0.381/0.50/0.737) -> lead_thickness; L1 (1.02/
# 1.27/1.676, top view tab end to body edge) -> tab_length; e "2.54
# BSC" -> pitch.
# tab_width (flagged): E1 (6.223/8.00/8.37), the bottom view's exposed
# tab width, is recorded as the soldered tab width; the tab end in the
# top view itself runs the full chamfered body width E.
# Left out: A2 (2.20-2.90, side-view dimension not the body thickness,
# as in AOS PO-00009), b2 (lead shoulder), c2 (tab thickness), D1 (exposed
# tab length), L2, L3 "0.25 BSC" (gauge plane), and the "RECOMMENDED
# LAND PATTERN" (generator lands are used).
