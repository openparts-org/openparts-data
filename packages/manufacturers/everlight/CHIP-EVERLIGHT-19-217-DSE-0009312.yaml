# Everlight 19-217 SMD reflector LED package as drawn on p6 "Package Outline
# Dimensions" of everlight/DSE-0009312 (19-217/BHC-ZL1M2RY/3T; raster, 150
# dpi render). Not manufacturers/everlight/CHIP-EVERLIGHT-19-217: this
# drawing prints 1.6 / 0.8 without own tolerance, 0.4+-0.05 height and the
# terminal size. Body min/max apply the drawing note "Tolerances unless
# mentioned +-0.1mm". Terminals (bottom view) 0.4 along the length, 0.7
# across (typ only).
# pads ("Recommend Soldering Pad"): 0.8 x 0.8; 1.5 is dimensioned between pad
# CENTRES (checked on the render): x = +-0.75. Pad 1 = anode (+).
