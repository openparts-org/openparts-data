# 40-lead 600 mil plastic DIP. Values from Microchip drawing C04-016B
# ("40-Lead Plastic Dual In-Line (P) - 600 mil Body [PDIP]"), DS40002147E
# (PIC18F27/47/57Q43) page 937, table read as text (inches; values below
# are exact x25.4 conversions of the printed MIN/MAX -- this edition of
# the drawing prints no NOM column for most rows, so no typ is written).
# body_width (the `dip` generator's row spacing) = 15.24 mm, the "600
# mil Body" of the drawing title (the table has E .590/.625 and eB max
# .700, no eA row) -- same reading as the 300 mil Microchip DIP packages.
# body_length = D, body_height = A2, overall_height = A (max only),
# standoff = A1 (min only). L (tip to seating plane) is not lead_length.
schema_version: "0.2"
kind: package
id: manufacturers/microchip/PDIP40-P-C04-016B
family: dip
lead_count: 40
source: microchip/DS40002147@revE

pitch: { typ: 2.54 mm, src: 'p937 "C04-016B table (inches), "Pitch e .100 BSC" -> 2.54 mm"' }
geometry: { type: parametric, generator: dip }

dimensions:
  body_width:
    typ: 15.24 mm
    src: p937 "C04-016B title "40-Lead Plastic Dual In-Line (P) - 600 mil Body [PDIP]" -> 15.24 mm row spacing"
  body_length:
    min: 50.292 mm
    max: 53.213 mm
    src: p937 "C04-016B table (inches), "Overall Length D 1.980 / - / 2.095""
  body_height:
    min: 3.175 mm
    max: 4.953 mm
    src: p937 "C04-016B table (inches), "Molded Package Thickness A2 .125 / - / .195""
  lead_thickness:
    min: 0.2032 mm
    max: 0.381 mm
    src: p937 "C04-016B table (inches), "Lead Thickness c .008 / - / .015""
  overall_height:
    max: 6.35 mm
    src: p937 "C04-016B table (inches), "Top to Seating Plane A" (MAX .250 only)"
  standoff:
    min: 0.381 mm
    src: p937 "C04-016B table (inches), "Base to Seating Plane A1" (MIN .015 only)"
  lead_width:
    min: 0.3556 mm
    max: 0.5842 mm
    src: p937 "C04-016B table (inches), "Lower Lead Width b .014 / - / .023""
