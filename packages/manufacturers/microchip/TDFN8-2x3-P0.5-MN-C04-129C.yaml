# 8-lead TDFN, 2x3 mm, 0.75 mm thick, 0.5 mm pitch, exposed pad:
# Microchip drawing C04-129C "8-Lead Plastic Dual Flat, No Lead Package
# (MN) - 2x3x0.75mm Body [TDFN]", sheet 1 (DS20001203W page 30, views)
# and sheet 2 (page 31, dimension table), both rendered and read as
# images. The older revision C04-129B in DS21709J page 24 was rendered
# and compared row by row: every value is identical (numbers compared,
# not revision letters).
#
# Frame: D (2.00, along the terminal rows) = body_length (Y), E (3.00,
# across the rows) = body_width (X); exposed pad E2 = width (X), D2 =
# length (Y). body_height = A. lead_thickness = A3 "0.20 REF"
# (reference value). E2/D2 have min/max only. K (min 0.20) not
# modelled.
schema_version: "0.2"
kind: package
id: manufacturers/microchip/TDFN8-2x3-P0.5-MN-C04-129C
family: dfn
lead_count: { value: 8, src: 'p31 "drawing C04-129C sheet 2 table, "Number of Pins N 8""' }
source: microchip/DS20001203@revW

pitch: { typ: 0.5 mm, src: 'p31 "drawing C04-129C sheet 2 table, "Pitch e 0.50 BSC""' }
geometry: { type: parametric, generator: dfn }

dimensions:
  body_width:
    typ: 3 mm
    src: p31 "drawing C04-129C sheet 2 table, "Overall Width E 3.00 BSC" (across the rows, sheet 1 top view on page 30)"
  body_length:
    typ: 2 mm
    src: p31 "drawing C04-129C sheet 2 table, "Overall Length D 2.00 BSC""
  body_height:
    min: 0.7 mm
    typ: 0.75 mm
    max: 0.8 mm
    src: p31 "drawing C04-129C sheet 2 table, "Overall Height A 0.70 / 0.75 / 0.80""
  exposed_pad:
    src:    p31 "drawing C04-129C sheet 2 table, "Exposed Pad Width E2 1.20 / - / 1.60" and "Exposed Pad Length D2 1.20 / - / 1.60""
    width:  { min: 1.2 mm, max: 1.6 mm }
    length: { min: 1.2 mm, max: 1.6 mm }
  standoff:
    min: 0 mm
    typ: 0.02 mm
    max: 0.05 mm
    src: p31 "drawing C04-129C sheet 2 table, "Standoff A1 0.00 / 0.02 / 0.05""
  lead_width:
    min: 0.2 mm
    typ: 0.25 mm
    max: 0.3 mm
    src: p31 "drawing C04-129C sheet 2 table, "Contact Width b 0.20 / 0.25 / 0.30""
  lead_length:
    min: 0.25 mm
    typ: 0.3 mm
    max: 0.45 mm
    src: p31 "drawing C04-129C sheet 2 table, "Contact Length L 0.25 / 0.30 / 0.45""
  lead_thickness:
    typ: 0.2 mm
    src: p31 "drawing C04-129C sheet 2 table, "Contact Thickness A3 0.20 REF" (reference value)"
