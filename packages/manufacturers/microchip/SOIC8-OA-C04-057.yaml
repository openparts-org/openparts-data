# 8-lead narrow SOIC (Microchip package code OA), drawing "C04-057" (no
# revision letter printed), "8-Lead Plastic Small Outline (OA) - Narrow,
# 150 mil (SOIC)", DS21419D page 16 (rendered and read; the table also
# extracts as text). The drawing's controlling unit is inches ("*
# Controlling Parameter" on INCHES); the table also prints a MILLIMETERS
# column, and those printed millimetre values are recorded here as
# printed (no conversion). JEDEC equivalent MS-012 per its notes.
#
# Not standards/SOIC8-3.90x4.90-P1.27 (C04-057-SN Rev D, BSC body
# values): this older revision prints MIN/NOM/MAX ranges (E1
# 3.71/3.91/3.99, D 4.80/4.90/5.00, c 0.20/0.23/0.25, ...), so it is a
# separate package. body_width = E1 (molded width), body_length = D,
# body_height = A2, overall_width = E, overall_height = A, standoff =
# A1, lead_length = L (foot length), lead_width = B, lead_thickness = c.
# Chamfer h and the angles are not modelled.
