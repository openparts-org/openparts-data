# 20-lead MQFN (also called VQFN; Microchip package code MX/NU),
# 5x5x1.0 mm, 0.65 mm pitch, 3.25 mm exposed pad: drawing C04-186B,
# DS20005426G (MCP960x) pages 49-50 (dimension table, text) and its
# recommended land pattern on page 51 (table, text).
# body_height = A (no A2 given). lead_thickness = A3 "0.20 REF" -- a
# reference value. K (min 0.20) and the land pattern's thermal vias (V
# 0.30, EV 1.00) are not modelled. Pin 1 top of the left edge, counter-
# clockwise (Package Types, page 2: 1-5 down the left edge, 6-10 along
# the bottom, 16-20 right to left along the top).
#
# pads: land pattern in the qfn frame (top view, X right, Y up, origin at
# the centre). Contact pad spacing C1 = C2 = 4.50 -> rows at +-2.25;
# pitch E 0.65, 5 pads per side -> centres at 0, +-0.65, +-1.30; pad X1
# 0.40 (max) across the pitch, Y1 0.55 (max) along the terminal. The
# optional centre pad X2/Y2 3.35 x 3.35 (max) is pad EP (Table 3-1 pin
# 21, "must be connected to GND").
