# 8-lead DFN, 2x3 mm, 0.5 mm pitch, exposed pad: Microchip drawing
# C04-123C "8-Lead Plastic Dual Flat, No Lead Package (MC) - 2x3x0.9 mm
# Body [DFN]", read from DS20001984H page 20 (rendered image; the page
# text is an encoded font). The same drawing number in DS21709J page 22
# and DS20002234D page 24 was rendered too and compared row by row:
# every value is identical.
#
# Frame: the drawing's D (2.00, along the terminal rows) is
# body_length (Y) and E (3.00, across the two rows) is body_width (X);
# the exposed pad's E2 (across the rows) is its width (X) and D2 (along
# the rows) its length (Y). Pin numbering from the top view: 1..4 along
# one long edge, 5..8 back along the other (pin 1 top-left after
# turning the rows vertical, SOIC order).
# body_height = A (no A2 given). lead_thickness = A3 "0.20 REF", a
# reference value (the drawing defines REF). E2/D2 have min/max only (no
# nominal printed) and are recorded as such. K (contact-to-exposed pad,
# min 0.20) is not modelled.
