# 8-lead DFN, 2x3 mm, 0.5 mm pitch, exposed pad: Microchip drawing
# C04-123C "8-Lead Plastic Dual Flat, No Lead Package (MC) - 2x3x0.9 mm
# Body [DFN]", read from DS20001984H page 20 (rendered image; the page
# text is an encoded font). The same drawing number in DS21709J page 22
# and DS20002234D page 24 was rendered too and compared row by row:
# every value is identical.
#
# Frame: the drawing's D (2.00, along the terminal rows) is
# body_length (Y) and E (3.00, across the two rows) is body_width (X);
# the exposed pad's E2 (across the rows) is its width (X) and D2 (along
# the rows) its length (Y). Pin numbering from the top view: 1..4 along
# one long edge, 5..8 back along the other (pin 1 top-left after
# turning the rows vertical, SOIC order).
# body_height = A (no A2 given). lead_thickness = A3 "0.20 REF", a
# reference value (the drawing defines REF). E2/D2 have min/max only (no
# nominal printed) and are recorded as such. K (contact-to-exposed pad,
# min 0.20) is not modelled.
schema_version: "0.2"
kind: package
id: manufacturers/microchip/DFN8-2x3-P0.5-MC-C04-123C
family: dfn
lead_count: { value: 8, src: 'p20 "drawing C04-123C table, "Number of Pins N 8""' }
source: microchip/DS20001984@revH

pitch: { typ: 0.5 mm, src: 'p20 "drawing C04-123C table, "Pitch e 0.50 BSC""' }
geometry: { type: parametric, generator: dfn }

dimensions:
  body_width:
    typ: 3 mm
    src: p20 "drawing C04-123C table, "Overall Width E 3.00 BSC" (across the terminal rows, top view)"
  body_length:
    typ: 2 mm
    src: p20 "drawing C04-123C table, "Overall Length D 2.00 BSC" (along the terminal rows, top view)"
  body_height:
    min: 0.8 mm
    typ: 0.9 mm
    max: 1 mm
    src: p20 "drawing C04-123C table, "Overall Height A 0.80 / 0.90 / 1.00""
  exposed_pad:
    src:    p20 "C04-123C table, E2 (width, across rows), D2 (length, along rows)"
    width:  { min: 1.5 mm, max: 1.75 mm }
    length: { min: 1.3 mm, max: 1.55 mm }
  standoff:
    min: 0 mm
    typ: 0.02 mm
    max: 0.05 mm
    src: p20 "drawing C04-123C table, "Standoff A1 0.00 / 0.02 / 0.05""
  lead_width:
    min: 0.2 mm
    typ: 0.25 mm
    max: 0.3 mm
    src: p20 "drawing C04-123C table, "Contact Width b 0.20 / 0.25 / 0.30""
  lead_length:
    min: 0.3 mm
    typ: 0.4 mm
    max: 0.5 mm
    src: p20 "drawing C04-123C table, "Contact Length L 0.30 / 0.40 / 0.50""
  lead_thickness:
    typ: 0.2 mm
    src: p20 "drawing C04-123C table, "Contact Thickness A3 0.20 REF" (reference value)"
