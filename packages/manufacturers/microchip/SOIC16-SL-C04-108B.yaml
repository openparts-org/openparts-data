# Small Outline (SL) - Narrow, 3.90 mm Body [SOIC]"), dimension table on
# PDF page 32 of DS21298E (MCP3204/3208), rendered and read as an image
# (encoded font).
#
# Copied as printed: BSC values as nominal; min/max-only rows as
# min/max only. body_height is A2 (MIN 1.25 only); overall_height is A
# (MAX 1.75 only). Chamfer h 0.25-0.50, L1 1.04 REF and angles not
# modelled. Not manufacturers/microchip/SOIC16-SL-C04-108C: every row
# matches except lead thickness c (this Rev B table 0.17-0.25, the Rev
# C table 0.10-0.25), so a separate package.
