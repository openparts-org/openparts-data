# 8-lead 300 mil plastic DIP, Microchip drawing C04-018D ("8-Lead
# Plastic Dual In-Line (PA) - 300 mil Body [PDIP]"), sheet 2 dimension
# table on DS20001423J page 17, rendered and read as an image. Inches;
# values below are exact x25.4 conversions of the printed MIN/NOM/MAX.
#
# Not standards/DIP8-W7.62-P2.54 (Atmel 8P3): that drawing has
# D .355/.365/.400, this one D .348/.365/.400 -- so a separate package.
# body_width (the `dip` generator's ROW SPACING) = 7.62 mm: the table
# has no eA row (only E shoulder-to-shoulder .290/.310/.325 and eB max
# .430); 7.62 is the "300 mil" of the drawing title and of the ordering
# legend "PA = Plastic DIP (300 mil Body), 8-lead" (page 23) -- same
# reading as manufacturers/microchip/PDIP16-P-C04-017B. Flagged for
# review. E1 (.240/.250/.280) is not modelled; L (tip to seating plane)
# is not the gull-wing foot `lead_length` means and is left out.
schema_version: "0.2"
kind: package
id: manufacturers/microchip/PDIP8-PA-C04-018D
family: dip
lead_count: 8
source: microchip/DS20001423@revJ

pitch: { typ: 2.54 mm, src: 'p17 "C04-018D table (inches), "Pitch e .100 BSC" -> 2.54 mm"' }
geometry: { type: parametric, generator: dip }

dimensions:
  body_width:
    typ: 7.62 mm
    src:
      - p17 "C04-018D title "8-Lead Plastic Dual In-Line (PA) - 300 mil Body [PDIP]" -> 7.62 mm row spacing (the table has no eA row)"
      - p23 "Product Identification System, "PA = Plastic DIP (300 mil Body), 8-lead""
  body_length:
    min: 8.8392 mm
    typ: 9.271 mm
    max: 10.16 mm
    src: p17 "C04-018D table (inches), "Overall Length D .348 / .365 / .400""
  body_height:
    min: 2.921 mm
    typ: 3.302 mm
    max: 4.953 mm
    src: p17 "C04-018D table (inches), "Molded Package Thickness A2 .115 / .130 / .195""
  lead_thickness:
    min: 0.2032 mm
    typ: 0.254 mm
    max: 0.381 mm
    src: p17 "C04-018D table (inches), "Lead Thickness c .008 / .010 / .015""
  overall_height:
    max: 5.334 mm
    src: p17 "C04-018D table (inches), "Top to Seating Plane A" (MAX .210 only)"
  standoff:
    min: 0.381 mm
    src: p17 "C04-018D table (inches), "Base to Seating Plane A1" (MIN .015 only)"
  lead_width:
    min: 0.3556 mm
    typ: 0.4572 mm
    max: 0.5588 mm
    src: p17 "C04-018D table (inches), "Lower Lead Width b .014 / .018 / .022""
