# 64-pin VQFN, 9 x 9 x 1 mm, 0.5 mm pitch, 4.7 mm exposed pad: Atmel
# drawing "PA" revision A (05/27/2011, GPC ZST; "PA, 64 Leads, 0.50 mm
# pitch, 9 x 9 x 1 mm Very Thin Quad Flat No Lead Package (VQFN) Sawn"),
# printed in DS60001507N section 59.3.4 "64-Pin VQFN" (PDF page 1949,
# image, rendered and read). A (0.80 min / 1.00 max, no NOM) is the only
# height: recorded as body_height min/max. J = standoff. The table gives
# no terminal thickness. The page note says the exposed pad is not
# connected inside the device (recommended to ground on the PCB).
