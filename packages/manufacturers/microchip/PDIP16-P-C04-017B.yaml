# 16-lead 300 mil plastic DIP. Values from Microchip drawing C04-017B
# ("16-Lead Plastic Dual In-Line (P) - 300 mil Body [PDIP]"), PDF page
# 34 of DS20001295E (MCP3004/3008), rendered and read as an image
# (encoded font). The table is in inches; values below are exact x25.4
# conversions of the printed MIN/NOM/MAX, nothing else.
#
# body_width (the `dip` generator's ROW SPACING) = 7.62 mm: this drawing
# has no eA row-spacing row (only E shoulder-to-shoulder .290/.310/.325
# and eB max .430). 7.62 is the "300 mil" of the drawing title and of
# the ordering legend ("P = Plastic DIP (300 mil Body)", page 40) --
# same reading as standards/DIP28-W7.62-P2.54 for drawing C04-070B.
# Flagged for review. Molded width E1 (.240/.250/.280) is not modelled.
# body_length = D, body_height = A2, overall_height = A (max only),
# standoff = A1 (min only). L (tip to seating plane) is left out: it is
# not the gull-wing foot length `lead_length` means.
schema_version: "0.2"
kind: package
id: manufacturers/microchip/PDIP16-P-C04-017B
family: dip
lead_count: 16
source: microchip/DS20001295@revE

pitch: { typ: 2.54 mm, src: 'p34 "C04-017B table (inches), "Pitch e .100 BSC" -> 2.54 mm"' }
geometry: { type: parametric, generator: dip }

dimensions:
  body_width:
    typ: 7.62 mm
    src:
      - p34 "C04-017B title "16-Lead Plastic Dual In-Line (P) - 300 mil Body [PDIP]" -> 7.62 mm row spacing (the table has no eA row)"
      - p40 "Product Identification System, "P = Plastic DIP (300 mil Body), 14-lead, 16-lead""
  body_length:
    min: 18.669 mm
    typ: 19.177 mm
    max: 19.685 mm
    src: p34 "C04-017B table (inches), "Overall Length D .735 / .755 / .775""
  body_height:
    min: 2.921 mm
    typ: 3.302 mm
    max: 4.953 mm
    src: p34 "C04-017B table (inches), "Molded Package Thickness A2 .115 / .130 / .195""
  lead_thickness:
    min: 0.2032 mm
    typ: 0.254 mm
    max: 0.381 mm
    src: p34 "C04-017B table (inches), "Lead Thickness c .008 / .010 / .015""
  overall_height:
    max: 5.334 mm
    src: p34 "C04-017B table (inches), "Top to Seating Plane A" (MAX .210 only)"
  standoff:
    min: 0.381 mm
    src: p34 "C04-017B table (inches), "Base to Seating Plane A1" (MIN .015 only)"
  lead_width:
    min: 0.3556 mm
    typ: 0.4572 mm
    max: 0.5588 mm
    src: p34 "C04-017B table (inches), "Lower Lead Width b .014 / .018 / .022""
