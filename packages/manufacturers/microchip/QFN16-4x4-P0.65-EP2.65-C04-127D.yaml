# 16-lead QFN, 4x4x0.9 mm, 0.65 mm pitch, 2.65 mm exposed pad (Microchip
# package code ML): drawing C04-127D ("16-Lead Plastic Quad Flat, No Lead
# Package (ML) - 4x4x0.9mm Body [QFN]"), DS20005565E pages 70-71 (text),
# and its recommended land pattern C04-2127A on page 72 (an image,
# rendered and read). body_height = A (no A2 given). lead_thickness = A3
# "0.20 REF" -- a reference value, marked REF in the table. K (min 0.20)
# is not modelled. Pins 1-4 down the left edge, 5-8 along the bottom
# (bottom view mirrored, checked against the "Package Types" top view on
# page 2): the qfn counter-clockwise convention.
#
# pads: the land pattern C04-2127A in the qfn frame (top view, X right,
# Y up, origin at the centre, pin 1 top of the left edge). Contact pad
# spacing C1 = C2 = 4.00 (pad centre to pad centre) -> rows at +-2.00;
# pitch E 0.65, 4 pads per side -> centres at +-0.975 and +-0.325;
# pad X1 0.35 (max) across the pitch, Y1 0.80 (max) along the terminal
# (the table labels X1/Y1 "(X28)"; the drawing shows 16 pads). The
# optional centre pad W2 x T2 2.50 x 2.50 (max) is pad EP (Table 1-1:
# exposed pad, "do not electrically connect").
schema_version: "0.2"
kind: package
id: manufacturers/microchip/QFN16-4x4-P0.65-EP2.65-C04-127D
family: qfn
lead_count: { value: 16, src: 'p71 "C04-127D sheet 2 table, "Number of Pins N 16""' }
source: microchip/DS20005565@revE

pitch: { typ: 0.65 mm, src: 'p71 "C04-127D sheet 2 table, "Pitch e 0.65 BSC""' }
geometry: { type: parametric, generator: qfn }

dimensions:
