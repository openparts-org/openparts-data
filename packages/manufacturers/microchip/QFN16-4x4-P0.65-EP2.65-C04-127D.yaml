  lead_length:
    min: 0.3 mm
    typ: 0.4 mm
    max: 0.5 mm
    src: p71 "C04-127D sheet 2 table, "Contact Length L 0.30 / 0.40 / 0.50""
  lead_thickness:
    typ: 0.2 mm
    src: p71 "C04-127D sheet 2 table, "Contact Thickness A3 0.20 REF" (reference value)"

