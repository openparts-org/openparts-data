    - { number: "11", x: 2, y: 0.325, width: 0.8, length: 0.35 }
    - { number: "12", x: 2, y: 0.975, width: 0.8, length: 0.35 }
    - { number: "13", x: 0.975, y: 2, width: 0.35, length: 0.8 }
