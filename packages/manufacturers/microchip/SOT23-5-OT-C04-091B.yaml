# 5-lead SOT-23 (Microchip package code OT). All values from Microchip
# drawing C04-091B, "5-Lead Plastic Small Outline Transistor (OT)
# [SOT-23]", PDF page 19 of DS21709J (24AA02/24LC02B), rendered and read
# as an image (encoded font; millimetres). Every row is MIN/MAX only
# except the BSC pitches; no nominal is recorded. Not
# standards/SOT23-5-2.90x1.60-P0.95 (C04-091-OT Rev F: D 2.90 BSC, E1
# 1.60 BSC, E 2.80 BSC, L 0.30-0.60) -- the numbers differ. The rows
# are number-for-number those of manufacturers/microchip/
# SOT23-6-CH-C04-028B, but that is a 6-lead outline.
#
# Top view (page 19): pins 1, 2, 3 left to right along the bottom edge,
# N (= 5) above pin 1 and the fourth lead above pin 3, the two upper
# leads e1 = 1.90 BSC apart -- the generator's counter-clockwise [3, 2]
# layout (pin 4 above pin 3, pin 5 above pin 1).
#
# Mapping (as manufacturers/microchip/SOT23-6-CH-C04-028B for the `sot`
# generator): pitch = e 0.95 BSC, body_width = D "Overall Length"
# 2.70-3.10 (along the rows), body_length = E1 "Molded Package Width"
# 1.30-1.80 (across the rows), overall_length = E "Overall Width"
# 2.20-3.20 (lead-tip span), body_height = A2 0.89-1.30,
# overall_height = A 0.90-1.45, standoff = A1 0.00-0.15, lead_length =
# L "Foot Length" 0.10-0.60, lead_thickness = c 0.08-0.26, lead_width =
# b 0.20-0.51. Not modelled: L1 "Footprint" 0.35-0.80, foot angle
# 0-30 deg.
