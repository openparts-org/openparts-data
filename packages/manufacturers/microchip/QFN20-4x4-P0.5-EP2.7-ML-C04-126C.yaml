# 20-lead QFN (also called VQFN), 4x4 mm body, 0.5 mm pitch, 2.7 mm
# exposed pad: Microchip drawing C04-126 Rev C "20-Lead Plastic Quad
# Flat, No Lead Package (ML) - 4x4 mm Body [QFN]", DS20002090E pages
# 32-33 (rendered; encoded-font page), recommended land pattern C04-2126
# Rev B on page 34. Millimetres as printed. body_height = A (no A2
# given). lead_thickness = A3 "0.20 REF" -- a reference value, marked
# REF in the table. K (terminal-to-exposed-pad, 0.20 min) is not
# modelled.
#
# Land pattern (page 34, top view, X right / Y up, origin at the
# pattern centre): C1 = C2 = 4.00 (contact pad spacing, centre to
# centre across the package) -> pad centres at +-2.00; E = 0.50 BSC
# pitch, 5 pads per side centred -> offsets -1.0, -0.5, 0, 0.5, 1.0;
# pad X1 x Y1 = 0.30 x 0.80 (max values, the only ones printed),
# long side across the edge; centre pad X2 x Y2 = 2.80 x 2.80 (max).
# Numbering as the drawing: pin 1 top of the left edge, counter-
# clockwise, pin 20 leftmost of the top row (label "20" on page 34).
# Thermal vias (V, EV) are not recorded.
schema_version: "0.2"
kind: package
id: manufacturers/microchip/QFN20-4x4-P0.5-EP2.7-ML-C04-126C
family: qfn
lead_count: { value: 20, src: 'p33 "C04-126 Rev C sheet 2 table, Number of Terminals N 20"' }
source: microchip/DS20002090@revE

pitch: { typ: 0.5 mm, src: 'p33 "C04-126 Rev C sheet 2 table, Pitch e 0.50 BSC"' }
geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:  { typ: 4 mm, src: 'p33 "C04-126 Rev C sheet 2 table, Overall Width E 4.00 BSC"' }
  body_length: { typ: 4 mm, src: 'p33 "C04-126 Rev C sheet 2 table, Overall Length D 4.00 BSC"' }
  body_height:
    min: 0.8 mm
    typ: 0.9 mm
    max: 1 mm
    src: p33 "C04-126 Rev C sheet 2 table, Overall Height A 0.80 / 0.90 / 1.00"
  exposed_pad:
    src:    p33 "C04-126 Rev C sheet 2 table, Exposed Pad Width E2 / Length D2 2.60 / 2.70 / 2.80"
    width:  { min: 2.6 mm, typ: 2.7 mm, max: 2.8 mm }
    length: { min: 2.6 mm, typ: 2.7 mm, max: 2.8 mm }
  standoff:
    min: 0 mm
    typ: 0.02 mm
    max: 0.05 mm
    src: p33 "C04-126 Rev C sheet 2 table, Standoff A1 0.00 / 0.02 / 0.05"
  lead_width:
    min: 0.18 mm
    typ: 0.25 mm
    max: 0.3 mm
    src: p33 "C04-126 Rev C sheet 2 table, Terminal Width b 0.18 / 0.25 / 0.30"
  lead_length:
    min: 0.3 mm
    typ: 0.4 mm
    max: 0.5 mm
    src: p33 "C04-126 Rev C sheet 2 table, Terminal Length L 0.30 / 0.40 / 0.50"
  lead_thickness:
    typ: 0.2 mm
    src: p33 "C04-126 Rev C sheet 2 table, Terminal Thickness A3 0.20 REF (reference value)"

pads:
  value:
    - { number: "1", x: -2, y: 1, width: 0.8, length: 0.3 }
