    - { number: "6", x: -1, y: -2, width: 0.3, length: 0.8 }
    - { number: "7", x: -0.5, y: -2, width: 0.3, length: 0.8 }
    - { number: "8", x: 0, y: -2, width: 0.3, length: 0.8 }
    - { number: "9", x: 0.5, y: -2, width: 0.3, length: 0.8 }
    - { number: "10", x: 1, y: -2, width: 0.3, length: 0.8 }
    - { number: "11", x: 2, y: -1, width: 0.8, length: 0.3 }
    - { number: "12", x: 2, y: -0.5, width: 0.8, length: 0.3 }
    - { number: "13", x: 2, y: 0, width: 0.8, length: 0.3 }
    - { number: "14", x: 2, y: 0.5, width: 0.8, length: 0.3 }
    - { number: "15", x: 2, y: 1, width: 0.8, length: 0.3 }
    - { number: "16", x: 1, y: 2, width: 0.3, length: 0.8 }
    - { number: "17", x: 0.5, y: 2, width: 0.3, length: 0.8 }
    - { number: "18", x: 0, y: 2, width: 0.3, length: 0.8 }
    - { number: "19", x: -0.5, y: 2, width: 0.3, length: 0.8 }
    - { number: "20", x: -1, y: 2, width: 0.3, length: 0.8 }
    - { number: EP, x: 0, y: 0, width: 2.8, length: 2.8 }
