    typ: 5 mm
    src: p665 "C04-21395-RXB Rev C sheet 2 table, "Overall Width E 5.00 BSC""
  body_length:
    typ: 5 mm
    src: p665 "C04-21395-RXB Rev C sheet 2 table, "Overall Length D 5.00 BSC""
  body_height:
