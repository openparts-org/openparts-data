  src: p665 "C04-21395-RXB Rev C sheet 2 table, "Number of Terminals N 32""

source: microchip/DS40002315@revC

pitch: { typ: 0.5 mm, src: 'p665 "C04-21395-RXB Rev C sheet 2 table, "Pitch e 0.50 BSC""' }
geometry: { type: parametric, generator: qfn }

dimensions:
