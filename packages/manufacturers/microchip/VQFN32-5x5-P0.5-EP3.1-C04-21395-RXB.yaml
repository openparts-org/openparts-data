# 32-lead VQFN, 5x5 mm, 0.5 mm pitch, 3.1x3.1 mm exposed pad: Microchip
# drawing C04-21395-RXB Rev C, "32-Lead Very Thin Plastic Quad Flat, No
# Lead Package (RXB) - 5x5x0.9 mm Body [VQFN] With 3.1x3.1 mm Exposed Pad;
# Atmel Legacy Global Package Code ZMF", DS40002315C section 41 dimension
# table on page 665 (text; the same Rev C table is in DS40002183E page
# 665). Different from standards/QFN32-5x5-P0.5-EP3.6 (EP 3.6) -> new
# package. body_height = A (no A2 given). lead_thickness = A3 "0.203 REF"
# (reference value, marked REF). K (min 0.20) is not modelled.
schema_version: "0.2"
kind: package
id: manufacturers/microchip/VQFN32-5x5-P0.5-EP3.1-C04-21395-RXB
family: qfn

lead_count:
