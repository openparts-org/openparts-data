# 3-lead SOT-23 (Microchip package code TT). All values from Microchip
# drawing C04-104 (TT) Rev C, "3-Lead Plastic Small Outline Transistor
# (TT) [SOT-23]", dimension table on sheet 2 = PDF page 17 of
# DS20001942L (MCP970X); sheet 1 (page 16) shows pins 1 and 2 on one
# edge and pin 3 (N) alone on the opposite edge. Pages rendered and read
# as images (encoded font).
#
# Not merged into standards/SOT23-2.90x1.30-P1.90: Microchip states
# D 2.67/2.90/3.05, E1 1.16/1.30/1.40, E 2.10-2.64, A2 0.79/0.95/1.02,
# L 0.13/0.50/0.60, b 0.30-0.54, which differ from the onsemi values
# held there.
#
# Mapping (same as the existing SOT-23 packages, for the `sot`
# generator): pitch = e1 (outside lead pitch, pin 1 to pin 2, 1.90 BSC;
# the 0.95 BSC e is pin to centre line), body_width = D (long axis),
# body_length = E1 (short axis, across the two lead rows),
# overall_length = E (lead tip to lead tip across the rows).
schema_version: "0.2"
kind: package
id: manufacturers/microchip/SOT23-3-TT-C04-104C
family: sot
lead_count: 3

lead_layout:
  value: [2, 1]
  src:   'p16 "C04-104 (TT) Rev C sheet 1, top view: leads 1 and 2 on one edge, lead N (3) alone on the opposite edge"'

source: microchip/DS20001942@revL

pitch:
  typ: 1.9 mm
  src: p17 "C04-104 (TT) Rev C sheet 2 table, "Outside Lead Pitch e1 1.90 BSC""

geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 2.67 mm
    typ: 2.9 mm
    max: 3.05 mm
    src: p17 "C04-104 (TT) Rev C sheet 2 table, "Overall Length D 2.67 / 2.90 / 3.05""
  body_length:
    min: 1.16 mm
    typ: 1.3 mm
    max: 1.4 mm
    src: p17 "C04-104 (TT) Rev C sheet 2 table, "Molded Package Width E1 1.16 / 1.30 / 1.40""
  body_height:
    min: 0.79 mm
    typ: 0.95 mm
    max: 1.02 mm
    src: p17 "C04-104 (TT) Rev C sheet 2 table, "Molded Package Thickness A2 0.79 / 0.95 / 1.02""
  lead_thickness:
    min: 0.08 mm
    max: 0.2 mm
    src: p17 "C04-104 (TT) Rev C sheet 2 table, "Lead Thickness c 0.08 / - / 0.20""
  overall_length:
    min: 2.1 mm
    max: 2.64 mm
    src: p17 "C04-104 (TT) Rev C sheet 2 table, "Overall Width E 2.10 / - / 2.64""
  overall_height:
    min: 0.89 mm
    max: 1.12 mm
    src: p17 "C04-104 (TT) Rev C sheet 2 table, "Overall Height A 0.89 / - / 1.12""
  standoff:
    min: 0.01 mm
    max: 0.1 mm
    src: p17 "C04-104 (TT) Rev C sheet 2 table, "Standoff A1 0.01 / - / 0.10""
  lead_width:
    min: 0.3 mm
    max: 0.54 mm
    src: p17 "C04-104 (TT) Rev C sheet 2 table, "Lead Width b 0.30 / - / 0.54""
  lead_length:
    min: 0.13 mm
    typ: 0.5 mm
    max: 0.6 mm
    src: p17 "C04-104 (TT) Rev C sheet 2 table, "Foot Length L 0.13 / 0.50 / 0.60""
