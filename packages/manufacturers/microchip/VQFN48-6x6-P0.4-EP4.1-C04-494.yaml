# 48-lead VQFN, 6x6 mm, 0.4 mm pitch, 4.1x4.1 mm exposed pad: Microchip
# drawing C04-494 Rev A, "48-Lead Very Thin Plastic Quad Flat, No Lead
# Package (6LX) - 6x6 mm Body [VQFN] With 4.1x4.1 mm Exposed Pad",
# DS40002173C section 35.9, dimension table on page 543 (text).
# Different from standards/QFN48-nRF52840 (no EP data) and the 7x7
# QFN48 packages -> new package.
# body_height = A (no A2 given). lead_thickness = A3 "0.20 REF" -- a
# reference value, marked REF in the table. Corner chamfer CH (0.35
# REF) and K (0.55 REF) are not modelled.
schema_version: "0.2"
kind: package
id: manufacturers/microchip/VQFN48-6x6-P0.4-EP4.1-C04-494
family: qfn
lead_count: { value: 48, src: 'p543 "C04-494 table, "Number of Terminals N 48""' }
source: microchip/DS40002173@revC

pitch: { typ: 0.4 mm, src: 'p543 "C04-494 table, "Pitch e 0.40 BSC""' }
geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:  { typ: 6 mm, src: 'p543 "C04-494 table, "Overall Width E 6.00 BSC""' }
  body_length: { typ: 6 mm, src: 'p543 "C04-494 table, "Overall Length D 6.00 BSC""' }
  body_height:
    min: 0.8 mm
    typ: 0.85 mm
    max: 0.9 mm
    src: p543 "C04-494 table, "Overall Height A 0.80 / 0.85 / 0.90""
  exposed_pad:
    src:    p543 "C04-494 table, "Exposed Pad Width E2" and "Exposed Pad Length D2" 4.00 / 4.10 / 4.20"
    width:  { min: 4 mm, typ: 4.1 mm, max: 4.2 mm }
    length: { min: 4 mm, typ: 4.1 mm, max: 4.2 mm }
  standoff:
    min: 0 mm
    typ: 0.02 mm
    max: 0.05 mm
    src: p543 "C04-494 table, "Standoff A1 0.00 / 0.02 / 0.05""
  lead_width:
    min: 0.15 mm
    typ: 0.2 mm
    max: 0.25 mm
    src: p543 "C04-494 table, "Terminal Width b 0.15 / 0.20 / 0.25""
  lead_length:
    min: 0.3 mm
    typ: 0.4 mm
    max: 0.5 mm
    src: p543 "C04-494 table, "Terminal Length L 0.30 / 0.40 / 0.50""
  lead_thickness:
    typ: 0.2 mm
    src: p543 "C04-494 table, "Terminal Thickness A3 0.20 REF" (reference value)"
