# 8-lead DFN-S, 6x5 mm, 1.27 mm pitch, exposed pad, saw singulated:
# Microchip drawing C04-122 Rev C "8-Lead Plastic Dual Flat, No Lead
# Package (MF) - 6x5 mm Body [DFN-S]", DS20001822J sheet 1 (page 16,
# views) and sheet 2 (page 17, table), rendered images (text layer
# encoded). Frame: D (5.00, along the terminal rows, sheet 1 top view) =
# body_length (Y), E (6.00, across) = body_width (X); exposed pad E2 =
# width (X), D2 = length (Y). body_height = A. lead_thickness = A3
# "0.20 REF" (reference value). K (min 0.20) not modelled.
# Differs from C04-122B (24LC256, DS20001203W) in A1 nominal and b, so
# kept separate.
schema_version: "0.2"
kind: package
id: manufacturers/microchip/DFN8-6x5-P1.27-MF-C04-122C
family: dfn

lead_count:
  value: 8
  src: p17 "drawing C04-122 Rev C sheet 2 table, "Number of Terminals N 8""

source: microchip/DS20001822@revJ

pitch: { typ: 1.27 mm, src: 'p17 "drawing C04-122 Rev C sheet 2 table, "Pitch e 1.27 BSC""' }
geometry: { type: parametric, generator: dfn }

dimensions:
  body_width:
    typ: 6 mm
    src: p17 "drawing C04-122 Rev C sheet 2 table, "Overall Width E 6.00 BSC" (across the terminal rows)"
  body_length:
    typ: 5 mm
    src: p17 "drawing C04-122 Rev C sheet 2 table, "Overall Length D 5.00 BSC" (along the terminal rows)"
  body_height:
    min: 0.8 mm
    typ: 0.85 mm
    max: 1 mm
    src: p17 "drawing C04-122 Rev C sheet 2 table, "Overall Height A 0.80 / 0.85 / 1.00""
  exposed_pad:
    src:    p17 "C04-122 Rev C sheet 2 table, E2 (width, across rows), D2 (length, along rows)"
    width:  { min: 2.2 mm, typ: 2.3 mm, max: 2.4 mm }
    length: { min: 3.9 mm, typ: 4 mm, max: 4.1 mm }
  standoff:
    min: 0 mm
    typ: 0.02 mm
    max: 0.05 mm
    src: p17 "drawing C04-122 Rev C sheet 2 table, "Standoff A1 0.00 / 0.02 / 0.05""
  lead_width:
    min: 0.3 mm
    typ: 0.4 mm
    max: 0.5 mm
    src: p17 "drawing C04-122 Rev C sheet 2 table, "Terminal Width b 0.30 / 0.40 / 0.50""
  lead_length:
    min: 0.5 mm
    typ: 0.6 mm
    max: 0.75 mm
    src: p17 "drawing C04-122 Rev C sheet 2 table, "Terminal Length L 0.50 / 0.60 / 0.75""
  lead_thickness:
    typ: 0.2 mm
    src: p17 "drawing C04-122 Rev C sheet 2 table, "Terminal Thickness A3 0.20 REF" (reference value)"
