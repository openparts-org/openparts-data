    - { number: "1", x: -2.7, y: 1.905, width: 1.55, length: 0.6 }
    - { number: "2", x: -2.7, y: 0.635, width: 1.55, length: 0.6 }
    - { number: "3", x: -2.7, y: -0.635, width: 1.55, length: 0.6 }
    - { number: "4", x: -2.7, y: -1.905, width: 1.55, length: 0.6 }
    - { number: "5", x: 2.7, y: -1.905, width: 1.55, length: 0.6 }
