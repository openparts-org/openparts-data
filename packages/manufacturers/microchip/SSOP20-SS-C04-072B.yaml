# 20-lead SSOP, 5.30 mm body, 0.65 mm pitch (Microchip package code SS):
# drawing C04-072B ("20-Lead Plastic Shrink Small Outline (SS) - 5.30 mm
# Body [SSOP]"), DS20002228E page 39, and its recommended land pattern
# C04-2072A on page 40; both pages are images, rendered and read.
# Copied as printed (MIN/NOM/MAX; min-only and max-only rows kept as
# such). body_height = A2, overall_height = A (MAX 2.00 only). L1 (1.25
# REF) and the foot angle are not modelled. Not the TI DB package
# (standards/SSOP20-5.3x7.2-P0.65-TI-DB): another vendor's drawing.
#
# pads: C04-2072A turned 90 degrees clockwise into the ssop frame (top
# view, X right, Y up, origin at the centre, pin 1 top of the left row;
# the drawing has the pin-1 row at the bottom, pin 1 at its left end).
# Contact pad spacing C 7.20 -> rows at x = +-3.60; pitch E 0.65, 10
# pads per row -> y = +-2.925 ... in 0.65 steps; pad X1 0.45 (max)
# across the pitch, Y1 1.75 (max) along the lead.
