# 14-lead narrow (3.90 mm) SOIC, Microchip drawing C04-065-SL Rev D
# ("14-Lead Plastic Small Outline (SL) - Narrow, 3.90 mm Body [SOIC]"),
# dimension table on DS40002204A page 569 (text). The same Rev D table
# with identical numbers is printed in DS40002318A page 500 and
# DS40002287A page 561. Copied as printed: BSC values as nominal,
# min/max-only rows as min/max only. body_height = A2 (MIN 1.25 only),
# overall_height = A (MAX 1.75 only). Chamfer h, L1 (1.04 REF) and the
# angles are not modelled. Not manufacturers/microchip/SOIC14-SL-C04-065B
# (drawing Rev B in DS21897B): that table gives lead thickness c
# 0.17-0.25, this Rev D table c 0.10-0.25 -- every other row is the same,
# but the numbers differ, so a separate package.
schema_version: "0.2"
kind: package
id: manufacturers/microchip/SOIC14-SL-C04-065D
family: soic
lead_count: { value: 14, src: 'p569 "C04-065-SL Rev D sheet 2 table, "Number of Pins N 14""' }
source: microchip/DS40002204@revA

pitch: { typ: 1.27 mm, src: 'p569 "C04-065-SL Rev D sheet 2 table, "Pitch e 1.27 BSC""' }
geometry: { type: parametric, generator: soic }

dimensions:
  body_width:
    typ: 3.9 mm
    src: p569 "C04-065-SL Rev D sheet 2 table, "Molded Package Width E1 3.90 BSC""
  body_length:
    typ: 8.65 mm
    src: p569 "C04-065-SL Rev D sheet 2 table, "Overall Length D 8.65 BSC""
  body_height:
    min: 1.25 mm
    src: p569 "C04-065-SL Rev D sheet 2 table, "Molded Package Thickness A2" (MIN 1.25 only)"
  lead_thickness:
    min: 0.1 mm
    max: 0.25 mm
    src: p569 "C04-065-SL Rev D sheet 2 table, "Lead Thickness c 0.10 / - / 0.25""
  overall_width:
    typ: 6 mm
    src: p569 "C04-065-SL Rev D sheet 2 table, "Overall Width E 6.00 BSC""
  overall_height:
    max: 1.75 mm
    src: p569 "C04-065-SL Rev D sheet 2 table, "Overall Height A" (MAX 1.75 only)"
  standoff:
    min: 0.1 mm
    max: 0.25 mm
    src: p569 "C04-065-SL Rev D sheet 2 table, "Standoff A1 0.10 / - / 0.25""
  lead_width:
    min: 0.31 mm
    max: 0.51 mm
    src: p569 "C04-065-SL Rev D sheet 2 table, "Lead Width b 0.31 / - / 0.51""
  lead_length:
    min: 0.4 mm
    max: 1.27 mm
    src: p569 "C04-065-SL Rev D sheet 2 table, "Foot Length L 0.40 / - / 1.27""
