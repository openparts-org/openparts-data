# 14-lead narrow (3.90 mm) SOIC, Microchip drawing C04-065-SL Rev D
# ("14-Lead Plastic Small Outline (SL) - Narrow, 3.90 mm Body [SOIC]"),
# dimension table on DS40002204A page 569 (text). The same Rev D table
# with identical numbers is printed in DS40002318A page 500 and
# DS40002287A page 561. Copied as printed: BSC values as nominal,
# min/max-only rows as min/max only. body_height = A2 (MIN 1.25 only),
# overall_height = A (MAX 1.75 only). Chamfer h, L1 (1.04 REF) and the
# angles are not modelled. Not manufacturers/microchip/SOIC14-SL-C04-065B
# (drawing Rev B in DS21897B): that table gives lead thickness c
# 0.17-0.25, this Rev D table c 0.10-0.25 -- every other row is the same,
# but the numbers differ, so a separate package.
