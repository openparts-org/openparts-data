# 20-lead wide (7.50 mm) SOIC, Microchip drawing C04-094 Rev D ("20-Lead
# Plastic Small Outline (SO) - Wide, 7.50 mm Body [SOIC]"), dimension
# table on DS40002318A page 503 (text), recommended land pattern C04-2094
# Rev D on page 504 (text). The same Rev D tables with identical numbers
# are printed in DS40002287A pages 564-565. Copied as printed: BSC values
# as nominal, min/max-only rows as min/max only. body_height = A2 (MIN
# 2.05 only), overall_height = A (MAX 2.65 only). L1 (1.40 REF), R1/R2 and
# angles are not modelled.
#
# Not manufacturers/microchip/SOIC20-SO-C04-094C: Rev C prints c
# 0.20-0.33 and L 0.40-1.27, this Rev D table "Terminal Thickness c" 0.25
# - 0.75 and "Terminal Length L" 0.41/0.65/0.89, so a separate package.
# lead_thickness is deliberately not recorded: the Rev D c range 0.25 -
# 0.75 is implausible for a 20-lead SOIC lead frame (Rev C: 0.20-0.33)
# and its midpoint breaks the 3D generator; left Unknown for a reviewer.
#
# pads: C "Contact Pad Spacing" 9.40 is pad-centre to pad-centre (check:
# C - Y = 9.40 - 1.95 = 7.45 = G1, the printed pad-to-pad gap), so x =
# +/-4.70; Y 1.95 (max) along x, X 0.60 (max) along y; E 1.27 BSC; pin 1
# top-left.
schema_version: "0.2"
kind: package
id: manufacturers/microchip/SOIC20-SO-C04-094D
family: soic
lead_count: { value: 20, src: 'p503 "C04-094 Rev D sheet 2 table, "Number of Terminals N 20""' }
source: microchip/DS40002318@revA

pitch: { typ: 1.27 mm, src: 'p503 "C04-094 Rev D sheet 2 table, "Pitch e 1.27 BSC""' }
geometry: { type: parametric, generator: soic }

dimensions:
  body_width:
    typ: 7.5 mm
    src: p503 "C04-094 Rev D sheet 2 table, "Molded Package Width E1 7.50 BSC""
  body_length:
    typ: 12.8 mm
    src: p503 "C04-094 Rev D sheet 2 table, "Overall Length D 12.80 BSC""
  body_height:
    min: 2.05 mm
    src: p503 "C04-094 Rev D sheet 2 table, "Molded Package Thickness A2" (MIN 2.05 only)"
  lead_length:
    min: 0.41 mm
    typ: 0.65 mm
    max: 0.89 mm
    src: p503 "C04-094 Rev D sheet 2 table, "Terminal Length L 0.41 / 0.65 / 0.89""
  overall_width:
    typ: 10.3 mm
    src: p503 "C04-094 Rev D sheet 2 table, "Overall Width E 10.30 BSC""
  overall_height:
    max: 2.65 mm
    src: p503 "C04-094 Rev D sheet 2 table, "Overall Height A" (MAX 2.65 only)"
  standoff:
    min: 0.1 mm
    max: 0.3 mm
    src: p503 "C04-094 Rev D sheet 2 table, "Standoff A1 0.10 / - / 0.30""
  lead_width:
    min: 0.31 mm
    max: 0.51 mm
    src: p503 "C04-094 Rev D sheet 2 table, "Terminal Width b 0.31 / - / 0.51""

pads:
