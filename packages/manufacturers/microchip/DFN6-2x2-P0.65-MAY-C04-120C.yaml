# 6-lead DFN, 2x2 mm, 0.65 mm pitch, exposed pad: Microchip drawing
# C04-120C "6-Lead Plastic Dual Flat, No Lead Package (MA[Y]) -
# 2x2x0.9mm Body [DFN]", DS20001826E sheet 1 (page 25, views) and sheet
# 2 (page 26, table), rendered images. Frame: D (2.00, along the
# terminal rows in the bottom view) = body_length (Y), E (2.00, across)
# = body_width (X); exposed pad E2 (across the rows) = width (X), D2
# (along the rows) = length (Y). body_height = A (no A2; note the title
# says 0.9 mm but the table gives A 0.80/0.85/0.90 -- the table is
# used). lead_thickness = A3 "0.20 REF" (reference value). K (min 0.20)
# not modelled.
schema_version: "0.2"
kind: package
id: manufacturers/microchip/DFN6-2x2-P0.65-MAY-C04-120C
family: dfn
lead_count: { value: 6, src: 'p26 "drawing C04-120C sheet 2 table, "Number of Pins N 6""' }
source: microchip/DS20001826@revE

pitch: { typ: 0.65 mm, src: 'p26 "drawing C04-120C sheet 2 table, "Pitch e 0.65 BSC""' }
geometry: { type: parametric, generator: dfn }

dimensions:
  body_width:
    typ: 2 mm
    src: p26 "drawing C04-120C sheet 2 table, "Overall Width E 2.00 BSC" (across the terminal rows, sheet 1 page 25)"
  body_length:
    typ: 2 mm
