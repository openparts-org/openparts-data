# 6-lead SOT-23 (Microchip package code CH). Values from Microchip
# drawing C04-028C, "6-Lead Plastic Small Outline Transistor (CH, CHY)
# [SOT-23]", dimension table on DS20006129C (MCP6C02) page 47 (text;
# sheet 1, the outline view, on page 46). Unlike C04-028B
# (manufacturers/microchip/SOT23-6-CH-C04-028B) this revision gives D,
# E1 and E as BSC values and A2 / L with a nominal, so it is its own
# package.
#
# Top view and mapping as for C04-028B (`sot` generator, [3, 3]
# counter-clockwise): pitch = e (0.95 BSC; e1 1.90 BSC is pin 1 to
# pin 3), body_width = D "Overall Length" 2.90 BSC (long axis),
# body_length = E1 "Molded Package Width" 1.60 BSC, overall_length = E
# "Overall Width" 2.80 BSC (lead-tip span), body_height = A2, overall_
# height = A, standoff = A1, lead_length = L "Foot Length", lead_thickness
# = c, lead_width = b. Not modelled: L1 "Footprint" 0.60 REF, the gauge
# plane L1 0.25 BSC, foot angle 0-10 deg.
schema_version: "0.2"
kind: package
id: manufacturers/microchip/SOT23-6-CH-C04-028C
family: sot
lead_count: 6

lead_layout:
  value: [3, 3]
  src:   'p1 "Package Types (Top View), SOT-23: pins 1-3 on one side, 4-6 on the other"'

source: microchip/DS20006129@revC

pitch:
  typ: 0.95 mm
  src: p47 "C04-028C table, "Pitch e 0.95 BSC" ("Outside lead pitch e1 1.90 BSC")"

geometry: { type: parametric, generator: sot }

dimensions:
  body_width: { typ: 2.9 mm, src: 'p47 "C04-028C table, "Overall Length D 2.90 BSC" (long axis)"' }
  body_length: { typ: 1.6 mm, src: 'p47 "C04-028C table, "Molded Package Width E1 1.60 BSC""' }
  body_height:
    min: 0.89 mm
    typ: 1.15 mm
    max: 1.3 mm
    src: p47 "C04-028C table, "Molded Package Thickness A2" 0.89 / 1.15 / 1.30"
  lead_thickness:
    min: 0.08 mm
    max: 0.26 mm
    src: p47 "C04-028C table, "Lead Thickness c" 0.08 / - / 0.26"
  overall_length:
    typ: 2.8 mm
    src: p47 "C04-028C table, "Overall Width E 2.80 BSC" (lead-tip span)"
  overall_height:
    min: 0.9 mm
    max: 1.45 mm
    src: p47 "C04-028C table, "Overall Height A" 0.90 / - / 1.45"
  standoff: { min: 0 mm, max: 0.15 mm, src: 'p47 "C04-028C table, "Standoff A1" 0.00 / - / 0.15"' }
  lead_width:
    min: 0.2 mm
    max: 0.51 mm
    src: p47 "C04-028C table, "Lead Width b" 0.20 / - / 0.51"
  lead_length:
    min: 0.3 mm
    typ: 0.45 mm
    max: 0.6 mm
    src: p47 "C04-028C table, "Foot Length L" 0.30 / 0.45 / 0.60"
