# AP Memory 8-lead SOP 150 mil (package code SN), 1.27 mm pitch. From
# section 4.1 "SOP-8L(150), package code SN" of the APS6404L-3SQR
# datasheet Rev 2.7, page 5 (an image: rendered at 200 dpi and read).
# Millimetre column used.
#
# body_width = E1, body_length = D, overall_width = E (6.00 BSC),
# body_height = A2, overall_height = A, standoff = A1, lead_width = b
# (with plating; b1 is the base metal, not modelled), lead_thickness =
# c (with plating; c1 not modelled), lead_length = L. L1 "1.05 REF", ZD
# "0.55 REF", the chamfer h, Y (coplanarity) and the angles are not
# modelled. Values with NOM "-" are recorded as min/max.
#
# Not standards/SOIC8-3.90x4.90-P1.27 (Microchip C04-057): D here is
# 4.80/4.90/5.00 vs 4.90 BSC there, A2 1.35-1.55 vs min 1.25.
schema_version: "0.2"
kind: package
id: manufacturers/apmemory/SOP8-150mil-SN
family: soic
lead_count: 8
source: apmemory/APS6404L-3SQR@rev2.7

