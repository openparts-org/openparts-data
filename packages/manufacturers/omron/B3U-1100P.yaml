# OMRON B3U ultra-small SMT tactile switch, top-actuated, with ground
# terminal, without boss (B3U-1100P, -1100PM) -- page-2 drawing
# "With Ground Terminal, without Boss" of omron/A162-E1-07.
# Frame: the top view as drawn (terminals left and right) -- the
# generator frame, no rotation. "Terminal Arrangement/Internal
# Connections (Top View)" puts 2 left and 1 right and 3 below -> pad_order
# ["2", "1", "3"] (positions left, right, ground).
# Dimensions without a printed tolerance take the page's stated "±0.2 mm"
# general tolerance as min/max. lead_width is the terminal width "1.4".
# Pads: "PCB Pad (Top View)": outer edges "4.2±0.1" apart, inner "2.6±0.1"
# -> pads 0.8 wide at x = ±(4.2 + 2.6)/4 = ±1.7, "1.7±0.1" long.
# Ground terminal: "3", below the housing (-Y) as drawn; its tip "1.9"
# from the centre line, "0.5" wide. Its PCB pad: "0.8±0.1" wide, its near
# edge "1.1±0.1" below the centre line and "1.1±0.1" long -> y = -1.65.
schema_version: "0.2"
kind: package
id: manufacturers/omron/B3U-1100P
family: tact_switch_smd
lead_count: 3
source: omron/A162-E1-07

pitch:
  typ: 3.4 mm
  src: p2 "With Ground Terminal, without Boss, PCB Pad (Top View), pad centres (4.2 + 2.6)/2 apart"

pad_order:
  value: ["2", "1", "3"]
  src:   p2 "With Ground Terminal, without Boss, Terminal Arrangement/Internal Connections (Top View) (see header)"

geometry: { type: parametric, generator: tact_switch_smd }

dimensions:
  body_width:
    min: 2.8 mm
    typ: 3 mm
    max: 3.2 mm
    src: p2 "With Ground Terminal, without Boss, top view, housing 3 (±0.2 general tolerance)"
  body_length:
    min: 2.3 mm
    typ: 2.5 mm
    max: 2.7 mm
    src: p2 "With Ground Terminal, without Boss, top view, housing 2.5 (±0.2 general tolerance)"
  body_height:
    min: 1.1 mm
    typ: 1.2 mm
    max: 1.35 mm
    src: p2 "With Ground Terminal, without Boss, side view, housing 1.2 +0.15/-0.10"
  ground_terminal_width:
    min: 0.3 mm
    typ: 0.5 mm
    max: 0.7 mm
    src: p2 "With Ground Terminal, without Boss, top view, ground terminal width 0.5"
  overall_width:
    min: 3.8 mm
    typ: 4 mm
    max: 4.2 mm
    src: p2 "With Ground Terminal, without Boss, top view, terminal end to end 4 (±0.2 general tolerance)"
  overall_height:
    min: 1.5 mm
    typ: 1.6 mm
    max: 1.75 mm
    src: p2 "With Ground Terminal, without Boss, side view, plunger top 1.6 +0.15/-0.10"
  lead_width:
    min: 1.2 mm
    typ: 1.4 mm
    max: 1.6 mm
    src: p2 "With Ground Terminal, without Boss, top view, terminal width 1.4 (±0.2 general tolerance)"
  actuator_diameter:
    min: 1.3 mm
    typ: 1.5 mm
    max: 1.7 mm
    src: p2 "With Ground Terminal, without Boss, top view, plunger 1.5 dia. (±0.2 general tolerance)"
  ground_terminal_offset:
    min: 1.7 mm
    typ: 1.9 mm
    max: 2.1 mm
    src: p2 "With Ground Terminal, without Boss, top view, centre line to ground terminal tip 1.9"

pads:
  value:
    - { number: "2", x: -1.7, y: 0, width: 0.8, length: 1.7 }
    - { number: "1", x: 1.7, y: 0, width: 0.8, length: 1.7 }
    - { number: "3", x: 0, y: -1.65, width: 0.8, length: 1.1 }
  src: p2 "With Ground Terminal, without Boss, PCB Pad (Top View), 4.2±0.1, 2.6±0.1, 1.7±0.1, ground 1.1±0.1, 0.8±0.1"
