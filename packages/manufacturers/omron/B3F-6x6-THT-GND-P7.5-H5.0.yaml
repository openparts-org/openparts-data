# OMRON B3F through-hole tactile switch, 6 x 6 mm, flat plunger, with
# ground terminal, 7.5 mm terminal pitch, height 5.0 mm (B3F-1110) --
# page-4 drawing "Standard, Flat Plunger Type (with Ground Terminal,
# Pitch: 7.5 mm)" of omron/A070-E1-08. Orientation and pad numbers as the other
# B3F drawings (page-4 note; "Terminal Arrangement/Internal Connections
# (Top View)": 4 3 / 2 1, 5 below the housing, -Y). Dimensions without a
# printed tolerance take the page's "±0.4 mm" general tolerance.
# Pads: the PCB holes differ in drill ("Four, 1.2±0.05 dia." for the
# terminals, "1±0.05 dia." for the ground terminal), so they are listed:
# columns 7.5±0.1 apart (x = ±3.75), rows 4.5±0.1 (y = ±2.25), the fifth
# 4.1±0.1 below the centre line; no land diameter is given (generator
# ring default). row_spacing/hole_diameter repeat the terminal holes.
