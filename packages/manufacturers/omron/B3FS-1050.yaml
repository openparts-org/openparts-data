# OMRON B3FS SMT tactile switch, 6 x 6 mm, projected plunger, 7.3 mm
# (B3FS-1050, -1052, -1050P, -1052P) -- page-3 drawing "Projected Type"
# of omron/A113-E1-06. Orientation: OMRON draws the switch "rotated so
# that the terminals are on the right and left-hand sides" (page-3 note)
# -- the generator frame, no rotation. Pad numbers from "Terminal
# Arrangement/Internal Connection (Top View)" (4 3 / 2 1); "No terminal
# numbers are indicated on the Switches." Dimensions without a printed
# tolerance take the page's stated "±0.4 mm" general tolerance.
# Left out: actuator_diameter (the projected plunger is a square
# "2.4±0.1" stem with a "1.8" high head, not round -- the 3D model uses
# the generator's default plunger), lead_length (foot not dimensioned),
# standoff. The recommended "PCB Pad" (6.4 / 9.6 across, 3.1 / 5.9
# along Y) is not representable here: footprint pads are the terminal
# feet. The flat-type B3FS-10x0/-10x2/-10x5 drawings print no housing
# width (only "6.3" and the toe span), so they are not added.
schema_version: "0.2"
kind: package
id: manufacturers/omron/B3FS-1050
family: tact_switch_smd
lead_count: 4
source: omron/A113-E1-06

pitch:
  min: 4.3 mm
  typ: 4.5 mm
  max: 4.7 mm
  src: p3 "Projected Type top view, terminal pitch; PCB Pad (Top View), pad centres"

pad_order:
  value: ["4", "2", "1", "3"]
  src:   p3 "Terminal Arrangement/Internal Connection (Top View) (see header)"

geometry: { type: parametric, generator: tact_switch_smd }

dimensions:
  body_width:
    min: 5.6 mm
    typ: 6 mm
    max: 6.4 mm
    src: p3 "Projected Type top view, housing (horizontal); general tolerance note"
  body_length:
    min: 5.9 mm
    typ: 6.3 mm
    max: 6.7 mm
    src: p3 ""Projected Type" top view, housing "6.3" (vertical, along the terminal rows) (±0.4 note)"
  body_height:
    min: 2.2 mm
    typ: 2.6 mm
    max: 3 mm
    src: p3 ""Projected Type" front view, board to housing top "2.6" (±0.4 note)"
  lead_width:
    min: 0.3 mm
    typ: 0.7 mm
    max: 1.1 mm
    src: p3 ""Projected Type" end view, terminal width "0.7" (±0.4 note)"
  overall_width:
    min: 7.6 mm
    typ: 8 mm
    max: 8.4 mm
    src: p3 ""Projected Type" front view, terminal toe to toe "8" (±0.4 note)"
  overall_height:
    min: 6.9 mm
    typ: 7.3 mm
    max: 7.7 mm
    src: p3 ""Projected Type" front view, board to plunger top "7.3" (±0.4 note)"
