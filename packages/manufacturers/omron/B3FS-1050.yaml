# OMRON B3FS SMT tactile switch, 6 x 6 mm, projected plunger, 7.3 mm
# (B3FS-1050, -1052, -1050P, -1052P) -- page-3 drawing "Projected Type"
# of omron/A113-E1-06. Orientation: OMRON draws the switch "rotated so
# that the terminals are on the right and left-hand sides" (page-3 note)
# -- the generator frame, no rotation. Pad numbers from "Terminal
# Arrangement/Internal Connection (Top View)" (4 3 / 2 1); "No terminal
# numbers are indicated on the Switches." Dimensions without a printed
# tolerance take the page's stated "±0.4 mm" general tolerance.
# Left out: actuator_diameter (the projected plunger is a square
# "2.4±0.1" stem with a "1.8" high head, not round -- the 3D model uses
# the generator's default plunger), lead_length (foot not dimensioned),
# standoff. The recommended "PCB Pad" (6.4 / 9.6 across, 3.1 / 5.9
# along Y) is not representable here: footprint pads are the terminal
# feet. The flat-type B3FS-10x0/-10x2/-10x5 drawings print no housing
# width (only "6.3" and the toe span), so they are not added.
schema_version: "0.1"
