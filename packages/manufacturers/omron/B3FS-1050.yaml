    - source: omron/A113-E1-06
      page: 3
      locator: "\"Projected Type\" (B3FS-1050/1052/1050P/1052P) top view, terminal pitch \"4.5±0.2\"; \"PCB Pad (Top View)\" pad centres (3.1+5.9)/2 = 4.5"
  "/pad_order":
