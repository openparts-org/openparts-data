      page: 3
      locator: "\"Terminal Arrangement/Internal Connection (Top View)\": \"4\" top-left, \"2\" bottom-left, \"1\" bottom-right, \"3\" top-right -> positions TL, BL, BR, TR = 4, 2, 1, 3"
  "/dimensions/body_width":
    - source: omron/A113-E1-06
      page: 3
      locator: "\"Projected Type\" top view, housing \"6\" (horizontal); note \"Unless otherwise specified, a tolerance of ±0.4 mm applies to all dimensions.\""
  "/dimensions/body_length":
