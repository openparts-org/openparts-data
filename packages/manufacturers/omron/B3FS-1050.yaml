    min: 2.2
    max: 3.0
    unit: mm
  overall_height:
    nominal: 7.3
    min: 6.9
    max: 7.7
    unit: mm
  overall_width:
    nominal: 8
    min: 7.6
    max: 8.4
    unit: mm
  lead_width:
    nominal: 0.7
    min: 0.3
    max: 1.1
    unit: mm

geometry:
  type: parametric
  generator: tact_switch_smd

