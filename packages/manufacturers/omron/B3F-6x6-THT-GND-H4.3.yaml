# OMRON B3F through-hole tactile switch, 6 x 6 mm, flat plunger, with
# ground terminal, height 4.3 mm (B3F-1100/1102/1105/1102-G) -- page-4 drawing
# "Standard, Flat Plunger Type (with Ground Terminal)" of omron/A070-E1-08.
# Orientation: OMRON draws the switch "rotated so that the terminals are
# on the right and left-hand sides" (page-4 note) -- the generator frame,
# no rotation; the ground terminal ("5") is drawn below the housing, -Y.
# Pad numbers from "Terminal Arrangement/Internal Connections (Top View)"
# (4 3 / 2 1, 5 below); "No terminal numbers are indicated on the
# Switches." Dimensions without a printed tolerance take the page's
# stated "±0.4 mm" general tolerance as min/max.
# Pads: the recommended PCB holes (6.5±0.1 x 4.5±0.1, the fifth 4.1±0.1
# below the centre line, "Five, 1±0.05 dia."); no land diameter is given
# (generator ring default). lead_width (0.7) and the ground terminal's
# "1.5" width not recorded (unused by THT pads); standoff not dimensioned.
schema_version: "0.2"
kind: package
id: manufacturers/omron/B3F-6x6-THT-GND-H4.3
family: tact_switch_tht
lead_count: 5
source: omron/A070-E1-08

pitch:
  min: 4.4 mm
  typ: 4.5 mm
  max: 4.6 mm
  src: p4 "B3F-1100/1102/1105/1102-G, PCB Processing Dimensions, hole rows 4.5±0.1"

pad_order:
  value: ["4", "2", "1", "3", "5"]
  src:   p4 "B3F-1100/1102/1105/1102-G, Terminal Arrangement/Internal Connections (Top View) (see header)"

geometry: { type: parametric, generator: tact_switch_tht }

dimensions:
  body_width:
    min: 5.8 mm
    typ: 6 mm
    max: 6.2 mm
    src: p4 "B3F-1100/1102/1105/1102-G top view, housing 6±0.2 (horizontal)"
  body_length:
    min: 5.8 mm
    typ: 6 mm
    max: 6.2 mm
    src: p4 "B3F-1100/1102/1105/1102-G top view, housing 6±0.2 (vertical)"
  body_height:
    min: 3 mm
    typ: 3.4 mm
    max: 3.8 mm
    src: p4 "B3F-1100/1102/1105/1102-G front view, board to housing top 3.4 (±0.4 general tolerance)"
  ground_terminal_offset:
    min: 4 mm
    typ: 4.1 mm
    max: 4.2 mm
    src: p4 "B3F-1100/1102/1105/1102-G, PCB Processing Dimensions, centre line to fifth hole 4.1±0.1"
  overall_height:
    min: 4.1 mm
    typ: 4.3 mm
    max: 4.5 mm
    src: p4 "B3F-1100/1102/1105/1102-G front view, board to plunger top 4.3±0.2"
  row_spacing:
    min: 6.4 mm
    typ: 6.5 mm
    max: 6.6 mm
    src: p4 "B3F-1100/1102/1105/1102-G, PCB Processing Dimensions, hole columns 6.5±0.1"
  hole_diameter:
    min: 0.95 mm
    typ: 1 mm
    max: 1.05 mm
    src: p4 "B3F-1100/1102/1105/1102-G, PCB Processing Dimensions, Five, 1±0.05 dia."
  tail_length:
    min: 3.1 mm
    typ: 3.5 mm
    max: 3.9 mm
    src: p4 "B3F-1100/1102/1105/1102-G front view, board to terminal tip 3.5 (±0.4 general tolerance)"
  actuator_diameter:
    min: 3.1 mm
    typ: 3.5 mm
    max: 3.9 mm
    src: p4 "B3F-1100/1102/1105/1102-G side view, plunger 3.5 dia. (±0.4 general tolerance)"
