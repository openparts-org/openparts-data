# OMRON B3F through-hole tactile switch, 6 x 6 mm, standard flat plunger
# without ground terminal, height 5.0 mm -- page-4 drawing "Standard, Flat
# Plunger Type (without Ground Terminal)" of omron/A070-E1-08.
# Orientation: OMRON draws the switch "rotated so that the terminals are
# on the right and left-hand sides" (page-4 note) -- the generator frame,
# no rotation. Pad numbers from "Terminal Arrangement/Internal Connections
# (Top View)" (4 3 / 2 1); "No terminal numbers are indicated on the
# Switches." Dimensions without a printed tolerance take the page's
# stated "±0.4 mm" general tolerance as min/max.
# Pads: the recommended PCB holes (6.5±0.1 x 4.5±0.1, 1±0.1 dia.); no land
# diameter is given (generator ring default). lead_width (0.7) not
# recorded (unused by THT pads); standoff not dimensioned.
schema_version: "0.2"
kind: package
id: manufacturers/omron/B3F-6x6-THT-H5.0
family: tact_switch_tht
lead_count: 4
source: omron/A070-E1-08

pitch:
  min: 4.3 mm
  typ: 4.5 mm
  max: 4.7 mm
  src: p4 ""Standard, Flat Plunger Type (without Ground Terminal)" top view, terminal pitch "4.5±0.2"; "PCB Processing Dimensions (Reference Only) (Top View)" "4.5±0.1""

pad_order:
  value: ["4", "2", "1", "3"]
  src:   'p4 ""Terminal Arrangement/Internal Connections (Top View)": "4" top-left, "2" bottom-left, "1" bottom-right, "3" top-right -> positions TL, BL, BR, TR = 4, 2, 1, 3"'

geometry: { type: parametric, generator: tact_switch_tht }

dimensions:
  body_width:
    min: 5.8 mm
    typ: 6 mm
    max: 6.2 mm
    src: p4 "top view, housing "6±0.2" (horizontal, across the terminal sides)"
  body_length:
    min: 5.8 mm
    typ: 6 mm
    max: 6.2 mm
    src: p4 "top view, housing "6±0.2" (vertical)"
  body_height:
    min: 3 mm
    typ: 3.4 mm
    max: 3.8 mm
    src: p4 "front view, board to housing top "3.4"; page-4 note "Unless otherwise specified, a tolerance of ±0.4 mm applies to all dimensions.""
  actuator_diameter:
    min: 3.1 mm
    typ: 3.5 mm
    max: 3.9 mm
    src: p4 "side view, plunger "3.5 dia." (±0.4 general tolerance note)"
  overall_height:
    min: 4.8 mm
    typ: 5 mm
    max: 5.2 mm
    src: 'p4 "front view, board to plunger top Note: "The height of B3F-1020, B3F-1022, B3F-1025, and B3F-1026 is 5±0.2 mm."; B3F-1022-G marked "(See note.)""'
  row_spacing:
    min: 6.4 mm
    typ: 6.5 mm
    max: 6.6 mm
    src: 'p4 ""PCB Processing Dimensions (Reference Only) (Top View)" hole columns "6.5±0.1" (the switch terminals: "6.5±0.5")"'
  hole_diameter:
    min: 0.9 mm
    typ: 1 mm
    max: 1.1 mm
    src: p4 ""PCB Processing Dimensions" "Four, 1±0.1 dia." (PCB thickness t=1.6)"
  tail_length:
    min: 3.1 mm
    typ: 3.5 mm
    max: 3.9 mm
    src: p4 "front view, board to terminal tip "3.5" (±0.4 general tolerance note)"
