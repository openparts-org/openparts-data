# OMRON G5V-1 PCB relay, 6 PCB terminals, from K048-E1-07 page 4
# "Dimensions" and "PCB Mounting Holes (Bottom View)" (rendered and read
# as an image). Housing 12.5 max x 7.5 max x 10 max (average 12.3 x 7.3
# x 9.9). Holes: "6-1 dia. holes"; columns 2.54 and 7.62 apart (10.16
# span), rows 5.08 apart; the average body edges sit (1.07) beyond the
# outer columns and (1.11) beyond the rows, so the grid is centred on the
# housing. Frame: top view = the bottom view mirrored left-right, long
# side along X: pin 1 at (+5.08, +2.54) (the bottom view's upper-left
# hole), 2 at +2.54, 5 at -5.08 on the same row; 10, 9, 6 below.
schema_version: "0.2"
kind: package
id: manufacturers/omron/G5V-1
family: relay
lead_count: { value: 6, src: 'p4 "PCB Mounting Holes (Bottom View), 6-1 dia. holes"' }
source: omron/K048-E1-07

pitch: { typ: 2.54 mm, src: 'p4 "PCB Mounting Holes (Bottom View), 2.54"' }
geometry: { type: parametric, generator: relay }

dimensions:
  body_width:  { max: 12.5 mm, src: 'p4 "Dimensions, 12.5 max. (12.3)*"' }
  body_length: { max: 7.5 mm, src: 'p4 "Dimensions, 7.5 max. (7.3)*"' }
  body_height: { max: 10 mm, src: 'p4 "Dimensions, 10 max. (9.9)*"' }
  tail_length: { typ: 3.5 mm, src: 'p4 "Dimensions, terminal length 3.5"' }

pads:
  value:
    - { number: "1", x: 5.08, y: 2.54, drill: 1 }
    - { number: "2", x: 2.54, y: 2.54, drill: 1 }
    - { number: "5", x: -5.08, y: 2.54, drill: 1 }
    - { number: "6", x: -5.08, y: -2.54, drill: 1 }
    - { number: "9", x: 2.54, y: -2.54, drill: 1 }
    - { number: "10", x: 5.08, y: -2.54, drill: 1 }
  src: p4 "PCB Mounting Holes (Bottom View) 2.54 / 7.62 / 10.16 x 5.08, mirrored to top view"
