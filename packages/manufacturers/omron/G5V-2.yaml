# 9.9 x 11.4). Holes: "Eight, 1 dia. holes"; columns at 0 / 7.62 / 12.70
# / 17.78 (7.62 + 5.08 + 5.08), rows 7.62 apart; the average body edges
# sit (1.3) beyond the outer columns and (1.2) beyond the rows, so the
# grid is centred on the housing (centre 8.89 from column 1). Frame: top
