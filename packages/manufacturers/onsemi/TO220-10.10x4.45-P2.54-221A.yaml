# onsemi TO-220-3 10.10x15.12x4.45, 2.54P, CASE 221A ISSUE AL
# (98ASB42148B, DATE 05 FEB 2025), read from 110-300 dpi renders of the
# standalone outline (image drawing; MILLIMETERS MIN / NOM / MAX table).
# Front view numbers the leads "1 2 3" left to right (leads down), the
# back view "3 2 1"; the STYLE list names terminal 4 (the tab).
#
# Mapping (frame to220): D (9.66/10.10/10.53, front view width) ->
# body_width; A (4.07/4.45/4.83, side view body front to tab back) ->
# body_length; E (14.48/15.12/15.75, tab top to datum B at the body
# underside) -> overall_height; b1 (0.64/0.80/0.96, the lead below the
# shoulder) -> lead_width; c (0.36/0.49/0.61) -> lead_thickness; L
# (12.70/13.49/14.27, datum B to lead tip) -> tail_length; OP (3.60/
# 3.85/4.09) -> mounting_hole_diameter; Q (2.54/2.79/3.04, tab top to
# hole centre) -> mounting_hole_inset; e (2.42/2.54/2.66) -> pitch.
# body_offset from printed nominals: A2 2.42 runs from the tab back
# face to the lead's tab-side face (side view), so the lead centre is
# A2 + c/2 = 2.42 + 0.245 = 2.665 from the back, the body centre
# A/2 = 2.225; offset = 0.44 (nominal only; flagged for review).
# body_height (flagged for review): the molding height has no letter of
# its own; E (tab top to body underside) and H1 (5.97/6.22/6.47, tab
# top to molding top) are stacked on the same axis, so the molding is
# E - H1 = 15.12 - 6.22 = 8.90 (nominals only; no min/max derived).
# Without it the generator would draw the molding at overall_height.
# Left out: A1 (tab thickness), b (lead shoulder), D1/E1 (back-side
# tab), E2 "1.27 REF", H1, L1, e1, Z. No land pattern is printed (drill
# and pad: generator defaults).
