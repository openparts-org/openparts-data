# onsemi CASE 751BD ISSUE O "SOIC-8, 150 mils" (DATE 19 DEC 2008,
# document 98AON34272E; note 2 "Complies with JEDEC MS-012"), read from
# page 11 of the CAT24C256 datasheet (CAT24C256/D Rev. 16, February
# 2022 -- the outline is older than the datasheet). The dimension table
# extracts as text; the page was also rendered to read the arrows: D is
# the body length along the leads (side view), E1 the molded width, E
# the lead-tip span, A the overall height from the seating plane.
#
# Every row is MIN/MAX only except e "1.27 BSC"; no nominal is
# recorded. No A2 is given, so A (1.35-1.75) is recorded as body_height
# and no overall_height (skill rule). Chamfer h 0.25-0.50 and the 0-8
# deg foot angle are not modelled. Not standards/SOIC8-3.90x4.90-P1.27
# (Microchip BSC values) nor manufacturers/ti/D0008A (b 0.31-0.51,
# c 0.13-0.25): the numbers differ.
schema_version: "0.2"
kind: package
id: manufacturers/onsemi/SOIC8-3.90x4.90-P1.27-751BD
family: soic
lead_count: 8
source: onsemi/CAT24C256-D

pitch: { typ: 1.27 mm, src: 'p11 "CASE 751BD ISSUE O dimension table, e "1.27 BSC""' }
geometry: { type: parametric, generator: soic }

dimensions:
  body_width:
    min: 3.8 mm
    max: 4 mm
    src: p11 "CASE 751BD, E1 "3.80 / 4.00" (molded width, top view)"
  body_length:
    min: 4.8 mm
    max: 5 mm
    src: p11 "CASE 751BD, D "4.80 / 5.00" (side view, body length along the leads)"
  body_height:
    min: 1.35 mm
    max: 1.75 mm
    src: p11 "CASE 751BD, A "1.35 / 1.75" (overall height; no A2 given)"
  lead_thickness: { min: 0.19 mm, max: 0.25 mm, src: 'p11 "CASE 751BD, c "0.19 / 0.25""' }
  overall_width:
    min: 5.8 mm
    max: 6.2 mm
    src: p11 "CASE 751BD, E "5.80 / 6.20" (lead-tip span, top view)"
  standoff:       { min: 0.1 mm, max: 0.25 mm, src: 'p11 "CASE 751BD, A1 "0.10 / 0.25""' }
  lead_width:     { min: 0.33 mm, max: 0.51 mm, src: 'p11 "CASE 751BD, b "0.33 / 0.51""' }
  lead_length:    { min: 0.4 mm, max: 1.27 mm, src: 'p11 "CASE 751BD, L "0.40 / 1.27" (end view)"' }
