# onsemi SOT-223 CASE 318H ISSUE B (98ASH70634A, DATE 13 MAY 2020), as
# printed in NCP1117/D Rev. 31 page 17, read from the rendered drawing
# and its MILLIMETERS table (MIN / NOM / MAX).
#
# TAB NUMBER: the outline's top view numbers the leads 1 2 3 and the tab
# "4". The datasheet's page-1 PIN CONFIGURATION labels the tab only
# "Tab" and says "Heatsink tab is connected to Pin 2." -- the drawing's
# "4" is the only number the source prints for the tab, so tab = "4"
# and the device keys pin "4" as the Output (cf. ti/UA78M33 + KVU).
#
# Not onsemi's CASE 318E (BCP56 etc.: A 1.50-1.75, b1 2.90-3.20) and not
# the Diodes SOT223 drawings (E 3.45-3.55 / 3.30-3.70 with different
# lead and height values): its own package.
#
# Symbol mapping (frame: leads left, tab right): E1 (3.30/3.50/3.70,
# body across the lead direction) -> body_width; D (6.30/6.50/6.70,
# along the lead row) -> body_length; E (6.70/7.00/7.30, lead toe to
# tab toe) -> overall_width; b -> lead_width; b1 -> tab_width;
# c -> lead_thickness (no nominal printed); L (0.25 MIN only, foot in
# DETAIL A) -> lead_length min only; A1 -> standoff; A ("1.80" MAX only,
# no A2 in the table) -> body_height max only. e "2.30 BSC" -> pitch.
# Left out: angle 0-10 deg, the recommended footprint.
schema_version: "0.2"
kind: package
id: manufacturers/onsemi/SOT223-3.5x6.5-P2.3-318H-TabPin4
family: sot223
lead_count: 3
source: onsemi/NCP1117-D

pitch: { typ: 2.3 mm, src: 'p17 "CASE 318H ISSUE B MILLIMETERS table, DIM "e" "2.30 BSC""' }

tab:
  number: "4"
  src:
    - 'p17 "CASE 318H TOP VIEW: leads numbered 1 2 3, tab numbered "4""'
    - 'p1 "PIN CONFIGURATION SOT-223 (Top View): tab labelled "Tab"; "Heatsink tab is connected to Pin 2.""'

geometry: { type: parametric, generator: sot223 }

dimensions:
  body_width:
    min: 3.3 mm
    typ: 3.5 mm
    max: 3.7 mm
    src: p17 "CASE 318H table, DIM "E1" (3.30 / 3.50 / 3.70)"
  body_length:
    min: 6.3 mm
    typ: 6.5 mm
    max: 6.7 mm
    src: p17 "CASE 318H table, DIM "D" (6.30 / 6.50 / 6.70)"
  body_height: { max: 1.8 mm, src: 'p17 "CASE 318H table, DIM "A" (MAX 1.80 only; no A2)"' }
  tab_width:
    min: 2.9 mm
    typ: 3 mm
    max: 3.1 mm
    src: p17 "CASE 318H table, DIM "b1" (2.90 / 3.00 / 3.10)"
  overall_width:
    min: 6.7 mm
    typ: 7 mm
    max: 7.3 mm
    src: p17 "CASE 318H table, DIM "E" (6.70 / 7.00 / 7.30), lead toe to tab toe in the TOP VIEW"
  standoff:
    min: 0.02 mm
    typ: 0.06 mm
    max: 0.11 mm
    src: p17 "CASE 318H table, DIM "A1" (0.02 / 0.06 / 0.11)"
  lead_width:
    min: 0.6 mm
    typ: 0.74 mm
    max: 0.88 mm
    src: p17 "CASE 318H table, DIM "b" (0.60 / 0.74 / 0.88)"
  lead_length:
    min: 0.25 mm
    src: p17 "CASE 318H table, DIM "L" (MIN 0.25 only), foot in DETAIL A"
  lead_thickness:
    min: 0.24 mm
    max: 0.35 mm
    src: p17 "CASE 318H table, DIM "c" (0.24 / --- / 0.35)"
