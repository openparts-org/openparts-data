  overall_height:
    min: 4.06 mm
    max: 4.83 mm
    src: p1 "INCHES / MILLIMETERS table, "C" (0.160-0.190 in / 4.06-4.83 mm)"
  lead_width:
    min: 0.51 mm
    max: 0.89 mm
    src: p1 "INCHES / MILLIMETERS table, "D" (0.020-0.035 in / 0.51-0.89 mm), "D 3 PL""
  lead_length:
