# onsemi D2PAK 3, CASE 418B-04 ISSUE L (98ASB42761B, DATE 17 FEB 2015),
# read from 110-300 dpi renders of the standalone outline page 1 and its
# INCHES / MILLIMETERS MIN-MAX table (controlling dimension: inch, note
# 2; the table's own millimetre column is recorded).
#
# TAB NUMBER: the top view numbers the leads "1 2 3" and the tab "4";
# lead 2 is drawn as a stub cut at the body -> tab "4",
# trimmed_leads ["2"]. STYLE 2: "PIN 1. GATE 2. DRAIN 3. SOURCE
# 4. DRAIN".
#
# Mapping (frame d2pak: leads left, tab right): A (8.64-9.65, side view
# body along the leads below the tab shoulder) -> body_width; B (9.65-
# 10.29, top view across) -> body_length; S (14.60-15.88, tab end to
# lead toe) -> overall_width; C (4.06-4.83) -> overall_height; D (0.51-
# 0.89, "3 PL") -> lead_width; K (2.29-2.79, the foot along the seating
# plane) -> lead_length; J (0.46-0.64) -> lead_thickness; V (1.14-1.40,
# tab protrusion beyond the body) -> tab_length; G "2.54 BSC" -> pitch.
# tab_width (flagged): F (7.87-8.89), the VIEW W-W exposed tab width,
# recorded as the soldered tab width (the tab end in the top view runs
# the full chamfered width B).
# Left out: E (tab thickness), H (lead offset), L/M/N/P/R/U (exposed-pad
# variants of VIEW W-W), standoff (not given), and the page-2 footprint.
schema_version: "0.2"
kind: package
id: manufacturers/onsemi/TO263-D2PAK3-418B-TabPin4
family: d2pak
lead_count: 3
source: onsemi/98ASB42761B

