  tab_length:
    min: 1.14 mm
    max: 1.4 mm
    src: p1 "INCHES / MILLIMETERS table, "V" (0.045-0.055 in / 1.14-1.40 mm), tab beyond the body"
  tab_width:
    min: 7.87 mm
    max: 8.89 mm
    src: p1 "INCHES / MILLIMETERS table, "F" (0.310-0.350 in / 7.87-8.89 mm), VIEW W-W exposed tab width (see header)"
  overall_width:
    min: 14.6 mm
