# onsemi "SOT-23/SUPERSOT-23, 3 LEAD, 1.4x2.9" CASE 527AG ISSUE A
# (document 98AON34319E, DATE 09 DEC 2019), as printed in FDN340P/D
# Rev. 9 page 5 (also NDS331N/D Rev. 8 page 8 and FDN337N/D Rev. 5
# page 5: a 100 dpi render of the drawing area of all three pages is
# pixel-identical). Read from a 300 dpi render of the MIN / NOM / MAX
# table (image-only).
#
# Not onsemi's CASE 318 (standards/SOT23-2.90x1.30-P1.90): wider body
# E1 1.20/1.40/1.52 vs E 1.20/1.30/1.40, and A, A1, b, c, L all differ.
#
# Symbol mapping (sot generator convention, see
# standards/SOT23-2.90x1.30-P1.90): D (2.80/2.92/3.04, along the
# two-lead row) -> body_width; E1 (body across the rows) ->
# body_length; E (lead-tip span) -> overall_length; e1 "1.90 BSC"
# (pins 1-2 spacing; e "0.95 BSC" is half of it) -> pitch; A (no A2 in
# the table) -> body_height; A1 -> standoff; b -> lead_width; c ->
# lead_thickness; L (foot, DETAIL A) -> lead_length. The top view
# numbers the bottom-left lead "1" and bottom-right "2".
# Left out: reference values (0.29), (0.94), (0.56) -- parenthesised in
# the drawing, not in the table; the land pattern.
