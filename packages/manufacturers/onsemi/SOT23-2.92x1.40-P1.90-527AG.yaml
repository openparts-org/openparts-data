# onsemi "SOT-23/SUPERSOT-23, 3 LEAD, 1.4x2.9" CASE 527AG ISSUE A
# (document 98AON34319E, DATE 09 DEC 2019), as printed in FDN340P/D
# Rev. 9 page 5 (also NDS331N/D Rev. 8 page 8 and FDN337N/D Rev. 5
# page 5: a 100 dpi render of the drawing area of all three pages is
# pixel-identical). Read from a 300 dpi render of the MIN / NOM / MAX
# table (image-only).
#
# Not onsemi's CASE 318 (standards/SOT23-2.90x1.30-P1.90): wider body
# E1 1.20/1.40/1.52 vs E 1.20/1.30/1.40, and A, A1, b, c, L all differ.
#
# Symbol mapping (sot generator convention, see
# standards/SOT23-2.90x1.30-P1.90): D (2.80/2.92/3.04, along the
# two-lead row) -> body_width; E1 (body across the rows) ->
# body_length; E (lead-tip span) -> overall_length; e1 "1.90 BSC"
# (pins 1-2 spacing; e "0.95 BSC" is half of it) -> pitch; A (no A2 in
# the table) -> body_height; A1 -> standoff; b -> lead_width; c ->
# lead_thickness; L (foot, DETAIL A) -> lead_length. The top view
# numbers the bottom-left lead "1" and bottom-right "2".
# Left out: reference values (0.29), (0.94), (0.56) -- parenthesised in
# the drawing, not in the table; the land pattern.
schema_version: "0.2"
kind: package
id: manufacturers/onsemi/SOT23-2.92x1.40-P1.90-527AG
family: sot
lead_count: 3

lead_layout:
  value: [2, 1]
  src:   'p5 "CASE 527AG TOP VIEW: two leads (numbered 1, 2) on the bottom edge, one lead on the top edge"'

source: onsemi/FDN340P-D

pitch:
  typ: 1.9 mm
  src: p5 "CASE 527AG table, DIM "e1" "1.90 BSC" (pins 1-2 spacing in the TOP VIEW)"

geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 2.8 mm
    typ: 2.92 mm
    max: 3.04 mm
    src: p5 "CASE 527AG table, DIM "D" (2.80 / 2.92 / 3.04)"
  body_length:
    min: 1.2 mm
    typ: 1.4 mm
    max: 1.52 mm
    src: p5 "CASE 527AG table, DIM "E1" (1.20 / 1.40 / 1.52), body across the lead rows"
  body_height:
    min: 0.85 mm
    typ: 0.95 mm
    max: 1.12 mm
    src: p5 "CASE 527AG table, DIM "A" (0.85 / 0.95 / 1.12); no A2 in the table"
  lead_thickness:
    min: 0.085 mm
    typ: 0.15 mm
    max: 0.18 mm
    src: p5 "CASE 527AG table, DIM "c" (0.085 / 0.150 / 0.180)"
  overall_length:
    min: 2.31 mm
    typ: 2.51 mm
    max: 2.71 mm
    src: p5 "CASE 527AG table, DIM "E" (2.31 / 2.51 / 2.71), lead-tip span in the TOP VIEW"
  standoff:
    min: 0 mm
    typ: 0.05 mm
    max: 0.1 mm
    src: p5 "CASE 527AG table, DIM "A1" (0.00 / 0.05 / 0.10)"
  lead_width:
    min: 0.37 mm
    typ: 0.435 mm
    max: 0.508 mm
    src: p5 "CASE 527AG table, DIM "b" (0.370 / 0.435 / 0.508)"
  lead_length:
    min: 0.33 mm
    typ: 0.38 mm
    max: 0.43 mm
    src: p5 "CASE 527AG table, DIM "L" (0.33 / 0.38 / 0.43), foot in DETAIL A"
