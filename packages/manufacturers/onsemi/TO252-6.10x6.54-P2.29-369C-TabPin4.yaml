# lead-side edge) -> body_width; E (6.35/6.54/6.73, along the lead row)
# -> body_length; H (9.40/9.91/10.41, lead toe to tab end) ->
# overall_width; L3 (0.89-1.27, body edge to tab end) -> tab_length;
# b3 (4.57/5.02/5.46) -> tab_width; b -> lead_width; c -> lead_thickness;
# L (1.40/1.59/1.78, DETAIL A foot) -> lead_length; A1 -> standoff; A
# (2.18/2.28/2.38; the table has no A2) -> body_height. e "2.29 BSC" ->
# pitch. Left out: b2 (wider lead shoulder), c2 (tab thickness), L1
# "2.90 REF", L2 "0.51 BSC" gauge plane, L4, Z (thermal-pad contour,
# note 3 "optional"), the alternate constructions.
