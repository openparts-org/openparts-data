# onsemi DPAK-3 6.10x6.54x2.28, 2.29P, CASE 369C ISSUE L (98AON10527D,
# DATE 24 AUG 2026), read from the rendered drawing and MILLIMETERS
# table (MIN / NOM / MAX) in MC7800/D Rev. 29 page 26; the identical
# drawing and table (every value) are printed in NCP1117/D Rev. 31
# page 18.
#
# TAB NUMBER: the outline's 3-D view and TOP VIEW number the tab "4"
# (leads 1 2 3). MC7800/D page 1 states it outright: "Heatsink surface
# (shown as terminal 4 in case outline drawing) is connected to Pin 2."
# NCP1117/D page 1 labels the DPAK tab "Tab" and says "Heatsink tab is
# connected to Pin 2." Tab = "4". Lead 2 (centre) is drawn as a stub
# cut at the body in the TOP VIEW and BOTTOM VIEW -> trimmed.
#
# Symbol mapping (frame: leads left, tab right, as TO252-...-TI-KVU):
# D (5.97/6.10/6.22, TOP VIEW from datum B / tab-side body edge to the
# lead-side edge) -> body_width; E (6.35/6.54/6.73, along the lead row)
# -> body_length; H (9.40/9.91/10.41, lead toe to tab end) ->
# overall_width; L3 (0.89-1.27, body edge to tab end) -> tab_length;
# b3 (4.57/5.02/5.46) -> tab_width; b -> lead_width; c -> lead_thickness;
# L (1.40/1.59/1.78, DETAIL A foot) -> lead_length; A1 -> standoff; A
# (2.18/2.28/2.38; the table has no A2) -> body_height. e "2.29 BSC" ->
# pitch. Left out: b2 (wider lead shoulder), c2 (tab thickness), L1
# "2.90 REF", L2 "0.51 BSC" gauge plane, L4, Z (thermal-pad contour,
# note 3 "optional"), the alternate constructions.
schema_version: "0.2"
kind: package
id: manufacturers/onsemi/TO252-6.10x6.54-P2.29-369C-TabPin4
family: dpak
lead_count: 3
source: onsemi/MC7800-D

pitch: { typ: 2.29 mm, src: 'p26 "CASE 369C ISSUE L MILLIMETERS table, DIM "e" "2.29 BSC""' }

tab:
  number: "4"
  trimmed_leads: ["2"]
  src:
    - 'p1 "DPAK-3 DT SUFFIX CASE 369C: "Heatsink surface (shown as terminal 4 in case outline drawing) is connected to Pin 2.""'
    - 'p26 "CASE 369C 3-D view and TOP VIEW: tab numbered "4", leads 1 2 3, lead 2 drawn as a stub cut at the body"'
    - 'onsemi/NCP1117-D p1 "PIN CONFIGURATION DPAK (Top View): tab labelled "Tab"; "Heatsink tab is connected to Pin 2.""'

geometry: { type: parametric, generator: dpak }

dimensions:
  body_width:
    min: 5.97 mm
    typ: 6.1 mm
    max: 6.22 mm
    src: p26 "CASE 369C table, DIM "D" (5.97 / 6.10 / 6.22), TOP VIEW datum B to lead-side body edge"
  body_length:
    min: 6.35 mm
    typ: 6.54 mm
    max: 6.73 mm
    src: p26 "CASE 369C table, DIM "E" (6.35 / 6.54 / 6.73)"
  body_height:
    min: 2.18 mm
    typ: 2.28 mm
    max: 2.38 mm
    src: p26 "CASE 369C table, DIM "A" (2.18 / 2.28 / 2.38); no A2 in the table"
  tab_length:
    min: 0.89 mm
    max: 1.27 mm
    src: p26 "CASE 369C table, DIM "L3" (0.89 / --- / 1.27)"
  overall_width:
    min: 9.4 mm
    typ: 9.91 mm
    max: 10.41 mm
    src: p26 "CASE 369C table, DIM "H" (9.40 / 9.91 / 10.41)"
  standoff: { min: 0 mm, max: 0.13 mm, src: 'p26 "CASE 369C table, DIM "A1" (0.00 / --- / 0.13)"' }
  lead_width:
    min: 0.63 mm
    typ: 0.76 mm
    max: 0.89 mm
    src: p26 "CASE 369C table, DIM "b" (0.63 / 0.76 / 0.89)"
  lead_length:
    min: 1.4 mm
    typ: 1.59 mm
    max: 1.78 mm
    src: p26 "CASE 369C table, DIM "L" (1.40 / 1.59 / 1.78), DETAIL A"
  lead_thickness:
    min: 0.46 mm
    typ: 0.54 mm
    max: 0.61 mm
    src: p26 "CASE 369C table, DIM "c" (0.46 / 0.54 / 0.61)"
  tab_width:
    min: 4.57 mm
    typ: 5.02 mm
    max: 5.46 mm
    src: p26 "CASE 369C table, DIM "b3" (4.57 / 5.02 / 5.46)"
