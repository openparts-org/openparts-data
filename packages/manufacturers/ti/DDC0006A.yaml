# NOTE (2026-11-10): out of date below -- the generators now draw a
# min/max-only dimension at its midpoint (never stored; openparts-mcad
# defaults::required), so this package does generate a footprint and model.
# TI DDC0006A "SOT-23 - 1.1 max height" (SOT-23-THIN 6-lead; drawing
# 4214841/E 08/2024, JEDEC MO-193 per its note 3), read from the
# rendered outline page of SLVSCB0E (page 33). Millimetres as printed.
#
# Field mapping for the `sot` generator (leads exit across
# body_length): body_width = D 2.75-3.05 (long side, along the lead
# rows), body_length = E1 1.45-1.75 (molded width across the rows),
# overall_length = lead-tip span 2.55-3.05. lead_layout [3, 3]: pins
# 1-2-3 down one edge, 4-5-6 back up the other (top view, page 33 and
# the page-4 pin diagram).
#
# Body ranges only, no nominal recorded (canonical-data 20.1); the sot
# generator currently needs a body nominal, so this package does not
# render a 3D model/footprint. Standoff is printed "0.1 / 0.0 TYP" and
# recorded as that range.
schema_version: "0.2"
kind: package
id: manufacturers/ti/DDC0006A
family: sot
lead_count: 6
lead_layout: [3, 3]
source: ti/SLVSCB0E

pitch:
  typ: 0.95 mm
  src: p33 "DDC0006A outline, "4X 0.95" (basic; "1.9" basic across pins 1-3)"

geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 2.75 mm
    max: 3.05 mm
    src: p33 "DDC0006A outline, body length along the rows "3.05 / 2.75" -- see field-mapping note"
  body_length:
    min: 1.45 mm
    max: 1.75 mm
    src: p33 "DDC0006A outline, molded body width "1.75 / 1.45" -- see field-mapping note"
  lead_thickness:
    min: 0.12 mm
    max: 0.2 mm
    src: p33 "DDC0006A lead detail, "0.20 / 0.12 TYP""
  lead_length:    { min: 0.3 mm, max: 0.6 mm, src: 'p33 "DDC0006A lead detail, "0.6 / 0.3 TYP""' }
  overall_length:
    min: 2.55 mm
    max: 3.05 mm
    src: p33 "DDC0006A outline, lead-tip span "3.05 / 2.55""
  overall_height: { min: 0.7 mm, max: 1.1 mm, src: 'p33 "DDC0006A side view, height "1.1 / 0.7""' }
  standoff:       { min: 0 mm, max: 0.1 mm, src: 'p33 "DDC0006A side view, "0.1 / 0.0 TYP""' }
  lead_width:     { min: 0.3 mm, max: 0.5 mm, src: 'p33 "DDC0006A outline, "6X 0.5 / 0.3""' }
