# NOTE (2026-11-10): out of date below -- the generators now draw a
# min/max-only dimension at its midpoint (never stored; openparts-mcad
# defaults::required), so this package does generate a footprint and model.
# TI DDC0006A "SOT-23 - 1.1 max height" (SOT-23-THIN 6-lead; drawing
# 4214841/E 08/2024, JEDEC MO-193 per its note 3), read from the
# rendered outline page of SLVSCB0E (page 33). Millimetres as printed.
#
# Field mapping for the `sot` generator (leads exit across
# body_length): body_width = D 2.75-3.05 (long side, along the lead
# rows), body_length = E1 1.45-1.75 (molded width across the rows),
# overall_length = lead-tip span 2.55-3.05. lead_layout [3, 3]: pins
# 1-2-3 down one edge, 4-5-6 back up the other (top view, page 33 and
# the page-4 pin diagram).
#
# Body ranges only, no nominal recorded (canonical-data 20.1); the sot
# generator currently needs a body nominal, so this package does not
# render a 3D model/footprint. Standoff is printed "0.1 / 0.0 TYP" and
# recorded as that range.
schema_version: "0.1"
kind: package
id: manufacturers/ti/DDC0006A

family: sot
lead_count: 6
lead_layout: [3, 3]

pitch:
  nominal: 0.95
  unit: mm

dimensions:
  body_width:
    min: 2.75
    max: 3.05
    unit: mm
  body_length:
    min: 1.45
    max: 1.75
    unit: mm
  overall_length:
    min: 2.55
    max: 3.05
    unit: mm
  overall_height:
    min: 0.7
    max: 1.1
    unit: mm
  standoff:
    min: 0.0
    max: 0.1
    unit: mm
  lead_width:
    min: 0.3
    max: 0.5
    unit: mm
  lead_length:
    min: 0.3
    max: 0.6
    unit: mm
  lead_thickness:
    min: 0.12
    max: 0.20
    unit: mm

geometry:
  type: parametric
  generator: sot

provenance:
  "/pitch":
    - source: ti/SLVSCB0E
      page: 33
      locator: "DDC0006A outline, \"4X 0.95\" (basic; \"1.9\" basic across pins 1-3)"
  "/dimensions/body_width":
    - source: ti/SLVSCB0E
      page: 33
      locator: "DDC0006A outline, body length along the rows \"3.05 / 2.75\" -- see field-mapping note"
  "/dimensions/body_length":
    - source: ti/SLVSCB0E
      page: 33
      locator: "DDC0006A outline, molded body width \"1.75 / 1.45\" -- see field-mapping note"
  "/dimensions/overall_length":
    - source: ti/SLVSCB0E
      page: 33
      locator: "DDC0006A outline, lead-tip span \"3.05 / 2.55\""
  "/dimensions/overall_height":
    - source: ti/SLVSCB0E
      page: 33
      locator: "DDC0006A side view, height \"1.1 / 0.7\""
  "/dimensions/standoff":
    - source: ti/SLVSCB0E
      page: 33
      locator: "DDC0006A side view, \"0.1 / 0.0 TYP\""
  "/dimensions/lead_width":
    - source: ti/SLVSCB0E
      page: 33
      locator: "DDC0006A outline, \"6X 0.5 / 0.3\""
  "/dimensions/lead_length":
    - source: ti/SLVSCB0E
      page: 33
      locator: "DDC0006A lead detail, \"0.6 / 0.3 TYP\""
  "/dimensions/lead_thickness":
    - source: ti/SLVSCB0E
      page: 33
      locator: "DDC0006A lead detail, \"0.20 / 0.12 TYP\""
