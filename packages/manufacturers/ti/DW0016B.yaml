# TI DW0016B "SOIC - 2.65 mm max height" (16-lead wide SOIC, 1.27 mm
# pitch; drawing 4221009/B 07/2016, JEDEC MS-013 per its note 5), read
# from the PACKAGE OUTLINE page of SLLSEP4K (PDF page 46) and the EXAMPLE
# BOARD LAYOUT page (page 47). Millimetres as printed. The printed body
# numbers equal manufacturers/ti/DW0016A, but it is a different TI
# drawing (number, isolation land pattern), so it is its own package.
# Ranges only for the body; only "2.65 MAX" overall height, no A2.
# pads: "LAND PATTERN EXAMPLE, IPC-7351 NOMINAL" (left of the two
# variants; the right one is the HV / isolation option): 16X (2) x
# (0.6) pads, pad-centre row spacing (9.3) -> x = ±4.65; 14X (1.27)
# pitch -> y = ±0.635 ... ±4.445. Pin 1 top-left.
