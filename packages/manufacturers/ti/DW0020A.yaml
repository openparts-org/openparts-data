# TI DW0020A "SOIC - 2.65 mm max height" (20-lead wide SOIC, 1.27 mm
# pitch; drawing 4220724/A 05/2016, JEDEC MS-013 per its note 5), read
# from the rendered outline page of SCLS131F (PDF page 32). Millimetres
# as printed.
#
# Top view: pins 1-10 down the left edge, 11-20 up the right edge.
# Ranges only: E1 "7.6/7.4 NOTE 4" (body_width, datum B), D "13.0/12.6
# NOTE 3" (body_length, datum A); lead span "10.63/9.97 TYP" recorded as
# min/max. Only the overall height "2.65 MAX" is given -- no A2 -- so it
# is overall_height max with no body_height (as manufacturers/ti/D0014A).
# Pitch "18X 1.27" (basic); "2X 11.43" basic is pin 1 to pin 10.
schema_version: "0.2"
kind: package
id: manufacturers/ti/DW0020A
family: soic
lead_count: 20
source: ti/SCLS131F

pitch:
  typ: 1.27 mm
  src: p32 "PACKAGE OUTLINE DW0020A (4220724/A), "18X 1.27" (basic); "2X 11.43" basic"

geometry: { type: parametric, generator: soic }

dimensions:
  body_width:
    min: 7.4 mm
    max: 7.6 mm
    src: p32 "DW0020A, body width "7.6 / 7.4 NOTE 4" (datum B)"
  body_length:
    min: 12.6 mm
    max: 13 mm
    src: p32 "DW0020A, body length "13.0 / 12.6 NOTE 3" (datum A)"
  lead_thickness:
    min: 0.1 mm
    max: 0.33 mm
    src: p32 "DW0020A, lead thickness "0.33 / 0.10 TYP""
  lead_length:
    min: 0.4 mm
    max: 1.27 mm
    src: p32 "DW0020A DETAIL A, foot length "1.27 / 0.40""
  overall_width:
    min: 9.97 mm
    max: 10.63 mm
    src: p32 "DW0020A, lead-tip span "10.63 / 9.97 TYP" (min/max only)"
  overall_height: { max: 2.65 mm, src: 'p32 "DW0020A side view, "2.65 MAX""' }
  standoff:       { min: 0.1 mm, max: 0.3 mm, src: 'p32 "DW0020A DETAIL A, standoff "0.3 / 0.1""' }
  lead_width:     { min: 0.31 mm, max: 0.51 mm, src: 'p32 "DW0020A, "20X 0.51 / 0.31""' }
