# TI KCS0003B, TO-220 3-lead (straight leads, vertical mount), outline
# drawing 4222214/B 08/2018 ("Reference JEDEC registration TO-220"),
# SLVS044Z (LM317) page 38, read from the rendered drawing; example
# board layout on page 39. The same drawing (identical pdftotext -layout
# text, same number and revision) is in SLVS056P (uA78xx) page 24.
#
# Frame (to220): front view with leads down, pin 1 on the left (drawing
# labels "1" and "3" under the leads), tab behind.
#
# Mapping: 9.96-10.36 -> body_width (E); 4.4-4.7 (side view, body front
# to tab back) -> body_length; 9.05-9.25 (molding height) ->
# body_height; tab top to body underside = tab section 6.1-6.5 + molding
# 9.05-9.25 -> overall_height 15.15-15.75 (sum of the two printed
# stacked dimensions; consistent with "19.65 MAX" = 15.75 + "3X 3.9
# MAX"); (O 3.84) mounting hole -> mounting_hole_diameter, reference
# value (parenthesised); tab top to hole centre 2.6-2.9 ->
# mounting_hole_inset; 3X 0.77-0.90 -> lead_width; 0.34-0.47 ->
# lead_thickness; 12.70-13.12 (body underside to lead tip) ->
# tail_length. Land pattern example (page 39): "3X O (1.2)" hole ->
# hole_diameter, "2X O (1.7) METAL" / pin 1 square (1.7) ->
# pad_diameter; both parenthesised reference values.
# Left out: tab thickness 1.22-1.32, lead shoulder width 1.23-1.36,
# the 2.59-2.79 lead-to-tab-back distance (body_offset is not printed
# directly; the generator default is used), (6.3)/8.15-8.55/12.1-12.5
# back-side tab outline.
schema_version: "0.2"
kind: package
id: manufacturers/ti/KCS0003B
family: to220
lead_count: 3
source: ti/SLVS044Z

pitch:
  typ: 2.54 mm
  src: p38 "KCS0003B outline (4222214/B), front view, basic "2X 2.54" (lead 1-3 basic "5.08")"

geometry: { type: parametric, generator: to220 }

dimensions:
  body_width:
    min: 9.96 mm
    max: 10.36 mm
    src: p38 "KCS0003B outline, front view, width "10.36 / 9.96""
  body_length:
    min: 4.4 mm
    max: 4.7 mm
    src: p38 "KCS0003B outline, side view, body front to tab back "4.7 / 4.4""
  body_height:
    min: 9.05 mm
    max: 9.25 mm
    src: p38 "KCS0003B outline, front view, molded body height "9.25 / 9.05""
  pad_diameter:
    typ: 1.7 mm
    src: p39 "KCS0003B EXAMPLE BOARD LAYOUT, "2X O (1.7) METAL", pin 1 square "(1.7)" (reference)"
  overall_height:
    min: 15.15 mm
    max: 15.75 mm
    src: p38 "KCS0003B outline, front view, stacked "6.5 / 6.1" (tab top to body top) + "9.25 / 9.05" (body) = 15.15 / 15.75 ("19.65 MAX" overall incl. "3X 3.9 MAX" lead shoulder)"
  lead_width:
    min: 0.77 mm
    max: 0.9 mm
    src: p38 "KCS0003B outline, front view "3X 0.90 / 0.77""
  lead_thickness:
    min: 0.34 mm
    max: 0.47 mm
    src: p38 "KCS0003B outline, side view, lead "0.47 / 0.34""
  hole_diameter:
    typ: 1.2 mm
    src: p39 "KCS0003B EXAMPLE BOARD LAYOUT, land pattern example "3X O (1.2)" (reference)"
  mounting_hole_diameter:
    typ: 3.84 mm
    src: p38 "KCS0003B outline, front view "(O 3.84)" -- parenthesised, reference only (note 1)"
  mounting_hole_inset:
    min: 2.6 mm
    max: 2.9 mm
    src: p38 "KCS0003B outline, front view, tab top to hole centre "2.9 / 2.6""
  tail_length:
    min: 12.7 mm
    max: 13.12 mm
    src: p38 "KCS0003B outline, front view, body underside to lead tip "13.12 / 12.70""
