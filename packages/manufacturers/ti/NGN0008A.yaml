      page: 38
      locator: "NGN0008A outline (4214794/A), side view \"0.05 / 0.00\""
  "/dimensions/lead_width":
    - source: ti/SNOS412Q
      page: 38
      locator: "NGN0008A outline (4214794/A), bottom view \"8X 0.35 / 0.25\""
  "/dimensions/lead_length":
