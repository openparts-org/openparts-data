# TI NGN0008A, WSON-8, 4x4 mm, 0.8 mm pitch, 0.8 mm max height. Outline drawing NGN0008A
# (4214794/A 11/2019) in SNOS412Q page 38, read from the rendered drawing.
# The same page (identical pdftotext -layout text) is in SNVS769J (LM2940) page 32.
#
# Mapping: D/E limits -> body_width/body_length (no nominal printed);
# A max (no A2) -> body_height only; A1 -> standoff; b -> lead_width;
# L -> lead_length; thermal pad +- tolerance -> exposed_pad nominal with
# min/max.
# Bottom view numbers terminals 1-4 up the left and 5-8 down the right with
# the thermal pad "9"; seen from the top this is pin 1 top-left, down the
# left, up the right (SOIC order) as the son generator expects.
# Left out: the side-view "(0.2) TYP" (side-wall metal; not stated to be
# the terminal thickness A3), the (0.25)/(0.2)/(0.15) pin-1 ID chamfer
# details, "2X 2.4" row span.
schema_version: "0.2"
kind: package
id: manufacturers/ti/NGN0008A
family: son
lead_count: 8
source: ti/SNOS412Q

pitch: { typ: 0.8 mm, src: 'p38 "NGN0008A outline (4214794/A), bottom view, basic "6X 0.8""' }
geometry: { type: parametric, generator: son }

dimensions:
  body_width:
    min: 3.9 mm
    max: 4.1 mm
    src: p38 "NGN0008A outline (4214794/A), top view, width "4.1 / 3.9" (across the two terminal rows)"
  body_length:
    min: 3.9 mm
    max: 4.1 mm
    src: p38 "NGN0008A outline (4214794/A), top view, length "4.1 / 3.9""
  body_height: { max: 0.8 mm, src: 'p38 "NGN0008A outline (4214794/A), side view "0.8 MAX""' }
  exposed_pad:
    src:    p38 "NGN0008A outline (4214794/A), bottom view, thermal pad "2.2 +-0.05" (across the rows); bottom view, thermal pad "3 +-0.05" (along the rows)"
    width:  { min: 2.15 mm, typ: 2.2 mm, max: 2.25 mm }
    length: { min: 2.95 mm, typ: 3 mm, max: 3.05 mm }
  standoff:
    min: 0 mm
    max: 0.05 mm
    src: p38 "NGN0008A outline (4214794/A), side view "0.05 / 0.00""
  lead_width:
    min: 0.25 mm
    max: 0.35 mm
    src: p38 "NGN0008A outline (4214794/A), bottom view "8X 0.35 / 0.25""
  lead_length:
    min: 0.4 mm
    max: 0.6 mm
    src: p38 "NGN0008A outline (4214794/A), bottom view "8X 0.6 / 0.4""
