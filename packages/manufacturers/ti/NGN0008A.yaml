      page: 38
      locator: "NGN0008A outline (4214794/A), top view, width \"4.1 / 3.9\" (across the two terminal rows)"
  "/dimensions/body_length":
    - source: ti/SNOS412Q
      page: 38
      locator: "NGN0008A outline (4214794/A), top view, length \"4.1 / 3.9\""
  "/dimensions/body_height":
