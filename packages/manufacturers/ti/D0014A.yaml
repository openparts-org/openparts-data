    max: 6.2 mm
    src: p22 "D0014A, lead-tip span "6.2 / 5.8 TYP" (min/max only)"
  overall_height: { max: 1.75 mm, src: 'p22 "D0014A side view, "1.75 MAX""' }
  standoff: { min: 0.1 mm, max: 0.25 mm, src: 'p22 "D0014A DETAIL A, standoff "0.25 / 0.10""' }
