# TI D0014A "SOIC - 1.75 mm max height" (14-lead SOIC, drawing
# 4220718/A 09/2016, JEDEC MS-012 variation AB per its note 5), read
# from the rendered outline page of SCLS085L (PDF page 22).
# Millimetres as printed. The same drawing revision (pdftotext -layout
# text identical line for line) is also in SLCS006Z page 43.
#
# Ranges only for the body: E1 "4.0/3.8 NOTE 4" (body_width), D
# "8.75/8.55 NOTE 3" (body_length); lead span "6.2/5.8 TYP" recorded
# as min/max. No nominal is recorded (canonical-data 20.1). Only the
# overall height "1.75 MAX" is given -- no A2 -- so it is recorded as
# overall_height max with no body_height (as manufacturers/ti/D0008A).
# Pitch "12X 1.27" (basic); "2X 7.62" basic is pin 1 to pin 7.
# Pins 1-7 down the left edge, 8-14 up the right edge (top view).
schema_version: "0.2"
kind: package
id: manufacturers/ti/D0014A
family: soic
lead_count: 14
source: ti/SCLS085L

pitch:
  typ: 1.27 mm
  src: p22 "PACKAGE OUTLINE D0014A (4220718/A), "12X 1.27" (basic); "2X 7.62" basic"

geometry: { type: parametric, generator: soic }

dimensions:
  body_width:
    min: 3.8 mm
    max: 4 mm
    src: p22 "D0014A, body width "4.0 / 3.8 NOTE 4" (datum B)"
  body_length:
    min: 8.55 mm
    max: 8.75 mm
    src: p22 "D0014A, body length "8.75 / 8.55 NOTE 3" (datum A)"
  lead_thickness:
