# text identical line for line) is also in SLCS006Z page 43.
#
# Ranges only for the body: E1 "4.0/3.8 NOTE 4" (body_width), D
# "8.75/8.55 NOTE 3" (body_length); lead span "6.2/5.8 TYP" recorded
