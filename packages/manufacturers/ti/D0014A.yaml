    max: 0.25 mm
    src: p22 "D0014A, lead thickness "0.25 / 0.13 TYP""
  lead_length:
    min: 0.4 mm
    max: 1.27 mm
    src: p22 "D0014A DETAIL A, foot length "1.27 / 0.40""
  overall_width:
