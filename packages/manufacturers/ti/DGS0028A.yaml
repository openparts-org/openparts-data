# Family msop (TI VSSOP, as standards/MSOP10-3.0x3.0-P0.5-TI-DGS):
# body_width = E1 2.9/3.1, body_length = D 7.0/7.2, overall_width = lead
# span "5.1/4.7 TYP" -- all limits only, no nominal recorded. Only the
# overall height A (1.1 MAX) is given, no A2, so no body_height.
# lead_thickness = "(0.15) TYP": parenthesised, i.e. a reference value per
# note 1, recorded as nominal and flagged here. Note 4: "No JEDEC
# registration as of September 2020".
