# TI DRL0006A "SOT - 0.6 mm max height" (SOT563 6-lead; drawing
# 4223266/F 11/2024, JEDEC MO-293 variation UAAD per its note 4), read
# from the rendered outline page of SBOS397I (TMP102) page 30. The same
# drawing revision is in SBOS854F (TMP1075) page 36 (pdftotext text
# diffed equal); SBOS473L (TMP112) page 39 carries revision 4223266/C
# 12/2021 whose dimension text matches number for number (only label
# placement differs in the extracted text).
#
# Field mapping for the `sot` generator (leads exit across
# body_length), as in manufacturers/ti/DDC0006A: body_width = D
# 1.5-1.7 (along the lead rows, "NOTE 3"), body_length = E1 1.1-1.3,
# overall_length = lead-tip span 1.5-1.7. lead_layout [3, 3]: pins 1-2-3
# down one edge, 4-5-6 back up the other (top view, page 30 and the
# pin-configuration figure on page 3).
# lead_length is the top view's lead extent beyond the body "6X 0.3/0.1";
# the bottom view's "6X 0.4/0.2" (lead seen from below) is left out.
# Land pattern (page 31) not recorded as pads: the sot frame is rotated
# against the drawing; footprint lands come from IPC-7351B.
schema_version: "0.2"
kind: package
id: manufacturers/ti/DRL0006A
family: sot
lead_count: 6
lead_layout: [3, 3]
source: ti/SBOS397I

pitch:
  typ: 0.5 mm
  src: p30 "DRL0006A outline (4223266/F), "4X 0.5" (basic; "2X 1" across pins 1-3)"

geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 1.5 mm
    max: 1.7 mm
    src: p30 "DRL0006A outline, body along the rows "1.7 / 1.5 NOTE 3""
  body_length:
    min: 1.1 mm
    max: 1.3 mm
    src: p30 "DRL0006A outline, molded body width "1.3 / 1.1""
  lead_thickness: { min: 0.08 mm, max: 0.18 mm, src: 'p30 "DRL0006A side view, "6X 0.18 / 0.08""' }
  lead_length:
    min: 0.1 mm
    max: 0.3 mm
    src: p30 "DRL0006A top view, lead beyond body "6X 0.3 / 0.1""
  overall_length:
    min: 1.5 mm
    max: 1.7 mm
    src: p30 "DRL0006A outline, lead-tip span "1.7 / 1.5""
  overall_height: { max: 0.6 mm, src: p30 "DRL0006A side view "0.6 MAX"" }
  standoff:       { min: 0 mm, max: 0.05 mm, src: 'p30 "DRL0006A outline, "0.05 / 0.00 TYP""' }
  lead_width:     { min: 0.15 mm, max: 0.27 mm, src: 'p30 "DRL0006A outline, "6X 0.27 / 0.15""' }
