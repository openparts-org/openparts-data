# TI DEF0008A-C01, WSON-8 with a sensor cavity, 2.5x2.5 mm, 0.5 mm pitch,
# 0.8 mm max height (HDC3020). Outline drawing DEF0008A-C01 (4228892/B
# 08/2022) in SNAS778D page 41 and its Example Board Layout on page 42,
# read from the rendered drawings.
#
# Mapping: body limits "2.6 / 2.4" both ways -> body_width (across the
# two terminal rows) / body_length; side view "0.8 / 0.7" -> body_height;
# "0.05 / 0.00" -> standoff; "8X 0.3 / 0.2" (along the row) -> lead_width;
# "8X 0.45 / 0.35" (across the row) -> lead_length; thermal pad
# "1.2 +- 0.1" x "1.9 +- 0.1" -> exposed_pad (pin 9).
# Top view: pin 1 top-left, 1-4 down the left, 5-8 up the right (SOIC
# order), as in the land pattern example (page 42).
# pads: the Example Board Layout (page 42): lands 8X (0.6) x 8X (0.25),
# pitch 6X (0.5), land centres (2.3) apart across the rows -> x = +-1.15,
# y = +-0.25 / +-0.75; thermal land (1.2) x (1.9) at the centre (pad 9).
# The sensor cavity (sensing area, top) is not modelled.
