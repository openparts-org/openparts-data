# TI PW0014A "TSSOP - 1.2 mm max height" (14-lead TSSOP, 4.4 mm body,
# 0.65 mm pitch; drawing 4220202/B 12/2023, JEDEC MO-153 per its note
# 5), read from the rendered outline page of SCES650K (PDF page 52).
# Millimetres as printed. The same drawing revision is also in
# SBOS833R p84, SBOS107A p32, SLOS263Y p47 and SBOS741H p44.
#
# Ranges only for the body: E1 "4.5/4.3" (body_width), D "5.1/4.9"
# (body_length); lead span "6.6/6.2 TYP" recorded as min/max. Only
# the overall height A "1.2 MAX" is given -- no A2 -- so it is
# overall_height max with no body_height. Lead thickness is printed
# only as "(0.15) TYP"; note 1 says parenthesised dimensions are for
# reference only -- recorded as that reference value (as for the
# existing TSSOP16-...-TI-PW package). Pins 1-7 down the left edge,
# 8-14 back up the right edge (top view).
schema_version: "0.2"
kind: package
id: manufacturers/ti/PW0014A
family: tssop
lead_count: 14
source: ti/SCES650K

pitch: { typ: 0.65 mm, src: 'p52 "PACKAGE OUTLINE PW0014A (4220202/B), "12X 0.65" (basic)"' }
geometry: { type: parametric, generator: tssop }

dimensions:
  body_width:
    min: 4.3 mm
    max: 4.5 mm
    src: p52 "PW0014A, body width "4.5 / 4.3 NOTE 4" (datum B)"
  body_length:
    min: 4.9 mm
    max: 5.1 mm
    src: p52 "PW0014A, body length "5.1 / 4.9 NOTE 3" (datum A)"
  lead_thickness:
    typ: 0.15 mm
    src: p52 "PW0014A end view, "(0.15) TYP" -- reference value per note 1"
  lead_length:    { min: 0.5 mm, max: 0.75 mm, src: 'p52 "PW0014A DETAIL A, "0.75 / 0.50""' }
  overall_width:
    min: 6.2 mm
    max: 6.6 mm
    src: p52 "PW0014A, lead-tip span "6.6 / 6.2 TYP" (min/max only)"
  overall_height: { max: 1.2 mm, src: 'p52 "PW0014A side view, "1.2 MAX""' }
  standoff:       { min: 0.05 mm, max: 0.15 mm, src: 'p52 "PW0014A DETAIL A, "0.15 / 0.05""' }
  lead_width:     { min: 0.17 mm, max: 0.3 mm, src: 'p52 "PW0014A, "14X 0.30 / 0.17""' }
