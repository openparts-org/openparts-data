# TI RGE0024H, VQFN-24, 4x4 mm body, 0.5 mm pitch, 1 mm max height.
# All values read from the rendered "PACKAGE OUTLINE RGE0024H" drawing
# (4219016 / A 08/2017) in the MSP430FR2433 datasheet SLASE59F, PDF
# page 89. The drawing gives body D/E only as 3.9/4.1 limits, so no
# nominal is recorded. Not shared with standards/QFN24-XMC1100: the
# terminal length (0.28-0.48 vs 0.35-0.45) and width tolerances differ.
# The nominal 4.0 comes from the page-2 "Device Information" table
# (BODY SIZE "4 mm x 4 mm"), which TI footnotes as an approximation;
# the outline drawing itself gives only the 3.9/4.1 limits.
schema_version: "0.2"
kind: package
id: manufacturers/ti/RGE0024H
family: qfn

lead_count:
  value: 24
  src: p89 "PACKAGE OUTLINE RGE0024H, terminals numbered 1-24 plus thermal pad 25"

source: ti/SLASE59F

pitch: { typ: 0.5 mm, src: 'p89 "PACKAGE OUTLINE RGE0024H, "20X 0.5""' }
geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:
    min: 3.9 mm
    typ: 4 mm
    max: 4.1 mm
    src:
      - p89 "PACKAGE OUTLINE RGE0024H, top view width 3.9/4.1"
      - p2 "Device Information table, MSP430FR2433IRGE, BODY SIZE (approximate, nominal)"
  body_length:
    min: 3.9 mm
    typ: 4 mm
    max: 4.1 mm
    src:
      - p89 "PACKAGE OUTLINE RGE0024H, top view length 3.9/4.1"
      - p2 "Device Information table, MSP430FR2433IRGE, BODY SIZE (approximate, nominal)"
  body_height: { max: 1 mm, src: 'p89 "PACKAGE OUTLINE RGE0024H, side view "1 MAX""' }
  exposed_pad:
    src:    p89 "PACKAGE OUTLINE RGE0024H, bottom view thermal pad "□2.7±0.1""
    width:  { min: 2.6 mm, typ: 2.7 mm, max: 2.8 mm }
    length: { min: 2.6 mm, typ: 2.7 mm, max: 2.8 mm }
  standoff: { min: 0 mm, max: 0.05 mm, src: 'p89 "PACKAGE OUTLINE RGE0024H, side view 0.00/0.05"' }
  lead_width: { min: 0.18 mm, max: 0.3 mm, src: 'p89 "PACKAGE OUTLINE RGE0024H, "24X 0.18/0.30""' }
  lead_length:
    min: 0.28 mm
    max: 0.48 mm
    src: p89 "PACKAGE OUTLINE RGE0024H, "24X 0.28/0.48""
  lead_thickness:
    typ: 0.2 mm
    src: p89 "PACKAGE OUTLINE RGE0024H, side detail "(0.2) TYP" (reference value)"
