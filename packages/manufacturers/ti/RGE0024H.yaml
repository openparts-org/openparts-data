# TI RGE0024H, VQFN-24, 4x4 mm body, 0.5 mm pitch, 1 mm max height.
# All values read from the rendered "PACKAGE OUTLINE RGE0024H" drawing
# (4219016 / A 08/2017) in the MSP430FR2433 datasheet SLASE59F, PDF
# page 89. The drawing gives body D/E only as 3.9/4.1 limits, so no
# nominal is recorded. Not shared with standards/QFN24-XMC1100: the
# terminal length (0.28-0.48 vs 0.35-0.45) and width tolerances differ.
# The nominal 4.0 comes from the page-2 "Device Information" table
# (BODY SIZE "4 mm x 4 mm"), which TI footnotes as an approximation;
# the outline drawing itself gives only the 3.9/4.1 limits.
schema_version: "0.1"
kind: package
id: manufacturers/ti/RGE0024H

family: qfn
lead_count: 24

pitch:
  nominal: 0.5
  unit: mm

dimensions:
  body_width:
    nominal: 4.0
    min: 3.9
    max: 4.1
    unit: mm
  body_length:
    nominal: 4.0
    min: 3.9
    max: 4.1
    unit: mm
  body_height:
    max: 1.0
    unit: mm
  standoff:
    min: 0.0
    max: 0.05
    unit: mm
  exposed_pad:
    width:
      nominal: 2.7
      min: 2.6
      max: 2.8
      unit: mm
    length:
      nominal: 2.7
      min: 2.6
      max: 2.8
      unit: mm
  lead_width:
    min: 0.18
    max: 0.30
    unit: mm
  lead_length:
    min: 0.28
    max: 0.48
    unit: mm
  lead_thickness:
    nominal: 0.2
    unit: mm

geometry:
  type: parametric
  generator: qfn

provenance:
  "/lead_count":
    - source: ti/SLASE59F
      page: 89
      locator: "PACKAGE OUTLINE RGE0024H, terminals numbered 1-24 plus thermal pad 25"
  "/pitch":
    - source: ti/SLASE59F
      page: 89
      locator: "PACKAGE OUTLINE RGE0024H, \"20X 0.5\""
  "/dimensions/body_width":
    - source: ti/SLASE59F
      page: 89
      locator: "PACKAGE OUTLINE RGE0024H, top view width 3.9/4.1"
    - source: ti/SLASE59F
      page: 2
      locator: "Device Information table, MSP430FR2433IRGE \"VQFN (24) 4 mm x 4 mm\" (BODY SIZE; footnote: \"sizes shown here are approximations\") -- nominal"
  "/dimensions/body_length":
    - source: ti/SLASE59F
      page: 89
      locator: "PACKAGE OUTLINE RGE0024H, top view length 3.9/4.1"
    - source: ti/SLASE59F
      page: 2
      locator: "Device Information table, MSP430FR2433IRGE \"VQFN (24) 4 mm x 4 mm\" (BODY SIZE; footnote: \"sizes shown here are approximations\") -- nominal"
  "/dimensions/body_height":
    - source: ti/SLASE59F
      page: 89
      locator: "PACKAGE OUTLINE RGE0024H, side view \"1 MAX\""
  "/dimensions/standoff":
    - source: ti/SLASE59F
      page: 89
      locator: "PACKAGE OUTLINE RGE0024H, side view 0.00/0.05"
  "/dimensions/exposed_pad":
    - source: ti/SLASE59F
      page: 89
      locator: "PACKAGE OUTLINE RGE0024H, bottom view thermal pad \"□2.7±0.1\""
  "/dimensions/lead_width":
    - source: ti/SLASE59F
      page: 89
      locator: "PACKAGE OUTLINE RGE0024H, \"24X 0.18/0.30\""
  "/dimensions/lead_length":
    - source: ti/SLASE59F
      page: 89
      locator: "PACKAGE OUTLINE RGE0024H, \"24X 0.28/0.48\""
  "/dimensions/lead_thickness":
