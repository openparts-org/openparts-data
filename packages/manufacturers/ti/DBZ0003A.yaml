# TI DBZ0003A "SOT-23 - 1.12 mm max height" (3-lead SOT-23; drawing
# 4214838/F 08/2024, JEDEC TO-236 "except minimum foot length" per its
# note 3), read from the rendered outline page of SBVS032K (PDF page
# 34). Millimetres as printed. The same drawing revision (identical
# text) is in SLOS456Q p53 and SLVS543S p62; this package cites
# SBVS032K only.
#
# Top view: pins 1 and 2 on one edge ("1.9" basic apart, "0.95" basic
# from pin 1 to the centre line), pin 3 alone on the opposite edge --
# lead_layout [2, 1]. As for the other SOT-23-3 packages in this
# dataset, pitch = the 1.9 outside lead pitch (pin 1 to pin 2).
#
# Field mapping for the `sot` generator: body_width = 3.04/2.80 (long
# side, along the pin 1-2 row, datum A), body_length = 1.4/1.2 (molded
# width across the rows, datum B), overall_length = 2.64/2.10 (lead-tip
# span). Ranges only, no nominal. Only "1.12 MAX" is given for the
# height; the side-view "(0.95)" is a reference value and is not
# recorded (no A2). Standoff "0.10/0.01 TYP", foot "0.6/0.2 TYP", lead
# thickness "0.20/0.08 TYP" recorded as those ranges.
