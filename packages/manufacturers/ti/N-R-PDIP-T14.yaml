# TI legacy drawing N (R-PDIP-T**) "Plastic Dual-In-Line Package",
# 14-pin column (drawing 4040049/E 12/2002, JEDEC MS-001 variation AA
# per its table), read from the rendered MECHANICAL DATA page of
# SCLS181H (PDF page 35; an image page). Inches with millimetres in
# parentheses; the millimetre values are recorded. The same drawing
# (4040049/E) is printed in the other SN74HC 14-pin datasheets.
#
# body_width (the `dip` generator's ROW SPACING) = 7.62 mm: the drawing
# prints only the lead span at the gauge plane, "0.325 (8,26) / 0.300
# (7,62)", whose lower end is the 300-mil row spacing (same reading as
# manufacturers/ti/N-R-PDIP-T16). Flagged for review. Molded width
# "0.260 (6,60) / 0.240 (6,10)" is not modelled. body_length = dim A for
# 14 pins (0.745-0.775 in). The half-width end leads ("14/18 Pin Only"
# detail) are not modelled.
schema_version: "0.2"
kind: package
id: manufacturers/ti/N-R-PDIP-T14
family: dip
lead_count: 14
source: ti/SCLS181H

pitch: { typ: 2.54 mm, src: 'p35 "N (R-PDIP-T**) 4040049/E, pitch "0.100 (2,54)""' }
geometry: { type: parametric, generator: dip }

dimensions:
  body_width:
    typ: 7.62 mm
    src: p35 "N (R-PDIP-T**), lead span "0.325 (8,26) / 0.300 (7,62)"; 300-mil row spacing (lower end)"
  body_length:
    min: 18.92 mm
    max: 19.69 mm
    src: p35 "N (R-PDIP-T**) table, 14 pins, "A MAX 0.775 (19,69)", "A MIN 0.745 (18,92)""
  lead_thickness: { typ: 0.25 mm, src: 'p35 "N (R-PDIP-T**) end view, "0.010 (0,25) NOM""' }
  lead_width:
    min: 0.38 mm
    max: 0.53 mm
    src: p35 "N (R-PDIP-T**), lead width "0.021 (0,53) / 0.015 (0,38)""
  overall_height: { max: 5.08 mm, src: 'p35 "N (R-PDIP-T**) side view, "0.200 (5,08) MAX""' }
  standoff:       { min: 0.51 mm, src: 'p35 "N (R-PDIP-T**) side view, "0.020 (0,51) MIN""' }
