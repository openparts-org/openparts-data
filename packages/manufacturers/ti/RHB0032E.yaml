# TI RHB0032E, VQFN-32, 5x5 mm body, 0.5 mm pitch, 1 mm max height.
# All values read from the rendered "PACKAGE OUTLINE RHB0032E" drawing
# (4223442/B 08/2019) in the MSPM0L130x datasheet SLASEX0D, PDF page
# 72. Body D/E given only as 4.9/5.1 limits, so no nominal recorded.
# The nominal 5.0 comes from Table 5-1 "Device Comparison" (page 5),
# "32 VQFN [5 mm x 5 mm]", footnote (4) "a nominal value"; the outline
# drawing itself gives only the 4.9/5.1 limits.
schema_version: "0.2"
kind: package
id: manufacturers/ti/RHB0032E
family: qfn
lead_count: 32
source: ti/SLASEX0D

pitch: { typ: 0.5 mm, src: 'p72 "PACKAGE OUTLINE RHB0032E, "28X 0.5""' }
geometry: { type: parametric, generator: qfn }

dimensions:
  body_width:
    min: 4.9 mm
    typ: 5 mm
    max: 5.1 mm
    src:
      - p72 "PACKAGE OUTLINE RHB0032E, top view width 4.9/5.1"
      - p5 "Table 5-1 Device Comparison, MSPM0L1306xRHB, package size (nominal, footnote 4)"
  body_length:
    min: 4.9 mm
    typ: 5 mm
    max: 5.1 mm
    src:
      - p72 "PACKAGE OUTLINE RHB0032E, top view length 4.9/5.1"
      - p5 "Table 5-1 Device Comparison, MSPM0L1306xRHB, package size (nominal, footnote 4)"
  body_height: { max: 1 mm, src: 'p72 "PACKAGE OUTLINE RHB0032E, side view "1 MAX""' }
  exposed_pad:
    src:    p72 "PACKAGE OUTLINE RHB0032E, exposed thermal pad "□3.45±0.1""
    width:  { min: 3.35 mm, typ: 3.45 mm, max: 3.55 mm }
    length: { min: 3.35 mm, typ: 3.45 mm, max: 3.55 mm }
  standoff: { min: 0 mm, max: 0.05 mm, src: 'p72 "PACKAGE OUTLINE RHB0032E, side view 0.00/0.05"' }
  lead_width:  { min: 0.2 mm, max: 0.3 mm, src: 'p72 "PACKAGE OUTLINE RHB0032E, "32X 0.2/0.3""' }
  lead_length: { min: 0.3 mm, max: 0.5 mm, src: 'p72 "PACKAGE OUTLINE RHB0032E, "32X 0.3/0.5""' }
  lead_thickness:
    typ: 0.2 mm
    src: p72 "PACKAGE OUTLINE RHB0032E, side detail "(0.2) TYP" (reference value)"
