# TI DBV0005A "SOT-23 - 1.45 mm max height" (5-lead SOT-23; drawing
# 4214839/K 08/2024, JEDEC MO-178 per its note 3), read from the
# rendered outline page of SBOS833R (PDF page 94). Millimetres as
# printed. The same drawing revision (identical text) is also in
# SBOS107A p19, SLOS263Y p31, SLVS543S p79, SBVS320D p44, SCES214AF p23
# and SBOS741H p47; this package cites SBOS833R only.
#
# Top view (page 94): pins 1-2-3 down the left edge (pin 1 at the index
# area), pin 4 opposite pin 3, pin 5 opposite pin 1 -- the generator's
# counter-clockwise [3, 2] layout. The two pin-4/5 leads are "1.9"
# basic apart, the pin-1..3 leads "2X 0.95" basic.
#
# Field mapping for the `sot` generator (leads exit across
# body_length): body_width = 3.05/2.75 (body along the rows),
# body_length = 1.75/1.45 (molded width across the rows, datum B),
# overall_length = 3.0/2.6 (lead-tip span). Ranges only -- no nominal
# is recorded. Only the overall height 1.45/0.90 is toleranced; the
# "(1.1)" in the side view is a reference value and is not recorded
# (no A2). Lead thickness "0.22/0.08 TYP", foot "0.6/0.3 TYP" and
# standoff "0.15/0.00 TYP" are recorded as those ranges.
schema_version: "0.2"
kind: package
id: manufacturers/ti/DBV0005A
family: sot
lead_count: 5

lead_layout:
  value: [3, 2]
  src:   'p94 "DBV0005A top view: leads 1, 2, 3 on the left edge, 5 (top) and 4 (bottom) on the right edge"'

source: ti/SBOS833R

pitch:
  typ: 0.95 mm
  src: p94 "PACKAGE OUTLINE DBV0005A (4214839/K), "2X 0.95" (basic); "1.9" basic across pins 1-3 and 4-5"

geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 2.75 mm
    max: 3.05 mm
    src: p94 "DBV0005A, body length along the rows "3.05 / 2.75" (datum A) -- see field-mapping note"
  body_length:
    min: 1.45 mm
    max: 1.75 mm
    src: p94 "DBV0005A, molded body width "1.75 / 1.45" (datum B) -- see field-mapping note"
  lead_thickness:
    min: 0.08 mm
    max: 0.22 mm
    src: p94 "DBV0005A lead detail, "0.22 / 0.08 TYP""
  lead_length:    { min: 0.3 mm, max: 0.6 mm, src: 'p94 "DBV0005A lead detail, "0.6 / 0.3 TYP""' }
  overall_length: { min: 2.6 mm, max: 3 mm, src: 'p94 "DBV0005A, lead-tip span "3.0 / 2.6""' }
  overall_height:
    min: 0.9 mm
    max: 1.45 mm
    src: p94 "DBV0005A side view, height "1.45 / 0.90""
  standoff:       { min: 0 mm, max: 0.15 mm, src: 'p94 "DBV0005A side view, "0.15 / 0.00 TYP""' }
  lead_width:     { min: 0.3 mm, max: 0.5 mm, src: 'p94 "DBV0005A, "5X 0.5 / 0.3""' }
