# NOTE (2026-11-10): out of date below -- the generators now draw a
# min/max-only dimension at its midpoint (never stored; openparts-mcad
# defaults::required), so this package does generate a footprint and model.
# TI NS0016A "SOP - 2.00 mm max height" (drawing 4220735/A 12/2021),
# 16-lead 5.3 mm-body SOP, read from the rendered outline page of
# SLRS027T (page 31). Millimetres as printed.
#
# Body E1 5.2-5.4 and D 10.0-10.4 are ranges only -- no nominal is
# recorded (canonical-data 20.1); the soic generator currently needs a
# body nominal, so this package does not render a 3D model/footprint.
# Lead thickness is printed "0.15 TYP" and recorded as nominal. The
# "(1.25)" reference dimension in Detail A is not recorded.
schema_version: "0.2"
kind: package
id: manufacturers/ti/NS0016A
family: soic
lead_count: 16
source: ti/SLRS027T

pitch: { typ: 1.27 mm, src: 'p31 "NS0016A outline, "14X 1.27" (basic)"' }
geometry: { type: parametric, generator: soic }

dimensions:
  body_width:
    min: 5.2 mm
    max: 5.4 mm
    src: p31 "NS0016A outline, body width "5.4 / 5.2" (note 4)"
  body_length:
    min: 10 mm
    max: 10.4 mm
    src: p31 "NS0016A outline, body length "10.4 / 10.0" (note 3)"
  lead_thickness: { typ: 0.15 mm, src: 'p31 "NS0016A side view, "0.15 TYP""' }
  lead_length:
    min: 0.55 mm
    max: 1.05 mm
    src: p31 "NS0016A Detail A, foot length "1.05 / 0.55""
  overall_width:
    min: 7.4 mm
    max: 8.2 mm
    src: p31 "NS0016A outline, lead-tip span "8.2 / 7.4 TYP""
  overall_height: { max: 2 mm, src: 'p31 "NS0016A outline, "2.00 MAX""' }
  standoff:       { min: 0.1 mm, max: 0.3 mm, src: 'p31 "NS0016A Detail A, "0.3 / 0.1""' }
  lead_width:     { min: 0.35 mm, max: 0.51 mm, src: 'p31 "NS0016A outline, "16X 0.51 / 0.35""' }
