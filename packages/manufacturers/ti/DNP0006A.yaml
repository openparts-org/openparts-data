# TI DNP0006A, USON-6, 2 x 2 mm, 0.65 mm pitch, 0.65 mm max height,
# optical package with clear mold compound (note 4). Outline drawing
# DNP0006A (4221434/C 01/2018) in SBOS681C (OPT3001) page 41 and its
# Example Board Layout on page 42, read from the rendered drawings.
#
# Mapping: body "2.1/1.9" both ways -> body_width / body_length;
# "0.65/0.55" (no A2) -> body_height; "0.05/0.00" -> standoff; "6X
# 0.35/0.25" -> lead_width; "6X 0.3/0.2" -> lead_length; thermal pad
# "0.65+-0.1" x "1.35+-0.1" -> exposed_pad. Top view: pin 1 top-left,
# 1-3 down the left, 4-6 up the right.
# pads: Example Board Layout (page 42): 6X (0.5) x 6X (0.25) lands,
# pitch 4X (0.65), land centres (1.9) apart -> x = +-0.95; thermal land
# (0.65) x (1.35) at the centre (unnumbered in the drawing; "7" here, as
# for manufacturers/ti/DMB0006A). All parenthesised reference values.
schema_version: "0.2"
kind: package
id: manufacturers/ti/DNP0006A
family: son
lead_count: 6
source: ti/SBOS681C

pitch: { typ: 0.65 mm, src: 'p41 "DNP0006A outline (4221434/C), bottom view, basic "4X 0.65""' }
geometry: { type: parametric, generator: son }

dimensions:
  body_width:
    min: 1.9 mm
    max: 2.1 mm
    src: p41 "DNP0006A outline, top view "2.1 / 1.9" (across the rows)"
  body_length:
    min: 1.9 mm
    max: 2.1 mm
    src: p41 "DNP0006A outline, top view "2.1 / 1.9" (along the rows)"
  body_height:
    min: 0.55 mm
    max: 0.65 mm
    src: p41 "DNP0006A outline, side view "0.65 / 0.55""
  exposed_pad:
    src:    p41 "DNP0006A outline, bottom view, exposed thermal pad "0.65+-0.1" x "1.35+-0.1""
    width:  { min: 0.55 mm, typ: 0.65 mm, max: 0.75 mm }
    length: { min: 1.25 mm, typ: 1.35 mm, max: 1.45 mm }
  standoff: { min: 0 mm, max: 0.05 mm, src: 'p41 "DNP0006A outline, side view "0.05 / 0.00""' }
  lead_width:
    min: 0.25 mm
    max: 0.35 mm
    src: p41 "DNP0006A outline, bottom view "6X 0.35 / 0.25""
  lead_length:
    min: 0.2 mm
    max: 0.3 mm
    src: p41 "DNP0006A outline, bottom view "6X 0.3 / 0.2""

pads:
  value:
    - { number: "1", x: -0.95, y: 0.65, width: 0.5, length: 0.25 }
    - { number: "2", x: -0.95, y: 0, width: 0.5, length: 0.25 }
    - { number: "3", x: -0.95, y: -0.65, width: 0.5, length: 0.25 }
    - { number: "4", x: 0.95, y: -0.65, width: 0.5, length: 0.25 }
    - { number: "5", x: 0.95, y: 0, width: 0.5, length: 0.25 }
    - { number: "6", x: 0.95, y: 0.65, width: 0.5, length: 0.25 }
    - { number: "7", x: 0, y: 0, width: 0.65, length: 1.35 }
  src: 'p42 "DNP0006A Example Board Layout: 6X (0.5) x 6X (0.25), 4X (0.65), x = +-(1.9)/2; thermal land (0.65) x (1.35)"'
