# TI DBV0006A "SOT-23 - 1.45 mm max height" (6-lead SOT-23; drawing
# 4214840/G 08/2024, JEDEC MO-178 per its note 5 "Refernce JEDEC
# MO-178" [sic]), read from the rendered outline page of SCES195N (PDF
# page 22). Millimetres as printed.
#
# Top view (page 22): pins 1-2-3 down the left edge (pin 1 at the index
# area), 4-5-6 up the right edge (6 opposite 1) -- the generator's
# counter-clockwise [3, 3] layout. Leads "2X 0.95" basic apart, "1.9"
# basic from pin 1 to pin 3.
#
# Field mapping for the `sot` generator (leads exit across
# body_length), as for manufacturers/ti/DBV0005A: body_width = 3.05/2.75
# (body along the rows, datum A), body_length = 1.75/1.45 (molded width
# across the rows, datum B), overall_length = 3.0/2.6 (lead-tip span).
# Ranges only -- no nominal is recorded. Only the overall height
# 1.45/0.90 is toleranced; "(1.1)" is a reference value (note 1) and is
# not recorded (no A2). Lead width "6X 0.50/0.25" (differs from
# DBV0005A's 0.5/0.3, so DBV0005A's numbers are not reused); note 4:
# "Leads 1,2,3 may be wider than leads 4,5,6 for package orientation"
# (no separate value given). Lead thickness "0.22/0.08 TYP", foot
# "0.6/0.3 TYP" and standoff "0.15/0.00 TYP" recorded as those ranges.
schema_version: "0.1"
kind: package
id: manufacturers/ti/DBV0006A

family: sot
lead_count: 6
lead_layout: [3, 3]

pitch:
  nominal: 0.95
  unit: mm

