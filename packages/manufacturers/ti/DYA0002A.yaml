# TI DYA0002A "SOT (SOD-523) - 0.77 mm max height" (2-lead plastic small
# outline, drawing 4224978/B 09/2021; note 4: JEITA SC-79 except for
# the height), read from the rendered outline (page 24) and "EXAMPLE
# BOARD LAYOUT" (page 25) of ti/SLVSBO7O. Millimetres as printed,
# ranges only.
#
# Flat leads straight out of the body ends (side view): `sod_flat`.
# Frame as for `chip`/`sod`: body_length = "1.3 / 1.1" (body along the
# leads, datum B), body_width = "0.85 / 0.75" (across, datum A, note 3),
# overall_length = "1.7 / 1.5" (tip to tip). Pin 1 (the PIN 1 ID AREA
# end) at -X, pin 2 at +X. Only "0.77 MAX" is given for the height:
# recorded as body_height max. "2X 0.3 / 0.1" (lead protrusion beyond
# the body) and the side view's "0.7 / 0.5 TYP" are not recorded.
# Land pattern: "LAND PATTERN EXAMPLE", two pads "2X (0.67)" x
# "2X (0.4)" with centres "(1.48)" apart -- all printed in parentheses,
# i.e. reference values per note 1.
schema_version: "0.2"
kind: package
id: manufacturers/ti/DYA0002A
family: sod_flat
lead_count: 2
source: ti/SLVSBO7O

pitch: { unit: mm }
geometry: { type: parametric, generator: sod_flat }

dimensions:
  body_width:
    min: 0.75 mm
    max: 0.85 mm
    src: p24 "DYA0002A top view, "0.85 / 0.75" (datum A, note 3)"
  body_length: { min: 1.1 mm, max: 1.3 mm, src: 'p24 "DYA0002A top view, "1.3 / 1.1" (datum B)"' }
  body_height:    { max: 0.77 mm, src: 'p24 "DYA0002A side view, "0.77 MAX""' }
  lead_thickness: { min: 0.08 mm, max: 0.15 mm, src: 'p24 "DYA0002A side view, "2X 0.15 / 0.08""' }
  overall_length:
    min: 1.5 mm
    max: 1.7 mm
    src: p24 "DYA0002A top view, tip-to-tip "1.7 / 1.5""
  lead_width: { min: 0.25 mm, max: 0.35 mm, src: 'p24 "DYA0002A bottom view, "2X 0.35 / 0.25""' }
  lead_length:
    min: 0.2 mm
    max: 0.4 mm
    src: p24 "DYA0002A bottom view, "2X 0.4 / 0.2" (lead foot)"

pads:
  value:
    - { number: "1", x: -0.74, y: 0, width: 0.67, length: 0.4 }
    - { number: "2", x: 0.74, y: 0, width: 0.67, length: 0.4 }
  src: p25 "DYA0002A LAND PATTERN EXAMPLE (reference values), pads 2X (0.67) x 2X (0.4), centres (1.48) apart -> x = ±1.48/2 = ±0.74"
