# pitch, exposed thermal pad 11; drawing 4218906/A 04/2019), read from
# the rendered PACKAGE OUTLINE page of SLUS941H (BQ24040, PDF page 37).
# Millimetres as printed.
#
# Mapping as for manufacturers/ti/DSG0008A: body 2.1/1.9 both ways (no
# nominal printed) -> body_width/body_length min/max; A 0.8/0.7 (no A2)
