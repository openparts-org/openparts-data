# lead_width; L "10X 0.4/0.2" -> lead_length; thermal pad "0.9±0.1"
# across the terminal rows and "1.5±0.1" along them -> exposed_pad.
# Bottom view numbers terminals 1-5 up one edge and 6-10 down the
# other; seen from the top this is pin 1 top-left, down the left, up the
# right (SOIC order), matching Figure 6-1 (page 4: IN 1 opposite OUT 10).
# Left out: "(0.2) TYP" side-wall metal (not A3), "2X 1.6" row span,
# and the EXAMPLE BOARD LAYOUT (page 38, reference values only).
schema_version: "0.2"
