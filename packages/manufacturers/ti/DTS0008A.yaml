# TI DTS0008A "SOT - 0.6 mm max height" (SOT-5X3, 8 leads, 0.5 mm
# pitch; drawing 4226132/G 01/2025), read from the rendered outline page
# of SBOS993A (OPT4001, PDF page 48) and its Example Board Layout (page
# 49).
#
# Top view: leads 1-4 down the left edge (pin 1 at the index area), 5-8
# up the right edge (8 opposite 1) -- lead_layout [4, 4]; "6X (0.5)"
# pitch.
# Field mapping for the `sot` generator (leads exit across
# body_length), as for manufacturers/ti/DBV0006A: body_width = 2.2/2.0
# (body along the rows, datum A), body_length = 1.3/1.1 (molded width
# across the rows, datum B), overall_length = 2.0/1.8 (lead-tip span).
# Ranges only. Lead width "8X 0.27/0.17", terminal length "8X 0.5/0.3",
# lead thickness "0.18/0.08", standoff "0.05/0.00", height "0.6 MAX".
# Not recorded: the "8X 0.45/0.25" lead extension beyond the body, the
# land pattern ((1.72) row span, 8X (0.72) x (0.3) lands; the sot
# generator draws its own).
schema_version: "0.2"
kind: package
id: manufacturers/ti/DTS0008A
family: sot
lead_count: 8

lead_layout:
  value: [4, 4]
  src:   'p48 "DTS0008A top view: leads 1-4 on the left edge (top to bottom), 8-5 on the right edge (top to bottom)"'

source: ti/SBOS993A

pitch: { typ: 0.5 mm, src: 'p48 "PACKAGE OUTLINE DTS0008A (4226132/G), "6X (0.5)""' }
geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 2 mm
    max: 2.2 mm
    src: p48 "DTS0008A, body length along the rows "2.2 / 2.0" (datum A) -- see field-mapping note"
  body_length:
    min: 1.1 mm
    max: 1.3 mm
    src: p48 "DTS0008A, molded body width "1.3 / 1.1" (datum B) -- see field-mapping note"
  lead_thickness: { min: 0.08 mm, max: 0.18 mm, src: 'p48 "DTS0008A side view, "0.18 / 0.08""' }
  lead_length:    { min: 0.3 mm, max: 0.5 mm, src: 'p48 "DTS0008A bottom view, "8X 0.5 / 0.3""' }
  overall_length: { min: 1.8 mm, max: 2 mm, src: 'p48 "DTS0008A, lead-tip span "2.0 / 1.8""' }
  overall_height: { max: 0.6 mm, src: 'p48 "DTS0008A side view, "0.6 MAX""' }
  standoff:       { min: 0 mm, max: 0.05 mm, src: 'p48 "DTS0008A side view, "0.05 / 0.00""' }
  lead_width:     { min: 0.17 mm, max: 0.27 mm, src: 'p48 "DTS0008A, "8X 0.27 / 0.17""' }
