# TI DRL0005A "SOT - 0.6 mm max height" (5-lead SOT-5X3, plastic small
# outline; drawing 4220753/E 11/2024, note 4: JEDEC MO-293 variation
# UAAD-1), read from the rendered outline page of ti/SLLSEG9C (PDF page
# 17). ti/SLLS684I page 21 carries the same drawing revision: its
# pdftotext text is identical and its 100-dpi render is byte-identical.
# Millimetres as printed, ranges only (no nominal recorded).
#
# Top view: leads 1, 2, 3 down the left edge ("2X 0.5" apart, "2X 1"
# from pin 1 to pin 3), 5 opposite 1 and 4 opposite 3 on the right
# edge -- the generator's [3, 2] layout (pin 4 opposite pin 3, pin 5
# opposite pin 1, on the outer positions). Field mapping as for
# manufacturers/ti/DBV0005A: body_width = "1.7 / 1.5" (body along the
# rows, datum A, note 3), body_length = "1.3 / 1.1" (molded width across
# the rows, datum B), overall_length = top "1.7 / 1.5" (lead-tip span).
# Only "0.6 MAX" is given for the height (no A2): recorded as
# body_height max. The leads are flat (side view), drawn by the
# gull-wing `sot` generator; "5X 0.3 / 0.1" (lead protrusion beyond the
# body) is not a field and not recorded.
# Land pattern: page 18 "LAND PATTERN EXAMPLE" (all values in
# parentheses, i.e. reference values per note 1), recorded in `pads`.
schema_version: "0.2"
kind: package
id: manufacturers/ti/DRL0005A
family: sot
lead_count: 5

lead_layout:
  value: [3, 2]
  src:   'p17 "DRL0005A top view: leads 1, 2, 3 on the left edge, 5 and 4 on the right edge opposite 1 and 3"'

source: ti/SLLSEG9C

pitch:
  typ: 0.5 mm
  src: p17 "PACKAGE OUTLINE DRL0005A (4220753/E), "2X 0.5" basic; "2X 1" basic pin 1 to pin 3"

geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 1.5 mm
    max: 1.7 mm
    src: p17 "DRL0005A, body "1.7 / 1.5" along the rows (datum A, note 3)"
  body_length:
    min: 1.1 mm
    max: 1.3 mm
    src: p17 "DRL0005A, body "1.3 / 1.1" across the rows (datum B)"
  body_height:    { max: 0.6 mm, src: 'p17 "DRL0005A side view, "0.6 MAX""' }
  lead_thickness: { min: 0.08 mm, max: 0.18 mm, src: 'p17 "DRL0005A side view, "5X 0.18 / 0.08""' }
  overall_length:
    min: 1.5 mm
    max: 1.7 mm
    src: p17 "DRL0005A top view, lead-tip span "1.7 / 1.5""
  standoff:       { min: 0 mm, max: 0.05 mm, src: 'p17 "DRL0005A, "0.05 / 0.00 TYP""' }
  lead_width: { min: 0.15 mm, max: 0.27 mm, src: 'p17 "DRL0005A bottom view, "5X 0.27 / 0.15""' }
  lead_length:
    min: 0.2 mm
    max: 0.4 mm
    src: p17 "DRL0005A bottom view, "5X 0.4 / 0.2" (lead foot)"

pads:
  value:
    - { number: "1", x: -0.74, y: 0.5, width: 0.67, length: 0.3 }
    - { number: "2", x: -0.74, y: 0, width: 0.67, length: 0.3 }
    - { number: "3", x: -0.74, y: -0.5, width: 0.67, length: 0.3 }
    - { number: "4", x: 0.74, y: -0.5, width: 0.67, length: 0.3 }
    - { number: "5", x: 0.74, y: 0.5, width: 0.67, length: 0.3 }
  src: p18 "DRL0005A LAND PATTERN EXAMPLE (ref.), 5X (0.67)x(0.3), x = ±(1.48)/2 = ±0.74, y = +0.5/0/-0.5 from 2X (0.5)"
