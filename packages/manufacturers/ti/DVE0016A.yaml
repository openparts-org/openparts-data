# TI DVE0016A "SO-MOD - 2.65 mm max height" (16-lead wide SOIC module
# body, 1.27 mm pitch; drawing 4224275/D 10/2023 on the outline page,
# 4224275/A 10/2023 printed on the board-layout page), read from the
# PACKAGE OUTLINE page of SNVSB38D (UCC12050, PDF page 32) and the
# EXAMPLE BOARD LAYOUT page (page 33). Millimetres as printed. Its
# printed numbers equal manufacturers/ti/DW0016B (another drawing), so
# the dimensions and the IPC-7351 NOMINAL land pattern are recorded the
# same way: 16X (2) x (0.6) pads, (9.3) row spacing -> x = ±4.65, 14X
# (1.27) pitch. Pin 1 top-left.
