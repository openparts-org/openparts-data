# TI DCK0006A "SOT - 1.1 max height" (6-lead SC70; drawing 4214835/D
# 11/2024, note 4: JEDEC MO-203 variation AB), read from the rendered
# outline page of ti/SLVSEN5B (TPS22919, PDF page 24) and its EXAMPLE
# BOARD LAYOUT page (page 25). Millimetres as printed, ranges only (no
# nominal).
#
# Top view: leads 1, 2, 3 down the left edge ("4X 0.65" basic, "1.3"
# basic pin 1 to pin 3), 4-5-6 up the right edge (6 opposite 1) -- the
# generator's [3, 3] layout.
# Field mapping as for manufacturers/ti/DCK0005A: body_width = "2.15 /
# 1.85" (body along the rows, datum A), body_length = "1.4 / 1.1"
# (molded width across the rows, datum B), overall_length = "2.4 / 1.8"
# (lead-tip span). Height printed as "1.1 / 0.8" -> overall_height.
# Land pattern: page 25 "LAND PATTERN EXAMPLE" (all values in
# parentheses, reference values per note 1), recorded in `pads`.
schema_version: "0.2"
kind: package
id: manufacturers/ti/DCK0006A
family: sot
lead_count: 6

lead_layout:
  value: [3, 3]
  src:   'p24 "DCK0006A top view: leads 1, 2, 3 on the left edge, 4, 5, 6 up the right edge (6 opposite 1)"'

source: ti/SLVSEN5B

pitch:
  typ: 0.65 mm
  src: p24 "PACKAGE OUTLINE DCK0006A (4214835/D), "4X 0.65" basic; "1.3" basic pin 1 to pin 3"

geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 1.85 mm
    max: 2.15 mm
    src: p24 "DCK0006A, body "2.15 / 1.85" along the rows (datum A)"
  body_length:
    min: 1.1 mm
    max: 1.4 mm
    src: p24 "DCK0006A, body "1.4 / 1.1" across the rows (datum B)"
  lead_thickness:
    min: 0.08 mm
    max: 0.22 mm
    src: p24 "DCK0006A lead detail, "0.22 / 0.08 TYP""
  lead_length: { min: 0.26 mm, max: 0.46 mm, src: 'p24 "DCK0006A lead detail, "0.46 / 0.26 TYP""' }
  overall_length:
    min: 1.8 mm
    max: 2.4 mm
    src: p24 "DCK0006A top view, lead-tip span "2.4 / 1.8""
  overall_height: { min: 0.8 mm, max: 1.1 mm, src: 'p24 "DCK0006A side view, "1.1 / 0.8""' }
  standoff:       { min: 0 mm, max: 0.1 mm, src: 'p24 "DCK0006A side view, "0.1 / 0.0 TYP""' }
  lead_width:     { min: 0.15 mm, max: 0.3 mm, src: 'p24 "DCK0006A, "6X 0.30 / 0.15" (note 5)"' }

pads:
  value:
    - { number: "1", x: -1.1, y: 0.65, width: 0.9, length: 0.4 }
    - { number: "2", x: -1.1, y: 0, width: 0.9, length: 0.4 }
    - { number: "3", x: -1.1, y: -0.65, width: 0.9, length: 0.4 }
    - { number: "4", x: 1.1, y: -0.65, width: 0.9, length: 0.4 }
    - { number: "5", x: 1.1, y: 0, width: 0.9, length: 0.4 }
    - { number: "6", x: 1.1, y: 0.65, width: 0.9, length: 0.4 }
  src: p25 "DCK0006A LAND PATTERN EXAMPLE (ref.), 6X (0.9)x(0.4), x = ±(2.2)/2 = ±1.1, y from 4X (0.65)"
