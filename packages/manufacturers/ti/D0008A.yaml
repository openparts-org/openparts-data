# TI D0008A "SOIC - 1.75 mm max height" (drawing 4214825/C 02/2019,
# JEDEC MS-012 variation AA per its note 5), read from the rendered
# outline page of SLCS005AH (page 43). Controlling dimensions are
# inches; the bracketed millimetre values are recorded as printed.
#
# The drawing states ranges only for the body (E1 3.81-3.98, D
# 4.81-5.00) -- no nominal is recorded (canonical-data 20.1). Not the
# same as standards/SOIC8-3.90x4.90-P1.27 (Microchip C04-057-SN BSC
# values; e.g. its lead thickness 0.17-0.25 vs this drawing's
# 0.13-0.25), so not reused. Note: the soic generator currently needs
# a body nominal, so this package does not render a 3D model/footprint.
# Pitch "6X .050 [1.27]" is basic. The A1 range is printed ".004-.010
# [0.11-0.25]" and recorded as printed.
