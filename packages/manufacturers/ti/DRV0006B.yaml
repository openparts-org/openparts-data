# TI DRV0006B, WSON-6, 2x2 mm, 0.65 mm pitch, 0.8 mm max height. Outline
# drawing DRV0006B (4223922/A 09/2017) in SNOSD82D (TMP117) page 40 and
# its Example Board Layout on page 41, read from the rendered drawings.
#
# Mapping: body limits -> body_width (across the two terminal rows) /
# body_length; "0.8 MAX" (no A2) -> body_height max; A1 "0.05/0.00" ->
# standoff; "6X 0.35/0.25" -> lead_width; "6X 0.3/0.2" -> lead_length;
# thermal pad "1+-0.1" x "1.6+-0.1" -> exposed_pad.
# Top view: pin 1 top-left, 1-3 down the left, 4-6 up the right (SOIC
# order), as in the pin configuration figure (page 4).
# pads: the Example Board Layout (page 41) has the six terminal lands only
# and NO thermal-pad land (TMP117 section 9 says the thermal pad should be
# left unsoldered); lands 0.45 x 0.3 (both parenthesised reference values),
# pitch (0.65), land centres (1.95) apart across the rows -> x = +-0.975.
# Left out: side-view "(0.2) TYP" (side-wall metal, not A3).
schema_version: "0.2"
kind: package
id: manufacturers/ti/DRV0006B
family: son
lead_count: 6
source: ti/SNOSD82D

pitch: { typ: 0.65 mm, src: 'p40 "DRV0006B outline (4223922/A), bottom view, basic "4X 0.65""' }
geometry: { type: parametric, generator: son }

dimensions:
  body_width:
    min: 1.9 mm
    max: 2.1 mm
    src: p40 "DRV0006B outline, top view "2.1 / 1.9" (across the rows)"
  body_length:
    min: 1.9 mm
    max: 2.1 mm
    src: p40 "DRV0006B outline, top view "2.1 / 1.9" (along the rows)"
  body_height: { max: 0.8 mm, src: 'p40 "DRV0006B outline, side view "0.8 MAX""' }
  exposed_pad:
    src:    p40 "DRV0006B outline, bottom view, thermal pad "1+-0.1" x "1.6+-0.1""
    width:  { min: 0.9 mm, typ: 1 mm, max: 1.1 mm }
    length: { min: 1.5 mm, typ: 1.6 mm, max: 1.7 mm }
  standoff:    { min: 0 mm, max: 0.05 mm, src: 'p40 "DRV0006B outline, side view "0.05 / 0.00""' }
  lead_width:
    min: 0.25 mm
    max: 0.35 mm
    src: p40 "DRV0006B outline, bottom view "6X 0.35 / 0.25""
  lead_length:
    min: 0.2 mm
    max: 0.3 mm
    src: p40 "DRV0006B outline, bottom view "6X 0.3 / 0.2""

pads:
  value:
    - { number: "1", x: -0.975, y: 0.65, width: 0.45, length: 0.3 }
    - { number: "2", x: -0.975, y: 0, width: 0.45, length: 0.3 }
    - { number: "3", x: -0.975, y: -0.65, width: 0.45, length: 0.3 }
    - { number: "4", x: 0.975, y: -0.65, width: 0.45, length: 0.3 }
    - { number: "5", x: 0.975, y: 0, width: 0.45, length: 0.3 }
    - { number: "6", x: 0.975, y: 0.65, width: 0.45, length: 0.3 }
  src: 'p41 "DRV0006B Example Board Layout: 6X (0.45) x 6X (0.3), 4X (0.65); x = +-(1.95)/2; no thermal land"'
