# TI DRB0008A, VSON-8, 3x3 mm, 0.65 mm pitch, 1 mm max height. Outline
# drawing DRB0008A (4218875/A 01/2018) in SLOS369G page 36, read from the
# rendered drawing. D/E limits -> body_width/body_length (no nominal
# printed); A max -> body_height; A1 -> standoff; b -> lead_width; L ->
# lead_length; thermal pad 1.5 ±0.1 across the rows, 1.75 ±0.1 along
# them. Bottom view numbers 1-4 up the left (pin 1 lower left), 5-8 down
# the right; seen from the top: pin 1 top-left, SOIC order (matches the
# "DRB Package 8-Pin VSON Top View", page 3). Differs from DRB0008B
# (pad 1.65 x 2.4) -- not reused.
schema_version: "0.2"
kind: package
id: manufacturers/ti/DRB0008A
family: son
lead_count: 8
source: ti/SLOS369G

pitch: { typ: 0.65 mm, src: 'p36 "DRB0008A outline (4218875/A), bottom view "6X 0.65""' }
geometry: { type: parametric, generator: son }

dimensions:
  body_width:
    min: 2.9 mm
    max: 3.1 mm
    src: p36 "DRB0008A outline, top view "3.1 / 2.9" (across the rows)"
  body_length: { min: 2.9 mm, max: 3.1 mm, src: 'p36 "DRB0008A outline, top view "3.1 / 2.9""' }
  body_height: { max: 1 mm, src: 'p36 "DRB0008A outline, side view "1 MAX""' }
  exposed_pad:
    src:    p36 "DRB0008A outline, bottom view, thermal pad "1.5±0.1" across, "1.75±0.1" along the rows"
    width:  { min: 1.4 mm, typ: 1.5 mm, max: 1.6 mm }
    length: { min: 1.65 mm, typ: 1.75 mm, max: 1.85 mm }
  standoff:    { min: 0 mm, max: 0.05 mm, src: 'p36 "DRB0008A outline, side view "0.05 / 0.00""' }
  lead_width:
    min: 0.25 mm
    max: 0.37 mm
    src: p36 "DRB0008A outline, bottom view "8X 0.37 / 0.25""
  lead_length:
    min: 0.3 mm
    max: 0.5 mm
    src: p36 "DRB0008A outline, bottom view "8X 0.5 / 0.3""
