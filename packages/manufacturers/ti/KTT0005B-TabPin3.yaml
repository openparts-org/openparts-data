# TI KTT0005B, TO-263 (DDPAK) 5-lead, "MECHANICAL DATA" drawing TS5B
# (Rev D), SNVS124G (LM2596) page 45, read from the drawing rendered at
# 300 dpi. "CONTROLLING DIMENSION IS INCH, VALUES IN [ ] ARE
# MILLIMETERS": the bracketed millimetre values printed on the drawing
# are recorded, the inch text is quoted in the locators.
#
# Frame: the drawing shows the leads on the right with lead 1 at the
# bottom ("1", "5" labels, PIN 1 ID); turned 180 degrees this is the
# generator frame (leads left, lead 1 at the top, tab right). All five
# leads are drawn full length (none trimmed).
#
# TAB NUMBER (flagged for review): the drawing does not number the tab
# and Table 6-1 lists pins 1-5 only; Figure 6-2 "5-Pin TO-263 KTT
# Package Top View" (page 4) labels it "Metal Tab GND". The tab is
# keyed "3" (pin 3 = Ground, Table 6-1) so it lands on the ground net;
# hence the id suffix -TabPin3.
#
# Mapping: .340 +-.010 [8.64 +-0.25] (datum B to lead-side body edge)
# -> body_width 8.39-8.89; .400 +.010/-.005 [10.16 +0.25/-0.12] ->
# body_length 10.04-10.41; ".565 MAX [14.35]" -> overall_width (max
# only); ".050 MAX [1.27]" -> tab_length (max only); .180 +.003/-.005
# [4.57 +0.08/-0.13] (no A2) -> body_height 4.44-4.65; .000-.006
# [0-0.15] -> standoff; 5X .028-.038 [0.71-0.97] -> lead_width;
# .015-.030 [0.38-0.76] -> lead_thickness; .078 [1.98] (foot, printed
# without tolerance) -> lead_length nominal; 4X .067 [1.7] boxed basic
# -> pitch.
# TAB WIDTH (flagged for review): only the bottom-side exposed metal
# ".200 MIN [5.08]" x ".200 MIN [5.08]" is given for the tab itself;
# tab_width records the 10.04-10.41 body width, whose extension line
# is drawn from the tab-end corner (the tab spans the body width).
# Left out: tab thickness .050 +-.002, land pattern (reference values),
# angles, the .030 gage plane.
