# GigaDevice 48-pin LQFP, 7x7mm body, 0.5mm pitch. Values copied
# from the package-dimension tables of two GigaDevice datasheets, which
# print identical numbers: GD32VF103 Rev 1.6 Table 5-3 "LQFP48 package dimensions" (PDF page
# 78) and GD32F303xx Rev 2.0 Table 5-4 "LQFP48 package dimensions" (PDF page 94).
#
# Not merged into a standards/ package: GigaDevice's D1/E1 tolerance
# (6.90-7.10) and b (0.18-0.26) differ from the existing ST-sourced
# standards LQFP outline, so the dimensions do not match exactly.
# Where the table gives no "Typ", only min/max are recorded. b and c are
# the "with plating" values (section B-B); b1/c1 (base metal), A3, eB, L1
# and theta are not recorded (no canonical field).
schema_version: "0.1"
kind: package
id: manufacturers/gigadevice/LQFP48-7x7-P0.5

family: lqfp
lead_count: 48

pitch:
  nominal: 0.5
  unit: mm

dimensions:
  body_width:
    nominal: 7.00
    min: 6.90
    max: 7.10
    unit: mm
  body_length:
    nominal: 7.00
    min: 6.90
    max: 7.10
    unit: mm
  body_height:
    nominal: 1.40
    min: 1.35
    max: 1.45
    unit: mm
  overall_width:
    nominal: 9.00
    min: 8.80
    max: 9.20
    unit: mm
  overall_length:
    nominal: 9.00
    min: 8.80
    max: 9.20
    unit: mm
  overall_height:
    max: 1.60
    unit: mm
  standoff:
    min: 0.05
    max: 0.15
    unit: mm
  lead_width:
    min: 0.18
    max: 0.26
    unit: mm
  lead_length:
    min: 0.45
    max: 0.75
    unit: mm
  lead_thickness:
    min: 0.13
    max: 0.17
    unit: mm

geometry:
  type: parametric
  generator: lqfp

