# GigaDevice 64-pin LQFP, 10x10mm body, 0.5mm pitch. Values copied
# from the package-dimension tables of two GigaDevice datasheets, which
# print identical numbers: GD32VF103 Rev 1.6 Table 5-2 "LQFP64 package dimensions" (PDF page
# 76) and GD32F303xx Rev 2.0 Table 5-3 "LQFP64 package dimensions" (PDF page 92).
#
# Not merged into a standards/ package: GigaDevice's D1/E1 tolerance
# (9.90-10.10) and b (0.18-0.26) differ from the existing ST-sourced
# standards LQFP outline, so the dimensions do not match exactly.
# Where the table gives no "Typ", only min/max are recorded. b and c are
# the "with plating" values (section B-B); b1/c1 (base metal), A3, eB, L1
# and theta are not recorded (no canonical field).
schema_version: "0.2"
kind: package
id: manufacturers/gigadevice/LQFP64-10x10-P0.5
family: lqfp
lead_count: 64
source: gigadevice/GD32F303xx_Datasheet@rev2.0

pitch:
  typ: 0.5 mm
  src:
    - gigadevice/GD32VF103_Datasheet@rev1.6 p76 "Table 5-2 "LQFP64 package dimensions", symbol "e""
    - p92 "Table 5-3 "LQFP64 package dimensions", symbol "e""

geometry: { type: parametric, generator: lqfp }

dimensions:
  body_width:
    min: 9.9 mm
    typ: 10 mm
    max: 10.1 mm
    src:
      - gigadevice/GD32VF103_Datasheet@rev1.6 p76 "Table 5-2 "LQFP64 package dimensions", symbol "E1""
      - p92 "Table 5-3 "LQFP64 package dimensions", symbol "E1""
  body_length:
    min: 9.9 mm
    typ: 10 mm
    max: 10.1 mm
    src:
      - gigadevice/GD32VF103_Datasheet@rev1.6 p76 "Table 5-2 "LQFP64 package dimensions", symbol "D1""
      - p92 "Table 5-3 "LQFP64 package dimensions", symbol "D1""
  body_height:
    min: 1.35 mm
    typ: 1.4 mm
    max: 1.45 mm
    src:
      - gigadevice/GD32VF103_Datasheet@rev1.6 p76 "Table 5-2 "LQFP64 package dimensions", symbol "A2""
      - p92 "Table 5-3 "LQFP64 package dimensions", symbol "A2""
  lead_thickness:
    min: 0.13 mm
    max: 0.17 mm
    src:
      - gigadevice/GD32VF103_Datasheet@rev1.6 p76 "Table 5-2 "LQFP64 package dimensions", symbol "c" (no typ)"
      - p92 "Table 5-3 "LQFP64 package dimensions", symbol "c" (no typ)"
  overall_width:
    min: 11.8 mm
    typ: 12 mm
    max: 12.2 mm
    src:
      - gigadevice/GD32VF103_Datasheet@rev1.6 p76 "Table 5-2 "LQFP64 package dimensions", symbol "E""
      - p92 "Table 5-3 "LQFP64 package dimensions", symbol "E""
  overall_length:
    min: 11.8 mm
    typ: 12 mm
    max: 12.2 mm
    src:
      - gigadevice/GD32VF103_Datasheet@rev1.6 p76 "Table 5-2 "LQFP64 package dimensions", symbol "D""
      - p92 "Table 5-3 "LQFP64 package dimensions", symbol "D""
  overall_height:
    max: 1.6 mm
    src:
      - gigadevice/GD32VF103_Datasheet@rev1.6 p76 "Table 5-2 "LQFP64 package dimensions", symbol "A" (max only)"
      - p92 "Table 5-3 "LQFP64 package dimensions", symbol "A" (max only)"
  standoff:
    min: 0.05 mm
    max: 0.15 mm
    src:
      - gigadevice/GD32VF103_Datasheet@rev1.6 p76 "Table 5-2 "LQFP64 package dimensions", symbol "A1" (no typ)"
      - p92 "Table 5-3 "LQFP64 package dimensions", symbol "A1" (no typ)"
  lead_width:
    min: 0.18 mm
    max: 0.26 mm
    src:
      - gigadevice/GD32VF103_Datasheet@rev1.6 p76 "Table 5-2 "LQFP64 package dimensions", symbol "b" (no typ)"
      - p92 "Table 5-3 "LQFP64 package dimensions", symbol "b" (no typ)"
  lead_length:
    min: 0.45 mm
    max: 0.75 mm
    src:
      - gigadevice/GD32VF103_Datasheet@rev1.6 p76 "Table 5-2 "LQFP64 package dimensions", symbol "L" (no typ)"
      - p92 "Table 5-3 "LQFP64 package dimensions", symbol "L" (no typ)"
