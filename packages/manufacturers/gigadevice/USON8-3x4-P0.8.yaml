# GigaDevice 8-pad USON 3x4 mm, 0.80 mm pitch. From section 10.2
# "Package USON8 (3x4mm)" of the GD25Q64E datasheet Rev 1.6, page 56
# (table in the text layer, views checked on the rendered page).
# Frame: the bottom view has pads 1-4 and 5-8 in two columns, e along
# them; D (3.00, drawn horizontally across the two rows) = body_width
# (X), E (4.00, along the rows) = body_length (Y). body_height = A.
# lead_thickness = c (side view). The bottom view's two small metal tabs
# (D1 0.20 x E1 0.80, e1 0.80 apart) are, per note 1, an exposed metal
# area "not connected to any internal signal"; they are not modelled as
# a pad (no exposed_pad). Coplanarity / edge tolerance (note 2) not
# modelled.
