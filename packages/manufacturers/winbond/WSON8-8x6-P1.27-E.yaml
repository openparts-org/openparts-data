# Winbond 8-pad WSON 8x6 mm (package code E), 1.27 mm pitch, centre
# metal pad. From section 10.4 of the W25Q128JV datasheet Revision F, PDF
# page 71 (printed 70); rendered and read from the image, numbers also
# in the text layer. Frame: the drawing's D (8.00, horizontal, the terminal
# rows are on its two ends) = body_width (X), E (6.00, along the rows) =
# body_length (Y); exposed pad D2 (horizontal) = width (X), E2 = length
# (Y). body_height = A (no A2). lead_thickness = C "0.20 REF" (side
# view: terminal thickness; reference value). Coplanarity y not
# modelled. The note says the centre pad "is not connected to any
# internal electrical signals" -- the Device gets no EP pin.
schema_version: "0.2"
kind: package
id: manufacturers/winbond/WSON8-8x6-P1.27-E
family: son

lead_count:
  value: 8
  src: p71 "section 10.4 "8-Pad WSON 8x6-mm (Package Code E)" table, 8 pads (title and drawing) (PDF page 71, printed 70)"

source: winbond/W25Q128JV@revF

pitch:
  typ: 1.27 mm
  src: p71 "section 10.4 "8-Pad WSON 8x6-mm (Package Code E)" table, "e 1.27 BSC" (PDF page 71, printed 70)"

geometry: { type: parametric, generator: son }

dimensions:
  body_width:
    min: 7.9 mm
    typ: 8 mm
    max: 8.1 mm
    src: p71 "section 10.4 "8-Pad WSON 8x6-mm (Package Code E)" table, "D 7.90 / 8.00 / 8.10" (horizontal, across the terminal rows) (PDF page 71, printed 70)"
  body_length:
    min: 5.9 mm
    typ: 6 mm
    max: 6.1 mm
    src: p71 "section 10.4 "8-Pad WSON 8x6-mm (Package Code E)" table, "E 5.90 / 6.00 / 6.10" (along the terminal rows) (PDF page 71, printed 70)"
  body_height:
    min: 0.7 mm
    typ: 0.75 mm
    max: 0.8 mm
    src: p71 "section 10.4 "8-Pad WSON 8x6-mm (Package Code E)" table, "A 0.70 / 0.75 / 0.80" (PDF page 71, printed 70)"
  exposed_pad:
    src:    p71 "section 10.4 "8-Pad WSON 8x6-mm (Package Code E)" table, "D2 3.35 / 3.40 / 3.45" (width, X) and "E2 4.25 / 4.30 / 4.35" (length, Y) (PDF page 71, printed 70)"
    width:  { min: 3.35 mm, typ: 3.4 mm, max: 3.45 mm }
    length: { min: 4.25 mm, typ: 4.3 mm, max: 4.35 mm }
  standoff:
    min: 0 mm
    typ: 0.02 mm
    max: 0.05 mm
    src: p71 "section 10.4 "8-Pad WSON 8x6-mm (Package Code E)" table, "A1 0.00 / 0.02 / 0.05" (PDF page 71, printed 70)"
  lead_width:
    min: 0.35 mm
    typ: 0.4 mm
    max: 0.48 mm
    src: p71 "section 10.4 "8-Pad WSON 8x6-mm (Package Code E)" table, "b 0.35 / 0.40 / 0.48" (PDF page 71, printed 70)"
  lead_length:
    min: 0.45 mm
    typ: 0.5 mm
    max: 0.55 mm
    src: p71 "section 10.4 "8-Pad WSON 8x6-mm (Package Code E)" table, "L 0.45 / 0.50 / 0.55" (PDF page 71, printed 70)"
  lead_thickness:
    typ: 0.2 mm
    src: p71 "section 10.4 "8-Pad WSON 8x6-mm (Package Code E)" table, "C 0.20 REF" (reference value) (PDF page 71, printed 70)"
