# Winbond 8-pad XSON 4x4x0.45 mm (package code XG), 0.80 mm pitch, centre
# metal pad. From section 10.5 of the W25Q64JV datasheet Revision N, PDF
# page 72 (printed 71); rendered and read from the image (the table is not
# in the text layer). Frame: the bottom view's D (4.00, horizontal, the
# terminal rows are on its two ends) = body_width (X), E (4.00, along the
# rows) = body_length (Y); exposed pad D1 (horizontal) = width (X), E1 =
# length (Y). body_height = A. Coplanarity not modelled. Section 10 notes
# for the WSON pads that the centre pad "is not connected to any internal
# electrical signals"; the XSON page states nothing -- the Device has no
# EP pin either way.
schema_version: "0.2"
kind: package
id: manufacturers/winbond/XSON8-4x4-P0.8-XG
family: son

lead_count:
  value: 8
  src: p72 "section 10.5 "8-Pad XSON 4x4x0.45-mm (Package Code XG)", 8 pads in the bottom view"

source: winbond/W25Q64JV@revN

pitch: { typ: 0.8 mm, src: 'p72 "section 10.5 table, "e 0.80 BSC""' }
geometry: { type: parametric, generator: son }

dimensions:
  body_width:
    min: 3.9 mm
    typ: 4 mm
    max: 4.1 mm
