# Winbond 8-pin SOIC 208-mil (package code S), 1.27 mm pitch. All values
# from section 10.1 "8-Pin SOIC 208-mil (Package Code S)" of the
# W25Q128JV datasheet Revision F, PDF page 68 (printed page 67); the
# page was rendered and the drawing/table read from the image.
#
# The drawing dimensions the body twice: D1/E1 (5.13/5.23/5.33) at the
# top of the molding and D/E (5.18/5.28/5.38) at its base. Following
# the soic convention body_width = E1, body_length = D1 is used; D/E are
# noted here, not modelled. overall_width = H (lead tip to tip),
# body_height = A2, overall_height = A, standoff = A1, lead_width = b,
# lead_thickness = C, lead_length = L. All MIN/NOM/MAX as printed.
#
# Not merged into standards/SOIC8-5.3x5.2-P1.27 (Microchip 8S2): the
# limits differ (e.g. E1 5.18-5.40 there vs 5.13-5.33 here).
schema_version: "0.2"
kind: package
id: manufacturers/winbond/SOIC8-208mil-S
family: soic
lead_count: 8
source: winbond/W25Q128JV@revF

pitch: { typ: 1.27 mm, src: 'p68 "Section 10.1 table, "e 1.27 BSC""' }
geometry: { type: parametric, generator: soic }

dimensions:
  body_width:
    min: 5.13 mm
    typ: 5.23 mm
    max: 5.33 mm
    src: p68 "Section 10.1 table, "E1 5.13 / 5.23 / 5.33" (mm)"
  body_length:
    min: 5.13 mm
    typ: 5.23 mm
    max: 5.33 mm
    src: p68 "Section 10.1 table, "D1 5.13 / 5.23 / 5.33" (mm)"
  body_height:
    min: 1.7 mm
    typ: 1.8 mm
    max: 1.91 mm
    src: p68 "Section 10.1 table, "A2 1.70 / 1.80 / 1.91" (mm)"
  lead_thickness:
    min: 0.19 mm
    typ: 0.2 mm
    max: 0.25 mm
    src: p68 "Section 10.1 table, "C 0.19 / 0.20 / 0.25" (mm)"
  overall_width:
    min: 7.7 mm
    typ: 7.9 mm
    max: 8.1 mm
    src: p68 "Section 10.1 table, "H 7.70 / 7.90 / 8.10" (mm)"
  overall_height:
    min: 1.75 mm
    typ: 1.95 mm
    max: 2.16 mm
    src: p68 "Section 10.1 table, "A 1.75 / 1.95 / 2.16" (mm)"
  standoff:
    min: 0.05 mm
    typ: 0.15 mm
    max: 0.25 mm
    src: p68 "Section 10.1 table, "A1 0.05 / 0.15 / 0.25" (mm)"
  lead_width:
    min: 0.35 mm
    typ: 0.42 mm
    max: 0.48 mm
    src: p68 "Section 10.1 table, "b 0.35 / 0.42 / 0.48" (mm)"
  lead_length:
    min: 0.5 mm
    typ: 0.65 mm
    max: 0.8 mm
    src: p68 "Section 10.1 table, "L 0.50 / 0.65 / 0.80" (mm)"
