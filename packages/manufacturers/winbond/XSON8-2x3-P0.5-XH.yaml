# Winbond 8-pad XSON 2x3x0.4 mm (package code XH), 0.50 mm pitch, centre
# metal pad. From section 9.3 of the W25Q32RV datasheet Revision F, PDF
# page 78 (printed 77); rendered and read from the image (the table is not
# in the text layer). Frame: the bottom view's E (3.00, horizontal, the
# terminal rows are on its two ends) = body_width (X), D (2.00, along the
# rows) = body_length (Y); exposed pad E2 (horizontal) = width (X), D2 =
# length (Y). body_height = A. lead_thickness = C "0.127 Ref.".
# Coplanarity y and K (Ref.) not modelled. The page note: the centre pad
# "is not connected to any internal electrical signals" -- no EP pin.
