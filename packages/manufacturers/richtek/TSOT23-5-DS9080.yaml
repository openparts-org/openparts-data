# Richtek "TSOT-23-5 Surface Mount Package" outline from DS9080-09
# section 19.1 (PDF page 17), rendered and read as an image. The
# drawing has no drawing number, so the package is named after the
# document. Values from the "Dimensions In Millimeters" Min/Max columns
# (the inch columns agree: e.g. A 0.028-0.039 in); there is no nominal
# column, so every dimension is min/max only -- including the lead
# pitch e 0.838-1.041 (no basic value is stated).
#
# Letter mapping, read from the drawing's arrows: D = body length
# along the lead rows (body_width for the `sot` generator), B = molded
# body width across the rows (body_length), C = lead-tip span
# (overall_length), A = overall height, A1 = standoff, b = lead width,
# H = lead thickness (side view), L = foot length.
#
# Pin positions from the TSOT-23-5 top view in section 7 (page 4):
# pins 1, 2, 3 left to right along the bottom edge (pin-1 mark at 1),
# 5 above pin 1 and 4 above pin 3 -- lead_layout [3, 2] in the
# generator's counter-clockwise convention.
schema_version: "0.2"
kind: package
id: manufacturers/richtek/TSOT23-5-DS9080
family: sot
lead_count: 5

lead_layout:
  value: [3, 2]
  src:   'p4 "7 Pin Configuration, TSOT-23-5 (TOP VIEW): 1, 2, 3 on the bottom edge, 5 and 4 on the top edge"'

source: richtek/DS9080-09

pitch:
  min: 0.838 mm
  max: 1.041 mm
  src: p17 "19.1 TSOT-23-5 table, "e 0.838 / 1.041" (Min/Max only)"

geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 2.692 mm
    max: 3.099 mm
    src: p17 "19.1 TSOT-23-5 table, "D 2.692 / 3.099" -- see letter mapping"
  body_length:
    min: 1.397 mm
    max: 1.803 mm
    src: p17 "19.1 TSOT-23-5 table, "B 1.397 / 1.803" -- see letter mapping"
  lead_thickness:
    min: 0.08 mm
    max: 0.254 mm
    src: p17 "19.1 TSOT-23-5 table, "H 0.080 / 0.254" (lead thickness in the side view)"
  lead_length: { min: 0.3 mm, max: 0.61 mm, src: 'p17 "19.1 TSOT-23-5 table, "L 0.300 / 0.610""' }
  overall_length:
    min: 2.591 mm
    max: 3 mm
    src: p17 "19.1 TSOT-23-5 table, "C 2.591 / 3.000" (lead-tip span)"
  overall_height: { min: 0.7 mm, max: 1 mm, src: 'p17 "19.1 TSOT-23-5 table, "A 0.700 / 1.000""' }
  standoff:       { min: 0 mm, max: 0.1 mm, src: 'p17 "19.1 TSOT-23-5 table, "A1 0.000 / 0.100""' }
  lead_width: { min: 0.3 mm, max: 0.559 mm, src: 'p17 "19.1 TSOT-23-5 table, "b 0.300 / 0.559""' }
