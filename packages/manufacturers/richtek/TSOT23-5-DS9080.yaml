# Richtek "TSOT-23-5 Surface Mount Package" outline from DS9080-09
# section 19.1 (PDF page 17), rendered and read as an image. The
# drawing has no drawing number, so the package is named after the
# document. Values from the "Dimensions In Millimeters" Min/Max columns
# (the inch columns agree: e.g. A 0.028-0.039 in); there is no nominal
# column, so every dimension is min/max only -- including the lead
# pitch e 0.838-1.041 (no basic value is stated).
#
# Letter mapping, read from the drawing's arrows: D = body length
# along the lead rows (body_width for the `sot` generator), B = molded
# body width across the rows (body_length), C = lead-tip span
# (overall_length), A = overall height, A1 = standoff, b = lead width,
# H = lead thickness (side view), L = foot length.
#
# Pin positions from the TSOT-23-5 top view in section 7 (page 4):
# pins 1, 2, 3 left to right along the bottom edge (pin-1 mark at 1),
# 5 above pin 1 and 4 above pin 3 -- lead_layout [3, 2] in the
# generator's counter-clockwise convention.
schema_version: "0.1"
kind: package
id: manufacturers/richtek/TSOT23-5-DS9080

family: sot
lead_count: 5
lead_layout: [3, 2]

pitch:
  min: 0.838
  max: 1.041
  unit: mm

dimensions:
  body_width:
    min: 2.692
    max: 3.099
    unit: mm
  body_length:
    min: 1.397
    max: 1.803
    unit: mm
  overall_length:
    min: 2.591
    max: 3.000
    unit: mm
  overall_height:
    min: 0.700
    max: 1.000
    unit: mm
  standoff:
    min: 0.000
    max: 0.100
    unit: mm
  lead_width:
    min: 0.300
    max: 0.559
    unit: mm
  lead_length:
    min: 0.300
    max: 0.610
    unit: mm
  lead_thickness:
    min: 0.080
    max: 0.254
    unit: mm

geometry:
  type: parametric
  generator: sot

provenance:
  "/pitch":
    - source: richtek/DS9080-09
      page: 17
      locator: "19.1 TSOT-23-5 table, \"e 0.838 / 1.041\" (Min/Max only)"
  "/lead_layout":
