# vertical. Figure 40 bottom view: pin 1 top-right (PIN 1 INDEX), 1-4 down
# the right edge, 5-7 bottom right-to-left, 8-11 up the left, 12-14 top;
# mirrored that is the Figure 33 top view (page 280): counter-clockwise
# from the top of the left edge -> lead_layout [4, 3, 4, 3].
# CONFLICT: Figure 38 (outline top view, page 284) points "PIN 1" at the
# bottom-right corner; Figures 33 (pin-out top view) and 40 (bottom view)
# agree with each other and are used.
# Pitch e 0.50 (basic), D1 1.00 (3-pad rows), E1 1.50 (4-pad columns), all
# centred. Pad length L 0.425/0.475/0.525, pad width b 0.20/0.25/0.30,
# L1 "Distance package to pad" 0.05/0.10/0.15 ("L1 (All sides)").
# Height F 0.78/0.83/0.88 (overall) -> body_height.
# Not drawn by the generator: the "PIN 1 INDEX (0.25X0.09)" pad.
