# Bosch Sensortec 8-pin metal-lid LGA 2.0 x 2.5 x 0.95 mm (BMP280). Read
# from Figure 18 "Package outline dimensions" (section 7.1, page 38) and
# Figure 19 "Recommended landing pattern (top view)" (section 7.2, page
# 39) of BST-BMP280-DS001-26. Note under Figure 18: "General tolerances
# are +-50 um (linear)"; values without a printed tolerance are recorded
# as nominal only.
#
# Terminal frame: Figure 14 (top view, page 34) and Figure 19 put pins
# 1-4 down the right edge and 5-8 up the left edge (8 top-left) --
# clockwise in top view. lead_layout [4, 0, 4, 0], pad_order = source
# numbers in the generator's CCW position order: 8 7 6 5 4 3 2 1.
# body_width = 2.00+-0.10 (across the two terminal columns, X in Figure
# 19), body_length = 2.50+-0.10. Figure 18's bottom view shows the land
# turned 90 deg (rows of 4) at pitch 0.65; its terminal size reads 0.35
# in both directions (pad 1 width "0.35", row height "0.35").
# pads (Figure 19): 0.5 x 0.35 lands, inner edges 0.55 from the centre
# line -> x = +-(0.55 + 0.5/2) = +-0.8; y = +-0.325, +-(0.325 + 0.65).
# Left out: bottom-view "0.20", "1.45" and the side-view "0.13+-0.025"
# (features not identified with certainty), lead_inset (not printed).
# Generated footprint check: the lga generator places this land turned
# 90 deg (pins 1-4 along the top edge, pin 1 top-left); the explicit pads
# come out in the same orientation (rotation, not a mirror).
schema_version: "0.2"
kind: package
id: manufacturers/bosch/LGA8-2.0x2.5-P0.65-BMP280
family: lga
lead_count: 8

lead_layout:
  value: [4, 0, 4, 0]
  src:   'p34 "Figure 14 pin-out top view: 1-4 right edge, 5-8 left edge (clockwise)"'

source: bosch/BST-BMP280-DS001-26

pitch: { typ: 0.65 mm, src: 'p38 "Figure 18 bottom view, 0.65"' }

pad_order:
  value: ["8", "7", "6", "5", "4", "3", "2", "1"]
  src:   p34 "Figure 14 top view, numbers in CCW position order (clockwise numbering)"

geometry: { type: parametric, generator: lga }

dimensions:
  body_width:  { min: 1.9 mm, typ: 2 mm, max: 2.1 mm, src: 'p38 "Figure 18 top view, 2.00+-0.10"' }
  body_length:
    min: 2.4 mm
    typ: 2.5 mm
    max: 2.6 mm
    src: p38 "Figure 18 top view, 2.50+-0.10"
  body_height:
    min: 0.9 mm
    typ: 0.95 mm
    max: 1 mm
    src: p38 "Figure 18 side view, 0.95+-0.05"
  lead_length: { typ: 0.35 mm, src: 'p38 "Figure 18 bottom view, terminal row height 0.35"' }
  lead_width:  { typ: 0.35 mm, src: 'p38 "Figure 18 bottom view, pad 1 width 0.35"' }

pads:
  value:
    - { number: "1", x: 0.8, y: 0.975, width: 0.5, length: 0.35 }
    - { number: "2", x: 0.8, y: 0.325, width: 0.5, length: 0.35 }
    - { number: "3", x: 0.8, y: -0.325, width: 0.5, length: 0.35 }
    - { number: "4", x: 0.8, y: -0.975, width: 0.5, length: 0.35 }
    - { number: "5", x: -0.8, y: -0.975, width: 0.5, length: 0.35 }
    - { number: "6", x: -0.8, y: -0.325, width: 0.5, length: 0.35 }
    - { number: "7", x: -0.8, y: 0.325, width: 0.5, length: 0.35 }
    - { number: "8", x: -0.8, y: 0.975, width: 0.5, length: 0.35 }
  src: 'p39 "Figure 19: lands 0.5 x 0.35, x = +-(0.55 + 0.25), y = +-0.325, +-(0.325 + 0.65)"'
