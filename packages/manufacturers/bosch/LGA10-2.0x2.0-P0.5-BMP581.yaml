# Bosch Sensortec BMP581 10-pin metal-lid LGA 2.0 x 2.0 mm, max 0.80 mm,
# read from Figure 30 "BMP581 bottom view" and Figure 29 top view (section
# 8.1, page 68) and Figure 31 side view (page 69) of BST-BMP581-DS004-13.
# Footnote 8: "UNLESS OTHERWISE SPECIFIED DIMENSIONS ARE IN MILLIMETERS,
# TOLERANCES +-0.05"; values without their own tolerance are nominal only.
# In this outline drawing pins 1-2 are on the right edge of the bottom
# view (PIN 1 CORNER top-right), 3-5 along the bottom, 6-7 on the left,
# 8-10 along the top, i.e. clockwise in the bottom view = counter-clockwise
# from the top of the left edge in the top view -> lead_layout
# [2, 3, 2, 3] with no rotation. (The pin-out Figure 23 on page 46 draws
# the package rotated 90 deg, pins 1-2 on the top edge; same order.)
# Pitch: boxed 0.5 between the 2 side pads, boxed 1 across the 3-pad rows.
# Terminals 0.275 (inward) x 0.25: "0.275 x 0.25 (4x)" side pads and
# "0.25x0.275 (6x)" row pads; measured on a 600 dpi render, the side pads
# are longer in X and the row pads longer in Y. Boxed 1.525 between pad
# centres across the body. Edge to pad 0.1+-0.08.
# Height: "max. 0.80" (side view) -> body_height max only. The section 8.2
# landing pattern (footprint +25 um per side) is not used: the footprint
# is generated from the terminals.
schema_version: "0.1"
kind: package
id: manufacturers/bosch/LGA10-2.0x2.0-P0.5-BMP581

family: lga
lead_count: 10
lead_layout: [2, 3, 2, 3]

