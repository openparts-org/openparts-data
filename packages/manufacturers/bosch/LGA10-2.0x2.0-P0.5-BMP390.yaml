      locator: "Figure 26 bottom view, 2 pads on the pin-1/2 edge and its opposite, 3 on the other two; rotated 90 deg so pins 1-2 form the left edge (see header)"
    - source: bosch/BST-BMP388-DS001-07
      page: 49
      locator: "Figure 26 bottom view, 2 pads on the pin-1/2 edge and its opposite, 3 on the other two; rotated 90 deg so pins 1-2 form the left edge (see header)"
    - source: bosch/BST-BMP390-DS002-07
      page: 46
      locator: "Figure 23 pin-out top view: 1-2 top edge (1 at the right), 3-5 left, 6-7 bottom, 8-10 right -- counter-clockwise"
