# Bosch Sensortec 14-pin LGA 3 x 2.5 x 0.83 mm (BMI323, BMI330), read from
# Figures 44/45 (section 9.2 "Dimensions", page 212) of BST-BMI323-DS000-13.
# The BMI330 datasheet BST-BMI330-DS000-03 page 212 has the same figures:
# a 100 dpi render of the figure area of both pages is byte-identical
# (pixel identity), and so is the pin-out figure on page 206.
# Frame: boxed 3 horizontal (body_width), boxed 2.5 vertical. Bottom view
# pin 1 top-right (PIN#1 CORNER), 1-4 down the right edge, 5-7 bottom
# right-to-left, 8-11 up the left, 12-14 top -> mirrored: counter-clockwise
# from the top of the left edge (Figure 36 pin-out top view, page 206)
# -> lead_layout [4, 3, 4, 3].
# Pitch boxed 0.5 (10x); boxed 1.5 across the 4-pad columns, boxed 1
# across the 3-pad rows, centred. Terminals 0.475 (8x columns, 6x rows
# "0.475 (6x)") x 0.25 (8x/6x) -- 0.475 inward on every side. Edge to pad
# 0.1+-0.05 (both directions).
# Height: side view 0.83 +-0.04 (overall) -> body_height. A second side
# dimension "0.7 +-0.025" is not labelled in the drawing and is not
# recorded. Not drawn by the generator: the pin-1 marker pad ("must not
# be electrically connected", page 212).
