# Bosch Sensortec 14-pin LGA 3 x 2.5 x 0.83 mm (BMI323, BMI330), read from
# Figures 44/45 (section 9.2 "Dimensions", page 212) of BST-BMI323-DS000-13.
# The BMI330 datasheet BST-BMI330-DS000-03 page 212 has the same figures:
# a 100 dpi render of the figure area of both pages is byte-identical
# (pixel identity), and so is the pin-out figure on page 206.
# Frame: boxed 3 horizontal (body_width), boxed 2.5 vertical. Bottom view
# pin 1 top-right (PIN#1 CORNER), 1-4 down the right edge, 5-7 bottom
# right-to-left, 8-11 up the left, 12-14 top -> mirrored: counter-clockwise
# from the top of the left edge (Figure 36 pin-out top view, page 206)
# -> lead_layout [4, 3, 4, 3].
# Pitch boxed 0.5 (10x); boxed 1.5 across the 4-pad columns, boxed 1
# across the 3-pad rows, centred. Terminals 0.475 (8x columns, 6x rows
# "0.475 (6x)") x 0.25 (8x/6x) -- 0.475 inward on every side. Edge to pad
# 0.1+-0.05 (both directions).
# Height: side view 0.83 +-0.04 (overall) -> body_height. A second side
# dimension "0.7 +-0.025" is not labelled in the drawing and is not
# recorded. Not drawn by the generator: the pin-1 marker pad ("must not
# be electrically connected", page 212).
schema_version: "0.2"
kind: package
id: manufacturers/bosch/LGA14-3.0x2.5-P0.5-BMI323
family: lga
lead_count: 14

lead_layout:
  value: [4, 3, 4, 3]
  src:
    - p212 "Figure 45 bottom view numbering 1-14"
    - bosch/BST-BMI330-DS000-03 p212 "Figure 45 bottom view numbering 1-14"
    - p206 "Figure 36 pin-out top view"
    - bosch/BST-BMI330-DS000-03 p206 "Figure 36 pin-out top view"

source: bosch/BST-BMI323-DS000-13

pitch:
  typ: 0.5 mm
  src:
    - p212 "Figure 45 bottom view, boxed 0.5 (10x)"
    - bosch/BST-BMI330-DS000-03 p212 "Figure 45 bottom view, boxed 0.5 (10x)"

geometry: { type: parametric, generator: lga }

dimensions:
  body_width:
    typ: 3 mm
    src:
      - p212 "Figure 44 top view, boxed 3"
      - bosch/BST-BMI330-DS000-03 p212 "Figure 44 top view, boxed 3"
  body_length:
    typ: 2.5 mm
    src:
      - p212 "Figure 44 top view, boxed 2.5"
      - bosch/BST-BMI330-DS000-03 p212 "Figure 44 top view, boxed 2.5"
  body_height:
    min: 0.79 mm
    typ: 0.83 mm
    max: 0.87 mm
    src:
      - p212 "Figure 44 side view, 0.83 +-0.04"
      - bosch/BST-BMI330-DS000-03 p212 "Figure 44 side view, 0.83 +-0.04"
  lead_inset:
    min: 0.05 mm
    typ: 0.1 mm
    max: 0.15 mm
    src:
      - p212 "Figure 45 bottom view, 0.1 +-0.05 (both directions)"
      - bosch/BST-BMI330-DS000-03 p212 "Figure 45 bottom view, 0.1 +-0.05 (both directions)"
  lead_width:
    typ: 0.25 mm
    src:
      - p212 "Figure 45 bottom view, 0.25 (8x) / 0.25 (6x)"
      - bosch/BST-BMI330-DS000-03 p212 "Figure 45 bottom view, 0.25 (8x) / 0.25 (6x)"
  lead_length:
    typ: 0.475 mm
    src:
      - p212 "Figure 45 bottom view, 0.475 (8x) / 0.475 (6x)"
      - bosch/BST-BMI330-DS000-03 p212 "Figure 45 bottom view, 0.475 (8x) / 0.475 (6x)"
