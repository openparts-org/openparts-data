# ROHM VMT3 (SOT-723 / SC-105AA) 3-lead flat-lead package, read from the
# letter-coded dimension table on page 5 of rohm/DTC114E-datasheet-en
# (rendered image; "Dimension in mm/inches", MIN/MAX columns; the mm
# values are recorded, ranges only). Pages 5 of the DTA114E, DTC143Z,
# DTA143Z, DTC114Y and DTC124E datasheets print the same table.
#
# sot mapping (as standards/SOT523-1.60x0.80-P1.00-DIODES): body_width
# = D (along the two-lead row), body_length = E, overall_length = HE,
# overall_height = A, standoff = A1, lead_width = b, lead_thickness = c.
# Pitch = pin 1 to pin 2 = 2 x e ("e 0.40", basic; e is lead 1 to the
# centre line in the top view). Top view: leads 1, 2 on the bottom
# edge, 3 on the top edge. Lead 3 is wider ("b1 0.27/0.37"); the
# generator takes one width, so b (leads 1, 2) is recorded. L, Lp, x and
# the "Pattern of terminal position areas" (b2, b3, e1, l1; not a
# soldering pattern) are not recorded.
schema_version: "0.2"
kind: package
id: manufacturers/rohm/VMT3
family: sot
lead_count: 3

lead_layout:
  value: [2, 1]
  src:   'p5 "Dimensions SOT-723 (VMT3) top view: leads 1, 2 bottom edge, lead 3 top edge (page 1 outline)"'

source: rohm/DTC114E-datasheet-en

pitch: { typ: 0.8 mm, src: 'p5 "VMT3 table, e 0.40 (lead 1 to centre line); pin 1 to 2 = 2 x e"' }
geometry: { type: parametric, generator: sot }

dimensions:
  body_width:     { min: 1.1 mm, max: 1.3 mm, src: 'p5 "VMT3 table, D 1.10/1.30"' }
  body_length:    { min: 0.7 mm, max: 0.9 mm, src: 'p5 "VMT3 table, E 0.70/0.90"' }
  lead_thickness: { min: 0.08 mm, max: 0.18 mm, src: 'p5 "VMT3 table, c 0.08/0.18"' }
  lead_width:     { min: 0.17 mm, max: 0.27 mm, src: 'p5 "VMT3 table, b 0.17/0.27 (leads 1, 2)"' }
  overall_length: { min: 1.1 mm, max: 1.3 mm, src: 'p5 "VMT3 table, HE 1.10/1.30"' }
  overall_height: { min: 0.45 mm, max: 0.55 mm, src: 'p5 "VMT3 table, A 0.45/0.55"' }
  standoff:       { min: 0 mm, max: 0.1 mm, src: 'p5 "VMT3 table, A1 0.00/0.10"' }
