# ROHM EMT3F (SOT-416FL / SC-89) 3-lead flat-lead package, read from the
# letter-coded dimension table on page 6 of rohm/DTC114E-datasheet-en
# (rendered image; mm MIN/MAX recorded, ranges only). Page 6 of the
# DTA114E, DTC143Z, DTA143Z, DTC114Y and DTC124E datasheets prints the
# same table.
#
# sot mapping (as standards/SOT523-1.60x0.80-P1.00-DIODES): body_width
# = D, body_length = E, overall_length = HE, overall_height = A,
# body_height = A2, standoff = A1, lead_width = b, lead_thickness = c.
# Pitch = 2 x e ("e 0.50", basic; lead 1 to the centre line). Top view:
# leads 1, 2 bottom edge, 3 top edge. L, Lp, x and the "Pattern of
# terminal position areas" (b2, e1, l1; not a soldering pattern) are not
# recorded.
schema_version: "0.2"
kind: package
id: manufacturers/rohm/EMT3F
family: sot
lead_count: 3

lead_layout:
  value: [2, 1]
  src:   'p6 "Dimensions SOT-416FL (EMT3F) top view: leads 1, 2 bottom edge, lead 3 top edge (page 1 outline)"'

source: rohm/DTC114E-datasheet-en

pitch: { typ: 1 mm, src: 'p6 "EMT3F table, e 0.50 (lead 1 to centre line); pin 1 to 2 = 2 x e"' }
geometry: { type: parametric, generator: sot }

dimensions:
  body_width:     { min: 1.5 mm, max: 1.7 mm, src: 'p6 "EMT3F table, D 1.50/1.70"' }
  body_length:    { min: 0.76 mm, max: 0.96 mm, src: 'p6 "EMT3F table, E 0.76/0.96"' }
  body_height:    { min: 0.6 mm, max: 0.8 mm, src: 'p6 "EMT3F table, A2 0.60/0.80"' }
  lead_thickness: { min: 0.08 mm, max: 0.18 mm, src: 'p6 "EMT3F table, c 0.08/0.18"' }
  overall_length: { min: 1.5 mm, max: 1.7 mm, src: 'p6 "EMT3F table, HE 1.50/1.70"' }
  overall_height: { min: 0.65 mm, max: 0.85 mm, src: 'p6 "EMT3F table, A 0.65/0.85"' }
  standoff:       { min: 0 mm, max: 0.1 mm, src: 'p6 "EMT3F table, A1 0.00/0.10"' }
  lead_width:     { min: 0.21 mm, max: 0.36 mm, src: 'p6 "EMT3F table, b 0.21/0.36"' }
