# ROHM UMT3F (SOT-323FL / SC-85) 3-lead flat-lead package, read from the
# letter-coded dimension table on page 8 of rohm/DTC114E-datasheet-en
# (rendered image; mm MIN/MAX recorded, ranges only). Page 8 of the
# DTA114E, DTC143Z, DTA143Z, DTC114Y and DTC124E datasheets prints the
# same table. The RU1C001UN datasheet prints a UMT3F table with a
# different A ("0.80/1.10", no A2): manufacturers/rohm/UMT3F-RU1C001UN.
#
# sot mapping (as standards/SOT523-1.60x0.80-P1.00-DIODES): body_width
# = D, body_length = E, overall_length = HE, overall_height = A,
# body_height = A2, standoff = A1, lead_width = b, lead_thickness = c.
# Pitch = 2 x e ("e 0.65", basic; lead 1 to the centre line). Top view:
# leads 1, 2 bottom edge, 3 top edge. L, Lp, x and the "Pattern of
# terminal position areas" (b2, e1, l1; not a soldering pattern) are not
# recorded.
schema_version: "0.2"
kind: package
id: manufacturers/rohm/UMT3F
family: sot
lead_count: 3

lead_layout:
  value: [2, 1]
  src:   'p8 "Dimensions SOT-323FL (UMT3F) top view: leads 1, 2 bottom edge, lead 3 top edge (page 1 outline)"'

source: rohm/DTC114E-datasheet-en

pitch: { typ: 1.3 mm, src: 'p8 "UMT3F table, e 0.65 (lead 1 to centre line); pin 1 to 2 = 2 x e"' }
geometry: { type: parametric, generator: sot }

dimensions:
  body_width:     { min: 1.9 mm, max: 2.1 mm, src: 'p8 "UMT3F table, D 1.90/2.10"' }
  body_length:    { min: 1.15 mm, max: 1.35 mm, src: 'p8 "UMT3F table, E 1.15/1.35"' }
  body_height:    { min: 0.8 mm, max: 1 mm, src: 'p8 "UMT3F table, A2 0.80/1.00"' }
  lead_thickness: { min: 0.08 mm, max: 0.18 mm, src: 'p8 "UMT3F table, c 0.08/0.18"' }
  overall_length: { min: 2 mm, max: 2.2 mm, src: 'p8 "UMT3F table, HE 2.00/2.20"' }
  overall_height: { min: 0.85 mm, max: 1.05 mm, src: 'p8 "UMT3F table, A 0.85/1.05"' }
  standoff:       { min: 0 mm, max: 0.1 mm, src: 'p8 "UMT3F table, A1 0.00/0.10"' }
  lead_width:     { min: 0.27 mm, max: 0.42 mm, src: 'p8 "UMT3F table, b 0.27/0.42"' }
