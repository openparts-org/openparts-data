# Renesas PLQP0048KB-B (JEITA P-LFQFP48-7x7-0.50), 48-pin LQFP, 7x7 mm
# body, 0.5 mm pitch. All values copied from the dimension table of the
# RA4M1 datasheet's Figure 1.6 "48-pin LQFP" (page 124); in Renesas notation D/E are the
# body (mold) size and HD/HE the lead-tip span. Square package, so the
# D->X / E->Y assignment does not change any value. Where the table has
# no nominal only min/max are recorded; A2 is printed as a nominal only.
#
# Not merged into standards/LQFP48-7x7-P0.5: that file's numbers (ST
# DS5319: D1/E1 6.8-7.2, A2 1.35-1.45, b 0.17-0.27 nom 0.22) differ from
# this outline (D/E 6.9-7.1, A2 1.4 nom only, bp 0.17-0.27 nom 0.20).
