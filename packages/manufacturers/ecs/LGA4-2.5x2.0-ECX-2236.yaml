# ECS ECX-2236 4-pad ceramic crystal package, 2.5 x 2.0 mm, from p1 Figure 1
# and Figure 2 (suggested land) of ecs/ECX-2236 (vector, 400 dpi render).
# Frame (as manufacturers/abracon/LGA4-3.2x2.5-P1.5-ABM8): lga, two terminals
# on each short side, body_width = the long side (X). TOP VIEW numbering:
# 4 top-left, 3 top-right, 1 bottom-left, 2 bottom-right -> pad_order
# [4, 1, 2, 3] (generator positions 1 TL, 2 BL, 3 BR, 4 TR). Pads are
# numbered by the TOP VIEW (1 lower-left, 2 lower-right, 3 upper-right,
# 4 upper-left). lead_length = terminal size along X, lead_width = along Y.
# Terminals (view with #1 top-left): 0.8 along X (flush with the body end),
# 0.9 X gap; 0.65 along Y, 0.7 Y gap: 0.8+0.9+0.8 = 2.5, 0.65+0.7+0.65 = 2.0.
# pitch = 0.65 + 0.7 = 1.35 (nominal sum). Height from the side view
# "0.5+-0.1" (the intro text says 0.55).
# pads (Figure 2): pad 1.2 (X) x 1.0 (Y); 1.7 and 1.3 are dimensioned between
# pad CENTRES (extension lines on the pad centre lines, checked on the
# render). Centres x = +-0.85, y = +-0.65.
schema_version: "0.2"
kind: package
id: manufacturers/ecs/LGA4-2.5x2.0-ECX-2236
family: lga
lead_count: 4

lead_layout:
  value: [2, 0, 2, 0]
  src:   'p1 "Figure 1, bottom view: two terminals on each 2.0 mm side"'

source: ecs/ECX-2236

pitch: { typ: 1.35 mm, src: 'p1 "Figure 1, 0.65 terminal + 0.7 gap (see header)"' }

pad_order:
  value: ["4", "1", "2", "3"]
  src:   p1 "Figure 1, top view numbering; Pad Connections"

geometry: { type: parametric, generator: lga }

dimensions:
  body_width:  { min: 2.4 mm, typ: 2.5 mm, max: 2.6 mm, src: 'p1 "Figure 1, 2.5+-0.1"' }
  body_length: { min: 1.9 mm, typ: 2 mm, max: 2.1 mm, src: 'p1 "Figure 1, 2.0+-0.1"' }
  body_height: { min: 0.4 mm, typ: 0.5 mm, max: 0.6 mm, src: 'p1 "Figure 1, side view 0.5+-0.1"' }
  lead_length: { typ: 0.8 mm, src: 'p1 "Figure 1, terminal 0.8"' }
  lead_width:  { typ: 0.65 mm, src: 'p1 "Figure 1, terminal 0.65"' }

pads:
  value:
    - { number: "1", x: -0.85, y: -0.65, width: 1.2, length: 1 }
    - { number: "2", x: 0.85, y: -0.65, width: 1.2, length: 1 }
    - { number: "3", x: 0.85, y: 0.65, width: 1.2, length: 1 }
    - { number: "4", x: -0.85, y: 0.65, width: 1.2, length: 1 }
  src: p1 "Figure 2 suggested land, 1.2 / 1.7, 1.0 / 1.3 (see header)"
