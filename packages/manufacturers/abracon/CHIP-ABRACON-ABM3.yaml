# Abracon ABM3 2-terminal ceramic crystal package, 5.0 x 3.2 mm, from the
# p3 "Mechanical Dimensions" of abracon/ABM3-DS (raster drawing, inches
# with mm in parentheses; mm values recorded, inch text in the locators).
# Frame: chip, body_length = the 5.0 side (X), terminals at both ends.
# Terminals (bottom view): 0.05 (1.3) along X, 0.079 (2.0) along Y, no
# tolerance printed; 0.1 (2.4) between them.
# The same page shows two "Alternative bottom packaging" outlines with
# other terminal shapes (1.30 x 2.00 / 2.0-high terminals): the supplied
# part may use any of them; the land pattern below is the one printed for
# all. Pin numbers are from the bottom view (Pin 1 left there); no top
# view is printed, so the top-view side of pin 1 is not stated -- the
# crystal is symmetric, the generator puts pin 1 at -X.
# pads: "Recommended land pattern": 0.09 (2.2) between pads, 0.23 (6.0)
# outer span, 0.10 (2.4) pad height. Pad width (6.0 - 2.2)/2 = 1.9;
# centres x = +-(2.2/2 + 1.9/2) = +-2.05.
schema_version: "0.2"
kind: package
id: manufacturers/abracon/CHIP-ABRACON-ABM3
family: chip
lead_count: 2
source: abracon/ABM3-DS

pitch: { unit: mm }
geometry: { type: parametric, generator: chip }

dimensions:
  body_width:
    min: 3 mm
    typ: 3.2 mm
    max: 3.4 mm
    src: p3 "Mechanical Dimensions, top view 0.13+-.008 (3.2+-0.2)"
  body_length:
    min: 4.8 mm
    typ: 5 mm
    max: 5.2 mm
    src: p3 "Mechanical Dimensions, top view 0.197+-.008 (5.0+-0.2)"
  body_height: { max: 1.3 mm, src: 'p3 "Mechanical Dimensions, side view 0.051max (1.30max)"' }
  lead_length: { typ: 1.3 mm, src: 'p3 "Mechanical Dimensions, bottom view terminal 0.05 (1.3)"' }
  lead_width:  { typ: 2 mm, src: 'p3 "Mechanical Dimensions, bottom view terminal 0.079 (2.0)"' }

pads:
  value:
    - { number: "1", x: -2.05, y: 0, width: 1.9, length: 2.4 }
    - { number: "2", x: 2.05, y: 0, width: 1.9, length: 2.4 }
  src: p3 "Recommended land pattern, 0.09 (2.2), 0.23 (6.0), 0.10 (2.4) (see header)"
