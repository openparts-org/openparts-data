# Sensirion SGP30 6-pin DFN, 2.45 x 2.45 x 0.9 mm, 0.8 mm pitch, with
# die pad. Read from Figure 14 "Package outlines drawing of the SGP30
# with nominal values" and Figure 15 "Recommended landing pattern"
# (Datasheet SGP30 v1.0, page 14), rendered. Nominal values only (no
# tolerances printed). Differs from the SGP4x package (2.44 +-0.1 body,
# 1.64 die pad, 2.3 land centres), so not reused.
#
# Mapping: top view "2.45" x "2.45" -> body_width / body_length; side
# view "0.9" -> body_height; bottom view terminal "0.4" (along the
# column) -> lead_width, "0.35" -> lead_length; die pad "1.25" x "1.7"
# -> exposed_pad. Pin order (Table 4, transparent top view, page 5):
# 1-3 down the left, 4-6 up the right.
# pads (Figure 15, PCB landing pads): 0.55 x 0.4 at pitch 0.8; "3.05"
# over the outer pad edges -> x = +-(3.05 - 0.55)/2 = +-1.25; die land
# "1.25" x "1.7".
# Left out: the "0.3x45" die-pad chamfer, the 0.2 recess, the 1.1 sensor
# opening (reference values), stencil apertures.
schema_version: "0.2"
kind: package
id: manufacturers/sensirion/DFN6-2.45x2.45-P0.8-SGP30
family: dfn
lead_count: 6
source: sensirion/Sensirion_Gas_Sensors_Datasheet_SGP30@v1.0

pitch: { typ: 0.8 mm, src: 'p14 "Figure 14 bottom view, "0.8""' }
geometry: { type: parametric, generator: dfn }

dimensions:
  body_width:  { typ: 2.45 mm, src: 'p14 "Figure 14 top view, "2.45" (horizontal)"' }
  body_length: { typ: 2.45 mm, src: 'p14 "Figure 14 top view, "2.45" (vertical)"' }
  body_height: { typ: 0.9 mm, src: 'p14 "Figure 14 side view, "0.9""' }
  exposed_pad:
    src:    p14 "Figure 14 bottom view, die pad "1.25" x "1.7""
    width:  { typ: 1.25 mm }
    length: { typ: 1.7 mm }
  lead_width:  { typ: 0.4 mm, src: 'p14 "Figure 14 bottom view, terminal "0.4""' }
  lead_length: { typ: 0.35 mm, src: 'p14 "Figure 14 bottom view, terminal "0.35""' }

pads:
  value:
    - { number: "1", x: -1.25, y: 0.8, width: 0.55, length: 0.4 }
    - { number: "2", x: -1.25, y: 0, width: 0.55, length: 0.4 }
    - { number: "3", x: -1.25, y: -0.8, width: 0.55, length: 0.4 }
    - { number: "4", x: 1.25, y: -0.8, width: 0.55, length: 0.4 }
    - { number: "5", x: 1.25, y: 0, width: 0.55, length: 0.4 }
    - { number: "6", x: 1.25, y: 0.8, width: 0.55, length: 0.4 }
    - { number: EP, x: 0, y: 0, width: 1.25, length: 1.7 }
  src: 'p14 "Figure 15 landing pattern: 0.55 x 0.4, pitch 0.8, 3.05 outer -> x = +-1.25; die land 1.25 x 1.7"'
