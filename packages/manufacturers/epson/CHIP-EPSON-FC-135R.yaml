# Epson FC-135R 2-pad 32.768 kHz crystal, 3.2 x 1.5 mm, from p4 "[7] Outline
# Drawing and Recommended Footprint" of epson/FC-135R_E_Ver2.0 (vector, 200
# dpi render). Not standards/CHIP-FC135: that package carries no terminal or
# land data and cites the FC-135 document.
# Bottom view: terminal 0.65 along the length, 1.3 across, 1.7 between
# terminals, 0.1 setback: 0.1+0.65+1.7+0.65+0.1 = 3.2.
# pads: 1.0 (X) x 1.8 (Y); 2.5 is dimensioned between pad CENTRES (extension
# lines on the pad centre lines, checked on the render): x = +-1.25. The
# drawing's keep-out between the pads is not modelled.
schema_version: "0.2"
kind: package
id: manufacturers/epson/CHIP-EPSON-FC-135R
family: chip
lead_count: 2
source: epson/FC-135R_E_Ver2.0

pitch: { unit: mm }
geometry: { type: parametric, generator: chip }

dimensions:
  body_width:  { min: 1.4 mm, typ: 1.5 mm, max: 1.6 mm, src: 'p4 "[7] Outline Drawing, 1.5+-0.1"' }
  body_length: { min: 3.1 mm, typ: 3.2 mm, max: 3.3 mm, src: 'p4 "[7] Outline Drawing, 3.2+-0.1"' }
  body_height: { max: 0.9 mm, src: 'p4 "[7] Outline Drawing, 0.9 Max."' }
  lead_length: { typ: 0.65 mm, src: 'p4 "[7] Outline Drawing, bottom view terminal 0.65"' }
  lead_width:  { typ: 1.3 mm, src: 'p4 "[7] Outline Drawing, bottom view terminal 1.3"' }

pads:
  value:
    - { number: "1", x: -1.25, y: 0, width: 1, length: 1.8 }
    - { number: "2", x: 1.25, y: 0, width: 1, length: 1.8 }
  src: p4 "[7] Recommended Footprint, 1.0, 1.8, 2.5 (see header)"
