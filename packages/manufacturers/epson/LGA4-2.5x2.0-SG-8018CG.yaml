# Epson SG-8018CG 4-pad ceramic oscillator package, 2.5 x 2.0 mm, from the
# p2 "External dimensions" and "Footprint (Recommended)" SG-8018CG boxes of
# epson/SG-8018CG-BRIEF (vector, 300 dpi render). Frame (as
# manufacturers/epson/LGA4-3.2x2.5-FA-238): lga, two terminals on each
# 2.0 mm side, body_width = 2.5 (X). Top view numbering: #4 top-left, #3
# top-right, #1 bottom-left, #2 bottom-right -> pad_order [4, 1, 2, 3].
# The bottom view's terminal dimensions (0.9 / 0.8 in X, 0.6 / 0.7 in Y)
# are not unambiguous terminal sizes; lead_length/lead_width left out.
# pitch = the footprint's printed row pitch 1.3 (between pad centre
# crosses), taken as the terminal pitch: reviewer check.
# pads: footprint pad 1.1 (X) x 0.9 (Y); 1.7 (X) and 1.3 (Y) are between
# pad CENTRES (extension lines on the "+" centre marks, checked on the
# render). Centres x = +-0.85, y = +-0.65.
schema_version: "0.2"
kind: package
id: manufacturers/epson/LGA4-2.5x2.0-SG-8018CG
family: lga
lead_count: 4

lead_layout:
  value: [2, 0, 2, 0]
  src:   p2 "External dimensions SG-8018CG, two terminals on each 2.0 mm side"

source: epson/SG-8018CG-BRIEF

pitch: { typ: 1.3 mm, src: 'p2 "Footprint (Recommended) SG-8018CG, 1.3 (see header)"' }

pad_order:
  value: ["4", "1", "2", "3"]
  src:   'p2 "External dimensions SG-8018CG, top view #1-#4"'

geometry: { type: parametric, generator: lga }

dimensions:
  body_width:
    min: 2.35 mm
    typ: 2.5 mm
    max: 2.65 mm
    src: p2 "External dimensions SG-8018CG, 2.5±0.15"
  body_length:
    min: 1.85 mm
    typ: 2 mm
    max: 2.15 mm
    src: p2 "External dimensions SG-8018CG, 2.0±0.15"
  body_height:
    min: 0.6 mm
    typ: 0.7 mm
    max: 0.8 mm
    src: p2 "External dimensions SG-8018CG, 0.7±0.1"

pads:
  value:
    - { number: "1", x: -0.85, y: -0.65, width: 1.1, length: 0.9 }
    - { number: "2", x: 0.85, y: -0.65, width: 1.1, length: 0.9 }
    - { number: "3", x: 0.85, y: 0.65, width: 1.1, length: 0.9 }
    - { number: "4", x: -0.85, y: 0.65, width: 1.1, length: 0.9 }
  src: p2 "Footprint (Recommended) SG-8018CG, 1.1, 0.9, 1.7, 1.3 (see header)"
