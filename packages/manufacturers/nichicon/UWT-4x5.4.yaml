# Nichicon UWT chip-type aluminium electrolytic, case φ4 x 5.4 L, from
# nichicon/e-uwt page 1: "Chip Type" drawings (rendered) and the
# dimension table column "4 × 5.4" (A 1.8, B 4.3, C 4.3, E 1.0, L 5.4,
# H 0.5 to 0.8). Frame (smd_electrolytic): top view, origin at the
# plate's centre, terminals along X with the + terminal (pad 1) at -X;
# the source draws the terminals along Y (+ at the top), turned 90° here.
# Mapping: B (plate side along the terminals, B±0.2) -> body_width; C
# (C±0.2) -> body_length; øD±0.5 -> can_diameter; L (L +0.1/-0.2) ->
# overall_height; A (terminal, A±0.2) -> lead_length; H (terminal width,
# printed as a range) -> lead_width; overall_width = A + E + A = 4.6
# (arithmetic of the printed stack "A±0.2 E A±0.2", tip to tip; no
# tolerance printed for E, so typ only).
# pads: nichicon/guide_all_E page 14 "Recommended Land Size", Chip type
# standard type, size "φ4": X 1.6 (across), Y 2.6 (along the terminal
# axis), a 1.0 (between the lands); turned 90°: width = Y, length = X,
# centres x = ±(a/2 + Y/2) = ±1.8, + land (pad 1) at -X.
schema_version: "0.2"
kind: package
id: manufacturers/nichicon/UWT-4x5.4
family: smd_electrolytic
lead_count: { value: 2, src: 'p1 "Chip Type drawing, terminals Positive / Negative"' }
source: nichicon/e-uwt

pitch: { unit: mm }
geometry: { type: parametric, generator: smd_electrolytic }

dimensions:
  body_width:
    min: 4.1 mm
    typ: 4.3 mm
    max: 4.5 mm
    src: p1 "Dimension table, 4x5.4 column, B (B±0.2)"
  body_length:
    min: 4.1 mm
    typ: 4.3 mm
    max: 4.5 mm
    src: p1 "Dimension table, 4x5.4 column, C (C±0.2)"
  can_diameter:
    min: 3.5 mm
    typ: 4 mm
    max: 4.5 mm
    src: p1 "Dimension table header, 4x5.4; drawing øD±0.5"
  lead_length:
    min: 1.6 mm
    typ: 1.8 mm
    max: 2 mm
    src: p1 "Dimension table, 4x5.4 column, A (A±0.2)"
  overall_width:
    typ: 4.6 mm
    src: p1 "Dimension table, 4x5.4 column, A + E + A (1.8 + 1.0 + 1.8)"
  overall_height:
    min: 5.2 mm
    typ: 5.4 mm
    max: 5.5 mm
    src: p1 "Dimension table, 4x5.4 column, L; drawing L +0.1/-0.2"
  lead_width: { min: 0.5 mm, max: 0.8 mm, src: 'p1 "Dimension table, 4x5.4 column, H 0.5 to 0.8"' }

pads:
  value:
    - { number: "1", x: -1.8, y: 0, width: 2.6, length: 1.6 }
    - { number: "2", x: 1.8, y: 0, width: 2.6, length: 1.6 }
  src: nichicon/guide_all_E p14 "Recommended Land Size, Chip type standard type, φ4 row, X Y a"
