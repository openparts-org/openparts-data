# JST SH SMT header, top entry, 9 circuits, 1 mm pitch
# (BM09B-SRSS-TB), from jst/eSH: PC board layout and Assembly layout, Top entry type and the Header drawing and
# Model No. table on page 3. Values are the sheet's printed callouts;
# positions are plain arithmetic between them:
# Top entry layout (viewed from the mounting surface, No. 1 circuit at the
# left): the mechanical pads (1.2 x 1.8) above the row, their outer edge
# the datum; signal lands 0.6 wide from 2.65 to 4.2 below it (centre
# 3.425, length 1.55); mechanical pad centre 0.9; the connector outline
# (0.2) below the datum, 2.9 deep (p3 side view) -> centre 1.65. Turned 90
# deg clockwise (pin 1 to the top): mechanical pads at x = 3.425 - 0.9 =
# 2.525, housing centre at x = 3.425 - 1.65 = 1.775.
# Mechanical pad centre along the row: the end contact's centre + 0.7
# (to the pad's inner edge) + 1.2 / 2 = A / 2 + 1.3.
# The sheet calls its layout dimensions reference values. The contact and
# retention-tab shapes in 3D are generator choices (not dimensioned).
schema_version: "0.2"
kind: package
id: manufacturers/jst/SH-Header-Top-SMD-1x09-P1.00
family: shrouded_header
lead_count: 9

lead_layout: { value: [1, 9], src: 'p3 "Header Model No. table, 9 circuits: A = 8, B = 11"' }

source: jst/eSH

pitch: { typ: 1 mm, src: 'p1 "PC board layout and Assembly layout, Top entry type, land pitch"' }
geometry: { type: parametric, generator: shrouded_header }

dimensions:
  body_width:  { typ: 2.9 mm, src: 'p3 "Header, Top entry type, side view depth"' }
  body_length: { typ: 11 mm, src: 'p3 "Header Model No. table, 9 circuits: A = 8, B = 11"' }
  body_height: { typ: 4.25 mm, src: 'p3 "Header, Top entry type, side view height"' }
  body_offset:
    typ: 1.775 mm
    src: p1 "PC board layout and Assembly layout, Top entry type, connector outline (see comment)"
  standoff:
    typ: 0.05 mm
    src: p3 "Header, Top entry type, side view, housing underside to the contact tails"

smt:
  pad: [1.55, 0.6]
  mech_pad: [1.8, 1.2]
  mech_pad_at: [2.525, 5.3]
  mech_number: MP
  src: p1 "PC board layout and Assembly layout, Top entry type, land and reinforcement pad sizes and positions (see comment)"
