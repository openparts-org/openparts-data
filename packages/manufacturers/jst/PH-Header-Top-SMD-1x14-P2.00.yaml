# JST PH SMT header, top entry, 14 circuits, 2 mm pitch (B14B-PH-SM4-TB),
# from jst/ePH page 2 (PC board layout and Assembly layout (SMT type), Top
# entry type) and page 4 (Header (SMT type), Top entry type drawing and
# Model No. table: A 26, B 31.95). Positions are plain arithmetic
# between the printed callouts:
# Layout (viewed from the mounting surface, No. 1 circuit at the right):
# the connector outline's lower edge is the datum; signal lands "1min."
# wide from "2max." to "7.5min." above it (the drawn land: centre 4.75,
# length 5.5, width 1 -- the min/max limits taken as the land); the
# reinforcement pads "1.6±0.1" x "3±0.1", "(1)" above the datum (centre
# 2.5), inner edge "1.6±0.1" beyond the end contact's centre (centre
# along the row A / 2 + 1.6 + 0.8 = A / 2 + 2.4). Housing 5 deep from the
# datum (page 4 side view "5") -> centre 2.5. Turned 90 deg
# counter-clockwise (pin 1 to the top) the datum side is +X:
# reinforcement pads and housing centre at x = 4.75 - 2.5 = 2.25.
# The sheet calls its layout dimensions reference only. Base housing PA
# (heat resistance) natural (ivory), posts and reinforcement copper
# alloy, tin-plated (page 4 "Material and Surface finish").
schema_version: "0.2"
kind: package
id: manufacturers/jst/PH-Header-Top-SMD-1x14-P2.00
family: shrouded_header
lead_count: 14

lead_layout:
  value: [1, 14]
  src:   'p4 "Header (SMT type), Top entry Model No. table, 14 circuits: A = 26, B = 31.95"'

source: jst/ePH

pitch:
  min: 1.95 mm
  typ: 2 mm
  max: 2.05 mm
  src: p2 "PC board layout (SMT type), Top entry type, land pitch "2±0.05" (note 2)"

geometry: { type: parametric, generator: shrouded_header }

dimensions:
  body_width:  { typ: 5 mm, src: 'p4 "Header (SMT type), Top entry type, side view depth"' }
  body_length:
    typ: 31.95 mm
    src: 'p4 "Header (SMT type), Top entry Model No. table, B14B-PH-SM4-TB: B = 31.95"'
  body_height: { typ: 6.6 mm, src: 'p4 "Header (SMT type), Top entry type, side view height"' }
  body_offset:
    typ: 2.25 mm
    src: p2 "PC board layout (SMT type), Top entry type, connector outline and lands (see comment)"

smt:
  pad: [5.5, 1]
  mech_pad: [3, 1.6]
  mech_pad_at: [2.25, 15.4]
  mech_number: MP
  src: p2 "PC board layout (SMT type), Top entry type, land and reinforcement pad sizes and positions (see comment)"
