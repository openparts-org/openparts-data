# JST PH SMT header, side entry, 2 circuits, 2 mm pitch (S2B-PH-SM4-TB),
# from jst/ePH page 2 (PC board layout and Assembly layout (SMT type),
# Side entry type) and page 4 (Header (SMT type), Side entry type drawing
# and Model No. table: A 2.0, B 7.9). Values are the sheet's printed
# callouts; positions are plain arithmetic between them:
# Side entry layout (viewed from the mounting surface, No. 1 circuit at
# the left): the reinforcement pads' lower edge is the datum; signal
# lands "1min." wide from "5.5max." to "9min." above it (the drawn land:
# centre 7.25, length 3.5 -- the min/max limits taken as the land); the
# reinforcement pads "1.5±0.1" wide and "3.4±0.1" high from the datum
# (centre 1.7), inner edge "1.6±0.1" beyond the end contact's centre
# (centre along the row A / 2 + 1.6 + 0.75 = A / 2 + 2.35); the
# connector outline "(0.2)" above the datum, 6 deep (page 4 side view
# "6") -> centre 3.2. Turned 90 deg clockwise (as the SH side-entry
# package): reinforcement pads at x = -(7.25 - 1.7) = -5.55, housing
# centre at x = -(7.25 - 3.2) = -4.05 (the opening faces -x).
# The sheet calls its layout dimensions reference only. Base housing PA
# (heat resistance) natural (ivory), posts and reinforcement copper
# alloy, tin-plated (page 4 "Material and Surface finish").
schema_version: "0.2"
kind: package
id: manufacturers/jst/PH-Header-Side-SMD-1x02-P2.00
family: right_angle_header
lead_count: 2

lead_layout:
  value: [1, 2]
  src:   'p4 "Header (SMT type), Side entry Model No. table, 2 circuits: A = 2.0, B = 7.9"'

source: jst/ePH

pitch:
  min: 1.95 mm
  typ: 2 mm
  max: 2.05 mm
  src: p2 "PC board layout (SMT type), Side entry type, land pitch "2±0.05" (note 2)"

geometry: { type: parametric, generator: right_angle_header }

dimensions:
  body_width: { typ: 6 mm, src: 'p4 "Header (SMT type), Side entry type, side view depth "6""' }
  body_length:
    typ: 7.9 mm
    src: 'p4 "Header (SMT type), Side entry Model No. table, S2B-PH-SM4-TB: B = 7.9"'
  body_height:
    typ: 5.5 mm
    src: p4 "Header (SMT type), Side entry type, side view height "5.5""
  body_offset:
    typ: -4.05 mm
    src: p2 "PC board layout (SMT type), Side entry type, connector outline and lands (see comment)"

smt:
  pad: [3.5, 1]
  mech_pad: [3.4, 1.5]
  mech_pad_at: [-5.55, 3.35]
  mech_number: MP
  src: p2 "PC board layout (SMT type), Side entry type, land and reinforcement pad sizes and positions (see comment)"
