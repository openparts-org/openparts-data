# JST PH shrouded header, top entry, 10 circuits, 2.0 mm pitch, THT
# (B10B-PH-K-S), from jst/ePH page 3 ("Header (Through-hole type)", Top entry
# type <3 circuits or more> and the Model No. table: A 18, B 21.9) and page 1
# (PC board layout).
# Frame: the PC board layout (viewed from the connector mounting surface)
# has No. 1 circuit at the right end of the row and the dashed
# "Connector outline" edge "(1.7)" below the row; turned 90 degrees
# counter-clockwise (pin 1 to the top, pins numbered down the row) that
# edge is the +X face. The housing is 4.5 deep: its centre lies
# 4.5 / 2 - 1.7 = 0.55 towards -X (body_offset -0.55, nominal only).
# "(1.7)" and the tail "(3.4)" are parenthesised (reference) values; the
# layout page's note 3 calls its dimensions reference only.
# No land is given, only the hole: the pad is the hole plus the
# generator's annular-ring default. The post size is not dimensioned
# (lead_width left out); the housing's walls, windows and the "Mark of
# No. 1 circuit" are drawn but not dimensioned. Housing PA natural
# (white), posts tin-plated (page 3 "Material and Surface finish").
schema_version: "0.2"
kind: package
id: manufacturers/jst/PH-Header-Top-1x10-P2.00
family: shrouded_header
lead_count: 10

lead_layout:
  value: [1, 10]
  src:   p1 "PC board layout (Through-hole type), Top entry type, No. 1 circuit; p3 Model No. table"

source: jst/ePH

pitch:
  min: 1.95 mm
  typ: 2 mm
  max: 2.05 mm
  src: p1 "PC board layout (Through-hole type), Top entry type, hole pitch (note 2); p3 Header drawing"

geometry: { type: parametric, generator: shrouded_header }

dimensions:
  body_width:
    typ: 4.5 mm
    src: 'p3 ""Header (Through-hole type)", Top entry type <3 circuits or more>, side view: housing depth "4.5""'
  body_length:
    typ: 21.9 mm
    src: 'p3 ""Header (Through-hole type)" Model No. table, B10B-PH-K-S: Dimensions B = 21.9 (front view: housing length "B")"'
  body_height:
    typ: 6 mm
    src: 'p3 ""Header (Through-hole type)", Top entry type <3 circuits or more>, side view: housing height "6""'
  body_offset:
    typ: -0.55 mm
    src: p1 "PC board layout (Through-hole type), Top entry, connector outline; p3 side view, housing depth"
  hole_diameter:
    min: 0.7 mm
    typ: 0.7 mm
    max: 0.8 mm
    src: 'p1 ""PC board layout and Assembly layout (Through-hole type)", Top entry type: hole "φ0.7 +0.1/0" (note 3: reference only)"'
  tail_length:
    typ: 3.4 mm
    src: p3 "Header (Through-hole type), Top entry type <3 circuits or more>, side view, tail length (reference)"
