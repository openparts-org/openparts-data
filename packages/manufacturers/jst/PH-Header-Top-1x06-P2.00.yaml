# JST PH shrouded header, top entry, 6 circuits, 2.0 mm pitch, THT
# (B6B-PH-K-S), from jst/ePH page 3 ("Header (Through-hole type)", Top entry
# type <3 circuits or more> and the Model No. table: A 10, B 13.9) and page 1
# (PC board layout).
# Frame: the PC board layout (viewed from the connector mounting surface)
# has No. 1 circuit at the right end of the row and the dashed
# "Connector outline" edge "(1.7)" below the row; turned 90 degrees
# counter-clockwise (pin 1 to the top, pins numbered down the row) that
# edge is the +X face. The housing is 4.5 deep: its centre lies
# 4.5 / 2 - 1.7 = 0.55 towards -X (body_offset -0.55, nominal only).
# "(1.7)" and the tail "(3.4)" are parenthesised (reference) values; the
# layout page's note 3 calls its dimensions reference only.
# No land is given, only the hole: the pad is the hole plus the
# generator's annular-ring default. The post size is not dimensioned
# (lead_width left out); the housing's walls, windows and the "Mark of
# No. 1 circuit" are drawn but not dimensioned. Housing PA natural
# (white), posts tin-plated (page 3 "Material and Surface finish").
schema_version: "0.1"
kind: package
id: manufacturers/jst/PH-Header-Top-1x06-P2.00

family: shrouded_header
lead_count: 6
lead_layout: [1, 6]

pitch:
  nominal: 2
  min: 1.95
  max: 2.05
  unit: mm

dimensions:
  body_width:
    nominal: 4.5
    unit: mm
  body_length:
    nominal: 13.9
    unit: mm
  body_height:
    nominal: 6
    unit: mm
  tail_length:
    nominal: 3.4
    unit: mm
  hole_diameter:
    nominal: 0.7
    min: 0.7
    max: 0.8
    unit: mm
  body_offset:
    nominal: -0.55
    unit: mm

geometry:
  type: parametric
  generator: shrouded_header

provenance:
  "/pitch":
    - source: jst/ePH
      page: 1
      locator: "\"PC board layout and Assembly layout (Through-hole type)\", Top entry type: hole pitch \"2 ±0.05\" (note 2: not accumulating); page 3 Header drawing \"2\""
  "/lead_layout":
    - source: jst/ePH
      page: 1
      locator: "\"PC board layout and Assembly layout (Through-hole type)\", Top entry type: one row of holes, \"No. 1 circuit\" at the right end (viewed from the mounting surface); page 3 Model No. table, No. of circuits 6"
  "/dimensions/body_width":
    - source: jst/ePH
      page: 3
      locator: "\"Header (Through-hole type)\", Top entry type <3 circuits or more>, side view: housing depth \"4.5\""
  "/dimensions/body_length":
    - source: jst/ePH
      page: 3
      locator: "\"Header (Through-hole type)\" Model No. table, B6B-PH-K-S: Dimensions B = 13.9 (front view: housing length \"B\")"
  "/dimensions/body_height":
    - source: jst/ePH
      page: 3
      locator: "\"Header (Through-hole type)\", Top entry type <3 circuits or more>, side view: housing height \"6\""
  "/dimensions/tail_length":
    - source: jst/ePH
      page: 3
      locator: "\"Header (Through-hole type)\", Top entry type <3 circuits or more>, side view: housing underside to tail end \"(3.4)\" (parenthesised: reference)"
  "/dimensions/hole_diameter":
    - source: jst/ePH
      page: 1
      locator: "\"PC board layout and Assembly layout (Through-hole type)\", Top entry type: hole \"φ0.7 +0.1/0\" (note 3: reference only)"
  "/dimensions/body_offset":
