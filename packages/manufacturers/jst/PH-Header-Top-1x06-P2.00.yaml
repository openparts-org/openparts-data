      page: 1
      locator: "\"PC board layout and Assembly layout (Through-hole type)\", Top entry type: \"Connector outline\" edge \"(1.7)\" from the hole row (below it, No. 1 circuit at the right; +X with pin 1 turned to the top); page 3 side view housing depth \"4.5\": centre 4.5/2 - 1.7 = 0.55 towards -X"
