# JST EH shrouded header, top entry, 9 circuits, 2.5 mm pitch, THT
# (B9B-EH), from jst/eEH page 3 ("Header", Top entry type <3 circuits or more> and
# the Model No. table: A 20, B 25) and page 2 (PC board layout).
# Frame: the PC board layout (p2, viewed from the connector mounting
# surface) has No. 1 circuit at the left end of the row, the connector
# outline "(1.6)" above the row and the "(Locking side)" below it; turned
# 90 degrees clockwise (pin 1 to the top, pins numbered down the row) the
# face 1.6 from the row is the +X face. The side view (p3) prints the same
# "(1.6)" from the post to the face opposite the lock, the housing being
# 3.8 deep: its centre lies 3.8 / 2 - 1.6 = 0.3 towards -X (body_offset
# -0.3, nominal only). The front view's "(2.5)" from the housing end to
# No. 1 circuit and B = A + 5 centre the row along Y.
# No land is given, only the hole: the pad is the hole plus the
# generator's annular-ring default. Walls and lock are not dimensioned
# (not recorded). Post brass, copper-undercoated, tin-plated; wafer PA 66,
# natural (white) (p3 "Material and Surface finish").
schema_version: "0.2"
kind: package
id: manufacturers/jst/EH-Header-Top-1x09-P2.50
family: shrouded_header
lead_count: 9

lead_layout:
  value: [1, 9]
  src:   p2 "PC board layout, Top entry type, No. 1 circuit; p3 Header Model No. table"

source: jst/eEH

pitch:
  min: 2.45 mm
  typ: 2.5 mm
  max: 2.55 mm
  src: p2 "PC board layout, hole pitch "2.5±0.05" (note 2, not accumulated)"

geometry: { type: parametric, generator: shrouded_header }

dimensions:
  body_width:
    typ: 3.8 mm
    src: 'p3 ""Header", Top entry type <3 circuits or more>, side view: housing depth "3.8""'
  body_length: { typ: 25 mm, src: 'p3 ""Header" Model No. table, B9B-EH: Dimensions B = 25"' }
  body_height:
    typ: 6 mm
    src: 'p3 ""Header", Top entry type <3 circuits or more>, front view: housing height "6""'
  body_offset:
    typ: -0.3 mm
    src: 'p3 "Header, Top entry side view: 3.8 deep, post (1.6) from face opposite lock (p2 layout): 3.8/2 - 1.6"'
  lead_width:
    typ: 0.64 mm
    src: 'p3 ""Header", Top entry type <3 circuits or more>: post "□0.64""'
  hole_diameter:
    min: 0.9 mm
    typ: 0.9 mm
    max: 1 mm
    src: 'p2 "PC board layout, hole "φ0.9 +0.1/0" (note 3: reference values)"'
  tail_length:
    typ: 3.2 mm
    src: 'p3 ""Header", Top entry type <3 circuits or more>, front view: tail "3.2""'
