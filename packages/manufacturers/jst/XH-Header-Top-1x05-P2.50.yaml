# JST XH shrouded header, top entry, 5 circuits, 2.5 mm pitch, THT
# (B5B-XH-A), from jst/eXH page 5 ("Header", Top entry type <3 circuits or more> and the
# Model No. table: A 10, B 14.9) and page 2 (PC board layout).
# Frame: the PC board layout (viewed from the connector mounting surface)
# has No. 1 circuit at the right end of the row and the boss of the
# B?B-XH-AM variant 2 mm above the row; turned 90 degrees
# counter-clockwise (pin 1 to the top, pins numbered down the row) the
# boss side is -X. The side view puts the pin row "(2.35)" from the
# housing face away from the boss (the +X face), the housing being 5.75
# deep: its centre lies 5.75 / 2 - 2.35 = 0.525 towards -X
# (body_offset -0.525, nominal only). "(2.35)" and the tail "(3.4)" are
# parenthesised (reference) dimensions in the drawing.
# No land is given, only the hole: the pad is the hole plus the
# generator's annular-ring default. The housing's walls, latch slots and
# feet are drawn but not dimensioned (not recorded); standoff is not
# stated. Housing natural (white) PA 66, posts tin-plated (page 5
# "Material and Surface finish").
schema_version: "0.2"
kind: package
id: manufacturers/jst/XH-Header-Top-1x05-P2.50
family: shrouded_header
lead_count: 5

lead_layout:
  value: [1, 5]
  src:   'p2 ""PC board layout and Assembly layout", Top entry type <2 circuits or more>: one row of holes, "No. 1 circuit" at the right end (viewed from the mounting surface); page 5 Model No. table, No. of circuits 5"'

source: jst/eXH

pitch:
  min: 2.45 mm
  typ: 2.5 mm
  max: 2.55 mm
  src: 'p2 ""PC board layout and Assembly layout", Top entry type <2 circuits or more>: hole pitch "2.5 ±0.05" (note 2: not accumulating); page 5 Header drawing "2.5""'

geometry: { type: parametric, generator: shrouded_header }

dimensions:
  body_width:
    typ: 5.75 mm
    src: 'p5 ""Header", Top entry type <3 circuits or more>, side view: housing depth "5.75""'
  body_length:
    typ: 14.9 mm
    src: 'p5 ""Header", Top entry type Model No. table, B5B-XH-A: Dimensions B = 14.9 (front view: housing length "B")"'
  body_height:
    typ: 7 mm
    src: 'p5 ""Header", Top entry type <3 circuits or more>, front view: housing height "7""'
  body_offset:
    typ: -0.525 mm
    src: 'p5 ""Header", Top entry type <3 circuits or more>, side view: pin row "(2.35)" (parenthesised: reference) from the housing face opposite the boss ("2" from the pin to the boss in the AM view; page 2 layout: boss "2 ±0.05" above the row, No. 1 circuit at the right); housing "5.75": centre 5.75/2 - 2.35 = 0.525 towards the boss side, which is -X with pin 1 turned to the top"'
  lead_width:
    typ: 0.64 mm
    src: 'p5 ""Header", Top entry type <3 circuits or more>, front view: post "□0.64""'
  hole_diameter:
    min: 0.9 mm
    typ: 0.9 mm
    max: 1 mm
    src: 'p2 ""PC board layout and Assembly layout", Top entry type <2 circuits or more>: "3 circuits or more: φ0.9 +0.1/0" (note 4: reference values)"'
  tail_length:
    typ: 3.4 mm
    src: 'p5 ""Header", Top entry type <3 circuits or more>, front view: housing underside to tail end "(3.4)" (parenthesised: reference)"'
