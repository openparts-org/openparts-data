# Diodes Incorporated SOT223 outline as printed in the AZ1117C datasheet
# DS36676 Rev. 5-2 (Sept 2022) page 13, "Package Outline Dimensions
# (1) Package Type: SOT223" -- a dimensioned drawing (min / max pairs,
# mm with inch in brackets), no table. Read from 220-400 dpi renders.
# Not the DS31009 (AP1117) Diodes SOT223 (body 3.45-3.55 there vs
# 3.30-3.70 here, lead width, heights differ): its own package.
#
# TAB NUMBER: the source does not print a number for the tab. Page 2
# "Pin Assignments" SOT223/ H Package (Top View) numbers the leads
# 3 INPUT / 2 OUTPUT / 1 ADJ/GND and labels the tab "VOUT"; OUTPUT is
# lead 2, so the tab is numbered "2" (two pads numbered 2, as KiCad's
# SOT-223-3_TabPin2 and the dataset's DS31009 package). This applies to
# the H package only: the H2 package labels the tab ADJ/GND (pin 2) --
# also "2", but it has a different pin map.
#
# Mapping (frame: leads left, tab right): 6.300-6.700 (along the lead
# row) -> body_length; 3.300-3.700 (body across the lead direction) ->
# body_width; 6.700-7.300 (lead toe to tab toe) -> overall_width;
# 2.900-3.100 (tab) -> tab_width; 0.600-0.810 (lead) -> lead_width;
# 2.300 TYP -> pitch nominal. The side view is drawn upside down
# (seating plane at the top): 1.500-1.700 spans the plastic body only
# -> body_height; 1.520-1.800 spans seating plane to body top ->
# overall_height; 0.010-0.150 between them -> standoff. End view:
# 0.200-0.350 across the lead tip -> lead_thickness; "0.850 MIN" along
# the flat foot -> lead_length (min only). Left out: 1.750 TYP (body
# edge to lead toe, not the foot), 4.500-4.700 (outer-lead span), the
# 0.250 offset in the end view, 0-10 deg.
schema_version: "0.2"
kind: package
id: manufacturers/diodes/SOT223-3.5x6.5-P2.3-TabPin2-DS36676
family: sot223
lead_count: 3
source: diodes/DS36676

pitch: { typ: 2.3 mm, src: 'p13 "SOT223 outline, top view "2.300(0.091) TYP" lead spacing"' }

tab:
  number: "2"
  src: 'p2 ""Pin Assignments" SOT223/ H Package (Top View): leads 3 INPUT, 2 OUTPUT, 1 ADJ/GND; tab labelled "VOUT" (no number) -- see header"'

geometry: { type: parametric, generator: sot223 }

dimensions:
  body_width:
    min: 3.3 mm
    max: 3.7 mm
    src: p13 "SOT223 outline, top view "3.300(0.130) / 3.700(0.146)" body"
  body_length:
    min: 6.3 mm
    max: 6.7 mm
    src: p13 "SOT223 outline, top view "6.300(0.248) / 6.700(0.264)" body"
  body_height:
    min: 1.5 mm
    max: 1.7 mm
    src: p13 "SOT223 outline, side view (drawn upside down) "1.500(0.059) / 1.700(0.067)" plastic body"
  tab_width:
    min: 2.9 mm
    max: 3.1 mm
    src: p13 "SOT223 outline, top view "2.900(0.114) / 3.100(0.122)" tab"
  overall_width:
    min: 6.7 mm
    max: 7.3 mm
    src: p13 "SOT223 outline, top view "6.700(0.264) / 7.300(0.287)" lead toe to tab toe"
  overall_height:
    min: 1.52 mm
    max: 1.8 mm
    src: p13 "SOT223 outline, side view "1.520(0.060) / 1.800(0.071)" seating plane to body top"
  standoff:
    min: 0.01 mm
    max: 0.15 mm
    src: p13 "SOT223 outline, side view "0.010(0.0004) / 0.150(0.006)""
  lead_width:
    min: 0.6 mm
    max: 0.81 mm
    src: p13 "SOT223 outline, top view "0.600(0.024) / 0.810(0.032)" lead"
  lead_length: { min: 0.85 mm, src: 'p13 "SOT223 outline, end view "0.850(0.033) MIN" flat foot"' }
  lead_thickness:
    min: 0.2 mm
    max: 0.35 mm
    src: p13 "SOT223 outline, end view "0.200(0.008) / 0.350(0.014)" across the lead tip"
