# Diodes PowerDI123 (flat leads out of the body underside -> sod_flat),
# from "Package Outline Dimensions" on page 5 of DS30497 Rev. 15-2
# (DFLS1100, November 2026), drawing rendered and read with the table
# text (Options A and B share one table). Columns Min / Max / Typ.
# Mapping from the arrows: E1 (2.60-3.00) body along the leads, D
# (1.63-1.93) body across, E (3.50-3.90) lead-tip span, b (0.85-1.25)
# lead width, L "(2x)" (0.40-0.50) the lead length out of the body,
# A3 the lead thickness, A the total height (no A2: body_height = A).
#
# NOT modelled (generator has no field for it): the cathode-side lead
# continues under the body as a larger pad, b2 1.025-1.125 wide, L1
# 1.25-1.40 long, L3 0.125-0.275 (bottom view). The generated footprint
# only has the two b x L terminals; Diodes' Suggested Pad Layout (p5:
# X 1.05, X1 2.40, X2 4.10, Y/Y1 1.50, G 0.65) has a much larger
# cathode land -- flag for review before using the footprint for power.
#
# The same table (every row) is printed in DS30519 Rev. 5-2 (DFLS240,
# p4), DS30492 Rev. 5-2 (DFLS130L, p4) and DS30446 Rev. 9-2 (DFLS140,
# p4): checked by diffing the pdftotext -layout outline sections (only
# "VIE W"/"VIEW" kerning differs).
schema_version: "0.2"
kind: package
id: manufacturers/diodes/PowerDI123-2.80x1.78-DS30497
family: sod_flat
lead_count: 2
source: diodes/DS30497

pitch: { unit: mm }

construction:
  value: molded
  src: 'p1 "Mechanical Data: "Case Material: Molded Plastic, “Green” Molding Compound.""'

geometry: { type: parametric, generator: sod_flat }

dimensions:
  body_width:
    min: 1.63 mm
    typ: 1.78 mm
    max: 1.93 mm
    src: p5 "PowerDI123 table, D "1.63 / 1.93 / 1.78", body across"
  body_length:
    min: 2.6 mm
    typ: 2.8 mm
    max: 3 mm
    src: p5 "PowerDI123 table, E1 "2.60 / 3.00 / 2.80" (Min/Max/Typ), body along the leads (top view)"
  body_height:
    min: 0.93 mm
    typ: 0.98 mm
    max: 1 mm
    src: p5 "PowerDI123 table, A "0.93 / 1.00 / 0.98" (total height; no A2 given)"
  lead_thickness:
    min: 0.15 mm
    typ: 0.2 mm
    max: 0.25 mm
    src: p5 "PowerDI123 table, A3 "0.15 / 0.25 / 0.20""
  overall_length:
    min: 3.5 mm
    typ: 3.7 mm
    max: 3.9 mm
    src: p5 "PowerDI123 table, E "3.50 / 3.90 / 3.70", lead-tip span (bottom view)"
  lead_width:
    min: 0.85 mm
    typ: 1 mm
    max: 1.25 mm
    src: p5 "PowerDI123 table, b "0.85 / 1.25 / 1.00""
  lead_length:
    min: 0.4 mm
    typ: 0.45 mm
    max: 0.5 mm
    src: p5 "PowerDI123 table, L "0.40 / 0.50 / 0.45" ("L (2x)", lead end to body edge)"
