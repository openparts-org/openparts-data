# Diodes SOD323, from "Package Outline Dimensions" on page 4 of DS30098
# Rev. 14-2 (BAT54WS, July 2022), drawing rendered and read with the
# table text. Columns are Min / Max / Typ ("Typ" recorded as nominal).
# Mapping read from the arrows: E (1.60-1.80) is the body along the
# leads, D (1.20-1.40) the body across, He the lead-tip span, A2 the
# body height, A1 the standoff (max only, typ 0.05), b lead width, L the
# foot, c lead thickness. No total height A is printed: overall_height
# is left out. Not modelled: foot angle a 0-8 deg.
#
# The same table (every row) is printed in DS30235 Rev. 13-2 (B0520WS,
# p4): checked by diffing the pdftotext -layout outline sections (only
# label placement differs).
