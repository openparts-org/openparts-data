# Diodes SOD323, from "Package Outline Dimensions" on page 4 of DS30098
# Rev. 14-2 (BAT54WS, July 2022), drawing rendered and read with the
# table text. Columns are Min / Max / Typ ("Typ" recorded as nominal).
# Mapping read from the arrows: E (1.60-1.80) is the body along the
# leads, D (1.20-1.40) the body across, He the lead-tip span, A2 the
# body height, A1 the standoff (max only, typ 0.05), b lead width, L the
# foot, c lead thickness. No total height A is printed: overall_height
# is left out. Not modelled: foot angle a 0-8 deg.
#
# The same table (every row) is printed in DS30235 Rev. 13-2 (B0520WS,
# p4): checked by diffing the pdftotext -layout outline sections (only
# label placement differs).
schema_version: "0.2"
kind: package
id: manufacturers/diodes/SOD323-1.70x1.30-DS30098
family: sod
lead_count: 2
source: diodes/DS30098

pitch: { unit: mm }

construction:
  value: molded
  src: 'p1 "Mechanical Data: "Package Material: Molded Plastic. UL Flammability Classification Rating 94V-0""'

geometry: { type: parametric, generator: sod }

dimensions:
  body_width:
    min: 1.2 mm
    typ: 1.3 mm
    max: 1.4 mm
    src: p4 "SOD323 table, D "1.20 / 1.40 / 1.30", body across"
  body_length:
    min: 1.6 mm
    typ: 1.7 mm
    max: 1.8 mm
    src: p4 "SOD323 table, E "1.60 / 1.80 / 1.70" (Min/Max/Typ), body along the leads"
  body_height:
    min: 1 mm
    typ: 1.05 mm
    max: 1.1 mm
    src: p4 "SOD323 table, A2 "1.00 / 1.10 / 1.05""
  lead_thickness:
    min: 0.1 mm
    typ: 0.11 mm
    max: 0.15 mm
    src: p4 "SOD323 table, c "0.10 / 0.15 / 0.11""
  overall_length:
    min: 2.3 mm
    typ: 2.5 mm
    max: 2.7 mm
    src: p4 "SOD323 table, He "2.30 / 2.70 / 2.50", lead-tip span"
  standoff: { typ: 0.05 mm, max: 0.1 mm, src: 'p4 "SOD323 table, A1 "-- / 0.10 / 0.05""' }
  lead_width:
    min: 0.25 mm
    typ: 0.3 mm
    max: 0.35 mm
    src: p4 "SOD323 table, b "0.25 / 0.35 / 0.30""
  lead_length:
    min: 0.2 mm
    typ: 0.3 mm
    max: 0.4 mm
    src: p4 "SOD323 table, L "0.20 / 0.40 / 0.30" (foot)"
