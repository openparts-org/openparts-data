# Diodes SMA (J-bend, do214 family), from "Package Outline Dimensions"
# on page 4 of DS13002 Rev. 21-2 (B120/B - B160/B, October 2026),
# drawing rendered and read with the table. Min / Max only (no Typ, so
# no nominal is recorded). Diodes letter codes, read from the arrows:
# B (4.00-4.60) body along the leads, A (2.29-2.92) body across, E
# (4.80-5.59) span over the leads, C (1.27-1.63) lead width, D
# (0.15-0.31) lead thickness, H (0.76-1.52) folded foot under the body,
# G (0.05-0.20) body underside to seating plane, J (1.96-2.40) total
# height from the seating plane (no separate body height: J is
# body_height, no overall_height added).
#
# The same SMA table (every row) is printed in DS16003 Rev. 24-2
# (S1A-S1M, p3) and DS19005 Rev. 19-2 (SMAJ, p5) -- compared row by row
# from pdftotext -layout. DS13004 Rev. 23-2 (B220A-B260A) prints a
# DIFFERENT SMA J (2.01-2.30): its SMA parts are not mapped here.
