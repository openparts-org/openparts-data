# Diodes SOD123, from "Package Outline Dimensions" on page 4 of DS30139
# Rev. 13-2 (B0530W, October 2026), drawing rendered and read with the
# table text. Columns are Min / Max / Typ ("Typ" recorded as nominal).
# Mapping read from the arrows: E (2.55-2.85) is the body along the
# leads, D (1.40-1.70) the body across, He the lead-tip span, b the lead
# width (top view), L the gull-wing foot, c the lead thickness, A the
# total height from the seating plane (no A2 printed, so A is
# body_height and no overall_height is added), A1 the standoff.
# Not modelled: a 0-8 deg foot angle, "All 7 deg" draft, R0.100.
#
# The identical outline table (every row, Min/Max/Typ) is printed in
# DS30217 Rev. 23-2 (1N5819HW, p4), DS11013 Rev. 28-2 (SD103AW-CW, p4)
# and DS18010 Rev. 28-2 (MMSZ5221B-5259B, p4): checked by diffing the
# pdftotext -layout text of the outline sections (only rotated-label
# noise and the part-name footer differ).
schema_version: "0.2"
kind: package
id: manufacturers/diodes/SOD123-2.65x1.55-DS30139
family: sod
lead_count: 2
source: diodes/DS30139

pitch: { unit: mm }

construction:
  value: molded
  src: 'p1 "Mechanical Data: "Package Material: Molded Plastic. UL Flammability Classification Rating 94V-0""'

geometry: { type: parametric, generator: sod }

