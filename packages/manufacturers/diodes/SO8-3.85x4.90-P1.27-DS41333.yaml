# 8-lead SO-8 (narrow SOIC) from the PAM8302A datasheet DS41333 Rev.
# 6-2, page 10 "Package Outline Dimensions, SO-8" (rendered and read as
# an image). Table columns are Min / Max / Typ. Mapping read from the
# drawing's arrows: D body length (4.85-4.95), E lead-tip span, E1 the
# molded width at the top of the end view (3.80-3.90) -- recorded as
# body_width; E0 (3.85-3.95, width at the body's lower edge) is not
# recorded. A (1.40-1.50) is the overall height; no A2 is given, so no
# body_height. Not recorded: h (chamfer), Q, angles. No recommended land
# pattern in the datasheet. Not the same numbers as
# standards/SOIC8-3.90x4.90-P1.27 (E1 3.90 BSC, A max 1.75), so a
# separate package.
