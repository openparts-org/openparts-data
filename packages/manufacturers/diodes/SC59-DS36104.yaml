# Diodes SC59 (3-lead), read from "Package Outline Dimensions (1)
# Package Type: SC59" (DS36104 Rev. 8-2, AH1806, page 7), dimension
# table and rendered drawing.
#
# Mapping as standards/SOT23-2.90x1.30-P1.83-DIODES-DS18001: H ->
# body_width (along the two-lead edge), B -> body_length, C ->
# overall_length, A -> lead_width, M -> lead_thickness, J -> standoff,
# L -> lead_length; G (1.90, the two same-side leads) -> pitch; K (1.00
# / 1.10 / 1.30, seating plane to top in the side view) -> overall_height.
# Left out: N (0.70 / 0.75 / 0.80, not identifiable as a field), D
# (0.95, lead to centre), the Hall sensor location.
# Numbering: the AH1806 puts pin 1 and pin 3 on the same edge and pin 2
# alone (top view, page 1; "Pin1" at the lower left in the Sensor
# Location view), so pad_order maps the sot [2, 1] positions (two-lead
# edge first, then the single lead) to pins 1, 3, 2.
schema_version: "0.2"
kind: package
id: manufacturers/diodes/SC59-DS36104
family: sot
lead_count: 3

lead_layout:
  value: [2, 1]
  src:   'p7 "SC59 drawing: two leads on one edge, one lead centred on the opposite edge"'

source: diodes/DS36104

pitch: { typ: 1.9 mm, src: 'p7 "SC59 table, "G" typ 1.90"' }

pad_order:
  value: ["1", "3", "2"]
  src:   p1 "Pin Assignments, SC59 (Top View), 1 VDD and 3 OUTPUT on one edge, 2 GND opposite"

geometry: { type: parametric, generator: sot }

dimensions:
  body_width:     { min: 2.9 mm, typ: 3 mm, max: 3.1 mm, src: 'p7 "SC59 table, "H""' }
  body_length:    { min: 1.5 mm, typ: 1.6 mm, max: 1.7 mm, src: 'p7 "SC59 table, "B""' }
  lead_thickness: { min: 0.1 mm, typ: 0.15 mm, max: 0.2 mm, src: 'p7 "SC59 table, "M""' }
  lead_length:    { min: 0.35 mm, typ: 0.4 mm, max: 0.55 mm, src: 'p7 "SC59 table, "L""' }
  overall_length: { min: 2.7 mm, typ: 2.8 mm, max: 3 mm, src: 'p7 "SC59 table, "C""' }
  overall_height: { min: 1 mm, typ: 1.1 mm, max: 1.3 mm, src: 'p7 "SC59 table, "K""' }
  standoff:       { min: 0.013 mm, typ: 0.05 mm, max: 0.1 mm, src: 'p7 "SC59 table, "J""' }
  lead_width:     { min: 0.35 mm, typ: 0.38 mm, max: 0.5 mm, src: 'p7 "SC59 table, "A""' }
