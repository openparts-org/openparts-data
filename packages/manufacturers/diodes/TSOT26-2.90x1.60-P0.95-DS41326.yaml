# Diodes TSOT26 (6-lead thin SOT-23), from "Package Outline Dimensions"
# on page 17 of DS41326 Rev. 3-2 (AP63200/1/3/5, November 2024),
# rendered and read with the table text. Millimetres ("All Dimensions in
# mm"). The table uses JEDEC-style letters here (A, A1, A2, D, E, E1, b,
# c, e, e1, L, L2), checked against the arrows: D is the body length
# along the lead rows, E1 the molded width, E the lead-tip span, A2 the
# body thickness, A1 the standoff. Columns are Min / Max / Typ.
#
# Pin numbering is not printed on the outline; it is taken from the
# "Pin Assignments" top view (page 1: 1 FB, 2 EN, 3 VIN down one side,
# 6 BST, 5 SW, 4 GND opposite) and the marking diagram (page 16: 1 2 3
# along the bottom, 6 5 4 along the top) -- the generator's
# counter-clockwise [3, 3] layout.
#
# Mapping for the `sot` generator (leads exit across body_length):
# body_width = D 2.800/2.900 typ/3.000, body_length = E1 1.500/1.600
# typ/1.700, overall_length = E "2.800 BSC", body_height = A2
# 0.840-0.900, overall_height = A max 1.00, standoff = A1 0.010-0.100,
# lead_width = b 0.300-0.450, lead_thickness = c 0.120-0.200,
# lead_length = L 0.30-0.50. "Typ" values recorded as nominal; rows
# without a Typ are min/max only. Not modelled: L2 0.250 BSC (gauge
# plane), angles.
schema_version: "0.2"
kind: package
id: manufacturers/diodes/TSOT26-2.90x1.60-P0.95-DS41326
family: sot
lead_count: 6

lead_layout:
  value: [3, 3]
  src:
    - 'p1 "Pin Assignments, TSOT26 TOP VIEW: 1 FB, 2 EN, 3 VIN on one side, 6 BST, 5 SW, 4 GND opposite"'
    - 'p16 "Marking Information, TSOT26 (Top View): 1 2 3 along the bottom, 6 5 4 along the top"'

source: diodes/DS41326

pitch: { typ: 0.95 mm, src: 'p17 "TSOT26 table, e "0.950 BSC" (e1 "1.900 BSC")"' }
geometry: { type: parametric, generator: sot }

dimensions:
  body_width:
    min: 2.8 mm
    typ: 2.9 mm
    max: 3 mm
    src: p17 "TSOT26 table, D "2.800 / 3.000 / 2.900" (Min/Max/Typ) -- see mapping note"
  body_length:
    min: 1.5 mm
    typ: 1.6 mm
    max: 1.7 mm
    src: p17 "TSOT26 table, E1 "1.500 / 1.700 / 1.600" (Min/Max/Typ) -- see mapping note"
  body_height:    { min: 0.84 mm, max: 0.9 mm, src: 'p17 "TSOT26 table, A2 "0.840 / 0.900 / -""' }
  lead_thickness: { min: 0.12 mm, max: 0.2 mm, src: 'p17 "TSOT26 table, c "0.120 / 0.200 / -""' }
  overall_length:
    typ: 2.8 mm
    src: p17 "TSOT26 table, E "2.800 BSC" (lead-tip span) -- see mapping note"
  overall_height: { max: 1 mm, src: 'p17 "TSOT26 table, A "- / 1.00 / -""' }
  standoff:       { min: 0.01 mm, max: 0.1 mm, src: 'p17 "TSOT26 table, A1 "0.010 / 0.100 / -""' }
  lead_width:     { min: 0.3 mm, max: 0.45 mm, src: 'p17 "TSOT26 table, b "0.300 / 0.450 / -""' }
  lead_length:    { min: 0.3 mm, max: 0.5 mm, src: 'p17 "TSOT26 table, L "0.30 / 0.50 / -""' }
