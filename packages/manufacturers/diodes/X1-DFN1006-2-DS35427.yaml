# Diodes X1-DFN1006-2, from "Package Outline Dimensions" on page 4 of
# DS35427 Rev. 10-2 (D5V0L1B2LP, September 2026), drawing rendered at
# 250 dpi and read with the table. Columns Min / Max / Typ. Two
# terminals at the ends of the long side: D (0.95-1.075) is the body
# across the two terminal "rows" (X, dfn body_width), E (0.55-0.675)
# the body along them (Y), L (0.20-0.30) terminal length along X, b
# (0.45-0.55) terminal width along Y, e "0.65" Typ the terminal centre
# distance (recorded as pitch; with one terminal per side the generator
# does not use it for placement), A total height (no A2: body_height),
# A1 standoff. No terminal thickness (A3) is printed.
#
# Pin 1: the bottom view marks "Pin #1 ID" (corner chamfer R) on the
# right-hand terminal, i.e. the left terminal seen from the top -- the
# generator's pin-1-left convention.
#
# Approximation: the bottom view shows the terminals slightly inset from
# the body ends (e 0.65 + L 0.25 = 0.90 < D 1.00); the dfn generator
# draws terminals flush with the body edge, so its terminal centres sit
# about 0.05 mm further out than drawn. Not modelled: R 0.05-0.15
# pin-1 chamfer, tolerances aaa/bbb/ccc.
