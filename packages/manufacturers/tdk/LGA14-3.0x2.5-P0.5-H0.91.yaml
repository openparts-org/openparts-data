      - p53 "Total Thickness A 0.85/0.91/0.97"
      - tdk/DS-000348@rev1.4 p56 "Total Thickness A 0.85/0.91/0.97"
      - tdk/DS-000439@rev1.1 p57 "Total Thickness A 0.85/0.91/0.97"
      - tdk/DS-000440@rev1.3 p58 "Total Thickness A 0.85/0.91/0.97"
  lead_width:
