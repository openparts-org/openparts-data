# TDK InvenSense 14 Lead LGA (2.5x3x0.91) mm NiAu pad finish, section 10.2
# "PACKAGE DIMENSIONS": drawing on one page, "DIMENSIONS IN MILLIMETERS"
# table on the next.
# Read from ICM-42688-P DS-000347 rev 1.9 (pages 54-55). The same
# drawing and table appear in ICM-42605 DS-000292 rev 1.7 (pp 52-53),
# ICM-42686-P DS-000348 rev 1.4 (pp 55-56), ICM-42688-V DS-000439 rev 1.1
# (pp 56-57) and IIM-42652 DS-000440 rev 1.3 (pp 57-58): the tables'
# pdftotext rows diff identical; the drawings were compared on renders
# (same dimensions, not pixel-identical).
# Frame: E = 3 BSC is the horizontal top-view dimension (body_width, X), D
# = 2.5 BSC vertical (body_length). Top view: pin 1 top-left (A1 corner
# index), 1-4 down the left, 5-7 bottom, 8-11 up the right, 12-14 top,
# counter-clockwise (also the "Pin Out Diagram" figure in section 4.1)
# -> lead_layout [4, 3, 4, 3].
# Lead pitch e 0.5 BSC; D1 1.5 BSC (4-pad columns), E1 1 BSC (3-pad
# rows), SD 0.25 BSC body centre to contact pin (centred). Lead width W
# 0.2/0.25/0.3, lead length L 0.425/0.475/0.525, the same on all sides.
# Body edge to terminal: "(0.10)" reference on both axes of the bottom
# view; the BSC-style "2X 1.1625" (column centre from body centre) and
# "2X 0.9125" (row centre) agree: 1.5 - 1.1625 - 0.475/2 = 0.10 and
# 1.25 - 0.9125 - 0.2375 = 0.10.
# Heights: A (total) 0.85/0.91/0.97; A2 mold thickness 0.8 REF -> body_height
# (reference value, so marked); A1 substrate 0.105 REF not recorded.
# Not drawn by the generator: the "A1 CORNER INDEX AREA" pad (0.25 x 0.09
# reference) next to pin 1.
