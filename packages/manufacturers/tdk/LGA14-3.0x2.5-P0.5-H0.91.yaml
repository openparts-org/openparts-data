    typ: 0.25 mm
    max: 0.3 mm
    src:
      - tdk/DS-000347@rev1.9 p55 "Lead Width W 0.2/0.25/0.3"
      - p53 "Lead Width W 0.2/0.25/0.3"
      - tdk/DS-000348@rev1.4 p56 "Lead Width W 0.2/0.25/0.3"
      - tdk/DS-000439@rev1.1 p57 "Lead Width W 0.2/0.25/0.3"
      - tdk/DS-000440@rev1.3 p58 "Lead Width W 0.2/0.25/0.3"
  lead_length:
    min: 0.425 mm
    typ: 0.475 mm
    max: 0.525 mm
    src:
      - tdk/DS-000347@rev1.9 p55 "Lead Length L 0.425/0.475/0.525"
      - p53 "Lead Length L 0.425/0.475/0.525"
      - tdk/DS-000348@rev1.4 p56 "Lead Length L 0.425/0.475/0.525"
      - tdk/DS-000439@rev1.1 p57 "Lead Length L 0.425/0.475/0.525"
      - tdk/DS-000440@rev1.3 p58 "Lead Length L 0.425/0.475/0.525"
