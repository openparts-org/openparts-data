# TDK InvenSense ICM-42670-P "14 Lead LGA (2.5x3x0.76) mm NiAu pad finish",
# read from section 10.2 PACKAGE DIMENSIONS (page 38) of DS-000451 rev 1.2:
# drawing and DIMENSIONS IN MILLIMETERS table on the same page.
# Frame: D (2.95/3.00/3.05) is the horizontal top-view dimension
# (body_width), E (2.45/2.50/2.55) vertical. The bottom view carries no pin
# numbers; its PIN 1 INDENT is top-right (= top-left in the top view) and
# the Figure 4 pin-out (page 18) numbers 1-4 down the left edge, 5-7
# bottom, 8-11 up the right, 12-14 top -> lead_layout [4, 3, 4, 3].
# Lead pitch e 0.50; edge pin centre to centre e*3 1.50 (columns), e*2 1.00
# (rows); body centre to contact pin e/2 0.25 (centred). Lead width b
# 0.20/0.25/0.30, lead length L3 0.425/0.475/0.525, package edge to lead
# edge L1 0.10 (nominal only; L 0.525/0.575/0.625 = L1 + L3 not recorded
# separately). Total thickness A 0.71/0.76/0.81 -> overall_height; mold
# thickness A3 0.65 REF -> body_height (reference value); substrate c
# 0.105 REF not recorded. Not drawn: the 0.25x0.09 PIN 1 INDENT pad.
schema_version: "0.2"
kind: package
id: manufacturers/tdk/LGA14-3.0x2.5-P0.5-ICM42670
family: lga
lead_count: 14

lead_layout:
  value: [4, 3, 4, 3]
  src: ['p38 "bottom view (PIN 1 INDENT top-right), Lead Count 14"', p18 "Figure 4 Pin Out Diagram"]

source: tdk/DS-000451@rev1.2

pitch: { typ: 0.5 mm, src: p38 "Lead Pitch e 0.50" }
geometry: { type: parametric, generator: lga }

dimensions:
  body_width:
    min: 2.95 mm
    typ: 3 mm
    max: 3.05 mm
    src: p38 "Body Size D 2.95/3.00/3.05 (horizontal in the top view)"
  body_length: { min: 2.45 mm, typ: 2.5 mm, max: 2.55 mm, src: p38 "Body Size E 2.45/2.50/2.55" }
  body_height: { typ: 0.65 mm, src: p38 "Mold Thickness A3 0.65 REF (reference value)" }
  lead_inset:  { typ: 0.1 mm, src: p38 "Package Edge to Lead Edge L1 0.10" }
  overall_height:
    min: 0.71 mm
    typ: 0.76 mm
    max: 0.81 mm
    src: p38 "Total Thickness A 0.71/0.76/0.81"
  lead_width:  { min: 0.2 mm, typ: 0.25 mm, max: 0.3 mm, src: p38 "Lead Width b 0.20/0.25/0.30" }
  lead_length:
    min: 0.425 mm
    typ: 0.475 mm
    max: 0.525 mm
    src: p38 "Lead Length L3 0.425/0.475/0.525"
