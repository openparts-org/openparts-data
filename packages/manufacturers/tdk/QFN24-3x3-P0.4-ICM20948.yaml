# TDK InvenSense ICM-20948 24-lead QFN, 3x3 mm, 0.4 mm pitch: Figure 14
# (drawing, page 84) and Table 24 "Package Dimensions" (page 85, text) of
# DS-000189 rev 1.6. A (overall height) -> body_height; A1 -> standoff;
# b -> lead_width; L -> lead_length; c "0.15 REF" -> lead_thickness
# (reference value).
# The exposed die pad (D2 1.65/1.70/1.75 x E2 1.49/1.54/1.59) is
# deliberately NOT recorded: section 4.4 says it "should not be soldered
# to the PCB" and has no electrical connection, and the schema has no
# way to keep a bottom pad off the footprint without explicit land data
# (the datasheet prints no land pattern). Pin 1 top of the left edge,
# counter-clockwise (Figure 3, page 19: 1-6 down the left, 7-12 along
# the bottom, 13-18 up the right, 19-24 right to left along the top).
schema_version: "0.2"
kind: package
id: manufacturers/tdk/QFN24-3x3-P0.4-ICM20948
family: qfn
lead_count: 24
source: tdk/DS-000189@rev1.6

pitch: { typ: 0.4 mm, src: 'p85 "Table 24 Package Dimensions, e 0.40"' }
geometry: { type: parametric, generator: qfn }

dimensions:
  body_width: { min: 2.9 mm, typ: 3 mm, max: 3.1 mm, src: 'p85 "Table 24, E 2.90 / 3.00 / 3.10"' }
  body_length: { min: 2.9 mm, typ: 3 mm, max: 3.1 mm, src: 'p85 "Table 24, D 2.90 / 3.00 / 3.10"' }
  body_height:
    min: 0.95 mm
    typ: 1 mm
    max: 1.05 mm
    src: p85 "Table 24, A 0.95 / 1.00 / 1.05"
  lead_thickness: { typ: 0.15 mm, src: 'p85 "Table 24, c 0.15 REF (reference value)"' }
  standoff: { min: 0 mm, typ: 0.02 mm, max: 0.05 mm, src: 'p85 "Table 24, A1 0.00 / 0.02 / 0.05"' }
  lead_width:
    min: 0.15 mm
    typ: 0.2 mm
    max: 0.25 mm
    src: p85 "Table 24, b 0.15 / 0.20 / 0.25"
  lead_length:
    min: 0.25 mm
    typ: 0.3 mm
    max: 0.35 mm
    src: p85 "Table 24, L 0.25 / 0.30 / 0.35"
