# GCT MEM2052 microSD card socket, push-push, SMT, 1.95 mm profile: 8
# card contacts P1-P8, card-detect pin P9 and 4 "GND" shell pads, from
# page 1 of gct/MEM2052-DWG (revision A3, 08/03/24).
# Frame (card_socket): top view, X right, Y up, card slot toward +Y,
# origin at the centre of the component outline. The source's
# "Recommended PCB Layout" ("As viewed from component side") draws the
# card slot at the bottom (the dashed card-entry arc; same as the top
# view, whose card sticks out at the bottom and whose front view below it
# shows the slot face): it is turned 180° (x -> -x, y -> -y).
# Outline: "14.00" wide (layout and front view), "15.25" long on its
# right-hand side and "14.25" on its left (layout; bottom view "15.25",
# "14.25"): body_length is the longer side; the bounding box's centre is
# the origin.
# Height "1.95" (side view; title "1.95mm Profile").
# Values printed without a tolerance carry the layout's "General
# Tolerance: ±0.05" (not recorded as min/max).
schema_version: "0.2"
kind: package
id: manufacturers/gct/MEM2052
family: card_socket
lead_count: { value: 13, src: 'p1 "Recommended PCB Layout, pads P1-P8, P9, 4x GND"' }
source: gct/MEM2052-DWG

pitch: { typ: 1.1 mm, src: 'p1 "Recommended PCB Layout, "1.10 pitch""' }

connector:
  mechanism: push_push
  interface: micro_sd
  src: p1 "Title block, "Micro SD Memory Card Connector, Push-Push""

geometry: { type: parametric, generator: card_socket }

dimensions:
  body_width:
    typ: 14 mm
    src: p1 "Recommended PCB Layout, component outline "14.00"; front view "14.00""
  body_length:
    typ: 15.25 mm
    src: p1 "Recommended PCB Layout, component outline right side "15.25"; bottom view "15.25""
  body_height: { typ: 1.95 mm, src: p1 "Side view "1.95"; title "1.95mm Profile"" }

# pads (Recommended PCB Layout, layout frame first: x right from the
# outline's left edge, y down from the outline's top edge):
# X: bottom GND pads "1.40" wide, the right one "0.29" outside the
# outline's right edge (14.00 + 0.29 = 14.29 outer edge -> centre 13.59),
# "14.55" over both -> left outer edge 14.29 - 14.55 = -0.26 -> centre
# 0.44. Top-left GND: left edge "1.64" from the bottom-left GND's outer
# edge -> 1.38, width "1.20" -> centre 1.98. P9: left edge "1.55" further
# -> 2.93, width "1.00" -> centre 3.43. Top-right GND: left edge "5.70"
# from the top-left GND's -> 7.08, width "1.30" -> centre 7.73. P8: left
# edge "0.56" left of the top-left GND's left edge -> 0.82, "8x 0.80"
# wide -> centre 1.22; P7..P1 at "1.10 pitch" -> 2.32 ... 8.92.
# Y: top GND pads "1.40" high, bottom edge "1.10" below the outline top
# -> centre 0.40. P9 top "1.59" above that line -> -0.49, height "1.04"
# -> centre 0.03. Contacts' top "9.41" below the top GND's bottom edge
# -> 10.51, "8x 1.50" high -> centre 11.26; P2 "0.40" higher -> 10.86;
# P4 and P6 "2x 0.20" lower -> 11.46. Bottom-left GND top "11.50" below
# the top GND's bottom edge -> 12.60, "2x 1.90" high -> centre 13.55;
# bottom-right GND top "12.50" below -> 13.60 -> centre 14.55.
# Body centre (7.00, 7.625); 180° turn: X = 7.00 - x, Y = y - 7.625.
# (The vector geometry agrees within 0.015 mm.)
pads:
  value:
    - { number: P1, x: -1.92, y: 3.635, width: 0.8, length: 1.5 }
    - { number: P2, x: -0.82, y: 3.235, width: 0.8, length: 1.5 }
    - { number: P3, x: 0.28, y: 3.635, width: 0.8, length: 1.5 }
    - { number: P4, x: 1.38, y: 3.835, width: 0.8, length: 1.5 }
    - { number: P5, x: 2.48, y: 3.635, width: 0.8, length: 1.5 }
    - { number: P6, x: 3.58, y: 3.835, width: 0.8, length: 1.5 }
    - { number: P7, x: 4.68, y: 3.635, width: 0.8, length: 1.5 }
    - { number: P8, x: 5.78, y: 3.635, width: 0.8, length: 1.5 }
    - { number: P9, x: 3.57, y: -7.595, width: 1, length: 1.04 }
    - { number: GND, x: 5.02, y: -7.225, width: 1.2, length: 1.4 }
    - { number: GND, x: -0.73, y: -7.225, width: 1.3, length: 1.4 }
    - { number: GND, x: 6.56, y: 5.925, width: 1.4, length: 1.9 }
    - { number: GND, x: -6.59, y: 6.925, width: 1.4, length: 1.9 }
  src: p1 "Recommended PCB Layout (see comment above)"
