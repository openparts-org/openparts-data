# GCT USB4110 USB 2.0 Type-C receptacle, SMT, PCB top mount: 16 contacts
# on 12 SMD pads + 4 SMD shell pads (no slots), from page 1 of
# gct/USB4110-DWG (revision B4, 22/05/24).
# Frame (usb_c): top view, X right, Y up, opening toward +Y; the source's
# "Recommended PCB Layout" (component side, PCB edge at the bottom) is
# turned 180° (x -> -x, y -> -y). Origin: centre line / front shell pad
# centres. Arithmetic in the comment above pads.
# Shell: "8.94" wide (top view), "7.35±0.30" long (side view; "7.70±0.30"
# includes the rear tails), "3.16" high above its underside, which sits
# "0.10" above the seating plane (standoff; "3.26" overall); front face
# "2.85" in front of the front tab centres (side view; layout "2x 2.85"
# to PCB edge): centre y = 2.85 - 7.35/2 = -0.825.
# Values printed without a tolerance carry the title block's general
# tolerance (not recorded as min/max).
# NOT in the footprint: the two non-plated Ø0.65 alignment-peg holes --
# add them by hand.
schema_version: "0.2"
kind: package
id: manufacturers/gct/USB4110
family: usb_c
lead_count: { value: 16, src: 'p1 "Recommended PCB Layout, contact pads and shell pads"' }
source: gct/USB4110-DWG

pitch: { unit: mm }
geometry: { type: parametric, generator: usb_c }

dimensions:
  body_width:  { typ: 8.94 mm, src: 'p1 "Top view (left of the PCB layout), shell width "8.94""' }
  body_length:
    min: 7.05 mm
    typ: 7.35 mm
    max: 7.65 mm
    src: p1 "Side view, shell length "7.35±0.30""
  body_height: { typ: 3.16 mm, src: 'p1 "Side view, shell height "3.16" (overall "3.26")"' }
  body_offset:
    typ: -0.825 mm
    src: p1 "Side view, front face to front tab, tab to tab; shell length (see header)"
  standoff: { typ: 0.1 mm, src: 'p1 "Side view, shell underside above the seating plane "0.10""' }

# pads (Recommended PCB Layout, tolerance ±0.05, turned 180°):
# X: 6.40 outer centres -> ±3.2; 4.80 A4/B9-B4/A9 -> ±2.4; 3.50 B8-B5
# -> ±1.75; 6x 0.50 pitch between (A5 ±1.25, B7 ±0.75, A6/A7 ±0.25);
# then x -> -x. Widths 4x 0.60 (double-labelled), 8x 0.30; length 12x
# 1.15. Y: 12x 1.15 from the rear shell pad line, 2x 3.93 behind the
# front shell pads -> y = -(3.93 + 1.15/2) = -4.505. Shell pads (SMD):
# 10.22 apart -> ±5.11; rear y -3.93, front y 0; 2.18 (X) x 2.00 (Y).
pads:
  value:
    - { number: A1, x: 3.2, y: -4.505, width: 0.6, length: 1.15 }
    - { number: A4, x: 2.4, y: -4.505, width: 0.6, length: 1.15 }
    - { number: B8, x: 1.75, y: -4.505, width: 0.3, length: 1.15 }
    - { number: A5, x: 1.25, y: -4.505, width: 0.3, length: 1.15 }
    - { number: B7, x: 0.75, y: -4.505, width: 0.3, length: 1.15 }
    - { number: A6, x: 0.25, y: -4.505, width: 0.3, length: 1.15 }
    - { number: A7, x: -0.25, y: -4.505, width: 0.3, length: 1.15 }
    - { number: B6, x: -0.75, y: -4.505, width: 0.3, length: 1.15 }
    - { number: A8, x: -1.25, y: -4.505, width: 0.3, length: 1.15 }
    - { number: B5, x: -1.75, y: -4.505, width: 0.3, length: 1.15 }
    - { number: A9, x: -2.4, y: -4.505, width: 0.6, length: 1.15 }
    - { number: A12, x: -3.2, y: -4.505, width: 0.6, length: 1.15 }
    - { number: SHELL, x: 5.11, y: -3.93, width: 2.18, length: 2 }
    - { number: SHELL, x: -5.11, y: -3.93, width: 2.18, length: 2 }
    - { number: SHELL, x: 5.11, y: 0, width: 2.18, length: 2 }
    - { number: SHELL, x: -5.11, y: 0, width: 2.18, length: 2 }
  src: p1 "Recommended PCB Layout (see comment above)"
