# GCT USB4105 USB 2.0 Type-C receptacle, SMT, PCB top mount: 16 contacts
# on 12 SMD pads + 4 plated shell slots, from page 1 of
# gct/USB4105-DWG (revision B4, 18/12/23).
# Frame (usb_c): top view, X right, Y up, opening toward +Y; the source's
# "Recommended PCB Layout" (component side, PCB edge at the bottom) is
# turned 180° (x -> -x, y -> -y). Origin: centre line / front slot
# centres. Arithmetic in the comment above pads.
# The rear slots have no own Y dimension in the layout: their centre line
# is drawn on the extension line of "12x 4.18" (the pads' edge), and the
# side view dimensions the shell tabs "4.18" apart -- both give 4.18.
# Shell: "8.94" wide, "7.35" long (top view), "3.31" high (side view,
# seating plane to top; no standoff shown); front face "2.60" in front
# of the front tab centres (side view; layout "2x 2.60" to PCB edge):
# centre y = 2.60 - 7.35/2 = -1.075.
# Values printed without a tolerance carry the title block's general
# tolerance (not recorded as min/max).
# The shell stake length ("S", 0.60/0.95/1.20 by MPN suffix) varies:
# tail_length is not recorded (generator default drawn).
# NOT in the footprint: the two non-plated Ø0.65 alignment-peg holes --
# add them by hand.
schema_version: "0.2"
kind: package
id: manufacturers/gct/USB4105
family: usb_c
lead_count: { value: 16, src: 'p1 "Recommended PCB Layout, contact pads and shell slots"' }
source: gct/USB4105-DWG

pitch: { unit: mm }
geometry: { type: parametric, generator: usb_c }

dimensions:
  body_width:  { typ: 8.94 mm, src: 'p1 "Top view (left of the PCB layout), shell width "8.94""' }
  body_length: { typ: 7.35 mm, src: 'p1 "Top view, shell length "7.35""' }
  body_height: { typ: 3.31 mm, src: 'p1 "Side view, seating plane to shell top "3.31""' }
  body_offset:
    typ: -1.075 mm
    src: p1 "Side view, front face to front tab, tab to tab; shell length (see header)"

# pads (Recommended PCB Layout, tolerance ±0.05, turned 180°):
# X: 6.40 outer centres -> ±3.2; 4.80 A4/B9-B4/A9 -> ±2.4; 3.50 B8-B5
# -> ±1.75; 0.50 pitch between (A5 ±1.25, B7 ±0.75, A6/A7 ±0.25); then
# x -> -x. Widths 4x 0.60 (double-labelled), 8x 0.30; length 12x 1.15.
# Y: 12x 4.18 front slots to the pads' rear edge -> y = -(4.18 +
# 1.15/2) = -4.755. Shell slots: 8.64 apart -> ±4.32; rear y -4.18
# (land 2.10 x 1.00, slot 1.70 x 0.60), front y 0 (land 1.80 x 1.00,
# slot 1.40 x 0.60).
pads:
  value:
    - { number: A1, x: 3.2, y: -4.755, width: 0.6, length: 1.15 }
    - { number: A4, x: 2.4, y: -4.755, width: 0.6, length: 1.15 }
    - { number: B8, x: 1.75, y: -4.755, width: 0.3, length: 1.15 }
    - { number: A5, x: 1.25, y: -4.755, width: 0.3, length: 1.15 }
    - { number: B7, x: 0.75, y: -4.755, width: 0.3, length: 1.15 }
    - { number: A6, x: 0.25, y: -4.755, width: 0.3, length: 1.15 }
    - { number: A7, x: -0.25, y: -4.755, width: 0.3, length: 1.15 }
    - { number: B6, x: -0.75, y: -4.755, width: 0.3, length: 1.15 }
    - { number: A8, x: -1.25, y: -4.755, width: 0.3, length: 1.15 }
    - { number: B5, x: -1.75, y: -4.755, width: 0.3, length: 1.15 }
    - { number: A9, x: -2.4, y: -4.755, width: 0.6, length: 1.15 }
    - { number: A12, x: -3.2, y: -4.755, width: 0.6, length: 1.15 }
    - { number: SHELL, x: 4.32, y: -4.18, width: 1, length: 2.1, drill: 0.6, drill_length: 1.7 }
    - { number: SHELL, x: -4.32, y: -4.18, width: 1, length: 2.1, drill: 0.6, drill_length: 1.7 }
    - { number: SHELL, x: 4.32, y: 0, width: 1, length: 1.8, drill: 0.6, drill_length: 1.4 }
    - { number: SHELL, x: -4.32, y: 0, width: 1, length: 1.8, drill: 0.6, drill_length: 1.4 }
  src: p1 "Recommended PCB Layout (see comment above)"

# The layout draws the PCB edge line "2x 2.60" in front of the front
# slot centres: y = +2.60 after the 180° turn (the shell's front face is
# on that line too).
edge:
  side: +y
  requirement: required
  pcb_edge: 2.6
  src: p1 "Recommended PCB Layout, PCB Edge line (see comment above)"
