# GCT USB4105 USB 2.0 Type-C receptacle, SMT, PCB top mount: 16 contacts
# on 12 SMD pads + 4 plated shell slots, from page 1 of
# gct/USB4105-DWG (revision B4, 18/12/23).
# Frame (usb_c): top view, X right, Y up, opening toward +Y; the source's
# "Recommended PCB Layout" (component side, PCB edge at the bottom) is
# turned 180° (x -> -x, y -> -y). Origin: centre line / front slot
# centres. Arithmetic in "/pads".
# The rear slots have no own Y dimension in the layout: their centre line
# is drawn on the extension line of "12x 4.18" (the pads' edge), and the
# side view dimensions the shell tabs "4.18" apart -- both give 4.18.
# Shell: "8.94" wide, "7.35" long (top view), "3.31" high (side view,
# seating plane to top; no standoff shown); front face "2.60" in front
# of the front tab centres (side view; layout "2x 2.60" to PCB edge):
# centre y = 2.60 - 7.35/2 = -1.075. 
# Values printed without a tolerance carry the title block's general
# tolerance (not recorded as min/max).
# The shell stake length ("S", 0.60/0.95/1.20 by MPN suffix) varies:
# tail_length is not recorded (generator default drawn).
# NOT in the footprint: the two non-plated Ø0.65 alignment-peg holes --
# add them by hand.
schema_version: "0.1"
kind: package
id: manufacturers/gct/USB4105

family: usb_c
lead_count: 16

pitch:
  unit: mm

dimensions:
  body_width:
    nominal: 8.94
    unit: mm
  body_length:
    nominal: 7.35
    unit: mm
  body_height:
    nominal: 3.31
    unit: mm
  body_offset:
    nominal: -1.075
    unit: mm

geometry:
  type: parametric
  generator: usb_c

# The layout draws the PCB edge line "2x 2.60" in front of the front
# slot centres: y = +2.60 after the 180° turn (the shell's front face is
# on that line too).
edge:
  side: "+y"
  pcb_edge: 2.6

pads:
  - { number: "A1", x: 3.2, y: -4.755, width: 0.6, length: 1.15 }
  - { number: "A4", x: 2.4, y: -4.755, width: 0.6, length: 1.15 }
  - { number: "B8", x: 1.75, y: -4.755, width: 0.3, length: 1.15 }
  - { number: "A5", x: 1.25, y: -4.755, width: 0.3, length: 1.15 }
  - { number: "B7", x: 0.75, y: -4.755, width: 0.3, length: 1.15 }
  - { number: "A6", x: 0.25, y: -4.755, width: 0.3, length: 1.15 }
  - { number: "A7", x: -0.25, y: -4.755, width: 0.3, length: 1.15 }
  - { number: "B6", x: -0.75, y: -4.755, width: 0.3, length: 1.15 }
  - { number: "A8", x: -1.25, y: -4.755, width: 0.3, length: 1.15 }
  - { number: "B5", x: -1.75, y: -4.755, width: 0.3, length: 1.15 }
  - { number: "A9", x: -2.4, y: -4.755, width: 0.6, length: 1.15 }
  - { number: "A12", x: -3.2, y: -4.755, width: 0.6, length: 1.15 }
  - { number: "SHELL", x: 4.32, y: -4.18, width: 1.0, length: 2.1, drill: 0.6, drill_length: 1.7 }
  - { number: "SHELL", x: -4.32, y: -4.18, width: 1.0, length: 2.1, drill: 0.6, drill_length: 1.7 }
  - { number: "SHELL", x: 4.32, y: 0.0, width: 1.0, length: 1.8, drill: 0.6, drill_length: 1.4 }
  - { number: "SHELL", x: -4.32, y: 0.0, width: 1.0, length: 1.8, drill: 0.6, drill_length: 1.4 }

provenance:
  "/edge":
    - source: gct/USB4105-DWG
      page: 1
      locator: "\"Recommended PCB Layout\": the line labelled \"PCB Edge\", dimensioned \"2x 2.60\" from the front (opening-side) shell slot centres, on the opening side; turned 180° like /pads, so y = +2.60 with the opening toward +Y"
  "/lead_count":
    - source: gct/USB4105-DWG
      page: 1
      locator: "\"Recommended PCB Layout\": 12 contact pads (A1 B12, A4 B9, B8, A5, B7, A6, A7, B6, A8, B5, B4 A9, B1 A12) + 4 plated shell slots"
  "/pads":
    - source: gct/USB4105-DWG
      page: 1
      locator: "\"Recommended PCB Layout\" (as viewed from component side, tolerance ±0.05), drawn with the PCB edge (opening) at the bottom; turned 180° so the opening faces +Y (x -> -x, y -> -y; rotation, not mirror). Origin: X centre line, Y front (PCB-edge side) shell slot centres. X (drawing, left to right A1/B12, A4/B9, B8, A5, B7, A6, A7, B6, A8, B5, B4/A9, B1/A12): \"6.40\" outer pad centres -> ±3.2; \"4.80\" A4/B9 to B4/A9 -> ±2.4; \"3.50\" B8 to B5 -> ±1.75; pitch \"0.50\" in between (A5 ±1.25, B7 ±0.75, A6/A7 ±0.25); then x -> -x by the rotation. Widths \"4x 0.60\" (double-labelled pads), \"8x 0.30\"; length \"12x 1.15\". Y: \"12x 4.18\" from the front slot centres to the signal pads' rear-of-opening edge (the bottom edge in the drawing), so centre y = -(4.18 + 1.15/2) = -4.755. Shell slots (pin \"SHELL\"): \"8.64\" between centres -> x ±4.32; rear slot centres on that same 4.18 line (side view: tab to tab \"4.18\") -> y -4.18, land \"2x 2.10\" x \"4x 1.00\", slot \"2x 1.70\" x \"4x 0.60\"; front slots y 0, land \"2x 1.80\" x 1.00, slot \"2x 1.40\" x 0.60; \"2x 2.60\" front slots to PCB edge. Not recorded: the two non-plated \"2x Ø0.65\" alignment holes (\"5.78\" apart, \"2x 3.68\" from the front slots) -- the family has no non-plated hole."
  "/dimensions/body_width":
    - source: gct/USB4105-DWG
      page: 1
      locator: "Top view (left of the PCB layout), shell width \"8.94\""
  "/dimensions/body_length":
    - source: gct/USB4105-DWG
      page: 1
      locator: "Top view, shell length \"7.35\""
  "/dimensions/body_height":
    - source: gct/USB4105-DWG
      page: 1
      locator: "Side view, seating plane to shell top \"3.31\""
  "/dimensions/body_offset":
    - source: gct/USB4105-DWG
      page: 1
      locator: "Side view: front face to front tab centre \"2.60\", tab to tab \"4.18\"; shell length \"7.35\": centre y = 2.60 - 7.35/2 = -1.075 (opening toward +Y)"
