# GCT USB4125 power-only Type-C receptacle, horizontal: 6 contacts on 6
# SMD pads + 4 plated shell-stake slots, from page 1 of gct/USB4125-DWG
# (revision A6, 20/11/25).
# Frame (usb_c): top view, X right, Y up, opening toward +Y; the source's
# "Recommended PCB Layout" (receptacle front at the bottom, pad labels
# B12 B9 A5 B5 A9 A12 from left to right, matching the front view's
# A12/B12 sides) is turned 180° (x -> -x, y -> -y). Origin: receptacle
# centre line / centre line of the front shell slots.
# Shell: "8.94" wide and "6.80±0.15" long (top view), "3.16" high (side
# view); the side view puts the front face "2.60±0.15" in front of the
# front stakes: centre y = 2.60 - 6.80/2 = -0.8.
# The layout draws no PCB edge; no `edge` is recorded.
# The shell stake length ("S": 1.00 / 1.90 mm by MPN suffix) varies:
# tail_length is not recorded (generator default drawn).
# Values printed without a tolerance carry the title block's general
# tolerance (not recorded as min/max).
schema_version: "0.2"
kind: package
id: manufacturers/gct/USB4125
family: usb_c
lead_count: { value: 10, src: 'p1 "Recommended PCB Layout, 6 contact pads, 4 shell slots"' }
source: gct/USB4125-DWG

pitch: { unit: mm }
geometry: { type: parametric, generator: usb_c }

dimensions:
  body_width:  { typ: 8.94 mm, src: 'p1 "Top view, shell width "8.94""' }
  body_length: { min: 6.65 mm, typ: 6.8 mm, max: 6.95 mm, src: 'p1 "Top view, length "6.80±0.15""' }
  body_height: { typ: 3.16 mm, src: 'p1 "Side view, height "3.16""' }
  body_offset:
    typ: -0.8 mm
    src: p1 "Side view, front face to front stake "2.60±0.15"; top view length "6.80" (see header)"

# pads (Recommended PCB Layout, tolerance ±0.05, turned 180°):
# X: "5.50" B12-A12 centres -> ±2.75; "3.04" B9-A9 -> ±1.52; "1.00"
# A5-B5 -> ±0.5; then x -> -x. Widths "2x 0.80" (B12/A12), "2x 0.76"
# (B9/A9), "2x0.70" (A5/B5); length "1.20".
# Shell slots: "8.64" apart -> x ±4.32; front slots y 0, rear slots
# "3.80" behind -> y -3.8; land "4x 1.10" x "4x 1.70", slot "4x 0.60" x
# "4x 1.20".
# Y of the contact pads: their rear edge lies "0.68" behind the rear
# slot centre line -> -3.80 - 0.68 + 1.20/2 = -3.88.
pads:
  value:
    - { number: B12, x: 2.75, y: -3.88, width: 0.8, length: 1.2 }
    - { number: B9, x: 1.52, y: -3.88, width: 0.76, length: 1.2 }
    - { number: A5, x: 0.5, y: -3.88, width: 0.7, length: 1.2 }
    - { number: B5, x: -0.5, y: -3.88, width: 0.7, length: 1.2 }
    - { number: A9, x: -1.52, y: -3.88, width: 0.76, length: 1.2 }
    - { number: A12, x: -2.75, y: -3.88, width: 0.8, length: 1.2 }
    - { number: SHELL, x: 4.32, y: -3.8, width: 1.1, length: 1.7, drill: 0.6, drill_length: 1.2 }
    - { number: SHELL, x: -4.32, y: -3.8, width: 1.1, length: 1.7, drill: 0.6, drill_length: 1.2 }
    - { number: SHELL, x: 4.32, y: 0, width: 1.1, length: 1.7, drill: 0.6, drill_length: 1.2 }
    - { number: SHELL, x: -4.32, y: 0, width: 1.1, length: 1.7, drill: 0.6, drill_length: 1.2 }
  src: p1 "Recommended PCB Layout (see comment above)"
