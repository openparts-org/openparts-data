# GCT USB4085 USB 2.0 Type-C receptacle, "Dip Type, PCB Top Mount":
# 16 through-hole contacts in two rows + 4 plated shell slots, from
# gct/USB4085-DWG (revision B, 28/02/23): page 2 "Recommended PCB
# Layout", page 1 views.
# Frame (usb_c): top view, X right, Y up, opening toward +Y; the source
# layout (opening at the bottom) is turned 180° (x -> -x, y -> -y).
# Origin: centre line / front slot centres. Arithmetic in "/pads".
# Shell: "8.94" wide, "9.17±0.30" long (top view), "3.16" high (side
# view); front face "4.25" in front of the front tab centres (side view;
# the shell overhangs the line drawn "1.74" in front of the front slots
# in the layout): centre y = 4.25 - 9.17/2 = -0.335.
# Values printed without a tolerance carry the title block's general
# tolerance (not recorded as min/max).
# Tail lengths are not recorded (generator default drawn).
schema_version: "0.2"
kind: package
id: manufacturers/gct/USB4085
family: usb_c

lead_count:
  value: 20
  src: 'p2 ""Recommended PCB Layout": 16 plated contact holes (A1..A12 row, B12..B1 row) + 4 plated shell slots"'

source: gct/USB4085-DWG

pitch: { unit: mm }
geometry: { type: parametric, generator: usb_c }

dimensions:
  body_width:  { typ: 8.94 mm, src: 'p1 "Top view, shell width "8.94""' }
  body_length:
    min: 8.87 mm
    typ: 9.17 mm
    max: 9.47 mm
    src: p1 "Top view, shell length "9.17±0.30""
  body_height: { typ: 3.16 mm, src: 'p1 "Side view, shell height "3.16""' }
  body_offset:
    typ: -0.335 mm
    src: 'p1 "Side view: front face to front tab centre "4.25", tab to tab "3.38"; shell length "9.17": centre y = 4.25 - 9.17/2 = -0.335 (opening toward +Y)"'

