  src: 'p2 ""Recommended PCB Layout" (page 2; as viewed from component side, tolerance ±0.05), drawn with the opening at the bottom; turned 180° so the opening faces +Y (x -> -x, y -> -y; rotation, not mirror). Origin: X centre line, Y front shell slot centres. Contact holes "16x Ø0.65" land, "16x Ø0.40" drill, two rows: A row (A1 A4 A5 A6 A7 A8 A9 A12, left to right) and B row (B12 B9 B8 B7 B6 B5 B4 B1) on the same vertical centre lines. X: "5.95" A1 to A12 -> ±2.975; "4.25" A4 to A9 -> ±2.125; "2.55" A5 to A8 -> ±1.275; pitch "0.85" -> A6/A7 ±0.425; then x -> -x. Y: rear slot centres "3.38" behind the front ones; A row "0.98" behind and B row "0.37" in front of the rear slot centres ("1.35" between rows): A y = -(3.38 + 0.98) = -4.36, B y = -(3.38 - 0.37) = -3.01. Shell slots (pin "SHELL"): "8.65" between centres -> x ±4.325; land width "4x 0.90", slot width "4x 0.60"; rear y -3.38, land "2x 2.40", slot "2x 2.10"; front y 0, land "2x 1.70", slot "2x 1.40". No other holes."'
