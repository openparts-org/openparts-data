# GCT USB4085 USB 2.0 Type-C receptacle, "Dip Type, PCB Top Mount":
# 16 through-hole contacts in two rows + 4 plated shell slots, from
# gct/USB4085-DWG (revision B, 28/02/23): page 2 "Recommended PCB
# Layout", page 1 views.
# Frame (usb_c): top view, X right, Y up, opening toward +Y; the source
# layout (opening at the bottom) is turned 180° (x -> -x, y -> -y).
# Origin: centre line / front slot centres. Arithmetic in the comment
# above pads.
# Shell: "8.94" wide, "9.17±0.30" long (top view), "3.16" high (side
# view); front face "4.25" in front of the front tab centres (side view;
# the shell overhangs the line drawn "1.74" in front of the front slots
# in the layout): centre y = 4.25 - 9.17/2 = -0.335.
# Values printed without a tolerance carry the title block's general
# tolerance (not recorded as min/max).
# Tail lengths are not recorded (generator default drawn).
schema_version: "0.2"
kind: package
id: manufacturers/gct/USB4085
family: usb_c

lead_count:
  value: 20
  src: 'p2 ""Recommended PCB Layout": 16 plated contact holes (A1..A12 row, B12..B1 row) + 4 plated shell slots"'

source: gct/USB4085-DWG

pitch: { unit: mm }
geometry: { type: parametric, generator: usb_c }

dimensions:
  body_width:  { typ: 8.94 mm, src: 'p1 "Top view, shell width "8.94""' }
  body_length:
    min: 8.87 mm
    typ: 9.17 mm
    max: 9.47 mm
    src: p1 "Top view, shell length "9.17±0.30""
  body_height: { typ: 3.16 mm, src: 'p1 "Side view, shell height "3.16""' }
  body_offset:
    typ: -0.335 mm
    src: p1 "Side view, front face to front tab, tab to tab; shell length (see header)"

# pads (Recommended PCB Layout p2, tolerance ±0.05, turned 180°):
# holes 16x Ø0.65 land / Ø0.40 drill in an A row and a B row on the
# same centre lines. X: 5.95 A1-A12 -> ±2.975; 4.25 A4-A9 -> ±2.125;
# 2.55 A5-A8 -> ±1.275; 0.85 pitch -> A6/A7 ±0.425; then x -> -x.
# Y: rear slots 3.38 behind the front ones; A row 0.98 behind, B row
# 0.37 in front of the rear slots -> A y = -4.36, B y = -3.01.
# Shell slots: 8.65 apart -> ±4.325; width land 0.90 / slot 0.60;
# rear y -3.38 (land 2.40, slot 2.10), front y 0 (land 1.70, slot 1.40).
pads:
  value:
    - { number: A1, x: 2.975, y: -4.36, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: A4, x: 2.125, y: -4.36, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: A5, x: 1.275, y: -4.36, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: A6, x: 0.425, y: -4.36, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: A7, x: -0.425, y: -4.36, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: A8, x: -1.275, y: -4.36, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: A9, x: -2.125, y: -4.36, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: A12, x: -2.975, y: -4.36, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: B12, x: 2.975, y: -3.01, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: B9, x: 2.125, y: -3.01, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: B8, x: 1.275, y: -3.01, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: B7, x: 0.425, y: -3.01, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: B6, x: -0.425, y: -3.01, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: B5, x: -1.275, y: -3.01, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: B4, x: -2.125, y: -3.01, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: B1, x: -2.975, y: -3.01, width: 0.65, length: 0.65, drill: 0.4 }
    - { number: SHELL, x: 4.325, y: -3.38, width: 0.9, length: 2.4, drill: 0.6, drill_length: 2.1 }
    - { number: SHELL, x: -4.325, y: -3.38, width: 0.9, length: 2.4, drill: 0.6, drill_length: 2.1 }
    - { number: SHELL, x: 4.325, y: 0, width: 0.9, length: 1.7, drill: 0.6, drill_length: 1.4 }
    - { number: SHELL, x: -4.325, y: 0, width: 0.9, length: 1.7, drill: 0.6, drill_length: 1.4 }
  src: p2 "Recommended PCB Layout (see comment above)"
