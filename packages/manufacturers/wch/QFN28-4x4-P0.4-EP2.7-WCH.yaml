# WCH 28-pin QFN, 4 x 4 mm body, 0.4 mm pitch, 2.7 mm exposed pad:
# CH32X035 datasheet V2.3 section 4.3 "QFN28 Package" (PDF page 42,
# image, rendered and read). Pin 1 sits at the left end of the bottom
# edge in the top view, numbered counter-clockwise (#8 bottom of the
# right edge, #28 bottom of the left edge): the same CCW sequence as the
# generator, turned 90 degrees (as the CH32V003 QFN20 package).
# The exposed pad: the bottom view labels one side "2.7 +-0.2" and draws
# a square pad (chamfered at pin 1); the same value is recorded for
# width and length. Height "0.75 +-0.05" is the only package height
# (the parenthesised "(0.55 +-0.05)" and the terminal "0.2 +-0.05
# (0.15 +-0.05)" are not recorded: what they measure is not labelled).
# Standoff "0.025 +-0.025". Pitch "0.4" is printed without tolerance.
schema_version: "0.2"
kind: package
id: manufacturers/wch/QFN28-4x4-P0.4-EP2.7-WCH
family: qfn
lead_count: { value: 28, src: 'p42 "Section 4.3 QFN28 drawing, pins #1-#28"' }
source: wch/CH32X035DS0@V2.3

pitch: { typ: 0.4 mm, src: 'p42 "Section 4.3 QFN28, bottom view pitch 0.4"' }
geometry: { type: parametric, generator: qfn }

dimensions:
  src:         p42 "Section 4.3 QFN28 drawing"
  body_width:  { min: 3.9 mm, typ: 4 mm, max: 4.1 mm }
  body_length: { min: 3.9 mm, typ: 4 mm, max: 4.1 mm }
  body_height: { min: 0.7 mm, typ: 0.75 mm, max: 0.8 mm }
  exposed_pad:
    src:    p42 "Section 4.3 QFN28 bottom view, pad side 2.7 +-0.2 (one side labelled, pad drawn square)"
    width:  { min: 2.5 mm, typ: 2.7 mm, max: 2.9 mm }
    length: { min: 2.5 mm, typ: 2.7 mm, max: 2.9 mm }
  standoff:    { min: 0 mm, typ: 0.025 mm, max: 0.05 mm }
  lead_width:  { min: 0.15 mm, typ: 0.2 mm, max: 0.25 mm }
  lead_length: { min: 0.25 mm, typ: 0.35 mm, max: 0.45 mm }
