# WCH 20-pin QFN, 3 x 3 mm body, 0.4 mm pitch, 1.8 mm exposed pad:
# CH32V003 datasheet V1.8 section 4.2 "QFN20 package" (PDF page 33,
# image, rendered and read). Pin 1 sits at the left end of the bottom
# edge in the top view, numbered counter-clockwise (#5 bottom right,
# #20 bottom of the left edge): the same CCW sequence as the generator,
# turned 90 degrees.
# The exposed pad: the bottom view labels one side "1.8 +-0.2" and draws
# a square pad (chamfered at pin 1); the same value is recorded for
# width and length. Height "0.75 +-0.05" is the only package height
# (the parenthesised "(0.55 +-0.05)" and the terminal-side "0.2 +-0.05
# (0.15 +-0.05)" are not recorded: what they measure is not labelled).
# Standoff "0.025 +-0.025". Pitch is exact per the page note.
schema_version: "0.2"
kind: package
id: manufacturers/wch/QFN20-3x3-P0.4-EP1.8-WCH
family: qfn
lead_count: { value: 20, src: 'p33 "Section 4.2 QFN20 drawing, pins #1-#20"' }
source: wch/CH32V003DS0@V1.8

pitch: { typ: 0.4 mm, src: 'p33 "Section 4.2 QFN20, bottom view pitch 0.4"' }
geometry: { type: parametric, generator: qfn }

dimensions:
  src:         p33 "Section 4.2 QFN20 drawing"
  body_width:  { min: 2.9 mm, typ: 3 mm, max: 3.1 mm }
  body_length: { min: 2.9 mm, typ: 3 mm, max: 3.1 mm }
  body_height: { min: 0.7 mm, typ: 0.75 mm, max: 0.8 mm }
  exposed_pad:
    src:    p33 "Section 4.2 QFN20 bottom view, pad side 1.8 +-0.2 (one side labelled, pad drawn square)"
    width:  { min: 1.6 mm, typ: 1.8 mm, max: 2 mm }
    length: { min: 1.6 mm, typ: 1.8 mm, max: 2 mm }
  standoff:    { min: 0 mm, typ: 0.025 mm, max: 0.05 mm }
  lead_width:  { min: 0.15 mm, typ: 0.2 mm, max: 0.25 mm }
  lead_length: { min: 0.23 mm, typ: 0.35 mm, max: 0.47 mm }
