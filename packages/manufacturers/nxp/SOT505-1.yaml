# NXP SOT505-1, TSSOP8 ("plastic thin shrink small outline package; 8
# leads; body width 3 mm"; NXP also calls it MSOP8). Values from Figure 13
# "Package outline SOT505-1 (TSSOP8)" of the PCA9306 data sheet Rev. 9.5,
# page 15 (mm row, text extracted; issue date 03-02-18). The same outline
# is printed with identical mm values and issue date in the PCA9515A,
# PCA9517A, PCA9536, PCT2075, PCF85063A and PCA9600 data sheets (compared
# row by row).
# body_width = E, body_length = D, overall_width = HE, body_height = A2,
# overall_height = A (max only), standoff = A1, lead_width = bp,
# lead_thickness = c, lead_length = Lp (L is the reference lead length,
# not modelled). Only min/max are printed for most rows, so no typ is
# recorded. A3, Q, v, w, y, Z and the foot angle are not modelled. No land
# pattern is recorded.
schema_version: "0.2"
kind: package
