# NOTE (2026-11-10): out of date below -- the generators now draw a
# min/max-only dimension at its midpoint (never stored; openparts-mcad
# defaults::required), so this package does generate a footprint and model.
# NXP SOT96-1, SO8 (plastic small outline, 8 leads, body width 3.9 mm;
# JEDEC MS-012). All values from Fig 21 "Package outline SOT96-1 (SO8)"
# of the NXP LM75B data sheet Rev. 6.1, page 23 (mm row of the
# DIMENSIONS table). The table gives only max/min (no nominal) for the
# body and lead dimensions, so only min/max are recorded -- which means
# the soic generator (needs a body nominal) skips this package.
# body_width = E, body_length = D, overall_width = HE, body_height = A2,
# overall_height = A (max only), standoff = A1, lead_width = bp,
# lead_thickness = c, lead_length = Lp (foot length; L 1.05 is the
# reference lead length, not modelled).
schema_version: "0.1"
kind: package
id: manufacturers/nxp/SOT96-1

family: soic
lead_count: 8

pitch:
  nominal: 1.27
  unit: mm

dimensions:
  body_width:
    min: 3.8
    max: 4.0
    unit: mm
  body_length:
    min: 4.8
    max: 5.0
    unit: mm
  body_height:
    min: 1.25
    max: 1.45
    unit: mm
  overall_width:
    min: 5.8
    max: 6.2
    unit: mm
  overall_height:
    max: 1.75
    unit: mm
  standoff:
    min: 0.10
    max: 0.25
    unit: mm
  lead_width:
    min: 0.36
    max: 0.49
    unit: mm
  lead_length:
    min: 0.4
    max: 1.0
    unit: mm
  lead_thickness:
    min: 0.19
    max: 0.25
    unit: mm

geometry:
  type: parametric
  generator: soic

provenance:
  "/pitch":
    - source: nxp/LM75B@rev6.1
      page: 23
      locator: "Fig 21 SOT96-1 DIMENSIONS table (mm), \"e 1.27\""
  "/dimensions/body_width":
    - source: nxp/LM75B@rev6.1
      page: 23
      locator: "Fig 21 SOT96-1 DIMENSIONS table (mm), \"E 4.0 / 3.8\" (note 2)"
  "/dimensions/body_length":
    - source: nxp/LM75B@rev6.1
      page: 23
      locator: "Fig 21 SOT96-1 DIMENSIONS table (mm), \"D 5.0 / 4.8\" (note 1)"
  "/dimensions/body_height":
    - source: nxp/LM75B@rev6.1
      page: 23
      locator: "Fig 21 SOT96-1 DIMENSIONS table (mm), \"A2 1.45 / 1.25\""
  "/dimensions/overall_width":
    - source: nxp/LM75B@rev6.1
      page: 23
      locator: "Fig 21 SOT96-1 DIMENSIONS table (mm), \"HE 6.2 / 5.8\""
  "/dimensions/overall_height":
    - source: nxp/LM75B@rev6.1
      page: 23
      locator: "Fig 21 SOT96-1 DIMENSIONS table (mm), \"A max. 1.75\""
  "/dimensions/standoff":
    - source: nxp/LM75B@rev6.1
      page: 23
      locator: "Fig 21 SOT96-1 DIMENSIONS table (mm), \"A1 0.25 / 0.10\""
  "/dimensions/lead_width":
    - source: nxp/LM75B@rev6.1
      page: 23
      locator: "Fig 21 SOT96-1 DIMENSIONS table (mm), \"bp 0.49 / 0.36\""
  "/dimensions/lead_length":
    - source: nxp/LM75B@rev6.1
      page: 23
      locator: "Fig 21 SOT96-1 DIMENSIONS table (mm), \"Lp 1.0 / 0.4\""
  "/dimensions/lead_thickness":
    - source: nxp/LM75B@rev6.1
      page: 23
      locator: "Fig 21 SOT96-1 DIMENSIONS table (mm), \"c 0.25 / 0.19\""
