# NXP SOT313-2, LQFP48, body 7 x 7 x 1.4 mm, 0.5 mm pitch (JEDEC
# MS-026). All values from the "DIMENSIONS" table of Fig 40 "Package
# outline SOT313-2 (LQFP48)", NXP LPC84x data sheet Rev. 2.1, page 83.
# Not merged into standards/LQFP48-7x7-P0.5: NXP states D/E 6.9-7.1,
# HD/HE 8.85-9.15, c 0.12-0.18 and A1 0.05-0.20, which differ from the
# ST-sourced values held there. The table gives only min/max (no
# nominal) for these, so only min/max are recorded (body: see below).
# The nominal 7.0 is the body size in the outline title ("body 7 x 7 x
# 1.4 mm", also Table 1 "Ordering information"); the dimension table
# itself gives only min/max.
schema_version: "0.2"
kind: package
id: manufacturers/nxp/SOT313-2
family: lqfp
lead_count: 48
source: nxp/LPC84x@rev2.1

pitch: { typ: 0.5 mm, src: 'p83 "Fig 40 SOT313-2 DIMENSIONS table, "e" 0.5"' }
geometry: { type: parametric, generator: lqfp }

dimensions:
  body_width:
    min: 6.9 mm
    typ: 7 mm
    max: 7.1 mm
    src:
      - p83 "Fig 40 SOT313-2 DIMENSIONS table, "E(1)" 6.9/7.1"
      - 'p83 "SOT313-2 drawing title "LQFP48: plastic low profile quad flat package; ... body 7 x 7 x 1.4 mm" (also Table 1, page 4) -- nominal"'
  body_length:
    min: 6.9 mm
    typ: 7 mm
    max: 7.1 mm
    src:
      - p83 "Fig 40 SOT313-2 DIMENSIONS table, "D(1)" 6.9/7.1"
      - 'p83 "SOT313-2 drawing title "LQFP48: plastic low profile quad flat package; ... body 7 x 7 x 1.4 mm" (also Table 1, page 4) -- nominal"'
  body_height:
    min: 1.35 mm
    max: 1.45 mm
    src: p83 "Fig 40 SOT313-2 DIMENSIONS table, "A2" 1.35/1.45"
  lead_thickness:
    min: 0.12 mm
    max: 0.18 mm
    src: p83 "Fig 40 SOT313-2 DIMENSIONS table, "c" 0.12/0.18"
  overall_width:
    min: 8.85 mm
    max: 9.15 mm
    src: p83 "Fig 40 SOT313-2 DIMENSIONS table, "HE" 8.85/9.15"
  overall_length:
    min: 8.85 mm
    max: 9.15 mm
    src: p83 "Fig 40 SOT313-2 DIMENSIONS table, "HD" 8.85/9.15"
  overall_height: { max: 1.6 mm, src: 'p83 "Fig 40 SOT313-2 DIMENSIONS table, "A max." 1.6"' }
  standoff:
    min: 0.05 mm
    max: 0.2 mm
    src: p83 "Fig 40 SOT313-2 DIMENSIONS table, "A1" 0.05/0.20"
  lead_width:
    min: 0.17 mm
    max: 0.27 mm
    src: p83 "Fig 40 SOT313-2 DIMENSIONS table, "bp" 0.17/0.27"
  lead_length:
    min: 0.45 mm
    max: 0.75 mm
    src: p83 "Fig 40 SOT313-2 DIMENSIONS table, "Lp" 0.45/0.75 (foot length; "L" = 1 is the overall lead length)"
