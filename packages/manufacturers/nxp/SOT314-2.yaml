# NXP SOT314-2, LQFP64, body 10 x 10 x 1.4 mm, 0.5 mm pitch (JEDEC
# MS-026). All values from the "DIMENSIONS" table of Fig 41 "Package
# outline SOT314-2 (LQFP64)", NXP LPC84x data sheet Rev. 2.1, page 84
# (rendered and read). The table gives only min/max (no nominal), so
# only min/max are recorded.
# The nominal 10.0 is the body size in the outline title ("body 10 x 10 x
# 1.4 mm", also Table 1 "Ordering information"); the dimension table
# itself gives only min/max.
schema_version: "0.2"
kind: package
id: manufacturers/nxp/SOT314-2
family: lqfp
lead_count: 64
source: nxp/LPC84x@rev2.1

pitch: { typ: 0.5 mm, src: 'p84 "Fig 41 SOT314-2 DIMENSIONS table, "e" 0.5"' }
geometry: { type: parametric, generator: lqfp }

dimensions:
  body_width:
    min: 9.9 mm
    typ: 10 mm
    max: 10.1 mm
    src:
      - p84 "Fig 41 SOT314-2 DIMENSIONS table, "E(1)" 9.9/10.1"
      - 'p84 "SOT314-2 drawing title "LQFP64: plastic low profile quad flat package; ... body 10 x 10 x 1.4 mm" (also Table 1, page 4) -- nominal"'
  body_length:
    min: 9.9 mm
    typ: 10 mm
    max: 10.1 mm
    src:
      - p84 "Fig 41 SOT314-2 DIMENSIONS table, "D(1)" 9.9/10.1"
      - 'p84 "SOT314-2 drawing title "LQFP64: plastic low profile quad flat package; ... body 10 x 10 x 1.4 mm" (also Table 1, page 4) -- nominal"'
  body_height:
    min: 1.35 mm
    max: 1.45 mm
    src: p84 "Fig 41 SOT314-2 DIMENSIONS table, "A2" 1.35/1.45"
  lead_thickness:
    min: 0.12 mm
    max: 0.18 mm
    src: p84 "Fig 41 SOT314-2 DIMENSIONS table, "c" 0.12/0.18"
  overall_width:
    min: 11.85 mm
    max: 12.15 mm
    src: p84 "Fig 41 SOT314-2 DIMENSIONS table, "HE" 11.85/12.15"
  overall_length:
    min: 11.85 mm
    max: 12.15 mm
    src: p84 "Fig 41 SOT314-2 DIMENSIONS table, "HD" 11.85/12.15"
  overall_height: { max: 1.6 mm, src: 'p84 "Fig 41 SOT314-2 DIMENSIONS table, "A max." 1.6"' }
  standoff:
    min: 0.05 mm
    max: 0.2 mm
    src: p84 "Fig 41 SOT314-2 DIMENSIONS table, "A1" 0.05/0.20"
  lead_width:
    min: 0.17 mm
    max: 0.27 mm
    src: p84 "Fig 41 SOT314-2 DIMENSIONS table, "bp" 0.17/0.27"
  lead_length:
    min: 0.45 mm
    max: 0.75 mm
    src: p84 "Fig 41 SOT314-2 DIMENSIONS table, "Lp" 0.45/0.75 (foot length; "L" = 1 is the overall lead length)"
