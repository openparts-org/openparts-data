# NOTE (2026-11-10): out of date below -- the generators now draw a
# min/max-only dimension at its midpoint (never stored; openparts-mcad
# defaults::required), so this package does generate a footprint and model.
# NXP SOT162-1, SO16 (plastic small outline, 16 leads, body width
# 7.5 mm; JEDEC MS-013). All values from the "SO16 ... SOT162-1"
# package outline in the NXP PCF8574/PCF8574A data sheet Rev. 5, page 20
# (mm row of the DIMENSIONS table). Only max/min are given for body and
# lead dimensions, so only min/max are recorded (the soic generator,
# which needs a body nominal, skips this package).
# body_width = E, body_length = D, overall_width = HE, body_height = A2,
# overall_height = A (max only), standoff = A1, lead_width = bp,
# lead_thickness = c, lead_length = Lp (L 1.4 reference not modelled).
schema_version: "0.2"
kind: package
id: manufacturers/nxp/SOT162-1
family: soic
lead_count: 16
source: nxp/PCF8574_PCF8574A@rev5

pitch: { typ: 1.27 mm, src: 'p20 "SOT162-1 DIMENSIONS table (mm), "e 1.27""' }
geometry: { type: parametric, generator: soic }

dimensions:
  body_width:
    min: 7.4 mm
    max: 7.6 mm
    src: p20 "SOT162-1 DIMENSIONS table (mm), "E 7.6 / 7.4" (note 1)"
  body_length:
    min: 10.1 mm
    max: 10.5 mm
    src: p20 "SOT162-1 DIMENSIONS table (mm), "D 10.5 / 10.1" (note 1)"
  body_height:
    min: 2.25 mm
    max: 2.45 mm
    src: p20 "SOT162-1 DIMENSIONS table (mm), "A2 2.45 / 2.25""
  lead_thickness:
    min: 0.23 mm
    max: 0.32 mm
    src: p20 "SOT162-1 DIMENSIONS table (mm), "c 0.32 / 0.23""
  overall_width:
    min: 10 mm
    max: 10.65 mm
    src: p20 "SOT162-1 DIMENSIONS table (mm), "HE 10.65 / 10.00""
  overall_height: { max: 2.65 mm, src: 'p20 "SOT162-1 DIMENSIONS table (mm), "A max. 2.65""' }
  standoff:
    min: 0.1 mm
    max: 0.3 mm
    src: p20 "SOT162-1 DIMENSIONS table (mm), "A1 0.3 / 0.1""
  lead_width:
    min: 0.36 mm
    max: 0.49 mm
    src: p20 "SOT162-1 DIMENSIONS table (mm), "bp 0.49 / 0.36""
  lead_length:
    min: 0.4 mm
    max: 1.1 mm
    src: p20 "SOT162-1 DIMENSIONS table (mm), "Lp 1.1 / 0.4""
