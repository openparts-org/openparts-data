# NXP SOT162-1, SO16 (plastic small outline, 16 leads, body width
# 7.5 mm; JEDEC MS-013). All values from the "SO16 ... SOT162-1"
# package outline in the NXP PCF8574/PCF8574A data sheet Rev. 5, page 20
# (mm row of the DIMENSIONS table). Only max/min are given for body and
# lead dimensions, so only min/max are recorded (the soic generator,
# which needs a body nominal, skips this package).
# body_width = E, body_length = D, overall_width = HE, body_height = A2,
# overall_height = A (max only), standoff = A1, lead_width = bp,
# lead_thickness = c, lead_length = Lp (L 1.4 reference not modelled).
