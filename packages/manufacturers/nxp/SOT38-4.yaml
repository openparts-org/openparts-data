# NOTE (2026-11-10): out of date below -- the generators now draw a
# min/max-only dimension at its midpoint (never stored; openparts-mcad
# defaults::required), so this package does generate a footprint and model.
# NXP SOT38-4, DIP16 (plastic dual in-line, 16 leads, 300 mil). All
# values from the "DIP16 ... SOT38-4" package outline in the NXP
# PCF8574/PCF8574A data sheet Rev. 5, page 19 (mm row of the DIMENSIONS
# table). body_width is the dip generator's ROW SPACING = e1 7.62 (a
# single basic value in the table). Body length D is given only as
# max/min (19.50 / 18.55), so only min/max are recorded -- the dip
# generator (needs a body_length nominal) skips this package.
# body_height = A2 (max only), overall_height = A (max only), standoff =
# A1 (min only), lead_width = b, lead_thickness = c. Molded width E
# (6.20-6.48), ME/MH and L (3.05-3.60, lead length below the seating
# plane, not a gull-wing foot) are not modelled.
schema_version: "0.2"
kind: package
id: manufacturers/nxp/SOT38-4
family: dip
lead_count: 16
source: nxp/PCF8574_PCF8574A@rev5

pitch: { typ: 2.54 mm, src: 'p19 "SOT38-4 DIMENSIONS table (mm), "e 2.54""' }
geometry: { type: parametric, generator: dip }

dimensions:
  body_width:
    typ: 7.62 mm
    src: p19 "SOT38-4 DIMENSIONS table (mm), "e1 7.62" (row spacing; dip generator's body_width)"
  body_length:
    min: 18.55 mm
    max: 19.5 mm
    src: p19 "SOT38-4 DIMENSIONS table (mm), "D 19.50 / 18.55" (note 1)"
  body_height:    { max: 3.2 mm, src: 'p19 "SOT38-4 DIMENSIONS table (mm), "A2 max. 3.2""' }
  lead_thickness:
    min: 0.23 mm
    max: 0.36 mm
    src: p19 "SOT38-4 DIMENSIONS table (mm), "c 0.36 / 0.23""
  overall_height: { max: 4.2 mm, src: 'p19 "SOT38-4 DIMENSIONS table (mm), "A max. 4.2""' }
  standoff:       { min: 0.51 mm, src: 'p19 "SOT38-4 DIMENSIONS table (mm), "A1 min. 0.51""' }
  lead_width:
    min: 0.38 mm
    max: 0.53 mm
    src: p19 "SOT38-4 DIMENSIONS table (mm), "b 0.53 / 0.38""
