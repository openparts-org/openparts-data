# NXP SOT137-1, SO24 ("plastic small outline package; 24 leads; body
# width 7.5 mm", JEDEC MS-013). Values from Fig 25 "Package outline
# SOT137-1 (SO24)" of the PCA9555 data sheet Rev. 10, page 22 (mm row,
# text extracted; issue date 03-02-19). The PCA9548A data sheet Rev. 5.1
# prints the same outline (Fig 18, page 18, rendered): identical mm values
# and issue date.
# body_width = E, body_length = D, overall_width = HE, body_height = A2,
# overall_height = A (max only), standoff = A1, lead_width = bp,
# lead_thickness = c, lead_length = Lp (L is the reference lead length,
# not modelled). Only min/max are printed for most rows, so no typ is
# recorded. A3, Q, v, w, y, Z and the foot angle are not modelled. No land
# pattern is recorded.
