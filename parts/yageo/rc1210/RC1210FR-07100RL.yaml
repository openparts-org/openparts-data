# 100 Ω +/-1 %, RC1210 thick film chip resistor, standard power (code 07),
# paper taping reel (R) 7" (178 mm). Not printed literally: assembled from the page-2 ordering
# information (RC | 1210 | F | R | - | 07 | 100R | L); 100 Ω is inside the
# 1 % (E24/E96) range of the RC1210 row -> existence probable. Lifecycle not
# stated -> unknown.
schema_version: "0.2"
kind: part
id: yageo/RC1210FR-07100RL
manufacturer: yageo
mpn: RC1210FR-07100RL
device: yageo/RC1210-GENERAL-PURPOSE
package: standards/CHIP1210-RC
sources: [yageo/PYU-RC_GROUP@V14]
source: yageo/PYU-RC_GROUP@V14

existence:
  status: probable
  src:
    - p2 "Ordering Information - Global Part Number, codes (1)-(7)"
    - p6 "Table 3, RC1210 row, 1% (E24/E96) 1Ω≦R≦10MΩ"
    - p7 "Table 4, RC1210 row, paper taping reel (R) 7 inch"

lifecycle: { status: unknown }

# Parameters (AI candidates, needs review): resistance and tolerance from the
# ordering-code table; power is the standard-power rating (code 07); TCR
# from the RC1210 row for this resistance value.
parameters:
  tolerance: { tol: ±1 %, src: 'p2 "ORDERING INFORMATION, (2) TOLERANCE: F = ±1.0%"' }
  resistance: { typ: 100 Ω, src: 'p2 "ORDERING INFORMATION, (6) RESISTANCE VALUE: 100R"' }
  power_rating:
    typ: 0.5 W
    at: { TA: 70 °C }
    src: 'p7 "POWER RATING, rated power at 70℃: RC1210=1/2 W (code 07)"'
  temperature_coefficient:
    tol: ±100 ppm/°C
    src: p6 "Table 3, RC1210 standard-power row, TCR 10Ω<R≦10MΩ"
