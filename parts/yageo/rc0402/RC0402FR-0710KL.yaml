    typ: 0.0625 W
    at: { TA: 70 °C }
    src: p7 "POWER RATING, RC0402 (standard power, code 07)"
  temperature_coefficient:
    tol: ±100 ppm/°C
    src: p5 "Table 2, RC0402 standard-power row, Temperature coefficient 10Ω<R≦10MΩ"
