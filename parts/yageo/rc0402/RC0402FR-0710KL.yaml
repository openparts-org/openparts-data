# 10 kOhm, 1%, general-purpose thick-film chip resistor. MPN decodes
# per the datasheet's own "Ordering Information - Global Part Number"
# scheme (page 2): RC + 0402(size) + F(+/-1% tolerance) + R(paper
# taping reel) + 07(7" reel, standard power) + 10K(resistance) + L
# (default code). Active lifecycle confirmed via multiple independent
# distributor listings (LCSC C60490, DigiKey 311-10.0KLRCT-ND, RS
# Online, JLCPCB).
schema_version: "0.1"
kind: part
id: yageo/RC0402FR-0710KL

manufacturer: yageo
mpn: RC0402FR-0710KL

device: yageo/RC0402-GENERAL-PURPOSE
package: standards/CHIP0402-RC

existence:
  status: verified

# lifecycle is `unknown`: distributor listings are not a first-party
# lifecycle source (openparts/skills/add-part section 2).
lifecycle:
  status: unknown

sources:
  - yageo/PYU-RC_GROUP@V14

# Parameters (AI candidates, needs review): resistance and tolerance from
# the ordering-code table; power is the standard-power rating (code 07);
# TCR is the Table 2 standard-power row for this resistance value.
parameters:
  resistance:
    nominal: 10
    unit: kΩ
  tolerance:
    min: -1
    max: 1
    unit: "%"
  power_rating:
    nominal: 0.0625
    unit: W
  temperature_coefficient:
    min: -100
    max: 100
    unit: ppm/°C

provenance:
  "/parameters/resistance":
    - source: yageo/PYU-RC_GROUP@V14
      page: 2
      locator: "ORDERING INFORMATION, (6) RESISTANCE VALUE: letter R/K/M is decimal point (97R6 = 97.6Ω, 9K76 = 9760Ω, 1M = 1,000,000Ω) -> 10K = 10 kΩ"
  "/parameters/tolerance":
    - source: yageo/PYU-RC_GROUP@V14
      page: 2
      locator: "ORDERING INFORMATION, (2) TOLERANCE: F = ± 1.0%"
  "/parameters/power_rating":
    - source: yageo/PYU-RC_GROUP@V14
      page: 7
      locator: "POWER RATING, each type rated power at 70℃: RC0402=1/16 W (standard power; ORDERING INFORMATION p2, (5) 07 = 7 inch dia. Reel & Standard power)"
  "/parameters/temperature_coefficient":
    - source: yageo/PYU-RC_GROUP@V14
      page: 5
      locator: "Table 2 'Electrical characteristics', RC0402 1/16 W (standard power) row, Temperature coefficient: 10Ω<R≦10MΩ: ± 100ppm°C (ORDERING INFORMATION (4) '-' = Based on spec.)"
