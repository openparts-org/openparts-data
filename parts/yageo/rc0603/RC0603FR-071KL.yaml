# 1 kOhm, +/-1%, RC0603 general-purpose thick-film chip resistor, 7" paper reel.
# MPN decoded per yageo/PYU-RC_GROUP@V14 PDF p2 'ORDERING INFORMATION': RC | 0603 | F (+/-1%) |
# R (paper taping reel) | - (TCR per spec) | 07 (7" reel, standard power) | 1K | L.
# Value is an E24 value inside the 1% (E24/E96) range of Table 2 (PDF p5);
# 7" paper reel offered for RC0603 in Table 4 (PDF p7). Lifecycle not stated
# in the datasheet -> unknown. Body = same Table 1 dimensions for every value.
schema_version: "0.1"
kind: part
id: yageo/RC0603FR-071KL

manufacturer: yageo
mpn: RC0603FR-071KL

device: yageo/RC0603-GENERAL-PURPOSE
package: standards/CHIP0603-RC

# existence is `probable`: the MPN is assembled from the part-numbering
# legend (or printed only as an example), not listed verbatim in an
# orderable list (openparts/skills/add-part section 2).
existence:
  status: probable

lifecycle:
  status: unknown

sources:
  - yageo/PYU-RC_GROUP@V14

# Parameters (AI candidates, needs review): resistance and tolerance from
# the ordering-code table; power is the standard-power rating (code 07);
# TCR is the Table 2 standard-power row for this resistance value.
parameters:
  resistance:
    nominal: 1
    unit: kΩ
  tolerance:
    min: -1
    max: 1
    unit: "%"
  power_rating:
    nominal: 0.1
    unit: W
  temperature_coefficient:
    min: -100
    max: 100
    unit: ppm/°C

provenance:
  "/existence":
    - source: yageo/PYU-RC_GROUP@V14
      page: 2
      locator: "ORDERING INFORMATION - GLOBAL PART NUMBER: RC XXXX X X X XX XXXX L; (2) F = +/-1.0%, J = +/-5.0% (for jumper ordering, use code of J); (3) R = Paper taping reel; (4) '-' = based on spec; (5) 07 = 7 inch dia. reel & standard power; (6) letter R/K/M is decimal point (97R6, 9K76, 1M); (7) L default code"
    - source: yageo/PYU-RC_GROUP@V14
      page: 5
      locator: "Table 2 RC0603 row, 1/10 W standard power: 1% (E24/E96) 1 Ohm <= R <= 10 MOhm; Jumper < 50 mOhm"
    - source: yageo/PYU-RC_GROUP@V14
      page: 7
      locator: "Table 4 'Packing style and packaging quantity': RC0402 / RC0603 paper taping reel (R) 7\" (178 mm) available"
  "/parameters/resistance":
    - source: yageo/PYU-RC_GROUP@V14
      page: 2
      locator: "ORDERING INFORMATION, (6) RESISTANCE VALUE: letter R/K/M is decimal point (97R6 = 97.6Ω, 9K76 = 9760Ω, 1M = 1,000,000Ω) -> 1K = 1 kΩ"
  "/parameters/tolerance":
    - source: yageo/PYU-RC_GROUP@V14
      page: 2
      locator: "ORDERING INFORMATION, (2) TOLERANCE: F = ± 1.0%"
  "/parameters/power_rating":
    - source: yageo/PYU-RC_GROUP@V14
      page: 7
      locator: "POWER RATING, each type rated power at 70℃: RC0603=1/10 W (standard power; ORDERING INFORMATION p2, (5) 07 = 7 inch dia. Reel & Standard power)"
  "/parameters/temperature_coefficient":
    - source: yageo/PYU-RC_GROUP@V14
      page: 5
      locator: "Table 2 'Electrical characteristics', RC0603 1/10 W (standard power) row, Temperature coefficient: 10Ω<R≦10MΩ: ± 100ppm°C (ORDERING INFORMATION (4) '-' = Based on spec.)"
