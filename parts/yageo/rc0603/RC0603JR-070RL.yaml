# 0 Ohm jumper, RC0603 general-purpose chip resistor, 7" paper reel.
# yageo/PYU-RC_GROUP@V14 PDF p2: tolerance code J is mandated for jumper ordering; value code
# uses R as decimal point, so 0 Ohm -> '0R' (the literal string '0R' is not
# printed in the datasheet -- derived from the stated rule). Jumper (<50 mOhm)
# offered for RC0603 per Table 2 (PDF p5); 7" paper reel per Table 4 (PDF p7).
schema_version: "0.2"
kind: part
id: yageo/RC0603JR-070RL
manufacturer: yageo
mpn: RC0603JR-070RL
device: yageo/RC0603-GENERAL-PURPOSE
package: standards/CHIP0603-RC
sources: [yageo/PYU-RC_GROUP@V14]
source: yageo/PYU-RC_GROUP@V14

# existence is `probable`: the MPN is assembled from the part-numbering
# legend (or printed only as an example), not listed verbatim in an
# orderable list (openparts/skills/add-part section 2).
existence:
  status: probable
  src:
    - 'p2 "ORDERING INFORMATION - GLOBAL PART NUMBER: RC XXXX X X X XX XXXX L; (2) F = +/-1.0%, J = +/-5.0% (for jumper ordering, use code of J); (3) R = Paper taping reel; (4) ''-'' = based on spec; (5) 07 = 7 inch dia. reel & standard power; (6) letter R/K/M is decimal point (97R6, 9K76, 1M); (7) L default code"'
    - 'p5 "Table 2 RC0603 row: ''Jumper<50mOhm'', rated current 1.0 A"'
    - 'p7 "Table 4 ''Packing style and packaging quantity'': RC0402 / RC0603 paper taping reel (R) 7" (178 mm) available"'

lifecycle: { status: unknown }

# Parameters (AI candidates, needs review): 0R is the jumper, so only
# the Table 2 jumper resistance limit is recorded; tolerance, power
# and TCR do not apply to a jumper (it has a rated current instead).
parameters:
  resistance:
    max: 50 mΩ
    src: 'p5 "Table 2 ''Electrical characteristics'', RC0603 1/10 W (standard power) row, Resistance range: Jumper<50mΩ (0R jumper, ordered with tolerance code J per ORDERING INFORMATION (2) on p2)"'
