# 10 Ohm +/-1%, RC0805 general-purpose thick-film chip resistor, 7" paper reel.
# MPN assembled from the yageo/PYU-RC_GROUP@V14 (V.14, 2025-11-14) PDF p2
# 'ORDERING INFORMATION' legend: RC | 0805 | F | R (paper taping reel) |
# - (TCR per spec) | 07 (7" reel, standard power) | 10R | L.
# The literal string is not printed (the only printed code is the
# ordering example RC0402JR-07100KL) -> existence probable.
# Value is an E24 value inside the 1% (E24/E96) range of Table 2 (PDF p5).
# 7" paper reel offered for RC0805 in Table 4 (PDF p7). Lifecycle not
# stated -> unknown. Package: Table 1 RC0805 row, same for every value.
schema_version: "0.2"
kind: part
id: yageo/RC0805FR-0710RL
manufacturer: yageo
mpn: RC0805FR-0710RL
device: yageo/RC0805-GENERAL-PURPOSE
package: standards/CHIP0805-RC
sources: [yageo/PYU-RC_GROUP@V14]
source: yageo/PYU-RC_GROUP@V14

existence:
  status: probable
  src:
    - 'p2 "ORDERING INFORMATION - GLOBAL PART NUMBER: RC XXXX X X X XX XXXX L; (1) size; (2) F = +/-1.0%, J = +/-5.0% (for jumper ordering, use code of J); (3) R = Paper taping reel; (4) ''-'' = Based on spec.; (5) 07 = 7 inch dia. Reel & Standard power; (6) letter R/K/M is decimal point (97R6, 9K76, 1M); (7) L default code"'
    - 'p5 "Table 2 RC0805 row, 1/8 W (standard power): 1% (E24/E96) 1 Ohm <= R <= 10 MOhm"'
    - 'p7 "Table 4 "Packing style and packaging quantity": RC0805 paper taping reel (R) 7" (178 mm): 5000"'

lifecycle: { status: unknown }

# Parameters (AI candidates, needs review): resistance and tolerance from
# the ordering-code table; power is the standard-power rating (code 07);
# TCR is the Table 2 standard-power row for this resistance value.
parameters:
  tolerance: { tol: ±1 %, src: 'p2 "ORDERING INFORMATION, (2) TOLERANCE: F = ± 1.0%"' }
  resistance:
    typ: 10 Ω
    src: 'p2 "ORDERING INFORMATION, (6) RESISTANCE VALUE: letter R/K/M is decimal point (97R6 = 97.6Ω, 9K76 = 9760Ω, 1M = 1,000,000Ω) -> 10R = 10 Ω"'
  power_rating:
    typ: 0.125 W
    src: 'p7 "POWER RATING, each type rated power at 70℃: RC0805=1/8 W (standard power; ORDERING INFORMATION p2, (5) 07 = 7 inch dia. Reel & Standard power)"'
  temperature_coefficient:
    tol: ±200 ppm/°C
    src: 'p5 "Table 2 ''Electrical characteristics'', RC0805 1/8 W (standard power) row, Temperature coefficient: 1Ω≦R≦10Ω: ± 200ppm°C (ORDERING INFORMATION (4) ''-'' = Based on spec.)"'
