      page: 7
      locator: "POWER RATING, each type rated power at 70℃: RC1206=1/4 W (standard power; ORDERING INFORMATION p2, (5) 07 = 7 inch dia. Reel & Standard power)"
  "/parameters/temperature_coefficient":
