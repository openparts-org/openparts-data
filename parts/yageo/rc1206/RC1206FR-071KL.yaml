      page: 6
      locator: "Table 2 (continued, headed 'Table 3' on this page) 'Electrical characteristics', RC1206 1/4 W (standard power) row, Temperature coefficient: 10Ω<R≦10MΩ: ± 100ppm°C (ORDERING INFORMATION (4) '-' = Based on spec.)"
