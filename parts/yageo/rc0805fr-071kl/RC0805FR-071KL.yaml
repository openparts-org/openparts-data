# 1 kOhm, +/-1%, 0805 general-purpose thick-film chip resistor. MPN
# decodes per the RC_L datasheet's own Ordering Information scheme
# (page 2): RC + 0805(size) + F(+/-1%) + R(paper taping) + 07(7" reel)
# + 1K(resistance, K = decimal point) + L. Reuses the same yageo
# datasheet as RC0402/RC1206. Not cross-checked against a distributor
# listing for this exact MPN, per the research report.
schema_version: "0.2"
kind: part
id: yageo/RC0805FR-071KL
manufacturer: yageo
mpn: RC0805FR-071KL
device: yageo/RC0805-GENERAL-PURPOSE
package: standards/CHIP0805-RC
sources: [yageo/PYU-RC_GROUP@V14]
source: yageo/PYU-RC_GROUP@V14

existence: { status: probable }

# lifecycle is `unknown`: distributor listings are not a first-party
# lifecycle source (openparts/skills/add-part section 2).
lifecycle: { status: unknown }

# Parameters (AI candidates, needs review): resistance and tolerance from
# the ordering-code table; power is the standard-power rating (code 07);
# TCR is the Table 2 standard-power row for this resistance value.
parameters:
  tolerance: { tol: ±1 %, src: 'p2 "ORDERING INFORMATION, (2) TOLERANCE: F = ± 1.0%"' }
  resistance:
    typ: 1 kΩ
    src: 'p2 "ORDERING INFORMATION, (6) RESISTANCE VALUE: letter R/K/M is decimal point (97R6 = 97.6Ω, 9K76 = 9760Ω, 1M = 1,000,000Ω) -> 1K = 1 kΩ"'
  power_rating:
    typ: 0.125 W
    src: 'p7 "POWER RATING, each type rated power at 70℃: RC0805=1/8 W (standard power; ORDERING INFORMATION p2, (5) 07 = 7 inch dia. Reel & Standard power)"'
  temperature_coefficient:
    tol: ±100 ppm/°C
    src: 'p5 "Table 2 ''Electrical characteristics'', RC0805 1/8 W (standard power) row, Temperature coefficient: 10Ω<R≦10MΩ: ± 100ppm°C (ORDERING INFORMATION (4) ''-'' = Based on spec.)"'
