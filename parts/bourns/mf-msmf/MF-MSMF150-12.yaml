# MF-MSMF PTC resettable fuse, Vmax 12 V, Ihold 1.50 A. The model
# MF-MSMF150/12 is printed verbatim in the Electrical Characteristics table of
# bourns/MF-MSMF@revBE (page 2) -> existence verified. Lifecycle unknown: the
# datasheet says some models are not recommended for new designs without
# marking which ones in the text layer.
schema_version: "0.2"
kind: part
id: bourns/MF-MSMF150-12
manufacturer: bourns
mpn: MF-MSMF150/12
device: bourns/MF-MSMF-SERIES
package: standards/CHIP1812-MF-MSMF050
sources: [bourns/MF-MSMF@revBE]
source: bourns/MF-MSMF@revBE

existence: { status: verified, src: 'p2 "Electrical Characteristics, MF-MSMF150/12 row"' }
lifecycle: { status: unknown }

# Parameters (AI candidates, needs review): PTC resettable fuse:
# the datasheet's hold current Ihold is hold_current and its maximum
# voltage Vmax max_voltage (the PPTC keys, Canonical Data 11.1).
parameters:
  hold_current:
    typ: 1.5 A
    at: { TA: 23 °C }
    src: p2 "Electrical Characteristics, MF-MSMF150/12 row, Ihold at 23 °C"
  max_voltage: { max: 12 V, src: 'p2 "Electrical Characteristics, MF-MSMF150/12 row, Vmax"' }
