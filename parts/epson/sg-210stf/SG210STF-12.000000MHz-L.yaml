# Epson SG210STF 12.000000MHz L: SG-210STF CMOS oscillator with standby, 12 MHz (a
# p1 standard frequency), T (1.8 V to 3.3 V typ.), L (+-50 ppm / -40 ~
# +85 C). Product name written as the p1 "[Model : SG-210STF]" legend
# example "SG210STF 25.000000MHz L" prints it (no hyphen, spaces). The id
# replaces the spaces with "-". existence: probable -- assembled from the
# legend. Supply current: the 3.3 V +-10 % column, 1.2 MHz ≤ fo ≤ 20 MHz row.
# lifecycle unknown.
schema_version: "0.2"
kind: part
id: epson/SG210STF-12.000000MHz-L
manufacturer: epson
mpn: SG210STF 12.000000MHz L
device: epson/SG-210STF
package: manufacturers/epson/LGA4-2.5x2.0-SG-210STF
sources: [epson/SG-CAN-STF-BRIEF]
source: epson/SG-CAN-STF-BRIEF

existence:
  status: probable
  src: 'p1 "[Model : SG-210STF] product name legend, example SG210STF 25.000000MHz L"'

lifecycle: { status: unknown }

# Parameters (AI candidates, needs review).
parameters:
  frequency:
    typ: 12 MHz
    src: p1 "Specifications, Output frequency fo, standard frequency 12 MHz"
  frequency_stability:
    tol: ±50 ppm
    at: { TA: -40..85 °C }
    src: 'p1 "SG-210STF legend e: L ±50 × 10-6 / -40 °C to +85 °C (f_tol)"'
  supply_voltage:
    min: 1.6 V
    max: 3.63 V
    src: p1 "Specifications, Supply voltage range VCC, 1.2 MHz ≤ fo ≤ 60 MHz"
  supply_current:
    max: 1.8 mA
    at: { VCC: 3.3 V }
    src: p1 "Specifications, Current consumption ICC, VCC = 3.3 V ± 10 %, 1.2 MHz ≤ fo ≤ 20 MHz, no load"
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p1 "SG-210STF legend e: L, -40 °C to +85 °C"'
