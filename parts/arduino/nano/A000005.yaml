# Arduino Nano (A000005). Package = the board with its header holes; assembly = the
# components on it whose placement comes from the maker's design file (arduino/A000005-cad-files@V3.3),
# converted to the package frame (board centre, top view; see the package comment).
# Listed: components with an OpenParts part -- where the real component has no fetchable datasheet
# or no stated MPN, an equivalent part of the same footprint type and size (`stand_in_for` names the
# real one) -- or a box whose size AND height a source states. Left out:
#   IC1 FT232RL (FTDI: 403 to plain fetches; SSOP28, no same-package stand-in), SW1 IT-1185AP1C (no
#   switch of that footprint), Y1 CSTCE16M0V53-R0 resonator (Murata spec not served as a plain PDF),
#   D1 SS1P3L (no SMP-package part), C2/C5 TAJA475 tantalum: no part; small passives (0603 C, CAY16
#   arrays, F1) skipped
# IC2: value/PART_NUMBER "LM1117IMPX-5.0" (the /NOPB ordering suffix is not in the design; TI
# orders it only as /NOPB); bottom side; pads 1 COM, 2 +5V, 3 VIN, 4 +5V (tab) = the device pins
# 1-4.
schema_version: "0.2"
kind: part
id: arduino/A000005
manufacturer: arduino
mpn: A000005
device: arduino/NANO
package: standards/MODULE30-18x43-P2.54-ARDUINO-NANO
sources: [arduino/A000005-datasheet@rev5, arduino/A000005-cad-files@V3.3]
source: arduino/A000005-cad-files@V3.3

existence: { status: verified, src: 'arduino/A000005-datasheet@rev5 p1 "SKU: A000005"' }
lifecycle: { status: unknown }

