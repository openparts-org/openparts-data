# Arduino Nano (A000005). Package = the board with its header holes; assembly = the
# components on it whose placement comes from the maker's design file (arduino/A000005-cad-files@V3.3),
# converted to the package frame (board centre, top view; see the package comment).
# Only components with an OpenParts part, or a box whose size AND height a source states,
# are listed. Left out:
#   IC1 FT232RL (FTDI, SSOP28), IC2 LM1117IMPX-5.0 (TI, SOT-223), J3 USB mini-B, SW1
#   IT-1185AP1C, Y1 CSTCE16M0V53-R0, LEDs KPT-2012*, D1 SS1P3L, C2/C5 TAJA475 tantalum, J4 ICSP:
#   no part and no body height in a fetchable maker source or the design file; small passives
#   (0603 C, CAY16 arrays, F1) skipped
