# Arduino Nano (A000005). Package = the board with its header holes; assembly = the
# components on it whose placement comes from the maker's design file (arduino/A000005-cad-files@V3.3),
# converted to the package frame (board centre, top view; see the package comment).
# Only components with an OpenParts part, or a box whose size AND height a source states,
# are listed. Left out:
#   IC1 FT232RL (FTDI datasheet: 403 to plain fetches), J3 USB mini-B ("14850", maker not
#   named), SW1 IT-1185AP1C, Y1 CSTCE16M0V53-R0 (Murata spec not served as a plain PDF), LEDs
#   KPT-2012* (Kingbright spec URLs 404), D1 SS1P3L, C2/C5 TAJA475 tantalum, J4 ICSP, J1/J2
#   headers: no part and no body height in a fetchable maker source or the design file; small
#   passives (0603 C, CAY16 arrays, F1) skipped
# IC2: value/PART_NUMBER "LM1117IMPX-5.0" (the /NOPB ordering suffix is not in the design; TI
# orders it only as /NOPB); bottom side; pads 1 COM, 2 +5V, 3 VIN, 4 +5V (tab) = the device pins
# 1-4.
schema_version: "0.2"
kind: part
id: arduino/A000005
manufacturer: arduino
mpn: A000005
device: arduino/NANO
package: standards/MODULE30-18x43-P2.54-ARDUINO-NANO
sources: [arduino/A000005-datasheet@rev5, arduino/A000005-cad-files@V3.3]
source: arduino/A000005-cad-files@V3.3

existence: { status: verified, src: 'arduino/A000005-datasheet@rev5 p1 "SKU: A000005"' }
lifecycle: { status: unknown }

assembly:
  - ref: IC3
    part: microchip/ATmega328P-MUR
    x: -0.051
    y: 6.096
    rotation: 135
    src: '"NanoV3.3.brd IC3 at 15.494, 8.839 rot 225"'
  - ref: IC2
    part: ti/LM1117IMPX-5.0/NOPB
    x: -2.413
    y: -11.557
    rotation: 90
    side: bottom
    src: '"NanoV3.3.brd IC2 at 33.147, 6.477 rot 270"'
