# or no stated MPN, an equivalent part of the same footprint type and size (`stand_in_for` names the
# real one) -- or a box whose size AND height a source states. Left out:
#   JANALOG/JDIGITAL 20TW-995/994 (14-/18-way sockets; Wurth refuses plain fetches now, Samtec SSW
#   prints give no PCB hole) and J2 HPH2-A-10-SGA 1.27 mm 2x5 header (no part), D4 PRTR5V0U2X, Y1
#   (footprint only, not in the BOM): no part; passives skipped. Header holes from the NC drill file
#   PCB-RoundHoles.TXT (0.85 mm, plated); pin names from the datasheet tables 10.1/10.2
