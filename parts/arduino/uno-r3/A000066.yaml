# Arduino UNO R3 (A000066). Package = the board with its header holes; assembly = the
# components on it whose placement comes from the maker's design file (arduino/A000066-cad-files@Rev3e),
# converted to the package frame (board centre, top view; see the package comment).
# Only components with an OpenParts part, or a box whose size AND height a source states,
# are listed. Left out:
#   U3 ATMEGA16U2-MU(R) (no OpenParts part yet), U2 LP2985-33DBVR, T1 FDN340P (pin-1 orientation
#   of the Eagle SOT-23 not verified), X1 DC jack, X2 USB-B, RESET TS42031, Y1/Y2
#   crystal/resonator, PC1/PC2 47u caps, D1 M7, D2/D3, LEDs, ICSP/ICSP1 headers: no body height
#   in a source; small passives skipped
# ZU4: fitted in a DIP-28 socket on the board; the socket is not modelled.
