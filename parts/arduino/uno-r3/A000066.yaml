# Arduino UNO R3 (A000066). Package = the board with its header holes; assembly = the
# components on it whose placement comes from the maker's design file (arduino/A000066-cad-files@Rev3e),
# converted to the package frame (board centre, top view; see the package comment).
# Only components with an OpenParts part, or a box whose size AND height a source states,
# are listed. Left out:
#   X1 DC jack, X2 USB-B (PN61729), RESET TS42031-160R-TR-7260, Y1 16 MHz crystal (no MPN), Y2
#   CSTCE16M0V53-R0 (Murata spec not served as a plain PDF), PC1/PC2 47u caps, D1 M7, D2/D3
#   CD1206-S01575 (Bourns: 403), LEDs, ICSP/ICSP1 headers, and the DIP-28 socket under ZU4: no
#   body height in a fetchable maker source or the design file; small passives skipped
# ZU4: fitted in a DIP-28 socket on the board; the socket (no MPN or height in the design) is not
# modelled.
# T1: Eagle pads 1/2/3 = nets USBVCC/+5V/GATE_CMD = drain/source/gate, i.e. FDN340P pins 3/2/1;
# rotation from that pad map.
# U3: value "ATMEGA16U2-MU(R)" (-MU or its tape-and-reel -MUR; same chip and package).
