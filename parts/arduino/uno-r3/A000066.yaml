# Arduino UNO R3 (A000066). Package = the board with its header holes; assembly = the
# components on it whose placement comes from the maker's design file (arduino/A000066-cad-files@Rev3e),
# converted to the package frame (board centre, top view; see the package comment).
# Listed: components with an OpenParts part -- where the real component has no fetchable datasheet
# or no stated MPN, an equivalent part of the same footprint type and size (`stand_in_for` names the
# real one) -- or a box whose size AND height a source states. Left out:
#   Y1 16 MHz crystal (no MPN, "QS" footprint), Y2 CSTCE16M0V53-R0 (Murata spec not served as a
#   plain PDF), PC1/PC2 47u caps, the DIP-28 socket under ZU4: no part or no body height; IOH
#   (10-way socket) stays a box: Wurth refuses plain fetches now and Samtec prints give no PCB hole
#   for SSW sockets; small passives skipped
# ZU4: fitted in a DIP-28 socket on the board; the socket (no MPN or height in the design) is not
# modelled.
# T1: Eagle pads 1/2/3 = nets USBVCC/+5V/GATE_CMD = drain/source/gate, i.e. FDN340P pins 3/2/1;
# rotation from that pad map.
# U3: value "ATMEGA16U2-MU(R)" (-MU or its tape-and-reel -MUR; same chip and package).
