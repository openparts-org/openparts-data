# Arduino Nano ESP32 (ABX00083). Package = the board with its header holes; assembly = the
# components on it whose placement comes from the maker's design file (arduino/ABX00083-cad-files@2025-12-23),
# converted to the package frame (board centre, top view; see the package comment).
# Only components with an OpenParts part, or a box whose size AND height a source states,
# are listed. Left out:
#   J1 CX90B-16P USB-C (Hirose: refuses plain fetches), PB1 PTS820 (C&K: 403), D2 PMEG6020AELRX
#   and D1 SOT143B TVS (datasheet lists "D3 PRTR5V0U2X"; Nexperia: 403), L3 MAKK2016T3R3M, Y1
#   32.768 kHz, Q1: no body height in a fetchable maker source or the design file; passives
#   skipped. Header holes: the inner plated 1.016 mm holes of JP1/JP2 (Pads6 binary of
#   PCB.PcbDoc); the castellated edge half-holes are not pads here
# M1: box centred on the M1 lands, 14.3 mm along their 12.9 mm extent and 10.4 mm along the 8.8 mm
# one (datasheet p27 Figure 5); the module origin in the design is 0.95 mm off the land centre.
