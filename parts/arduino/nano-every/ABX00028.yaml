# Arduino Nano Every (ABX00028). Package = the board with its header holes; assembly = the
# components on it whose placement comes from the maker's design file (arduino/ABX00028-cad-files@V4.0),
# converted to the package frame (board centre, top view; see the package comment).
# Listed: components with an OpenParts part -- where the real component has no fetchable datasheet
# or no stated MPN, an equivalent part of the same footprint type and size (`stand_in_for` names the
# real one) -- or a box whose size AND height a source states. Left out:
#   IC1 MPM3610 (MPS), U3 ATSAMD11D14A-MUT, Q1/Q2 BSS138PS, D1 PRTR5V0U2X: no OpenParts part;
#   passives skipped. DL1-DL4, D2, J1 and PB1 stand-ins sit on the .mnt centroids and angles (the
#   mount file has no pads)
# U1: BOM orders ATMEGA4809-AFR (the tape-and-reel code of ATmega4809-AF).
