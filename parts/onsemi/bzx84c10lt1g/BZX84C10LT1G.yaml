# BZX84C10LT1G: zener, VZ1 9.4 / 10 / 10.6 V (min/nom/max @ 5 mA), marking Z9, SOT-23.
# The ORDERING INFORMATION table (page 1) gives only the pattern
# "BZX84CxxxLT1G | SOT-23 (Pb-Free) | 3,000 / Tape & Reel"; the full
# string BZX84C10LT1G is printed verbatim in the "Device*" column of the
# page-3 Electrical Characteristics table, which is not an ordering
# table -- so existence is "probable" (flagged for review). No
# lifecycle statement.
# Package: the datasheet's SOT-23 CASE 318 ISSUE AU outline (98ASB42226B,
# DATE 14 AUG 2024, page 7) renders pixel-identical (100 dpi crop of the
# drawing and table, same md5) to the page standards/SOT23-2.90x1.30-P1.90
# was read from (2N7002E/D Rev. 8 page 6, re-downloaded 2026-11-10); every
# table row was also re-read from a 150 dpi render. Reused; the package
# cites onsemi/2N7002E-D.
schema_version: "0.2"
kind: part
id: onsemi/BZX84C10LT1G
manufacturer: onsemi
mpn: BZX84C10LT1G
device: onsemi/BZX84C-SERIES
package: standards/SOT23-2.90x1.30-P1.90
sources: [onsemi/BZX84C2V4LT1-D]
source: onsemi/BZX84C2V4LT1-D

existence:
  status: probable
  src:
    - p1 "ORDERING INFORMATION table pattern row "BZX84CxxxLT1G | SOT-23 (Pb-Free) | 3,000 / Tape & Reel""
    - 'p3 "Electrical Characteristics table, Device* column: "BZX84C10LT1G", marking "Z9", VZ1 9.4 / 10 / 10.6 V"'

lifecycle: { status: unknown }

parameters:
  forward_voltage:
    max: 0.9 V
    at: { IF: 10 mA }
    src: p3 "ELECTRICAL CHARACTERISTICS - BZX84CxxxLT1 SERIES, table header VF"
  zener_voltage:
    min: 9.4 V
    typ: 10 V
    max: 10.6 V
    src: p3 "ELECTRICAL CHARACTERISTICS - BZX84CxxxLT1 SERIES, BZX84C10LT1G row, VZ1 (Note 3)"
  zener_test_current:
    typ: 5 mA
    src: p3 "ELECTRICAL CHARACTERISTICS - BZX84CxxxLT1 SERIES, BZX84C10LT1G row, IZT1 (VZ1 header)"
