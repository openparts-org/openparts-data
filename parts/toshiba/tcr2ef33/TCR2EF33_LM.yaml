# (example)" on Toshiba's TCR2EF33 product page; the page says listed
# numbers are representative, and the datasheet has no ordering table
# -> existence `probable`. Lifecycle `unknown` (not stated).
schema_version: "0.2"
kind: part
id: toshiba/TCR2EF33,LM
manufacturer: toshiba
mpn: TCR2EF33,LM
device: toshiba/TCR2EF
package: { value: manufacturers/toshiba/SMV, src: 'p15 "Package Dimensions, SMV (SOT-25)(SC-74A)"' }
sources: [toshiba/TCR2EF-datasheet-en, toshiba/TCR2EF33-product-page]
source: toshiba/TCR2EF-datasheet-en

existence:
  status: probable
  src: toshiba/TCR2EF33-product-page p1 "Orderable part number (example), TCR2EF33,LM"

lifecycle: { status: unknown }

parameters:
  output_voltage: { typ: 3.3 V, src: 'p4 "List of Products Number, TCR2EF33 row, VOUT (typ.)"' }
  dropout_voltage:
    typ: 150 mV
    max: 200 mV
    at: { IOUT: 150 mA }
    src: p5 "Dropout voltage table, row 3.0 V <= VOUT <= 5.0 V"
