# TLP291, CTR rank GB. The order code "TLP291(GB,E" is the datasheet's
# own ordering example (page 2, Note 1 of the CTR rank table: "Specify
# both the part number and a rank in this format when ordering (e.g.)
# rank GB: TLP291 (GB,E"). That is an ordering format, not an ordering
# table of available codes, and Toshiba's TLP291 product page shows no
# orderable-part list in its static HTML -- so existence is `probable`.
# Lifecycle is `unknown` (not stated in either source).
schema_version: "0.2"
kind: part
id: toshiba/TLP291(GB,E
manufacturer: toshiba
mpn: TLP291(GB,E
device: toshiba/TLP291

package:
  value: manufacturers/toshiba/11-3C1
  src: p1 ""TLP291 is housed in the SO4 package"; outline drawing TOSHIBA 11-3C1"

sources: [toshiba/TLP291-datasheet-en]
source: toshiba/TLP291-datasheet-en

existence: { status: probable, src: 'p2 "CTR rank table, Note 1: "(e.g.) rank GB: TLP291 (GB,E""' }
lifecycle: { status: unknown }

parameters:
  current_transfer_ratio:
    min: 100 %
    max: 400 %
    at: { VCE: 5 V, IF: 5 mA, TA: 25 °C }
    src: 'p2 "Current Transfer Ratio (CTR) Rank table, TLP291 Rank GB row: Min 100 %, Max 400 %; Note1 maps the order code: "(e.g.) rank GB: TLP291 (GB,E""'
