# TCR2EF15: 1.5 V output of the TCR2EF series. Order code "TCR2EF15,LM" is listed under "Orderable part number
# (example)" on Toshiba's TCR2EF15 product page; the page says listed
# numbers are representative, and the datasheet has no ordering table
# -> existence `probable`. Lifecycle `unknown` (not stated).
schema_version: "0.2"
kind: part
id: toshiba/TCR2EF15,LM
manufacturer: toshiba
mpn: TCR2EF15,LM
device: toshiba/TCR2EF
package: { value: manufacturers/toshiba/SMV, src: 'p15 "Package Dimensions, SMV (SOT-25)(SC-74A)"' }
sources: [toshiba/TCR2EF-datasheet-en, toshiba/TCR2EF15-product-page]
source: toshiba/TCR2EF-datasheet-en

existence:
  status: probable
  src: toshiba/TCR2EF15-product-page p1 "Orderable part number (example), TCR2EF15,LM"

lifecycle: { status: unknown }

parameters:
  output_voltage: { typ: 1.5 V, src: 'p4 "List of Products Number, TCR2EF15 row, VOUT (typ.)"' }
  dropout_voltage:
    typ: 290 mV
    max: 390 mV
    at: { IOUT: 150 mA }
    src: p5 "Dropout voltage table, row 1.5 V <= VOUT < 1.8 V"
