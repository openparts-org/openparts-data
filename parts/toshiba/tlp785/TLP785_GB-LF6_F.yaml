# TLP785, CTR rank GB, LF6 surface-mount lead form (drawing 11-5L106,
# datasheet page 4). The order code "TLP785(GB-LF6,F" is listed under
# "Orderable part number (example)" on Toshiba's TLP785 product page
# (toshiba.semicon-storage.com/ap-en/.../detail.TLP785.html), and the
# datasheet's rank table (page 2) defines Rank GB. That page states the
# listed numbers are "representative part numbers only, which may not
# be available for sale in the precise form shown", and the datasheet
# has no ordering table of complete order codes (page 7 only gives the
# format, e.g. "TLP785(BL-TP6,F") -- so existence is `probable`, not
# `verified`. Lifecycle is `unknown` (neither source states one).
#
# The plain through-hole DIP4 form (11-5L1, page 1) is not added: no
# first-party source lists a complete order code for it.
schema_version: "0.2"
kind: part
id: toshiba/TLP785(GB-LF6,F
manufacturer: toshiba
mpn: TLP785(GB-LF6,F
device: toshiba/TLP785

package:
  value: manufacturers/toshiba/11-5L106
  src: p4 ""Surface-Mount Lead Form Option", drawing "TLP785(LF6)" 11-5L106"

sources: [toshiba/TLP785-datasheet-en]
source: toshiba/TLP785-datasheet-en

# the exact code TLP785(GB-LF6,F is from the product page's orderable part number list, not from this document
existence: { status: probable, src: 'p7 "Section 6 Ordering Information, order-code format"' }
lifecycle: { status: unknown }

parameters:
  current_transfer_ratio:
    - min: 100 %
      max: 600 %
      at: { VCE: 5 V, IF: 5 mA, TA: 25 °C }
      src: p2 "Current Transfer Ratio table, TLP785 Rank GB row (Note 1; p5 Product Naming)"
    - min: 30 %
      at: { VCE: 0.4 V, IF: 1 mA, TA: 25 °C }
      src: p3 "Coupled Electrical Characteristics, Saturated CTR, Rank GB"
