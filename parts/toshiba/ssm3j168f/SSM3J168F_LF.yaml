# Order code "SSM3J168F,LF" is listed under "Orderable part number (example)"
# on Toshiba's SSM3J168F product page; the page says listed numbers are
# representative, and the datasheet has no ordering table -> existence
# `probable`. Lifecycle `unknown` (not stated).
schema_version: "0.2"
kind: part
id: toshiba/SSM3J168F,LF
manufacturer: toshiba
mpn: SSM3J168F,LF
device: toshiba/SSM3J168F
package: { value: manufacturers/toshiba/S-Mini, src: 'p7 "Package Dimensions, Nickname: S-Mini"' }
sources: [toshiba/SSM3J168F-datasheet-en, toshiba/SSM3J168F-product-page]
source: toshiba/SSM3J168F-datasheet-en

existence:
  status: probable
  src: toshiba/SSM3J168F-product-page p1 "Orderable part number (example), SSM3J168F,LF"

lifecycle: { status: unknown }

parameters:
  polarity:             { value: p_channel, src: 'p1 "Title, Silicon P-Channel MOS""' }
  drain_source_voltage: { max: -60 V, src: 'p2 "4. Absolute Maximum Ratings, VDSS"' }
  drain_current: { max: -400 mA, src: 'p2 "4. Absolute Maximum Ratings, Drain current DC ID"' }
  rds_on:
    - typ: 1.6 Ω
      max: 2 Ω
      at: { VGS: -4 V, ID: -100 mA }
      src: p2 "5.1 Static Characteristics, RDS(ON), ID = -100mA / VGS = -4V row"
    - typ: 1.4 Ω
      max: 1.9 Ω
      at: { VGS: -4.5 V, ID: -100 mA }
      src: p2 "5.1 Static Characteristics, RDS(ON), ID = -100mA / VGS = -4.5V row"
    - typ: 1.3 Ω
      max: 1.55 Ω
      at: { VGS: -10 V, ID: -200 mA }
      src: p2 "5.1 Static Characteristics, RDS(ON), ID = -200mA / VGS = -10V row"
  gate_threshold_voltage:
    min: -2 V
    max: -0.8 V
    at: { VDS: -10 V, ID: -1 mA }
    src: p2 "5.1 Static Characteristics, Vth (printed Min -0.8 / Max -2.0)"
