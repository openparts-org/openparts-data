  src: p1 "4. Packaging and Pin Assignment, TOSHIBA 11-3C1"

sources: [toshiba/TLP293-datasheet-en]
source: toshiba/TLP293-datasheet-en

existence:
  status: probable
  src: p13 "16. Ordering Information, order-code format (part number, CTR rank, tape type TPL)"

