# TLP293 in SO4 (TOSHIBA 11-3C1, named on datasheet page 1; the outline
# file was read from the TLP291 datasheet). The order code is listed under
# the orderable part numbers on Toshiba's TLP293 product page
# (toshiba.semicon-storage.com/ap-en/semiconductor/product/isolators-solid-state-relays/detail.TLP293.html,
# retrieved 2026-11-17); the datasheet gives only the order-code format
# (section 16 "Ordering Information", example "TLP293(GR-TPL,E"), so
# existence is `probable` (as toshiba/TLP785(GB-LF6,F).
