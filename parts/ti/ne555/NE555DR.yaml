# MPN from the SLFS022K package option addendum (PDF page 21):
# "NE555DR Active Production SOIC (D) | 8 2500 | LARGE T&R ... 0 to 70".
# lifecycle "Active" is TI's own status column in that same table.
# Package: TI D0008A (SOIC, 4214825/C) references JEDEC MS-012
# variation AA and gives ranges only (no nominals), which the soic
# generator cannot draw without inventing a nominal. It therefore uses
# standards/SOIC8-3.90x4.90-P1.27 (Microchip C04-057-SN): its basic
# values E1 3.90 / D 4.90 / E 6.00 / e 1.27 lie inside D0008A E1
# 3.81-3.98 / D 4.81-5.00 / E 5.80-6.19 / e 1.27, and b 0.31-0.51 and
# A max 1.75 are identical. Flagged for reviewer: cross-vendor reuse
# justified by the same JEDEC outline, not identical tolerance tables
# (TI L 0.41-1.27 / c 0.11-0.25 vs Microchip L 0.40-1.27 / c 0.17-0.25).
# (D0008A outline in this datasheet: PDF page 30.)
