# SS16-E3/61T: printed verbatim in the ordering *example* table. The
# table is titled "ORDERING INFORMATION (Example)", so existence is
# "probable" (add-part section 2). No lifecycle statement in the
# document.
# Package: page-4 SMA (DO-214AC) outline is identical, row for row
# (pdftotext -layout diff), to Vishay 88711 page 3, so
# standards/DO214AC-VISHAY-88711 is reused.
schema_version: "0.2"
kind: part
id: vishay/SS16-E3-61T
manufacturer: vishay
mpn: SS16-E3/61T
device: vishay/SS12-SERIES

package:
  value: standards/DO214AC-VISHAY-88711
  src: p4 "PACKAGE OUTLINE DIMENSIONS -- see header"

sources: [vishay/88746]
source: vishay/88746

existence:
  status: probable
  src:
    - 'p2 "ORDERING INFORMATION (Example): "SS16-E3/61T | 0.064 | 61T | 1800 | 7" diameter plastic tape and reel""'
    - 'p1 "MAXIMUM RATINGS table column "SS16"; MECHANICAL DATA: "Base P/N-E3 - RoHS-compliant, commercial grade""'

lifecycle: { status: unknown }

parameters:
  forward_voltage:
    max: 0.75 V
    src: 'p2 "ELECTRICAL CHARACTERISTICS, Maximum instantaneous forward voltage, 1.0 A, VF: 0.75 V (cell spanning SS15-SS16)"'
  reverse_voltage:
    max: 60 V
    src: 'p1 "MAXIMUM RATINGS, Maximum repetitive peak reverse voltage VRRM, SS16 column: 60 V"'
  forward_current:
    max: 1 A
    src: 'p1 "MAXIMUM RATINGS, Maximum average forward rectified current at TL (fig. 1) IF(AV): 1.0 A"'
