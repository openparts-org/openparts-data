# SS16-E3/5AT: printed verbatim in the ordering *example* table. The
# table is titled "ORDERING INFORMATION (Example)", so existence is
# "probable" (add-part section 2). No lifecycle statement in the
# document.
# Package: page-4 SMA (DO-214AC) outline is identical, row for row
# (pdftotext -layout diff), to Vishay 88711 page 3, so
# standards/DO214AC-VISHAY-88711 is reused.
schema_version: "0.2"
kind: part
id: vishay/SS16-E3-5AT
manufacturer: vishay
mpn: SS16-E3/5AT
device: vishay/SS12-SERIES

package:
  value: standards/DO214AC-VISHAY-88711
  src: p4 "PACKAGE OUTLINE DIMENSIONS -- see header"

sources: [vishay/88746]
source: vishay/88746

existence:
  status: probable
  src:
    - 'p2 "ORDERING INFORMATION (Example): "SS16-E3/5AT | 0.064 | 5AT | 7500 | 13" diameter plastic tape and reel""'
    - 'p1 "MAXIMUM RATINGS table column "SS16"; MECHANICAL DATA: "Base P/N-E3 - RoHS-compliant, commercial grade""'

lifecycle: { status: unknown }

parameters:
  forward_voltage:
    max: 0.75 V
    at: { IF: 1 A }
    src: p2 "ELECTRICAL CHARACTERISTICS, Max. instantaneous forward voltage VF (cell spanning SS15-SS16)"
  reverse_voltage: { max: 60 V, src: 'p1 "MAXIMUM RATINGS, VRRM, SS16 column"' }
  forward_current:
    max: 1 A
    src: p1 "MAXIMUM RATINGS, Max. average forward rectified current IF(AV) at TL (fig. 1)"
