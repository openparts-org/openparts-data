# Imax 2.0 A) is listed for D11/CRCW0603 e3 on PDF p2. Lifecycle -> unknown.
schema_version: "0.2"
kind: part
id: vishay/CRCW06030000Z0EA
manufacturer: vishay
mpn: CRCW06030000Z0EA
device: vishay/CRCW0603-GENERAL-PURPOSE
package: standards/CHIP0603-CRCW
sources: [vishay/20035]
source: vishay/20035

# existence is `probable`: the MPN is assembled from the part-numbering
