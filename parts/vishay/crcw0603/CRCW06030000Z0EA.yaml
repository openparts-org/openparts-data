  status: probable
  src:
    - p3 "Part Number and Product Description, example CRCW06030000Z0EA"
    - 'p2 "''TEMPERATURE COEFFICIENT AND RESISTANCE RANGE'': D11/CRCW0603 e3 Jumper, Imax. = 2.0 A, <= 20 mOhm, 0 Ohm"'
