# 100 kOhm, +/-1%, +/-100 ppm/K, CRCW0402 thick-film chip resistor.
# MPN decoded per vishay/20035 PDF p3 'PART NUMBER AND PRODUCT DESCRIPTION':
# CRCW | 0402 | 100K | F (+/-1%) | K (+/-100 ppm/K) | ED (7" reel, 10 000 pcs).
# Value is E24 inside the 1 Ohm - 10 MOhm +/-1% E24;E96 range (PDF p2).
# Lifecycle not stated in the datasheet -> unknown.
schema_version: "0.2"
kind: part
id: vishay/CRCW0402100KFKED
manufacturer: vishay
mpn: CRCW0402100KFKED
device: vishay/CRCW0402-GENERAL-PURPOSE
package: standards/CHIP0402-CRCW
sources: [vishay/20035]
source: vishay/20035

# existence is `probable`: the MPN is assembled from the part-numbering
# legend (or printed only as an example), not listed verbatim in an
# orderable list (openparts/skills/add-part section 2).
existence:
  status: probable
  src:
    - 'p3 "''PART NUMBER AND PRODUCT DESCRIPTION'': CRCW0603562RFKEA / CRCW06030000Z0EA; RESISTANCE R = decimal, K = thousand, M = million, 0000 = jumper; TOLERANCE F = +/-1%, Z = jumper; TCR K = +/-100 ppm/K, 0 = jumper"'
    - 'p2 "''TEMPERATURE COEFFICIENT AND RESISTANCE RANGE'': D11/CRCW0603 e3 and D10/CRCW0402 e3: +/-100 ppm/K, +/-1%, 1 Ohm to 10 MOhm, E24; E96; Jumper <= 20 mOhm, 0 Ohm"'
    - 'p3 "''PACKAGING'' table: D11/CRCW0603 e3 EA = ET1 5000 pcs 7" paper tape; D10/CRCW0402 e3 ED = ET7 10 000 pcs 7""'

lifecycle: { status: unknown }

# Parameters (AI candidates, needs review): resistance, tolerance and TCR from
# the PART NUMBER AND PRODUCT DESCRIPTION legend. power_rating left out:
# the rated dissipation P70 depends on the operation mode (standard /
# extended, p2), which the part number does not fix.
parameters:
  tolerance: { tol: ±1 %, src: 'p3 "PART NUMBER AND PRODUCT DESCRIPTION, TOLERANCE: F = ±1 %"' }
  resistance: { typ: 100 kΩ, src: 'p3 "PART NUMBER AND PRODUCT DESCRIPTION, RESISTANCE: 100K"' }
  temperature_coefficient:
    tol: ±100 ppm/K
    src: 'p3 "PART NUMBER AND PRODUCT DESCRIPTION, TCR: K = ±100 ppm/K"'
