# 1 kOhm, +/-1%, +/-100 ppm/K, CRCW0402 thick-film chip resistor.
# MPN decoded per vishay/20035 PDF p3 'PART NUMBER AND PRODUCT DESCRIPTION':
# CRCW | 0402 | 1K00 | F (+/-1%) | K (+/-100 ppm/K) | ED (7" reel, 10 000 pcs).
# Value is E24 inside the 1 Ohm - 10 MOhm +/-1% E24;E96 range (PDF p2).
# Lifecycle not stated in the datasheet -> unknown.
schema_version: "0.1"
kind: part
id: vishay/CRCW04021K00FKED

manufacturer: vishay
mpn: CRCW04021K00FKED

device: vishay/CRCW0402-GENERAL-PURPOSE
package: standards/CHIP0402-CRCW

# existence is `probable`: the MPN is assembled from the part-numbering
# legend (or printed only as an example), not listed verbatim in an
# orderable list (openparts/skills/add-part section 2).
existence:
  status: probable

lifecycle:
  status: unknown

sources:
  - vishay/20035

# Parameters (AI candidates, needs review): resistance, tolerance and TCR from
# the PART NUMBER AND PRODUCT DESCRIPTION legend. power_rating left out:
# the rated dissipation P70 depends on the operation mode (standard /
# extended, p2), which the part number does not fix.
parameters:
  resistance:
    nominal: 1
    unit: kΩ
  tolerance:
    min: -1
    max: 1
    unit: "%"
  temperature_coefficient:
    min: -100
    max: 100
    unit: ppm/K

provenance:
  "/existence":
    - source: vishay/20035
      page: 3
      locator: "'PART NUMBER AND PRODUCT DESCRIPTION': CRCW0603562RFKEA / CRCW06030000Z0EA; RESISTANCE R = decimal, K = thousand, M = million, 0000 = jumper; TOLERANCE F = +/-1%, Z = jumper; TCR K = +/-100 ppm/K, 0 = jumper"
    - source: vishay/20035
      page: 2
      locator: "'TEMPERATURE COEFFICIENT AND RESISTANCE RANGE': D11/CRCW0603 e3 and D10/CRCW0402 e3: +/-100 ppm/K, +/-1%, 1 Ohm to 10 MOhm, E24; E96; Jumper <= 20 mOhm, 0 Ohm"
    - source: vishay/20035
      page: 3
      locator: "'PACKAGING' table: D11/CRCW0603 e3 EA = ET1 5000 pcs 7\" paper tape; D10/CRCW0402 e3 ED = ET7 10 000 pcs 7\""
  "/parameters/resistance":
    - source: vishay/20035
      page: 3
      locator: "PART NUMBER AND PRODUCT DESCRIPTION, RESISTANCE: R = decimal, K = thousand, M = million -> 1K00 = 1 kΩ"
  "/parameters/tolerance":
    - source: vishay/20035
      page: 3
      locator: "PART NUMBER AND PRODUCT DESCRIPTION, TOLERANCE: F = ± 1 %"
  "/parameters/temperature_coefficient":
    - source: vishay/20035
      page: 3
      locator: "PART NUMBER AND PRODUCT DESCRIPTION, TCR: K = ± 100 ppm/K"
