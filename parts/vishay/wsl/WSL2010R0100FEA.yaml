# INFORMATION legend (WSL2010 | R0100 | F | EA); 0.01 Ohm is inside the
# +/-1 % range (0.001 to 0.5 Ohm) of the WSL2010 row -> existence probable.
schema_version: "0.2"
kind: part
id: vishay/WSL2010R0100FEA
manufacturer: vishay
mpn: WSL2010R0100FEA
device: vishay/WSL2010
package: standards/CHIP2010-WSL-R007
sources: [vishay/30100]
source: vishay/30100

existence:
