# 1 kΩ +/-1 %, +/-100 ppm/K CRCW1210 thick film chip resistor
# (EA = ET1, 5000 pcs, paper tape, 7" reel). Not printed literally: assembled from the page-3
# PART NUMBER AND PRODUCT DESCRIPTION legend (CRCW1210 | 1K00 | F | K | EA);
# 1 kΩ is inside the p2 CRCW1210 e3 +/-100 ppm/K, +/-1 % row (10 Ohm range
# start per the +/-200 ppm/K row below it) -> existence probable.
schema_version: "0.2"
kind: part
id: vishay/CRCW12101K00FKEA
manufacturer: vishay
mpn: CRCW12101K00FKEA
device: vishay/CRCW1210-GENERAL-PURPOSE
package: standards/CHIP1210-CRCW
sources: [vishay/20035]
source: vishay/20035

existence:
  status: probable
  src:
    - p3 "PART NUMBER AND PRODUCT DESCRIPTION legend"
    - p2 "TEMPERATURE COEFFICIENT AND RESISTANCE RANGE, CRCW1210 e3, ±100 ppm/K ±1% row"
    - p3 "PACKAGING, CRCW1210 e3, code EA"

lifecycle: { status: unknown }

# Parameters (AI candidates, needs review): resistance, tolerance and TCR from
# the part-number legend; P70 from the technical specifications (for sizes
# 1206 and up the p2 operation-mode table lists no alternative rating).
parameters:
  tolerance: { tol: ±1 %, src: 'p3 "PART NUMBER AND PRODUCT DESCRIPTION, TOLERANCE: F = ±1 %"' }
  resistance: { typ: 1 kΩ, src: 'p3 "PART NUMBER AND PRODUCT DESCRIPTION, RESISTANCE: 1K00"' }
  power_rating:
    typ: 0.5 W
    at: { TA: 70 °C }
    src: p1 "TECHNICAL SPECIFICATIONS, CRCW1210 e3, Rated dissipation P70"
  temperature_coefficient:
    tol: ±100 ppm/K
    src: 'p3 "PART NUMBER AND PRODUCT DESCRIPTION, TCR: K = ± 100 ppm/K"'
