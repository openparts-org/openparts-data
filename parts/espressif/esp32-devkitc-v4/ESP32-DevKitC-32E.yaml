# ESP32-DevKitC-32E: ESP32-DevKitC V4 ordering code from the user guide's ordering
# table -> existence verified. On-board module: ESP32-WROOM-32E, 4 MB flash, PCB
# antenna (ordering table) = ESP32-WROOM-32E-N4. The ESP32-DevKitC-32UE/-VE/-VIE
# variants (WROOM-32UE, WROVER-E/-IE) are not added: no OpenParts part for those
# modules, and the WROVER footprint (U3) sits elsewhere.
# Assembly: positions from the reference design's PADS ASCII file (component
# placement + decal pad stacks -> pad-extent centre, board-centre frame). The
# design was drawn for ESP-WROOM-32 (BOM: WROOM-32D); the WROOM-32E uses the same
# land pattern. D3 is the real BAT760-7. Stand-ins
# (stand_in_for, same package or body/land): U2 AMS1117-3.3 -> Diodes
# AP1117E33G-13 (SOT-223); U1 CP2102N -> Allegro QFN-28 5x5; SW1/SW2 (3x4x2,
# no MPN) stay boxes; J1 micro-USB (no MPN) -> GCT USB3076; D1 -> Kingbright
# 0603 red; Q1/Q2 S8050 -> onsemi MMBT2222A; D4-D6 LESD5D5.0CT1G -> onsemi
# ESD5Z5.0T1G. Left out: headers, passives.
