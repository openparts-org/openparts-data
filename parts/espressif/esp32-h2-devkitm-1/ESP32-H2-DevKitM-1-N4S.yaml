# ESP32-H2-DevKitM-1-N4S: ESP32-H2-DevKitM-1 ordering code from the user guide's ordering table
# -> existence verified. On-board module: ESP32-H2-MINI-1-H4S (ordering table).
# Assembly: components placed from the ESP32-H2-DevKitM-1 layout PDF (pad
# centres of the top-copper plot, scaled by the board outline; see the
# agent-scratch placement table). Stand-ins (stand_in_for, same package or
# body/land as the design): U3 CP2102N -> Allegro QFN-28 5x5; USB-C
# J2/J4 (no MPN) -> GCT USB4105; SW1/SW2 NTC013-AT1J-A160T stay boxes
# (S3 BOM size); power LED D5 -> Kingbright 0603 red;
# D11 1N4148W -> Diodes 1N4148W-7-F; ESD LESD5D5.0CT1G -> onsemi ESD5Z5.0T1G.
# D6 WS2812B (variant not stated, 3.5x3.5 land) -> Worldsemi WS2812B-Mini-V6.
# Left out: J5, passives. U6 is the real onsemi BC847BDW1T1G (SC-88).
