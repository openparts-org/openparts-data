# ESP32-H2-DevKitM-1-N4S: ESP32-H2-DevKitM-1 ordering code from the user guide's ordering table
# -> existence verified. On-board module: ESP32-H2-MINI-1-H4S (ordering table).
# Assembly: components placed from the ESP32-H2-DevKitM-1 layout PDF (pad
# centres of the top-copper plot, scaled by the board outline; see the
# agent-scratch placement table). U3 CP2102N and SW1/SW2 NTC013-AT1J-A160T
# (MPNs in the schematic) are boxes sized from the ESP32-S3-DevKitC-1
# reference design BOM, which lists the same MPNs with footprint, size and
# height. Left out: USB-C J2/J4 and the power LED (no MPN), D6 WS2812B
# (variant not stated), U6 BC847BDW1T1G, D11, ESD diodes, passives.
