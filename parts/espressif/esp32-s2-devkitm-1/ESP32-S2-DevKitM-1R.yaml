# ESP32-S2-DevKitM-1R: ESP32-S2-DevKitM-1 ordering code from the user guide's ordering table
# -> existence verified. On-board module: ESP32-S2-MINI-1 (ordering table): U1 is the
# ESP32-S2-MINI-1-N4R2 part (4 MB flash + 2 MB PSRAM).
# Assembly: components placed from the ESP32-S2-DevKitM-1 layout PDF (pad
# centres of the top-copper plot, scaled by the board outline; see the
# agent-scratch placement table). D6 SK68XXMINI-HS -> Worldsemi
# WS2812B-Mini-V6 (3535 stand-in).
# Stand-ins (stand_in_for, same package or body/land as the design): U3
# CP2102N -> Allegro QFN-28 5x5; SW1/SW2 NTC013-AT1J-A160T -> Alps SKRP;
# micro-USB J2 (no MPN) -> GCT USB3076; power LED D5 -> Kingbright 0603;
# Q1/Q2 L8050QLT1G -> onsemi MMBT2222A (SOT-23); ESD D2-D4 LESD5D5.0CT1G ->
# onsemi ESD5Z5.0T1G (SOD-523). Left out: passives.
