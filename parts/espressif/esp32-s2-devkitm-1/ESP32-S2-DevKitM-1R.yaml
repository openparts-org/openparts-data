# ESP32-S2-DevKitM-1R: ESP32-S2-DevKitM-1 ordering code from the user guide's ordering table
# -> existence verified. On-board module: ESP32-S2-MINI-1 (ordering table); no OpenParts ESP32-S2-MINI-1 part yet, so
# the module is a placeholder box (datasheet outline).
# Assembly: components placed from the ESP32-S2-DevKitM-1 layout PDF (pad
# centres of the top-copper plot, scaled by the board outline; see the
# agent-scratch placement table). U3 CP2102N, D6 SK68XXMINI-HS and SW1/SW2
# NTC013-AT1J-A160T (MPNs in the schematic) are boxes sized from the
# ESP32-S3-DevKitC-1 reference design BOM, which lists the same MPNs with
# footprint, size and height. Left out: micro-USB J2 and the power LED (no
# MPN), Q1/Q2 L8050QLT1G (LRC datasheet not served, no body outline), passives.
