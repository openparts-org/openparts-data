  "/parameters/frequency_tolerance":
    - source: ecs/ECS-3x10X-3x9X
      page: 1
      locator: "OPERATING CONDITIONS / ELECTRICAL CHARACTERISTICS, Frequency Tolerance @ +25°C: ± 50 ppm (ECS-3X10X / ECS-3X9X)"
  "/parameters/esr":
