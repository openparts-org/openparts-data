# Through-hole tubular quartz crystal, "3x9X" package, 18pF load
# capacitance. MPN not found as a literal string inside the family
# datasheet (which covers the whole frequency-configurable 3X10X/3X9X
# line rather than one fixed part), but confirmed real/current via
# ECS's own product page plus distributor listings.
schema_version: "0.2"
kind: part
id: ecs/ECS-200-18-9X
manufacturer: ecs
mpn: ECS-200-18-9X
device: ecs/ECS-200-18-9X
package: standards/RADIAL-ECS-200-9X
sources: [ecs/ECS-3x10X-3x9X]
source: ecs/ECS-3x10X-3x9X

existence: { status: verified }
lifecycle: { status: active }

# Parameters (AI candidates, needs review): frequency from the ECS-3X9X
# DEVELOPED FREQUENCIES table, load capacitance from the PART NUMBERING
# GUIDE, tolerance and ESR from the electrical characteristics tables.
parameters:
  esr:              { max: 50 Ω, src: 'p1 "ESR table, 10.00~30.00 MHz Fundamental row"' }
  frequency:        { typ: 20 MHz, src: 'p2 "DEVELOPED FREQUENCIES ECS-3X9X, Abbreviation 200"' }
  load_capacitance: { typ: 18 pF, src: 'p1 "PART NUMBERING GUIDE, Load Capacitance: 18"' }
  frequency_tolerance:
    tol: ±50 ppm
    at: { TA: 25 °C }
    src: p1 "OPERATING CONDITIONS / ELECTRICAL CHARACTERISTICS, Frequency Tolerance (ECS-3X10X / ECS-3X9X)"
