# 32.768 kHz ECX-16 tuning-fork crystal, tape and reel. MPN listed in
# the ECS product page's Ordering & Quality table; it also decodes per
# the datasheet's PART NUMBERING GUIDE (ecs/ECX-16). Device and package are
# the series' existing ones (same ECX-16 datasheet revision). lifecycle
# unknown: neither page states a production status.
schema_version: "0.2"
kind: part
id: ecs/ECS-.327-7-16-TR
manufacturer: ecs
mpn: ECS-.327-7-16-TR
device: ecs/ECX-16-SERIES
package: standards/CHIP-ECX16
sources: [ecs/ECX-16, ecs/ECX-16-product-page]
source: ecs/ECX-16

existence:
  status: verified
  src: 'ecs/ECX-16-product-page p1 "Ordering & Quality table row "ECS-.327-7-16-TR": 16 1.60mm x 1.00mm 32.768 kHz +/-20ppm 7pF"'

lifecycle: { status: unknown }

# Parameters (AI candidates, needs review): frequency, load capacitance and
# tolerance from the PART NUMBERING GUIDE codes; ESR from the ECX-16
# electrical characteristics table.
parameters:
  esr:
    max: 90 kΩ
    src: 'p1 "OPERATING CONDITIONS / ELECTRICAL CHARACTERISTICS, Equivalent Series Resistance R1: ECX-16 MAX 90K Ω"'
  frequency:
    typ: 32.768 kHz
    src: 'p1 "PART NUMBERING GUIDE, FREQUENCY ABBREVIATION: .327 = 32.768 KHz"'
  load_capacitance: { typ: 7 pF, src: 'p1 "PART NUMBERING GUIDE, LOAD CAPACITANCE: 7 = 7 pF"' }
  frequency_tolerance:
    tol: ±20 ppm
    src: 'p1 "PART NUMBERING GUIDE, CUSTOM OPTIONS Tolerance: Blank = ±20 ppm (no custom option in this MPN)"'
