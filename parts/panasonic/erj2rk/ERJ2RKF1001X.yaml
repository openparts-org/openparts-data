# 1 kΩ +/-1 % ERJ2RK (0402), packaging X (punched carrier taping 2 mm pitch, 10,000 pcs). Written
# without hyphen as the datasheet's part-number boxes show it. Not printed
# literally: built from the page-2 part-number explanation; the ERJ2RK
# ratings row (page 3) gives 10 to 1 M Ohm, E24/E96 at +/-1 % -> existence
# probable.
schema_version: "0.2"
kind: part
id: panasonic/ERJ2RKF1001X
manufacturer: panasonic
mpn: ERJ2RKF1001X
device: panasonic/ERJ2RK
package: standards/CHIP0402-ERJ2R
sources: [panasonic/AOA0000C304]
source: panasonic/AOA0000C304

existence:
  status: probable
  src:
    - p2 "Explanation of part numbers, ERJ2RK ±1 % series"
    - p3 "Ratings <±1 %>, ERJ2RK row, Resistance range 10 to 1 M"

lifecycle: { status: unknown }

# Parameters (AI candidates, needs review): resistance and tolerance from
# 'Explanation of part numbers'; power and T.C.R. from the Ratings row.
parameters:
  tolerance:
    tol: ±1 %
    src: 'p2 "Explanation of part numbers (2RK, ±1 %), Resistance tolerance: F = ±1 %"'
  resistance:
    typ: 1 kΩ
    src: 'p2 "Explanation of part numbers (2RK, ±1 %), Resistance value: 1001"'
  power_rating:
    typ: 0.1 W
    at: { TA: 70 °C }
    src: p3 "Ratings <±1 %>, ERJ2RK row, Power rating (70 ℃)"
  temperature_coefficient: { tol: ±100 ppm/K, src: 'p3 "Ratings <±1 %>, ERJ2RK row, T.C.R. ±100"' }
