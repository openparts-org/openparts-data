# 100 kOhm +/-1 % ERJ3EK (0603), V packaging (punched carrier 4 mm pitch,
# 5,000 pcs). Written without hyphen like panasonic/ERJ3EKF1002V (the
# datasheet's part-number boxes have none). Not printed literally:
# assembled from the page-2 part-number explanation (ERJ|3EK|F|1003|V);
# 100 kOhm is an E24 value inside the page-3 ERJ3EK range 10 to 1 M
# (E24,E96) -> existence probable. Page 2 notes "Please check the
# Ratings for the presence/absence of part numbers": checked. The
# fetched PDF (2026-11-10) still carries the 29-May-25 footers of
# panasonic/AOA0000C304, so that source is reused. lifecycle unknown:
# ERJ3EK carries no NRFND mark, but absence is not an active statement.
schema_version: "0.2"
kind: part
id: panasonic/ERJ3EKF1003V
manufacturer: panasonic
mpn: ERJ3EKF1003V
device: panasonic/ERJ3EK
package: standards/CHIP0603-ERJ3E
sources: [panasonic/AOA0000C304]
source: panasonic/AOA0000C304

# existence p3: no NRFND mark on the ERJ3EK ratings row
existence:
  status: probable
  src:
    - p2 "Explanation of part numbers, ERJ3EK +/-1 % series"
    - p3 "Ratings <+/-1 %>, row ERJ3EK (0603)"

lifecycle: { status: unknown }

# Parameters (AI candidates, needs review): resistance and tolerance from
# 'Explanation of part numbers' (±1 % series); power and T.C.R. from the
# <±1 %> Ratings table, ERJ3EK row.
parameters:
  tolerance:
    tol: ±1 %
    src: 'p2 "Explanation of part numbers (3EK, ±1 %), Resistance tolerance: F = ±1 %"'
  resistance:
    typ: 100 kΩ
    src: 'p2 "Explanation of part numbers (3EK, ±1 %), Resistance value: 1003"'
  power_rating:
    typ: 0.1 W
    at: { TA: 70 °C }
    src: p3 "Ratings <±1 %>, ERJ3EK row, Power rating"
  temperature_coefficient: { tol: ±100 ppm/K, src: 'p3 "Ratings <±1 %>, ERJ3EK row, T.C.R."' }
