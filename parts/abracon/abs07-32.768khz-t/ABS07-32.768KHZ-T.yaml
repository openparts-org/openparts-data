# ABS07 standard options, tape and reel. Built from the page-3 options
# scheme ("Left blank if standard"), not printed literally, so
# existence: probable (same rule as abracon/AB-8.000MHZ-B2). The exact
# capitalisation "KHZ" follows Abracon's usual ordering-code form;
# the datasheet prints "32. 768 kHz" in the scheme graphic.
# lifecycle unknown: no production-status statement.
schema_version: "0.2"
kind: part
id: abracon/ABS07-32.768KHZ-T
manufacturer: abracon
mpn: ABS07-32.768KHZ-T
device: abracon/ABS07-32.768KHZ
package: standards/CHIP-ABRACON-ABS07
sources: [abracon/ABS07]
source: abracon/ABS07

existence:
  status: probable
  src: 'p3 "Options and Part Identification: "ABS07 - 32.768 kHz -" + options left blank (0.9mm height, 12.5pF, -40..+85C, +/-20ppm) + packaging "T: 3k pcs / reel""'

lifecycle: { status: unknown }

# Parameters (AI candidates, needs review): Key Electrical Specifications
# with every option left blank (standard) per Options and Part
# Identification (p3); only the packaging option T is set.
parameters:
  esr:
    max: 70 kΩ
    src: 'p1 "Key Electrical Specifications, Equivalent series resistance (R1): Max. 70 kΩ, -40 ~ +85°C row (Operating Temp. Range option Blank: -40 ~ +85°C, p3)"'
  frequency:
    typ: 32.768 kHz
    src: 'p1 "Key Electrical Specifications, Frequency: Typ. 32.768 kHz"'
  load_capacitance:
    typ: 12.5 pF
    src: 'p3 "Options and Part Identification, Load Capacitance: Blank: 12.5pF (Key Electrical Specifications p1: Load capacitance (CL) Typ. 12.5 pF, Option "blank")"'
  frequency_tolerance:
    tol: ±20 ppm
    src: 'p3 "Options and Part Identification, Freq. Tolerance: Blank: ±20ppm (Key Electrical Specifications p1: Frequency Tolerance @+25°C -20 / +20 ppm, Option "blank")"'
