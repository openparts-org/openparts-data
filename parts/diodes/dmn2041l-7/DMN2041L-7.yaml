# DMN2041L-7: the only MPN in DS31962 Rev. 4-3 "Ordering Information"
# (page 1), SOT23, 3000/Tape & Reel. lifecycle nrnd: every page carries
# "NOT RECOMMENDED FOR NEW DESIGN / USE DMN2040U".
# Package: the page-5 SOT23 table (letter codes A..M, Min / Max / Typ)
# matches standards/SOT23-2.90x1.30-P1.83-DIODES-DS18001 value for value
# (A 0.37-0.51/0.40, B 1.20-1.40/1.30, C 2.30-2.50/2.40, G 1.78-2.05/1.83,
# H 2.80-3.00/2.90, J 0.013-0.10/0.05, K 0.890-1.00/0.975, K1 0.903-1.10/
# 1.025, L1 0.25-0.55/0.40, M 0.085-0.150/0.110), so it is reused.
schema_version: "0.2"
kind: part
id: diodes/DMN2041L-7
manufacturer: diodes
mpn: DMN2041L-7
device: diodes/DMN2041L

package:
  value: standards/SOT23-2.90x1.30-P1.83-DIODES-DS18001
  src: p5 "Package Outline Dimensions SOT23 table (identical to DS18001's) -- reused package, see header"

sources: [diodes/DS31962]
source: diodes/DS31962

existence:
  status: verified
  src: 'p1 "Ordering Information: "DMN2041L-7 | SOT23 | 3000/Tape & Reel""'

lifecycle:
  status: nrnd
  src: p1 "Banner "NOT RECOMMENDED FOR NEW DESIGN / USE DMN2040U" (every page)"

parameters:
  polarity:             { value: n_channel, src: p1 "Title" }
  drain_source_voltage: { max: 20 V, src: 'p2 "Maximum Ratings, VDSS"' }
  drain_current:
    - { max: 6.4 A, at: { TA: 25 °C }, src: 'p2 "Maximum Ratings, ID, Steady State"' }
    - { max: 4.5 A, at: { TA: 70 °C }, src: 'p2 "Maximum Ratings, ID, Steady State"' }
  rds_on:
    - { typ: 20 mΩ, max: 28 mΩ, at: { VGS: 4.5 V, ID: 6 A }, src: 'p2 "Elec. Char., RDS(ON)"' }
    - { typ: 26 mΩ, max: 41 mΩ, at: { VGS: 2.5 V, ID: 5.2 A }, src: 'p2 "Elec. Char., RDS(ON)"' }
  gate_threshold_voltage:
    min: 0.5 V
    max: 1.2 V
    at: { ID: 250 µA }
    src: p2 "Elec. Char., VGS(TH), VDS=VGS"
