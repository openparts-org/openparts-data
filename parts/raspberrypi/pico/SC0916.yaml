# Raspberry Pi Pico, order code SC0916: the second code printed for the
# model "Raspberry Pi Pico" in the Pico datasheet's Appendix A.2
# "Ordering code" (Table 6, PDF page 25; EAN 0617588405587, beside
# SC0915). The table doesn't say how the two codes differ, so this part
# shares SC0915's device and package. lifecycle unknown: no
# production-status statement.
schema_version: "0.2"
kind: part
id: raspberrypi/SC0916
manufacturer: raspberrypi
mpn: SC0916
device: raspberrypi/PICO
package: standards/MODULE40-21x51-P2.54-PICO

sources:
  - raspberrypi/RP-008307-DS@rev2
  - raspberrypi/RP-008379-DS
  - raspberrypi/RP-008311-DS
  - edac/690-005-298-486

source: raspberrypi/RP-008379-DS

existence:
  status: verified
  src: 'raspberrypi/RP-008307-DS@rev2 p25 "Appendix A.2 Ordering code, Table 6: second row of "Raspberry Pi Pico": "SC0916  0617588405587""'

lifecycle: { status: unknown }

# Assembly (Canonical Data Specification 20.12): the Pico R3 design files
# (raspberrypi/RP-008379-DS: Allegro board + BOM). Every fitted BOM line
# is placed; not fitted ones (J0, J2, R4, R15, TP1-TP6) are left out.
# OpenParts parts where the dataset has the MPN, else a box of the BOM
# "Size" column (L along the pads). D1 and Q1 are OpenParts parts.
# Stand-ins (stand_in_for): J1 EDAC 690-005-298-486 -> GCT USB3076 (SMT
# micro-B; EDAC's land pattern has shaped pads, not modelled); SW1
# TP-1221U (no maker datasheet served) -> Alps SKRP (same 4.2x3.2x2.5 body);
# D2 -> Kingbright 0603 green LED; X1 -> Abracon ABM8-272-T3 (3.2x2.5);
# L1 -> Murata LQM2HPN2R2MG0L (2.5x2.0 chip inductor).
# SC0916 is assumed to be the same board as SC0915 (same model row).
