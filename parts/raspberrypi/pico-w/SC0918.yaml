# Raspberry Pi Pico W, order code SC0918. The Pico W datasheet's Appendix
# A.2 "Ordering code" (Table 1, PDF page 20) prints it "SCO918" -- with a
# letter O (and "SCO919" for the Pico WH) -- while Raspberry Pi's
# Product Information Portal page for the Pico W lists "SC0918, SC0919"
# with a digit zero, matching the SC09xx codes of the Pico (SC0915-17).
# The digit form is used; the datasheet spelling is a typo.
# Package: the Pico W's SMT footprint (castellated pads plus the
# mid-board SWCLK/GND/SWDIO pads). lifecycle unknown: no
# production-status statement in these sources.
schema_version: "0.2"
kind: part
id: raspberrypi/SC0918
manufacturer: raspberrypi
mpn: { value: SC0918, src: raspberrypi/PIP-686-pico-w ""SC0918" with a digit zero" }
device: raspberrypi/PICO-W
package: standards/MODULE40-21x51-P2.54-PICO-W

sources:
  - raspberrypi/RP-008312-DS@rev2
  - raspberrypi/PIP-686-pico-w
  - raspberrypi/RP-008380-DS
  - raspberrypi/RP-008379-DS
  - raspberrypi/RP-008311-DS
  - richtek/DS6154AB-05
  - edac/690-005-298-486

source: raspberrypi/RP-008380-DS

existence:
  status: verified
  src:
    - 'raspberrypi/RP-008312-DS@rev2 p20 "Appendix A.2 Ordering code, Table 1: "Raspberry Pi Pico W  SCO918  5056561803173" (letter O as printed)"'
    - 'raspberrypi/PIP-686-pico-w "Page header under "Raspberry Pi Pico W": "SC0918, SC0919""'

lifecycle: { status: unknown }

# Assembly (Canonical Data Specification 20.12): placements from the
# Pico W design files (raspberrypi/RP-008380-DS, Allegro board; no BOM
# is published), MPNs from the Pico W datasheet text and Figure 8
# (powerchain schematic) and the design's part library. Only the main
# visible parts are placed; the passives, the LED (no MPN stated) and
# the CYW43439 under the shield can (SH1) are left out.
assembly:
  - ref: U1
    part: raspberrypi/RP2040
    x: 0
    y: 1.55
    src:
      - '"U1 placement (57-pad QFN-56 land)"'
      - raspberrypi/RP-008312-DS@rev2 p5 "Pico W provides external circuitry to support the RP2040 chip"
  - ref: U3
    part: winbond/W25Q16JVUXIQ
    x: -3.315
    y: 8.695
    src:
      - '"U3 placement; DSN part W25Q16JVUXIQ USON 2x3mm"'
      - raspberrypi/RP-008312-DS@rev2 p5 "flash memory (Winbond W25Q16JV)"
  - ref: X1
    part: abracon/ABM8-272-T3
    x: -4.695
    y: -4.91
    rotation: -90
    src:
      - '"X1 placement (12 MHz crystal next to RP2040 XIN/XOUT)"'
      - raspberrypi/RP-008312-DS@rev2 p5 "crystal (Abracon ABM8-272-T3)"
  - ref: U2
    body: { width: 4, length: 3, height: 0.8, color: "#1c1c1e" }
    x: 2.27
    y: 14.59
    src:
      - '"U2 placement"'
      - 'raspberrypi/RP-008312-DS@rev2 p15 "Figure 8: U2 RT6154AGQW"'
      - 'richtek/DS6154AB-05 p18 "WDFN-14AL 4x3: D 3.9-4.1, E 2.9-3.1, A max 0.8"'
  - ref: D1
    body: { width: 4.2, length: 1.65, height: 0.95, color: "#2a2a2a" }
    x: 6
