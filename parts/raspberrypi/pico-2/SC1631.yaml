# Raspberry Pi Pico 2, order code SC1631: printed in the Pico 2
# datasheet's Appendix A.2 "Ordering code" (Table 3, PDF page 20) against
# the model "Raspberry Pi Pico 2" (EAN 5056561803951). The next row,
# SC1632, is the board with headers ("Raspberry Pi Pico with headers"),
# not added: no outline or footprint is drawn for it.
#
# Package: the Pico 2's Figures 3 and 5 (PDF pages 8 and 11) print the
# same numbers as the Pico's, so it shares the Pico package (which cites
# the Pico datasheet). lifecycle unknown: no production-status statement.
schema_version: "0.2"
kind: part
id: raspberrypi/SC1631
manufacturer: raspberrypi
mpn: SC1631
device: raspberrypi/PICO-2
package: standards/MODULE40-21x51-P2.54-PICO
sources: [raspberrypi/RP-008299-DS@rev3, raspberrypi/RP-009061-CA, raspberrypi/RP-008311-DS]
source: raspberrypi/RP-009061-CA

existence:
  status: verified
  src: 'raspberrypi/RP-008299-DS@rev3 p20 "Appendix A.2 Ordering code, Table 3: "Raspberry Pi Pico 2  SC1631  5056561803951""'

lifecycle: { status: unknown }

# Assembly (Canonical Data Specification 20.12): positions, turns and box
# sizes from Raspberry Pi's MIT-licensed Pico 2 STEP model
# (raspberrypi/RP-009061-CA; no layout or BOM is published). The STEP
# carries no reference designators: U1-U3, X1, J1, SW1, D1, D2, Q1, L1,
# L2 are assigned here by function, the passives are Cx<n>/Rx<n>. Parts
# where the MPN is known (datasheet text, or the STEP product name for
# the RT6150B-33GQW, and the flash W25Q32RVXHJQ); the
# rest are boxes of their STEP bounding box above the board. Stand-ins
# (stand_in_for): J1 EDAC 690-005-298-486 -> GCT USB3076; SW1 TP-1221U
# stays a box; D1, Q1 -> the Pico's MBR120VLSFT1G / DMG1012T-7 (same
# SOD-123FL / SOT-523 boxes); D2 -> Kingbright 0603 green LED; L1
# (Bourns SRN2512) -> Murata LQM2HPN2R2MG0L. L2 is the real Abracon
# AOTA-B201610S3R3-101-T.
