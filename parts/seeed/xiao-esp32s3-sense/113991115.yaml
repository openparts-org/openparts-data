# Seeed Studio XIAO ESP32S3 Sense (113991115). Package = the board with its header holes; assembly = the
# components on it whose placement comes from the maker's design file (seeed/XIAO-ESP32S3-Sense-SCH-PCB@V1.51),
# converted to the package frame (board centre, top view; see the package comment).
# Listed: components with an OpenParts part -- where the real component has no fetchable datasheet
# or no stated MPN, an equivalent part of the same footprint type and size (`stand_in_for` names the
# real one) -- or a box whose size AND height a source states. Left out:
#   the camera expansion board that ships with the Sense (a separate board on J3; no layout
#   published), U2 (no value), L4, D2 LMBR4010BST5G, Q1 LP0404N3T5G: no part / no body height;
#   passives skipped. Header holes: the inner plated 0.95 mm holes of footprint U9 "XIAO-14P-Add-
#   On"; the castellated 0.7 mm edge half-holes are not pads here
# J3: the B2B connector for the Sense camera board; the wiki specification table lists "1x B2B
# Connector" only for the Sense, and Seeed publishes this one design (title "XIAO ESP32-S3-Sense")
# for both boards, so this part is the Sense SKU.
