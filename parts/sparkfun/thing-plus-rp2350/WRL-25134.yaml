#   socket, L1/FB1, passives and jumpers
# Package standards/MODULE28-23x58-P2.54-SPARKFUN-THING-PLUS is shared with another board of
# this form factor: the 28 header holes of this design have the same positions and drill (land
# here 1.8796 mm).
# U2: value "RM2" (Raspberry Pi RM2 radio module).
