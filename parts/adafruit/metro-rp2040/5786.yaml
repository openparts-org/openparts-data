# components on it whose placement comes from the maker's design file (adafruit/Adafruit-Metro-RP2040-PCB@9fe571e),
# converted to the package frame (board centre, top view; see the package comment). x/y/rotation
# come from fitting each OpenParts footprint onto the design pads of that element.
# Listed: components with an OpenParts part -- where the real component has no fetchable datasheet
# or no stated MPN, an equivalent part of the same footprint type and size (`stand_in_for` names the
# real one). Left out:
#   LED2 WS2812B 3535 (pin arrangement differs from the WorldSemi Mini-V6: no matching part),
#   female headers POWER/AD/IOL/IOH (values 20609/20610/20611, maker not stated), ICSP 2x3, SWD
#   2x5 1.27 mm, X1 microSD socket, SW1 slide switch, SW2/SW3 right-angle tact switches, SW4 DPDT
#   EG1390, PC1/PC2 47 uF caps, F2 fuse, passives
# U2: value "AP2112K-3.3" (ordering suffix not in the design).
