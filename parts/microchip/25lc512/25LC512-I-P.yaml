# 25LC512-I/P: 25LC512 EEPROM, industrial temperature, package P.
# existence "probable": the MPN is printed as example c) of the Product Identification System
# (DS20002065E page 35: Device "25LC512", Tape and Reel "Blank = Standard packaging",
# Temperature I, Package "P = Plastic Dual In-Line - 300 mil Body, 8-Lead (PDIP)"); the legend is not an
# orderable list. Package drawing C04-018-P Rev F, dimension table on page 26
# (package file read from this drawing revision). lifecycle: no production-status statement -> unknown. The id
# replaces the "/" of the MPN with "-"; mpn keeps the real string.
schema_version: "0.2"
kind: part
id: microchip/25LC512-I-P
manufacturer: microchip
mpn: 25LC512-I/P
device: microchip/25LC512

package:
  value: manufacturers/microchip/PDIP8-P-C04-018F
  src:
    - p35 "Product Identification System, Package P"
    - p26 "drawing C04-018-P Rev F dimension table"

sources: [microchip/DS20002065@revE]
source: microchip/DS20002065@revE

existence: { status: probable, src: 'p35 "Product Identification System, example c) 25LC512-I/P"' }
lifecycle: { status: unknown }

# Parameters (AI candidates, needs review).
parameters:
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p2 "DC Characteristics header: Industrial (I) TA = -40 to +85 C"'
