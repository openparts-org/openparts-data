# 24LC1025-I/P: 24LC1025 EEPROM, industrial temperature, package P.
# existence "probable": the MPN is printed as example b) of the Product Identification System
# (DS20001941M page 28: Device "24LC1025", Tape and Reel "Blank = Standard packaging",
# Temperature I, Package "P = Plastic Dual In-Line - 300 mil Body, 8-Lead (PDIP)"); the legend is not an
# orderable list. Package drawing C04-018-P Rev E, dimension table on page 19
# (the drawing revision the package was read from). lifecycle: no production-status statement -> unknown. The id
# replaces the "/" of the MPN with "-"; mpn keeps the real string.
schema_version: "0.2"
kind: part
id: microchip/24LC1025-I-P
manufacturer: microchip
mpn: 24LC1025-I/P
device: microchip/24LC1025

package:
  value: manufacturers/microchip/PDIP8-P-C04-018E
  src:
    - p28 "Product Identification System, Package P"
    - p19 "drawing C04-018-P Rev E dimension table"

sources: [microchip/DS20001941@revM]
source: microchip/DS20001941@revM

existence: { status: probable, src: 'p28 "Product Identification System, example b) 24LC1025-I/P"' }
lifecycle: { status: unknown }

# Parameters (AI candidates, needs review).
parameters:
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p3 "DC Characteristics header: Industrial (I) TA = -40 to +85 C"'
