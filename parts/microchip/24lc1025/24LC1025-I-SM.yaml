# 24LC1025-I/SM: 24LC1025 EEPROM, industrial temperature, package SM.
# existence "probable": the MPN is assembled from the Product Identification System legend
# (DS20001941M page 28: Device "24LC1025", Tape and Reel "Blank = Standard packaging",
# Temperature I, Package "SM = Plastic Small Outline - Medium, 5.28 mm Body, 8-Lead (SOIJ)"); the legend is not an
# orderable list. Package drawing C04-056C, dimension table on page 24
# (the drawing revision the package was read from). lifecycle: no production-status statement -> unknown. The id
# replaces the "/" of the MPN with "-"; mpn keeps the real string.
schema_version: "0.2"
kind: part
id: microchip/24LC1025-I-SM
manufacturer: microchip
mpn: 24LC1025-I/SM
device: microchip/24LC1025

package:
  value: manufacturers/microchip/SOIJ8-SM-C04-056C
  src: ['p28 "Product Identification System, Package SM"', p24 "drawing C04-056C dimension table"]

sources: [microchip/DS20001941@revM]
source: microchip/DS20001941@revM

existence:
  status: probable
  src: 'p28 "Product Identification System legend: Device 24LC1025, blank, Temperature I, Package SM"'

lifecycle: { status: unknown }

# Parameters (AI candidates, needs review).
parameters:
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p3 "DC Characteristics header: Industrial (I) TA = -40 to +85 C"'
