# example b) "23LC1024T-I/SN = 1 Mbit, 2.5-5.5V Serial SRAM, Industrial
# temp., Tape & Reel, SOIC package". existence is "probable": the MPN
# appears only as an ordering example of the Product Identification
# System, not in an orderable list (Microchip product pages answer 403
# and were not read). Package: drawing C04-057C, dimension table page 22
# (rendered). Every row of that table (e 1.27 BSC, A max 1.75, A2 min
# 1.25, A1 0.10-0.25, E 6.00 BSC, E1 3.90 BSC, D 4.90 BSC, L 0.40-1.27,
# c 0.17-0.25, b 0.31-0.51) equals standards/SOIC8-3.90x4.90-P1.27, so
# that package is reused. The id replaces the "/" of the MPN with "-";
# mpn keeps the real string. lifecycle: no production-status statement
# in the datasheet; unknown.
