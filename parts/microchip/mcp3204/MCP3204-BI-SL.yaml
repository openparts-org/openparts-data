# MPN from the "Product Identification System" (DS21298E page 37),
# example b) "MCP3204-BI/SL: +/-1 LSB INL, Industrial Temperature, SOIC
# package". existence is "probable": the MPN appears only as an ordering
# example of the Product Identification System, not in an orderable list
# (Microchip product pages answer 403 and were not read). Package:
# 14-lead drawing C04-065B "14-Lead Plastic Small Outline (SL) - Narrow,
# 3.90 mm Body [SOIC]", page 28 (rendered). Every row of that table
# equals manufacturers/microchip/SOIC14-SL-C04-065B (read from DS21897B,
# the same drawing number; c 0.17-0.25), so that package is reused. The
# id replaces the "/" of the MPN with "-"; mpn keeps the real string.
# lifecycle: no production-status statement in the datasheet; unknown.
schema_version: "0.2"
kind: part
id: microchip/MCP3204-BI-SL
manufacturer: microchip
mpn: MCP3204-BI/SL
device: microchip/MCP3204

package:
  value: manufacturers/microchip/SOIC14-SL-C04-065B
  src:
    - p37 "Product Identification System, Package "SL = Plastic SOIC (150 mil Body), 14-lead, 16-lead""
    - p28 "14-lead drawing C04-065B "14-Lead Plastic Small Outline (SL) - Narrow, 3.90 mm Body [SOIC]", page 28 (rendered)"

sources: [microchip/DS21298@revE]
source: microchip/DS21298@revE

existence:
  status: probable
  src: 'p37 "Product Identification System, example b) "MCP3204-BI/SL: +/-1 LSB INL, Industrial Temperature, SOIC package""'

lifecycle: { status: unknown }

# Parameters (AI candidates, needs review).
parameters:
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p37 "Product Identification System, Temperature Range: I = -40°C to +85°C (Industrial)"'
