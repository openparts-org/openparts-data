  src: ['p30 "Product Identification System, Package SM"', p26 "drawing C04-056C dimension table"]

sources: [microchip/DS20002064@revE]
source: microchip/DS20002064@revE

existence:
  status: probable
  src: p30 "Product Identification System, example c) 25LC1024T-I/SM"

lifecycle: { status: unknown }

