# 25LC1024T-I/SM: 25LC1024 EEPROM, industrial temperature, package SM.
# existence "probable": the MPN is printed as example c) of the Product Identification System
# (DS20002064E page 30: Device "25LC1024", Tape and Reel "T = Tape and Reel",
# Temperature I, Package "SM = Plastic Small Outline - Medium, 5.28 mm Body, 8-Lead (SOIJ)"); the legend is not an
# orderable list. Package drawing C04-056C, dimension table on page 26
# (the drawing revision the package was read from). lifecycle: no production-status statement -> unknown. The id
# replaces the "/" of the MPN with "-"; mpn keeps the real string.
schema_version: "0.2"
kind: part
id: microchip/25LC1024T-I-SM
manufacturer: microchip
mpn: 25LC1024T-I/SM
