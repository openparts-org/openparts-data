# 24LC32A-E/SN: 24LC32A EEPROM, extended temperature, package SN.
# existence "probable": the MPN is printed as example f) of the Product Identification System
# (DS20001713P page 40: Device "24LC32A", Tape and Reel "Blank = Standard packaging",
# Temperature E, Package "SN = Plastic Small Outline - Narrow, 3.90 mm Body, 8-Lead (SOIC)"); the legend is not an
# orderable list. Package drawing C04-057-SN Rev K, dimension table on page 24
# (same table values as the standard package's C04-057-SN Rev D (all rows compared)). lifecycle: no production-status statement -> unknown. The id
# replaces the "/" of the MPN with "-"; mpn keeps the real string.
schema_version: "0.2"
kind: part
id: microchip/24LC32A-E-SN
manufacturer: microchip
mpn: 24LC32A-E/SN
device: microchip/24LC32A

package:
  value: standards/SOIC8-3.90x4.90-P1.27
  src:
    - p40 "Product Identification System, Package SN"
    - p24 "drawing C04-057-SN Rev K dimension table"

sources: [microchip/DS20001713@revP]
source: microchip/DS20001713@revP

existence: { status: probable, src: 'p40 "Product Identification System, example f) 24LC32A-E/SN"' }
lifecycle: { status: unknown }

# Parameters (AI candidates, needs review).
parameters:
  operating_temperature:
    min: -40 °C
    max: 125 °C
    src: 'p2 "DC Characteristics header: Extended (E) TA = -40 to +125 C"'
