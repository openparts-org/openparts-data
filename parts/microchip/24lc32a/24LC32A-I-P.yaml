# 24LC32A-I/P: 24LC32A EEPROM, industrial temperature, package P.
# existence "probable": the MPN is printed as example e) of the Product Identification System
# (DS20001713P page 40: Device "24LC32A", Tape and Reel "Blank = Standard packaging",
# Temperature I, Package "P = Plastic Dual In-Line - 300 mil Body, 8-Lead (PDIP)"); the legend is not an
# orderable list. Package drawing C04-018-P Rev G, dimension table on page 22
# (package file read from this drawing revision). lifecycle: no production-status statement -> unknown. The id
# replaces the "/" of the MPN with "-"; mpn keeps the real string.
schema_version: "0.2"
kind: part
id: microchip/24LC32A-I-P
manufacturer: microchip
mpn: 24LC32A-I/P
device: microchip/24LC32A

package:
  value: manufacturers/microchip/PDIP8-P-C04-018G
  src:
    - p40 "Product Identification System, Package P"
    - p22 "drawing C04-018-P Rev G dimension table"

sources: [microchip/DS20001713@revP]
source: microchip/DS20001713@revP

existence: { status: probable, src: 'p40 "Product Identification System, example e) 24LC32A-I/P"' }
lifecycle: { status: unknown }

# Parameters (AI candidates, needs review).
parameters:
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p2 "DC Characteristics header: Industrial (I) TA = -40 to +85 C"'
