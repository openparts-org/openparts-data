# MCP1702, 2.5 V output, 2% tolerance, in the 3-lead SOT-23A (CB). DS22008E page 24
# Product Identification System, example c). Package CB -> drawing C04-130B (p18).
# output_voltage from the Output Voltage code table of the same page; output_current and
# dropout_voltage from the DC Characteristics row for this VR (none for VR < 2.5 V, whose
# maximum output current depends on VIN).
# existence is "probable": the MPN appears only as an ordering example.
# The id replaces the "/" of the MPN with "-"; mpn keeps the real string.
schema_version: "0.2"
kind: part
id: microchip/MCP1702T-2502E-CB
manufacturer: microchip
mpn: MCP1702T-2502E/CB
device: microchip/MCP1702-CB

package:
  value: manufacturers/microchip/SOT23A-3-CB-C04-130B
  src: p24 "Product Identification System, Package Type CB (SOT-23A, 3-lead); drawing C04-130B p18"

sources: [microchip/DS22008@revE]
source: microchip/DS22008@revE

existence:
  status: probable
  src: p24 "Product Identification System, example c) MCP1702T-2502E/CB"

lifecycle: { status: unknown }

parameters:
  output_voltage:
    typ: 2.5 V
    src: p24 "Product Identification System, Output Voltage 25 = 2.5V Standard"
  output_current:
    min: 250 mA
    src: p3 "DC Characteristics, Maximum Output Current, For VR >= 2.5V"
  dropout_voltage:
    typ: 750 mV
    max: 1100 mV
    at: { IL: 250 mA }
    src: p4 "DC Characteristics, Dropout Voltage, row 2.5V <= VR < 2.8V"
