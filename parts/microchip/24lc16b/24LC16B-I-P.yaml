# 24LC16B-I/P: 24LC16B EEPROM, industrial temperature, package P.
# existence "probable": the MPN is printed as example d) of the Product Identification System
# (DS20001703R page 45: Device "24LC16B", Tape and Reel "Blank = Standard packaging",
# Temperature I, Package "P = Plastic Dual In-Line - 300 mil Body, 8-Lead (PDIP)"); the legend is not an
# orderable list. Package drawing C04-018-P Rev G, dimension table on page 25
# (package file read from this drawing revision). lifecycle: no production-status statement -> unknown. The id
# replaces the "/" of the MPN with "-"; mpn keeps the real string.
schema_version: "0.2"
kind: part
id: microchip/24LC16B-I-P
manufacturer: microchip
mpn: 24LC16B-I/P
device: microchip/24LC16B

package:
  value: manufacturers/microchip/PDIP8-P-C04-018G
  src:
    - p45 "Product Identification System, Package P"
    - p25 "drawing C04-018-P Rev G dimension table"

sources: [microchip/DS20001703@revR]
source: microchip/DS20001703@revR

existence: { status: probable, src: 'p45 "Product Identification System, example d) 24LC16B-I/P"' }
lifecycle: { status: unknown }

# Parameters (AI candidates, needs review).
parameters:
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p3 "DC Characteristics header: Industrial (I) TA = -40 to +85 C"'
