# MPN from the "Product Identification System" (DS20001822J page 32),
# Device "25LC256: 256 Kbit, 2.5V, 64-Byte Page, SPI Serial EEPROM",
# Tape and Reel option blank (tube), Temperature "I = -40C to +85C
# (Industrial)", Package "SN". existence is "probable": the MPN appears
# only assembled from the part-number legend (not as an example) of the
# Product Identification System, not in an orderable list (Microchip
# product pages answer 403 and were not read). Package: drawing
# C04-057-SN Rev F, dimension table page 22 (sheet 1 page 21). That
# table (text) has the same numbers, row for row, as
# standards/SOIC8-3.90x4.90-P1.27 (read from C04-057-SN Rev D in
# DS20001203W page 25), so that package is reused. The "(NON-
# AUTOMOTIVE)" legend was used; the examples list only 25LC256-I/P,
# 25LC256T-E/ST, 25LC256XT-I/ST for the 25LC256. The id replaces the "/"
# of the MPN with "-"; mpn keeps the real string. lifecycle: no
# production-status statement in the datasheet; unknown.
