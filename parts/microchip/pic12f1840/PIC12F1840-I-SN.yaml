# PIC12F1840-I/SN: industrial temperature (-40 to +85 C), SOIC 8-lead,
# tube. existence: probable -- the datasheet has no table of orderable
# codes, only the "PRODUCT IDENTIFICATION SYSTEM" legend (DS40001441F page
# 395: Device PIC12F1840, Temperature I, Package SN = SOIC 8-Lead); this
# MPN was assembled from that legend (its examples are "PIC12F1840 - I/P"
# and "PIC12F1840 - E/SN"). The product page returned 403 to curl and
# WebFetch. Package -> "8-Lead Plastic Small Outline (SN) - Narrow, 3.90
# mm Body [SOIC]", drawing C04-057C (page 385, image, rendered). Every
# number of its table matches standards/SOIC8-3.90x4.90-P1.27 (C04-057-SN
# Rev D, DS20001203W): e 1.27 BSC, A max 1.75, A2 min 1.25, A1 0.10-0.25,
# E 6.00 BSC, E1 3.90 BSC, D 4.90 BSC, L 0.40-1.27, c 0.17-0.25, b
# 0.31-0.51 -> reused (validate with --source
# sources/microchip/DS20001203W.yaml). lifecycle: no production-status
# statement in the datasheet and the Microchip product page refused curl
# and WebFetch (403); unknown.
schema_version: "0.2"
kind: part
id: microchip/PIC12F1840-I-SN
manufacturer: microchip
mpn: PIC12F1840-I/SN
device: microchip/PIC12F1840

package:
  value: standards/SOIC8-3.90x4.90-P1.27
  src:
    - p395 "PRODUCT IDENTIFICATION SYSTEM, Package "SN = SOIC, 8-Lead""
    - p385 ""8-Lead Plastic Small Outline (SN) - Narrow, 3.90 mm Body [SOIC]", drawing C04-057C sheet 2 (rendered image)"

sources: [microchip/DS40001441@revF]
source: microchip/DS40001441@revF

# assembled from the legend, not printed verbatim
existence:
  status: probable
  src: 'p395 "Product Identification System legend: Device, Temperature Range I, Package SN"'

lifecycle: { status: unknown }

parameters:
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p305 "DC Characteristics: Operating temperature -40 <= TA <= +85 C for industrial (specified)"'
