# MPN assembled from the "Product Identification System" of
# microchip/DS22100@revF (page 25): device + temperature "I" (-40 C to +85 C) +
# package "ST" = "TSSOP, 8-lead". Example a) prints "23K256-I/ST".
# Package: drawing C04-086B (page 19); its table equals row by row the
# C04-086B table manufacturers/microchip/TSSOP8-ST-C04-086B was read from
# (DS21290F), so that package is reused.
# existence is probable: the legend is not an orderable list
# (openparts/skills/add-part section 2). lifecycle: no production-status
# statement in the datasheet -> unknown. The id replaces the "/" of the
# MPN with "-"; mpn keeps the real string.
schema_version: "0.2"
kind: part
id: microchip/23K256-I-ST
manufacturer: microchip
mpn: 23K256-I/ST
device: microchip/23K256

package:
  value: manufacturers/microchip/TSSOP8-ST-C04-086B
  src: p25 "Product Identification System, Package "ST = TSSOP, 8-lead""

sources: [microchip/DS22100@revF]
source: microchip/DS22100@revF

existence:
  status: probable
  src: p25 "Product Identification System (part-number legend; example given)"

lifecycle: { status: unknown }

parameters:
  operating_temperature:
    min: -40 °C
    max: 85 °C
    src: 'p2 "DC Characteristics header: Industrial (I) TA = -40 to +85 C (specified)"'
