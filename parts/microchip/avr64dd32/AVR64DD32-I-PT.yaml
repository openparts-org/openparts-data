# AVR64DD32-I/PT: 64 KB/8 KB, 32 pins, TQFP, -40°C to +85°C, tray. MPN
# printed verbatim in Table 40-1 "Available Product Numbers" (DS40002315C
# page 649) -> existence verified. Package "PT = TQFP32" (Figure 40-1,
# page 650) -> section 41 "32-Pin TQFP", drawing C04-074-PT Rev D (pages
# 667-668). Every number of its table matches standards/TQFP32-7x7-P0.8
# (built from C04-074B in DS40002061B): e 0.80 BSC, A max 1.20, A1
# 0.05-0.15, A2 0.95/1.00/1.05, L 0.45/0.60/0.75, E/D 9.00 BSC, E1/D1 7.00
# BSC, b 0.30/0.37/0.45 -> reused (validate with --source
# sources/microchip/DS40002061.yaml). The C04-074-PT Rev D table has no
# lead thickness c row; the package's c (0.09-0.20) comes from C04-074B.
# lifecycle: no production-status statement in the datasheet and the
# Microchip product page refused curl and WebFetch (403); unknown.
