# The datasheet has no ordering table and the MPN printed on it is the
# bare device name "AO3401A" (title, every page header). AOS's product page
# for it returned a 404 when checked, so existence is "probable": the
# current first-party datasheet exists, but no orderable-part listing
# was read. No lifecycle recorded (not stated in anything read).
# Package: datasheet page 1 says "SOT23"; AOS's SOT23 outline is
# PO-00001 (linked from aosmd.com/packaging), the datasheet itself does
# not name the outline document -- the link between them is by package
# name only.
schema_version: "0.2"
kind: part
id: aos/AO3401A
manufacturer: aos
mpn: AO3401A
device: aos/AO3401A
package: standards/SOT23-2.90x1.60-P1.90-AOS
sources: [aos/AO3401A-DS, aos/PO-00001]
source: aos/AO3401A-DS

existence:
  status: probable
  src: p1 "Title "AO3401A" and package "SOT23"; no ordering table in the document"

lifecycle: { status: unknown }

parameters:
