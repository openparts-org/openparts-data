  drain_source_voltage: { max: -30 V, src: 'p1 "Abs. Max. Ratings, VDS"' }
  drain_current:
    - { max: -4 A, at: { TA: 25 °C }, src: 'p1 "Abs. Max. Ratings, ID"' }
    - { max: -3.2 A, at: { TA: 70 °C }, src: 'p1 "Abs. Max. Ratings, ID"' }
  rds_on:
    - { typ: 41 mΩ, max: 50 mΩ, at: { VGS: -10 V, ID: -4 A }, src: 'p2 "Elec. Char., RDS(ON)"' }
