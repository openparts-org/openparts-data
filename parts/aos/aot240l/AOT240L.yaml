# AOT240L: printed verbatim in the page-1 "Orderable Part Number" table of
# AOS datasheet AOT240L (Rev 3.1: April 2024) -> existence verified.
# Lifecycle from the AOS product page (fetched 2026-11-14):
# "product_status":"Full Production" -> active.
# Package: datasheet "TO-220"; the product page links AOS's
# TO220 outline (PO-00015) as this product's package document.
schema_version: "0.2"
kind: part
id: aos/AOT240L
manufacturer: aos
mpn: AOT240L
device: aos/AOT240L

package:
  value: manufacturers/aos/TO220-10.03x4.45-P2.54-PO-00015
  src:
    - 'aos/AOT240L-product-page ""packages": "TO220", package_pdf .../packaging_information/TO220.pdf"'
    - aos/PO-00015 p1 ""TO220 PACKAGE OUTLINE" PO-00015 Version N"

sources: [aos/AOT240L-DS, aos/AOT240L-product-page, aos/PO-00015]
source: aos/AOT240L-DS

existence:
  status: verified
  src: 'p1 "Orderable Part Number table: "AOT240L | TO-220 | Tube | 1000""'

lifecycle:
  status: active
  src: aos/AOT240L-product-page "Embedded product JSON "product_status":"Full Production""

parameters:
  polarity:             { value: n_channel, src: p1 "Title" }
  drain_source_voltage: { max: 40 V, src: 'p1 "Abs. Max. Ratings, VDS"' }
  drain_current:
    - { max: 105 A, at: { TC: 25 °C }, src: 'p1 "Abs. Max. Ratings, ID, AOT240L/AOB240L column"' }
    - { max: 82 A, at: { TC: 100 °C }, src: 'p1 "Abs. Max. Ratings, ID, AOT240L/AOB240L column"' }
    - { max: 20 A, at: { TA: 25 °C }, src: 'p1 "Abs. Max. Ratings, IDSM"' }
    - { max: 16 A, at: { TA: 70 °C }, src: 'p1 "Abs. Max. Ratings, IDSM"' }
  rds_on:
    - typ: 2.4 mΩ
      max: 2.9 mΩ
      at: { VGS: 10 V, ID: 20 A }
      src: p2 "Elec. Char., RDS(ON), TO220/TO220F row"
    - typ: 3.7 mΩ
      max: 4.7 mΩ
      at: { VGS: 10 V, ID: 20 A, TJ: 125 °C }
      src: p2 "Elec. Char., RDS(ON), TO220/TO220F row"
    - typ: 3 mΩ
      max: 3.7 mΩ
      at: { VGS: 4.5 V, ID: 20 A }
      src: p2 "Elec. Char., RDS(ON), TO220/TO220F row"
  gate_threshold_voltage:
    min: 1 V
    typ: 1.7 V
    max: 2.2 V
    at: { ID: 250 µA }
    src: p2 "Elec. Char., VGS(th), VDS=VGS"
