# The datasheet has no ordering table; the MPN printed on it is the
# device name "AOD403" (title, every page). No orderable-part listing was
# read, so existence is "probable" (as aos/AO3400A). No lifecycle
# recorded. Package: datasheet page 1 says "TO252 DPAK"; AOS's TO252
# outline is PO-00009 (aosmd.com package path); the datasheet itself
# does not name the outline document -- linked by package name only.
schema_version: "0.2"
kind: part
id: aos/AOD403
manufacturer: aos
mpn: AOD403
device: aos/AOD403

package:
  value: manufacturers/aos/TO252-6.10x6.60-P2.29-PO-00009-TabPin4
  src: aos/PO-00009 p1 ""TO252 PACKAGE OUTLINE" PO-00009 Version X (linked by the datasheet's package name "TO252")"

sources: [aos/AOD403-DS, aos/PO-00009]
source: aos/AOD403-DS

existence:
  status: probable
  src: p1 "Title "AOD403" and package "TO252 DPAK"; no ordering table in the document"

lifecycle: { status: unknown }

