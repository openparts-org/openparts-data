# 10 uF, X7R, 10 V, +/-10%, 0805 commercial-grade MLCC, 7" reel unmarked (TU).
# MPN assembled from kemet/C1002_X7R PDF p2 'Ordering Information' code segments
# (C | 0805 | C | 106 | K | 8 | R | A | C | TU) and checked
# available in Table 1A (PDF p5, rendered and read as an image) with
# thickness code DH -> package manufacturers/kemet/C0805-DH-L2U2.
# The exact string is not printed in the datasheet (built from the code
# system). Lifecycle not stated -> unknown.
schema_version: "0.2"
kind: part
id: kemet/C0805C106K8RACTU
manufacturer: kemet
mpn: C0805C106K8RACTU
device: kemet/C0805C-X7R
package: manufacturers/kemet/C0805-DH-L2U2
sources: [kemet/C1002_X7R]
source: kemet/C1002_X7R

# existence is `probable`: the MPN is assembled from the part-numbering
# legend (or printed only as an example), not listed verbatim in an
# orderable list (openparts/skills/add-part section 2).
# existence p5 Table 1A: cell note 1 limits this rating to K and M
# tolerance, so K is allowed.
existence:
  status: probable
  src:
    - p2 "Ordering Information (part number code legend); Packaging C-Spec table"
    - p5 "Table 1A Capacitance Range/Selection Waterfall, row 10uF/106, column C0805C 10 V (code 8), note 1"
    - 'p2 "Packaging C-Spec Ordering Options Table: 7" Reel/Unmarked = TU"'

lifecycle: { status: unknown }

parameters:
  capacitance:   { typ: 10 µF, src: 'p5 "Table 1A (cont.), Cap Code 106 row"' }
  tolerance:     { tol: ±10 %, src: 'p2 "Ordering Information, Capacitance Tolerance: K = ±10%"' }
  rated_voltage: { typ: 10 V, src: 'p2 "Ordering Information, Rated Voltage (VDC): 8 = 10"' }
  dielectric:    { value: X7R, src: 'p2 "Ordering Information, Dielectric: R = X7R"' }
