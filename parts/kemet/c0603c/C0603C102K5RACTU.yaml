# 1000 pF, X7R, 50 V, +/-10%, 0603 commercial-grade MLCC, 7" reel unmarked (TU).
# MPN assembled from kemet/C1002_X7R PDF p2 'Ordering Information' code segments
# (C | 0603 | C | 102 | K | 5 | R | A | C | TU) and checked
# available in Table 1A (PDF p4, rendered and read as an image) with
# thickness code CF -> package manufacturers/kemet/C0603-CF.
# The exact string is not printed in the datasheet (built from the code
# system). Lifecycle not stated -> unknown.
schema_version: "0.2"
kind: part
id: kemet/C0603C102K5RACTU
manufacturer: kemet
mpn: C0603C102K5RACTU
device: kemet/C0603C-X7R
package: manufacturers/kemet/C0603-CF
sources: [kemet/C1002_X7R]
source: kemet/C1002_X7R

# existence is `probable`: the MPN is assembled from the part-numbering
# legend (or printed only as an example), not listed verbatim in an
# orderable list (openparts/skills/add-part section 2).
existence:
  status: probable
  src:
    - 'p2 "Ordering Information: C | case size | C = standard | capacitance code (two significant digits + number of zeros, pF) | J/K/M tolerance | voltage 9 = 6.3, 8 = 10, 4 = 16, 3 = 25, 5 = 50 | R = X7R | A = N/A | C = 100% matte Sn | TU = 7" reel/unmarked (Packaging C-Spec table)"'
    - 'p4 "Table 1A Capacitance Range/Selection Waterfall (0402-1206 Case Sizes): row 1000pF/102, C0603C column 50 V (code 5): CF; K tolerance listed"'
    - 'p2 "Packaging C-Spec Ordering Options Table: 7" Reel/Unmarked = TU"'

lifecycle: { status: unknown }

parameters:
  capacitance:
    typ: 1000 pF
    src: 'p4 "Table 1A – Capacitance Range/Selection Waterfall (0402 – 1206 Case Sizes), Cap Code 102 row: Cap 1000pF"'
  tolerance:     { tol: ±10 %, src: 'p2 "Ordering Information, Capacitance Tolerance: K = ±10%"' }
  rated_voltage: { typ: 50 V, src: 'p2 "Ordering Information, Rated Voltage (VDC): 5 = 50"' }
  dielectric:    { value: X7R, src: 'p2 "Ordering Information, Dielectric: R = X7R"' }
