# ESP32-C3FH4X supply decoupling from the ESP32-C3 Hardware Design
# Guidelines (Schematic Checklist, Power Supply; PCB Layout, Power
# Supply), single 3.3 V supply. VDD3P3 is the RF-related analog rail:
# 10 uF per pin (the layout section's "for each pin"; the checklist
# asks for 10 uF on the rail) fed through the LC filter the checklist
# asks for; the guide gives no inductance, only a preferred rated
# current. Pins the guide gives no value for (the rest of the analog
# pins) are left to the board ("refer to the Reference Schematic", not
# cited here). On the C3FH4X VDD_SPI powers the in-package flash
# (output, 3.3 V). Page numbers are PDF page indices of the ESP32-C3
# Hardware Design Guidelines (printed page = index - 3). AI candidate.
schema_version: "0.2"
kind: circuit
id: espressif/esp32-c3fh4x-power
title: ESP32-C3FH4X supply decoupling
host: espressif/ESP32-C3FH4X
source: espressif/esp32-c3_hardware_design_guidelines_en@rev1.8

conditions: { VDD_SPI: { typ: 3.3 V, src: 'p8 "1.3.2, Digital Power Supply"' } }

nets:
  GND:     { kind: ground }
  VDD_3V3: { kind: power, voltage: { typ: 3.3 V }, src: p8 "1.3.2" }
  VDD_RF:  { kind: local }

connect:
  GND:        { net: GND, level: required, src: p8 "1.3.2" }
  VDD3P3:     { net: VDD_RF, level: example, src: 'p8 "1.3.2, Analog Power Supply"' }
  VDD3P3_CPU: { net: VDD_3V3, level: example, src: p8 "1.3.2" }
  VDD3P3_RTC: { net: VDD_3V3, level: example, src: p8 "1.3.2" }
  VDDA:       { net: VDD_3V3, level: example, src: p8 "1.3.2" }

roles:
  C_VDD3P3:
    per_pin: VDD3P3
    requires:
      category: capacitor
      capacitance: { typ: 10 uF }
      src: ['p8 "1.3.2, Analog Power Supply"', p19 "1.4.2"]
    pins: { "1": $pin, "2": GND }
    place: { near: $pin, src: p19 "1.4.2" }
    level: { value: recommended, word: recommended, src: 'p8 "1.3.2, Analog Power Supply"' }
  C_VDD3P3_CPU:
    per_pin: VDD3P3_CPU
    requires:
      category: capacitor
      capacitance: { typ: 100 nF }
      src: p8 "1.3.2, Digital Power Supply"
    pins: { "1": $pin, "2": GND }
    place: { near: $pin, src: 'p8 "1.3.2, Digital Power Supply"' }
    level: { value: recommended, word: recommended, src: 'p8 "1.3.2, Digital Power Supply"' }
  C_VDD3P3_RTC:
    per_pin: VDD3P3_RTC
    requires:
      category: capacitor
      capacitance: { typ: 100 nF }
      src: p9 "1.3.2, RTC Power Supply"
    pins: { "1": $pin, "2": GND }
    place: { near: $pin, src: 'p9 "1.3.2, RTC Power Supply"' }
    level: { value: recommended, word: recommended, src: 'p9 "1.3.2, RTC Power Supply"' }
  C_VDD_SPI_1U:
    per_pin: VDD_SPI
    requires:
      category: capacitor
      capacitance: { typ: 1 uF }
      src: p8 "1.3.2, Digital Power Supply"
    pins: { "1": $pin, "2": GND }
    place: { near: $pin, src: 'p8 "1.3.2, Digital Power Supply"' }
    level: { value: recommended, word: recommended, src: 'p8 "1.3.2, Digital Power Supply"' }
  L_VDD3P3:
    requires:
      category: inductor
      rated_current: { min: 500 mA }
      src: p9 "1.3.2, Analog Power Supply"
    pins:  { "1": VDD_3V3, "2": VDD_RF }
    level: { value: recommended, src: 'p9 "1.3.2, Analog Power Supply"' }
