# The ESP32-C3FH4X single-3.3 V core circuit of the ESP32-C3 Hardware
# Design Guidelines' Schematic Checklist as a composite: supply
# decoupling, main crystal, CHIP_EN delay, strapping/UART0 and USB,
# plus the bulk capacitor at the power entrance (merged with the
# VDD3P3 10 uF when the entrance is close to it). Flash, RF matching,
# the optional 32.768 kHz crystal (esp32-c3fh4x-xtal-32k), ESD diodes
# and connectors are left to the board. Page numbers are PDF page
# indices of the ESP32-C3 Hardware Design Guidelines (printed page =
# index - 3). AI candidate.
schema_version: "0.2"
kind: circuit
id: espressif/esp32-c3fh4x-minimal
title: ESP32-C3FH4X minimal circuit
host: espressif/ESP32-C3FH4X
source: espressif/esp32-c3_hardware_design_guidelines_en@rev1.8

nets:
  3V3:     { kind: power, voltage: { typ: 3.3 V }, src: p8 "1.3.2" }
  CHIP_EN: { kind: signal }
  GND:     { kind: ground }
  U0TXD:   { kind: signal }
  USB_DM:  { kind: signal }
  USB_DP:  { kind: signal }

roles:
  C_BULK_IN:
    requires: { category: capacitor, capacitance: { min: 10 uF }, src: p8 "1.3.2" }
    pins:     { "1": 3V3, "2": GND }
    level:    { value: recommended, src: p8 "1.3.2" }

includes:
  - { circuit: espressif/esp32-c3fh4x-power, with: { GND: GND, VDD_3V3: 3V3 }, src: p8 "1.3.2" }
  - { circuit: espressif/esp32-c3fh4x-xtal-40mhz, with: { GND: GND }, src: p11 "1.3.5" }
  - circuit: espressif/esp32-c3fh4x-chip-en
    with: { CHIP_EN: CHIP_EN, GND: GND, VDD_3V3: 3V3 }
    src: p10 "1.3.3"
  - { circuit: espressif/esp32-c3fh4x-boot, with: { U0TXD: U0TXD, VDD_3V3: 3V3 }, src: p14 "1.3.9" }
  - circuit: espressif/esp32-c3fh4x-usb
    with: { GND: GND, USB_DM: USB_DM, USB_DP: USB_DP, VDD_3V3: 3V3 }
    src: p17 "1.3.12"
