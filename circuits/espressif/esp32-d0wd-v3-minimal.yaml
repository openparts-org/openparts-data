# The ESP32-D0WD-V3 single-3.3 V core circuit of the ESP32 Hardware
# Design Guidelines' Schematic Checklist as a composite: supply
# decoupling, main crystal, CHIP_PU delay, strapping/UART0, plus the
# bulk capacitor at the power entrance (merged with the VDD3P3 10 uF
# when the entrance is close to it). Flash, RF matching, the optional
# 32.768 kHz crystal (esp32-d0wd-v3-xtal-32k), ESD diodes and
# connectors are left to the board. Page numbers are PDF page indices
# of the ESP32 Hardware Design Guidelines (printed page = index - 3).
# AI candidate.
schema_version: "0.2"
kind: circuit
id: espressif/esp32-d0wd-v3-minimal
title: ESP32-D0WD-V3 minimal circuit
host: espressif/ESP32-D0WD-V3
source: espressif/esp32_hardware_design_guidelines_en@rev1.9

nets:
  3V3:     { kind: power, voltage: { typ: 3.3 V }, src: p9 "1.3.2" }
  CHIP_PU: { kind: signal }
  GND:     { kind: ground }
  U0TXD:   { kind: signal }

roles:
  C_BULK_IN:
    requires: { category: capacitor, capacitance: { min: 10 uF }, src: p9 "1.3.2" }
    pins:     { "1": 3V3, "2": GND }
    level:    { value: recommended, src: p9 "1.3.2" }

includes:
  - { circuit: espressif/esp32-d0wd-v3-power, with: { GND: GND, VDD_3V3: 3V3 }, src: p10 "1.3.2" }
  - { circuit: espressif/esp32-d0wd-v3-xtal-40mhz, with: { GND: GND }, src: p12 "1.3.5" }
  - circuit: espressif/esp32-d0wd-v3-chip-pu
    with: { CHIP_PU: CHIP_PU, GND: GND, VDD_3V3: 3V3 }
    src: p11 "1.3.3"
  - circuit: espressif/esp32-d0wd-v3-boot
    with: { U0TXD: U0TXD, VDD_3V3: 3V3 }
    src: p16 "1.3.9"
