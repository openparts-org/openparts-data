# The ESP32-H2 single-3.3 V core circuit of the ESP32-H2 Hardware
# Design Guidelines' Schematic Checklist as a composite: supply
# decoupling, main crystal, CHIP_EN delay, strapping/UART0 and USB,
# plus the bulk capacitor at the power entrance (merged with the
# VDD3P3 10 uF when the entrance is close to it). Flash, RF matching,
# the optional 32.768 kHz crystal (esp32-h2-xtal-32k), ESD diodes and
# connectors are left to the board. Page numbers are PDF page indices
# of the ESP32-H2 Hardware Design Guidelines (printed page = index -
# 3). AI candidate.
schema_version: "0.2"
kind: circuit
id: espressif/esp32-h2-minimal
title: ESP32-H2 minimal circuit
host: espressif/ESP32-H2
source: espressif/esp32-h2_hardware_design_guidelines_en@rev1.6

nets:
  3V3:     { kind: power, voltage: { typ: 3.3 V }, src: p7 "1.3.2" }
  CHIP_EN: { kind: signal }
  GND:     { kind: ground }
  U0TXD:   { kind: signal }
  USB_DM:  { kind: signal }
  USB_DP:  { kind: signal }

roles:
  C_BULK_IN:
    requires: { category: capacitor, capacitance: { min: 10 uF }, src: p7 "1.3.2" }
    pins:     { "1": 3V3, "2": GND }
    level:    { value: recommended, src: p7 "1.3.2" }

includes:
  - { circuit: espressif/esp32-h2-power, with: { GND: GND, VDD_3V3: 3V3 }, src: p9 "1.3.2" }
  - { circuit: espressif/esp32-h2-xtal-32mhz, with: { GND: GND }, src: p10 "1.3.5" }
  - circuit: espressif/esp32-h2-chip-en
    with: { CHIP_EN: CHIP_EN, GND: GND, VDD_3V3: 3V3 }
    src: p10 "1.3.3"
  - { circuit: espressif/esp32-h2-boot, with: { U0TXD: U0TXD, VDD_3V3: 3V3 }, src: p14 "1.3.9" }
  - circuit: espressif/esp32-h2-usb
    with: { GND: GND, USB_DM: USB_DM, USB_DP: USB_DP, VDD_3V3: 3V3 }
    src: p16 "1.3.12"
