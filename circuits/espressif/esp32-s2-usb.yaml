# ESP32-S2 USB pins (GPIO19 D-, GPIO20 D+) from the ESP32-S2 Hardware
# Design Guidelines, USB: series resistors (initial value 22 or 33 Ω)
# and footprints for capacitors to ground, initially unpopulated, all
# close to the chip. The D+ pull-up is only for a stable D+ level at
# power-up, when the application needs one (no value given).
# USB_DP/USB_DM are the connector side. Page numbers are PDF page
# indices of the ESP32-S2 Hardware Design Guidelines (printed page =
# index - 3). AI candidate.
schema_version: "0.2"
kind: circuit
id: espressif/esp32-s2-usb
title: ESP32-S2 USB series termination
host: espressif/ESP32-S2
source: espressif/esp32-s2_hardware_design_guidelines_en@rev1.6

nets:
  GND:     { kind: ground }
  USB_DM:  { kind: signal }
  USB_DP:  { kind: signal }
  VDD_3V3: { kind: power, voltage: { typ: 3.3 V }, src: p8 "1.3.2" }

roles:
  C_DM:
    requires: { category: capacitor, src: p19 "1.3.12" }
    pins:     { "1": host.GPIO19, "2": GND }
    place:    { near: host.GPIO19, src: p19 "1.3.12" }
    level:    { value: optional, word: can, src: p19 "1.3.12" }
  C_DP:
    requires: { category: capacitor, src: p19 "1.3.12" }
    pins:     { "1": host.GPIO20, "2": GND }
    place:    { near: host.GPIO20, src: p19 "1.3.12" }
    level:    { value: optional, word: can, src: p19 "1.3.12" }
  R_DM:
    requires: { category: resistor, resistance: { min: 22 Ω, max: 33 Ω }, src: p19 "1.3.12" }
    pins:     { "1": host.GPIO19, "2": USB_DM }
    place:    { near: host.GPIO19, src: p19 "1.3.12" }
    level:    { value: recommended, word: recommended, src: p19 "1.3.12" }
  R_DP:
    requires: { category: resistor, resistance: { min: 22 Ω, max: 33 Ω }, src: p19 "1.3.12" }
    pins:     { "1": host.GPIO20, "2": USB_DP }
    place:    { near: host.GPIO20, src: p19 "1.3.12" }
    level:    { value: recommended, word: recommended, src: p19 "1.3.12" }
  R_DP_PU:
    requires: { category: resistor, src: p19 "1.3.12" }
    pins:     { "1": VDD_3V3, "2": host.GPIO20 }
    level:    { value: optional, src: p19 "1.3.12" }
