# ESP32-D0WD-V3 optional 32.768 kHz RTC clock crystal from the ESP32
# Hardware Design Guidelines, Clock Source. Load capacitors follow the
# crystal's specification (no value in the guide). The bias resistor
# must be fitted on chip revision v3.0 and later (the D0WD-V3 is v3);
# revisions v1.0/v1.1 should not use a 32.768 kHz crystal at all.
# Unused, the two pins are GPIOs. Page numbers are PDF page indices of
# the ESP32 Hardware Design Guidelines (printed page = index - 3). AI
# candidate.
schema_version: "0.2"
kind: circuit
id: espressif/esp32-d0wd-v3-xtal-32k
title: ESP32-D0WD-V3 32.768 kHz crystal
host: espressif/ESP32-D0WD-V3
source: espressif/esp32_hardware_design_guidelines_en@rev1.9

nets: { GND: { kind: ground } }

roles:
  C_32K_XN:
    requires: { category: capacitor, src: p13 "1.3.5" }
    pins:     { "1": host.32K_XN, "2": GND }
    level:    { value: recommended, word: should, src: p13 "1.3.5" }
  C_32K_XP:
    requires: { category: capacitor, src: p13 "1.3.5" }
    pins:     { "1": host.32K_XP, "2": GND }
    level:    { value: recommended, word: should, src: p13 "1.3.5" }
  R_BIAS:
    requires: { category: resistor, resistance: { min: 5 MΩ, max: 10 MΩ }, src: p13 "1.3.5" }
    pins:     { "1": host.32K_XP, "2": host.32K_XN }
    level:    { value: required, word: must, src: p13 "1.3.5" }
  X2:
    requires:
      category: crystal
      esr: { max: 70 kΩ }
      frequency: { typ: 32.768 kHz }
      src: p13 "1.3.5"
    pins:  { "1": host.32K_XP, "2": host.32K_XN }
    level: { value: optional, word: optional, src: p12 "1.3.5" }
