# ESP32-H2 supply decoupling from the ESP32-H2 Hardware Design
# Guidelines (Schematic Checklist, Power Supply; PCB Layout, Power
# Supply), single 3.3 V supply. VDD3P3 is the RF-related analog rail:
# 10 uF per pin (the layout section's "for each pin"; the checklist
# asks for 10 uF on the rail). Pins the guide gives no value for (the
# rest of the analog pins) are left to the board ("refer to the
# Reference Schematic", not cited here). VBAT is left to the board:
# the guide's VBAT supply option refers to a reference-schematic
# resistor without a value in the text. Page numbers are PDF page
# indices of the ESP32-H2 Hardware Design Guidelines (printed page =
# index - 3). AI candidate.
schema_version: "0.2"
kind: circuit
id: espressif/esp32-h2-power
title: ESP32-H2 supply decoupling
host: espressif/ESP32-H2
source: espressif/esp32-h2_hardware_design_guidelines_en@rev1.6

nets:
  GND:     { kind: ground }
  VDD_3V3: { kind: power, voltage: { typ: 3.3 V }, src: p7 "1.3.2" }

connect:
  GND:      { net: GND, level: required, src: p7 "1.3.2" }
  VDD3P3:   { net: VDD_3V3, level: example, src: 'p9 "1.3.2, Analog Power Supply"' }
  VDDA_PMU: { net: VDD_3V3, level: example, src: p7 "1.3.2" }
  VDDPST1:  { net: VDD_3V3, level: example, src: p7 "1.3.2" }
  VDDPST2:  { net: VDD_3V3, level: example, src: p7 "1.3.2" }

roles:
  C_VDD3P3:
    requires:
      category: capacitor
      capacitance: { typ: 10 uF }
      src: p9 "1.3.2, Analog Power Supply"
    pins:  { "1": VDD_3V3, "2": GND }
    level: { value: recommended, word: recommended, src: 'p9 "1.3.2, Analog Power Supply"' }
  C_VDDPST1:
    per_pin: VDDPST1
    requires:
      category: capacitor
      capacitance: { typ: 100 nF }
      src: p9 "1.3.2, Digital Power Supply"
    pins: { "1": $pin, "2": GND }
    place: { near: $pin, src: 'p9 "1.3.2, Digital Power Supply"' }
    level: { value: recommended, word: recommended, src: 'p9 "1.3.2, Digital Power Supply"' }
  C_VDDPST2:
    per_pin: VDDPST2
    requires:
      category: capacitor
      capacitance: { typ: 100 nF }
      src: p9 "1.3.2, Digital Power Supply"
    pins: { "1": $pin, "2": GND }
    place: { near: $pin, src: 'p9 "1.3.2, Digital Power Supply"' }
    level: { value: recommended, word: recommended, src: 'p9 "1.3.2, Digital Power Supply"' }
