# ESP8684 supply decoupling from the ESP32-C2 Hardware Design
# Guidelines (Schematic Checklist, Power Supply; PCB Layout, Power
# Supply), single 3.3 V supply. VDDA3P3 is the RF-related analog rail:
# 10 uF per pin (the layout section's "for each pin"; the checklist
# asks for 10 uF on the rail) fed through the LC filter the checklist
# asks for; the guide gives no inductance, only a preferred rated
# current. Pins the guide gives no value for (the rest of the analog
# pins) are left to the board ("refer to the Reference Schematic", not
# cited here). Page numbers are PDF page indices of the ESP32-C2
# Hardware Design Guidelines (printed page = index - 3). AI candidate.
schema_version: "0.2"
kind: circuit
id: espressif/esp8684-power
title: ESP8684 supply decoupling
host: espressif/ESP8684
source: espressif/esp8684_hardware_design_guidelines_en@rev1.7

nets:
  GND:     { kind: ground }
  VDD_3V3: { kind: power, voltage: { typ: 3.3 V }, src: p7 "1.3.2" }
  VDD_RF:  { kind: local }

connect:
  GND:        { net: GND, level: required, src: p7 "1.3.2" }
  VDD3P3_CPU: { net: VDD_3V3, level: example, src: p7 "1.3.2" }
  VDD3P3_RTC: { net: VDD_3V3, level: example, src: p7 "1.3.2" }
  VDDA:       { net: VDD_3V3, level: example, src: p7 "1.3.2" }
  VDDA3P3:    { net: VDD_RF, level: example, src: 'p9 "1.3.2, Analog Power Supply"' }

roles:
  C_VDD3P3_CPU:
    per_pin: VDD3P3_CPU
    requires:
      category: capacitor
      capacitance: { typ: 100 nF }
      src: p9 "1.3.2, Digital Power Supply"
    pins: { "1": $pin, "2": GND }
    place: { near: $pin, src: 'p9 "1.3.2, Digital Power Supply"' }
    level: { value: recommended, word: recommended, src: 'p9 "1.3.2, Digital Power Supply"' }
  C_VDD3P3_RTC:
    per_pin: VDD3P3_RTC
    requires:
      category: capacitor
      capacitance: { typ: 100 nF }
      src: p10 "1.3.2, RTC Power Supply"
    pins: { "1": $pin, "2": GND }
    place: { near: $pin, src: 'p10 "1.3.2, RTC Power Supply"' }
    level: { value: recommended, word: recommended, src: 'p10 "1.3.2, RTC Power Supply"' }
  C_VDDA3P3:
    per_pin: VDDA3P3
    requires:
      category: capacitor
      capacitance: { typ: 10 uF }
      src: ['p9 "1.3.2, Analog Power Supply"', p18 "1.4.2"]
    pins: { "1": $pin, "2": GND }
    place: { near: $pin, src: p18 "1.4.2" }
    level: { value: recommended, word: recommended, src: 'p9 "1.3.2, Analog Power Supply"' }
  L_VDDA3P3:
    requires:
      category: inductor
      rated_current: { min: 500 mA }
      src: p9 "1.3.2, Analog Power Supply"
    pins:  { "1": VDD_3V3, "2": VDD_RF }
    level: { value: recommended, src: 'p9 "1.3.2, Analog Power Supply"' }
