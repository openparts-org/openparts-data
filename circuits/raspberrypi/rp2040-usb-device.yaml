# RP2040 USB full-speed pins: the 27 Ω series resistors (RP2040
# Datasheet 1.4.2; pull-ups and pull-downs are internal) and the
# minimal design's line impedance (Hardware design with RP2040 2.4.1).
# USB_DP/USB_DM are the connector side. AI candidate.
schema_version: "0.2"
kind: circuit
id: raspberrypi/rp2040-usb-device
title: RP2040 USB series termination
host: raspberrypi/RP2040
source: raspberrypi/RP-008371-DS@rev1

nets:
  GND:    { kind: ground }
  USB_DM: { kind: signal }
  USB_DP: { kind: signal }

roles:
  R_DM:
    requires: { category: resistor, resistance: { typ: 27 Ω }, src: 'p12 "1.4.2, USB_DM"' }
    pins:     { "1": host.USB_DM, "2": USB_DM }
    place:    { near: host.USB_DM, src: raspberrypi/RP-008279-DS@rev2 p12 "2.4.1" }
    level:    { value: required, word: required, src: 'p12 "1.4.2, USB_DM"' }
  R_DP:
    requires: { category: resistor, resistance: { typ: 27 Ω }, src: 'p12 "1.4.2, USB_DP"' }
    pins:     { "1": host.USB_DP, "2": USB_DP }
    place:    { near: host.USB_DP, src: raspberrypi/RP-008279-DS@rev2 p12 "2.4.1" }
    level:    { value: required, word: required, src: 'p12 "1.4.2, USB_DP"' }

routing:
  - diff_pair: [USB_DP, USB_DM]
    impedance: { typ: 90 Ω }
    reference_plane: GND
    example: { width: { typ: 0.8 mm }, gap: { typ: 0.15 mm }, board_thickness: { typ: 1 mm } }
    src: raspberrypi/RP-008279-DS@rev2 p12 "2.4.1"
