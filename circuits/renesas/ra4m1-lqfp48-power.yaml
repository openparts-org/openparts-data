# RA4M1 (LQFP48) supply: about 0.1 uF at every supply pin pair and 4.7 uF
# from VCL to VSS, as close to the pins as possible (datasheet Table 2.1,
# Caution). VCC's 0.1 uF carries the pin table's "should" and VCL's the
# "must"; the others are imperatives without a modal word and are
# recorded as examples. The VREF capacitors apply when those port pins
# are used as references. VCC_USB tied to VCC is the case without the
# USB LDO (Quick Design Guide Table 1 note 1). AI candidate.
schema_version: "0.2"
kind: circuit
id: renesas/ra4m1-lqfp48-power
title: RA4M1 (LQFP48) supply decoupling
host: renesas/R7FA4M1AB-LQFP48
source: renesas/R01DS0355EJ0110

nets:
  GND: { kind: ground }
  VCC: { kind: power }

connect:
  AVCC0:   { net: VCC, level: example, src: renesas/R01AN5988EU0104 p6 "Table 2" }
  AVSS0:   { net: GND, level: example, src: renesas/R01AN5988EU0104 p6 "Table 2" }
  VCC:     { net: VCC, level: example, src: 'p12 "Table 1.15, VCC"' }
  VCC_USB: { net: VCC, level: example, src: 'renesas/R01AN5988EU0104 p5 "Table 1, note 1"' }
  VSS:     { net: GND, level: example, src: 'p12 "Table 1.15, VSS"' }
  VSS_USB: { net: GND, level: example, src: renesas/R01AN5988EU0104 p5 "Table 1" }

roles:
  C_AVCC0:
    requires: { category: capacitor, capacitance: { typ: 100 nF }, src: 'p28 "Table 2.1, Caution"' }
    pins: { "1": host.AVCC0, "2": GND }
    place: { near: host.AVCC0, src: 'p28 "Table 2.1, Caution"' }
    level: example
    src: p28 "Table 2.1, Caution"
  C_VCC:
    per_pin: VCC
    requires:
      category: capacitor
      capacitance: { typ: 100 nF }
      src: ['p12 "Table 1.15, VCC"', 'p28 "Table 2.1, Caution"']
    pins: { "1": $pin, "2": GND }
    place: { near: $pin, src: 'p12 "Table 1.15, VCC"' }
    level: { value: recommended, word: should, src: 'p12 "Table 1.15, VCC"' }
  C_VCC_USB:
    requires:
      category: capacitor
      capacitance: { typ: 100 nF }
      src: ['p28 "Table 2.1, Caution"', renesas/R01AN5988EU0104 p5 "Table 1"]
    pins: { "1": host.VCC_USB, "2": GND }
    place: { near: host.VCC_USB, src: renesas/R01AN5988EU0104 p5 "Table 1" }
    level: example
    src: p28 "Table 2.1, Caution"
  C_VCL:
    requires: { category: capacitor, capacitance: { typ: 4.7 uF }, src: 'p28 "Table 2.1, Caution"' }
    pins:     { "1": host.VCL, "2": GND }
    place:    { near: host.VCL, src: 'p28 "Table 2.1, Caution"' }
    level:    { value: required, word: must, src: 'p28 "Table 2.1, Caution"' }
  C_VREF:
    requires: { category: capacitor, capacitance: { typ: 100 nF }, src: 'p28 "Table 2.1, Caution"' }
    pins: { "1": host.P012/VREFH, "2": host.P013/VREFL }
    place: { near: host.P012/VREFH, src: 'p28 "Table 2.1, Caution"' }
    level: example
    src: p28 "Table 2.1, Caution"
  C_VREF0:
    requires: { category: capacitor, capacitance: { typ: 100 nF }, src: 'p28 "Table 2.1, Caution"' }
    pins: { "1": host.P010/VREFH0, "2": host.P011/VREFL0 }
    place: { near: host.P010/VREFH0, src: 'p28 "Table 2.1, Caution"' }
    level: example
    src: p28 "Table 2.1, Caution"
