# AVR128DA28/48 32.768 kHz crystal on XTAL32K1 (PF0) / XTAL32K2 (PF1),
# AVR DA data sheet 4.5.1, Figure 4-5. The data sheet gives no load
# capacitor or RS values (choose them for the crystal); RS "may be
# required" against overdrive. Layout rules: 4.5. AI candidate.
schema_version: "0.2"
kind: circuit
id: microchip/avr128da-xosc32k
title: AVR128DA 32.768 kHz crystal

host: { devices: [microchip/AVR128DA28, microchip/AVR128DA48] }

source: microchip/DS40002183@revE

nets:
  GND:      { kind: ground }
  XTAL_OUT: { kind: local }

roles:
  C1:
    requires: { category: capacitor, src: 'p24 "Figure 4-5, C1"' }
    pins:     { "1": host.PF0, "2": GND }
    place:    { near: X1, src: p23 "4.5" }
    level:    { value: recommended, word: recommended, src: p24 "Figure 4-5" }
  C2:
    requires: { category: capacitor, src: 'p24 "Figure 4-5, C2"' }
    pins:     { "1": XTAL_OUT, "2": GND }
    place:    { near: X1, src: p23 "4.5" }
    level:    { value: recommended, word: recommended, src: p24 "Figure 4-5" }
  R_S:
    requires: { category: resistor, src: 'p24 "4.5.1, RS"' }
    pins:     { "1": XTAL_OUT, "2": host.PF1 }
    level:    { value: optional, word: may, src: p24 "4.5.1" }
  X1:
    requires: { category: crystal, frequency: { typ: 32.768 kHz }, src: p24 "Figure 4-5" }
    pins:     { "1": host.PF0, "2": XTAL_OUT }
    level:    { value: recommended, word: recommended, src: p24 "Figure 4-5" }

placement:
  - src:        p23 "4.5"
    keep_short: [host.PF0, host.PF1, XTAL_OUT]
    level:      { value: required, word: must }
