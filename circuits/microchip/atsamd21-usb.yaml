# SAM D21 USB device pins (Schematic Checklist 45.8): D- on PA24, D+ on
# PA25 (Table 7-1), routed as a matched differential pair (Table 45-12,
# no impedance value given) and the recommended RC filter between the
# connector shield and board ground (Figure 45-15: 1 MOhm, 4.5 nF in
# parallel). Series resistors are not listed by the checklist. ESD
# suppressors on D+/D-/VBUS are recommended but not specified, so not
# included. USB_DP/USB_DM/SHIELD are the connector side. AI candidate.
schema_version: "0.2"
kind: circuit
id: microchip/atsamd21-usb
title: SAM D21 USB device interface

host: { devices: [microchip/ATSAMD21G18A, microchip/ATSAMD21E18A] }

source: microchip/DS40001882@revL

nets:
  GND:    { kind: ground }
  SHIELD: { kind: signal }
  USB_DM: { kind: signal }
  USB_DP: { kind: signal }

connect:
  PA24: { net: USB_DM, level: required, src: p29 "Table 7-1" }
  PA25: { net: USB_DP, level: required, src: p29 "Table 7-1" }

roles:
  C_SHIELD:
    requires: { category: capacitor, capacitance: { typ: 4.5 nF }, src: p1135 "Figure 45-15" }
    pins:     { "1": SHIELD, "2": GND }
    level:    { value: recommended, word: recommended, src: p1135 "45.8" }
  R_SHIELD:
    requires: { category: resistor, resistance: { typ: 1 MΩ }, src: p1135 "Figure 45-15" }
    pins:     { "1": SHIELD, "2": GND }
    level:    { value: recommended, word: recommended, src: p1135 "45.8" }

routing:
  - { diff_pair: [USB_DP, USB_DM], reference_plane: GND, src: p1134 "Table 45-12" }
