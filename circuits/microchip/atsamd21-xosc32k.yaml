# SAM D21 32.768 kHz crystal on XIN32 (PA00) / XOUT32 (PA01), Schematic
# Checklist 45.5.3, Figure 45-9: external load capacitors CLEXT are
# recommended (no value: compute from the crystal's CL with the
# equation of 37.13.1.2; the pin parasitics differ by device variant,
# Tables 37-50/37-51). The crystal's CL must be within 12.5 pF max.
# Maximum ESR differs between tables (141 kOhm variant A, 100 kOhm
# variants B/C/D/L, 313 kOhm in Table 45-6) and is not recorded.
# AI candidate.
schema_version: "0.2"
kind: circuit
id: microchip/atsamd21-xosc32k
title: SAM D21 32.768 kHz crystal

host: { devices: [microchip/ATSAMD21G18A, microchip/ATSAMD21E18A] }

source: microchip/DS40001882@revL

nets: { GND: { kind: ground } }

roles:
  C_XIN32:
    requires: { category: capacitor, src: p1130 "Table 45-7" }
    pins:     { "1": host.PA00, "2": GND }
    level:    { value: recommended, word: recommended, src: p1130 "45.5.3" }
  C_XOUT32:
    requires: { category: capacitor, src: p1130 "Table 45-7" }
    pins:     { "1": host.PA01, "2": GND }
    level:    { value: recommended, word: recommended, src: p1130 "45.5.3" }
  X1:
    requires:
      category: crystal
      frequency: { typ: 32.768 kHz }
      load_capacitance: { max: 12.5 pF }
      src: [p933 "37.13.2.1.1", 'p933 "Table 37-50, CL"']
    pins:  { "1": host.PA00, "2": host.PA01 }
    level: { value: required, word: must, src: p933 "37.13.2.1.1" }
