# ATmega32U4 RESET per AN2519 section 3, Figure 3-1: pull-up (4.7 kOhm
# or larger), optional filter capacitor and ESD diode to VCC (for
# designs without high-voltage programming). AI candidate.
schema_version: "0.2"
kind: circuit
id: microchip/atmega32u4-reset
title: ATmega32U4 reset pin
host: microchip/ATmega32U4
source: microchip/DS00002519@revB

nets:
  GND:   { kind: ground }
  RESET: { kind: signal }
  VCC:   { kind: power }

connect: { RESET: { net: RESET, level: example, src: p7 "Figure 3-1" } }

roles:
  C_RESET:
    requires: { category: capacitor, capacitance: { typ: 100 nF }, src: p7 "Figure 3-1" }
    pins:     { "1": RESET, "2": GND }
    place:    { near: host.RESET, src: p7 "3" }
    level:    { value: optional, src: p7 "3" }
  D_RESET:
    requires: { category: diode, src: p7 "3" }
    pins:     { A: RESET, K: VCC }
    place:    { near: host.RESET, src: p7 "3" }
    level:    { value: recommended, word: recommended, src: p7 "3" }
  R_RESET:
    requires: { category: resistor, resistance: { min: 4.7 kΩ }, src: p7 "3" }
    pins:     { "1": VCC, "2": RESET }
    place:    { near: host.RESET, src: p7 "3" }
    level:    { value: recommended, word: recommended, src: p7 "3" }
