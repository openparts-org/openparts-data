# 10-pin Cortex Debug Connector of Figure 45-11 (SWDIO PA31). Table 45-9
# lists 15 kOhm pull-ups on SWDCLK and SWDIO for that connector, which
# disagrees with Table 45-8's 1 kOhm; only the 1 kOhm SWCLK pull-up is
# recorded here (needs review). AI candidate.
