# ATSAMD21G18A external reset circuit (Schematic Checklist 45.4, Figure
# 45-4): optional pull-up (RESET has an internal one), filter capacitor
# and a resistor in series with the reset switch. Values are "typical
# examples"; the RC filter on RESET is called critical in noisy
# environments (45.1.1). Table 45-3 lists the EFT variant's values
# (Figure 45-5: 2.2 kOhm, 100 pF), not used here. The circuit is not
# needed when nothing drives RESET low (45.4). AI candidate.
schema_version: "0.2"
kind: circuit
id: microchip/atsamd21g18a-reset
title: ATSAMD21G18A external reset circuit
host: microchip/ATSAMD21G18A
source: microchip/DS40001882@revL

nets:
  GND:   { kind: ground }
  RESET: { kind: signal }
  SW_RS: { kind: local }
  VDD:   { kind: power }

connect: { RESET: { net: RESET, level: example, src: p1128 "Figure 45-4" } }

roles:
  C_RESET:
    requires: { category: capacitor, capacitance: { typ: 100 nF }, src: p1128 "Figure 45-4" }
    pins:     { "1": RESET, "2": GND }
    level:    { value: required, word: must, src: p1125 "45.1.1" }
  R_PULLUP:
    requires: { category: resistor, resistance: { typ: 10 kΩ }, src: p1128 "Figure 45-4" }
    pins:     { "1": VDD, "2": RESET }
    level:    { value: optional, word: optional, src: p1127 "45.4" }
  R_SW:
    requires: { category: resistor, resistance: { typ: 330 Ω }, src: p1128 "Figure 45-4" }
    pins:     { "1": RESET, "2": SW_RS }
    level:    { value: example, src: p1128 "Figure 45-4" }
  SW_RESET:
    requires: { category: switch, src: p1128 "Figure 45-4" }
    pins:     { "1": SW_RS, "2": GND }
    level:    { value: example, src: p1127 "45.4" }
