# ATmega328P RESET (PC6) per AN2519 section 3, Figure 3-1: pull-up,
# optional filter capacitor and ESD diode to VCC. The pull-up minimum is
# the data sheet's debugWIRE rule (25.3, "must not be smaller than
# 10k"); AN2519 otherwise gives 4.7 kOhm or larger. The capacitor must
# be removed for debugWIRE (25.3); the diode is for designs without
# high-voltage programming (AN2519 3). AI candidate.
schema_version: "0.2"
kind: circuit
id: microchip/atmega328p-reset
title: ATmega328P reset pin

host: { devices: [microchip/ATmega328P, microchip/ATmega328P-SPDIP28] }

source: microchip/DS00002519@revB

nets:
  GND:   { kind: ground }
  RESET: { kind: signal }
  VCC:   { kind: power }

connect: { PC6: { net: RESET, level: example, src: p7 "Figure 3-1" } }

roles:
  C_RESET:
    requires: { category: capacitor, capacitance: { typ: 100 nF }, src: p7 "Figure 3-1" }
    pins:     { "1": RESET, "2": GND }
    place:    { near: host.PC6, src: p7 "3" }
    level:    { value: optional, src: p7 "3" }
  D_RESET:
    requires: { category: diode, src: p7 "3" }
    pins:     { A: RESET, K: VCC }
    place:    { near: host.PC6, src: p7 "3" }
    level:    { value: recommended, word: recommended, src: p7 "3" }
  R_RESET:
    requires:
      category: resistor
      resistance: { min: 10 kΩ }
      src: microchip/DS40002061@revB p263 "25.3"
    pins:  { "1": VCC, "2": RESET }
    place: { near: host.PC6, src: p7 "3" }
    level: { value: recommended, word: recommended, src: p7 "3" }
