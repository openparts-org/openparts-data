# PIC12F1840 ICSP programming connection: the PICkit-style 6-pin
# 0.100" header of data sheet Figure 28-3 (1 VPP/MCLR, 2 VDD, 3 VSS,
# 4 ICSPDAT, 5 ICSPCLK, 6 not connected) on MCLR/VPP (RA3), ICSPDAT
# (RA0) and ICSPCLK (RA1). Isolating the programming pins from other
# circuitry is recommended (28.3, Figure 28-4) but the isolation type
# is application dependent, so none is recorded. AI candidate.
