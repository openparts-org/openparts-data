# MSP430FR2433 32.768 kHz crystal on XIN/XOUT. The datasheet requires
# external capacitors at both pins but gives no value: they are sized
# for the crystal's effective load capacitance, of which the device
# supports several (XT1 table). AI candidate.
schema_version: "0.2"
kind: circuit
id: ti/msp430fr2433-lfxt
title: MSP430FR2433 32 kHz crystal oscillator
host: ti/MSP430FR2433
source: ti/SLASE59F

nets: { GND: { kind: ground } }

roles:
  C_XIN:
    requires: { category: capacitor, src: 'p23 "Table 5-4, note 6"' }
    pins:     { "1": host.P2.1/XIN, "2": GND }
    level:    { value: required, word: required, src: p70 "7.1.2" }
  C_XOUT:
    requires: { category: capacitor, src: 'p23 "Table 5-4, note 6"' }
    pins:     { "1": host.P2.0/XOUT, "2": GND }
    level:    { value: required, word: required, src: p70 "7.1.2" }
  X1:
    requires: { category: crystal, frequency: { typ: 32.768 kHz }, src: 'p23 "Table 5-4, fXT1,LF"' }
    pins: { "1": host.P2.1/XIN, "2": host.P2.0/XOUT }
    level: example
    src: p70 "7.1.2"
