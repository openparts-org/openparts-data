# MSP430FR2355 32.768 kHz crystal on XIN/XOUT. The datasheet requires
# external capacitors at both pins but gives no value: they are sized
# for the crystal's effective load capacitance, of which the device
# supports several (XT1 table). AI candidate.
schema_version: "0.2"
kind: circuit
id: ti/msp430fr2355-lfxt
title: MSP430FR2355 32 kHz crystal oscillator
host: ti/MSP430FR2355
source: ti/SLASEC4D

nets: { GND: { kind: ground } }

roles:
  C_XIN:
    requires: { category: capacitor, src: 'p35 "Table 5-3, note 7"' }
    pins:     { "1": host.P2.7/TB0CLK/XIN, "2": GND }
    level:    { value: required, word: required, src: p110 "7.1.2" }
  C_XOUT:
    requires: { category: capacitor, src: 'p35 "Table 5-3, note 7"' }
    pins:     { "1": host.P2.6/MCLK/XOUT, "2": GND }
    level:    { value: required, word: required, src: p110 "7.1.2" }
  X1:
    requires: { category: crystal, frequency: { typ: 32.768 kHz }, src: 'p35 "Table 5-3, fXT1,LF"' }
    pins: { "1": host.P2.7/TB0CLK/XIN, "2": host.P2.6/MCLK/XOUT }
    level: example
    src: p110 "7.1.2"
