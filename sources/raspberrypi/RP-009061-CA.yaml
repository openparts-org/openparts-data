# Raspberry Pi Pico 2 STEP model ("STEP file" on the Pico-series
# documentation page): zip "RP-009061-CA-2-Pico 2 - 3D STEP.zip" with
# rpi_pico2.step (2025-07-22) and LICENSE.txt. Licence: MIT, "Copyright
# (c) 2025 Raspberry Pi Ltd"; the file adds that it may incorporate
# third-party models provided with permission to redistribute, and is
# for guidance only. Raspberry Pi publishes no layout or BOM for the Pico
# 2, so this is the only placement source. Read with a script over the
# STEP assembly tree: each top-level component's product name, placement
# (origin, x axis) and the bounding box of its vertices, in the model's
# frame (board centre, +Y towards USB = the package frame). Pin-1 /
# cathode indicator bodies give IC turns. Only positions, turns and box
# sizes are taken; no geometry is copied, OpenParts generates its own.
