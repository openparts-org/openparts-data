# Real KiCad footprint reference file, used only to source the axial
# lead-forming pitch, which Vishay's own 1N4148 datasheet (see
# vishay/81857) does not state at all -- DO-35's leads are shipped
# straight (25.4mm min per side) and only get a "pitch" once a board
# assembler bends and forms them, so no datasheet states one. This is
# the same "grounded in a real KiCad reference footprint, not invented"
# policy this project has used for every other family's own generator
# defaults (e.g. radial.rs's drill/pad-size constants), applied here to
# a real per-package DATA field instead of a code constant, since pitch
# varies per real package.
